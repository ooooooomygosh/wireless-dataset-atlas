overview: {en: 'TUJI1 is a Wi-Fi fingerprinting dataset for indoor localization, collected with five commercial devices on a fine-grained grid. It pairs IEEE 802.11 received signal strength (RSS) measurements with the coordinates of each fingerprint, and the dataset is anonymized. The authors are Lucie Klus, Roman Klus, Elena Simona Lohan, Jari Nurmi, Carlos Granell Canut, Mikko Valkama, Jukka Talvitie, Sven Casteleyn and Joaquín Torres-Sospedra. The Zenodo record (version 1.0, DOI 10.5281/zenodo.7641701) was published on 14 February 2023 under CC BY 4.0, and the data descriptor appeared in Data in Brief in 2024. The formatted package holds training and testing RSS fingerprints as CSV and MAT files, each with coordinates, plus a device label file. The raw log files are organized by device, and MATLAB scripts convert them into the formatted dataset.', zh: TUJI1 是一个用于室内定位的 Wi-Fi 指纹数据集，使用五款商用设备在细粒度网格上采集。数据集将 IEEE 802.11 接收信号强度（RSS）测量值与每个指纹的坐标配对，且数据经过匿名化处理。作者为 Lucie Klus、Roman Klus、Elena Simona
    Lohan、Jari Nurmi、Carlos Granell Canut、Mikko Valkama、Jukka Talvitie、Sven Casteleyn 和 Joaquín Torres-Sospedra。Zenodo 记录（1.0 版，DOI 10.5281/zenodo.7641701）于 2023 年 2 月 14 日发布，采用 CC BY 4.0 许可；数据描述文章于 2024 年发表于 Data in Brief。格式化数据包以 CSV 和 MAT 文件提供训练集和测试集的 RSS 指纹，每个子集附带坐标，并提供设备标签文件。原始日志文件按设备组织，MATLAB 脚本将其转换为格式化数据集。}
signal_details:
- signal: rssi
  text: {en: 'Wi-Fi received signal strength (RSS) fingerprints in RSS_training.csv, RSS_testing.csv and TUJI1.mat. Each row has 310 columns, one per MAC address observed in the measurements, and missing or zero readings are stored as 100. Coordinates for the training and testing subsets are in Coordinates_training.csv and Coordinates_testing.csv, and device labels are in Device_labels.csv.', zh: Wi-Fi 接收信号强度（RSS）指纹，以 RSS_training.csv、RSS_testing.csv 和 TUJI1.mat 提供。每行有 310 列，对应测量中观测到的每个 MAC 地址；缺失或为零的读数记为 100。训练集和测试集的坐标分别位于 Coordinates_training.csv 与 Coordinates_testing.csv，设备标签位于 Device_labels.csv。}
pipeline:
  summary: {en: 'Raw per-device log files are formatted with MATLAB, then combined from five devices into training and testing sets with coordinates and device labels.', zh: 各设备的原始日志文件先用 MATLAB 格式化，再将五款设备的数据合并为带坐标和设备标签的训练集与测试集。}
  stages:
  - title: {en: Raw log files, zh: 原始日志文件}
    detail: {en: 'Measurements are stored as text log files named logfile_YYYY_MM_DD_HH_MM_SS.txt, in one folder per device under RAW. The package contains raw logs for the device folder AAA only.', zh: 测量数据以文本日志文件保存，文件名为 logfile_YYYY_MM_DD_HH_MM_SS.txt，每个设备一个文件夹，位于 RAW 目录下。本数据包中仅包含设备文件夹 AAA 的原始日志。}
    outputs:
    - {en: logfile_YYYY_MM_DD_HH_MM_SS.txt per device, zh: 每个设备的 logfile_YYYY_MM_DD_HH_MM_SS.txt}
  - title: {en: Per-device formatting, zh: 按设备格式化}
    detail: {en: 'FormatRawData.m is run in MATLAB once for each device, with selected_device set to A12, POCO, S7, S20 or tabS7. It reads each log with readrawfile.m, attaches labels and coordinates from map2coordinates.xlsx, and saves Formatted_data_<device>.mat.', zh: 在 MATLAB 中对每个设备运行一次 FormatRawData.m，将 selected_device 依次设为 A12、POCO、S7、S20 或 tabS7。脚本通过 readrawfile.m 读取日志，从 map2coordinates.xlsx 获取标签和坐标，并保存为 Formatted_data_<设备名>.mat。}
    inputs:
    - {en: Raw log files, zh: 原始日志文件}
    - {en: map2coordinates.xlsx, zh: map2coordinates.xlsx}
    outputs:
    - {en: Formatted_data_<device>.mat, zh: Formatted_data_<设备名>.mat}
  - title: {en: Dataset generation, zh: 数据集生成}
    detail: {en: 'CreateDataset.m loads the formatted files of the five devices. It assigns a random half of the unique test-grid locations (seed 2) to the testing set, adds the other half to the training set, and writes TUJI1.mat, four CSV files with RSS and coordinates, and Device_labels.csv.', zh: CreateDataset.m 读取五款设备的格式化文件。它以随机种子 2 随机选取一半唯一的测试网格位置分配给测试集，另一半加入训练集，并写出 TUJI1.mat、四个含 RSS 和坐标的 CSV 文件以及 Device_labels.csv。}
    inputs:
    - {en: Formatted_data_<device>.mat files, zh: Formatted_data_<设备名>.mat 文件}
    outputs:
    - {en: 'TUJI1.mat, CSV training and testing subsets, Device_labels.csv', zh: TUJI1.mat、训练集和测试集 CSV 文件、Device_labels.csv}
samples: 6752 training and 2147 testing fingerprints
size_gb: 0.59
facts:
- label: {en: Device labels, zh: 设备标签}
  text: {en: 'Device labels 1 to 5 stand for S20, S7, POCO, tabS7 and A12, in that order.', zh: 设备标签 1 至 5 依次对应 S20、S7、POCO、tabS7 和 A12。}
- label: {en: Testing split, zh: 测试划分}
  text: {en: The testing set uses a random half of the unique test-grid locations (seed 2). The remaining test-grid fingerprints are added to training., zh: 测试集使用唯一测试网格位置中随机选取的一半（随机种子 2），其余测试网格指纹加入训练集。}
- label: {en: Raw log content, zh: 原始日志内容}
  text: {en: 'The raw logs also contain other sensor records, which readrawfile.m parses alongside the Wi-Fi entries. The dataset uses only the Wi-Fi measurements.', zh: 原始日志还包含其他传感器记录，readrawfile.m 会与 Wi-Fi 条目一并解析。数据集只使用 Wi-Fi 测量值。}
