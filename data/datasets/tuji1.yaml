summary: {en: 'The dataset contains Wi-Fi RSS fingerprints collected with multiple devices on a high-density measurement grid. Training and testing subsets are provided as CSV and MAT files, with coordinates for each fingerprint.', zh: 该数据集包含多款设备在高密度测量网格上采集的Wi-Fi RSS指纹。训练集和测试集以CSV及MAT文件提供，并附有每个指纹对应的坐标。}
sources: ['https://zenodo.org/records/7641701', 'https://zenodo.org/api/records/7641701', 'https://zenodo.org/records/7641701/files/ReadMe.txt?download=1', 'https://api.crossref.org/works/10.1016/j.dib.2024.110356']
checked: '2026-11-06'
overview: {en: 'TUJI1 is a multi-device Wi-Fi RSS fingerprint dataset for indoor localization, created by Lucie Klus, Roman Klus, Elena Simona Lohan, Jari Nurmi, Carlos Granell Canut, Mikko Valkama, Jukka Talvitie, Sven Casteleyn and Joaquín Torres-Sospedra. The authors are affiliated with Tampere University, Universitat Jaume I and Universidade do Minho. The Zenodo record (version 1.0, DOI 10.5281/zenodo.7641701) was published on 14 February 2023, and the data descriptor appeared in Data in Brief in 2024. The title gives the focus as high measurement density, and the fingerprints were collected with several devices. The formatted package provides training and testing RSS fingerprints as CSV and MAT files, with coordinates for each subset and a device label file. The raw package stores log files per device, and MATLAB scripts convert them into the formatted dataset.', zh: TUJI1 是一个用于室内定位的多设备 Wi-Fi RSS 指纹数据集，作者为 Lucie Klus、Roman Klus、Elena Simona Lohan、Jari Nurmi、Carlos Granell Canut、Mikko
    Valkama、Jukka Talvitie、Sven Casteleyn 和 Joaquín Torres-Sospedra。作者单位包括 Tampere University、Universitat Jaume I 和 Universidade do Minho。Zenodo 记录（1.0 版，DOI 10.5281/zenodo.7641701）发布于 2023 年 2 月 14 日，数据描述文章于 2024 年发表在 Data in Brief。标题强调的是高测量密度，指纹由多款设备采集。格式化数据包提供训练集和测试集的 RSS 指纹，分别以 CSV 和 MAT 格式存储，每个子集都附有坐标，并提供设备标签文件。原始数据包按设备保存日志文件，MATLAB 脚本将其转换为格式化数据集。}
signal_details:
- signal: rssi
  text: {en: 'Wi-Fi received signal strength (RSS) fingerprints in CSV and MAT files: RSS_training.csv, RSS_testing.csv and TUJI1.mat. Coordinates for the training and testing subsets are in Coordinates_training.csv and Coordinates_testing.csv. Device labels are in Device_labels.csv.', zh: Wi-Fi 接收信号强度（RSS）指纹，以 CSV 和 MAT 文件提供：RSS_training.csv、RSS_testing.csv 和 TUJI1.mat。训练集和测试集的坐标分别位于 Coordinates_training.csv 与 Coordinates_testing.csv。设备标签位于 Device_labels.csv。}
pipeline:
  summary: {en: Raw per-device log files are formatted with MATLAB and then assembled into training and testing sets., zh: 各设备的原始日志文件先用 MATLAB 格式化，再组装为训练集和测试集。}
  stages:
  - title: {en: Raw log files, zh: 原始日志文件}
    detail: {en: 'Measurements are stored as text log files named logfile_YYYY_MM_DD_HH_MM_SS.txt, in one folder per device under RAW. The package contains raw logs for the device folder AAA only.', zh: 测量数据以文本日志文件保存，文件名为 logfile_YYYY_MM_DD_HH_MM_SS.txt，每个设备一个文件夹，位于 RAW 目录下。本数据包中仅包含设备文件夹 AAA 的原始日志。}
    outputs:
    - {en: logfile_YYYY_MM_DD_HH_MM_SS.txt per device, zh: 每个设备的 logfile_YYYY_MM_DD_HH_MM_SS.txt}
  - title: {en: Per-device formatting, zh: 按设备格式化}
    detail: {en: FormatRawData.m is run in MATLAB for all devices and reads the raw files with readrawfile.m. The formatted output for device AAA is Formatted_data_AAA.mat., zh: 在 MATLAB 中对所有设备运行 FormatRawData.m，并通过 readrawfile.m 读取原始文件。设备 AAA 的格式化输出为 Formatted_data_AAA.mat。}
    inputs:
    - {en: Raw log files, zh: 原始日志文件}
    outputs:
    - {en: Formatted_data_<device>.mat, zh: Formatted_data_<设备名>.mat}
  - title: {en: Dataset generation, zh: 数据集生成}
    detail: {en: 'CreateDataset.m runs after the formatting step to generate the dataset. The formatted dataset is distributed as TUJI1.mat, and as CSV files for training and testing RSS and coordinates.', zh: CreateDataset.m 在格式化步骤之后运行，用于生成数据集。格式化后的数据集以 TUJI1.mat 发布，并以 CSV 文件提供训练集和测试集的 RSS 与坐标。}
    inputs:
    - {en: Formatted_data_<device>.mat files, zh: Formatted_data_<设备名>.mat 文件}
    outputs:
    - {en: TUJI1.mat and CSV training and testing subsets, zh: TUJI1.mat 以及训练集和测试集 CSV 文件}
