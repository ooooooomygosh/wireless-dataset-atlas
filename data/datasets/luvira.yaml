id: luvira
name: LuViRA Dataset
aliases: [LuViRA, LuMaMi measurements, Lund University Vision, Radio, and Audio dataset]
year: 2023
organization: Lund University
origin: measured
tasks: [localization, multimodal-sensing]
signals: [csi, rgb, depth, imu]
bands_ghz: []
environment: [lab]
mobility: slowly moving service robot (MIR200) with 6DoF motion-capture ground truth
samples: 89 trajectories
format: PNG, MAT, WAV, CSV, TSV, ROS bag
license: CC BY 4.0
access: {url: 'https://github.com/ilaydayaman/LuViRA_Dataset', type: open}
paper: doi:10.1109/icra57147.2024.10610237
used_in: []
citing: ['doi:10.1109/tmlcn.2023.3334712', 'doi:10.1109/icc45041.2023.10278664', 'doi:10.1109/lwc.2026.3702704']
summary: {en: 'Indoor localization recordings with synchronized RGB, depth and IMU data, 5G massive MIMO channel responses between a testbed and user equipment, and 12-microphone audio. The camera, speaker and transmit antenna are mounted on a slowly moving service robot, and the 89 trajectories have 6DoF motion-capture ground truth.', zh: 室内定位测量数据，包含同步的 RGB、深度和 IMU 数据、测试平台与用户设备之间的 5G 大规模 MIMO 信道响应，以及 12 路麦克风音频。相机、扬声器和发射天线安装在缓慢移动的服务机器人上，89 条轨迹均带有 6DoF 动作捕捉真值。}
sources: ['https://github.com/ilaydayaman/LuViRA_Dataset', 'https://arxiv.org/abs/2302.05309', 'https://github.com/ilaydayaman/LuViRA_Dataset/blob/main/LICENSE.txt']
checked: '2026-11-06'
pipeline:
  summary: {en: 'A robot moves while carrying a transmit antenna, camera, and speaker; LuMaMi, microphones, and mocap record together. Data are cropped by trajectory and time-aligned, then released as separate radio, visual, audio, and pose files.', zh: 机器人携带发射天线、相机和speaker运动，LuMaMi、麦克风及mocap共同记录；数据按轨迹裁切和时间对齐后，分别发布无线、视觉、音频与位姿文件。}
  stages:
  - title: {en: Deploy the robot and fixed observation systems, zh: 部署机器人和固定观测系统}
    detail: {en: 'The robot follows indoor trajectories while LuMaMi receives radio signals, vision/audio systems record the scene, and mocap produces pose ground truth. The release contains 89 trajectories of 20–50 s each.', zh: 机器人沿室内轨迹运动，LuMaMi接收无线信号，视觉和音频系统记录场景，mocap产生位姿真值。发布集包含89条20–50 s轨迹。}
    inputs:
    - {en: Indoor robot routes, zh: 室内机器人路线}
    - {en: 'Onboard camera, speaker, and single transmit antenna', zh: 机载相机、speaker和单发射天线}
    - {en: 'LuMaMi, 12 microphones, and mocap', zh: LuMaMi、12麦克风及mocap}
    outputs:
    - {en: Multimodal records of the same robot motion, zh: 同一机器人运动的多模态记录}
    - {en: Trajectory and device identities, zh: 轨迹与设备身份}
    controls:
    - {en: The LuMaMi receive array belongs to one measurement system; use radio parameters to determine frequency, zh: LuMaMi接收阵列属于一个测量系统；无线频率以radio参数为准}
    checks:
    - {en: 'Reproduction check: verify coordinate relationships among the antenna, camera, and mocap rigid body', zh: 复现检查：核对天线、相机和mocap刚体的坐标关系}
  - title: {en: Retain each modality's sampling timeline, zh: 保留各模态采样时序}
    detail: {en: 'Radio is recorded at approximately 100 Hz and RGB at approximately 30 fps; other modalities use their own sampling rates. Image filenames and CSV indices retain actual times, and cross-modal alignment is performed in postprocessing.', zh: 无线约100 Hz、RGB约30 fps，其他模态按各自采样率记录。图像文件名和CSV索引保留实际时间；跨模态数据在后处理中对齐。}
    inputs:
    - {en: 'Radio, image, IMU, audio, and mocap streams', zh: radio、图像、IMU、音频与mocap流}
    outputs:
    - {en: Timelines for each modality, zh: 各模态时间轴}
    - {en: Associated trajectory intervals, zh: 关联轨迹区间}
    controls:
    - {en: Use actual times from each file; matching array indices should not imply matching instants, zh: 按各文件实际时间使用，避免以相同数组下标代表相同时刻}
    checks:
    - {en: 'Reproduction check: inspect sampling intervals, starting offsets, and dropped frames; record interpolation or nearest-neighbor timing error', zh: 复现检查：检查采样间隔、起始偏移和掉帧；记录插值或最近邻的时间误差}
  - title: {en: 'Export radio, visual, and pose data', zh: 导出无线、视觉和位姿}
    detail: {en: 'Radio is stored in MAT as time×frequency×antenna; RGB/depth are released as PNG with CSV time indices, audio as WAV, and position/attitude ground truth as CSV/TSV, with some original rosbags.', zh: 无线以MAT保存time×frequency×antenna视图；RGB/depth以PNG及CSV时间索引发布，音频为WAV，位置/姿态真值为CSV/TSV，另有部分原始rosbag。}
    inputs:
    - {en: Raw records from each system, zh: 各系统原始记录}
    - {en: Trajectory segmentation and alignment results, zh: 轨迹切分和对齐结果}
    outputs:
    - {en: Modality ZIPs and corresponding time indices, zh: 模态ZIP与对应时间索引}
    - {en: 6DOF ground truth, zh: 6DOF真值}
    controls:
    - {en: Most released files have undergone alignment postprocessing; use raw and processed versions separately, zh: 多数发布文件经过对齐后处理，原始与处理后版本分开使用}
    checks:
    - {en: 'Reproduction check: inspect MAT axis order, complex encoding, camera depth units, and pose coordinate systems', zh: 复现检查：检查MAT轴顺序、复数编码、相机深度单位和位姿坐标系}
  - title: {en: Verify trajectory completeness and synchronization, zh: 核对轨迹完整性与同步情况}
    detail: {en: 'The official README describes data organization, postprocessing, and individual acquisition issues, including missing Grid120 data. Check modality completeness for each trajectory before constructing task samples.', zh: 官方README列出数据组织、后处理与个别采集问题，包含Grid120的缺失说明。使用者按轨迹确认各模态是否齐备，再构建任务所需样本。}
    inputs:
    - {en: Public trajectory directory, zh: 公开轨迹目录}
    - {en: README notes on missing data/synchronization, zh: README缺失/同步说明}
    outputs:
    - {en: Available-modality and trajectory inventory, zh: 可用模态和轨迹清单}
    - {en: Missing-record flags, zh: 缺失记录标记}
    controls:
    - {en: 'Use only the time intersection where all required modalities are valid, and retain reasons for exclusion', zh: 仅使用所需模态均有效的时间交集，并保留丢弃原因}
    checks:
    - {en: 'Reproduction check: after alignment, spot-check images, mocap trajectories, and radio changes; do not silently fill missing modalities', zh: 复现检查：对齐后抽查图像、mocap轨迹与无线变化；不要静默填补缺失模态}
  - title: {en: Construct task splits by complete trajectory, zh: 按整条轨迹建立任务划分}
    detail: {en: 'Split localization or fusion experiments by complete trajectory; for cross-region evaluation, also hold out spatial regions. Build radio prediction windows using actual times, recording image-input cutoff times separately from radio-target times.', zh: 定位或融合实验按完整轨迹划分；如果研究跨区域能力，再按空间区域留出。无线预测窗口按实际时间建立，图像输入截止时间与无线目标时间分别记录。}
    inputs:
    - {en: 'Radio CSI, poses, images, and trajectory IDs', zh: 无线CSI、位姿、图像和轨迹ID}
    outputs:
    - {en: Trajectory-level splits, zh: 轨迹级split}
    - {en: Localization/prediction or fusion task samples, zh: 定位/预测或融合任务样本}
    controls:
    - {en: Run radio/position single-modality and simple temporal baselines before adding vision or audio, zh: 先跑无线/位置单模态和简单时序基线，再增加视觉或音频}
    checks:
    - {en: 'Reproduction check: check whether repeated routes or adjacent windows cross splits; fit scale parameters on the training set only', zh: 复现检查：检查同一路线重演与相邻窗口是否跨split；训练集单独拟合尺度参数}
  scope: {en: The official LuViRA dataset of 89 indoor robot trajectories; LuMaMi is the radio acquisition platform., zh: LuViRA官方89条室内机器人轨迹；LuMaMi为无线采集平台。}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: '• MAT radio data in Radio.zip

      • RGB/depth images and time indices

      • Audio, IMU, mocap poses, and some rosbags', zh: '• Radio.zip中的MAT无线数据

      • RGB/depth图像与时间索引

      • 音频、IMU、mocap位姿及部分rosbag'}
- label: {en: Derived outputs, zh: 派生输出}
  text: {en: '• Time-matched model input windows

      • Localization, radio prediction, and cross-modal fusion labels

      • User-defined trajectory/region splits', zh: '• 时间匹配后的模型输入窗口

      • 定位、无线预测和跨模态融合标签

      • 用户定义的轨迹/区域split'}
- label: {en: Reproduction notes, zh: 复现说明}
  text: {en: '• The data chain follows the official README; modality ZIPs were not downloaded and synchronization was not rerun in this audit.

      • Camera depth observations and LiDAR are outputs of different devices; name the actual modality used in each task.', zh: '• 数据链依据官方README；本轮未下载模态ZIP或重做时间同步。

      • 相机深度观测与LiDAR是不同设备输出，任务中按实际模态命名。'}
provenance:
- {en: 'Indoor service robot carrying a camera, speaker, and transmit antenna', zh: 室内服务机器人搭载相机、speaker、发射天线}
- {en: 'Simultaneous vision, Massive MIMO radio, 12-microphone, and mocap acquisition', zh: 视觉、Massive MIMO radio、12麦克风、mocap 同时采集}
- {en: 'Crop and align by trajectory → modality ZIPs, timestamps, and 6DOF ground truth', zh: 按轨迹裁切并对齐 → 模态 ZIP、时间戳和6DOF真值}
technical_notes:
- {en: 'Verified: most released files have undergone time-alignment postprocessing; they are not all raw recordings.', zh: 已确认：发布文件多数经过时间对齐后处理，并非全部原始录制。}
- {en: 'Verified: modality sampling rates differ, and image filenames record actual timestamps.', zh: 已确认：模态采样率不同，图像文件名记录真实时间戳。}
limitations:
- {en: The 89 trajectories in one room are not 89 independent environments., zh: 同一房间的89条轨迹不能算89个独立环境。}
- {en: RGB-D depth maps are not LiDAR; audio channels are not RF radar., zh: RGB-D 深度图不是 LiDAR；音频通道不等于 RF radar。}
- {en: 'Grid120 radio files were removed because LuMaMi and the UE lost synchronization, while other modalities remain. Check modality-specific missing data when joining.', zh: Grid120无线文件因LuMaMi与UE失同步被删除，其他模态保留；join时必须检查逐模态缺失。}
history:
- {en: '2023-02: first preprint release.', zh: 2023-02：预印本首次发布。}
- {en: '2024: accepted at ICRA; paper updated to v3.', zh: 2024：ICRA 接收；论文 v3 更新。}
usage:
- {en: 'Download radio, corresponding ground truth, and required modalities by complete trajectory.', zh: 按完整 trajectory 下载 radio、对应 ground truth 和所需模态。}
- {en: 'The radio README specifies (time, frequency, antenna). The camera, antenna, and speaker each have separate ground-truth trajectories; use rigid-body transforms to unify coordinates.', zh: 'radio README标注(time, frequency, antenna)；相机、天线、speaker各有独立真值轨迹，使用刚体变换统一坐标。'}
- {en: 'Join using each stream''s timestamps, rather than forcing alignment by array index.', zh: 使用各自时间戳 join，不按数组序号强制对齐。}
- {en: 'Fix trajectory splits when comparing radio-only, vision-only, and fusion baselines.', zh: 固定轨迹划分比较 radio-only、vision-only 与融合基线。}
field_notes:
- label: {en: Paths, zh: 路径}
  text: {en: 'This field denotes per-path angles at both ends and interaction records, which the public interface does not provide. Frequency-domain radio CSI can yield PDP/delay-domain representations; this does not provide separated MPC interactions or angle labels at both ends.', zh: 本栏指逐径双端角度/交互记录，公开接口不提供。可由频域radio CSI得到PDP/时延域表示；这不等于提供已分离的MPC交互和双端角度标签。}
- label: {en: Multi-BS, zh: 多基站}
  text: {en: The official structure uses one LuMaMi massive-MIMO receiving system. The antenna axis in MAT files does not represent independent multi-BS protocols or multiple sites., zh: 官方结构是一个LuMaMi massive-MIMO接收系统，MAT的antenna轴不代表独立多BS协议或多个站点。}
paper_summary:
- label: {en: System, zh: 系统}
  text: {en: 'Transforms partial STF-domain CSI into the DDA domain, reconstructing channels with windowed attention and frame-structure encoding; task heads use a frozen encoder.', zh: 部分STF域CSI变换到DDA域，以窗口注意力与帧结构编码恢复信道；冻结编码器接任务头。}
- label: {en: Prediction target, zh: 预测对象}
  text: {en: 'Time/frequency extrapolation, pilot-based channel estimation, sub-6-assisted 28 GHz beam classes, and LoS.', zh: 时间/频率外推、导频信道估计、sub-6辅助28 GHz beam类别与LoS。}
- label: {en: Decision target, zh: 决策目标}
  text: {en: 'Evaluated with NMSE, beam Top-1, and LoS F1; final communication utility is still missing.', zh: 以NMSE、beam Top-1和LoS F1评估；尚缺最终通信效用。}
- label: {en: Protocol, zh: 评估协议}
  text: {en: 'DeepMIMO pretraining uses 18 cities with 4 held out; WAIR-D is split by environment. LuViRA uses 17 trajectories for adaptation and 70 for testing, constituting adaptation to measured data.', zh: DeepMIMO 18城预训练、4城留出；WAIR-D按环境隔离。LuViRA为17条轨迹适配、70条轨迹测试，属于实测适配。}
- label: {en: Key finding, zh: 主要发现}
  text: {en: The paper separates simulation holdouts from LuViRA measurement adaptation; LuViRA results use target-domain training trajectories and therefore represent measured-domain adaptation. Current public HF assets cover only part of the derived test data., zh: 论文将仿真留出与LuViRA实测适配分开；LuViRA结果使用目标域训练轨迹，属于实测域适配。当前公开HF资产只覆盖部分测试派生数据。}
- label: {en: Remaining gap, zh: 尚未解决的问题}
  text: {en: Test NMSE gains against low-order physics-based predictors and final rates; do not infer current public-asset coverage from the paper's 2.85M-sample training corpus., zh: 用低阶物理预测器和最终速率检验NMSE收益；当前公开资产的覆盖范围不能按论文2.85M训练语料规模直接推定。}
overview: {en: 'LuViRA is an indoor localization dataset from Lund University, described in a 2023 arXiv preprint by Yaman et al. and in an ICRA 2024 paper. It contains synchronized color and depth images, IMU readings, 5G massive MIMO channel responses, audio from 12 microphones, and 6DoF pose ground truth. The sensors are mounted on a slowly moving service robot (MIR200) in the motion-capture studio of the Lund University Humanities Lab, and each of the 89 trajectories lasts 20 to 50 seconds. Channel responses were measured with the LuMaMi testbed, a base station with 100 antennas at 3.7 GHz and 20 MHz bandwidth, with a single antenna on the robot as user equipment. The motion-capture ground truth is sampled at 100 Hz, the radio at 100 channel estimates per second, the camera at 30 fps for RGB and 15 fps for depth, and the audio up to 96 kHz. Files are distributed as zip archives per modality: PNG images with timestamp filenames, MAT radio files, WAV audio, CSV and TSV ground truth, and
    a selected set of ROS bags. Most released files are time-aligned, post-processed data rather than raw recordings, the radio data omit trajectory Grid120, and the full raw camera data are available on request. The authors target indoor localization and sensor fusion, and they state that the data also support channel estimation and image classification.', zh: LuViRA 是隆德大学发布的室内定位数据集，由 Yaman 等人在 2023 年的 arXiv 预印本和 ICRA 2024 论文中介绍。数据同步记录彩色图像与深度图像、IMU 读数、5G massive MIMO 信道响应、12 路麦克风音频以及 6DoF 位姿真值。传感器安装在缓慢移动的服务机器人 MIR200 上，该机器人位于隆德大学人文实验室的动作捕捉工作室中，89 条轨迹各持续 20 至 50 秒。信道响应由 LuMaMi 测试平台测得，基站 100 根天线，载频 3.7 GHz，带宽 20 MHz，机器人上的单天线作为用户设备。动作捕捉真值采样率为 100 Hz，无线电每秒 100 次信道估计，相机彩色图像 30 fps、深度图像 15 fps，音频最高 96 kHz。数据按模态分别打包为 zip 压缩包，包含带时间戳文件名的 PNG 图像、MAT 无线电文件、WAV 音频、CSV 与 TSV 真值文件，以及部分 ROS bag。已发布的大部分文件为时间对齐后的处理数据，而非原始记录；无线电数据中不含 Grid120 轨迹；完整的原始相机数据需另行申请。作者面向室内定位与传感器融合，并指出这些数据同样可用于信道估计和图像分类。}
signal_details:
- signal: csi
  text: {en: 'Measured with the LuMaMi 5G massive MIMO testbed. The base station has 100 antennas in a 25×4 layout, and the user equipment on the robot is a single antenna driven by a universal software radio peripheral (NI X310). Carrier 3.7 GHz, bandwidth 20 MHz. The UE sends pilots every 10 ms, and LuMaMi produces 100 channel snapshots per second. Channel estimates are stored as MAT files named like Grid101.mat; the README gives the array shape as 100 × 100 × 100, interpreted as time, frequency and antenna.', zh: 由 LuMaMi 5G massive MIMO 测试平台测得。基站为 100 根天线，排列为 25×4；机器人上的用户设备为单天线，由通用软件无线电外设 (NI X310) 驱动。载频 3.7 GHz，带宽 20 MHz。UE 每 10 ms 发送一次导频，LuMaMi 每秒生成 100 个信道快照。信道估计以 MAT 文件保存，文件名如 Grid101.mat；README 给出的数组形状为 100 × 100 × 100，解释为时间、频率和天线维度。}
- signal: rgb
  text: {en: 'Intel RealSense D435i color camera, 640×480 pixels at 30 fps. Images are PNG files named by NTP-derived timestamps (for example 1651916361.263793945.png), indexed by data.csv in each folder.', zh: Intel RealSense D435i 彩色相机，分辨率 640×480，30 fps。图像为 PNG 文件，文件名为基于 NTP 的时间戳（例如 1651916361.263793945.png），每个文件夹内由 data.csv 索引。}
- signal: depth
  text: {en: 'Depth maps from the Intel RealSense D435i, 640×480 pixels at 15 fps. They are stored as PNG files in the depth/ folder of the RGB-D archives, with timestamps in data.csv and associations.txt.', zh: Intel RealSense D435i 深度图，分辨率 640×480，15 fps。以 PNG 文件保存于 RGB-D 压缩包的 depth/ 文件夹中，时间戳记录于 data.csv 与 associations.txt。}
- signal: imu
  text: {en: 'Built-in IMU of the RealSense D435i: gyroscope at 400 Hz and accelerometer at 100 Hz. The paper lists these readings in ROS bag (.bag) files, of which only a selected set is released.', zh: RealSense D435i 内置 IMU：陀螺仪 400 Hz，加速度计 100 Hz。论文将这些读数列为 ROS bag (.bag) 文件，但仅发布其中部分文件。}
