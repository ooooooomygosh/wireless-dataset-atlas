checked: '2026-11-06'
overview: {en: 'ESP32S2 FTM Measurements is a measured dataset of Wi-Fi fine time measurement (FTM, IEEE 802.11mc) ranging from ESP32-S2 devices. Valentín Barral at the University of A Coruña produced it, and it was published on IEEE DataPort in 2021. The measurements were taken in an indoor showroom and on an outdoor campus area with ESP32-S2-Saola-1 boards. Each FTM frame records RSSI and round-trip time (RTT) together with four timestamps, and each measurement is paired with the true distance between the devices. The data come as rosbag directories (AC, Indoor, Outdoor) and as one MATLAB .mat file with four structs (indoor, outdoor20, outdoor40, sa). The archive ESP32S2FTM.zip is 2.97 MB. The associated paper, Fine Time Measurement for the Internet of Things: A Practical Approach Using ESP32, analyzes this FTM implementation and proposes a machine-learning distance estimator that runs on the ESP32.', zh: 'ESP32S2 FTM Measurements 是 ESP32-S2 设备 Wi-Fi 精细时间测量（FTM，IEEE 802.11mc）测距的实测数据集。数据由
    University of A Coruña 的 Valentín Barral 制作，2021 年发布于 IEEE DataPort。测量分别在室内展厅和户外校园区域进行，使用 ESP32-S2-Saola-1 开发板。每个 FTM 帧记录 RSSI 与往返时间（RTT）以及四个时间戳，每次测量与设备之间的真实距离配对。数据以 rosbag 目录（AC、Indoor、Outdoor）和一个包含四个结构体（indoor、outdoor20、outdoor40、sa）的 MATLAB .mat 文件提供。压缩包 ESP32S2FTM.zip 大小为 2.97 MB。对应论文 Fine Time Measurement for the Internet of Things: A Practical Approach Using ESP32 分析了该 FTM 实现，并提出一种可在 ESP32 上运行的机器学习距离估计方法。'}
signal_details:
- signal: rssi
  text: {en: 'Per-frame RSSI in dBm, stored with the FTM round-trip time (RTT) of each frame. RTT values are in nanoseconds, and the frame timestamps t1 to t4 are in picoseconds.', zh: 每帧 RSSI，单位 dBm，与每帧的 FTM 往返时间（RTT）一同保存。RTT 值的单位为纳秒，每帧时间戳 t1 至 t4 的单位为皮秒。}
pipeline:
  summary: {en: 'ESP32-S2 devices run FTM ranging over Wi-Fi, the results are logged as ROS messages, and a MATLAB export produces one .mat file with four structs.', zh: ESP32-S2 设备通过 Wi-Fi 执行 FTM 测距，结果以 ROS 消息记录，再导出为包含四个结构体的一个 MATLAB .mat 文件。}
  stages:
  - title: {en: FTM ranging on ESP32-S2, zh: ESP32-S2 FTM 测距}
    detail: {en: ESP32-S2-Saola-1 development boards run Wi-Fi FTM (IEEE 802.11mc) ranging in indoor and outdoor scenarios. The firmware provides an RTT estimate and a distance estimate., zh: ESP32-S2-Saola-1 开发板在室内和室外场景中运行 Wi-Fi FTM（IEEE 802.11mc）测距。固件提供 RTT 估计值和距离估计值。}
    inputs:
    - {en: Wi-Fi FTM exchanges between devices, zh: 设备之间的 Wi-Fi FTM 交互}
    outputs:
    - {en: RTT and distance estimates, zh: RTT 与距离估计值}
  - title: {en: ROS message logging, zh: ROS 消息记录}
    detail: {en: 'Each ranging result is logged as an ESP32S2FTMRanging or ESP32S2FTMRangingExtra message. Both carry anchorId, rtt_raw, rtt_est, dist_est, num_frames and a list of frames, where each frame holds rssi, rtt and timestamps t1 to t4. The message definitions are in the rosmsgs repository on GitHub.', zh: 每条测距结果以 ESP32S2FTMRanging 或 ESP32S2FTMRangingExtra 消息记录。两者均包含 anchorId、rtt_raw、rtt_est、dist_est、num_frames 和 frames 列表，每一帧包含 rssi、rtt 以及时间戳 t1 至 t4。消息定义位于 GitHub 上的 rosmsgs 仓库中。}
    inputs:
    - {en: ranging results, zh: 测距结果}
    outputs:
    - {en: 'rosbag directories AC, Indoor and Outdoor', zh: rosbag 目录 AC、Indoor 和 Outdoor}
  - title: {en: MATLAB export, zh: MATLAB 导出}
    detail: {en: 'The data are exported to one .mat file with four 1x1 structs: indoor, outdoor20, outdoor40 and sa. Each struct holds the true distance (actualDist), the averaged raw RTT with its mean, variance and count, mean RSSI, and a distance estimate from the author''s own algorithm (distEst).', zh: 数据导出为一个 .mat 文件，包含四个 1x1 结构体：indoor、outdoor20、outdoor40 和 sa。每个结构体包含真实距离（actualDist）、按帧平均的原始 RTT 及其均值、方差和计数、平均 RSSI，以及作者算法给出的距离估计（distEst）。}
    inputs:
    - {en: ranging measurements, zh: 测距测量数据}
    outputs:
    - {en: one .mat file, zh: 一个 .mat 文件}
size_gb: 0.00297
facts:
- label: {en: Indoor campaign, zh: 室内测量}
  text: {en: 'Four ESP32-S2 beacons were placed at the corners of a 12 m by 6 m showroom, and a tag was moved along a straight line at 2 m height. Each position was measured for 180 s at 40 MHz bandwidth.', zh: 四个 ESP32-S2 信标放置在 12 m × 6 m 展厅的四角，标签沿一条直线移动，高度为 2 m。每个位置测量 180 秒，带宽为 40 MHz。}
- label: {en: Outdoor campaign, zh: 室外测量}
  text: {en: 'Two modules on tripods at 1.75 m height were placed 1 m to 20 m apart in 1 m steps, with 120 s per distance. The paper describes outdoor datasets at 20 MHz and 40 MHz bandwidth.', zh: 两个安装在三脚架上、高度为 1.75 m 的模块以 1 m 为步长、相距 1 m 至 20 m 放置，每个距离测量 120 秒。论文描述了 20 MHz 和 40 MHz 带宽的室外数据集。}
- label: {en: Train and test split, zh: 训练与测试划分}
  text: {en: The paper randomly assigns about 70% of the samples of each dataset to training and keeps the rest for testing. A separate test scenario in a research building is used to evaluate models trained on the other datasets., zh: 论文将每个数据集约 70% 的样本随机划分为训练集，其余作为测试集。另有一个在研究楼中采集的测试场景，用于评估在其他数据集上训练的模型。}
- label: {en: Companion code, zh: 配套代码}
  text: {en: 'Code is on GitHub under the valentinbarral account in the repositories esp32s2-ftm-tag, esp32s2-ftm-anchor, rosftm and rosmsgs, released under an open source license.', zh: 代码位于 GitHub 账户 valentinbarral 下的 esp32s2-ftm-tag、esp32s2-ftm-anchor、rosftm 和 rosmsgs 仓库中，采用开源许可发布。}
limitations:
- {en: 'On the ESP32-S2, FTM operates only in the 2.4 GHz Wi-Fi band, which restricts the bandwidth to 20 MHz or 40 MHz and limits ranging accuracy.', zh: 在 ESP32-S2 上，FTM 仅能在 2.4 GHz Wi-Fi 频段工作，带宽限制为 20 MHz 或 40 MHz，从而限制测距精度。}
