summary: {en: 'Wi-Fi fine timing measurement (FTM) round-trip time and RSSI values from ESP32-S2 devices in indoor and outdoor environments, paired with the true distance between devices. Data are provided as rosbag and MATLAB .mat files.', zh: ESP32-S2 设备在室内和室外环境中测得的 Wi-Fi 精细时间测量（FTM）往返时间与 RSSI 数值，并附有设备之间的真实距离。数据以 rosbag 和 MATLAB .mat 文件提供。}
