id: sionna-rt
name: Sionna RT
year: 2023
organization: NVIDIA
origin: ray-tracing
tasks: [channel-modeling, radio-map]
signals: [paths, cir, pathloss]
bands_ghz: []
environment: [outdoor-urban]
license: Apache-2.0
access: {url: 'https://github.com/NVlabs/sionna-rt', type: open}
code: ['https://github.com/NVlabs/sionna-rt']
paper: arxiv:2303.11103
used_in: ['doi:10.1109/tap.2024.3451214', 'doi:10.1109/infocom59046.2026.11571503']
citing: ['doi:10.1109/tmlcn.2024.3474639', 'doi:10.1109/mcom.001.2400086', 'doi:10.1109/tmlcn.2024.3448391']
summary: {en: 'A differentiable ray tracing generator that computes propagation paths, channel impulse responses and coverage maps (path gain in dB) for scenes, including the integrated Munich and Etoile scenes.', zh: 可微分射线追踪生成器，用于计算场景中的传播路径、信道冲激响应和覆盖图（路径增益，单位 dB），内置场景包括 Munich 和 Etoile。}
sources: ['https://github.com/NVlabs/sionna-rt', 'https://arxiv.org/abs/2303.11103', 'https://arxiv.org/html/2303.11103v2', 'https://raw.githubusercontent.com/NVlabs/sionna-rt/main/README.md', 'https://raw.githubusercontent.com/NVlabs/sionna-rt/main/LICENSE', 'https://api.github.com/repos/NVlabs/sionna-rt/releases', 'https://api.github.com/repos/NVlabs/sionna-rt/git/trees/HEAD?recursive=1', 'https://raw.githubusercontent.com/NVlabs/sionna-rt/v2.2.0/src/sionna/rt/path_solvers/path_solver.py', 'https://raw.githubusercontent.com/NVlabs/sionna-rt/v2.2.0/src/sionna/rt/path_solvers/paths.py', 'https://raw.githubusercontent.com/NVlabs/sionna-rt/v2.2.0/src/sionna/rt/scene.py', 'https://raw.githubusercontent.com/NVlabs/sionna-rt/v2.2.0/src/sionna/rt/radio_map_solvers/radio_map.py', 'https://raw.githubusercontent.com/NVlabs/sionna-rt/v2.2.0/src/sionna/rt/scene_object.py', 'https://pypi.org/pypi/sionna-rt/json', 'https://github.com/NVlabs/sionna-rt/releases', 'https://github.com/NVlabs/sionna-rt/releases?page=2',
  'https://github.com/NVlabs/sionna-rt/releases/tag/v1.0.0', 'https://github.com/NVlabs/sionna-rt/tags', 'https://github.com/NVlabs/sionna-rt/tags?after=v1.0.1', 'https://github.com/NVlabs/sionna-rt/tree/v2.2.0/src/sionna/rt', 'https://github.com/NVlabs/sionna-rt/tree/v2.2.0/src/sionna/rt/scenes', 'https://raw.githubusercontent.com/NVlabs/sionna-rt/v2.2.0/src/sionna/rt/antenna_array.py', 'https://raw.githubusercontent.com/NVlabs/sionna-rt/v2.2.0/src/sionna/rt/antenna_pattern.py', 'https://raw.githubusercontent.com/NVlabs/sionna-rt/v2.2.0/src/sionna/rt/renderer.py', 'https://nvlabs.github.io/sionna/rt/api/paths.html', 'https://nvlabs.github.io/sionna/rt/api/scene.html']
checked: '2026-11-06'
pipeline:
  summary: {en: 'Set the scene, radio materials and devices before running a solver. PathSolver output can be converted to CIR or CFR, RadioMapSolver produces radio maps, and camera rendering or geometric scans use separate configurations on the same scene.', zh: 在运行求解器之前先设定场景、无线材料与设备。PathSolver 的输出可转换为 CIR 或 CFR，RadioMapSolver 生成无线地图；相机渲染或几何扫描则在同一场景上使用各自的配置。}
  stages:
  - title: {en: Load the scene, zh: 加载场景}
    detail: {en: load_scene reads a Mitsuba 3 XML scene or one of the built-in scenes such as munich and etoile. Setting scene.frequency sets the carrier frequency and updates the frequency-dependent parameters of all radio materials., zh: load_scene 读取 Mitsuba 3 XML 场景或内置场景（如 munich、etoile）。设置 scene.frequency 会设定载频，并更新所有无线材料的频率相关参数。}
    inputs:
    - {en: Mitsuba 3 XML scene file or a built-in scene name, zh: Mitsuba 3 XML 场景文件或内置场景名}
    outputs:
    - {en: Scene object; scene.mi_scene gives the underlying Mitsuba scene, zh: Scene 对象；scene.mi_scene 提供底层 Mitsuba 场景}
    controls:
    - {en: merge_shapes decides whether shapes that share a radio material are merged at load time., zh: merge_shapes 决定加载时是否合并共享同一无线材料的形状。}
  - title: {en: 'Assign radio materials, arrays and devices', zh: 设置无线材料、阵列与设备}
    detail: {en: 'Radio materials carry frequency-dependent electromagnetic parameters, and ITU-defined materials are included. Transmitters and receivers carry antenna arrays whose element positions are given in wavelengths, so changing the carrier frequency while keeping those values changes the physical aperture in metres.', zh: 无线材料带有随频率变化的电磁参数，包括 ITU 定义的材料。发射机与接收机携带天线阵列，阵元位置以波长为单位给出，因此在保持这些数值的情况下改变载频，会改变以米计的实际孔径。}
    inputs:
    - {en: Scene objects with radio material assignments, zh: 带无线材料指派的场景对象}
    - {en: 'Carrier frequency, device positions and orientations', zh: 载频、设备位置与朝向}
    outputs:
    - {en: Configured scene for the solvers, zh: 供求解器使用的已配置场景}
    controls:
    - {en: Changing scene.frequency does not recompute existing Paths; run PathSolver again after the change., zh: 改变 scene.frequency 不会重算已有的 Paths；改动后需重新运行 PathSolver。}
  - title: {en: Solve propagation paths, zh: 求解传播路径}
    detail: {en: 'PathSolver runs candidate generation, the image method and field-coefficient calculation, and then builds a Paths object. Its switches include los, refraction (thin-slab transmission, on by default), diffraction (first-order edge and wedge, off by default), edge_diffraction, max_depth (default 3), samples_per_src (default 1,000,000) and seed (default 42).', zh: 'PathSolver 依次执行候选路径生成、镜像法求解与场系数计算，然后构造 Paths 对象。可设置的开关包括 los、refraction（薄片透射，默认开启）、diffraction（一阶 edge 与 wedge，默认关闭）、edge_diffraction、max_depth（默认 3）、samples_per_src（默认 1,000,000）与 seed（默认 42）。'}
    inputs:
    - {en: Configured Scene, zh: 已配置的 Scene}
    - {en: 'PathSolver switches, max_depth and the sampling budget', zh: PathSolver 开关、max_depth 与采样预算}
    outputs:
    - {en: 'Paths with coefficients, delays, angles and Doppler shifts', zh: 包含系数、时延、角度与多普勒频移的 Paths}
    controls:
    - {en: synthetic_array=True (default) makes each device one geometric endpoint; synthetic_array=False traces every element., zh: synthetic_array=True（默认）将每个设备视为一个几何端点；synthetic_array=False 则追踪每个阵元。}
    - {en: 'The thin-slab model applies the material thickness to the field, and rays are not deflected at the surface.', zh: 薄片模型按材料厚度修正场，射线在表面处不发生角度偏折。}
  - title: {en: 'Derive CIR, CFR and time evolution', zh: 推导 CIR、CFR 与时间演化}
    detail: {en: 'Paths.cir returns the baseband CIR, and sampling_frequency with num_time_steps adds Doppler-driven time steps. Paths.cfr evaluates the frequency response at the requested frequencies, and calling it again with other frequencies reuses the existing Paths.', zh: Paths.cir 返回基带 CIR，sampling_frequency 与 num_time_steps 加入由多普勒驱动的时间步。Paths.cfr 在所需频率上计算频率响应，以其他频率再次调用时复用已有的 Paths。}
    inputs:
    - {en: 'Paths and the requested frequencies, sampling frequency or time steps', zh: Paths 以及所需频率、采样频率或时间步数}
    outputs:
    - {en: Complex CIR and CFR arrays, zh: 复数 CIR 与 CFR 数组}
    controls:
    - {en: Object velocity sets the Doppler shifts; changing object position or orientation changes the geometry and needs a new solve., zh: 对象速度决定多普勒频移；改变对象位置或朝向会改变几何，需要重新求解。}
    - {en: normalize_delays aligns the first path between each antenna pair to zero delay; normalize scales the channel to unit average energy., zh: normalize_delays 使每对天线间的首条路径时延对齐为零；normalize 将信道缩放为单位平均能量。}
  - title: {en: Compute radio maps and sensing responses, zh: 计算无线地图与感知响应}
    detail: {en: 'RadioMapSolver computes a RadioMap over a planar grid or a mesh, with path gain on a linear scale. Version 2.2.0 adds RCSSolver, which computes the paths from transmitters to receivers through the scattering points of sensing targets, including Doppler from target motion. Scene.render_to_file renders the current view to an image as a separate branch.', zh: RadioMapSolver 在平面网格或网格面上计算 RadioMap，其 path_gain 为线性尺度。2.2.0 版新增 RCSSolver，计算从发射机经感知目标散射点到接收机的路径，并包含目标运动产生的多普勒。Scene.render_to_file 作为独立分支，将当前视图渲染为图像。}
    inputs:
    - {en: 'Scene, transmitters, and a radio map grid or mesh', zh: 场景、发射机与无线地图网格或网格面}
    - {en: Sensing targets for RCSSolver, zh: 供 RCSSolver 使用的感知目标}
    outputs:
    - {en: RadioMap with path gain; sensing paths that can be combined with background paths using Paths.concat, zh: 包含路径增益的 RadioMap；可通过 Paths.concat 与背景路径合并的感知路径}
facts:
- label: {en: Entry inputs, zh: 入口输入}
  text: {en: '• A Mitsuba 3 XML scene or built-in scene; radio materials; transmitter and receiver devices with positions, orientations and arrays; PathSolver switches, max_depth and samples_per_src.', zh: • Mitsuba 3 XML 场景或内置场景；无线材料；带位置、朝向与阵列的发射机和接收机设备；PathSolver 开关、max_depth 与 samples_per_src。}
- label: {en: Physical model, zh: 物理模型}
  text: {en: '• PathSolver supports line of sight, specular and diffuse reflection, refraction through thin slabs, and first-order edge and wedge diffraction, subject to its switches.


      • The thin-slab model does not deflect rays and includes the material thickness in the field coefficients.', zh: '• PathSolver 支持视距、镜面与漫反射、薄片透射，以及一阶 edge 与 wedge 绕射，具体由开关决定。


      • 薄片模型不使射线偏折，并将材料厚度纳入场系数。'}
- label: {en: Changing the carrier, zh: 改变载频}
  text: {en: '• Changing scene.frequency updates the frequency-dependent parameters of all radio materials. Existing Paths keep the frequency at which they were solved, so PathSolver must be run again.', zh: • 改变 scene.frequency 会更新所有无线材料的频率相关参数。已有的 Paths 保留求解时的频率，因此需要重新运行 PathSolver。}
- label: {en: Time, zh: 时间}
  text: {en: • One PathSolver call describes one geometry snapshot. sampling_frequency and num_time_steps add Doppler-driven phase evolution to those paths and do not retrace delays or visibility over time., zh: • 一次 PathSolver 调用描述一个几何快照。sampling_frequency 与 num_time_steps 只为这些路径加入由多普勒驱动的相位演化，不会随时间重新追踪时延或可见性。}
- label: {en: Cost drivers, zh: 成本来源}
  text: {en: '• Geometry complexity, endpoint counts, samples_per_src, max_depth and the enabled interaction types all affect path solving. Disabling synthetic_array makes every element a tracing endpoint.', zh: • 几何复杂度、端点数、samples_per_src、max_depth 与启用的交互类型都会影响路径求解。关闭 synthetic_array 会使每个阵元成为追踪端点。}
- label: {en: Native outputs, zh: 原生输出}
  text: {en: • Paths with generated CIR and CFR arrays; RadioMapSolver outputs; RCS results from RCSSolver in v2.2.0., zh: • Paths 及生成的 CIR 与 CFR 数组；RadioMapSolver 输出；2.2.0 版 RCSSolver 的 RCS 结果。}
provenance:
- {en: Scene mesh + materials + antennas + device poses, zh: 场景 mesh + 材料 + 天线 + 设备位姿}
- {en: Explicit PathSolver / RadioMapSolver / RCSSolver configuration, zh: 显式 PathSolver / RadioMapSolver / RCSSolver 配置}
- {en: Path search and electromagnetic-coefficient computation, zh: 路径搜索与电磁系数计算}
- {en: CIR/CFR and radio maps, zh: CIR/CFR 与无线地图}
- {en: 'Array synthesis, baseband reception, or sensing processing', zh: 阵列合成、基带接收或感知处理}
- {en: Derived decision labels, zh: 派生决策标签}
technical_notes:
- {en: 'Version 1.0.0 (2025-04-08) rewrote RT with Dr.Jit and Mitsuba 3 and replaced compute_paths and coverage_map with PathSolver and RadioMapSolver. Its release notes said diffraction and RIS would be added later, and that users needing them should stay on the 0.19 release.', zh: 1.0.0 版（2025-04-08）以 Dr.Jit 与 Mitsuba 3 重写 RT，并以 PathSolver 与 RadioMapSolver 取代 compute_paths 与 coverage_map。其发布说明称绕射与 RIS 将在后续版本加入，需要这些功能的用户应继续使用 0.19 版。}
- {en: Diffraction for paths and radio maps arrived in v1.2.0 (2025-09-19). v2.1.0 (2026-09-09) added deterministic path generation and made radio-map diffraction deterministic., zh: 路径与无线地图的绕射功能在 v1.2.0（2025-09-19）加入。v2.1.0（2026-09-09）加入了确定性路径生成，并使无线地图绕射具有确定性。}
- {en: 'Version 2.2.0 (2026-09-29) adds the RCS module, with RCSSolver, SensingTarget and Paths.concat.', zh: 2.2.0 版（2026-09-29）新增 RCS 模块，包括 RCSSolver、SensingTarget 与 Paths.concat。}
- {en: 'The version history is not monotonic: diffraction was in the 0.19 release, absent in 1.0.0, and returned in 1.2.0.', zh: 版本功能并非单调增加：绕射在 0.19 版中存在，在 1.0.0 中缺失，在 1.2.0 中恢复。}
- {en: 'The 2023 paper uses compute_paths and coverage_map; those names do not exist in the v2.2.0 source, so its API details do not apply to v2.2.0.', zh: 2023 年论文使用 compute_paths 与 coverage_map；这些名称在 v2.2.0 源码中已不存在，因此论文中的 API 细节不适用于 v2.2.0。}
limitations:
- {en: 'Releases change dependencies and defaults; v2.1.0 moved to Mitsuba 3.9.1 and Dr.Jit 1.5.0, so results depend on the exact versions used.', zh: 各版本会改变依赖与默认值；v2.1.0 升级到 Mitsuba 3.9.1 与 Dr.Jit 1.5.0，因此结果取决于所用的确切版本。}
- {en: The 2023 paper's material experiment uses synthetic targets generated by the same ray tracer and considers only specular reflections; it does not use measurements., zh: 2023 年论文的材料实验使用同一射线追踪器生成的合成目标，且只考虑镜面反射，并未使用实测数据。}
- {en: 'The paper states that training on channel frequency responses is unlikely to work well with measured data, because ray tracing rarely predicts accurate phase.', zh: 论文指出，基于信道频率响应的训练在实测数据上可能效果不佳，因为射线追踪很难准确预测相位。}
history:
- {en: 'Sionna v0.14 integrates the differentiable ray tracer, as stated in arXiv 2303.11103 (submitted 2023-03-20).', zh: Sionna v0.14 集成了可微分射线追踪器，见 arXiv 2303.11103（提交于 2023-03-20）。}
- {en: '2025-04-08: sionna-rt v1.0.0 released; RT rewritten with Dr.Jit and Mitsuba 3 as a stand-alone package.', zh: 2025-04-08：sionna-rt v1.0.0 发布；RT 以 Dr.Jit 与 Mitsuba 3 重写，成为独立包。}
- {en: '2025-09-19: v1.2.0 adds diffraction for paths and radio maps.', zh: 2025-09-19：v1.2.0 加入路径与无线地图的绕射。}
- {en: '2026-09-09: v2.1.0 adds the Metal backend and deterministic path generation.', zh: 2026-09-09：v2.1.0 加入 Metal 后端与确定性路径生成。}
- {en: '2026-09-29: v2.2.0 adds the RCS module.', zh: 2026-09-29：v2.2.0 加入 RCS 模块。}
usage:
- {en: Install a pinned sionna-rt version in its own environment; the README recommends pip install sionna-rt., zh: 在独立环境中安装固定版本的 sionna-rt；README 推荐使用 pip install sionna-rt。}
- {en: 'Load a scene with load_scene, then set the frequency, radio materials, and Tx/Rx arrays and poses.', zh: 用 load_scene 加载场景，然后设置频率、无线材料，以及 Tx/Rx 阵列与位姿。}
- {en: 'Set los, refraction, diffraction, max_depth, samples_per_src and seed explicitly before running PathSolver; the defaults are diffraction=False and synthetic_array=True.', zh: 运行 PathSolver 前显式设置 los、refraction、diffraction、max_depth、samples_per_src 与 seed；默认值为 diffraction=False 且 synthetic_array=True。}
- {en: The documentation includes tutorials for diffraction (v1.2.0 notes) and RCS (v2.2.0 notes)., zh: 文档包含绕射（v1.2.0 发布说明）与 RCS（v2.2.0 发布说明）的教程。}
field_notes:
- label: {en: LiDAR, zh: LiDAR}
  text: {en: 'Geometric scans can cast rays into Scene.mi_scene, using the same Mitsuba ray_intersect call that Sionna''s radio map solver uses. The user must define sensor pose, ray directions and range. Such scans are separate from PathSolver RF paths.', zh: 几何扫描可向 Scene.mi_scene 投射射线，使用的是 Sionna 无线地图求解器同样调用的 Mitsuba ray_intersect。用户需定义传感器位姿、射线方向与量程。这类扫描与 PathSolver 的射频路径相互独立。}
paper_summary:
- label: {en: System, zh: 系统}
  text: {en: 'Mitsuba geometry and ray intersections, combined with wireless-field propagation and differentiable CIR computation.', zh: Mitsuba几何与射线求交，加无线场传播与可微CIR计算。}
- label: {en: Prediction target, zh: 预测对象}
  text: {en: Examples fit material parameters to generated CFR and separately optimize transmit-array orientation., zh: 示例以生成的CFR拟合材料参数；另优化发射阵列朝向。}
- label: {en: Decision target, zh: 决策目标}
  text: {en: Material calibration and regional received-power optimization., zh: 材料校准与区域接收功率优化。}
- label: {en: Protocol, zh: 评估协议}
  text: {en: 'Sec. II and Listings 1–3 demonstrate scenes, devices, paths, and CIR; Sec. III recovers materials using target channels generated by the same engine.', zh: Sec.II和Listings 1–3展示场景、设备、路径与CIR；Sec.III用同引擎生成的目标信道进行材料恢复。}
- label: {en: Key finding, zh: 主要发现}
  text: {en: 'Clearly distinguishes per-element RT from the synthetic-array plane-wave approximation, and path computation from short-term Doppler evolution.', zh: 明确区分逐阵元RT与synthetic-array平面波近似，以及路径计算和短时Doppler演化。}
- label: {en: Remaining gap, zh: 尚未解决的问题}
  text: {en: The 2023 paper uses an older interface generation; use current source code for v2.2 mechanisms and APIs. Recovery from synthetic targets still needs measurement-based calibration to support real deployment., zh: 2023论文接口属于旧代；v2.2机制和API以当前源码为准。合成目标恢复实验还需实测校准来支持现实部署。}
materials:
- {title: Sionna RT v2.2.0 official installation and development entry point, path: /materials/official/sionna-rt/README.md, license: Apache-2.0, source_url: 'https://github.com/NVlabs/sionna-rt/blob/v2.2.0/README.md'}
tutorials: [sionna, sionna-lidar]
tools: [project-scenebaker, project-mitsuba-blender, project-open3d-raycasting, project-deepmimo-sionna-bridge]
overview: {en: 'Sionna RT is the stand-alone ray tracing package of NVIDIA''s Sionna library, released under Apache-2.0 and built on Mitsuba 3. The repository states that it works with TensorFlow, PyTorch and JAX, and recommends installing it with pip install sionna-rt. It is software rather than a downloadable dataset. A user loads a 3D scene with radio materials and transmitter and receiver devices, runs PathSolver to obtain propagation paths, and derives channel impulse responses and frequency responses from those paths. RadioMapSolver computes radio maps whose path gain is stored on a linear scale. Version 2.2.0 includes built-in scenes such as munich and etoile. The 2023 paper, which describes an earlier interface, fitted radio material parameters to 400 CIRs that the same ray tracer generated for 400 receivers in the etoile scene, using an OFDM system with 128 subcarriers spaced 30 kHz apart and specular reflections only.', zh: Sionna RT 是 NVIDIA Sionna 库中独立的射线追踪包，采用 Apache-2.0 许可，基于
    Mitsuba 3 构建。仓库说明其可与 TensorFlow、PyTorch 和 JAX 配合使用，并推荐通过 pip install sionna-rt 安装。它是软件，而非可直接下载的数据集。用户加载包含无线材料以及发射机、接收机设备的三维场景后，运行 PathSolver 得到传播路径，再由这些路径推导信道冲激响应与频率响应。RadioMapSolver 计算无线地图，其路径增益以线性尺度存储。2.2.0 版包含 munich、etoile 等内置场景。2023 年论文描述的是更早的接口，它以同一射线追踪器为 etoile 场景中 400 个接收机生成的 400 条 CIR 拟合无线材料参数，使用 128 个子载波、间隔 30 kHz 的 OFDM 系统，且仅考虑镜面反射。}
signal_details:
- signal: paths
  text: {en: 'PathSolver returns Paths for the scene''s transmitters and receivers, with coefficients, delays, departure and arrival angles, and Doppler shifts. With synthetic_array=True (default), each array is represented by its centre and element phases are applied under a plane-wave assumption; with synthetic_array=False, paths are traced for every element. The 2023 paper computes reflections with the image method, using either an exhaustive search or a heuristic that shoots rays along a Fibonacci lattice on a sphere.', zh: PathSolver 为场景中的发射机与接收机返回 Paths，包含系数、时延、出发角与到达角以及多普勒频移。synthetic_array=True（默认）时，每个阵列以其中心表示，阵元相位按平面波假设施加；synthetic_array=False 时，为每个阵元追踪路径。2023 年论文以镜像法计算反射，搜索方式为穷举搜索，或基于球面 Fibonacci 格点发射射线的启发式方法。}
- signal: cir
  text: {en: Paths.cir() returns the baseband-equivalent channel impulse response built from the path coefficients and delays. sampling_frequency and num_time_steps add time evolution from the per-path Doppler shifts. Paths.cfr() evaluates the channel frequency response at requested frequencies., zh: Paths.cir() 由路径系数与时延返回基带等效信道冲激响应。sampling_frequency 与 num_time_steps 基于各路径的多普勒频移加入时间演化。Paths.cfr() 在指定频率上计算信道频率响应。}
- signal: pathloss
  text: {en: RadioMapSolver computes a RadioMap whose path_gain is on a linear scale; dB values are used for thresholds and plots. The 2023 paper calls the map a coverage map and shows path gain in dB., zh: RadioMapSolver 计算 RadioMap，其 path_gain 为线性尺度；dB 值用于阈值与绘图。2023 年论文称其为 coverage map，并以 dB 显示路径增益。}
capabilities:
- key: csi
  status: simulate
  note: {en: Complex frequency response computed by Paths.cfr() from a PathSolver run; per-antenna responses use synthetic or non-synthetic arrays., zh: 由 PathSolver 运行结果经 Paths.cfr() 计算的复数频率响应；单天线响应取决于合成阵列或非合成阵列设置。}
- key: cir
  status: simulate
  note: {en: 'Time-domain taps from Paths.cir(), with Doppler phase when time steps are set.', zh: 由 Paths.cir() 给出时域抽头，设置时间步后包含多普勒相位。}
- key: paths
  status: simulate
  note: {en: 'Per-path coefficient, delay, departure and arrival angles and Doppler are returned by the Paths object.', zh: Paths 对象返回每条路径的系数、时延、离开角与到达角以及多普勒频移。}
- key: interaction
  status: simulate
  note: {en: Interaction type and interaction vertices per path are returned by Paths.interactions and Paths.vertices., zh: 每条路径的交互类型与交互点坐标由 Paths.interactions 与 Paths.vertices 返回。}
- key: power
  status: simulate
  note: {en: 'Path gain, RSS and SINR maps come from RadioMapSolver in dB and dBm.', zh: 路径增益、RSS 与 SINR 地图由 RadioMapSolver 输出，单位为 dB 与 dBm。}
- {key: iq, status: unknown}
- key: beam_labels
  status: simulate
  note: {en: The package has no codebook or beam-label output; labels need user code applied to a PathSolver run., zh: 软件包不提供码本或波束标签输出；标签需在 PathSolver 运行结果上由用户代码生成。}
- key: position
  status: simulate
  note: {en: Transmitter and receiver positions are run inputs; no trajectories or GPS records are shipped., zh: 发射端与接收端位置是运行时输入；不提供轨迹或 GPS 记录。}
- key: geometry
  status: provided
  note: {en: 'Built-in scenes such as munich, etoile, simple_street_canyon and florence ship in the package scenes folder.', zh: 软件包的 scenes 目录内置 munich、etoile、simple_street_canyon、florence 等场景。}
- key: materials
  status: provided
  note: {en: ITU-R P.2040-4 parametric radio materials are built into the package as ITURadioMaterial., zh: 软件包内置 ITU-R P.2040-4 参数化无线电材料，即 ITURadioMaterial。}
- key: rgb
  status: simulate
  note: {en: scene.render() and render_to_file() produce images; they are not calibrated or synchronized sensor data., zh: scene.render() 与 render_to_file() 生成图像；这些图像未经标定，也不是同步的多传感器数据。}
- key: depth
  status: simulate
  note: {en: The renderer uses a Mitsuba depth integrator; no depth files are shipped., zh: 渲染器使用 Mitsuba 深度积分器；不提供深度文件。}
- key: lidar
  status: simulate
  note: {en: Ray-intersection points can be taken from Scene.mi_scene with Mitsuba; the package has no LiDAR sensor model., zh: 可通过 Scene.mi_scene 借助 Mitsuba 获取射线求交点；软件包不含激光雷达传感器模型。}
- key: radar
  status: simulate
  note: {en: 'Bistatic sensing paths with Doppler come from RCSSolver and SensingTarget, added in v2.2.0.', zh: 带多普勒的双基地感知路径由 RCSSolver 与 SensingTarget 生成，于 v2.2.0 加入。}
- {key: imu, status: unknown}
- key: time_series
  status: simulate
  note: {en: Snapshot sequences come from Paths.cir() and Paths.cfr() over time steps; no sequences are stored., zh: 时间序列由 Paths.cir() 与 Paths.cfr() 在多个时间步上生成；不存储序列。}
- key: multiuser
  status: simulate
  note: {en: Several receivers in one run; the number of users is a run parameter., zh: 单次运行可包含多个接收端；用户数为运行参数。}
- key: multibs
  status: simulate
  note: {en: Several transmitters in one scene; RSS and SINR maps are computed over all transmitters., zh: 单个场景可包含多个发射端；RSS 与 SINR 地图基于全部发射端计算。}
- key: crossfreq
  status: simulate
  note: {en: Paths.cfr() evaluates one path set at several frequencies; the release stores no multi-band data., zh: Paths.cfr() 可对同一路径集在多个频率上求值；发布内容不含多频段数据。}
- {key: near_field, status: unknown}
- key: high_mobility
  status: simulate
  note: {en: Doppler follows from the velocities set on radio devices or scene objects; the package fixes no speed., zh: 多普勒由无线电设备或场景对象设置的速度推出；软件包不固定速度。}
- key: dynamic_blockage
  status: simulate
  note: {en: Moving obstacles are added as scene objects with a velocity; no blockage traces are shipped., zh: 运动障碍物以带速度的场景对象形式加入；不提供遮挡轨迹。}
- key: reflection
  status: simulate
  note: {en: Specular reflection is on by default (specular_reflection flag)., zh: 镜面反射默认开启（specular_reflection 开关）。}
- key: diffraction
  status: simulate
  note: {en: 'First-order edge and wedge diffraction, off by default (diffraction flag).', zh: 一阶边缘与楔形绕射，默认关闭（diffraction 开关）。}
- key: scattering
  status: simulate
  note: {en: 'Diffuse reflection, off by default (diffuse_reflection flag).', zh: 漫反射，默认关闭（diffuse_reflection 开关）。}
- key: transmission
  status: simulate
  note: {en: 'Refraction through thin slabs, on by default (refraction flag); rays are not deflected.', zh: 薄板材料的折射，默认开启（refraction 开关）；射线不发生角度偏折。}
- key: polarization
  status: simulate
  note: {en: 'Arrays take polarization V, H, VH or cross, with TR 38.901 polarization models.', zh: 天线阵列可设置极化 V、H、VH 或 cross，并支持 TR 38.901 极化模型。}
- key: em_field
  status: simulate
  note: {en: 'Antenna patterns (iso, dipole, half-wave dipole, TR 38.901) are set per array; the release stores no field-vector data.', zh: 天线方向图（iso、dipole、半波偶极子、TR 38.901）按阵列设置；发布内容不含场矢量数据。}
versions:
- version: v2.2.0
  date: '2026-09-29'
  summary: {en: 'Adds the radar cross-section module sionna.rt.rcs with sensing targets, an RCSSolver that includes Doppler from target motion, and TR 38.901 UAV, human, vehicle and AGV target models; adds Paths.concat(); removes RadioMaterial add_object and remove_object.', zh: 新增雷达截面模块 sionna.rt.rcs，包括感知目标、计入目标运动多普勒的 RCSSolver，以及 TR 38.901 中的无人机、人体、车辆和 AGV 目标模型；新增 Paths.concat()；移除 RadioMaterial 的 add_object 与 remove_object。}
  url: https://github.com/NVlabs/sionna-rt/releases/tag/v2.2.0
- version: v2.1.0
  date: '2026-09-09'
  summary: {en: 'Updates to Mitsuba 3.9.1 and Dr.Jit 1.5.0, adds a Metal backend for macOS, adds a deterministic path-generation flag, moves radio materials to ITU-R P.2040-4 and reworks the diffraction model.', zh: 升级至 Mitsuba 3.9.1 与 Dr.Jit 1.5.0，新增 macOS 的 Metal 后端，新增路径生成确定性开关，无线电材料更新至 ITU-R P.2040-4，并重写绕射模型。}
  url: https://github.com/NVlabs/sionna-rt/releases/tag/v2.1.0
- version: v2.0.1
  date: '2026-03-31'
  summary: {en: 'Restores changes from v1.2.2 that were dropped in v2.0.0, adds an error message for radio materials without a name, and fixes depth colorbar and tutorial issues.', zh: 恢复 v2.0.0 遗漏的 v1.2.2 改动，新增无名称无线电材料的报错信息，并修复深度图色条与教程问题。}
  url: https://github.com/NVlabs/sionna-rt/releases/tag/v2.0.1
- version: v2.0.0
  date: '2026-03-19'
  summary: {en: Tracking release with no functional changes; the release notes say it dropped v1.2.2 changes and recommend v2.0.1., zh: 版本号同步发布，无功能改动；发布说明指出其遗漏了 v1.2.2 的改动，建议改用 v2.0.1。}
  url: https://github.com/NVlabs/sionna-rt/releases/tag/v2.0.0
- version: v1.2.2
  date: '2026-03-19'
  summary: {en: 'Updates to Mitsuba 3.8.0 and Dr.Jit 1.3.1, enables pip install on ARM Linux, fixes RX antenna pattern computation in the paths solver, reduces radio-map memory use and fixes radio-material differentiability.', zh: 升级至 Mitsuba 3.8.0 与 Dr.Jit 1.3.1，支持在 ARM Linux 上通过 pip 安装，修复路径求解器中接收天线方向图的计算，降低无线电地图内存占用，并修复无线电材料的可微性。}
  url: https://github.com/NVlabs/sionna-rt/releases/tag/v1.2.2
- version: v1.2.1
  date: '2026-01-26'
  summary: {en: Syncs with Sionna v1.2.1 with no functional changes., zh: 与 Sionna v1.2.1 同步，无功能改动。}
  url: https://github.com/NVlabs/sionna-rt/releases/tag/v1.2.1
- version: v1.2.0
  date: '2025-09-19'
  summary: {en: 'Adds edge and wedge diffraction to path computation and radio maps, with flags for diffraction in the lit region; the path solver finds more paths with lower memory use; adds point picking in the previewer; uses Mitsuba 3.7 and Dr.Jit 1.1.', zh: 在路径计算与无线电地图中新增边缘与楔形绕射，提供照亮区绕射开关；路径求解器可找到更多路径且内存占用更低；预览器新增点坐标拾取；升级至 Mitsuba 3.7 与 Dr.Jit 1.1。}
  url: https://github.com/NVlabs/sionna-rt/releases/tag/v1.2.0
- version: v1.1.0
  date: '2025-06-05'
  summary: {en: 'Computes radio maps on arbitrary meshes such as terrain, adds scene object cloning and mesh loading and transform utilities, and fixes NaN gradients of radio maps.', zh: 支持在任意网格（如地形）上计算无线电地图，新增场景对象克隆以及网格加载与变换工具，并修复无线电地图梯度中的 NaN。}
  url: https://github.com/NVlabs/sionna-rt/releases/tag/v1.1.0
- version: v1.0.2
  date: '2025-04-03'
  summary: {en: Fixes the angle-of-arrival computation and the ordering consistency of paths across tensors., zh: 修复到达角计算，并修复各张量之间路径顺序不一致的问题。}
  url: https://github.com/NVlabs/sionna-rt/releases/tag/v1.0.2
- version: v1.0.1
  date: '2025-03-18'
  summary: {en: Minor fixes., zh: 小幅修复。}
  url: https://github.com/NVlabs/sionna-rt/releases/tag/v1.0.1
- version: v1.0.0
  date: '2025-03-18'
  summary: {en: 'First stable release, rewritten on Dr.Jit and Mitsuba 3 as a standalone package with PathSolver and RadioMapSolver, editable scenes and refraction on top of specular and diffuse reflection; diffraction and RIS were deferred to later releases.', zh: 首个稳定版本，基于 Dr.Jit 与 Mitsuba 3 重写为独立包，提供 PathSolver 与 RadioMapSolver，场景可编辑，在镜面与漫反射之上支持折射；绕射与 RIS 推迟至后续版本。}
  url: https://github.com/NVlabs/sionna-rt/releases/tag/v1.0.0
