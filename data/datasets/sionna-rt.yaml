tools: [project-scenebaker, project-mitsuba-blender, project-open3d-raycasting, project-deepmimo-sionna-bridge]
overview: {en: 'Sionna RT is the stand-alone ray tracing package of NVIDIA''s Sionna library, released under Apache-2.0 and built on Mitsuba 3. The repository states that it is interoperable with TensorFlow, PyTorch and JAX, and recommends installation with pip install sionna-rt. It is software and not a fixed downloadable dataset. A user loads a 3D scene with materials and transmitter and receiver positions, then computes propagation paths, channel impulse responses (CIRs) and coverage maps given as path gain in dB. The 2023 paper names the munich and etoile scenes as built-in scenes. The paper''s material-learning experiment uses CIRs from 400 receivers as targets, computed for an OFDM system with 128 subcarriers spaced 30 kHz apart, and models specular reflections only. The repository citation lists version 2.2.0.', zh: Sionna RT 是 NVIDIA Sionna 库中独立的射线追踪包，采用 Apache-2.0 许可，基于 Mitsuba 3 构建。仓库说明其可与 TensorFlow、PyTorch 和 JAX 配合使用，推荐通过 pip install sionna-rt 安装。它是软件，不是可直接下载的固定数据集。用户加载包含材料以及发射机、接收机位置的三维场景后，即可计算传播路径、信道冲激响应（CIR），以及以
    dB 表示路径增益的覆盖图。2023 年论文将 munich 和 etoile 列为内置场景。论文的材料学习实验以 400 个接收机的 CIR 作为目标，对应间隔 30 kHz 的 128 个 OFDM 子载波，且仅考虑镜面反射。仓库引用信息列出的版本为 2.2.0。}
signal_details:
- signal: paths
  text: {en: 'Propagation paths from scene.compute_paths(), with optional Doppler evolution through apply_doppler(). The 2023 paper computes specular reflections with the image method, using either an exhaustive search or a heuristic that launches rays on a Fibonacci lattice over a sphere. It supports specular and diffuse reflection and first-order diffraction, and lists refraction and RIS as planned. With synthetic_array set to False, paths are traced between every transmit and receive antenna pair. With synthetic_array set to True, each array is represented by its center antenna and phase shifts follow a plane-wave assumption.', zh: 由 scene.compute_paths() 计算传播路径，可通过 apply_doppler() 加入多普勒演化。2023 年论文中，镜面反射采用镜像法，搜索方式为穷举搜索，或基于球面 Fibonacci 格点发射射线的启发式方法。支持镜面反射、漫反射和一阶绕射，折射与 RIS 列为计划中的功能。synthetic_array 设为 False 时，在每对收发天线之间追踪路径；设为 True 时，每个阵列以中心天线表示，相位偏移基于平面波假设。}
- signal: cir
  text: {en: 'paths.cir() returns the path coefficients and delays. The caller can include or exclude line-of-sight, reflection and diffraction paths. The paper obtains channel frequency responses by transforming the CIRs into the frequency domain.', zh: paths.cir() 返回路径系数与时延，可选择包含或排除视距、反射和绕射路径。论文通过将 CIR 变换到频域得到信道频率响应。}
- signal: pathloss
  text: {en: scene.coverage_map() produces a coverage map whose values are path gain in dB. The paper uses the term coverage map rather than radio map., zh: scene.coverage_map() 生成覆盖图，数值为以 dB 表示的路径增益。论文使用 coverage map 一词，而非 radio map。}
