  summary: {en: 'First Zenodo version (record 3882104), issued 2020-06-06. It holds lab folders for 1, 2, 3, 5 and 10 people, kitchen folders for 1 and 3 people, and the shuffled training split, as listed in its description.', zh: 首个 Zenodo 版本（record 3882104），发布日期为 2020-06-06。包含实验室中 1、2、3、5、10 人的文件夹，厨房中 1 人和 3 人的文件夹，以及打乱顺序的训练划分，文件列表见其描述。}
  url: https://zenodo.org/record/3882104
