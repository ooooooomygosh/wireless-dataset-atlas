summary: {en: Intel 5300 WiFi CSI (30 subcarriers across 3 antennas per packet) recorded while people walk through a lab area and a kitchen area. Ceiling-camera position ground truth and SpotFi-estimated angle-of-arrival values are included., zh: 在实验室区域和厨房区域中行走的人员采集的 Intel 5300 WiFi CSI（每个数据包 30 个子载波、3 根天线）。数据包含天花板摄像头提供的位置真值以及 SpotFi 估计的 AoA 值。}
