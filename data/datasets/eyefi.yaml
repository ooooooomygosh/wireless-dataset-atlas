checked: '2026-11-06'
overview: {en: 'EyeFi is a dataset of WiFi CSI and camera ground truth for human motion, published on Zenodo (record 3882104, version 1.0.0, June 6, 2020) under CC BY 4.0. It was collected as part of the EyeFi project at the Bosch Research and Technology Center in Pittsburgh, PA, and is used in the DCOSS 2020 paper ''EyeFi: Fast Human Identification Through Vision and WiFi-based Trajectory Matching'' by Shiwei Fang, Tamzeed Islam, Sirajum Munir and Shahriar Nirjon. An Intel 5300 WiFi NIC captured CSI from packets sent by a Google Pixel 2 XL phone used as the access point. Each packet carries 30 subcarriers across 3 antennas, and the packet rate is about 20 to 25 packets per second. People walked in a lab area of 11.8 m by 8.74 m with 1, 2, 3, 5 or 10 people, and in a kitchen with strong reflectors such as metal refrigerators and dishwashers with 1 or 3 people. A ceiling-mounted camera at about 2.85 m gives the (x, y) coordinates and a camera-based angle of arrival for each person, and SpotFi
    estimates angles of arrival from the CSI using 1 to 4 assumed paths. The files are HDF5 (.h5), grouped by scene and number of people, and the archive EyeFi_Dataset.zip is about 1.5 GB.', zh: 'EyeFi 是一个包含人体运动 WiFi CSI 与摄像头真值的数据集，发布于 Zenodo（record 3882104，版本 1.0.0，发布日期 2020 年 6 月 6 日），采用 CC BY 4.0 许可。数据采集于 Bosch Research and Technology Center（宾夕法尼亚州匹兹堡）的 EyeFi 项目，配套 DCOSS 2020 论文《EyeFi: Fast Human Identification Through Vision and WiFi-based Trajectory Matching》，作者为 Shiwei Fang、Tamzeed Islam、Sirajum Munir 和 Shahriar Nirjon。Intel 5300 WiFi 网卡采集的 CSI 来自作为接入点的 Google Pixel 2 XL 手机发出的数据包。每个数据包包含 30 个子载波、3 根天线，包速率约为每秒 20 至 25 个。人员在 11.8 m × 8.74 m 的实验室区域中行走，人数为 1、2、3、5 或 10 人；厨房区域内有冰箱、洗碗机等金属强反射体，人数为 1 或 3 人。天花板摄像头位于约 2.85 m 高度，为每位人员提供 (x, y) 坐标和基于摄像头的到达角；SpotFi 则基于 CSI 估计到达角，假设路径数为 1 至 4。文件为 HDF5（.h5）格式，按场景和人数分组；压缩包 EyeFi_Dataset.zip 约 1.5 GB。'}
signal_details:
- signal: csi
  text: {en: 'WiFi CSI from an Intel 5300 NIC in an Intel NUC, extracted with Linux CSI tools, with a Google Pixel 2 XL as the access point. Each csi_real and csi_imag record has 90 values, ordered by subcarrier then antenna, which is 30 subcarriers across 3 antennas. The packet rate is about 20 to 25 packets per second.', zh: 由 Intel NUC 中的 Intel 5300 网卡经 Linux CSI tools 提取的 WiFi CSI，接入点为 Google Pixel 2 XL。每条 csi_real 与 csi_imag 记录包含 90 个数值，按子载波后天线的顺序排列，即 30 个子载波、3 根天线。数据包速率约为每秒 20 至 25 个。}
pipeline:
  summary: {en: 'CSI from WiFi packets is paired with camera coordinates and SpotFi angle estimates, then packed into HDF5 files by scene.', zh: WiFi 数据包的 CSI 与摄像头坐标、SpotFi 到达角估计配对，再按场景打包为 HDF5 文件。}
  stages:
  - title: {en: CSI capture, zh: CSI 采集}
    detail: {en: 'An Intel 5300 WiFi NIC in an Intel NUC, running Linux CSI tools, extracts CSI from packets sent by a Google Pixel 2 XL that serves as the access point. The packet rate is about 20 to 25 packets per second, and the WiFi antennas sit about 1.12 m above ground.', zh: Intel NUC 中的 Intel 5300 WiFi 网卡运行 Linux CSI tools，从作为接入点的 Google Pixel 2 XL 发出的数据包中提取 CSI。数据包速率约为每秒 20 至 25 个，WiFi 天线距地面约 1.12 m。}
    inputs:
    - {en: WiFi packets from the Pixel 2 XL, zh: 来自 Pixel 2 XL 的 WiFi 数据包}
    outputs:
    - {en: csi_real and csi_imag per packet, zh: 每个数据包的 csi_real 与 csi_imag}
  - title: {en: Camera ground truth, zh: 摄像头真值}
    detail: {en: 'A Bosch Flexidome IP Panoramic 7000 camera mounted on the ceiling at about 2.85 m gives (x, y) coordinates and a camera-derived angle of arrival for each person. The person holding the phone is labelled obj_0, and other people are labelled as additional objects.', zh: '安装在天花板上、高度约 2.85 m 的 Bosch Flexidome IP Panoramic 7000 摄像头为每位人员提供 (x, y) 坐标和基于摄像头的到达角。手持手机的人员标记为 obj_0，其他行人作为其他对象标记。'}
    inputs:
    - {en: ceiling camera view, zh: 天花板摄像头画面}
    outputs:
    - {en: coordinates and cam_aoa per person, zh: 每人的坐标与 cam_aoa}
  - title: {en: SpotFi angle-of-arrival estimation, zh: SpotFi 到达角估计}
    detail: {en: 'SpotFi estimates angles of arrival from the CSI, assuming 1 to 4 paths. Phase-offset corrections are stored as offset_00, offset_11, offset_12, offset_21 and offset_22; the measured offsets are 1.1899 rad and -2.0071 rad for antennas 1 and 2, and 1.3883 rad and -1.8129 rad for antennas 1 and 3.', zh: SpotFi 基于 CSI 估计到达角，假设路径数为 1 至 4。相位偏移校正存储为 offset_00、offset_11、offset_12、offset_21 和 offset_22；天线 1 与 2 的实测偏移为 1.1899 rad 和 -2.0071 rad，天线 1 与 3 为 1.3883 rad 和 -1.8129 rad。}
    inputs:
    - {en: CSI, zh: CSI}
    outputs:
    - {en: spotfi_aoa per path count and offset, zh: 按路径数与偏移划分的 spotfi_aoa}
  - title: {en: HDF5 packaging by scene, zh: 按场景打包为 HDF5}
    detail: {en: 'Samples are written as HDF5 files grouped by scene: lab with 1, 2, 3, 5 or 10 people, and kitchen with 1 or 3 people. Each file holds csi_real, csi_imag, nPaths groups with spotfi_aoa, num_obj, obj groups with cam_aoa and coordinates, and timestamp. The training folder contains shuffled train, valid and test files without timestamps, drawn from the lab 1-person data.', zh: 样本按场景写入 HDF5 文件：实验室场景为 1、2、3、5 或 10 人，厨房场景为 1 或 3 人。每个文件包含 csi_real、csi_imag、带 spotfi_aoa 的 nPaths 分组、num_obj、带 cam_aoa 与 coordinates 的 obj 分组，以及 timestamp。训练文件夹包含打乱顺序的 train、valid 和 test 文件，无时间戳，取自实验室 1 人数据。}
    inputs:
    - {en: CSI, zh: CSI}
    - {en: camera coordinates, zh: 摄像头坐标}
    - {en: SpotFi AoA, zh: SpotFi 到达角}
    outputs:
    - {en: .h5 files, zh: .h5 文件}
    - {en: EyeFi_Dataset.zip (about 1.5 GB), zh: EyeFi_Dataset.zip（约 1.5 GB）}
size_gb: 1.5
antennas: {rx: 3}
mobility: walking pedestrians
facts:
- label: {en: Labels, zh: 标签}
  text: {en: 'obj_0 is always the person holding the phone, and the other people in the scene are obj_1 onward. Each person''s (x, y) coordinates come from the ceiling camera, and cam_aoa is the angle of arrival derived from those coordinates.', zh: 'obj_0 始终为手持手机的人员，场景中的其他人员依次为 obj_1 及之后。每位人员的 (x, y) 坐标来自天花板摄像头，cam_aoa 为由这些坐标推算出的到达角。'}
- label: {en: Folders, zh: 文件夹}
  text: {en: 'Files in one folder always have the same number of people in the scene, but the phone holder can differ. Separate files record different days or system reboots, which introduce different phase offsets.', zh: 同一文件夹内的文件，场景中人数相同，但手持手机的人员可能不同。不同文件对应不同日期或系统重启，重启会引入不同的相位偏移。}
- label: {en: Training files, zh: 训练文件}
  text: {en: 'The training folder holds shuffuled_train.h5, shuffuled_valid.h5 and shuffuled_test.h5, spelled this way in the archive. Their rows are randomly shuffled from 1_person_1.h5 and 1_person_2.h5 and contain no timestamps.', zh: 训练文件夹包含 shuffuled_train.h5、shuffuled_valid.h5 和 shuffuled_test.h5（压缩包中的拼写）。其数据行由 1_person_1.h5 和 1_person_2.h5 随机打乱得到，不含时间戳。}
- label: {en: Training file layout, zh: 训练文件结构}
  text: {en: 'Training files group rows by nPath-1 to nPath-4, each holding aoa, csi_imag, csi_real and spotfi datasets. This differs from the nPaths_x and obj_x layout of the other files.', zh: 训练文件按 nPath-1 至 nPath-4 分组，每组包含 aoa、csi_imag、csi_real 和 spotfi 数据集，与其他文件的 nPaths_x 与 obj_x 结构不同。}
capabilities:
- key: csi
  status: provided
  note: {en: 'Intel 5300 CSI with 30 subcarriers and 3 antennas, stored as csi_real and csi_imag with 90 values per packet.', zh: Intel 5300 CSI，含 30 个子载波、3 根天线，以 csi_real 与 csi_imag 存储，每个数据包 90 个数值。}
- key: cir
  status: derivable
  note: {en: Computed from the provided CSI by an inverse Fourier transform over subcarriers., zh: 由所提供的 CSI 沿子载波做逆傅里叶变换得到。}
- key: paths
  status: provided
  note: {en: 'SpotFi AoA for 1 to 4 assumed paths, with phase-offset variants; per-path delay, power and phase are not stored.', zh: 按 1 至 4 条假设路径给出的 SpotFi AoA，并含相位偏移变体；未存储逐路径时延、功率和相位。}
- key: interaction
  status: none
  note: {en: 'Stored fields are CSI, SpotFi AoA, camera coordinates, cam_aoa and timestamps, with no per-path interaction labels.', zh: 存储字段为 CSI、SpotFi AoA、摄像头坐标、cam_aoa 与时间戳，不含逐路径交互标签。}
- key: power
  status: derivable
  note: {en: Relative received power can be computed from the stored csi_real and csi_imag values; no RSSI field is stored., zh: 相对接收功率可由存储的 csi_real 与 csi_imag 计算；未存储 RSSI 字段。}
- key: iq
  status: none
  note: {en: Only processed CSI is stored; no raw I/Q samples., zh: 仅存储处理后的 CSI，不含原始 I/Q 采样。}
- key: beam_labels
  status: derivable
  note: {en: Computed by projecting the provided channels onto a beam codebook for the stated array., zh: 将所提供信道投影到对应阵列的波束码本上得到。}
- key: position
  status: provided
  note: {en: 'Per-person (x, y) coordinates from the ceiling camera; no height is stored.', zh: '天花板摄像头给出每人的 (x, y) 坐标，不含高度。'}
- key: geometry
  status: none
  note: {en: Room sizes are given in text only; no 3D scene or map files are listed., zh: 房间尺寸仅以文字给出；未列出三维场景或地图文件。}
- key: materials
  status: none
  note: {en: Kitchen materials are described qualitatively; no material parameters are stored., zh: 厨房材料仅作定性描述；未存储材料参数。}
- key: rgb
  status: none
  note: {en: The camera provides coordinates and cam_aoa; no image frames are listed., zh: 摄像头提供坐标与 cam_aoa；未列出图像帧。}
- key: depth
  status: none
  note: {en: No depth data are listed., zh: 未列出深度数据。}
- key: lidar
  status: none
  note: {en: No lidar data are listed., zh: 未列出激光雷达数据。}
- key: radar
  status: none
  note: {en: No radar sensor or radar data are described., zh: 未描述雷达传感器或雷达数据。}
- key: imu
  status: none
  note: {en: No IMU data are listed., zh: 未列出 IMU 数据。}
- key: time_series
  status: provided
  note: {en: Per-packet timestamps and chronologically ordered coordinates in the lab files; the training files have no timestamps., zh: 实验室文件含逐包时间戳及按时间排序的坐标；训练文件无时间戳。}
- key: multiuser
  status: none
  note: {en: 'One phone-to-NIC link per sample; up to 10 people appear in a scene, but no per-user channels are stored.', zh: 每个样本为一条手机到网卡的链路；场景中最多 10 人，但不存储逐用户信道。}
- key: multibs
  status: none
  note: {en: One access point and one NIC are described., zh: 仅描述一个接入点和一块网卡。}
- key: crossfreq
  status: none
  note: {en: A single WiFi link is described; no paired multi-band data are described., zh: 仅描述单一 WiFi 链路，未描述成对的多频段数据。}
- {key: near_field, status: unknown}
- key: high_mobility
  status: none
  note: {en: Users are walking pedestrians; no speed of about 30 km/h or more is stated., zh: 用户为步行行人；来源未给出约 30 km/h 或以上的速度。}
- key: dynamic_blockage
  status: provided
  note: {en: Walking people move through the link during recording; blockage is not labelled., zh: 录制期间行走的人员穿过链路；未标注遮挡。}
- key: reflection
  status: provided
  note: {en: 'Inherent in the measurement, not labelled per path.', zh: 包含在测量之中，未按路径标注。}
- key: diffraction
  status: provided
  note: {en: 'Inherent in the measurement, not labelled per path.', zh: 包含在测量之中，未按路径标注。}
- key: scattering
  status: provided
  note: {en: 'Inherent in the measurement, not labelled per path.', zh: 包含在测量之中，未按路径标注。}
- key: transmission
  status: provided
  note: {en: 'Inherent in the measurement, not labelled per path.', zh: 包含在测量之中，未按路径标注。}
- {key: polarization, status: unknown}
- key: em_field
  status: none
  note: {en: Only CSI and AoA values are stored; no field components or antenna patterns are included., zh: 仅存储 CSI 与 AoA 数值，不含场分量或天线方向图。}
