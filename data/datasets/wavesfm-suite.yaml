pipeline:
  summary: {en: 'Task-specific preprocessors write HDF5 caches. data.py loads each task from its cache, a fixed split is applied, and the fine-tuning mode (LP, FT2 or LoRA) produces the task metric.', zh: 专用预处理脚本写入 HDF5 缓存；data.py 从缓存加载各任务，应用固定划分，再以微调模式（LP、FT2 或 LoRA）得到任务指标。}
  scope: {en: The WavesFM v1.0 public evaluation suite. The DeepMIMO preprocessing is described in full; other tasks use their own preprocessing scripts., zh: WavesFM v1.0 公开评测套件。DeepMIMO 预处理按步骤完整说明；其他任务使用各自的预处理脚本。}
  stages:
  - title: {en: Obtain the upstream datasets, zh: 取得上游数据集}
    detail: {en: 'Each task needs its own upstream release (EfficientFi, CommRad, 5G NR positioning, UWB, RADCOM, RML2022, POWDER, ICARUS or DeepMIMO). The repository holds preprocessing code, not raw data.', zh: 每个任务需要各自的上游数据（EfficientFi、CommRad、5G NR 定位、UWB、RADCOM、RML2022、POWDER、ICARUS 或 DeepMIMO）。仓库只包含预处理代码，不含原始数据。}
  - title: {en: Parse raw data into task tensors, zh: 将原始数据解析为任务张量}
    detail: {en: 'Each script under preprocessing/ turns raw files into image-like (C,H,W) or IQ-style (2,C,T) tensors. The DeepMIMO script uses DeepMIMOv3 to generate channels for six city scenes with 32 BS antennas and 32 subcarriers, and removes users with LoS = -1.', zh: 'preprocessing/ 下的各脚本将原始文件转换为类图像 (C,H,W) 或类 IQ (2,C,T) 张量。DeepMIMO 脚本使用 DeepMIMOv3 生成六个城市场景的信道，基站 32 天线、32 子载波，并剔除 LoS = -1 的用户。'}
    controls:
    - {en: 'The DeepMIMO script fixes the BS array rotation, 20 paths and a 30 kHz subcarrier spacing.', zh: DeepMIMO 脚本固定基站阵列旋转、20 条路径与 30 kHz 子载波间隔。}
  - title: {en: Compute labels and write the HDF5 cache, zh: 计算标签并写入 HDF5 缓存}
    detail: {en: 'For DeepMIMO, each codebook beam response is averaged as a complex value over the subcarriers and converted to magnitude; the strongest beam becomes label_beam_{n}. Inputs are resized bicubically to 224 by 224 and standardized with the mean and standard deviation of the whole cache. The cache stores sample, label_los, label_beam_{n} and scenario.', zh: 'DeepMIMO 中，每个码本波束的响应对子载波做复数平均后取幅度，最强波束即为 label_beam_{n}。输入双三次插值至 224×224，并用整个缓存的均值与标准差标准化。缓存包含 sample、label_los、label_beam_{n} 与 scenario。'}
    controls:
    - {en: 64 beams is the default codebook size; one cache can store labels for several beam counts., zh: 默认码本为 64 个波束；同一缓存可保存多种波束数的标签。}
  - title: {en: Load the task and fix the evaluation split, zh: 加载任务并固定评测划分}
    detail: {en: 'data.py chooses the loader and output head for each task. --val-data supplies an independent validation cache; otherwise --val-split (default 0.2) makes a random split over samples, seeded by --seed. The batch runner adds class stratification for rfs, interf, deepmimo-los and deepmimo-beam.', zh: data.py 为每个任务选择加载器与输出头。提供 --val-data 时使用独立验证缓存；否则由 --val-split（默认 0.2）按样本随机划分，随机种子由 --seed 控制。批量脚本对 rfs、interf、deepmimo-los 与 deepmimo-beam 增加类别分层。}
    controls:
    - {en: 'The default split works over samples, so cities, devices, trajectories and acquisition events are not kept apart.', zh: 默认划分以样本为单位，城市、设备、轨迹和采集事件之间没有隔离。}
  - title: {en: Fine-tune and report the metric, zh: 微调并报告指标}
    detail: {en: 'main_finetune.py runs one task in LP, FT2 or LoRA mode, and run_finetune_all.py sweeps seeds 0, 1 and 2. Reported metrics are accuracy, mean per-class accuracy, or mean localization error in meters; the website gives the mean and standard deviation for each task.', zh: main_finetune.py 以 LP、FT2 或 LoRA 模式运行单个任务，run_finetune_all.py 扫描种子 0、1、2。报告的指标为准确率、平均每类准确率，或以米为单位的平均定位误差；官网逐任务给出均值与标准差。}
    controls:
    - {en: The v1.0 website uses LoRA rank 32 and alpha 64; the 2025 preprint reports rank 32 and alpha 32., zh: 官网 v1.0 的 LoRA 为 rank 32、alpha 64；2025 年预印本报告的为 rank 32、alpha 32。}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: Task-specific loading and preprocessing interfaces for upstream datasets; HDF5 task-cache schema; public evaluation commands., zh: 各上游数据的任务专用加载与预处理接口；HDF5 任务缓存结构；公开的评测命令。}
- label: {en: Derived outputs, zh: 派生输出}
  text: {en: 'Resized and standardized wireless representations; DeepMIMO LoS and beam labels; LP, FT2 and LoRA metrics across seeds.', zh: 经 resize 与标准化的无线表示；DeepMIMO 的 LoS 与波束派生标签；跨种子的 LP、FT2 与 LoRA 指标。}
- label: {en: Reproduction notes, zh: 复现说明}
  text: {en: 'The repository has no LICENSE file, and GitHub detects no license; the code license is not stated.', zh: 仓库没有 LICENSE 文件，GitHub 也未识别出许可证；代码许可未声明。}
provenance:
- {en: Obtain each upstream measurement or simulation dataset, zh: 分别取得上游测量或仿真数据}
- {en: 'Task-specific parsing, transformation, and normalization', zh: 任务专用解析、变换与归一化}
- {en: Store inputs and labels in HDF5 caches, zh: HDF5 cache保存输入和标签}
- {en: Task registration and learning splits, zh: 任务注册及学习划分}
- {en: LP/FT2/LoRA adaptation and evaluation across multiple seeds, zh: LP/FT2/LoRA适配与多seed评价}
technical_notes:
- {en: 'DeepMIMO caches depend on the DeepMIMOv3 scenario folder and on the fixed array and OFDM settings in preprocess_deepmimo.py (32 BS antennas, 32 subcarriers, 30 kHz spacing).', zh: DeepMIMO 缓存依赖 DeepMIMOv3 场景文件夹，以及 preprocess_deepmimo.py 中固定的阵列与 OFDM 设置（基站 32 天线、32 子载波、30 kHz 间隔）。}
- {en: 'Image-like caches are resized to a common ViT input size (224 by 224 in the DeepMIMO and 5G NR scripts), so a shared input shape does not imply a shared physical sampling grid.', zh: 类图像缓存被缩放到统一的 ViT 输入尺寸（DeepMIMO 与 5G NR 脚本中为 224×224），因此输入形状相同并不意味着物理采样网格相同。}
- {en: 'Each task reads its own HDF5 cache, and the repository does not pair samples across datasets.', zh: 每个任务读取各自的 HDF5 缓存，仓库不在数据集之间配对样本。}
limitations:
- {en: 'DeepMIMO preprocessing computes the mean and standard deviation over the full cache before any train/validation split, so the statistics include the validation samples.', zh: DeepMIMO 预处理在任何训练/验证划分之前，用整个缓存计算均值与标准差，因此统计量包含验证样本。}
- {en: 'The default validation split is a random 80/20 split over samples, so cities, devices, trajectories and acquisition events can appear in both training and validation.', zh: 默认验证划分是按样本随机的 80/20 划分，因此城市、设备、轨迹和采集事件可能同时出现在训练集与验证集中。}
- {en: 'The v1.0 website reports 13 task rows with LoRA alpha 64, while the 2025 preprint evaluates five task types with LoRA alpha 32.', zh: 官网 v1.0 报告 13 个任务行且 LoRA alpha 为 64；2025 年预印本评测五类任务，LoRA alpha 为 32。}
history:
- {en: '2025-11-19: Multimodal Wireless Foundation Models preprint v1', zh: 2025-11-19：Multimodal Wireless Foundation Models预印本v1}
- {en: '2026-01-23: update date shown on the official Detailed Evaluation page', zh: 2026-01-23：官网Detailed Evaluation标注更新日}
usage:
- {en: 'The task pages under docs/datasets list the upstream source, cache keys and label definitions. For DeepMIMO, LoS labels are 0 for NLoS and 1 for LoS, and beam labels are indices 0 to n-1.', zh: docs/datasets 下的任务页列出上游来源、缓存键与标签定义。DeepMIMO 中 LoS 标签 0 为 NLoS、1 为 LoS，波束标签为 0 至 n-1 的索引。}
- {en: Run the preprocessing script for the task; --help gives the expected raw layout and arguments., zh: 对目标任务运行对应的预处理脚本；--help 给出所需的原始数据结构与参数。}
- {en: 'Select the task with main_finetune.py; pass --val-data to fix the evaluation set, or use --val-split (default 0.2).', zh: 通过 main_finetune.py 选择任务；用 --val-data 固定评测集，或使用 --val-split（默认 0.2）。}
- {en: 'run_finetune_all.py writes one run directory per seed for the LP, FT2, LoRA and strict-probe modes.', zh: run_finetune_all.py 为 LP、FT2、LoRA 与 strict-probe 模式的每个种子各写入一个运行目录。}
field_notes:
- label: {en: CSI, zh: CSI}
  text: {en: 'Besides DeepMIMO, the CSI tasks are 5G NR positioning and EfficientFi (HAS). Spectrogram tasks are RFS; IQ tasks are RML, RADCOM, RFP and INTD/INTC; CIR tasks are the two UWB localization tasks.', zh: 除 DeepMIMO 外，CSI 任务为 5G NR 定位与 EfficientFi（HAS）。频谱图任务为 RFS；IQ 任务为 RML、RADCOM、RFP 与 INTD/INTC；CIR 任务为两个 UWB 定位任务。}
- label: {en: Position, zh: 位置}
  text: {en: 'The 5G NR positioning task maps coordinates to [-1, 1] using per-scene bounds (outdoor 80 by 60 by 40, indoor 60 by 20 by 4). The 5G NR and UWB localization errors are reported in meters.', zh: '5G NR 定位任务用分场景边界把坐标映射到 [-1, 1]（室外 80×60×40，室内 60×20×4）。5G NR 与 UWB 定位误差以米为单位报告。'}
- label: {en: Beam labels, zh: 波束标签}
  text: {en: 'The DeepMIMO subtask writes label_beam_{n} from a codebook of n beams, 64 by default. Each label is the beam with the largest response after complex averaging over subcarriers.', zh: 'DeepMIMO 子任务由 n 波束码本写入 label_beam_{n}，默认 64 个波束。每个标签为子载波复数平均后响应最大的波束。'}
- label: {en: RGB, zh: RGB}
  text: {en: Image-like inputs are spectrograms and CSI tensors. The task list contains no visible-light RGB image task., zh: 类图像输入为频谱图与 CSI 张量。任务列表中没有可见光 RGB 图像任务。}
- label: {en: Radar, zh: 雷达}
  text: {en: RADCOM tasks classify radar signal types and modulation from IQ data. The repository has no target-detection task with range-Doppler labels., zh: RADCOM 任务基于 IQ 数据识别雷达信号类别与调制方式。仓库中没有带距离-多普勒标签的目标检测任务。}
- label: {en: Time, zh: 时间}
  text: {en: 'The default random split works over samples, so trajectories, acquisition events and timestamps are not kept together between training and validation.', zh: 默认随机划分以样本为单位，因此轨迹、采集事件与时间戳不会在训练集与验证集之间被整体隔离。}
paper_summary:
- label: {en: System, zh: 系统}
  text: {en: 'I/Q and image-based wireless representations use separate input projections into a shared ViT, pretrained through reconstruction with 70% masking.', zh: I/Q与图像式无线表示用独立输入投影接入共享ViT；70%遮挡重建预训练。}
- label: {en: Prediction target, zh: 预测对象}
  text: {en: 'RF identity, interference, activity/signal classes, and NR position.', zh: RF身份、干扰、活动/信号类别及NR位置。}
- label: {en: Decision target, zh: 决策目标}
  text: {en: The paper evaluates classification and localization; communication scheduling and net rate have not been evaluated., zh: 论文评价分类和定位任务；通信调度或净速率尚未评估。}
- label: {en: Protocol, zh: 评估协议}
  text: {en: Pretraining uses 3200 spectrograms and 3200 I/Q samples; 5 downstream task types and 6 metric columns. LP still trains input projections; the paper sets both LoRA rank and alpha to 32., zh: 3200个频谱图和3200个I/Q样本预训练；5类下游任务、6个指标列。LP仍训练输入投影；论文LoRA rank/alpha均32。}
- label: {en: Key finding, zh: 主要发现}
  text: {en: 'The shared representation covers two input types; Table II reports FT2 localization error of 1.27 m versus 0.41 m for single-modality WavesFM, with gains varying by task and adaptation method.', zh: 共享表示覆盖两类输入；Table II中FT2定位误差为1.27 m，单模态WavesFM为0.41 m，收益随任务和适配方式变化。}
- label: {en: Remaining gap, zh: 尚未解决的问题}
  text: {en: Model parameter counts and pretraining data volumes differ; control both before attributing gains to multimodality. Reproduce the paper's protocol separately from the current 10-dataset evaluation suite., zh: 模型参数量和预训练数据量不同，需要控制这两项再归因于多模态；论文协议与当前10数据集评估套件分开复现。}
tools: [project-wavesfm-suite]
overview: {en: 'WavesFM is the evaluation and fine-tuning code for the multimodal wireless foundation model in arXiv:2511.15162 by Aboulfotouh and Abou-Zeid (2025). The repository turns each upstream dataset into an HDF5 cache that a task loader reads, and it trains a shared ViT with a task-specific head. The v1.0 benchmark page lists 10 upstream datasets in 13 task rows: 5G NR positioning, CommRad RF, DeepMIMO beam prediction and LoS/NLoS, EfficientFi WiFi sensing, ICARUS interference detection and classification, POWDER RF fingerprinting, RADCOM, RML2022, and UWB indoor and industrial localization. Each row is reported as mean and standard deviation over three seeds for linear probing (LP), partial fine-tuning (FT2) and LoRA (R=32, alpha=64). The DeepMIMO subset is generated from DeepMIMOv3 scenarios, and the README asks users to credit the owners of each dataset. The paper''s model takes IQ streams and image-like inputs through separate embeddings and is pretrained with masked modeling
    at a 70% mask ratio.', zh: 'WavesFM 是 arXiv:2511.15162 多模态无线基础模型的评测与微调代码，作者为 Aboulfotouh 与 Abou-Zeid（2025）。仓库将每个上游数据集转换为 HDF5 缓存，由任务加载器读取，并训练共享的 ViT 加任务专用头。v1.0 基准页面列出 10 个上游数据集、13 个任务行：5G NR 定位、CommRad RF、DeepMIMO 波束预测与 LoS/NLoS、EfficientFi WiFi 感知、ICARUS 干扰检测与分类、POWDER RF 指纹识别、RADCOM、RML2022，以及 UWB 室内与工业定位。每行以线性探测（LP）、部分微调（FT2）和 LoRA（R=32，alpha=64）评测，报告 3 个随机种子的均值与标准差。DeepMIMO 子集由 DeepMIMOv3 场景生成，README 要求注明各数据集的所有者。论文模型通过独立的模态嵌入接收 IQ 流和类图像输入，并以 70% 掩码比例进行掩码建模预训练。'}
signal_details:
- signal: csi
  text: {en: 'CSI caches come from DeepMIMOv3-generated DeepMIMO scenarios and from the 5G NR and WiFi sets. DeepMIMO channels are scaled by 1e6, users with LoS = -1 are removed, and complex CSI is split into real and imaginary channels. Beam labels label_beam_{n} come from a codebook of n beams over a 180-degree field of view; the default is n = 64, and the preprocessing script can store labels for several values of n in one cache. The 5G NR positioning task regresses UE location from CSI obtained with sounding reference signals. The EfficientFi task uses Wi-Fi CSI recorded between two access points with three antennas each while subjects perform six activities.', zh: 'CSI 缓存来自 DeepMIMOv3 生成的 DeepMIMO 场景，以及 5G NR 与 WiFi 数据集。DeepMIMO 信道乘以 1e6 缩放，剔除 LoS = -1 的用户，并将复数 CSI 拆分为实部与虚部通道。波束标签 label_beam_{n} 由覆盖 180 度视场的 n 波束码本生成，默认 n = 64；预处理脚本可在同一缓存中保存多个 n 的标签。5G NR 定位任务使用探测参考信号（SRS）获得的 CSI 回归 UE 位置。EfficientFi 任务使用两个接入点之间、各带三根天线的 Wi-Fi CSI，记录受试者执行六种活动时的数据。'}
- signal: cir
  text: {en: 'CIR tensors feed the two UWB localization tasks, UWB indoor positioning and tracking and UWB industrial localization, stored per sample as (2, A, L) real and imaginary tensors with A anchors. The README lists both as position regression on IQ-like CIR tensors. The industrial data are linked from the channel impulse response page of cmutschler.de; its task documentation states that the loader uses an 80/20 random split of the training file, because the official test set has no released ground truth.', zh: 'CIR 张量用于两个 UWB 定位任务：UWB 室内定位与跟踪，以及 UWB 工业定位。每个样本以 (2, A, L) 的实部与虚部张量存储，A 为锚点数。README 将两者都列为基于类 IQ 形式 CIR 张量的位置回归。工业定位数据链接自 cmutschler.de 的信道冲激响应页面；其任务文档说明，由于官方测试集没有公布真值，加载器对训练文件做 80/20 随机划分。'}
- signal: iq
  text: {en: 'IQ-style caches store (2,C,T) tensors with an integer class label or a vector target. They serve RML2022 modulation classification, RADCOM classification from IQ, POWDER RF fingerprinting, and ICARUS interference detection and classification.', zh: 'IQ 类缓存以 (2,C,T) 张量存储，标签为整数类别或向量目标。用于 RML2022 调制分类、基于 IQ 的 RADCOM 分类、POWDER RF 指纹识别，以及 ICARUS 干扰检测与分类。'}
capabilities:
- key: csi
  status: derivable
  note: {en: 'CSI caches are built by preprocessing upstream DeepMIMO, 5G NR positioning and EfficientFi files; the DeepMIMO caches store complex CSI as real and imaginary channels, and the HAS cache uses CSI amplitude.', zh: CSI 缓存由预处理脚本从上游 DeepMIMO、5G NR 定位与 EfficientFi 文件构建；DeepMIMO 缓存将复数 CSI 存为实部与虚部信道，HAS 缓存使用 CSI 幅度。}
- key: cir
  status: derivable
  note: {en: 'UWB-Indoor and UWB-Industrial CIR tensors are built from upstream UWB measurements as (2, A, L) real and imaginary arrays.', zh: 'UWB-Indoor 与 UWB-Industrial 的 CIR 张量由上游 UWB 测量数据预处理得到，为 (2, A, L) 的实部与虚部数组。'}
- key: paths
  status: none
  note: {en: 'The caches store channel grids, labels and scenario names; per-path delay, angle or power is not kept.', zh: 缓存只保存信道网格、标签与场景名称，不保留逐路径的时延、角度或功率。}
- key: interaction
  status: none
  note: {en: No cache description includes per-path or per-surface interaction fields., zh: 各缓存说明中均不包含逐路径或逐表面的交互字段。}
- key: power
  status: derivable
  note: {en: Computed as the squared channel magnitude of the provided channel data., zh: 由所提供信道数据的幅度平方计算得到。}
- key: iq
  status: derivable
  note: {en: 'IQ caches for RML2022, RADCOM, POWDER and ICARUS are built from upstream raw files; ICARUS samples are center-cropped to 4096 by default.', zh: RML2022、RADCOM、POWDER 与 ICARUS 的 IQ 缓存由上游原始文件构建；ICARUS 默认中心截取 4096 个采样点。}
- key: beam_labels
  status: derivable
  note: {en: 'DeepMIMO label_beam_{n} is computed from a codebook of n beams over 180 degrees, with n = 64 by default.', zh: 'DeepMIMO 的 label_beam_{n} 由 n 个波束（默认 64 个）、180 度视场的码本计算得到。'}
- key: position
  status: derivable
