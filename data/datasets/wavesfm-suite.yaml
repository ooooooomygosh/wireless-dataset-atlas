- key: time_series
  status: derivable
  note: {en: 'HAS CSI samples span T consecutive timestamps and UWB-Industrial preprocessing can store rec_time, but the shared caches do not keep trajectory or event order across samples.', zh: HAS 的 CSI 样本跨越 T 个连续时刻，UWB-Industrial 预处理可保存 rec_time，但共享缓存不保留样本间的轨迹或事件顺序。}
- key: multiuser
  status: none
  note: {en: 'Each cache row is one user''s channel, and no set of simultaneous users is stored.', zh: 缓存中每一行为单个用户的信道，不存储同时存在的用户集合。}
- key: multibs
  status: none
  note: {en: DeepMIMO caches are generated for one active base station., zh: DeepMIMO 缓存针对单个激活基站生成。}
- key: crossfreq
  status: none
  note: {en: 'Each task uses one band or carrier, and no paired multi-band captures are described.', zh: 每个任务使用单一频段或载频，文档中未描述成对的多频段采集。}
