- {en: 'Confirmed: the shared model accepts different wireless representations. Datasets remain independent and do not form synchronized RGB/CSI/LiDAR observations.', zh: 已确认：共享模型接受不同无线表示；各数据集独立，不形成同步RGB/CSI/LiDAR观测。}
limitations:
