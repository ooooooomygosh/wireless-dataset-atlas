- {en: 'Confirmed: the default is an 80/20 random sample split; generalization to unseen cities, devices, trajectories, or acquisition events requires explicitly rebuilding splits.', zh: 已确认：缺省80/20随机样本划分；城市、设备、轨迹和采集事件外泛化需显式重建划分。}
