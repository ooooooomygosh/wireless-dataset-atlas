summary: {en: 'Evaluation suite whose benchmark tasks use CSI, CIR and IQ data from DeepMIMO, RadioML, POWDER, ICARUS, RadCom, EfficientFi and UWB datasets. The repository includes preprocessing scripts that convert these datasets into HDF5 cache files and fine-tuning code for a ViT-based model.', zh: 评测套件，其基准任务使用来自 DeepMIMO、RadioML、POWDER、ICARUS、RadCom、EfficientFi 和 UWB 数据集的 CSI、CIR 和 IQ 数据。代码仓库包含将这些数据集转换为 HDF5 缓存文件的预处理脚本，以及基于 ViT 模型的微调代码。}
sources: ['https://github.com/AhmedTarek62/wavesfm/blob/main/README.md', 'https://wavesfm.waveslab.ai/benchmarks/', 'https://wavesfm.waveslab.ai/docs/datasets/deepmimo/', 'https://arxiv.org/abs/2511.15162']
checked: '2026-11-06'
pipeline:
  summary: {en: Task-specific preprocessors convert raw data into HDF5 caches. The task registry loads inputs and targets; specified splits and adaptation methods then produce standardized classification or localization metrics., zh: 原始数据经专用预处理器转成HDF5任务缓存，任务注册器加载输入/目标，随后指定划分与适配方式，输出统一的分类或定位指标。}
  stages:
  - title: {en: Identify upstream releases and tasks, zh: 定位上游发布物和任务}
    detail: {en: 'Obtain EfficientFi, CommRad, NR localization, UWB, RadCom, RML2022, POWDER, ICARUS, or DeepMIMO data as required by the task; preserve dataset identity and original splits.', zh: 按任务取得EfficientFi、CommRad、NR定位、UWB、RadCom、RML2022、POWDER、ICARUS或DeepMIMO数据；保留数据集身份和原始划分。}
    inputs:
    - {en: Official task page, zh: 官方任务页}
    - {en: Upstream raw files or scenes, zh: 上游原始文件或场景}
    outputs:
    - {en: Separate raw-data root directories, zh: 独立的原始数据根目录}
    - {en: Task identifiers and label definitions, zh: 任务标识与标签定义}
    controls:
    - {en: 'Author release: tasks have independent frequencies, devices, and label spaces.', zh: 作者发布：各任务的频率、设备和标签空间独立。}
    checks:
    - {en: 'Check original licenses, versions, and acquisition units; do not create fictitious pairings by matching row numbers across modality files.', zh: 核对原始许可、版本和采集单位；不同模态文件不按行号做虚构配对。}
  - title: {en: Run task-specific parsing and physical generation, zh: 执行任务专用解析与物理生成}
    detail: {en: 'Each script converts raw inputs into image-like or I/Q-like tensors. The DeepMIMO branch uses DeepMIMOv3 to generate 32-antenna, 32-subcarrier channels for selected city scenes and BSs, filters samples with LoS=-1, and multiplies channels by 10^6.', zh: 各脚本将原始输入变为图像式或I/Q式张量。DeepMIMO分支使用DeepMIMOv3，在选定城市场景和BS上生成32天线、32子载波信道，过滤LoS=-1样本并乘10^6。}
    inputs:
    - {en: Raw files, zh: 原始文件}
    - {en: Corresponding preprocessing script, zh: 对应preprocessing脚本}
    outputs:
    - {en: Task input tensors, zh: 任务输入张量}
    - {en: Valid sample indices, zh: 有效样本索引}
    controls:
    - {en: 'Author code: DeepMIMO uses six cities by default; the script fixes array rotation, path count, and OFDM grid.', zh: 作者代码：DeepMIMO默认六城；阵列旋转、路径数和OFDM网格由脚本固定。}
    checks:
    - {en: 'Reproduction recommendation: record native shapes and physical sampling intervals; verify complex channel amplitudes before transformation.', zh: 复现建议：记录native shape及物理采样间隔，在变换前核验复信道幅度。}
  - title: {en: Generate labels and reproducible caches, zh: 形成标签与可重建缓存}
    detail: {en: 'DeepMIMO computes codebook beam responses, averages complex responses across frequencies, takes magnitudes, and selects the beam. Inputs can be resized bicubically to 224×224 and standardized using full-cache statistics. It writes sample, label_los, label_beam_{n}, and scenario. Other datasets use task-native labels.', zh: 'DeepMIMO按码本计算beam响应，先对复响应跨频平均、取幅度，再选择beam；输入可bicubic resize至224×224并以全缓存统计标准化。写sample、label_los、label_beam_{n}和scenario。其他数据使用各任务原生标签。'}
    inputs:
    - {en: Input tensors, zh: 输入张量}
    - {en: Original labels or codebook, zh: 原始标签或码本}
    outputs:
    - {en: HDF5 cache, zh: HDF5缓存}
    - {en: Labels and metadata such as mean/std, zh: 标签及mean/std等元数据}
    controls:
    - {en: 'Author code: 64 beams is the default; a cache can store labels for multiple beam counts.', zh: 作者代码：64 beam是默认值；缓存可同时保存多种beam数标签。}
    checks:
    - {en: 'Reproduction recommendation: fit statistics on the training domain and apply them to held-out domains; retain raw CSI for power/SINR utility calculations.', zh: 复现建议：在训练域拟合统计量后应用到留出域；保留原始CSI以计算功率/SINR效用。}
  - title: {en: Load the task and fix evaluation splits, zh: 加载任务并固定评测划分}
    detail: {en: 'data.py selects loaders and output heads by task. Independent val-data is used directly when provided; otherwise, val_split=0.2 produces a random sample split, with optional class stratification.', zh: data.py按task选择加载器和输出头。提供独立val-data时直接使用；否则默认val_split=0.2进行随机样本划分，可选择分类分层。}
    inputs:
    - {en: HDF5 cache, zh: HDF5缓存}
    - {en: task and optional val-data, zh: task和可选val-data}
    outputs:
    - {en: Training/validation Dataset objects, zh: 训练/验证Dataset}
    - {en: Task output dimensions and label types, zh: 任务输出维度与标签类型}
    controls:
    - {en: 'Author code: a random seed controls the split; the default split does not isolate cities or acquisition events.', zh: 作者代码：随机种子控制split；缺省划分不隔离城市或采集事件。}
    checks:
    - {en: 'Reproduction recommendation: for extrapolation studies, create independent caches by city/device/trajectory and connect them through val-data.', zh: 复现建议：外推研究先按城市/设备/轨迹生成独立cache，再通过val-data接入。}
  - title: {en: Adapt the model and verify metric definitions, zh: 适配模型并核对指标口径}
    detail: {en: 'main_finetune.py performs task adaptation. The batch runner defaults to seeds 0/1/2 and supports LP, FT2, and LoRA; current LoRA settings are rank=32 and alpha=64. The website reports means and standard deviations per task.', zh: main_finetune.py执行任务适配；批量runner默认seeds 0/1/2，支持LP、FT2与LoRA，当前LoRA为rank=32、alpha=64。官网逐任务报告均值与标准差。}
    inputs:
    - {en: Fixed split, zh: 固定划分}
    - {en: Pretrained checkpoint or model initialization, zh: 预训练checkpoint或模型初始化}
    - {en: Adaptation mode, zh: 适配模式}
    outputs:
    - {en: Classification or localization evaluation, zh: 分类或定位评价}
    - {en: Adaptation cost and reproduction commands, zh: 适配成本与复现命令}
    controls:
    - {en: 'Author release: the current website version and alpha=32 from the 2025 paper are recorded separately.', zh: 作者发布：当前网站版本与2025论文的alpha=32分别记录。}
    checks:
    - {en: 'Reproduction recommendation: distinguish Top-1 accuracy from mean per-class accuracy; retain meters for localization and compute task utility separately.', zh: 复现建议：分类同时区分Top-1与mean per-class accuracy，定位保留米单位；任务效用另行计算。}
  scope: {en: 'The WavesFM v1.0 public evaluation suite; the DeepMIMO branch illustrates verifiable generation details, while other tasks use their respective preprocessors.', zh: WavesFM v1.0公开评估套件；用DeepMIMO分支展示可核验的生成细节，其他任务按各自预处理器运行。}
