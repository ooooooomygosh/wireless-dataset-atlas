usage:
- {en: 'Start with the official task page to identify upstream data, cache keys, and label semantics.', zh: 先从官网任务页定位上游数据、缓存键与标签语义。}
- {en: Run the corresponding preprocessing script and record input scales and split units in the configuration., zh: 运行对应preprocessing脚本，把输入尺度和划分单位记录到配置。}
- {en: Select a task through main_finetune.py and use independent val-data to fix the evaluation set., zh: 通过main_finetune.py选择task，并用独立val-data固定评测集合。}
- {en: 'Compare seeds and adaptation configurations from run_finetune_all.py; for beam tasks, also report normalized gain and communication utility.', zh: 按run_finetune_all.py的seed与适配配置比较；波束任务另补归一化收益和通信效用。}
field_notes:
- label: {en: CSI, zh: CSI}
  text: {en: 'CSI branches build caches from upstream releases or DeepMIMO scenarios. The repository supplies preprocessing and evaluation interfaces; other tasks consume I/Q, spectrograms, or CIR.', zh: CSI分支由上游发布物或DeepMIMO场景生成缓存；仓库本身提供预处理和评估接口，其他任务消费I/Q、频谱图或CIR。}
- label: {en: Position, zh: 位置}
  text: {en: '5G NR and UWB localization tasks use position-regression targets, with coordinates and units defined by their respective protocols.', zh: 5G NR与UWB定位任务消费位置回归目标，坐标和单位按各自协议。}
- label: {en: Beam labels, zh: 波束标签}
  text: {en: 'The DeepMIMO subtask generates label_beam_{n} using a specified codebook, with 64 beams by default. Labels select the largest response after coherent averaging across frequencies.', zh: 'DeepMIMO子任务由指定码本产生label_beam_{n}；默认64波束，标签由相干跨频响应平均后选最大项。'}
- label: {en: RGB, zh: RGB}
  text: {en: Image-like refers to spectrograms or CSI tensors; visible-light RGB environment photographs are not included., zh: image-like指频谱图或CSI张量；未包含可见光RGB环境照片。}
- label: {en: Radar, zh: 雷达}
  text: {en: RADCOM classifies radar/communication signals; this interface provides no range-Doppler ground truth for target detection., zh: RADCOM用于雷达/通信信号类别识别；此接口没有目标检测用的距离-多普勒真值。}
- label: {en: Time, zh: 时间}
  text: {en: 'The temporal dimension has different meanings across I/Q, CIR, and CSI tasks. The current shared cache format does not guarantee isolation by trajectory, event, or timestamp.', zh: 时间维含义随I/Q、CIR和CSI任务变化；当前统一缓存不保证轨迹、事件或时间戳隔离。}
paper_summary:
- label: {en: System, zh: 系统}
  text: {en: 'I/Q and image-based wireless representations use separate input projections into a shared ViT, pretrained through reconstruction with 70% masking.', zh: I/Q与图像式无线表示用独立输入投影接入共享ViT；70%遮挡重建预训练。}
- label: {en: Prediction target, zh: 预测对象}
  text: {en: 'RF identity, interference, activity/signal classes, and NR position.', zh: RF身份、干扰、活动/信号类别及NR位置。}
- label: {en: Decision target, zh: 决策目标}
  text: {en: The paper evaluates classification and localization; communication scheduling and net rate have not been evaluated., zh: 论文评价分类和定位任务；通信调度或净速率尚未评估。}
- label: {en: Protocol, zh: 评估协议}
  text: {en: Pretraining uses 3200 spectrograms and 3200 I/Q samples; 5 downstream task types and 6 metric columns. LP still trains input projections; the paper sets both LoRA rank and alpha to 32., zh: 3200个频谱图和3200个I/Q样本预训练；5类下游任务、6个指标列。LP仍训练输入投影；论文LoRA rank/alpha均32。}
- label: {en: Key finding, zh: 主要发现}
  text: {en: 'The shared representation covers two input types; Table II reports FT2 localization error of 1.27 m versus 0.41 m for single-modality WavesFM, with gains varying by task and adaptation method.', zh: 共享表示覆盖两类输入；Table II中FT2定位误差为1.27 m，单模态WavesFM为0.41 m，收益随任务和适配方式变化。}
- label: {en: Remaining gap, zh: 尚未解决的问题}
  text: {en: Model parameter counts and pretraining data volumes differ; control both before attributing gains to multimodality. Reproduce the paper's protocol separately from the current 10-dataset evaluation suite., zh: 模型参数量和预训练数据量不同，需要控制这两项再归因于多模态；论文协议与当前10数据集评估套件分开复现。}
tools: [project-wavesfm-suite]
overview: {en: 'WavesFM is the evaluation and fine-tuning code for the multimodal wireless foundation model in arXiv:2511.15162 by Aboulfotouh and Abou-Zeid (2025). The repository converts each upstream dataset into an HDF5 cache for one task and trains a shared ViT with a task-specific head. The v1.0 benchmark page lists 10 upstream datasets in 13 task rows: 5G NR positioning, CommRad RF, DeepMIMO beam prediction and LoS/NLoS, EfficientFi WiFi sensing, ICARUS interference detection and classification, POWDER RF fingerprinting, RADCOM, RML2022, and UWB indoor and industrial localization. Each row is evaluated with linear probing (LP), partial fine-tuning (FT2) and LoRA (R=32, alpha=64) over 3 seeds, reported as mean and standard deviation. The caches are built from the upstream releases, and the README asks users to credit each dataset''s owners. The DeepMIMO subset is generated from DeepMIMOv3 scenarios. The paper''s model takes IQ streams and image-like inputs through separate embeddings
    and is pretrained with masked modeling at a 70% mask ratio.', zh: 'WavesFM 是 arXiv:2511.15162 多模态无线基础模型的评测与微调代码，作者为 Aboulfotouh 与 Abou-Zeid（2025）。仓库将每个上游数据集转换为一个任务对应的 HDF5 缓存，并训练共享的 ViT 加任务专用头。v1.0 基准页面列出 10 个上游数据集、13 个任务行：5G NR 定位、CommRad RF、DeepMIMO 波束预测与 LoS/NLoS、EfficientFi WiFi 感知、ICARUS 干扰检测与分类、POWDER RF 指纹识别、RADCOM、RML2022，以及 UWB 室内与工业定位。每行在线性探测（LP）、部分微调（FT2）和 LoRA（R=32，alpha=64）下评测，基于 3 个随机种子报告均值与标准差。缓存由上游发布的数据构建，README 要求注明各数据集的所有者。DeepMIMO 子集由 DeepMIMOv3 场景生成。论文模型通过独立嵌入接收 IQ 流与类图像输入，并以 70% 掩码比例进行掩码建模预训练。'}
signal_details:
- signal: csi
  text: {en: 'CSI caches come from DeepMIMO scenarios generated with DeepMIMOv3, and from the 5G NR and WiFi sets. DeepMIMO channels are scaled by 1e6, filtered for invalid users, and converted from complex values to real and imaginary channels. Beam labels label_beam_{n} use a codebook of n beams over a 180-degree field of view, with n set to 16, 32 or 64 (default 64). The 5G NR positioning task regresses UE location from CSI obtained with sounding reference signals. The EfficientFi task uses Wi-Fi CSI recorded between two access points with three antennas each while subjects perform six activities.', zh: 'CSI 缓存来自 DeepMIMOv3 生成的 DeepMIMO 场景，以及 5G NR 与 WiFi 数据集。DeepMIMO 信道乘以 1e6 缩放，剔除无效用户，并将复数 CSI 转换为实部与虚部通道。波束标签 label_beam_{n} 基于 180 度视场内的 n 个波束码本生成，n 可取 16、32 或 64（默认 64）。5G NR 定位任务使用探测参考信号获得的 CSI 回归 UE 位置。EfficientFi 任务使用两个接入点之间、各带三根天线的 Wi-Fi CSI，记录受试者执行六种活动时的数据。'}
- signal: cir
  text: {en: 'CIR tensors feed the two UWB localization tasks, UWB indoor positioning and tracking and UWB industrial localization. The README lists both as position regression on IQ-like CIR tensors. The industrial task uses an official train/test split, and its data are linked from the channel impulse response page of cmutschler.de.', zh: CIR 张量用于两个 UWB 定位任务：UWB 室内定位与跟踪，以及 UWB 工业定位。README 将两者都列为基于类 IQ 形式 CIR 张量的位置回归。工业定位任务使用官方的训练/测试划分，其数据链接至 cmutschler.de 的信道冲激响应页面。}
- signal: iq
  text: {en: 'IQ-style caches store (2,C,T) tensors with an integer class label or a vector target. They serve RML2022 modulation classification, RADCOM classification from IQ, POWDER RF fingerprinting, and ICARUS interference detection and classification.', zh: 'IQ 类缓存以 (2,C,T) 张量存储，标签为整数类别或向量目标。用于 RML2022 调制分类、基于 IQ 的 RADCOM 分类、POWDER RF 指纹识别，以及 ICARUS 干扰检测与分类。'}
