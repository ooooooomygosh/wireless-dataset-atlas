summary: {en: 'Generator: an open-source ns-3 module for simulating 3GPP NR (5G New Radio) cellular networks, with simulation outputs such as RSRP/RSRQ measurements and uplink transport-block results.', zh: 生成器：一个开源 ns-3 模块，用于仿真 3GPP NR（5G 新空口）蜂窝网络，输出包括 RSRP/RSRQ 测量值和上行传输块结果等仿真数据。}
sources: ['https://5g-lena.cttc.es/blog/36/', 'https://5g-lena.cttc.es/blog/35/', 'https://5g-lena.cttc.es/features/roadmap/', 'https://5g-lena.cttc.es/papers/', 'https://5g-lena.cttc.es/download/', 'https://gitlab.com/cttc-lena/nr', 'https://arxiv.org/abs/1911.05534', 'https://gitlab.com/cttc-lena/nr/-/raw/master/README.md', 'https://gitlab.com/cttc-lena/nr/-/raw/master/examples/cttc-nr-demo.cc', 'https://api.crossref.org/works/10.1016/j.simpat.2019.101933', 'http://export.arxiv.org/api/query?id_list=1911.05534', 'https://gitlab.com/cttc-lena/nr/-/releases', 'https://gitlab.com/api/v4/projects/cttc-lena%2Fnr/releases?per_page=50']
checked: '2026-11-06'
pipeline:
  summary: {en: 'Pin the ns-3 and NR module versions and build an example, then set up topology, spectrum and devices, protocols and traffic, and run the simulation. FlowMonitor reports flow statistics, and PHY and MAC traces must be enabled explicitly. Results depend on the complete link and protocol configuration.', zh: 固定 ns-3 与 NR 模块版本并构建示例，然后依次设置拓扑、频谱与设备、协议与业务，运行仿真。FlowMonitor 输出流统计，PHY 与 MAC trace 需显式开启。结果取决于整条链路与协议配置。}
  stages:
  - title: {en: Pin compatible ns-3 and NR module versions, zh: 固定兼容的 ns-3 与 NR 模块版本}
    detail: {en: 'The README version table pairs 5g-lena-v5.0.y and v5.1.y with ns-3.48. Release v5.1 recommends the ns-3 MR2929 spectrum channel fix, and FDD simulations run before the v5.0 fix may need revalidation.', zh: README 版本表将 5g-lena-v5.0.y 与 v5.1.y 配套 ns-3.48。v5.1 建议合入 ns-3 MR2929 频谱信道修复，v5.0 修复之前运行的 FDD 仿真结果可能需要重新验证。}
    inputs:
    - {en: ns-3 and NR module source code, zh: ns-3 与 NR 模块源码}
    outputs:
    - {en: Built example executable and version record, zh: 构建好的示例程序与版本记录}
    checks:
    - {en: Record the ns-3 and NR module versions together with any added patches, zh: 记录 ns-3 与 NR 模块版本及额外补丁}
  - title: {en: Set up topology and random streams, zh: 设置拓扑与随机流}
    detail: {en: 'The demo places nodes with GridScenarioHelper, with a default BS height of 10 m and UT height of 1.5 m, and assigns random streams with NrHelper::AssignStreams().', zh: 'demo 使用 GridScenarioHelper 放置节点，默认基站高度 10 m、终端高度 1.5 m，并通过 NrHelper::AssignStreams() 分配随机流。'}
    outputs:
    - {en: Nodes with positions and assigned random streams, zh: 带位置与已分配随机流的节点}
  - title: {en: 'Configure bands, BWPs, channel and antennas', zh: 配置频带、BWP、信道与天线}
    detail: {en: 'The demo splits the bandwidth into two BWPs with numerologies 4 and 2 by default, and divides a total transmit power of 35 dBm among them in proportion to bandwidth. It uses IdealBeamformingHelper with DirectPathBeamforming, a 4×8 gNB array, a 2×4 UE array and isotropic elements.', zh: demo 将带宽划分为两个 BWP，默认 numerology 为 4 和 2，并按带宽比例把总发射功率 35 dBm 分配到各 BWP。使用 IdealBeamformingHelper 与 DirectPathBeamforming，gNB 天线阵列为 4×8，UE 天线阵列为 2×4，阵元为全向模型。}
    checks:
    - {en: 'Check the power split across BWPs, which the demo computes from bandwidth ratios', zh: 检查各 BWP 的功率分配，demo 按带宽比例计算各 BWP 发射功率}
  - title: {en: 'Configure protocols, routing and traffic', zh: 配置协议、路由与业务}
    detail: {en: 'The demo installs the internet stack on the UEs, creates dedicated bearers for low-latency and voice traffic, maps them to BWPs through the BWP manager algorithm, and stops the server and client applications at simTime.', zh: demo 为 UE 安装互联网协议栈，为低时延与语音业务建立专用承载，通过 BWP 管理算法将其映射到不同 BWP，并在 simTime 停止服务端与客户端应用。}
    outputs:
    - {en: End-to-end traffic scenario with two bearer classes, zh: 包含两类承载的端到端业务场景}
    checks:
    - {en: 'Keep scheduler, traffic and protocol settings identical across comparisons', zh: 比较时保持调度、业务与协议设置一致}
  - title: {en: Run the simulation and collect traces, zh: 运行仿真并收集 trace}
    detail: {en: 'The demo runs Simulator::Run() until simTime and installs FlowMonitor on the endpoint nodes. The EnableTraces call is commented out, so PHY and MAC traces are produced only after it is enabled.', zh: 'demo 运行 Simulator::Run() 直至 simTime，并在端节点安装 FlowMonitor。EnableTraces 调用处于注释状态，需显式开启后才输出 PHY 与 MAC trace。'}
    outputs:
    - {en: 'FlowMonitor flow statistics, and PHY and MAC traces when enabled', zh: FlowMonitor 流统计，以及开启后的 PHY 与 MAC trace}
    checks:
    - {en: Check flows with zero received packets and unfinished queues, zh: 检查接收包数为零的流与未完成的队列}
  - title: {en: Compute KPIs and policy samples, zh: 计算 KPI 与策略样本}
    detail: {en: 'The demo writes per-flow offered load and throughput from FlowMonitor to an output file. Latency, packet loss and fairness must be computed from the statistics, and learning tasks need observations available at each decision time.', zh: demo 将 FlowMonitor 中各流的发送负载与吞吐写入输出文件。时延、丢包与公平性需由统计量另行计算；学习任务需按各决策时刻可用的观测构造样本。}
    outputs:
    - {en: Per-flow throughput file and researcher-defined policy samples, zh: 各流吞吐文件与研究者定义的策略样本}
    checks:
    - {en: Compare baselines with identical trace definitions, zh: 用相同的 trace 定义比较基线}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: FlowMonitor flow statistics and a per-flow throughput output file from the demo. PHY and MAC traces are produced when enabled explicitly., zh: demo 生成的 FlowMonitor 流统计与各流吞吐输出文件。PHY 与 MAC trace 需显式开启后生成。}
- label: {en: Derived outputs, zh: 派生输出}
  text: {en: 'Throughput, latency, packet loss and fairness are computed by the user from the statistics. AI-mode examples use ns3-gym to exchange observations and actions.', zh: 吞吐、时延、丢包与公平性由用户根据统计量计算。AI 模式示例通过 ns3-gym 交换观测与动作。}
provenance:
- {en: 'Topology, mobility, traffic, and protocol configuration', zh: 拓扑、移动、业务与协议配置}
- {en: Propagation and spectrum channel models, zh: 传播与频谱信道模型}
- {en: PHY abstraction + MAC/RLC/RRC, zh: PHY abstraction + MAC/RLC/RRC}
- {en: Packet and scheduling events, zh: 包与调度事件}
- {en: 'Throughput, latency, and handover/failure traces', zh: 吞吐、时延、handover/失效 trace}
technical_notes:
- {en: 'v5.1 is paired with ns-3.48, and its release notes recommend the ns-3 MR2929 spectrum channel fix.', zh: v5.1 与 ns-3.48 配套，其发行说明建议加入 ns-3 MR2929 频谱信道修复。}
- {en: The v5.0 announcement says the earlier 3GPP spectrum model could give FDD UEs up to 30 dB less received power under NLoS conditions. TDD is not affected., zh: v5.0 公告称，早期 3GPP 频谱模型在 NLoS 条件下可使 FDD 用户的接收功率降低最多 30 dB，TDD 不受影响。}
- {en: 'Source conflict: the README table gives July 3, 2026 for v5.0, while the blog post is dated July 5, 2026.', zh: 来源冲突：README 版本表给出 v5.0 日期为 2026 年 7 月 3 日，博客文章日期为 2026 年 7 月 5 日。}
limitations:
- {en: 'ISAC, RIS and near-field items on the roadmap are planned work, not current data capabilities.', zh: 路线图中的 ISAC、RIS 与近场项目属于规划工作，并非当前的数据能力。}
- {en: 'The repository is a simulator module rather than a published dataset, so every output is a simulation result.', zh: 代码库是仿真器模块而非已发布的数据集，因此所有输出均为仿真结果。}
history:
- {en: '2019-11-13: arXiv:1911.05534 posted. The journal paper was published in Simulation Modelling Practice and Theory, vol. 96, in November 2019.', zh: '2019 年 11 月 13 日：arXiv:1911.05534 发布。期刊论文于 2019 年 11 月发表于 Simulation Modelling Practice and Theory，第 96 卷。'}
- {en: '2026-07-05: v5.0 released, compatible with ns-3.48. The README table gives July 3, 2026.', zh: 2026 年 7 月 5 日：v5.0 发布，兼容 ns-3.48。README 版本表给出的日期为 2026 年 7 月 3 日。}
- {en: '2026-08-06: v5.1 released, with FDD handover support and mobility calibration against 3GPP TR 36.839.', zh: 2026 年 8 月 6 日：v5.1 发布，支持 FDD 切换，并依据 3GPP TR 36.839 校准移动性。}
usage:
- {en: 'Fix the ns-3 and NR module versions from the README compatibility table, then build the example.', zh: 依据 README 兼容表固定 ns-3 与 NR 模块版本，然后构建示例。}
- {en: 'Run the demo or calibration examples with explicit random streams set through NrHelper::AssignStreams().', zh: '运行 demo 或校准示例时，通过 NrHelper::AssignStreams() 设置显式随机流。'}
- {en: Enable EnableTraces explicitly to export PHY and MAC traces. Check the definitions of the RadioLinkFailureCause and HandoverTotalTime traces before comparing handover results., zh: 需显式开启 EnableTraces 以导出 PHY 与 MAC trace。比较切换结果前，先核对 RadioLinkFailureCause 与 HandoverTotalTime trace 的定义。}
overview: {en: '5G-LENA is an open-source NR module for the ns-3 network simulator, developed by the CTTC OpenSim research group and distributed under GPLv2. The module simulates 3GPP NR radio access networks, including PHY, MAC, RLC, PDCP, RRC, scheduling, beamforming, mobility and traffic models. The 2019 paper (DOI 10.1016/j.simpat.2019.101933; arXiv:1911.05534) describes an end-to-end NR network with bandwidth-part handling, and its calibration results are checked against 3GPP procedures. The module produces simulation results, not measured data, so the outputs depend on the channel and protocol models used in each example. The current releases are v5.0 (July 2026) and v5.1 (August 2026), both paired with ns-3.48. Release v5.0 fixes a 3GPP spectrum-model bug that could reduce received power by up to 30 dB for NLoS UEs in FDD, and the fix is an upstream ns-3 patch. The download page does not describe output file formats, and the repository is a C++ module with examples and documentation
    rather than a published dataset.', zh: '5G-LENA 是 ns-3 网络仿真器的开源 NR 模块，由 CTTC OpenSim 研究组开发，采用 GPLv2 许可。该模块仿真 3GPP NR 无线接入网，涵盖 PHY、MAC、RLC、PDCP、RRC、调度、波束成形、移动性与业务模型。2019 年论文（DOI 10.1016/j.simpat.2019.101933；arXiv:1911.05534）描述了支持 bandwidth part 处理的端到端 NR 网络，其校准结果已对照 3GPP 流程检验。该模块输出仿真结果而非实测数据，结果取决于各示例所用的信道与协议模型。当前版本为 v5.0（2026 年 7 月）和 v5.1（2026 年 8 月），均与 ns-3.48 配套。v5.0 修复了一个 3GPP 频谱模型缺陷，该缺陷可使 FDD 中 NLoS 用户的接收功率降低最多 30 dB，修复为 ns-3 上游补丁。下载页未说明输出文件格式，代码库是带示例与文档的 C++ 模块，并非已发布的数据集。'}
signal_details:
- signal: kpi
  text: {en: 'Simulation outputs include FlowMonitor flow statistics, which the demo converts to per-flow throughput, and the radio-link-failure cause and total handover time traces added in v5.1. The roadmap also lists DL/UL REM maps (v1.0), REM SIR/SINR maps (v2.1), KPI reproducibility regression (v2.4) and calibration regression CI jobs (v4.1). The 2019 paper reports end-to-end performance indicators, with particular emphasis on end-to-end latency.', zh: 仿真输出包括 FlowMonitor 流统计（demo 将其转换为各流吞吐），以及 v5.1 新增的无线链路失败原因与总切换时间 trace。路线图还列出 DL/UL REM 地图（v1.0）、REM SIR/SINR 地图（v2.1）、KPI 可复现性回归（v2.4）和校准回归 CI 任务（v4.1）。2019 年论文报告端到端性能指标，并特别强调端到端时延。}
capabilities:
- key: csi
  status: simulate
  note: {en: CSI-RS and sub-band CSI feedback are simulated inside a run (NR-v4.0); the sources do not describe a channel-matrix export., zh: CSI-RS 与子带 CSI 反馈在仿真运行中生成（NR-v4.0）；来源未描述信道矩阵的导出。}
- key: cir
  status: unknown
  note: {en: The sources do not describe exporting impulse responses; they are computed inside a run with the 3GPP or Sionna RT model., zh: 来源未描述冲激响应的导出；其在运行中由 3GPP 或 Sionna RT 模型计算。}
- key: paths
  status: unknown
  note: {en: The sources do not describe exporting per-path parameters from the 3GPP or Sionna RT channel model., zh: 来源未描述从 3GPP 或 Sionna RT 信道模型导出逐路径参数。}
- key: interaction
  status: unknown
  note: {en: The sources do not describe per-path interaction outputs., zh: 来源未描述逐路径交互输出。}
- key: power
  status: simulate
  note: {en: RSRP and RSRQ measurement reports are produced by a simulation run., zh: RSRP 与 RSRQ 测量报告由仿真运行产生。}
- key: iq
  status: none
  note: {en: The PHY is modelled by link abstraction for system-level simulation; no waveform-level I/Q output is described., zh: PHY 采用链路抽象进行系统级仿真；未描述波形级 I/Q 输出。}
- key: beam_labels
  status: unknown
  note: {en: 'Beams are selected inside a run, but the sources describe no beam-index or per-beam gain output.', zh: 波束在运行中选取，但来源未描述波束索引或逐波束增益输出。}
- key: position
  status: simulate
  note: {en: Node positions are inputs set by the scenario helpers and mobility models., zh: 节点位置由场景辅助类与移动模型设定，属于仿真输入。}
- key: geometry
  status: unknown
  note: {en: The sources do not say whether any 3D scene is shipped with the module or the Sionna RT demo., zh: 来源未说明模块或 Sionna RT 示例是否附带三维场景。}
- key: materials
  status: unknown
  note: {en: The sources do not describe material parameters., zh: 来源未描述材料参数。}
- key: rgb
  status: none
  note: {en: The module has no camera or sensor model., zh: 模块不包含相机或传感器模型。}
- key: depth
  status: none
  note: {en: The module has no depth sensor model., zh: 模块不包含深度传感器模型。}
- key: lidar
  status: none
  note: {en: The module has no LiDAR model., zh: 模块不包含 LiDAR 模型。}
- key: radar
  status: none
  note: {en: ISAC is listed as planned on the roadmap; the current release has no radar sensing output., zh: 路线图将 ISAC 列为计划项；当前版本无雷达感知输出。}
- key: imu
  status: none
  note: {en: The module has no inertial sensor model., zh: 模块不包含惯性传感器模型。}
- key: time_series
  status: simulate
  note: {en: Time-stamped traces and FlowMonitor statistics come from a run; PHY and MAC traces must be enabled explicitly., zh: 带时间戳的 trace 与 FlowMonitor 统计来自仿真运行；PHY 与 MAC trace 需显式开启。}
- key: multiuser
  status: simulate
  note: {en: The number of UEs per gNB is a command-line setting of the demo (default 2)., zh: 每个 gNB 的 UE 数量为示例程序的命令行参数（默认 2）。}
- key: multibs
  status: simulate
  note: {en: The number of gNBs is a command-line setting of the demo (default 1)., zh: gNB 数量为示例程序的命令行参数（默认 1）。}
- key: crossfreq
  status: simulate
  note: {en: The demo configures two carriers (28 GHz and 28.2 GHz) with separate numerologies in one run., zh: 示例在同一次运行中配置两个载频（28 GHz 与 28.2 GHz）及各自的 numerology。}
- key: near_field
  status: none
  note: {en: 'Near-field models are listed as planned, not in the current release.', zh: 近场模型列为计划项，不在当前版本中。}
- key: high_mobility
