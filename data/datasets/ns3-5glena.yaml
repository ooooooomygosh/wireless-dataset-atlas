- key: scattering
  status: unknown
  note: {en: The sources do not list the enabled interaction types for the channel models., zh: 来源未列出信道模型启用的交互类型。}
- key: transmission
  status: unknown
  note: {en: The sources do not list the enabled interaction types for the channel models., zh: 来源未列出信道模型启用的交互类型。}
- key: polarization
  status: simulate
  note: {en: 'Dual-polarised MIMO (two polarisations) is a run configuration, added in NR-v2.0.', zh: 双极化 MIMO（两个极化）为仿真配置项，于 NR-v2.0 加入。}
- key: em_field
  status: unknown
  note: {en: The sources do not describe field-level outputs., zh: 来源未描述场级输出。}
versions:
- version: v5.1
  date: '2026-08-06'
  summary: {en: 'Compatible with ns-3.48. FDD cells advertise the UL carrier in SIB1 and handover works between FDD cells; adds mobility state estimation (TR 36.839) and an optional TR 36.839 handover failure model, plus RLF-cause and handover-time traces.', zh: 兼容 ns-3.48。FDD 小区在 SIB1 中公布上行载波，并支持 FDD 小区间切换；新增 TR 36.839 移动性状态估计及可选的 TR 36.839 切换失败模型，并输出无线链路失败原因与切换时间 trace。}
  url: https://gitlab.com/cttc-lena/nr/-/releases/v5.1
- version: v5.0
  date: '2026-07-05'
  summary: {en: 'Compatible with ns-3.48. Fixes an FDD spectrum-model bug that could give NLoS UEs up to 30 dB less power (ns-3 MR2929); overhauls handover, RRC and radio link failure; corrects the UE measurement chain (linear RSRP averaging, interference-aware RSRQ); adds a Sionna RT demo and a LEO NTN example.', zh: 兼容 ns-3.48。修复 FDD 频谱模型中 NLoS 用户接收功率可低 30 dB 的问题（ns-3 MR2929）；重构切换、RRC 与无线链路失败流程；修正 UE 测量链（线性域 RSRP 平均、考虑干扰的 RSRQ）；新增 Sionna RT 示例与 LEO NTN 示例。}
  url: https://gitlab.com/cttc-lena/nr/-/releases/v5.0
- version: v4.2
  date: '2026-03-05'
  summary: {en: Compatible with ns-3.47. Fixes a long-standing RLC UM reassembly bug; a single CellId per gNB and BWPIds local to each gNB; ARFCN-based carrier configuration., zh: 兼容 ns-3.47。修复长期存在的 RLC UM 重组缺陷；每个 gNB 使用单一 CellId，BWPId 限定在各 gNB 内；采用基于 ARFCN 的载波配置。}
  url: https://gitlab.com/cttc-lena/nr/-/releases/v4.2
- version: v4.1.1
  date: '2025-10-16'
  summary: {en: 'Compatible with ns-3.46. Uses the upstreamed hexagonal wraparound model; removes NrHelper::EnableMimoFeedback, so MIMO feedback follows NrHelper::CsiFeedbackFlags; clang-format and clang-tidy upgrades.', zh: '兼容 ns-3.46。采用已合入上游的六边形环绕模型；移除 NrHelper::EnableMimoFeedback，MIMO 反馈改由 NrHelper::CsiFeedbackFlags 决定；升级 clang-format 与 clang-tidy。'}
  url: https://gitlab.com/cttc-lena/nr/-/releases/v4.1.1
- version: v4.1
  date: '2025-07-07'
  summary: {en: 'Compatible with ns-3.45. Adds the resource assignment matrix, wraparound and hexagonal deployments, FastFadingConstantPositionMobilityModel, random TDMA and OFDMA schedulers, and updated calibration examples.', zh: 兼容 ns-3.45。新增资源分配矩阵、环绕与六边形部署、FastFadingConstantPositionMobilityModel、随机 TDMA 与 OFDMA 调度器，并更新标定示例。}
  url: https://gitlab.com/cttc-lena/nr/-/releases/v4.1
