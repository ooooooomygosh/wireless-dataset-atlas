- {en: Export flow/PHY/MAC traces and check the definitions of handover and failure., zh: 导出 flow/PHY/MAC traces 并检查 handover/失败定义。}
overview: {en: '5G-LENA is an open-source NR module for the ns-3 network simulator, developed by the CTTC OpenSim research group and distributed under GPLv2. The module simulates 3GPP NR radio access networks, including PHY, MAC, RLC, PDCP, RRC, scheduling, beamforming, mobility and traffic models. The 2019 paper (DOI 10.1016/j.simpat.2019.101933; arXiv:1911.05534) describes an end-to-end NR network with multiple bandwidth part handling, and its calibration results are checked against 3GPP procedures. The module produces simulation results, not measured data, so the outputs depend on the channel and protocol models used in each example. The current releases are v5.0 (July 2026) and v5.1 (August 2026), both paired with ns-3.48. Release v5.0 fixes a 3GPP spectrum-model bug that could reduce received power by up to 30 dB for NLoS UEs in FDD. The download page does not describe output file formats, and the repository is a C++ module with examples and documentation rather than a published dataset.',
  zh: '5G-LENA 是 ns-3 网络仿真器的开源 NR 模块，由 CTTC OpenSim 研究组开发，采用 GPLv2 许可。该模块仿真 3GPP NR 无线接入网，涵盖 PHY、MAC、RLC、PDCP、RRC、调度、波束成形、移动性与业务模型。2019 年论文（DOI 10.1016/j.simpat.2019.101933；arXiv:1911.05534）描述了支持多带宽部分（BWP）处理的端到端 NR 网络，其校准结果已与 3GPP 流程对照检验。该模块输出仿真结果而非实测数据，输出内容取决于各示例所用的信道与协议模型。当前版本为 v5.0（2026 年 7 月）和 v5.1（2026 年 8 月），均与 ns-3.48 配套。v5.0 修复了一个 3GPP 频谱模型缺陷，该缺陷可使 FDD 系统中 NLoS 用户的接收功率降低最多 30 dB。'}
signal_details:
- signal: kpi
  text: {en: 'The features page lists simulation traces of radio-link-failure causes and total handover time (v5.1), and DL/UL REM maps and REM SIR/SINR maps (v1.0 and v2.1). KPI reproducibility and calibration regression CI jobs are listed (v2.4 and v4.1). The arXiv abstract names end-to-end performance indicators, with particular emphasis on end-to-end latency.', zh: 功能页列出仿真层的无线链路失败原因与总切换时间追踪（v5.1），以及 DL/UL REM 地图与 REM SIR/SINR 地图（v1.0 与 v2.1）。CI 中包含 KPI 可复现性回归与校准回归检查（v2.4 与 v4.1）。arXiv 摘要提到端到端性能指标，并特别强调端到端时延。}
