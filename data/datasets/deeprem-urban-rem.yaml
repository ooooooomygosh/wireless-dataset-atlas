- {en: 'The README gives the Washington file range as 01700 to 01799, which covers 100 files, while it states 200 maps per area.', zh: 'README 给出的 Washington 文件范围为 01700 至 01799，共 100 个文件，但同时称每个区域 200 幅地图。'}
- {en: 'The sources read do not describe the ray-tracing settings or the material properties.', zh: '所读来源未说明射线追踪设置与材料属性。'}
