summary: {en: 'Simulated urban radio environment maps of RSRP and base-station coverage for nine Colombian and US cities at 10 m resolution, built with Intelligent Ray-Tracing and used for estimating maps from sparse measurements.', zh: '基于 Intelligent Ray-Tracing 仿真的城市无线电环境地图，包含九个哥伦比亚与美国城市的 RSRP 与基站覆盖图，分辨率 10 m，用于从稀疏测量估计无线电环境地图。'}
overview: {en: 'DeepREM Urban REMs is a set of simulated radio environment maps for urban areas. It accompanies the DeepREM paper in IEEE Access (2023). Each map covers an area from 2290 x 3670 m to 3810 x 5160 m at 10 m resolution. The areas are sampled from seven Colombian cities (Armenia, Bogota, Cali, Ibague, Manizales, Medellin and Pasto) and two US cities (Columbus and Washington). The simulations use Intelligent Ray-Tracing with topographic and building vector database information. The release contains RSRP maps in dBm for four transmitters, base-station coverage maps that give the serving transmitter ID from 1 to 4 at each point, and single-transmitter RSRP maps in ASCII format. The README states 1,800 files per map type and 200 maps per area. Transmitter parameters for each area (longitude, latitude, frequency, power and height) are in an Information folder of nine CSV files. The main archive, Urban_REMs_dataset.rar, is about 830 MB, and TestRSRPDataset.zip is about 53 MB. The second Zenodo version adds 400 REMs for four new areas (Barranquilla, Bucaramanga, Popayan and North Pasto), 100 per area. The paper estimates RSRP and coverage from sparse measurements with U-Net and CGAN models, and an interactive application tests both models on this dataset or on user-supplied REMs. The data are licensed under CC BY 4.0.', zh: 'DeepREM 城市无线电环境地图（Urban REMs）是一组城市区域的仿真无线电环境地图，随 IEEE Access 2023 年发表的 DeepREM 论文发布。每幅地图覆盖 2290 x 3670 m 至 3810 x 5160 m 的区域，分辨率为 10 m。区域取自七个哥伦比亚城市（Armenia、Bogota、Cali、Ibague、Manizales、Medellin、Pasto）和两个美国城市（Columbus、Washington）。仿真采用 Intelligent Ray-Tracing 传播模型，输入为地形与建筑矢量数据库信息。发布内容包括：以 dBm 表示的四发射机 RSRP 地图；给出各点服务发射机编号（1 至 4）的基站覆盖图；以及 ASCII 格式的单发射机 RSRP 地图。README 称每类数据共 1,800 个文件，每个区域 200 幅地图。每个区域的发射机参数（经度、纬度、频率、功率与高度）保存在 Information 文件夹的九个 CSV 文件中。主压缩包 Urban_REMs_dataset.rar 约 830 MB，TestRSRPDataset.zip 约 53 MB。第二版在四个新区域（Barranquilla、Bucaramanga、Popayan、North Pasto）中新增 400 幅地图，每个区域 100 幅。论文以 U-Net 与 CGAN 两种模型从稀疏测量估计 RSRP 与覆盖，并提供交互式应用，用于以本数据集或用户提供的 REM 测试两种模型的预测效果。数据采用 CC BY 4.0 许可。'}
pipeline:
  summary: {en: 'Coverage areas from nine cities are simulated with Intelligent Ray-Tracing and exported as RSRP and base-station coverage maps. The second version adds four areas.', zh: '九个城市的覆盖区域使用 Intelligent Ray-Tracing 仿真，并导出为 RSRP 与基站覆盖地图。第二版新增四个区域。'}
  stages:
  - title: {en: Select urban coverage areas, zh: 选取城市覆盖区域}
    detail: {en: 'Areas of 2290 x 3670 m to 3810 x 5160 m are sampled from seven Colombian cities and two US cities.', zh: '从七个哥伦比亚城市和两个美国城市中选取 2290 x 3670 m 至 3810 x 5160 m 的区域。'}
    inputs:
    - {en: Topographic and building vector database information, zh: 地形与建筑矢量数据库信息}
    outputs:
    - {en: Coverage areas at 10 m resolution, zh: 10 m 分辨率的覆盖区域}
  - title: {en: Run Intelligent Ray-Tracing simulations, zh: 运行 Intelligent Ray-Tracing 仿真}
    detail: {en: 'Coverage is simulated with Intelligent Ray-Tracing as the propagation model over the topography and buildings of each area.', zh: '以 Intelligent Ray-Tracing 为传播模型，基于各区域的地形与建筑进行覆盖仿真。'}
    inputs:
    - {en: Topographic and building data, zh: 地形与建筑数据}
    - {en: Transmitter parameters per area, zh: 各区域的发射机参数}
    outputs:
    - {en: RSRP values in dBm for four transmitters, zh: 四个发射机的 RSRP 数值（dBm）}
  - title: {en: Export RSRP and coverage maps, zh: 导出 RSRP 与覆盖地图}
    detail: {en: 'RSRP maps are stored as CSV files for four transmitters and as ASCII files for one transmitter. Base-station coverage maps give the serving transmitter ID from 1 to 4 at each point. Files are grouped by area, 200 per area.', zh: 'RSRP 地图以 CSV 保存四发射机版本，以 ASCII 保存单发射机版本。基站覆盖图给出各点的服务发射机编号（1 至 4）。文件按区域分组，每个区域 200 个。'}
    outputs:
    - {en: 'CSV RSRP and coverage files, ASCII single-transmitter RSRP files and nine transmitter parameter files', zh: 'CSV 格式的 RSRP 与覆盖文件、ASCII 格式的单发射机 RSRP 文件以及九个发射机参数文件'}
  - title: {en: Add second-version areas and interactive app, zh: 加入第二版区域与交互式应用}
    detail: {en: 'The second version adds 400 REMs over four new areas, 100 per area. An interactive Streamlit application tests the U-Net and CGAN models on the dataset or on user-supplied REMs.', zh: '第二版在四个新区域中新增 400 幅 REM，每个区域 100 幅。交互式 Streamlit 应用可用本数据集或用户提供的 REM 测试 U-Net 与 CGAN 模型。'}
    outputs:
    - {en: 'Second-version REMs for Barranquilla, Bucaramanga, Popayan and North Pasto', zh: '巴兰基亚、布卡拉曼加、波帕扬与北帕斯托的第二版 REM'}
