summary: {en: 'About 8 hours of annotated measurements from six participants performing six activities in two rooms, with WiFi CSI, passive WiFi radar, UWB channel impulse response and Kinect v2 skeleton data.', zh: 约 8 小时的标注测量数据，由 6 名参与者在两个房间中执行 6 项活动采集，包含 WiFi CSI、无源 WiFi 雷达、UWB CIR 以及 Kinect v2 骨骼数据。}
