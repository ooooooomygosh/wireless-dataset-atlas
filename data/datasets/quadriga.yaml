overview: {en: 'QuaDRiGa is a MATLAB/Octave software package for generating geometry-based stochastic MIMO channel impulse responses. Fraunhofer HHI developed it, and Jaeckel, Raschkowski, Börner and Thiele described it in IEEE Transactions on Antennas and Propagation (2014). It is a channel generator rather than a fixed dataset: channels are produced on demand from the user''s configuration, and no precomputed channel data are distributed. The README gives a carrier frequency range of 500 MHz to 100 GHz, with 100 MHz bandwidth in standard configurations and 2 GHz in the mmMAGIC configurations. The model implements the 3GPP TR 36.873 and TR 38.901 channel models and the mmMAGIC channel model. Array antennas are freely configurable, and measured or simulated far-field antenna patterns can be imported. Version 2.8 adds site-specific simulations and optional partial GPU acceleration with NVIDIA CUDA. The software license permits non-commercial use only.', zh: QuaDRiGa 是一个 MATLAB/Octave 软件包，用于生成基于几何的随机
    MIMO 信道冲激响应。它由 Fraunhofer HHI 开发，Jaeckel、Raschkowski、Börner 和 Thiele 在 IEEE Transactions on Antennas and Propagation（2014）中对其进行了介绍。它是信道生成器，而非固定数据集：信道根据用户配置按需生成，不发布预先计算的信道数据。README 给出的载频范围为 500 MHz 至 100 GHz，标准配置带宽为 100 MHz，mmMAGIC 配置带宽为 2 GHz。该模型实现了 3GPP TR 36.873 和 TR 38.901 信道模型以及 mmMAGIC 信道模型。阵列天线可自由配置，并可导入实测或仿真的远场天线方向图。2.8 版本增加了站点特定仿真，并可选支持基于 NVIDIA CUDA 的部分 GPU 加速。软件许可仅允许非商业用途。}
signal_details:
- signal: cir
  text: {en: 'Complex MIMO channel impulse responses (CIR) generated on demand by the software. Carrier frequency 500 MHz to 100 GHz. Bandwidth 100 MHz in standard configurations and 2 GHz in mmMAGIC configurations, per the README. Channel data can be written and read with the software''s save and load functions (version 2.6).', zh: 软件按需生成的复数 MIMO 信道冲激响应（CIR）。载频范围为 500 MHz 至 100 GHz。依 README，标准配置带宽为 100 MHz，mmMAGIC 配置带宽为 2 GHz。信道数据可通过软件的保存与加载函数读写（2.6 版本）。}
