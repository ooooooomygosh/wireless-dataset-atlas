id: quadriga
name: QuaDRiGa
year: 2013
organization: Fraunhofer Heinrich Hertz Institute (HHI)
origin: statistical
tasks: [channel-modeling]
signals: [cir]
bands_ghz: []
license: Software License for The QuaDRiGa Channel Model (non-commercial use only)
access: {url: 'https://quadriga-channel-model.de/software/', type: open}
code: ['https://github.com/fraunhoferhhi/QuaDRiGa']
paper: doi:10.1109/tap.2014.2310220
used_in: ['doi:10.1109/tcomm.2023.3260242', 'doi:10.1109/tvt.2019.2907606', 'doi:10.1109/tvt.2018.2865700', 'doi:10.1109/jstsp.2019.2931206', 'doi:10.1109/tcomm.2022.3180388']
citing: ['doi:10.1109/jsac.2017.2719924', 'doi:10.1109/comst.2017.2783541', 'doi:10.1109/tsp.2020.2976585']
summary: {en: QuaDRiGa is a generator of geometry-based stochastic MIMO channel impulse responses for carrier frequencies from 500 MHz to 100 GHz. The output is generated on demand by the software rather than distributed as a fixed dataset., zh: QuaDRiGa 是基于几何的随机 MIMO 信道冲激响应生成器，载频范围为 500 MHz 至 100 GHz。输出由软件按需生成，而非以固定数据集形式发布。}
sources: ['https://github.com/fraunhoferhhi/QuaDRiGa/blob/main/README.md?plain=1', 'https://github.com/fraunhoferhhi/QuaDRiGa/blob/main/QuaDRiGa_License.txt', 'https://quadriga-channel-model.de/software/', 'https://api.crossref.org/works/10.1109/tap.2014.2310220']
checked: '2026-11-06'
pipeline:
  summary: {en: 'Generates correlated large- and small-scale parameters from layouts, trajectories, antennas, and scenario statistics, then synthesizes and merges channels. Random clusters do not automatically represent reflections from real buildings.', zh: 由布局、轨迹、天线和场景统计生成相关的大/小尺度参数，再合成并拼接信道。随机簇不自动对应真实建筑反射点。}
  stages:
  - title: {en: Fix simulation parameters and scenario, zh: 固定仿真参数与场景}
    detail: {en: 'Choose carrier frequency, spatial sampling density, absolute-delay convention, and target scenario; tutorial values are examples, not defaults for every scenario.', zh: 选择载频、空间采样密度、绝对时延口径与目标场景；教程中的数值是示例，不是所有场景默认。}
    inputs:
    - {en: qd_simulation_parameters, zh: qd_simulation_parameters}
    - {en: Scenario parameter set and random seed, zh: 场景参数集与随机种子}
    outputs:
    - {en: Simulation parameter object, zh: 仿真参数对象}
    controls:
    - {en: 'Researcher specifies: center_frequency, sample_density or samples_per_meter, use_absolute_delays, seed', zh: 研究者固定：center_frequency、sample_density或samples_per_meter、use_absolute_delays、seed}
    checks:
    - {en: Check the parameter set's supported frequency/bandwidth range, zh: 检查参数集的频率/带宽适用范围}
    - {en: Record whether pathloss is disabled or baseline options are used, zh: 记录是否禁用pathloss或使用baseline选项}
  - title: {en: Build multilink layouts and arrays, zh: 建立多链路布局和阵列}
    detail: {en: 'Define base stations, terminals, and antennas in qd_layout; patterns, element positions, and orientations contribute to each path''s MIMO response.', zh: 在qd_layout中定义基站、终端和天线；方向图、阵元位置与姿态参与每条路径的MIMO响应。}
    inputs:
    - {en: Tx/Rx positions, zh: Tx/Rx位置}
    - {en: qd_arrayant antennas and polarization, zh: qd_arrayant天线与极化}
    outputs:
    - {en: Network layout with antennas, zh: 带天线的网络布局}
    controls:
    - {en: 'Researcher specifies: Tx/Rx counts, heights, element positions, patterns, and orientations', zh: 研究者固定：Tx/Rx数量、高度、阵元位置、方向图与朝向}
    checks:
    - {en: 'Check consistency of positions, patterns, and center frequency', zh: 检查位置、方向图和中心频率匹配}
    - {en: 'Multiuser correlation should come from a shared layout, not independent random concatenation', zh: 多用户相关性应来自同一布局而非独立随机拼接}
  - title: {en: 'Define trajectories, segments, and scenario changes', zh: 定义轨迹、分段与场景变化}
    detail: {en: 'Interpolate trajectories, calculate orientations, and assign segment scenarios; drifting during motion and spatial consistency at each location are mechanisms that must be explicitly selected.', zh: 插值轨迹、计算朝向，并分配分段场景；移动时的drifting和逐位置空间一致性是需明确选择的机制。}
    inputs:
    - {en: qd_track trajectories, zh: qd_track轨迹}
    - {en: LOS/NLOS scenario sequences and segment locations, zh: LOS/NLOS场景序列及分段位置}
    outputs:
    - {en: 'Sampled trajectories, orientations, and segment/scenario mapping', zh: 采样轨迹、朝向和segment/scenario映射}
    controls:
    - {en: 'Researcher specifies: path length, sampling interval, speed-to-time mapping, segment boundaries', zh: 研究者固定：路径长度、采样间隔、速度到时间映射、分段边界}
    checks:
    - {en: Check that displacement/time is consistent with the Doppler interpretation, zh: 检查位移/时间与Doppler解释一致}
    - {en: Do not treat independently randomized segment channels as continuous mobility sequences, zh: 不要将每段独立随机信道当连续移动序列}
  - title: {en: Initialize the builder and generate correlated parameters, zh: 初始化builder并生成相关参数}
    detail: {en: init_builder creates generators; gen_parameters generates LSP and cluster/subpath parameters. SC_lambda controls small-scale spatial correlation; setting it to 0 disables this mechanism., zh: init_builder建立生成器，gen_parameters生成LSP与簇/子径参数。SC_lambda控制小尺度空间相关，设0会关闭该相关机制。}
    inputs:
    - {en: Layout and scenario parameters, zh: 布局与场景参数}
    - {en: Large-scale correlation matrix/correlation distances and cluster configuration, zh: 大尺度相关矩阵/相关距离及簇配置}
    outputs:
    - {en: Correlated large-scale parameters, zh: 相关大尺度参数}
    - {en: 'Cluster delays, powers, angles, and polarization parameters', zh: 簇时延、功率、角度和极化参数}
    controls:
    - {en: 'Researcher specifies: parameter correlations, cluster count, PerClusterDS, SC_lambda; disclose modifications', zh: 研究者固定：参数相关、簇数、PerClusterDS、SC_lambda；改动须声明}
    checks:
    - {en: Compare correlation between nearby locations against the configuration, zh: 比较邻近位置的相关性与设定一致性}
    - {en: Distinguish scenario statistics from manually modified parameters, zh: 保持场景统计与人为修改参数可区分}
  - title: {en: Synthesize and merge time-varying channels, zh: 合成并合并时变信道}
    detail: {en: 'get_channels generates qd_channel coeff and delay; merge joins segment outputs into a continuous trajectory. Drifting updates angles, delays, and phases; check continuity at segment transitions.', zh: get_channels生成qd_channel的coeff和delay；分段输出经merge形成连续轨迹。drifting更新角度、时延及相位，分段切换需检查连续性。}
    inputs:
    - {en: Builder parameters, zh: builder参数}
    - {en: Arrays and trajectories, zh: 阵列与轨迹}
    outputs:
    - {en: Per-link complex coefficients and delays, zh: 逐链路复系数与时延}
    - {en: Merged trajectory CIR, zh: 合并后的轨迹CIR}
    controls:
    - {en: 'Researcher specifies: drifting/baseline mode, segment merging method, storage axes', zh: 研究者固定：drifting/baseline模式、segment合并方式、存储轴}
    checks:
    - {en: Check for phase/power jumps at segment boundaries, zh: 检查分段边界是否出现相位/功率跳变}
    - {en: 'Recompute SF, K-factor, and delay spread from coefficients and compare with the builder', zh: 从系数重算SF、K-factor和delay spread对照builder}
  - title: {en: Frequency-domain and multifrequency generation, zh: 频域与多频生成}
    detail: {en: 'fr projects path coefficients/delays into the frequency domain; the multifrequency tutorial generates paired outputs using a shared layout, correlated propagation parameters, and per-frequency antennas and losses.', zh: fr把路径系数/时延投影到频域；多频教程通过共享布局及相关传播参数、逐频天线和损耗生成配对输出。}
    inputs:
    - {en: qd_channel, zh: qd_channel}
    - {en: 'Bandwidth and frequency-point count, or a vector of carrier frequencies', zh: 带宽与频点数，或多载频向量}
    outputs:
    - {en: CFR arrays, zh: CFR数组}
    - {en: Correlated channels indexed by carrier frequency, zh: 按载频索引的相关信道}
    controls:
    - {en: 'Researcher specifies: bandwidth, frequency-point count, per-band arrays, and parameter coupling', zh: 研究者固定：带宽、频点数、每频段阵列和参数耦合}
    - {en: Record each shared and varying parameter in the official multifrequency tutorial, zh: 官方多频教程的共同/变化参数应逐项记录}
    checks:
    - {en: Do not mistake frequency indices for time or independent random samples, zh: 不要把频率索引误当时间或独立随机样本}
    - {en: Distinguish model-defined cross-frequency correlation from measured cross-frequency pairing, zh: 区分模型设定的跨频相关与实测跨频配对}
  - title: {en: Construct task samples and validate statistics, zh: 构造任务样本和验证统计}
    detail: {en: 'Generate codebook responses, CSI compression targets, or future windows for the task, retaining the original scale and trajectory grouping.', zh: 研究者按任务生成码本响应、CSI压缩目标或未来窗口，保留原始尺度与轨迹分组。}
    inputs:
    - {en: CIR/CFR and trajectory metadata, zh: CIR/CFR及轨迹元数据}
    - {en: Beam/scheduling or feedback task interfaces, zh: 波束/调度或反馈任务接口}
    outputs:
    - {en: Task tensors and labels, zh: 任务张量与标签}
    - {en: Statistical consistency and downstream utility results, zh: 统计一致性及下游utility结果}
    controls:
    - {en: 'Researcher specifies: normalization, angle-delay truncation, sequence windows, and train/test layouts', zh: 研究者固定：归一化、角延迟截断、序列窗口和训练/测试布局}
    checks:
    - {en: Do not report absolute throughput directly from normalized feedback tensors, zh: 不要用被归一化后的反馈张量直接报告绝对吞吐}
    - {en: Split adjacent windows from the same trajectory as a group, zh: 同轨迹相邻窗口按组切分}
  scope: {en: Geometry-based stochastic channel workflow from official QuaDRiGa MATLAB tutorials; list site-specific inputs separately., zh: QuaDRiGa官方MATLAB教程中的几何随机信道流程；site-specific模式需另列输入。}
facts:
- label: {en: Entry inputs, zh: 入口输入}
  text: {en: '• Typical inputs are scenario statistical parameters, BS/terminal layouts, qd_track trajectories and segments, qd_arrayant arrays, and random state; the generator uses these to produce clusters and propagation parameters.

      • The site-specific extension in 2.8 also accepts 3D meshes to assist LOS/NLOS and indoor-state classification and trajectory scenario segmentation.', zh: '• 常规输入为场景统计参数集、BS/终端布局、qd_track轨迹与分段、qd_arrayant阵列及随机状态；生成器据此产生簇和传播参数。

      • 2.8的site-specific扩展还可输入3D mesh，辅助判定LOS/NLOS、室内状态和轨迹场景分段。'}
- label: {en: Physical model, zh: 物理模型}
  text: {en: '• The core is a geometry-based stochastic channel model: correlated large-scale parameters → cluster/subpath delays, angles, powers, polarization, and scatterer locations → array channels. Random clusters usually are not traced reflection surfaces in a real-world map.

      • Drifting updates path delays, angles, and phases during motion based on scattering geometry; the use_3GPP_baseline branch uses a plane-wave approximation.

      • The official site-specific tutorial determines propagation states from meshes, then invokes the corresponding statistical scenarios; its diff_trans example weights LOS/NLOS powers. This operates at a different level from full multipath RT.', zh: '• 核心是几何随机信道模型：相关大尺度参数→簇/子径时延、角度、功率、极化与散射位置→阵列信道。随机簇通常不是一张实景地图中的已追踪反射面。

      • drifting按散射几何更新运动中的路径时延、角度和相位；use_3GPP_baseline分支使用平面波近似。

      • 官方site-specific教程通过mesh判传播状态，再调用对应统计场景；diff_trans的示例用于LOS/NLOS功率加权。它的作用层次与完整多径RT不同。'}
- label: {en: How the channel is formed, zh: 信道形成方式}
  text: {en: '• layout.init_builder creates generators; gen_parameters produces correlated LSP, SSF, and scatterer locations; get_channels combines antenna patterns, geometry, and trajectories to generate coeff/delay.

      • merge handles transitions between channel segments; qd_channel.fr then projects coefficients and delays onto specified baseband frequencies.

      • The usage option of gen_parameters controls reuse of random fields, LSP, SSF, or generation of missing parameters only; preserve the same propagation realization for controlled comparisons instead of redrawing the random environment whenever arrays change.', zh: '• layout.init_builder建立生成器；gen_parameters产生相关LSP、SSF和散射位置；get_channels结合阵列方向图、几何与轨迹生成coeff/delay。

      • 分段信道经merge处理过渡；qd_channel.fr再把系数和时延投影到指定基带频率。

      • gen_parameters的usage可控制复用随机场、LSP、SSF或仅补缺参数；用于受控对比时应保留同一传播实现，避免每次改阵列都重抽随机环境。'}
- label: {en: Changing the carrier frequency, zh: 改变载频}
  text: {en: '• Changing only fr bandwidth/carriers reuses existing coeff/delay and repeats the baseband frequency-domain projection; it does not change the propagation scenario''s center frequency.

      • Changing center frequency requires regeneration of statistical propagation parameters, pathloss, array responses, and channel coefficients for the target band; also check the trajectory''s spatial sampling density.

      • The official multifrequency tutorial uses a center_frequency vector to generate correlated outputs on a shared layout. LOS/NLOS, node positions, and cluster delays/angles are shared; pathloss, path powers, antennas, spread statistics, K-factor, and XPR vary by frequency.

      • This is an explicitly specified cross-frequency joint model. Label independent runs in two bands separately from paired data generated by a shared model.', zh: '• 只改fr的bandwidth/carriers：复用已有coeff/delay，重新进行基带频域投影；没有改变传播场景的中心频率。

      • 改中心频率：重新生成匹配目标频段的统计传播参数、路径损耗、阵列响应和信道系数；同时检查轨迹的空间采样密度。

      • 官方多频教程用center_frequency向量在共同布局上生成相关输出。LOS/NLOS、节点位置、簇时延/角度等共享；路径损耗、路径功率、天线、扩展统计量、K-factor和XPR按频率变化。

      • 这是一种显式设定的跨频联合模型。独立运行两个频段与共享模型生成的配对数据，应分别标注。'}
- label: {en: Changing the array or codebook, zh: 改变阵列或码本}
  text: {en: '• With layout, frequency, and generated LSP/SSF/scatterer locations fixed, update the Tx/Rx arrays in the builder, then run get_channels and fr to obtain channels for the new arrays.

      • get_channels recomputes patterns, polarization, element phases, and per-element geometric delays in drifting mode; array-only comparisons do not require randomly regenerating clusters.

      • qd_arrayant.element_position is in meters. When changing center_frequency, reconstruct or adjust element positions if the study requires fixed spacing in wavelengths; for a fixed physical aperture, preserve actual positions and use suitable patterns.

      • Usage: if only the codebook changes and full complex CSI is retained, recompute codebook responses and labels under the same channel convention. Top-K powers alone cannot recover responses to arbitrary new beams.', zh: '• 固定布局、频率和已生成的LSP/SSF/散射位置时，更新builder中的Tx/Rx阵列，再运行get_channels和fr即可得到新阵列的信道。

      • get_channels重新计算方向图、极化、阵元相位，以及drifting模式下的逐阵元几何时延；不需要为单纯阵列对照重新随机生成簇。

      • qd_arrayant.element_position以米为单位。改变center_frequency时，若研究目标是固定λ间距，应重新构造或调整阵元位置；固定米制孔径则保留实际位置并更换适用的方向图。

      • 使用步骤：只换码本且保留完整复CSI时，按同一信道约定重算码本响应和标签即可；只保留Top-K功率时无法补出任意新波束的响应。'}
- label: {en: Meaning of time, zh: 时间含义}
  text: {en: '• Trajectories first define spatial positions and segments; speed/motion profiles map positions to time to generate spatially continuous channels.

      • Drifting handles evolution within a segment, while merge handles transitions between adjacent scenarios/clusters. This represents model-defined motion and statistical nonstationarity.

      • When changing only the speed profile along the same path, sufficiently dense spatial channel samples can be remapped in time using interpolate_movement and channel.interpolate as in the official tutorial; changes to trajectory shape, scenario segmentation, or propagation states require recomputing the affected channels.', zh: '• 轨迹首先定义空间位置和分段；速度/运动profile将位置映射到时间，生成空间连续的信道。

      • drifting负责段内演化，merge负责相邻场景/簇的过渡。它表达模型设定的运动和统计非平稳性。

      • 仅改同一路径的速度profile，在原信道空间采样足够时可按官方教程用interpolate_movement和channel.interpolate重新映射时间；改变轨迹形状、场景分段或传播状态则需重算相关信道。'}
- label: {en: Changing blockage, zh: 改变遮挡}
  text: {en: '• In the standard statistical model, blockage changes require explicit updates to the LOS/NLOS scenario sequence, clusters/powers, or a separate blockage model, followed by channel generation and merging; terminal motion alone does not simulate an independently moving blocker.

      • When using site-specific meshes, geometry changes require repeating intersect_mesh state detection or diff_trans calculations, then updating scenario segmentation/channels for affected trajectories.

      • Specific reflections, diffractions, and path births/deaths caused by a moving vehicle require per-geometry RT or a validated dedicated model; the site-specific tutorial alone does not provide such per-path ground truth.', zh: '• 常规统计模型中，遮挡变化需要明确更新LOS/NLOS场景序列、簇/功率或另设遮挡模型，再生成并合并信道；终端移动本身不等于仿真了一个独立移动blocker。

      • 使用site-specific mesh时，几何变化后应重新进行intersect_mesh状态检测或diff_trans计算，并更新受影响轨迹的场景分段/信道。

      • 若要求某辆车移动后产生的特定反射、绕射及路径出生/消失，需另接逐几何RT或经过验证的专门模型；仅靠该site-specific教程不能提供这些逐径真值。'}
- label: {en: Cost drivers, zh: 成本来源}
  text: {en: '• Link count, cluster/subpath count, antenna-element pair count, trajectory snapshot count, and band count determine the work required for parameter generation and coefficient synthesis.

      • Drifting, per-element delays, and dual mobility increase computation; denser spatial sampling of trajectories directly generates more snapshots.

      • Where sampling requirements permit, the official tutorial reduces repeated generation using coarser spatial channel samples followed by interpolation; FR-stage cost also grows with frequency-point count.', zh: '• 链路数、簇/子径数、阵元对数、轨迹快照数与频段数决定参数生成和系数合成工作量。

      • drifting、逐阵元时延及双端移动增加计算；轨迹空间采样越密，直接生成的快照越多。

      • 在满足采样要求时，官方教程用稀一些的空间信道采样再插值以减少重复生成；FR阶段成本另随频点数增长。'}
- label: {en: Stored artifacts, zh: 产物}
  text: {en: '• Preserve simpar, scenario parameters and modifications, layout/track/segment, random state, and arrays, including element coordinates in meters.

      • For controlled experiments, preserve realization parameters in the builder, qd_channel coeff/delay, positions, and time mapping; CFR generated by fr also needs frequency points/bandwidth.

      • For site-specific mode, also preserve the mesh and LOS classification/segmentation rules; multifrequency data should record shared and frequency-dependent parameters.', zh: '• 保留simpar、场景参数及修改项、layout/track/segment、随机状态和阵列（含米制阵元坐标）。

      • 受控实验宜保留builder中的实现参数，以及qd_channel coeff/delay、位置和时间映射；由fr生成的CFR还需附频点/带宽。

      • site-specific模式另保留mesh、LOS判定/分段规则；多频数据记录共享与逐频变化的参数。'}
- label: {en: Common mistakes, zh: 常见混淆}
  text: {en: '• Interpreting random cluster coordinates as RT reflection points in a real city, or equating mesh-assisted LOS segmentation with full site-specific multipath tracing.

      • Claiming propagation samples from another RF band after changing only the fr frequency grid.

      • Redrawing LSP/SSF whenever arrays change, confounding array effects with random-environment effects; or adding time indices to independent drops and calling them continuous mobility.', zh: '• 把随机簇坐标解释成真实城市的RT反射点，或把mesh辅助LOS分段等同完整站点多径追踪。

      • 只改fr的频率网格就声称获得了另一RF频段的传播样本。

      • 每次改阵列同时重抽LSP/SSF，使阵列差异与随机环境差异混在一起；或给独立drop加时间索引后称为连续移动。'}
- label: {en: Native outputs, zh: 原生输出}
  text: {en: '• Model-generated qd_channel coeff/delay

      • Layout, trajectory, and builder parameters', zh: '• 模型生成的qd_channel coeff/delay

      • 布局、轨迹与builder参数'}
- label: {en: Derived outputs, zh: 派生输出}
  text: {en: '• CFR, PDP, beam, and CSI-feedback samples

      • Multiuser/multifrequency task data', zh: '• CFR、PDP、beam与CSI-feedback样本

      • 多用户/多频任务数据'}
- label: {en: What the researcher controls, zh: 研究者可控范围}
  text: {en: controls and checks identify settings to fix or verify when reproducing or using the data. Values explicitly labeled as paper settings come from the cited source; other items are not official defaults., zh: controls和checks是复现/使用时需要固定或验证的项目；其中明确标注论文配置的数值来自原来源，其余不代表官方默认。}
- label: {en: Reproduction notes, zh: 复现说明}
  text: {en: '• Official tutorial source code reviewed; MATLAB/Octave generation was not executed in this round.

      • Tutorial options that disable pathloss, reduce cluster counts, or change XPR for demonstration cannot be copied directly as the default physical system.

      • Verify the code license and published-data license separately; sharing a stochastic model does not establish real-scene calibration.', zh: '• 已读官方教程源代码，未在本轮执行MATLAB/Octave生成。

      • 教程中为演示关闭pathloss、减少簇数或改XPR的选项不能直接照搬为默认物理系统。

      • 代码许可与发布数据许可分别确认；共享随机模型不证明真实场景校准。'}
