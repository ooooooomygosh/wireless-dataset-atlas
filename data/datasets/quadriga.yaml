technical_notes:
- {en: 'Confirmed: officially defined as a 3D geometry-based stochastic model, with large- and small-scale consistency across locations.', zh: 已确认：官方将其定义为三维几何随机模型，并提供跨位置的大/小尺度一致性。}
- {en: 'Confirmed: can import measured/simulated far-field antenna patterns; includes spherical waves and time-varying cluster evolution.', zh: 已确认：可导入实测/仿真的远场天线图；包含球面波与时变簇演化能力。}
- {en: 'Confirmed: 2.8 adds site-specific functionality and partial CUDA acceleration; this does not mean all outputs are field-calibrated.', zh: 已确认：2.8 增加 site-specific 功能和部分 CUDA 加速；不代表所有输出经过现场校准。}
- {en: 'Inference: generating different carrier frequencies with the same random seed does not recover actual paths unique to low bands or absent at high bands.', zh: 推断：使用同一随机种子产生不同载频，不等于恢复实际低频独有或高频消失路径。}
- {en: 'Inference: standardized parameterizations support controlled mechanism comparisons; generalization to real deployments requires independent measurement validation.', zh: 推断：标准参数化可用于受控机制比较，真实部署泛化需独立测量验证。}
