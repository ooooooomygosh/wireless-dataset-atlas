summary: {en: QuaDRiGa is a generator of geometry-based stochastic MIMO channel impulse responses for carrier frequencies from 500 MHz to 100 GHz. The output is generated on demand by the software rather than distributed as a fixed dataset., zh: QuaDRiGa 是基于几何的随机 MIMO 信道冲激响应生成器，载频范围为 500 MHz 至 100 GHz。输出由软件按需生成，而非以固定数据集形式发布。}
sources: ['https://github.com/fraunhoferhhi/QuaDRiGa/blob/main/README.md?plain=1', 'https://github.com/fraunhoferhhi/QuaDRiGa/blob/main/QuaDRiGa_License.txt', 'https://quadriga-channel-model.de/software/', 'https://api.crossref.org/works/10.1109/tap.2014.2310220', 'https://raw.githubusercontent.com/fraunhoferhhi/QuaDRiGa/main/README.md', 'https://raw.githubusercontent.com/fraunhoferhhi/QuaDRiGa/main/QuaDRiGa_License.txt', 'https://api.github.com/repos/fraunhoferhhi/QuaDRiGa/git/trees/main?recursive=1', 'https://raw.githubusercontent.com/fraunhoferhhi/QuaDRiGa/main/tutorials/t11_multi_frequency_simulations.m', 'https://raw.githubusercontent.com/fraunhoferhhi/QuaDRiGa/main/tutorials/t15_los_detection_and_diffraction.m', 'https://raw.githubusercontent.com/fraunhoferhhi/QuaDRiGa/main/tutorials/t09_speed_profile_interpolation.m', 'https://raw.githubusercontent.com/fraunhoferhhi/QuaDRiGa/main/tutorials/t04_drifting_phases.m', 'https://raw.githubusercontent.com/fraunhoferhhi/QuaDRiGa/main/quadriga_src/@qd_builder/gen_parameters.m',
  'https://raw.githubusercontent.com/fraunhoferhhi/QuaDRiGa/main/quadriga_src/@qd_builder/get_channels.m', 'https://raw.githubusercontent.com/fraunhoferhhi/QuaDRiGa/main/quadriga_src/@qd_builder/init_sos.m', 'https://raw.githubusercontent.com/fraunhoferhhi/QuaDRiGa/main/quadriga_src/@qd_channel/fr.m', 'https://codeload.github.com/fraunhoferhhi/QuaDRiGa/tar.gz/refs/heads/main', 'https://github.com/fraunhoferhhi/QuaDRiGa/releases.atom', 'https://github.com/fraunhoferhhi/QuaDRiGa/tags.atom', 'https://api.github.com/repos/fraunhoferhhi/QuaDRiGa/releases?per_page=30']
checked: '2026-11-06'
pipeline:
  summary: {en: 'QuaDRiGa draws correlated large- and small-scale parameters from a layout, trajectories, arrays and scenario statistics, then synthesizes and merges time-varying MIMO channels. The 2.8 site-specific mode uses a 3D mesh to assign LOS and NLOS states along tracks.', zh: QuaDRiGa 根据布局、轨迹、阵列与场景统计生成相关的大尺度与小尺度参数，再合成并合并时变 MIMO 信道。2.8 版本的站点特定模式利用 3D 网格沿轨迹分配 LOS 与 NLOS 状态。}
  scope: {en: Geometry-based stochastic channel workflow following the official QuaDRiGa MATLAB tutorials., zh: 依据 QuaDRiGa 官方 MATLAB 教程整理的几何随机信道流程。}
  stages:
  - title: {en: Set the simulation parameters, zh: 设置仿真参数}
    detail: {en: 'Choose the carrier frequency, the sample density along the track, and whether absolute delays are used. The sample density must give at least one sample per half-wavelength, and at least two when both ends move.', zh: 选择载频、沿轨迹的采样密度以及是否使用绝对时延。采样密度须至少每半波长一个采样点；收发两端均移动时至少为两个。}
    inputs:
    - {en: qd_simulation_parameters object, zh: qd_simulation_parameters对象}
    outputs:
    - {en: 'Simulation parameter set (center_frequency, sample_density, use_absolute_delays)', zh: 仿真参数集（center_frequency、sample_density、use_absolute_delays）}
    controls:
    - {en: Fix center_frequency, sample_density and use_absolute_delays before generating parameters: null, zh: 生成参数前先固定center_frequency、sample_density与use_absolute_delays}
  - title: {en: Build the layout and arrays, zh: 建立布局与阵列}
    detail: {en: Place transmitters and receivers in a qd_layout and assign qd_arrayant antennas to them. Element positions are given in meters. Measured or simulated far-field patterns can be imported as arrays., zh: 在 qd_layout 中放置发射机与接收机，并为其分配 qd_arrayant 天线。阵元位置以米为单位。实测或仿真的远场方向图可导入为阵列。}
    inputs:
    - {en: Tx and Rx positions, zh: Tx与Rx位置}
    - {en: Array patterns and element coordinates, zh: 阵列方向图与阵元坐标}
    outputs:
    - {en: Network layout with antennas, zh: 带天线的网络布局}
  - title: {en: Define tracks, speed profiles and segments: null, zh: 定义轨迹、速度曲线与分段}
    detail: {en: 'Trajectories are qd_track objects. Speed profiles convert positions into time, and channels are generated on spatial samples that can be interpolated to a varying speed. LOS or NLOS scenarios are assigned to track sections, and merge joins the segments into one continuous channel.', zh: 轨迹由 qd_track 对象定义。速度曲线将位置映射到时间，信道在空间采样点上生成，并可插值到变化的速度上。LOS 或 NLOS 场景被分配到各轨迹片段，merge 将各段拼接为连续信道。}
    inputs:
    - {en: qd_track trajectories, zh: qd_track轨迹}
    - {en: LOS/NLOS scenario sequences and segment boundaries, zh: LOS/NLOS场景序列与分段边界}
    outputs:
    - {en: Sampled trajectories, orientations and segment-to-scenario mapping: null, zh: 采样轨迹、朝向及分段与场景的对应关系}
  - title: {en: Initialize the builder and generate correlated parameters, zh: 初始化builder并生成相关参数}
    detail: {en: 'init_builder creates the random generators. gen_parameters produces correlated large-scale parameters, small-scale fading parameters and scatterer positions for each link. SC_lambda sets the small-scale spatial correlation, and SC_lambda = 0 disables it.', zh: init_builder 创建随机生成器。gen_parameters 为每条链路生成相关的大尺度参数、小尺度衰落参数与散射体位置。SC_lambda 控制小尺度空间相关，设为 0 时关闭该相关。}
    inputs:
    - {en: Layout and scenario parameters, zh: 布局与场景参数}
    outputs:
    - {en: Correlated large-scale and small-scale parameters, zh: 相关的大尺度与小尺度参数}
    - {en: 'Cluster delays, powers, angles and polarization parameters', zh: 簇时延、功率、角度与极化参数}
    controls:
    - {en: 'usage option of gen_parameters: 0 clears all LSF and SSF parameters, 1 regenerates only LSF parameters', zh: gen_parameters的usage选项：0清除全部LSF与SSF参数，1仅重新生成LSF参数}
  - title: {en: Synthesize and merge the channels, zh: 合成并合并信道}
    detail: {en: 'get_channels combines antenna patterns, geometry and trajectories to produce coefficients and delays for each link. With drifting enabled, angles, delays and phases evolve during motion; merge handles the transitions between segments.', zh: get_channels 结合天线方向图、几何与轨迹，为各链路生成系数与时延。启用 drifting 时，运动过程中的角度、时延与相位随之演化；merge 处理各段之间的过渡。}
    inputs:
    - {en: Builder parameters, arrays and trajectories: null, zh: builder参数、阵列与轨迹}
    outputs:
    - {en: Complex coefficients and delays per link (qd_channel), zh: 各链路的复系数与时延（qd_channel）}
    checks:
    - {en: use_3GPP_baseline switches off the SOS spatial-consistency generators in the builder, zh: use_3GPP_baseline会关闭builder中的SOS空间一致性生成器}
  - title: {en: Project to the frequency domain, zh: 投影到频域}
    detail: {en: 'qd_channel.fr projects coefficients and delays onto baseband frequency points for a chosen bandwidth. For several carriers, tutorial t11 sets center_frequency as a vector, which generates correlated outputs on a shared layout.', zh: qd_channel.fr 按所选带宽将系数与时延投影到基带频点。对于多个载频，教程 t11 将 center_frequency 设为向量，在共享布局上生成相关输出。}
    inputs:
    - {en: qd_channel object and bandwidth or carrier list, zh: qd_channel对象与带宽或载频列表}
    outputs:
    - {en: CFR arrays, zh: CFR数组}
  - title: {en: 'Optional: site-specific LOS and indoor states', zh: 可选：站点特定的LOS与室内状态}
    detail: {en: 'In the 2.8 site-specific mode a 3D mesh (qd_mesh) is imported, and intersect_mesh determines the LOS and indoor state of grid points and tracks. diff_trans gives a relative LOS weighting from 0 (NLOS) to 1 (LOS), which can weight two path-loss models.', zh: 在 2.8 站点特定模式中，导入 3D 网格（qd_mesh），由 intersect_mesh 判定网格点与轨迹的 LOS 及室内状态。diff_trans 给出从 0（NLOS）到 1（LOS）的相对 LOS 权重，可用于对两种路径损耗模型加权。}
    inputs:
    - {en: 3D model (qd_mesh) and Tx and Rx positions, zh: 3D模型（qd_mesh）及Tx、Rx位置}
    outputs:
    - {en: LOS/NLOS and indoor states, zh: LOS/NLOS与室内状态}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: 'Model-generated complex coefficients and delays (qd_channel coeff and delay), together with the layout, trajectory and builder parameters that produced them.', zh: 模型生成的复系数与时延（qd_channel的coeff与delay），以及生成它们所用的布局、轨迹与builder参数。}
- label: {en: Derived outputs, zh: 派生输出}
  text: {en: CFR obtained with qd_channel.fr at the chosen bandwidth and frequency points., zh: 通过qd_channel.fr按所选带宽与频点得到的CFR。}
- label: {en: Entry inputs, zh: 入口输入}
  text: {en: 'Typical inputs are scenario statistical parameters, BS and terminal layouts, qd_track trajectories and segments, qd_arrayant arrays and a random state.', zh: 常见输入为场景统计参数、BS与终端布局、qd_track轨迹与分段、qd_arrayant阵列以及随机状态。}
- label: {en: Site-specific mode, zh: 站点特定模式}
  text: {en: The 2.8 site-specific mode imports a 3D mesh (qd_mesh) to classify LOS and indoor states and to assign LOS or NLOS sections to track sections., zh: 2.8的站点特定模式导入3D网格（qd_mesh），用于判定LOS与室内状态，并将LOS或NLOS分段分配给轨迹片段。}
- label: {en: Spatial consistency, zh: 空间一致性}
  text: {en: 'Large- and small-scale parameters are consistent across positions. SC_lambda sets the small-scale spatial correlation, and SC_lambda = 0 disables it.', zh: 大尺度与小尺度参数在不同位置之间保持一致。SC_lambda控制小尺度空间相关，设为0时关闭。}
- label: {en: Drifting and Doppler, zh: Drifting与多普勒}
  text: {en: 'Drifting updates path delays, angles, phases and large-scale parameters during motion within a segment. Without drifting, the Doppler component is computed with a plane-wave approximation from the initial position.', zh: Drifting在段内运动过程中更新路径时延、角度、相位与大尺度参数。不使用drifting时，多普勒分量按起始位置采用平面波近似计算。}
- label: {en: Multi-frequency tutorial, zh: 多频教程}
  text: {en: 'Tutorial t11 simulates 2.6 GHz and 28 GHz in an urban macrocell. Shared between the two frequencies: LOS/NLOS state, BS and MT positions, cluster delays and angles, and the spatial consistency of the LSPs. Varying with frequency: pathloss, path powers, antenna patterns, delay and angular spreads, K-factor and XPR.', zh: 教程t11在城市宏蜂窝中模拟2.6 GHz与28 GHz。两个频率之间共享：LOS/NLOS状态、BS与MT位置、簇时延与角度，以及LSP的空间一致性。随频率变化：路径损耗、路径功率、天线方向图、时延与角度扩展、K-factor与XPR。}
- label: {en: Changing bandwidth or carriers, zh: 改变带宽或载频}
  text: {en: 'qd_channel.fr changes only the baseband frequency grid, so changing bandwidth or carriers reuses the existing coefficients and delays.', zh: qd_channel.fr只改变基带频率网格，因此改变带宽或载频时复用已有的系数与时延。}
- label: {en: Element positions, zh: 阵元位置}
  text: {en: qd_arrayant.element_position is given in meters in local Cartesian coordinates., zh: qd_arrayant.element_position以米为单位，表示局部笛卡尔坐标系中的阵元位置。}
provenance:
- {en: 'Network layout, trajectories, array patterns', zh: 网络布局、轨迹、阵列方向图}
- {en: Select a 3GPP/WINNER/mmMAGIC parameterization, zh: 选择 3GPP/WINNER/mmMAGIC 参数化}
- {en: Correlated large-scale parameters and random clusters, zh: 相关大尺度参数与随机簇}
- {en: 'Time-varying angles, delays, polarization, and array responses', zh: 时变角度、时延、极化、阵列响应}
- {en: Multilink CIR/CFR, zh: 多链路 CIR/CFR}
- {en: Decision algorithms and user-defined datasets, zh: 决策算法与用户定义数据集}
technical_notes:
- {en: The README describes QuaDRiGa as a three-dimensional geometry-based stochastic channel model with large- and small-scale fading consistency across locations., zh: README将QuaDRiGa描述为三维几何随机信道模型，大尺度与小尺度衰落在不同位置之间保持一致。}
- {en: 'Version 1.4 added import of measured and simulated far-field antenna patterns, spherical waves and time-varying cluster evolution.', zh: 1.4版本加入了实测与仿真远场天线方向图的导入、球面波以及时变簇演化。}
- {en: 'The README states that the model is calibrated against 3GPP channel models, including 3GPP-3D and the New Radio model.', zh: README称该模型以3GPP信道模型（包括3GPP-3D与NR信道模型）进行了校准。}
- {en: Site-specific simulations in 2.8 include partial CUDA acceleration. The GPU extension has to be compiled for the target CPU and GPU., zh: 2.8的站点特定仿真包含部分CUDA加速。GPU扩展须针对目标CPU与GPU编译。}
limitations:
- {en: 'The license allows non-commercial use only, for scientific, educational and standardization purposes.', zh: 许可仅允许非商业用途，包括科研、教育与标准化用途。}
- {en: 'Standards compatibility is stated per version: TR 36.873 v12.5.0, TR 38.901 v16.1.0 and mmMAGIC D2.2.', zh: 标准兼容性按版本说明：TR 36.873 v12.5.0、TR 38.901 v16.1.0与mmMAGIC D2.2。}
history:
- {en: '2013-06-20: version 1.0.7 is the earliest entry in the official version list.', zh: 2013-06-20：1.0.7是官方版本列表中最早的条目。}
- {en: '2017-08-01: version 2.0 adds 3D spatial consistency, multi-frequency simulations and 3GPP 38.901 outdoor-to-indoor penetration loss models.', zh: 2017-08-01：2.0版本加入3D空间一致性、多频仿真以及3GPP 38.901室外到室内穿透损耗模型。}
- {en: '2019-06-27: version 2.2 adds dual mobility and an industrial indoor scenario.', zh: 2019-06-27：2.2版本加入双端移动与工业室内场景。}
- {en: '2020-11-03: version 2.4 adds CDL/TDL models, 3GPP InF models and satellite channel models.', zh: 2020-11-03：2.4版本加入CDL/TDL模型、3GPP InF模型与卫星信道模型。}
- {en: '2021-07-12: version 2.6.1 adds semi-deterministic clusters and Octave 6.2 compatibility.', zh: 2021-07-12：2.6.1版本加入半确定性簇与Octave 6.2兼容性。}
- {en: Version 2.6 adds save and load functions for channel data., zh: 2.6版本加入信道数据的保存与加载函数。}
- {en: '2023-12-13: version 2.8.1 adds site-specific simulations.', zh: 2023-12-13：2.8.1版本加入站点特定仿真。}
usage:
- {en: Start with the official tutorials in the repository (t01 to t15). Tutorial t11 covers multi-frequency simulation and t15 covers site-specific simulation., zh: 从仓库中的官方教程（t01至t15）开始。教程t11介绍多频仿真，t15介绍站点特定仿真。}
- {en: 'Generate CIRs first, then compute CFRs with qd_channel.fr at the target bandwidth and frequency points.', zh: 先生成CIR，再用qd_channel.fr在目标带宽与频点上计算CFR。}
- {en: The official software page lists 2.8.1 as the current version. The software is distributed under the non-commercial license., zh: 官方软件页面将2.8.1列为当前版本。该软件以非商业许可分发。}
materials:
- {title: QuaDRiGa official dual-band simulation tutorial source, path: /materials/official/quadriga/t11_multi_frequency_simulations.m, license: QuaDRiGa custom non-commercial source license, source_url: 'https://github.com/fraunhoferhhi/QuaDRiGa/blob/main/tutorials/t11_multi_frequency_simulations.m'}
overview: {en: 'QuaDRiGa (QUAsi Deterministic RadIo channel GenerAtor) is a MATLAB/Octave software package from Fraunhofer HHI that generates geometry-based stochastic MIMO channel impulse responses. Jaeckel, Raschkowski, Börner and Thiele describe it in IEEE Transactions on Antennas and Propagation (2014). The README lists compatibility with 3GPP TR 36.873 v12.5.0, TR 38.901 v16.1.0 and the mmMAGIC channel model, a carrier frequency range of 500 MHz to 100 GHz, and a bandwidth of 100 MHz in standard configurations or 2 GHz in mmMAGIC configurations. Array antennas are freely configurable, and measured or simulated far-field antenna patterns can be imported. The software generates channels from the user''s configuration, and the GitHub repository distributes source code, tutorials and documentation rather than channel data sets. Version 2.8.1 adds site-specific simulations, which use a 3D mesh to determine LOS and indoor states, and optional partial GPU acceleration with NVIDIA CUDA. The
    software license allows non-commercial use only.', zh: QuaDRiGa（QUAsi Deterministic RadIo channel GenerAtor）是 Fraunhofer HHI 开发的 MATLAB/Octave 软件包，用于生成基于几何的随机 MIMO 信道冲激响应。Jaeckel、Raschkowski、Börner 和 Thiele 在 IEEE Transactions on Antennas and Propagation（2014）中对其进行了描述。README 列出的兼容标准包括 3GPP TR 36.873 v12.5.0、TR 38.901 v16.1.0 以及 mmMAGIC 信道模型；载频范围为 500 MHz 至 100 GHz，标准配置带宽为 100 MHz，mmMAGIC 配置带宽为 2 GHz。阵列天线可自由配置，并可导入实测或仿真的远场天线方向图。软件根据用户配置生成信道，GitHub 仓库发布的是源代码、教程与文档，而非信道数据集。2.8.1 版本增加了站点特定仿真，利用 3D 网格判定 LOS 与室内状态，并可选支持基于 NVIDIA CUDA 的部分 GPU 加速。软件许可仅允许非商业用途。}
signal_details:
- signal: cir
  text: {en: 'Complex MIMO channel impulse responses (CIR) generated on demand by the software. Carrier frequency 500 MHz to 100 GHz. Bandwidth 100 MHz in standard configurations and 2 GHz in mmMAGIC configurations, per the README. Channel data can be written and read with the software''s save and load functions (version 2.6).', zh: 软件按需生成的复数 MIMO 信道冲激响应（CIR）。载频范围为 500 MHz 至 100 GHz。依 README，标准配置带宽为 100 MHz，mmMAGIC 配置带宽为 2 GHz。信道数据可通过软件的保存与加载函数读写（2.6 版本）。}
capabilities:
- key: csi
  status: simulate
  note: {en: Frequency-domain channel computed from the generated coefficients and delays (qd_channel.fr); produced by a generator run., zh: 由生成器运行得到的系数与时延计算频域信道（qd_channel.fr）。}
- key: cir
  status: simulate
  note: {en: 'Complex tap coefficients and delays, generated per link and track segment by a generator run.', zh: 由生成器运行按链路与轨迹分段生成的复数抽头系数与时延。}
- key: paths
  status: simulate
  note: {en: 'Cluster delays, angles and powers are drawn per link during generation (documentation section 3.3); the output keeps coefficients and delays.', zh: 簇时延、角度与功率在生成时按链路抽取（文档第 3.3 节）；输出保留系数与时延。}
- key: interaction
  status: simulate
  note: {en: First- and last-bounce scatterer positions are generated per cluster (single- or two-bounce); no surface labels are recorded., zh: 每个簇生成首次与末次反弹散射体位置（单次或双次反弹）；不记录表面标签。}
- key: power
  status: simulate
  note: {en: 'Path loss, O2I penetration loss and shadow fading are computed by a generator run (get_pl, power_map).', zh: 路径损耗、O2I 穿透损耗与阴影衰落由生成器运行计算（get_pl、power_map）。}
- key: iq
  status: none
  note: {en: The output is channel coefficients and delays; no transmitted or received waveform samples are produced., zh: 输出为信道系数与时延，不产生发射或接收波形采样。}
- key: beam_labels
  status: simulate
  note: {en: Beam indices or per-beam gains need a generator run with a chosen array and codebook (qd_arrayant calc_gain)., zh: 波束索引或每波束增益需选定阵列与码本后运行生成器获得（qd_arrayant calc_gain）。}
- key: position
  status: simulate
  note: {en: 'Transmitter and receiver positions are layout inputs, and tracks set user trajectories.', zh: 收发端位置为布局输入，轨迹定义用户运动路径。}
- key: geometry
  status: provided
  note: {en: 'One example 3D scene (Madrid grid, OBJ) ships in tutorials/madrid_grid; other maps are user-supplied.', zh: 随附一个示例三维场景（Madrid grid，OBJ 格式，位于 tutorials/madrid_grid）；其他地图需用户提供。}
- key: materials
  status: simulate
  note: {en: 'Relative permittivity, conductivity and thickness are set per mesh material by the user (qd_mesh).', zh: 相对介电常数、电导率与厚度由用户按网格材料设定（qd_mesh）。}
- key: rgb
  status: none
  note: {en: QuaDRiGa is a channel generator with no camera output., zh: QuaDRiGa 为信道生成器，无相机输出。}
- key: depth
  status: none
  note: {en: The software generates channels only and has no depth output., zh: 软件仅生成信道，无深度输出。}
- key: lidar
  status: none
  note: {en: The software generates channels only and has no LiDAR output., zh: 软件仅生成信道，无 LiDAR 输出。}
- key: radar
  status: none
  note: {en: The v2.8.1 documentation and code define no radar or sensing-target channel model., zh: v2.8.1 的文档与代码中未定义雷达或感知目标信道模型。}
- key: imu
  status: none
  note: {en: The software generates channels only and has no inertial sensor output., zh: 软件仅生成信道，无惯性传感器输出。}
- key: time_series
  status: simulate
  note: {en: Time-varying channels follow from track sampling and speed profiles and are produced per run., zh: 时变信道由轨迹采样与速度曲线生成，按运行产生。}
- key: multiuser
  status: simulate
  note: {en: 'The layout holds several receivers, and the builder creates a channel object for each one.', zh: 布局可包含多个接收机，建模器为每个接收机生成信道对象。}
- key: multibs
  status: simulate
  note: {en: 'The layout holds several transmitters, so multi-cell sets are generated per run.', zh: 布局可包含多个发射机，多小区数据集按运行生成。}
- key: crossfreq
  status: simulate
  note: {en: center_frequency accepts a vector for multi-frequency simulations (documentation section 4.11)., zh: center_frequency 可设为向量以进行多频率仿真（文档第 4.11 节）。}
- key: near_field
  status: simulate
  note: {en: Spherical waves at both ends are the default enhanced mode (use 3GPP baseline = 0)., zh: 收发两端的球面波为默认增强模式（use 3GPP baseline = 0）。}
- key: high_mobility
  status: simulate
  note: {en: UT speed is a run-time input (set in m/s or km/h) with variable speed profiles; no upper speed limit is stated., zh: UT 速度为运行时输入（以 m/s 或 km/h 设定），支持可变速度曲线；文档未给出速度上限。}
- key: dynamic_blockage
  status: none
  note: {en: The 3GPP blockage model (TR 38.901 section 7.6.3) is listed as not implemented in v2.8.1., zh: 文档列出 3GPP 遮挡模型（TR 38.901 第 7.6.3 节）在 v2.8.1 中未实现。}
- key: reflection
  status: simulate
  note: {en: Reflection comes from cluster scatterers and an optional explicit ground-reflection model (documentation section 3.9)., zh: 反射来自簇散射体及可选的显式地面反射模型（文档第 3.9 节）。}
- key: diffraction
  status: simulate
  note: {en: The site-specific mode adds diffraction and transmission loss to the direct path where a 3D mesh blocks it (diff_trans)., zh: 站点特定模式在三维网格遮挡直射路径时，为直射路径加入绕射与穿透损耗（diff_trans）。}
- key: scattering
  status: simulate
  note: {en: Scattering is modelled as clusters of 20 single reflections each; the documentation describes no separate diffuse component., zh: 散射以每簇 20 个单次反射建模；文档未描述独立的漫散射分量。}
- key: transmission
  status: simulate
  note: {en: 'Outdoor-to-indoor penetration loss is generated per track (gen_o2i_loss), and the site-specific mode can add transmission loss.', zh: 室外到室内穿透损耗按轨迹生成（gen_o2i_loss），站点特定模式还可加入穿透损耗。}
- key: polarization
  status: simulate
  note: {en: Polarization transfer matrices and geometric polarization are generated per path; antenna polarization is defined by the array., zh: 极化传输矩阵与几何极化按径生成；天线极化由阵列定义。}
- key: em_field
  status: simulate
  note: {en: 'Antenna field patterns (e_theta, e_phi) are generated or imported by qd_arrayant; the channel output holds no E-field samples.', zh: 天线场方向图（e_theta、e_phi）由 qd_arrayant 生成或导入；信道输出不含电场采样。}
versions:
- version: 2.8.1
  date: '2023-12-13'
  summary: {en: Fixes a gen_cdl_model crash on Octave and adds a simpler Makefile for the +qext module., zh: 修复 Octave 下 gen_cdl_model 崩溃的问题，并为 +qext 模块提供更易用的 Makefile。}
  url: https://quadriga-channel-model.de/software/
- version: 2.6.1
  date: '2021-07-12'
  summary: {en: 'Fixes qd_builder.get_los_channels, which ignored tx_array in some cases; the download page also lists semi-deterministic clusters and performance gains for this release.', zh: 修复 qd_builder.get_los_channels 在部分情况下忽略 tx_array 的问题；下载页还列出本版本的半确定性簇及性能改进。}
  url: https://quadriga-channel-model.de/software/
- version: 2.4.0
  date: '2020-10-09'
  summary: {en: Adds configuration files for satellite links and fixes a crash in qd_satellite.init_tracks when satellite names are undefined., zh: 新增卫星链路配置文件，并修复未定义卫星名称时 qd_satellite.init_tracks 崩溃的问题。}
  url: https://quadriga-channel-model.de/software/
- version: 2.2.0
  date: '2019-06-27'
  summary: {en: 'Adds dual-mobility, vehicular and industrial scenario support, per the download page.', zh: 新增双移动性、车载及工业场景支持（据下载页）。}
  url: https://quadriga-channel-model.de/software/
- version: 2.0.0
  date: '2017-08-01'
  summary: {en: 'Major redesign, with the 3GPP TR 38.901 model (spatial consistency, multi-frequency simulation) and the final mmMAGIC model.', zh: 大幅重构，加入 3GPP TR 38.901 模型（空间一致性、多频率仿真）及最终版 mmMAGIC 模型。}
  url: https://quadriga-channel-model.de/software/
- version: 1.4.8
  date: '2016-08-05'
  summary: {en: Fixes a sign error in array.generate_multi for electric tilt angles., zh: 修复 array.generate_multi 中电子下倾角的符号错误。}
  url: https://quadriga-channel-model.de/software/
- version: 1.4.1
  date: '2016-03-22'
  summary: {en: Stores LSPs and SSPs in channel.par and adds the qf helper package; the download page lists 3GPP-3D (TR 36.873) and mm-wave channels up to 80 GHz., zh: 将 LSP 与 SSP 存入 channel.par 并新增 qf 辅助函数包；下载页列出 3GPP-3D（TR 36.873）及 80 GHz 以内的毫米波信道。}
  url: https://quadriga-channel-model.de/software/
- version: 1.2.32
  date: '2015-03-23'
  summary: {en: 'Removes HTML help, which newer MATLAB versions no longer support, and updates the documentation.', zh: 移除新版 MATLAB 已不支持的 HTML 帮助，并更新文档。}
  url: https://quadriga-channel-model.de/software/
- version: 1.2.0
  date: '2014-02-19'
  summary: {en: Fixes the XPR in output coefficients when use_polarization_rotation is set to 2., zh: 修复 use_polarization_rotation 设为 2 时输出系数中的 XPR 与设定值不一致的问题。}
  url: https://quadriga-channel-model.de/software/
- version: 1.1.0
  date: '2014-01-14'
  summary: {en: Fixes antenna gain normalization for dipole and custom arrays and adds short-dipole and half-wave dipole array types., zh: 修复偶极子与自定义阵列的天线增益归一化问题，并新增 short-dipole 与 half-wave dipole 阵列类型。}
  url: https://quadriga-channel-model.de/software/
- version: 1.0.0
  date: '2013-01-13'
  summary: {en: First entry in the bundled version history; the entry contains only the license header., zh: 随包版本历史中的首个条目；该条目仅含许可证头部。}
  url: https://quadriga-channel-model.de/software/
