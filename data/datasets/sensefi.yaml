id: sensefi
name: SenseFi
year: 2022
origin: benchmark
tasks: [wireless-sensing]
signals: [csi]
environment: []
samples: UT-HAR 3,977 train / 996 test; NTU-HAR 936 / 264; NTU-HumanID 546 / 294; Widar 34,926 / 8,726 (train / test)
license: Not stated
access: {url: 'https://github.com/xyanchen/WiFi-CSI-Sensing-Benchmark', type: open}
code: ['https://github.com/xyanchen/WiFi-CSI-Sensing-Benchmark']
paper: doi:10.1016/j.patter.2023.100703
used_in: ['doi:10.1109/icc51166.2024.10622623']
citing: ['doi:10.1109/jiot.2023.3262940', 'doi:10.1109/tmc.2025.3552538', 'doi:10.1109/tmc.2025.3544573']
summary: {en: 'A PyTorch library and benchmark for WiFi CSI human sensing that packages four preprocessed datasets: UT-HAR (7 activities), NTU-HAR (6 activities), NTU-HumanID (14 subject classes) and Widar gesture data (22 gesture classes).', zh: 用于 WiFi CSI 人体感知的 PyTorch 库与基准，整理了四个预处理数据集：UT-HAR（7 类活动）、NTU-HAR（6 类活动）、NTU-HumanID（14 个受试者类别）以及 Widar 手势数据（22 类手势）。}
sources: ['https://github.com/xyanchen/WiFi-CSI-Sensing-Benchmark', 'https://arxiv.org/abs/2207.07859']
checked: '2026-11-06'
pipeline:
  summary: {en: 'Each source''s WiFi measurements first produce amplitudes or BVP, then use source-specific loading rules for normalization and activity/identity labels. SenseFi provides unified training entry points, not a unified raw complex-CSI generator.', zh: 各源 WiFi 测量先得到幅度或 BVP，再用各自加载规则归一化并映射到活动/身份标签；SenseFi 统一训练入口，没有统一原始复 CSI 生成器。}
  stages:
  - title: {en: Collect four upstream sensing datasets, zh: 汇集四个上游感知数据源}
    detail: {en: 'The authors connect four processed WiFi-sensing datasets to one model-evaluation framework. They come from different devices, acquisition tasks, and upstream CSI-processing pipelines.', zh: 作者将四个已处理 WiFi 感知数据集接入同一模型评测框架；它们来自不同设备、采集任务与上游 CSI 处理链。}
    inputs:
    - {en: UT-HAR, zh: UT-HAR}
    - {en: NTU-Fi HAR and HumanID, zh: NTU-Fi HAR 与 HumanID}
    - {en: Widar, zh: Widar}
    outputs:
    - {en: Processed data packages distinguished by source, zh: 按来源区分的处理后数据包}
    controls:
    - {en: 'Author scope: activity or identity classification, not communication-side multiuser scheduling.', zh: 作者范围：活动或身份分类任务，不能解释为通信侧多用户调度。}
    checks:
    - {en: 'Reproduction recommendation: inspect the acquisition devices and scenes of each original dataset before deciding whether cross-device or cross-scene testing is possible.', zh: 复现建议：先查看各原始数据集的采集设备与场景，再确定是否能做跨设备或跨场景测试。}
  - title: {en: Preserve the distinct meanings of amplitudes and BVP, zh: 保留幅度与 BVP 的不同含义}
    detail: {en: NTU-Fi/UT-HAR views provide CSI-amplitude-related tensors; Widar uses body-coordinate velocity profiles (BVP). These processed data no longer equal original complex CSI retaining full phase information., zh: NTU-Fi/UT-HAR 视图提供 CSI 幅度相关张量，Widar 视图使用 body-coordinate velocity profile（BVP）。处理后的数据已不等同于保留完整相位的原始复 CSI。}
    inputs:
    - {en: Upstream WiFi measurements and preprocessing outputs, zh: 上游 WiFi 测量与预处理结果}
    outputs:
    - {en: Amplitude views, zh: 幅度视图}
    - {en: Dynamic BVP representations, zh: BVP 动态表示}
    controls:
    - {en: 'To verify: upstream scripts are needed to complete filtering, calibration, and segmentation parameters between original acquisitions and processed packages.', zh: 待核实：各原始采集到 processed 包之间的完整滤波、校准与分段参数需上游脚本补全。}
    checks:
    - {en: 'Reproduction recommendation: do not reshape BVP back into antenna × subcarrier CSI or derive coherent beam responses from amplitudes alone.', zh: 复现建议：不要把 BVP reshape 回天线×子载波 CSI，也不要从幅度单独推算相干波束响应。}
  - title: {en: Load and scale UT-HAR files, zh: UT-HAR 文件级加载与缩放}
    detail: {en: 'UT_HAR_dataset actually reads data with np.load and reshapes them to [N,1,250,90]. Each loaded file is scaled using its own min/max; labels are loaded separately.', zh: 'UT_HAR_dataset 实际用 np.load 读入数据，重排为 [N,1,250,90]；每个已加载文件按自己的 min/max 缩放，标签独立读取。'}
    inputs:
    - {en: Binary array files with a .csv suffix, zh: 后缀 .csv 的二进制数组文件}
    - {en: Separate label files, zh: 独立 label 文件}
    outputs:
    - {en: UT-HAR input tensors and activity classes, zh: UT-HAR 输入张量与活动类别}
    controls:
    - {en: 'Author code: normalization is calculated separately per loaded file, not from a common training-set min/max fit.', zh: 作者代码：归一化按加载文件分别计算，并非统一训练集拟合的 min/max。}
    checks:
    - {en: 'Reproduction recommendation: for a new evaluation, apply fixed training-set statistics to validation/test data and explicitly report the protocol change. File extensions alone should not determine the parser.', zh: 复现建议：若建立新评测，训练集统计量固定到验证/测试并单独标注协议变更；扩展名不能作为解析器依据。}
  - title: {en: Process NTU-Fi and Widar separately, zh: NTU-Fi 与 Widar 分源处理}
    detail: {en: 'NTU-Fi uses (x-42.3199)/4.9802, then samples every 4 points on the time axis to form 3×114×500. Widar uses (x-0.0025)/0.0119 and reshapes to 22×20×20.', zh: NTU-Fi 使用 (x-42.3199)/4.9802，时间轴每隔 4 点取样后形成 3×114×500。Widar 使用 (x-0.0025)/0.0119，并 reshape 为 22×20×20。}
    inputs:
    - {en: CSIamp in NTU-Fi .mat files, zh: NTU-Fi .mat 的 CSIamp}
    - {en: Widar numeric CSV files, zh: Widar 数值 CSV}
    outputs:
    - {en: NTU-Fi amplitude tensors, zh: NTU-Fi 幅度张量}
    - {en: Widar BVP tensors, zh: Widar BVP 张量}
    controls:
    - {en: 'Author code: these constants are fixed in the loader; the code does not explain how they were estimated.', zh: 作者代码：上述常数固定在 loader 中；其估计来源未在代码中说明。}
    checks:
    - {en: 'Reproduction recommendation: verify MAT keys, the time-downsampling axis, and BVP layout. Do not describe all processing as per-sample z-scoring or training-set standardization.', zh: 复现建议：核对 MAT 键、时间下采样轴和 BVP 布局；不可统称为每样本 z-score 或训练集标准化。}
  - title: {en: Obtain labels and retain processed splits, zh: 获取标签并沿用处理后划分}
    detail: {en: 'Loaders construct labels from class directories; UT-HAR reads separate labels. Training entry points use each dataset''s processed train/test sets. Directory enumeration affects class indices, so explicitly save the mapping.', zh: 加载器按类别目录建立标签，UT-HAR 读取独立标签；训练入口使用各数据集的 processed train/test。目录枚举影响类别编号，需显式保存映射。}
    inputs:
    - {en: Processed train/test directories, zh: 处理后 train/test 目录}
    - {en: Class subdirectories or label files, zh: 类别子目录或标签文件}
    outputs:
    - {en: Classification inputs/labels, zh: 分类输入/标签}
    - {en: Processed training and test views, zh: 处理后训练与测试视图}
    controls:
    - {en: 'Author code: directory glob order has no common sorting guarantee.', zh: 作者代码：目录 glob 顺序没有统一排序保证。}
    - {en: 'To verify: complete upstream isolation rules by person, scene, or recording batch must be checked against original dataset protocols.', zh: 待核实：上游按人员、场景或记录批次的完整隔离规则需与原数据集协议核对。}
    checks:
    - {en: 'Reproduction recommendation: use the same explicit class table across splits; check for repeated original activity segments and derived windows.', zh: 复现建议：跨划分使用同一显式类别表；检验同一原始动作片段及切窗是否重复出现。}
  - title: {en: Supervised/self-supervised entry points and model assets, zh: 监督或自监督入口与模型资产}
    detail: {en: run.py provides supervised training; self_supervised.py provides self-supervised examples. The repository demonstrates transfer from NTU-Fi HAR to HumanID. Input transforms are optional; there is no universally enforced MAE mask at the data layer., zh: run.py 提供监督训练，self_supervised.py 提供自监督示例，仓库演示 NTU-Fi HAR 到 HumanID 的迁移。输入 transform 为可选项，没有数据层统一强制的 MAE mask。}
    inputs:
    - {en: Amplitude/BVP tensors, zh: 幅度/BVP 张量}
    - {en: Activity or identity labels, zh: 活动或身份标签}
    - {en: Model selection, zh: 模型选择}
    outputs:
    - {en: Training and evaluation code, zh: 训练与评测代码}
    - {en: Model-weight entry points, zh: 模型权重入口}
    - {en: Activity/identity recognition results, zh: 活动/身份识别结果}
    controls:
    - {en: 'Author framework: changing the model does not change data provenance. Record masks or augmentations separately for each model.', zh: 作者框架：模型更换不改写数据来源；mask 或增广须按具体模型另记录。}
    checks:
    - {en: 'Reproduction recommendation: reproduce loading and simple classification baselines before discussing pretraining. Communication rates and beam labels require another data source.', zh: 复现建议：先复现数据加载和简单分类基线，再讨论预训练；通信速率与波束标签需另有数据来源。}
  scope: {en: The four processed WiFi-sensing views distributed by SenseFi and dataset.py. Original acquisition pipelines are documented only from the paper and upstream descriptions., zh: SenseFi 分发的四个处理后 WiFi 感知视图及 dataset.py；原始采集链仅按论文和上游说明记录。}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: '• Processed amplitude/BVP files

      • Activity/identity labels and train/test views

      • Model library, training entry points, and weight links', zh: '• 处理后的幅度/BVP 文件

      • 活动/身份标签和 train/test 视图

      • 模型库、训练入口与权重链接'}
- label: {en: Derived outputs, zh: 派生输出}
  text: {en: '• Loaded tensors with source-specific normalization

      • Optional augmentations, representations, or self-supervised tasks

      • Activity/identity classification metrics', zh: '• 加载后的分源归一化张量

      • 可选增广、表示或自监督任务

      • 活动/身份分类指标'}
- label: {en: Reproduction notes, zh: 复现说明}
  text: {en: '• Normalization differs among subsets; “uniform normalization” does not accurately describe all of them.

      • This review checked loaders and documentation. Processed data were not downloaded, and the complete steps of all four original acquisition pipelines were not traced.', zh: '• 不同子集的归一化方法不同，不能用一句“统一归一化”概括。

      • 本次核查 loader 与文档；未下载处理后数据，未追溯四个原始采集链的全部步骤。'}
provenance:
- {en: Four upstream real-world WiFi human-sensing data sources, zh: 四个上游真实 WiFi 人体感知数据源}
- {en: Source-specific devices and CSI extraction/cleaning, zh: 各自设备和 CSI 提取/清洗}
- {en: Amplitude tensors or BVP representations, zh: 幅度张量或 BVP 表示}
- {en: Official processed train/test views, zh: 官方处理后的 train/test 视图}
- {en: SenseFi's unified model library and supervised/self-supervised protocols, zh: SenseFi 统一模型库与监督/自监督协议}
technical_notes:
- {en: 'Literature-supported: different WiFi platforms produce different CSI representations. Actual hardware observations also require handling phase offsets and device differences.', zh: 文献支持：不同 WiFi 平台产生不同 CSI 表示；真实硬件观测还需处理相位偏移与设备差异。}
- {en: 'Official design: NTU-Fi HAR/HumanID use amplitude views; Widar uses BVP. They cannot all be treated as complex CSI with the same shape.', zh: 官方设计：NTU-Fi HAR/HumanID 使用幅度视图；Widar 使用 BVP，不能统一视为同形复 CSI。}
- {en: 'Inference: identity or room features may become shortcuts; evaluate independently by person, room, and session.', zh: 推断：用户身份或房间特征可成为捷径，需要按人、房间、会话独立评估。}
limitations:
- {en: 'Although all may be called CSI, amplitudes, complex CFR, and Doppler/BVP preserve different amounts of information.', zh: 同样叫 CSI，幅度、复 CFR、Doppler/BVP 的信息保真程度不同。}
- {en: Cross-task HAR→HumanID transfer does not automatically establish cross-hardware or cross-environment transfer., zh: 跨任务 HAR→HumanID 迁移不自动代表跨硬件或跨环境迁移。}
- {en: 'This review did not confirm papers independently using the SenseFi protocol in 2024–2026, so no precise recent usage count is given.', zh: 本轮未确认 2024–2026 独立使用 SenseFi 协议的论文，因此不给近期精确使用量。}
history:
- {en: '2022-07-16: SenseFi preprint v1', zh: 2022-07-16：SenseFi 预印本 v1}
- {en: '2023-02-17: Paper v3', zh: 2023-02-17：论文 v3}
