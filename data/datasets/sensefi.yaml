id: sensefi
name: SenseFi
year: 2022
origin: benchmark
tasks: [wireless-sensing]
signals: [csi]
environment: []
samples: UT-HAR 3,977 train / 996 test; NTU-HAR 936 / 264; NTU-HumanID 546 / 294; Widar 34,926 / 8,726 (train / test)
license: MIT License
access: {url: 'https://github.com/xyanchen/WiFi-CSI-Sensing-Benchmark', type: open}
code: ['https://github.com/xyanchen/WiFi-CSI-Sensing-Benchmark']
paper: doi:10.1016/j.patter.2023.100703
used_in: ['doi:10.1109/icc51166.2024.10622623']
citing: ['doi:10.1109/jiot.2023.3262940', 'doi:10.1109/tmc.2025.3552538', 'doi:10.1109/tmc.2025.3544573']
summary: {en: 'A PyTorch library and benchmark for WiFi CSI human sensing that packages four preprocessed datasets: UT-HAR (7 activities), NTU-HAR (6 activities), NTU-HumanID (14 subject classes) and Widar gesture data (22 gesture classes).', zh: 用于 WiFi CSI 人体感知的 PyTorch 库与基准，整理了四个预处理数据集：UT-HAR（7 类活动）、NTU-HAR（6 类活动）、NTU-HumanID（14 个受试者类别）以及 Widar 手势数据（22 类手势）。}
sources: ['https://github.com/xyanchen/WiFi-CSI-Sensing-Benchmark', 'https://arxiv.org/abs/2207.07859', 'https://api.github.com/repos/xyanchen/WiFi-CSI-Sensing-Benchmark/git/trees/HEAD?recursive=1', 'https://raw.githubusercontent.com/xyanchen/WiFi-CSI-Sensing-Benchmark/main/README.md', 'https://raw.githubusercontent.com/xyanchen/WiFi-CSI-Sensing-Benchmark/main/LICENSE', 'https://raw.githubusercontent.com/xyanchen/WiFi-CSI-Sensing-Benchmark/HEAD/dataset.py', 'https://raw.githubusercontent.com/xyanchen/WiFi-CSI-Sensing-Benchmark/HEAD/util.py', 'https://raw.githubusercontent.com/xyanchen/WiFi-CSI-Sensing-Benchmark/HEAD/run.py', 'https://raw.githubusercontent.com/xyanchen/WiFi-CSI-Sensing-Benchmark/HEAD/self_supervised.py', 'https://api.crossref.org/works/10.1016/j.patter.2023.100703', 'https://github.com/xyanchen/WiFi-CSI-Sensing-Benchmark/releases', 'https://github.com/xyanchen/WiFi-CSI-Sensing-Benchmark/tags']
checked: '2026-11-06'
pipeline:
  summary: {en: 'Each source is distributed as processed arrays: NTU-Fi amplitude tensors read from CSIamp, UT-HAR arrays, and Widar BVP tensors. dataset.py applies a fixed normalization per source, and labels come from class folders or label files. SenseFi provides a shared model library and training scripts, not a raw complex-CSI generator.', zh: 各数据源以处理后的数组形式发布：NTU-Fi 为从 CSIamp 读取的幅度张量，UT-HAR 为数组文件，Widar 为 BVP 张量。dataset.py 按数据源使用固定归一化，标签来自类别文件夹或标签文件。SenseFi 提供统一的模型库与训练脚本，但不是原始复 CSI 生成器。}
  stages:
  - title: {en: Collect four processed WiFi sensing sources, zh: 汇集四个已处理的 WiFi 感知数据源}
    detail: {en: 'The authors connect UT-HAR, NTU-Fi HAR, NTU-Fi HumanID and Widar to one PyTorch framework. The four datasets come from different WiFi CSI platforms.', zh: 作者将 UT-HAR、NTU-Fi HAR、NTU-Fi HumanID 与 Widar 接入同一个 PyTorch 框架。这四个数据集来自不同的 WiFi CSI 平台。}
    inputs:
    - {en: Processed data folders linked from Google Drive in the README, zh: README 中 Google Drive 链接提供的处理后数据文件夹}
    outputs:
    - {en: 'Folder trees UT_HAR, NTU-Fi_HAR, NTU-Fi-HumanID and Widardata', zh: 文件夹结构 UT_HAR、NTU-Fi_HAR、NTU-Fi-HumanID 与 Widardata}
    controls:
    - {en: 'Each dataset keeps its own label set: 7 UT-HAR activities, 6 NTU-Fi HAR activities, 14 HumanID subjects and 22 Widar gestures.', zh: 各数据集保留各自的标签集：UT-HAR 7 类活动，NTU-Fi HAR 6 类活动，HumanID 14 名受试者，Widar 22 类手势。}
  - title: {en: Keep amplitude and BVP representations separate, zh: 分开保留幅度与 BVP 表示}
    detail: {en: 'The NTU-Fi loader reads CSIamp from .mat files by default and also accepts CSIphase. Widar files are numeric CSV matrices reshaped to 22 x 20 x 20 BVP tensors. The shapes differ: 1 x 250 x 90 for UT-HAR, 3 x 114 x 500 for NTU-Fi and 22 x 20 x 20 for Widar.', zh: NTU-Fi 加载器默认从 .mat 文件读取 CSIamp，也可读取 CSIphase。Widar 文件为数值 CSV 矩阵，被 reshape 为 22 x 20 x 20 的 BVP 张量。三者形状不同：UT-HAR 为 1 x 250 x 90，NTU-Fi 为 3 x 114 x 500，Widar 为 22 x 20 x 20。}
    inputs:
    - {en: CSIamp or CSIphase entries of NTU-Fi .mat files; numeric CSV files for Widar, zh: NTU-Fi .mat 文件中的 CSIamp 或 CSIphase 项；Widar 的数值 CSV 文件}
    outputs:
    - {en: Amplitude tensors for UT-HAR and NTU-Fi; BVP tensors for Widar, zh: UT-HAR 与 NTU-Fi 的幅度张量；Widar 的 BVP 张量}
  - title: {en: Load UT-HAR arrays and normalize per file, zh: 加载 UT-HAR 数组并按文件归一化}
    detail: {en: 'UT_HAR_dataset reads each file with np.load, although the files carry a .csv suffix. It reshapes the data to N x 1 x 250 x 90 and scales each loaded file by that file''s own minimum and maximum. Labels are read from separate label files.', zh: UT_HAR_dataset 用 np.load 读取每个文件（尽管文件后缀为 .csv），重排为 N x 1 x 250 x 90，并按该文件自身的最小值与最大值缩放。标签从独立的标签文件读取。}
    inputs:
    - {en: Binary arrays with .csv suffix in UT_HAR/data, zh: UT_HAR/data 中后缀为 .csv 的二进制数组}
    - {en: Label files in UT_HAR/label, zh: UT_HAR/label 中的标签文件}
    outputs:
    - {en: UT-HAR input tensors and activity labels, zh: UT-HAR 输入张量与活动标签}
    controls:
    - {en: 'Normalization uses each loaded file''s own minimum and maximum, not a fit on the training set.', zh: 归一化使用每个已加载文件自身的最小值与最大值，而非训练集拟合。}
  - title: {en: Apply fixed constants to NTU-Fi and Widar, zh: 对 NTU-Fi 与 Widar 应用固定常数}
    detail: {en: 'CSI_Dataset normalizes NTU-Fi amplitudes with (x - 42.3199) / 4.9802, keeps every fourth point on the time axis (2000 to 500 samples) and reshapes to 3 x 114 x 500. Widar_Dataset normalizes with (x - 0.0025) / 0.0119 and reshapes to 22 x 20 x 20.', zh: CSI_Dataset 使用 (x - 42.3199) / 4.9802 对 NTU-Fi 幅度归一化，时间轴每 4 点取 1 点（2000 到 500 个采样），并 reshape 为 3 x 114 x 500。Widar_Dataset 使用 (x - 0.0025) / 0.0119 归一化，并 reshape 为 22 x 20 x 20。}
    inputs:
    - {en: CSIamp arrays in NTU-Fi .mat files, zh: NTU-Fi .mat 文件中的 CSIamp 数组}
    - {en: Widar numeric CSV files, zh: Widar 数值 CSV 文件}
    outputs:
    - {en: NTU-Fi amplitude tensors and Widar BVP tensors, zh: NTU-Fi 幅度张量与 Widar BVP 张量}
    controls:
    - {en: The normalization constants are literals in dataset.py; the code does not say how they were estimated., zh: 归一化常数以字面量写在 dataset.py 中；代码未说明其估计方式。}
  - title: {en: Assign labels and splits from folders and files, zh: 按文件夹与文件分配标签和划分}
    detail: {en: 'NTU-Fi and Widar class indices come from class folders enumerated with glob, which returns paths in no guaranteed order. The HumanID loaders use test_amp as the training set and train_amp as the test set, the reverse of the folder names. The UT-HAR test set is the validation and test arrays concatenated.', zh: NTU-Fi 与 Widar 的类别编号来自用 glob 枚举的类别文件夹，glob 不保证返回顺序。HumanID 加载器以 test_amp 作为训练集、以 train_amp 作为测试集，与文件夹名称相反。UT-HAR 的测试集为验证集与测试集拼接。}
    inputs:
    - {en: 'Class subdirectories (NTU-Fi, Widar) and label files (UT-HAR)', zh: 类别子目录（NTU-Fi、Widar）与标签文件（UT-HAR）}
    outputs:
    - {en: Training and test datasets for each loader, zh: 各加载器的训练与测试数据集}
    controls:
    - {en: 'Class indices depend on folder enumeration, so the label mapping is not fixed by the files.', zh: 类别编号取决于文件夹枚举顺序，因此文件本身并不固定标签映射。}
  - title: {en: Run supervised or self-supervised training, zh: 运行监督或自监督训练}
    detail: {en: 'run.py trains supervised models on the four loaders and reports accuracy. self_supervised.py trains on NTU-Fi HAR and tests on NTU-Fi HumanID. The self-supervised script contains no masking step, and the transform argument of CSI_Dataset is optional.', zh: run.py 在四个加载器上进行监督训练并报告准确率。self_supervised.py 在 NTU-Fi HAR 上训练，在 NTU-Fi HumanID 上测试。自监督脚本中没有掩码步骤，CSI_Dataset 的 transform 参数为可选。}
    inputs:
    - {en: Amplitude and BVP tensors with activity or identity labels, zh: 带活动或身份标签的幅度与 BVP 张量}
    - {en: Model name selected on the command line, zh: 命令行选择的模型名称}
    outputs:
    - {en: 'Training logs, test accuracy and model weights', zh: 训练日志、测试准确率与模型权重}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: 'Processed amplitude and BVP arrays; activity and identity labels with train and test folders; model library, training scripts and pre-trained weight links.', zh: 处理后的幅度与 BVP 数组；带 train 与 test 文件夹的活动和身份标签；模型库、训练脚本与预训练权重链接。}
- label: {en: Derived outputs, zh: 派生输出}
  text: {en: Loaded tensors with source-specific normalization; optional input transforms; classification accuracy from run.py., zh: 按数据源归一化后的加载张量；可选的输入变换；run.py 输出的分类准确率。}
- label: {en: Normalization, zh: 归一化}
  text: {en: UT-HAR is scaled by each file's own min and max; NTU-Fi and Widar use fixed constants in dataset.py. The subsets are not normalized the same way., zh: UT-HAR 按每个文件自身的最小值与最大值缩放；NTU-Fi 与 Widar 使用 dataset.py 中的固定常数。各子集的归一化方式不同。}
