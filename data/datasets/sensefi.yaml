usage:
- {en: 'Download the processed folders listed in the README and place them under a Data directory with NTU-Fi_HAR, NTU-Fi-HumanID, UT_HAR and Widardata.', zh: 按 README 下载处理后的数据文件夹，放入 Data 目录下的 NTU-Fi_HAR、NTU-Fi-HumanID、UT_HAR 与 Widardata。}
- {en: 'Run supervised training with python run.py --model [model] --dataset [UT_HAR_data, NTU-Fi-HumanID, NTU-Fi_HAR or Widar].', zh: '使用 python run.py --model [模型] --dataset [UT_HAR_data、NTU-Fi-HumanID、NTU-Fi_HAR 或 Widar] 运行监督训练。'}
- {en: 'Run self-supervised training with python self_supervised.py --model [model]; it trains on NTU-Fi HAR and tests on NTU-Fi HumanID.', zh: '使用 python self_supervised.py --model [模型] 运行自监督训练；它在 NTU-Fi HAR 上训练，在 NTU-Fi HumanID 上测试。'}
- {en: The repository specifies PyTorch 1.12.0 and torchvision 0.13.0., zh: 仓库指定 PyTorch 1.12.0 与 torchvision 0.13.0。}
- {en: Pre-trained weights for all models are linked from the README., zh: README 中提供所有模型的预训练权重链接。}
field_notes:
- label: {en: CSI, zh: CSI}
  text: {en: 'The NTU-Fi loader reads CSIamp by default, and the Widar loader reads BVP CSV files. Neither loader returns a complex CSI array.', zh: NTU-Fi 加载器默认读取 CSIamp，Widar 加载器读取 BVP CSV 文件。两者都不返回复 CSI 数组。}
- label: {en: Time, zh: 时间}
  text: {en: 'After the loader keeps every fourth point of the 2000 time samples, NTU-Fi tensors have 500 time samples.', zh: 加载器每 4 点取 1 点后，NTU-Fi 张量在时间轴上保留 500 个采样（原为 2000）。}
- label: {en: Position, zh: 位置}
  text: {en: 'The processed-view loaders return signal tensors and activity or identity classes, not position coordinates.', zh: 处理后视图的加载器返回信号张量与活动或身份类别，不返回位置坐标。}
tools: [project-sensefi]
overview: {en: 'SenseFi is a PyTorch library and benchmark for deep-learning WiFi CSI human sensing. It was posted to arXiv as 2207.07859 and published in Patterns, volume 4, number 3, in 2023, by Jianfei Yang, Xinyan Chen, Dazhuo Wang, Han Zou, Chris Xiaoxuan Lu, Sumei Sun and Lihua Xie. It packages four public WiFi CSI datasets from their original papers, distributed as processed files: UT-HAR (7 activity classes), NTU-HAR (6 activity classes), NTU-HumanID (14 subject classes) and Widar (22 gesture classes). The train and test counts are 3977 and 996 for UT-HAR, 936 and 264 for NTU-HAR, 546 and 294 for NTU-HumanID, and 34926 and 8726 for Widar. The library implements MLP, LeNet, ResNet18, ResNet50, ResNet101, RNN, GRU, LSTM, BiLSTM, CNN+GRU and ViT models for supervised training, and provides a self-supervised example that trains on NTU-Fi HAR and tests on NTU-Fi HumanID. The processed data are linked from Google Drive in the README, and the repository also offers pre-trained weights.',
  zh: 'SenseFi 是基于 PyTorch 的深度学习 WiFi CSI 人体感知库与基准。论文以 arXiv:2207.07859 发布，并于 2023 年以第 4 卷第 3 期发表于 Patterns，作者为 Jianfei Yang、Xinyan Chen、Dazhuo Wang、Han Zou、Chris Xiaoxuan Lu、Sumei Sun 与 Lihua Xie。它整理了四个公开的 WiFi CSI 数据集，数据来自各自的原始论文，并以处理后的文件形式发布：UT-HAR（7 类活动）、NTU-HAR（6 类活动）、NTU-HumanID（14 类受试者）和 Widar（22 类手势）。训练与测试样本数分别为：UT-HAR 3977 / 996，NTU-HAR 936 / 264，NTU-HumanID 546 / 294，Widar 34926 / 8726。库中实现了 MLP、LeNet、ResNet18、ResNet50、ResNet101、RNN、GRU、LSTM、BiLSTM、CNN+GRU 与 ViT 模型用于监督训练，并提供自监督示例：在 NTU-Fi HAR 上训练、在 NTU-Fi HumanID 上测试。处理后的数据通过 README 中的 Google Drive 链接获取，仓库同时提供预训练权重。'}
signal_details:
- signal: csi
  text: {en: 'Processed WiFi CSI tensors, source-specific. UT-HAR: 1 x 250 x 90. NTU-HAR and NTU-HumanID: 3 x 114 x 500, read from CSIamp in .mat files; the loader also accepts CSIphase. Widar: BVP of 22 x 20 x 20 from numeric CSV files. Normalisation differs by source: UT-HAR scales each loaded array by its own minimum and maximum; NTU-Fi uses (x - 42.3199) / 4.9802; Widar uses (x - 0.0025) / 0.0119.', zh: 各数据源处理后的 WiFi CSI 张量。UT-HAR：1 x 250 x 90。NTU-HAR 与 NTU-HumanID：3 x 114 x 500，从 .mat 文件中的 CSIamp 读取；加载器也可选 CSIphase。Widar：由数值 CSV 文件得到的 22 x 20 x 20 BVP。归一化因数据源而异：UT-HAR 对每个加载的数组按其自身最小值与最大值缩放；NTU-Fi 使用 (x - 42.3199) / 4.9802；Widar 使用 (x - 0.0025) / 0.0119。}
