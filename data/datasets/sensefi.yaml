- {en: Amplitude tensors or BVP representations, zh: 幅度张量或 BVP 表示}
- {en: Official processed train/test views, zh: 官方处理后的 train/test 视图}
- {en: SenseFi's unified model library and supervised/self-supervised protocols, zh: SenseFi 统一模型库与监督/自监督协议}
technical_notes:
- {en: The four source datasets come from different WiFi CSI platforms., zh: 四个源数据集来自不同的 WiFi CSI 平台。}
- {en: 'NTU-Fi HAR and HumanID are amplitude tensors of shape 3 x 114 x 500, while Widar is a 22 x 20 x 20 BVP tensor; the three views should not be treated as the same complex CSI.', zh: NTU-Fi HAR 与 HumanID 为形状 3 x 114 x 500 的幅度张量，Widar 为 22 x 20 x 20 的 BVP 张量；三种视图不应视为相同形式的复 CSI。}
limitations:
- {en: The README says the code runs on Ubuntu; on Windows the path separators in the dataset directory code must be changed., zh: README 说明代码在 Ubuntu 上运行；在 Windows 上需要修改数据目录代码中的路径分隔符。}
- {en: 'The README asks for the datasets to be unzipped on Linux to avoid decoding errors, and states that UT-HAR files cannot be read correctly in Excel.', zh: README 要求在 Linux 下解压数据集以避免解码错误，并说明 UT-HAR 文件在 Excel 中无法正确读取。}
