pipeline:
  summary: {en: 'A 60 GHz SDR testbed transmits IEEE 802.11ay packets, and the TRN fields in each packet yield CIR for people moving in indoor rooms. Uniform or sparse packet timing defines each sequence, and the released CIR is further processed into micro-Doppler spectrograms.', zh: 60 GHz SDR测试平台发送IEEE 802.11ay数据包，每个包中的TRN字段可得到室内人员运动的CIR。均匀或稀疏的包时序定义每条序列，发布的CIR再处理为micro-Doppler谱图。}
  scope: {en: Public DISC-A/B/C CIR/TIME and micro-Doppler interfaces; measurements capture human scattering., zh: DISC-A/B/C公开CIR/TIME与micro-Doppler接口；测量对象为人体散射。}
  stages:
  - title: {en: 'Record subjects, activities and rooms', zh: 记录受试者、活动与房间}
    detail: {en: 'Seven subjects perform five activities in two indoor rooms while the testbed transmits 802.11ay packets, and the scattering from their motion enters the received channel. DISC-A and DISC-B use a uniform packet interval; DISC-C uses packet timing taken from Wi-Fi access-point traffic traces.', zh: 7名受试者在两个室内房间完成5种活动，测试平台发送802.11ay数据包，人体运动的散射进入接收信道。DISC-A与DISC-B采用均匀包间隔，DISC-C采用取自Wi-Fi接入点流量迹线的包时序。}
    inputs:
    - {en: 'Subjects, activities and two indoor rooms', zh: 受试者、活动与两个室内房间}
    outputs:
    - {en: 'Runs labeled by subject, activity and room', zh: 按受试者、活动与房间标注的运行数据}
  - title: {en: Set beam training and packet timing, zh: 设置波束训练与包时序}
    detail: {en: 'Each DISC-B and DISC-C packet carries 12 TRN fields, and each field uses a different beam pattern, so the packet scans a field of view from -45 to +45 degrees. Uniform sequences use a 0.27 ms packet interval; sparse sequences store the actual transmission time in TIME.', zh: DISC-B与DISC-C的每个数据包含12个TRN字段，每个字段使用不同的波束图样，覆盖-45度至+45度的视场。均匀序列的包间隔为0.27 ms；稀疏序列在TIME中保存实际发送时刻。}
    inputs:
    - {en: Communication packets and TRN fields, zh: 通信数据包与TRN字段}
    outputs:
    - {en: Packet-level observations for each beam pattern, zh: 每个波束图样的包级观测}
    - {en: Packet interval or TIME, zh: 包间隔或TIME}
  - title: {en: Estimate CIR from TRN units, zh: 由TRN单元估计CIR}
    detail: {en: 'Each TRN unit is correlated with its known Golay pilot sequence to estimate the channel impulse response. The release stores one MAT file per sequence, with CIR of shape range bins by packets by beam patterns and 512 range bins.', zh: 每个TRN单元与已知的Golay导频序列做相关，得到信道冲激响应。发布数据中每条序列对应一个MAT文件，CIR形状为距离单元×数据包×波束图样，共512个距离单元。}
    inputs:
    - {en: Received packets and TRN training fields, zh: 接收数据包与TRN训练字段}
    outputs:
    - {en: Complex CIR arrays in MAT files; TIME in sparse sequences, zh: MAT文件中的复数CIR数组；稀疏序列含TIME}
  - title: {en: Compute micro-Doppler spectrograms, zh: 计算micro-Doppler谱图}
    detail: {en: Micro-Doppler spectrograms are computed from the CIR with a short-time Fourier transform using a Hanning window of W = 64 samples and a 32-sample overlap. They are released as NumPy arrays with time frames by frequency bins., zh: micro-Doppler谱图由CIR经短时傅里叶变换得到，使用长度W = 64个样本的Hanning窗，重叠32个样本。发布格式为NumPy数组，维度为时间帧×频率点。}
    inputs:
    - {en: CIR sequences and packet times, zh: CIR序列与包时间}
    outputs:
    - {en: NPY micro-Doppler spectrograms for all three parts, zh: 三部分数据的NPY micro-Doppler谱图}
  - title: {en: 'Benchmark tracking, activity recognition and sparse adaptation', zh: 基准测试跟踪、活动识别与稀疏域适应}
    detail: {en: 'The paper benchmarks people tracking with an extended Kalman filter on range-angle measurements, activity recognition on micro-Doppler spectrograms, and domain adaptation from uniformly sampled data to sparse data.', zh: 论文以扩展卡尔曼滤波器对距离-角度测量进行人员跟踪，以micro-Doppler谱图进行活动识别，并测试从均匀采样数据到稀疏数据的域适应。}
    inputs:
    - {en: CIR peaks and micro-Doppler spectrograms, zh: CIR峰值与micro-Doppler谱图}
    outputs:
    - {en: 'Tracks, activity labels and sparse-domain results', zh: 轨迹、活动标签与稀疏域结果}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: 'MAT CIR files with optional TIME, NPY micro-Doppler spectrograms, and XLSX index files that map test IDs to subjects, activities, file paths, days and rooms.', zh: MAT格式CIR文件（可选TIME）、NPY格式micro-Doppler谱图，以及把测试编号映射到受试者、活动、文件路径、日期和房间的XLSX索引文件。}
- label: {en: Subjects, zh: 受试者}
  text: {en: 'DISC-A has seven subjects performing four activities (walking, running, sitting down and standing up, waving hands). DISC-B has single-subject data with five activities and multi-subject data with up to five people present at once. DISC-C has one subject performing the same four activities as DISC-A.', zh: DISC-A为7名受试者完成4种活动（行走、跑步、坐下与起立、挥手）。DISC-B包含单人完成5种活动的数据，以及最多5人同时活动的数据。DISC-C为单人完成与DISC-A相同的4种活动。}
- label: {en: Derived outputs, zh: 派生输出}
  text: {en: 'Range and AoA estimates from the multi-beam CIR of DISC-B, and person tracks from an extended Kalman filter on CIR peaks.', zh: 由DISC-B多波束CIR得到的距离与AoA估计，以及由CIR峰值经扩展卡尔曼滤波得到的人员轨迹。}
provenance:
- {en: Indoor subject activity → 60 GHz SDR transmits communication packets, zh: 室内受试者活动 → 60 GHz SDR发送通信包}
- {en: Channel estimation from received packets → CIR time series, zh: 接收包信道估计 → CIR时间序列}
- {en: Activity/subject splits and uniform/sparse traffic conditions → benchmark, zh: 活动/受试者划分与均匀/稀疏流量条件 → benchmark}
technical_notes:
- {en: 'The CIR contains scattering from human body motion measured in indoor rooms, so it is a direct RF-sensing observation.', zh: CIR包含室内人体运动的散射，因此是直接的RF感知观测。}
- {en: The 1.76 GHz signal bandwidth gives a delay resolution of 0.568 ns., zh: 1.76 GHz信号带宽对应0.568 ns的时延分辨率。}
- {en: 'With the 0.27 ms packet interval and a 64-sample window, the micro-Doppler velocity range is about ±4.48 m/s and the velocity resolution about 0.14 m/s.', zh: 在0.27 ms包间隔和64样本窗口下，micro-Doppler速度范围约为±4.48 m/s，速度分辨率约为0.14 m/s。}
- {en: 'Sparse sequences need reconstruction methods such as compressed sensing, because a standard STFT on irregularly spaced packets gives a corrupted spectrogram.', zh: 稀疏序列需要压缩感知等重建方法，因为标准STFT用于非均匀间隔的数据包时会得到失真的谱图。}
- {en: The testbed uses a Sivers EVK06002 60 GHz front end with 16-element TX and RX phased arrays and a Xilinx FPGA baseband., zh: 测试平台使用Sivers EVK06002 60 GHz前端，配备16阵元的发射与接收相控阵，基带为Xilinx FPGA。}
limitations:
- {en: 'The links are single-input single-output 802.11ay channels, so the data do not contain a multi-antenna CSI tensor.', zh: 链路为单输入单输出的802.11ay信道，因此数据不包含多天线CSI张量。}
- {en: 'The beam patterns cover a field of view from -45 to +45 degrees, which limits the angular coverage.', zh: 波束图样覆盖-45度至+45度的视场，限制了角度覆盖范围。}
- {en: 'DISC-C contains a single subject only, so the sparse-sampling results come from one person.', zh: DISC-C只包含单个受试者，因此稀疏采样的结果仅来自一人。}
history:
- {en: '2023-06-15: first arXiv version (arXiv:2306.09469).', zh: '2023-06-15：首个arXiv版本（arXiv:2306.09469）。'}
- {en: '2025-02-12: arXiv version 4.', zh: 2025-02-12：arXiv第4版。}
- {en: '2025-10: published in IEEE Communications Magazine, volume 63, issue 10.', zh: 2025-10：发表于IEEE Communications Magazine第63卷第10期。}
- {en: '2026-08-10: Zenodo scripts package and index of the dataset parts published (record 21871050).', zh: 2026-08-10：Zenodo脚本包与数据分卷索引发布（记录21871050）。}
usage:
- {en: 'DISC-A (2 parts) and DISC-B (12 parts) are split into Zenodo archives; concatenate the parts with cat before extracting, as the scripts package describes.', zh: DISC-A（2个分卷）与DISC-B（12个分卷）被拆分到多个Zenodo文件中；解压前用cat合并分卷，具体步骤见脚本包说明。}
- {en: 'Reproduce the micro-Doppler spectrograms from the CIR with the stated settings (W = 64, 32-sample overlap, Hanning window) before comparing them with the released NPY files.', zh: 在与发布的NPY文件比较之前，先按给定参数（W = 64，重叠32样本，Hanning窗）从CIR重算micro-Doppler谱图。}
field_notes:
- label: {en: CSI, zh: CSI}
  text: {en: CIR is provided directly from SISO links; the data are not a multi-antenna CSI matrix., zh: CIR直接来自SISO链路，数据并非多天线CSI矩阵。}
- label: {en: Paths, zh: 路径}
  text: {en: 'The released fields are CIR and TIME. Delay and power can be derived from the CIR, and AoA is estimated from the DISC-B beam patterns; per-path interaction records are not released.', zh: 发布字段为CIR与TIME。由CIR可导出时延与功率，AoA由DISC-B的波束图样估计；不发布逐路径交互记录。}
- label: {en: Radar, zh: 雷达}
  text: {en: 'The RF-sensing representations come from communication CIR, not from a separate radar device.', zh: RF感知表征来自通信CIR，而非独立雷达设备。}
- label: {en: Position, zh: 位置}
  text: {en: The multi-beam CIR of DISC-B supports range and AoA estimation and target localization and tracking. The released CIR and TIME fields carry no position labels., zh: DISC-B的多波束CIR支持距离与AoA估计以及目标定位和跟踪。发布的CIR与TIME字段不含位置标签。}
- label: {en: Beam labels, zh: 波束标签}
  text: {en: DISC-B uses 12 TRN fields per packet to scan the field of view with different beam patterns; the third CIR axis is n_bp., zh: DISC-B每个数据包使用12个TRN字段，以不同波束图样扫描视场；CIR的第三个轴为n_bp。}
- label: {en: RGB, zh: RGB}
  text: {en: 'The public data description lists CIR, optional TIME and NPY spectrograms; no RGB observations are included.', zh: 公开数据说明列出CIR、可选TIME与NPY谱图，不含RGB观测。}
- label: {en: Multi-user, zh: 多用户}
  text: {en: 'Concurrent people are sensed scattering targets, not communication UEs with their own channels; the data contain no multi-UE channels.', zh: 同时出现的多人是被感知的散射目标，而非拥有各自信道的通信UE；数据中不含多UE信道。}
- label: {en: Time, zh: 时间}
  text: {en: 'Sparse sequences provide TIME in seconds; uniform sequences omit TIME, and their timing follows from the fixed packet interval.', zh: 稀疏序列提供以秒为单位的TIME；均匀序列省略TIME，其时间由固定包间隔推算。}
overview: {en: 'DISC is a set of 60 GHz channel impulse response (CIR) sequences recorded with a software-defined radio testbed that transmits IEEE 802.11ay packets. Researchers at the University of Padova and the IMDEA Networks Institute produced the data, and the arXiv version was first submitted in June 2023. The paper appeared in the October 2025 issue of IEEE Communications Magazine. The CIRs capture reflections from people moving in indoor rooms, with seven subjects performing four or five activities in two environments. The data have three parts: DISC-A, almost 40 minutes of uniformly timed packets; DISC-B, over 40 minutes of uniformly timed packets with 12 TRN fields per packet for different beam patterns; and DISC-C, 9 minutes of sparse packets whose timing follows three Wi-Fi traffic patterns. Raw CIR is stored in .mat files, and micro-Doppler spectrograms are included as .npy files for all three parts. The Zenodo record contains a scripts package, and the data archives are linked
    from its page. The dataset is licensed under CC BY 4.0.', zh: DISC是一组60 GHz信道冲激响应（CIR）序列，由发射IEEE 802.11ay数据包的软件定义无线电测试平台采集。数据由帕多瓦大学和IMDEA Networks研究所的研究人员制作，arXiv版本于2023年6月首次提交。论文发表于IEEE Communications Magazine 2025年10月出版的期次。CIR记录了室内人员移动产生的反射，7名受试者在两种环境中完成4至5种活动。数据分为三部分：DISC-A约40分钟，数据包时间间隔均匀；DISC-B超过40分钟，数据包时间间隔均匀，每个数据包含12个TRN字段，对应不同波束图样；DISC-C为9分钟，数据包稀疏，时间遵循三种Wi-Fi流量模式。原始CIR以.mat文件保存，三部分数据均附带.npy格式的micro-Doppler谱图。Zenodo记录中包含脚本压缩包，数据压缩包通过该页面链接获取。数据集采用CC BY 4.0许可。}
signal_details:
- signal: cir
  text: {en: 'Channel impulse response from IEEE 802.11ay packets at 60 GHz, captured with a software-defined radio platform built on a Sivers mmWave front-end, an FPGA and a baseband processor. Each .mat file holds a CIR field of shape (512, n_packets, n_bp): 512 range bins, one column per packet, and n_bp = 1 or 12 beam patterns. The optional TIME field gives transmission instants in seconds and appears only in the sparse sequences of DISC-C. The uniform sequences have an inter-packet time of 0.27 ms, with more than 3 CIR estimates per millisecond. DISC-C traces are 8.7 s long, with M = 4, 8, 16, 32 or 64 packets per window.', zh: '来自 IEEE 802.11ay 数据包的 60 GHz 信道冲激响应，由基于 Sivers 毫米波前端、FPGA 和基带处理器的软件定义无线电平台采集。每个 .mat 文件包含形状为 (512, n_packets, n_bp) 的 CIR 字段：512 个距离单元，每个数据包一列，n_bp = 1 或 12 个波束图样。可选的 TIME 字段以秒为单位给出发射时刻，仅出现在 DISC-C 的稀疏序列中。均匀序列的数据包间隔为 0.27 ms，每毫秒超过 3 个 CIR 估计值。DISC-C 每段轨迹长 8.7 s，每个窗口包含 M = 4、8、16、32 或 64 个数据包。'}
bandwidth_mhz: 1760
antennas: {tx: 16, rx: 16}
capabilities:
- key: csi
  status: derivable
  note: {en: 'Only SISO complex CIR is released; a frequency-domain response can be computed by Fourier transform, and no multi-antenna CSI matrix is provided.', zh: 仅发布SISO复数CIR；可通过傅里叶变换计算频域响应，但不提供多天线CSI矩阵。}
- key: cir
  status: provided
  note: {en: Complex SISO CIR with 512 range bins per packet; DISC-B has 12 beam patterns on the third axis., zh: 每个数据包为512个距离单元的复数SISO CIR；DISC-B在第三维度上包含12个波束图样。}
- key: paths
  status: derivable
  note: {en: 'Per-path delay and power can be derived from the CIR; AoA is estimated from DISC-B beam patterns, and per-path interaction records are not released.', zh: 由CIR可导出逐路径时延与功率；AoA由DISC-B的波束图样估计，不发布逐路径交互记录。}
- key: interaction
  status: none
  note: {en: Per-path interaction records are not released; the public data are CIR and TIME only., zh: 不发布逐路径交互记录，公开数据仅包含CIR与TIME。}
- key: power
  status: derivable
  note: {en: Received power per range bin can be computed from the complex CIR; no power field is released., zh: 接收功率可由复数CIR按距离单元计算；发布数据中没有功率字段。}
- key: iq
  status: none
  note: {en: 'Native outputs are CIR, TIME, NPY spectrograms and XLSX indexes; raw I/Q samples are not listed.', zh: 原生输出为CIR、TIME、NPY谱图和XLSX索引；未列出原始I/Q采样。}
- key: beam_labels
  status: provided
  note: {en: 'DISC-B CIR is indexed by beam pattern along the n_bp axis (12 patterns, -45 to +45 degrees); no best-beam label is stated.', zh: DISC-B的CIR沿n_bp轴按波束图样索引（12个图样，-45至+45度）；未给出最佳波束标签。}
- key: position
  status: derivable
