summary: {en: '60 GHz channel impulse response (CIR) sequences from IEEE 802.11ay packets reflected by people moving in indoor environments. The three parts contain almost 40 minutes (DISC-A), over 40 minutes (DISC-B) and 9 minutes (DISC-C) of data, with one to seven subjects performing four or five activities.', zh: 来自 IEEE 802.11ay 数据包的 60 GHz 信道冲激响应（CIR）序列，记录室内环境中人员移动造成的反射。三部分数据分别约 40 分钟（DISC-A）、超过 40 分钟（DISC-B）和 9 分钟（DISC-C），由 1 至 7 名受试者完成四至五种活动。}
