technical_notes:
  - {en: 'Each pixel is a 1 m x 1 m ground cell. All environment matrices share the same grid as the channel matrices.', zh: '每个像素为 1 m × 1 m 的地面单元，所有环境矩阵与信道矩阵共用同一网格。'}
  - {en: 'File names use h01 for 1 m up to h20 for 100 m, and f01 to f05 for 900 MHz, 2.6, 3.5, 5 and 41 GHz.', zh: '文件名中 h01 表示 1 m，h20 表示 100 m；f01 至 f05 分别表示 900 MHz、2.6、3.5、5 与 41 GHz。'}
