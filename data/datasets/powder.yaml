summary: {en: 'Over-the-air measurements from the POWDER platform at the University of Utah, including raw 5G NR uplink SRS at 3.42 GHz with GNSS and drone-video ground truth, drive-test KPIs such as SS-RSRP and SS-SINR, and RF I/Q captures.', zh: 来自犹他大学 POWDER 平台的空口实测数据，包括 3.42 GHz 的原始 5G NR 上行 SRS（附 GNSS 与无人机视频真值）、SS-RSRP 与 SS-SINR 等路测 KPI，以及 RF I/Q 采样。}
sources: ['https://powderwireless.net/data', 'https://docs.powderwireless.net/powder-overview.html', 'https://zenodo.org/records/23717707', 'https://zenodo.org/records/23741918', 'https://doi.org/10.1016/j.comnet.2021.108281', 'https://api.crossref.org/works/10.1016/j.comnet.2021.108281', 'https://zenodo.org/api/records/23717707/files/README.md/content', 'https://zenodo.org/api/records/23717707/files/LICENSE.md/content', 'https://zenodo.org/api/records/23717707', 'https://zenodo.org/api/records/23741918', 'https://zenodo.org/api/records/23603729', 'https://zenodo.org/api/records/23789378', 'https://zenodo.org/api/records/18272105', 'https://zenodo.org/api/records/18272105/files/README.md/content', 'https://zenodo.org/api/records/19462212', 'https://zenodo.org/api/records/19463551', 'https://zenodo.org/api/records/19445683', 'https://zenodo.org/api/records/23717707/versions', 'https://zenodo.org/api/records/23741918/versions']
checked: '2026-11-06'
pipeline:
  summary: {en: 'A 5G NR gNB on POWDER receives SRS from UEs over the air, while GNSS, drone video and UE logs record the scene. Users align the streams by their UTC timestamps and derive channel and sensing quantities from the raw SRS.', zh: POWDER 上的 5G NR gNB 通过空口接收 UE 发送的 SRS，同时 GNSS、无人机视频与 UE 日志记录场景。使用者按 UTC 时间戳对齐各数据流，并从原始 SRS 推导信道与感知量。}
  scope: {en: 'Illustrated with the two 2026 public SRS records: Outdoor 5G Mobility and Outdoor Bistatic 5G ISAC.', zh: 以两套 2026 年公开 SRS 记录为例：Outdoor 5G Mobility 与 Outdoor Bistatic 5G ISAC。}
  stages:
  - title: {en: Configure the 5G NR link, zh: 配置5G NR链路}
    detail: {en: 'The gNB runs n78 at 3.42 GHz with 30 kHz subcarriers on a PTP-disciplined host with a Benetel RAN650 radio unit. The receive panel is a dual-slant (±45°) panel on the Merrill Engineering Building roof, with four ports for ISAC and two for Mobility. ISAC uses TDD DDDSU (2.5 ms) and Mobility uses DDDSUU + DSUU (5 ms).', zh: gNB 在 PTP 同步的主机上运行 n78 频段（中心频率 3.42 GHz，子载波间隔 30 kHz），射频单元为 Benetel RAN650。接收天线为安装在 Merrill Engineering Building 屋顶的双极化（±45°）面板，ISAC 使用四个端口，Mobility 使用两个端口。ISAC 采用 TDD DDDSU（2.5 ms），Mobility 采用 DDDSUU + DSUU（5 ms）。}
    inputs:
    - {en: gNB and radio unit configuration, zh: gNB与射频单元配置}
    - {en: Dual-slant receive panel and GNSS-locked timing, zh: 双极化接收面板与GNSS锁定的定时}
    outputs:
    - {en: 'SRS configuration: comb, cyclic shifts and period (2.5 ms for ISAC, 10 ms for Mobility)', zh: SRS配置：梳状结构、循环移位与周期（ISAC为2.5 ms，Mobility为10 ms）}
    checks:
    - {en: Read the SRS settings from the file attributes (Mobility) or the configuration archive (ISAC), zh: 从文件属性（Mobility）或配置归档（ISAC）读取SRS设置}
  - title: {en: Run the UEs and moving objects, zh: 运行UE与运动目标}
    detail: {en: 'In the ISAC session, two parked UEs on car roofs transmit SRS while a GNSS-equipped car and a drone move through the lot as reflectors and ground truth. In the Mobility session, a UE on a car roof transmits SRS while the car drives a preplanned campus route.', zh: ISAC 会话中，两台停放在车顶的 UE 发送 SRS，同时装有 GNSS 的汽车与无人机在停车场内运动，分别作为反射体和真值来源。Mobility 会话中，车顶 UE 在预设的校园路线上行驶时发送 SRS。}
    inputs:
    - {en: Quectel RM520N-GL UE modems with roof antennas, zh: Quectel RM520N-GL UE模块及车顶天线}
    - {en: Planned car route and drone flight, zh: 预设的汽车路线与无人机飞行}
    outputs:
    - {en: Two SRS runs per session with UE or target trajectories, zh: 每个会话两轮SRS，以及UE或目标轨迹}
    controls:
    - {en: 'Speed: up to 6 m/s for the ISAC car; 4.5 and 5.0 m/s on average (up to 11 m/s) for Mobility', zh: 车速：ISAC汽车最高6 m/s；Mobility平均4.5与5.0 m/s（最高11 m/s）}
    checks:
    - {en: Separate the moving transmitter (Mobility UE) from the moving reflectors (ISAC car and drone), zh: 区分移动发射机（Mobility的UE）与移动反射体（ISAC的汽车与无人机）}
  - title: {en: Record raw SRS and reference logs, zh: 记录原始SRS与参考日志}
    detail: {en: 'The gNB keeps every SRS it receives, with the resource elements on each receive port, the reference sequences, the configuration, and the frame, slot and capture time. The UE side logs layer 1 to layer 3 events with Nemo Outdoor, a 10 Hz GNSS receiver logs the car track, and the ISAC drone records video and a flight log.', zh: gNB 保存所接收的每一个 SRS，记录各接收端口的资源单元、参考序列、配置以及帧、时隙与采集时间。UE 侧使用 Nemo Outdoor 记录第1层至第3层事件，10 Hz GNSS 接收机记录车辆轨迹，ISAC 的无人机记录视频与飞行日志。}
    inputs:
    - {en: Over-the-air SRS on each receive port, zh: 各接收端口上的空口SRS}
    - {en: UE logs, GNSS receiver and drone video: null, zh: UE日志、GNSS接收机与无人机视频}
    outputs:
    - {en: SRS HDF5 files, GNSS tracks: null, Nemo CSV: null, gNB logs: null, video and flight logs: null, zh: SRS HDF5文件、GNSS轨迹、Nemo CSV、gNB日志、视频与飞行日志}
    checks:
    - {en: The ISAC record states that no snapshots were lost; snapshot counts per UE and run are listed in the record, zh: ISAC记录称未丢失快照；各UE与各轮的快照数见该记录}
  - title: {en: Convert clocks and package the streams, zh: 转换时钟并打包数据流}
    detail: {en: 'Nemo timestamps are UTC−6 without a date, so the date and offset must be added before they align with the UTC-nanosecond SRS and GPX times. The ISAC package separates radio, truth, video and site archives and ships FILES.csv and manifest.yaml; video frame times come from frames.csv and camera.json.', zh: Nemo 时间戳为 UTC−6 且不含日期，须先补全日期并换算偏移，才能与 UTC 纳秒级的 SRS 和 GPX 时间对齐。ISAC 数据包将 radio、truth、video 与 site 分归档，并附带 FILES.csv 与 manifest.yaml；视频帧时间来自 frames.csv 与 camera.json。}
    inputs:
    - {en: 'Nemo CSV, GPX tracks, SRS timestamp_ns and video frame tables', zh: Nemo CSV、GPX轨迹、SRS的timestamp_ns与视频帧表}
    outputs:
    - {en: Streams with UTC timestamps on a common clock, zh: 使用统一UTC时钟的各数据流}
    checks:
    - {en: Verify the video-to-sensing timing separately, zh: 单独核验视频与感知数据之间的时间误差}
  - title: {en: Derive channels and sensing quantities, zh: 推导信道与感知量}
    detail: {en: 'The released SRS contain no processed channels, detections or tracks. Users estimate channels on the observed SRS resources from the reference sequences. For ISAC they apply delay-Doppler processing and compare the detections with the car GNSS and drone logs.', zh: 发布的 SRS 不含处理后的信道、检测结果或航迹。使用者利用参考序列在所观测的 SRS 资源上估计信道；ISAC 数据则需进行时延–Doppler 处理，并将检测结果与车辆 GNSS 及无人机日志对照。}
    inputs:
    - {en: 'Received SRS resource elements (Y, after FFT, no equalisation) and reference sequences (X)', zh: 接收的SRS资源单元（Y，FFT之后、未均衡）与参考序列（X）}
    outputs:
    - {en: Channel estimates on the observed SRS resources and delay-Doppler maps, zh: 所观测SRS资源上的信道估计与时延–Doppler图}
    checks:
    - {en: Score detections against the car GNSS and drone log before reporting results, zh: 报告结果前，先用车辆GNSS与无人机日志对检测结果评分}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: 'Mobility: SRS HDF5 per run, GNSS GPX, Nemo CSV and gNB logs. ISAC: radio HDF5 per run, car GNSS (UBX and CSV), drone flight logs, video with frame tables, and manifests (FILES.csv, manifest.yaml).', zh: Mobility：每轮一个SRS HDF5、GNSS GPX、Nemo CSV与gNB日志。ISAC：每轮一个radio HDF5、车辆GNSS（UBX与CSV）、无人机飞行日志、带帧表的视频，以及清单文件（FILES.csv、manifest.yaml）。}
- label: {en: Derived outputs, zh: 派生输出}
  text: {en: Channel estimates and delay-Doppler products that users compute from the raw SRS. The ISAC record contains none of these., zh: 使用者从原始SRS计算得到的信道估计与时延–Doppler结果；ISAC记录本身不含这些结果。}
- label: {en: Splits, zh: 数据划分}
  text: {en: 'ISAC: no split is given. Runs 1 and 2 follow the same route and can serve as development and test sets.', zh: ISAC：未给出数据划分。第1轮与第2轮路线相同，可分别作为开发集与测试集。}
- label: {en: Video timing, zh: 视频时间}
  text: {en: 'Video frames carry no embedded time. Frame k of a recording is at t0_log_unix + k / 29.97 + tau_s, with t0 and tau_s given in camera.json.', zh: 视频中不写入时间。录像第k帧位于 t0_log_unix + k / 29.97 + tau_s，其中 t0 与 tau_s 见 camera.json。}
- label: {en: Mobility file layout, zh: Mobility文件结构}
  text: {en: 'run1/ and run2/ each contain *_srs.h5, a GPX track, a Nemo CSV and gnb.log. The gNB log covers the whole session and is the same file in both folders.', zh: run1/与run2/各含*_srs.h5、GPX轨迹、Nemo CSV与gnb.log。gNB日志覆盖整场会话，两个文件夹中为同一文件。}
- label: {en: Time conventions, zh: 时间约定}
  text: {en: 'SRS timestamps are UTC (timestamp_ns in Mobility, t_air_unix in ISAC). Nemo logs use UTC−6 without a date.', zh: SRS时间戳为UTC（Mobility为timestamp_ns，ISAC为t_air_unix）；Nemo日志为UTC−6且无日期。}
variants:
- name: {en: Outdoor Bistatic 5G ISAC (October 2026), zh: Outdoor Bistatic 5G ISAC（2026年10月）}
  observations: {en: '3.42 GHz, two stationary UEs, four Rx ports; 2.5 ms SRS per UE, two Tx ports, and 288 RE/port; approximately 1.37 million snapshots. Vehicle-mounted 10 Hz GNSS, drone 4K video, and flight logs.', zh: 3.42 GHz、两台静止UE、四Rx端口；每UE 2.5 ms SRS、两Tx端口、288 RE/port；约137万快照。车载10 Hz GNSS、无人机4K视频与飞行日志。}
  csi: {en: 'Derivable: the raw SRS and reference sequences support channel estimation on the observed SRS resources and bistatic delay-Doppler processing. The record does not provide cleaned channels, detections, tracks, or sensing labels.', zh: 可推导：原始SRS与参考序列支持在所观测SRS资源上进行信道估计，以及双基地时延–Doppler处理；记录未提供清洗后的信道、检测结果、航迹或感知标签。}
- name: {en: Outdoor 5G Mobility (October 2026), zh: Outdoor 5G Mobility（2026年10月）}
  observations: {en: '3.42 GHz, one mobile UE, two Rx ports, and 576 RE/port. SRS is transmitted every 10 ms but recorded every 40 ms. Two runs contain 29,514 snapshots, with Y/X, UTC ns, sfn/slot, and SRS attributes; 10 Hz GPX, Nemo L1–L3, and gNB logs are also included.', zh: '3.42 GHz、单移动UE、两Rx端口、576 RE/port。SRS发送周期10 ms，但记录周期40 ms；两轮共29,514快照，含Y/X、UTC ns、sfn/slot和SRS属性；另有10 Hz GPX、Nemo L1–L3与gNB日志。'}
  csi: {en: 'Derivable: Y/X and the port/comb configuration support SRS channel estimation. The second row of X is NaN in single-Tx-port snapshots; process it according to nof_tx_ports.', zh: 可推导：Y/X及端口/梳状配置支持SRS信道估计；X第二行在单Tx端口快照中为NaN，须按nof_tx_ports处理。}
provenance:
- {en: Select benchtop/indoor/outdoor/shuttle experiments, zh: 台架/室内/室外/班车实验选择}
- {en: Configure SDRs and protocol stacks, zh: SDR 与协议栈配置}
- {en: Actual transmission/reception or controlled channels, zh: 实际发送接收或受控信道}
- {en: User-collected IQ/protocol/KPI data, zh: 用户采集 IQ/协议/KPI}
- {en: Organize an independent research dataset, zh: 整理独立研究数据集}
technical_notes:
- {en: 'The platform supports simulation, emulation and over-the-air experiments, both indoors and outdoors.', zh: 平台支持仿真、模拟（emulation）与空口（OTA）实验，包括室内与室外。}
- {en: The data portal lists a campus-wide outdoor deployment and mobile endpoints on campus shuttles., zh: 数据门户列出了校园范围的室外部署以及校园班车上的移动端点。}
- {en: 'The ISAC gNB radio unit runs on GNSS time over PTP, and the SRS air time is derived from the gNB slot counter.', zh: ISAC的gNB射频单元以GNSS时间经PTP运行，SRS空口时间由gNB时隙计数推导。}
- {en: The ISAC SRS resource elements are stored after the FFT and without equalisation., zh: ISAC的SRS资源单元保存在FFT之后，且未经均衡。}
limitations:
- {en: 'Mobility SRS is configured every 10 ms, but the recorded snapshots are 40 ms apart.', zh: Mobility的SRS配置周期为10 ms，但记录的快照间隔为40 ms。}
- {en: Nemo time is UTC−6 without a date and must be completed before alignment with UTC-nanosecond SRS and GPX timestamps., zh: Nemo时间为UTC−6且无日期，与UTC纳秒级的SRS及GPX时间对齐前须补全日期。}
- {en: 'The two ISAC runs come from one site, one evening, one route, one target car and one drone. Results should not be generalised to other sites without care.', zh: ISAC的两轮数据来自同一站点、同一晚上、同一路线、一辆目标车和一架无人机；结果不宜在缺乏审慎考量的情况下推广到其他站点。}
- {en: 'The ISAC GNSS truth is standalone without RTK, with decimetre-to-metre accuracy.', zh: ISAC的GNSS真值为单点定位（无RTK），精度为分米至米级。}
- {en: 'The ISAC record has no detections, tracks, cleaned channels or labels.', zh: ISAC记录不含检测结果、航迹、清洗后的信道或标签。}
history:
- {en: 'Since August 2020: spectrum scans are archived from POWDER nodes. The 2020 Massive MIMO survey (released 26 October 2020) and the 2020 RF fingerprinting data (created 10 September 2020) are separate records.', zh: 2020年8月起：POWDER节点的频谱扫描数据持续归档。2020年Massive MIMO测量（2020年10月26日发布）与2020年RF指纹数据（2020年9月10日创建）为独立记录。}
- {en: Both 2026 SRS records were collected on 25 October 2026 (UTC) and published on Zenodo on 28 October 2026., zh: 两套2026年SRS记录均于2026年10月25日（UTC）采集，并于2026年10月28日发布在Zenodo。}
usage:
- {en: Create a project account and run a minimal profile following the official getting-started guide., zh: 创建项目账户，并按官方入门指南运行一个最小profile。}
- {en: 'Over-the-air radio resources are enabled per project, and OTA operation may require reserving resources in advance.', zh: 空口（OTA）无线资源按项目开通，OTA运行可能需要提前预订资源。}
- {en: Use is free for NSF-funded academics; use beyond short-term evaluation requires payment., zh: NSF资助的学术用户可免费使用；超出短期评估的使用需要付费。}
overview: {en: 'POWDER is a city-scale, remotely accessible wireless testbed at the University of Utah in Salt Lake City, and one of the NSF Platforms for Advanced Wireless Research (PAWR). The platform is described in a 2021 Computer Networks paper by J. Breen et al. (doi:10.1016/j.comnet.2021.108281), and its public data portal lists over-the-air measurement datasets. The two 2026 Zenodo records described here both use band n78 at 3.42 GHz with a 34.56 MHz SRS span, and both are licensed under CC BY 4.0. The outdoor bistatic 5G ISAC record contains 1.37 million raw uplink SRS snapshots from two parked UEs, recorded every 2.5 ms on a four-port panel over two runs of 13.1 and 15.6 minutes, with vehicle GNSS, drone flight logs and 3840 x 2160 drone video as ground truth. The outdoor 5G mobility record contains 29,514 SRS snapshots from a UE on a car that drove a campus route beginning in the Merrill Engineering Lot, with SRS configured every 10 ms and recorded every 40 ms over two runs, together
    with UE-side Nemo Outdoor logs, GNSS tracks and gNB logs. Other portal entries include drive-test KPIs such as SS-RSRP and SS-SINR, spectrum scans, and I/Q captures with up to four simultaneous OFDM interferers. The ISAC record contains no detections, tracks or processed channels, which users must derive from the raw signals.', zh: 'POWDER 是犹他大学（盐湖城）的城市级可远程访问无线试验平台，也是美国国家科学基金会先进无线研究平台（PAWR）之一。该平台在 2021 年 Computer Networks 论文中有所描述，作者为 J. Breen 等（doi:10.1016/j.comnet.2021.108281）；其公开数据门户列出了空口测量数据集。本文涉及的两条 2026 年 Zenodo 记录均使用 n78 频段、中心频率 3.42 GHz，SRS 跨度 34.56 MHz，许可均为 CC BY 4.0。室外双基地 5G ISAC 记录包含两台停放 UE 的 137 万条原始上行 SRS 快照，每 2.5 ms 在四端口天线面板上采集，分两次运行，时长分别为 13.1 和 15.6 分钟；真值包括车辆 GNSS、无人机飞行日志与 3840 x 2160 无人机视频。室外 5G 移动性记录包含一台装在汽车上的 UE 沿始于 Merrill Engineering 停车场的校园路线行驶时的 29,514 条 SRS 快照，SRS 配置周期为 10 ms、记录间隔为 40 ms，共两次运行，并附带 UE 侧 Nemo Outdoor 日志、GNSS 轨迹与 gNB 日志。门户中的其他条目包括 SS-RSRP、SS-SINR 等路测 KPI、频谱扫描，以及最多四个同时存在的 OFDM 干扰源的 I/Q 采样。ISAC 记录不包含检测结果、航迹或经过处理的信道，这些需要使用者从原始信号中自行推导。'}
signal_details:
- signal: csi
  text: {en: 'Raw 5G NR uplink SRS, not a processed channel estimate. The ISAC record stores the received resource elements on 4 receive ports (288 per port, 120 kHz subcarrier spacing), the reference sequences and the air time of each snapshot. The mobility record stores 576 resource elements per port on 2 receive ports, in run1_srs.h5 and run2_srs.h5 with the frame, slot and gNB capture timestamp of each snapshot (timestamp_ns, UTC).', zh: 原始 5G NR 上行 SRS，而非处理后的信道估计。ISAC 记录保存 4 个接收端口上接收到的资源单元（每端口 288 个，子载波间隔 120 kHz）、参考序列以及每个快照的空口时间。移动性记录保存 2 个接收端口上每端口 576 个资源单元，存于 run1_srs.h5 与 run2_srs.h5，并附带每个快照的帧号、时隙号与 gNB 采集时间（timestamp_ns，UTC）。}
- signal: iq
  text: {en: I/Q captures. The Multiple Simultaneous Interferer record gives RX I/Q data with 0 to 4 simultaneous OFDM interferers. The 2020 RF fingerprinting supplement is distributed as the file POWDER-4BS-IQsample., zh: I/Q 采样。Multiple Simultaneous Interferer 记录提供接收端 I/Q 数据，干扰源为 0 至 4 个同时存在的 OFDM 信号。2020 年 RF 指纹补充数据以文件 POWDER-4BS-IQsample 发布。}
- signal: kpi
  text: {en: 'Drive-test KPIs. The mobility record includes UE-side Nemo Outdoor CSV logs, one row per event, with SS-RSRP, RSRQ, SINR, path loss, PUSCH, PUCCH and SRS transmit power, power headroom, timing advance, MCS, DCI and throughput. The Spectrum Usage record gives band, RSRP, RSRQ and handover events. The 2026 Cellular Metrics record gives per-channel SS-RSRP and SS-SINR from a Viavi CA5000.', zh: 路测 KPI。移动性记录包含 UE 侧 Nemo Outdoor CSV 日志，每行对应一个事件，字段有 SS-RSRP、RSRQ、SINR、路径损耗、PUSCH、PUCCH 与 SRS 发射功率、功率余量、时间提前量、MCS、DCI 与吞吐量。Spectrum Usage 记录给出频段、RSRP、RSRQ 与切换事件。2026 Cellular Metrics 记录给出由 Viavi CA5000 测得的分信道 SS-RSRP 与 SS-SINR。}
- signal: gps
  text: {en: 'GNSS positions. The ISAC record uses a u-blox ZED-X20P receiver at 10 Hz, standalone without RTK, on the target car, with accuracy stated as decimetre to metre. The mobility record has GNSS tracks in GPX (UTC) at about 10 Hz, with 6,457 and 4,815 points from DGPS fixes using 12 satellites. The Spectrum Usage and 2026 Cellular Metrics records include location from GPS.', zh: 'GNSS 位置。ISAC 记录使用安装在目标车辆上的 u-blox ZED-X20P 接收机，频率 10 Hz，独立定位不使用 RTK，精度表述为分米级到米级。移动性记录的 GNSS 轨迹为 GPX 格式（UTC），约 10 Hz，分别含 6,457 与 4,815 个点，为使用 12 颗卫星的 DGPS 定位结果。Spectrum Usage 与 2026 Cellular Metrics 记录同样包含 GPS 位置。'}
bandwidth_mhz: 34.56
capabilities:
- key: csi
  status: derivable
  note: {en: The per-port least-squares channel estimate is computed from the raw SRS with the method in the ISAC README (2026 ISAC record)., zh: 各端口的最小二乘信道估计由原始 SRS 按 ISAC README 中的方法计算（2026 年 ISAC 记录）。}
- key: cir
  status: derivable
  note: {en: 'The delay profile is the IFFT of the least-squares estimate, with one tap of 28.9 ns (2026 ISAC record).', zh: 时延剖面为最小二乘估计的 IFFT，时延抽头为 28.9 ns（2026 年 ISAC 记录）。}
- key: paths
  status: none
  note: {en: 'Per-path delays, angles and gains are processing results and are not in the 2026 SRS records.', zh: 逐径时延、角度与增益属于处理结果，不在 2026 年 SRS 记录中。}
- key: interaction
  status: none
  note: {en: The 2026 SRS records contain no per-path interaction labels and no identified scatterers., zh: 2026 年 SRS 记录中不含逐径交互标注，也不含已识别的散射体。}
- key: power
  status: provided
  note: {en: 'The Mobility UE log holds SS-RSRP, RSRQ, SINR, path loss and transmit power; the 2026 Cellular Metrics record holds per-channel RSRP.', zh: Mobility 的 UE 日志含 SS-RSRP、RSRQ、SINR、路径损耗与发射功率；2026 年 Cellular Metrics 记录含分信道 RSRP。}
- key: iq
  status: provided
  note: {en: The Multiple Simultaneous Interferer dataset holds RX I/Q from 0 to 4 simultaneous OFDM interferers; the SRS records hold frequency-domain resource elements., zh: 多干扰源数据集包含 0 至 4 个同时存在的 OFDM 干扰源的接收端 I/Q；SRS 记录保存的是频域资源单元。}
- {key: beam_labels, status: unknown}
- key: position
  status: provided
  note: {en: 'GNSS tracks at 10 Hz for the ISAC car and the Mobility car, plus drone flight log and camera poses in the ISAC record.', zh: ISAC 中车辆的 GNSS 轨迹（10 Hz）、无人机飞行日志与相机位姿；Mobility 中车辆的 GNSS 轨迹（10 Hz）。}
- key: geometry
  status: provided
  note: {en: The ISAC record has OpenStreetMap features and a ground grid sampled from a 1 m DEM; the augmented RSS record has DSM and building rasters., zh: ISAC 记录含 OpenStreetMap 要素以及由 1 m DEM 采样的地面网格；增强 RSS 记录含 DSM 与建筑栅格。}
- key: materials
  status: none
  note: {en: No material parameters are in the released records., zh: 发布记录中不含材料参数。}
- key: rgb
  status: provided
  note: {en: 'The ISAC record holds drone video at 3840x2160 and 29.97 fps for both runs, with a timed camera pose for each frame.', zh: ISAC 记录含两次运行的无人机视频，分辨率 3840x2160，帧率 29.97 fps，每帧带有定时相机位姿。}
- key: depth
  status: none
  note: {en: No depth sensor output is released; the DSM rasters are map products., zh: 未发布深度传感器输出；DSM 栅格为地图产品。}
- key: lidar
  status: none
  note: {en: The ISAC and Mobility file lists contain no LiDAR data., zh: ISAC 与 Mobility 的文件清单中不含 LiDAR 数据。}
- key: radar
  status: derivable
  note: {en: Delay and Doppler information follows from the per-snapshot SRS estimates of the ISAC record; the release contains no radar products., zh: 时延与多普勒信息可由 ISAC 记录中逐快照的 SRS 估计得到；发布数据中不含雷达产品。}
- key: imu
  status: none
  note: {en: No inertial measurements are released; the drone flight log holds attitude angles only., zh: 未发布惯性测量数据；无人机飞行日志仅含姿态角。}
- key: time_series
  status: provided
  note: {en: 'SRS snapshots are recorded every 2.5 ms per UE (ISAC) and every 40 ms (Mobility), each with a UTC air time.', zh: SRS 快照每个 UE 每 2.5 ms 记录一次（ISAC），Mobility 每 40 ms 记录一次，每个快照带 UTC 空口时间。}
- key: multiuser
  status: provided
  note: {en: 'In the ISAC runs two parked UEs transmit SRS at the same time, stored as separate ue_A and ue_B groups.', zh: ISAC 运行中两台停放的 UE 同时发送 SRS，分别存储为 ue_A 与 ue_B 组。}
- key: multibs
  status: provided
  note: {en: 'The handover record holds gNB-side and UE-side tables from two sites, including neighbouring-cell RSRP.', zh: 切换记录包含两个站点的 gNB 侧与 UE 侧表格，并含相邻小区的 RSRP。}
- key: crossfreq
  status: provided
  note: {en: 'The Cellular Metrics drive measured the 2000 MHz channel and the CBRS channels from 3560 to 3640 MHz on the same route, sampled per second.', zh: Cellular Metrics 路测在同一路线上每秒对 2000 MHz 信道与 3560 至 3640 MHz 的 CBRS 信道进行测量。}
- {key: near_field, status: unknown}
- key: high_mobility
  status: provided
  note: {en: 'The Mobility runs reach 11 m/s (about 40 km/h), with averages of 4.5 and 5.0 m/s.', zh: Mobility 运行速度最高 11 m/s（约 40 km/h），平均速度分别为 4.5 与 5.0 m/s。}
- {key: dynamic_blockage, status: unknown}
- key: reflection
  status: provided
  note: {en: 'inherent in the measurement, not labelled per path', zh: 包含于测量之中，未按径标注}
- key: diffraction
  status: provided
  note: {en: 'inherent in the measurement, not labelled per path', zh: 包含于测量之中，未按径标注}
- key: scattering
  status: provided
  note: {en: 'inherent in the measurement, not labelled per path', zh: 包含于测量之中，未按径标注}
- key: transmission
  status: provided
  note: {en: 'inherent in the measurement, not labelled per path', zh: 包含于测量之中，未按径标注}
- key: polarization
  status: provided
  note: {en: Rx 0-1 and Rx 2-3 of the ISAC panel are cross-polar pairs of a dual-slant (plus or minus 45 degree) panel., zh: ISAC 面板的 Rx 0-1 与 Rx 2-3 为双极化（±45°）面板上的交叉极化端口对。}
- key: em_field
  status: none
  note: {en: 'The release holds received SRS samples, logs and maps, with no field-level or pattern outputs.', zh: 发布数据为接收 SRS 采样、日志与地图，无场级或方向图输出。}
