id: powder
name: POWDER
year: 2020
organization: University of Utah
origin: measured
tasks: [isac, localization, channel-modeling]
signals: [csi, iq, kpi, gps]
bands_ghz: [3.42]
environment: [outdoor-urban]
format: CSV, SigMF
license: 'Varies by record: CC BY 4.0 for the 2026 Outdoor Bistatic 5G ISAC and Outdoor 5G Mobility Zenodo records; Not stated for the other records listed on the data page'
access: {url: 'https://powderwireless.net/data', type: open}
code: []
paper: doi:10.1016/j.comnet.2021.108281
used_in: ['doi:10.1145/3570361.3592522', 'doi:10.1109/infocom53939.2023.10228929', 'doi:10.1109/infocom42981.2021.9488889', 'doi:10.1109/lcomm.2025.3557715', 'doi:10.1109/lnet.2022.3177712']
citing: ['doi:10.1109/comst.2021.3135829', 'doi:10.1109/mcom.101.2001120', 'doi:10.1109/ojcoms.2024.3447472']
summary: {en: 'Over-the-air measurements from the POWDER platform at the University of Utah, including raw 5G NR uplink SRS at 3.42 GHz with GNSS and drone-video ground truth, drive-test KPIs such as SS-RSRP and SS-SINR, and RF I/Q captures.', zh: 来自犹他大学 POWDER 平台的空口实测数据，包括 3.42 GHz 的原始 5G NR 上行 SRS（附 GNSS 与无人机视频真值）、SS-RSRP 与 SS-SINR 等路测 KPI，以及 RF I/Q 采样。}
sources: ['https://powderwireless.net/data', 'https://docs.powderwireless.net/powder-overview.html', 'https://zenodo.org/records/23717707', 'https://zenodo.org/records/23741918', 'https://doi.org/10.1016/j.comnet.2021.108281', 'https://api.crossref.org/works/10.1016/j.comnet.2021.108281']
checked: '2026-11-06'
pipeline:
  summary: {en: 'Select real OTA or a controlled experiment, operate the radio devices, and synchronously collect radio, position, and log data. The public package''s sampling periods, clocks, and sensor configuration determine how training samples can be assembled.', zh: 先选择真实OTA或受控实验，运行无线设备并同步采集无线、位置和日志。公开包的采样周期、时钟与传感器配置决定能否组成训练样本。}
  stages:
  - title: {en: Select the experiment mode and resources, zh: 选择试验模式与资源}
    detail: {en: 'Configure available SDRs, compute nodes, and protocol software on POWDER, explicitly selecting controlled-channel or real-OTA operation.', zh: 在POWDER上配置可用SDR、计算节点和协议软件，明确受控信道或真实OTA模式。}
    inputs:
    - {en: 'Benchtop, indoor, outdoor, or mobile nodes', zh: 台架、室内、室外或移动节点}
    - {en: Experiment profile and device reservation, zh: 实验profile与设备预订}
    outputs:
    - {en: Experiment profile and resource mapping, zh: 实验profile和资源映射}
    controls:
    - {en: 'Researcher specifies: site, devices, software image, frequency, bandwidth, power, and collection date', zh: 研究者固定：站点、设备、软件镜像、频率、带宽、功率和采集日期}
    checks:
    - {en: Record the actual operating mode, zh: 记录实际运行模式}
    - {en: 'For repeated experiments, retain route, environment, and interference covariates', zh: 重复实验保留路线、环境和干扰协变量}
  - title: {en: Configure the radio task and motion, zh: 设置无线任务与运动}
    detail: {en: 'Mobility uses a moving rooftop UE and GNSS. ISAC uses two stationary UEs transmitting SRS, with vehicles and drones as moving reflectors.', zh: Mobility使用移动车顶UE与GNSS；ISAC使用两台静止UE发送SRS，车辆和无人机作为移动反射体。}
    inputs:
    - {en: gNB/UE configuration, zh: gNB/UE配置}
    - {en: Trajectory or target motion and reference sensors, zh: 轨迹或目标运动及参考传感器}
    outputs:
    - {en: Radio configuration, zh: 无线配置}
    - {en: Terminal/reflector routes and sensor configuration, zh: 终端/反射体路线和传感器配置}
    controls:
    - {en: 'Recorded configuration: over-the-air SRS every 10 ms for Mobility; every 2.5 ms for ISAC', zh: 记录配置：Mobility空口SRS每10ms；ISAC每2.5ms}
    - {en: 'Researcher specifies: ports, antenna positions, routes, and target identities', zh: 研究者固定：端口、天线位置、路线和目标身份}
    checks:
    - {en: Distinguish a moving transmitter from a moving reflector, zh: 区分移动发射机与移动反射体}
    - {en: Check that the SRS receive ports match the task's observations, zh: 检查SRS接收端口和任务观测一致}
  - title: {en: Record radio and reference observations synchronously, zh: 同步记录无线与参考观测}
    detail: {en: 'Record received SRS resource elements, reference sequences, and configuration/timing. Mobility includes UE Nemo and gNB logs; ISAC includes vehicle GNSS, drone logs, and video-camera poses.', zh: 记录SRS接收资源元素、参考序列与配置/时间。Mobility附UE Nemo及gNB日志；ISAC附车辆GNSS、无人机日志和视频相机位姿。}
    inputs:
    - {en: Actual over-the-air SRS, zh: 实际空口SRS}
    - {en: 'Reference sequences, GNSS, logs, or video', zh: 参考序列、GNSS、日志或视频}
    outputs:
    - {en: Raw SRS and reference sequences, zh: 原始SRS与参考序列}
    - {en: GNSS/logs/video and timestamps, zh: GNSS/日志/视频和时间标记}
    controls:
    - {en: Use the original clock fields in the published package, zh: 研究者使用发布包的原始时钟字段}
    - {en: 'During collection, fix gains, valid-SRS selection, and reference-sensor synchronization', zh: 采集时固定增益、有效SRS筛选和参考传感器同步}
    checks:
    - {en: 'Mobility files retain 40 ms sampling, distinct from the 10 ms over-the-air period', zh: Mobility文件保留采样40ms，与10ms空口周期分开}
    - {en: Record missing frames and discarded SRS, zh: 记录缺失帧和被丢弃SRS}
  - title: {en: Archive and align timestamps, zh: 归档与对齐时间}
    detail: {en: 'The Mobility package is organized into SRS/GNSS/Nemo/gNB logs; the ISAC package separates radio, truth, video, and other archives. Align the streams using their timestamps.', zh: Mobility包按SRS/GNSS/Nemo/gNB日志组织；ISAC包分radio、truth、video等归档。研究者根据时间戳对齐各流。}
    inputs:
    - {en: 'HDF5, GPX, CSV, or TAR contents', zh: HDF5、GPX、CSV或TAR内容}
    - {en: Clocks and coordinates of each stream, zh: 各流时钟与坐标}
    outputs:
    - {en: Sample indices with a common time/coordinate reference, zh: 带统一时间/坐标的样本索引}
    controls:
    - {en: 'Researcher specifies: UTC conversion, date completion, interpolation tolerance, and missing-data policy', zh: 研究者固定：UTC转换、日期补齐、插值容差和缺测策略}
    checks:
    - {en: Nemo time is UTC−6 without a date; complete it before aligning with UTC-nanosecond SRS/GPX, zh: Nemo时间为UTC−6且无日期，须补齐后对齐UTC纳秒SRS/GPX}
    - {en: Verify video-to-sensing-window timing error separately, zh: 视频与感知窗口的时间误差单独核验}
  - title: {en: Derive task quantities from reference signals, zh: 从参考信号构造任务量}
    detail: {en: 'Estimate channels on the observed SRS resources. For sensing, apply background processing and delay/Doppler analysis, then associate results with GNSS/video ground truth.', zh: 研究者估计所观测SRS资源上的信道；感知任务再进行背景处理、时延/Doppler分析，并与GNSS/视频真值对应。}
    inputs:
    - {en: Received SRS values and reference sequences, zh: SRS接收值和参考序列}
    - {en: Time-frequency/port configuration and available calibration, zh: 时频/端口配置与可用校准}
    outputs:
    - {en: Estimated channels on SRS resources, zh: SRS资源上的估计信道}
    - {en: Researcher-generated mobility/sensing features and labels, zh: 研究者生成的移动/感知特征和标签}
    controls:
    - {en: 'Researcher specifies: estimator, interpolation, phase processing, background suppression, window, and ground-truth association', zh: 研究者固定：估计器、插值、相位处理、背景抑制、窗口与真值关联}
    checks:
    - {en: Record observed over-the-air frequency points separately from full-bandwidth CSI, zh: 空口观测频点与完整带宽CSI分开登记}
    - {en: Check that sensing peaks correspond to the true target rather than other reflectors, zh: 检查感知峰与真实目标对应，避免把其他反射体当目标}
  - title: {en: Evaluate and split samples, zh: 评估并划分样本}
    detail: {en: 'Construct tasks grouped by run, time, or route, and report channel-estimation/sensing metrics together with available communication KPIs.', zh: 按运行、时间或路线分组构造任务，并报告无线估计/感知指标与可用的通信KPI。}
    inputs:
    - {en: Aligned radio/reference streams, zh: 对齐无线/参考流}
    - {en: Traffic and protocol results, zh: 业务与协议结果}
    outputs:
    - {en: Traceable training/test windows, zh: 可追溯的训练/测试窗口}
    - {en: Task metrics and actual communication results, zh: 任务指标和真实通信结果}
    controls:
    - {en: 'Researcher specifies: run grouping, window overlap, label horizon, and evaluation definitions', zh: 研究者固定：运行分组、窗口重叠、标签时距和评价口径}
    checks:
    - {en: Keep conclusions within the scope of two runs on the same route at one site, zh: 两轮同路线单站点数据保持其评估范围}
    - {en: Compute sensing costs and waveform resources from the actual settings, zh: 感知成本和波形资源须从实际设置计算}
  scope: {en: 'The general POWDER collection workflow, illustrated by the two public 2026 Mobility and Bistatic ISAC records.', zh: POWDER平台通用采集流程，结合2026 Mobility与Bistatic ISAC两套公开记录。}
