- {en: Platform access does not imply that all wireless data are publicly released., zh: 平台可访问不意味着所有无线数据已经公开。}
- {en: Weather/interference changes across time periods may also shift the distribution; record covariates., zh: 跨时段天气/干扰变化可能同时改变分布，需记录协变量。}
- {en: 'Mobility''s 10 ms over-the-air SRS period differs from its 40 ms file sampling interval. Nemo time is UTC−6 without a date; add the date and offset when aligning it with UTC-nanosecond SRS/GPX. The two ISAC runs share one route, one site, and one night; they do not constitute independent cross-city evaluation.', zh: Mobility的空口SRS周期10 ms与文件采样40 ms不同；Nemo时间为UTC−6且无日期，和UTC纳秒SRS/GPX对齐时须补日期及偏移。ISAC两轮同路线、单站点单晚，不能当独立城市外推。}
