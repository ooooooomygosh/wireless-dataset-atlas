overview: {en: 'POWDER is a city-scale, remotely accessible wireless testbed at the University of Utah in Salt Lake City, one of the NSF Platforms for Advanced Wireless Research (PAWR). The platform is described in a 2021 Computer Networks paper by J. Breen et al. (doi:10.1016/j.comnet.2021.108281), and its public data portal lists over-the-air measurement datasets. The two 2026 Zenodo records described here use band n78 at 3.42 GHz with a 34.56 MHz SRS span, and both are licensed CC BY 4.0. The outdoor bistatic 5G ISAC record contains 1.37 million raw uplink SRS snapshots from two parked UEs, recorded every 2.5 ms on a four-port panel over two runs of 13.1 and 15.6 minutes, with vehicle GNSS, drone flight logs and 3840 x 2160 drone video as ground truth. The outdoor 5G mobility record contains 29,514 SRS snapshots from a UE on a car driven through the lot, configured every 10 ms over two runs, together with UE-side Nemo Outdoor logs, GNSS tracks and gNB logs. Other portal entries include
    drive-test KPIs such as SS-RSRP and SS-SINR, spectrum scans, and I/Q captures with up to four simultaneous OFDM interferers. The ISAC record does not include detections, tracks or processed channels, which users must derive from the raw signals.', zh: 'POWDER 是犹他大学（盐湖城）的城市级可远程访问无线试验平台，是美国国家科学基金会先进无线研究平台（PAWR）之一。该平台在 2021 年 Computer Networks 论文中有所描述，作者 J. Breen 等（doi:10.1016/j.comnet.2021.108281）；其公开数据门户列出了空口测量数据集。本文涉及的两条 2026 年 Zenodo 记录均使用 n78 频段、中心频率 3.42 GHz，SRS 跨度 34.56 MHz，许可均为 CC BY 4.0。室外双基地 5G ISAC 记录包含两台停放 UE 的 137 万条原始上行 SRS 快照，每 2.5 ms 在四端口天线面板上采集，分两次运行，时长分别为 13.1 和 15.6 分钟；真值包括车辆 GNSS、无人机飞行日志与 3840 x 2160 无人机视频。室外 5G 移动性记录包含一台装在汽车上的 UE 在校园停车场内行驶时的 29,514 条 SRS 快照，SRS 配置周期为 10 ms，共两次运行，并附带 UE 侧 Nemo Outdoor 日志、GNSS 轨迹与 gNB 日志。门户中的其他条目包括 SS-RSRP、SS-SINR 等路测 KPI、频谱扫描，以及最多四个同时存在的 OFDM 干扰源的 I/Q 采样。ISAC 记录不包含检测结果、航迹或经过处理的信道，这些需要使用者从原始信号中自行推导。'}
signal_details:
- signal: csi
  text: {en: 'Raw 5G NR uplink SRS, not a processed channel estimate. The ISAC record stores the received resource elements on 4 receive ports (288 per port, 120 kHz subcarrier spacing), the reference sequences and the air time of each snapshot. The mobility record stores 576 resource elements per port on 2 receive ports, in run1_srs.h5 and run2_srs.h5 with the frame, slot and gNB capture timestamp of each snapshot (timestamp_ns, UTC).', zh: 原始 5G NR 上行 SRS，而非处理后的信道估计。ISAC 记录保存 4 个接收端口上接收到的资源单元（每端口 288 个，子载波间隔 120 kHz）、参考序列以及每个快照的空口时间。移动性记录保存 2 个接收端口上每端口 576 个资源单元，存于 run1_srs.h5 与 run2_srs.h5，并附带每个快照的帧号、时隙号与 gNB 采集时间（timestamp_ns，UTC）。}
- signal: iq
  text: {en: I/Q captures. The Multiple Simultaneous Interferer record gives RX I/Q data with 0 to 4 simultaneous OFDM interferers. The 2020 RF fingerprinting supplement is listed as IQ samples by its file name only., zh: I/Q 采样。Multiple Simultaneous Interferer 记录提供接收端 I/Q 数据，干扰源为 0 至 4 个同时存在的 OFDM 信号。2020 年 RF 指纹补充数据仅以文件名 IQsample 标注为 IQ 采样。}
- signal: kpi
  text: {en: 'Drive-test KPIs. The mobility record includes UE-side Nemo Outdoor CSV logs, one row per event, with SS-RSRP, RSRQ, SINR, path loss, PUSCH, PUCCH and SRS transmit power, power headroom, timing advance, MCS, DCI and throughput. The Spectrum Usage record gives band, RSRP, RSRQ and handover events. The 2026 Cellular Metrics record gives per-channel SS-RSRP and SS-SINR from a Viavi CA5000.', zh: 路测 KPI。移动性记录包含 UE 侧 Nemo Outdoor CSV 日志，每行对应一个事件，字段有 SS-RSRP、RSRQ、SINR、路径损耗、PUSCH、PUCCH 与 SRS 发射功率、功率余量、时间提前量、MCS、DCI 与吞吐量。Spectrum Usage 记录给出频段、RSRP、RSRQ 与切换事件。2026 Cellular Metrics 记录给出由 Viavi CA5000 测得的分信道 SS-RSRP 与 SS-SINR。}
- signal: gps
  text: {en: 'GNSS positions. The ISAC record uses a u-blox ZED-X20P receiver at 10 Hz, standalone without RTK, on the target car, with accuracy stated as decimetre to metre. The mobility record has GNSS tracks in GPX (UTC) at about 10 Hz, with 6,457 and 4,815 points from DGPS fixes using 12 satellites. The Spectrum Usage and 2026 Cellular Metrics records include location from GPS.', zh: 'GNSS 位置。ISAC 记录使用安装在目标车辆上的 u-blox ZED-X20P 接收机，频率 10 Hz，独立定位不使用 RTK，精度表述为分米级到米级。移动性记录的 GNSS 轨迹为 GPX 格式（UTC），约 10 Hz，分别含 6,457 与 4,815 个点，为使用 12 颗卫星的 DGPS 定位结果。Spectrum Usage 与 2026 Cellular Metrics 记录同样包含 GPS 位置。'}
