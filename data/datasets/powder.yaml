variants:
- name: {en: Outdoor Bistatic 5G ISAC（October 2026）, zh: Outdoor Bistatic 5G ISAC（October 2026）}
  observations: {en: '3.42 GHz, two stationary UEs, four Rx ports; 2.5 ms SRS per UE, two Tx ports, and 288 RE/port; approximately 1.37 million snapshots. Vehicle-mounted 10 Hz GNSS, drone 4K video, and flight logs.', zh: 3.42 GHz、两台静止UE、四Rx端口；每UE 2.5 ms SRS、两Tx端口、288 RE/port；约137万快照。车载10 Hz GNSS、无人机4K视频与飞行日志。}
  csi: {en: 'Derivable: raw SRS and reference sequences support limited-port CSI estimation and bistatic delay–Doppler processing. The record does not provide cleaned channels, detections, tracks, or sensing labels.', zh: 可计算：原始SRS与参考序列支持有限端口CSI估计及双基地时延–Doppler处理；记录未提供已清洗信道、检测、轨迹或感知标签。}
- name: {en: Outdoor 5G Mobility（October 2026）, zh: Outdoor 5G Mobility（October 2026）}
  observations: {en: '3.42 GHz, one mobile UE, two Rx ports, and 576 RE/port. SRS is transmitted every 10 ms but recorded every 40 ms. Two runs contain 29,514 snapshots, with Y/X, UTC ns, sfn/slot, and SRS attributes; 10 Hz GPX, Nemo L1–L3, and gNB logs are also included.', zh: '3.42 GHz、单移动UE、两Rx端口、576 RE/port。SRS发送周期10 ms，但记录周期40 ms；两轮共29,514快照，含Y/X、UTC ns、sfn/slot和SRS属性；另有10 Hz GPX、Nemo L1–L3与gNB日志。'}
  csi: {en: 'Derivable: Y/X and the port/comb configuration support SRS channel estimation. The second row of X is NaN in single-Tx-port snapshots; process it according to nof_tx_ports.', zh: 可计算：Y/X及端口/梳状配置支持SRS信道估计；X第二行在单Tx-port快照为NaN，必须按nof_tx_ports处理。}
