checked: '2026-11-06'
overview: {en: 'XRF55 is a radio frequency dataset for human indoor action analysis from Xi''an Jiaotong University and Zhejiang University, published at ACM IMWUT/Ubicomp 2024 (DOI 10.1145/3643543). It contains 42.9K samples of 55 indoor actions performed by 39 subjects, totalling 59 h 35 min. Each subject performs each action 20 times, and each repetition has a 5-second action window; the 55 actions fall into 15 human-object interactions, 7 human-human interactions, 8 fitness actions, 14 body motions and 11 human-computer interactions. The recordings were made in four scenes: Scene 1 has 30 subjects with all four sensors, and Scenes 2, 3 and 4 have three subjects each. Wi-Fi CSI, RFID phase, 60 to 64 GHz mmWave radar, and Azure Kinect RGB and depth data are included, and the page defines the split as the first 14 trials of each action per subject for training and the last 6 for testing. The project page lists 2D pose, 3D pose and human mesh data as in progress, and marks the raw mmWave
    data link as expired. The data are distributed through the project page, the Sensing Dataset Platform (sdp8.org) and Kaggle under CC BY-NC 4.0.', zh: XRF55是面向室内人体动作分析的射频数据集，由西安交通大学与浙江大学提出，发表于ACM IMWUT/Ubicomp 2024（DOI 10.1145/3643543）。数据包含39名受试者执行55种室内动作的42.9K个样本，总时长59 h 35 min。每名受试者每个动作重复20次，每次重复的动作窗口为5 s；55种动作分为人-物交互15种、人-人交互7种、健身动作8种、身体运动14种和人机交互11种。采集分为四个场景：场景1有30名受试者且四种传感器齐全，场景2、3、4各有3名受试者。数据包括Wi-Fi CSI、RFID相位、60至64 GHz毫米波雷达以及Azure Kinect的RGB和深度数据，页面定义的划分为每名受试者每个动作的前14次用于训练、后6次用于测试。项目页面将2D pose、3D pose和human mesh数据列为进行中，并标注毫米波原始数据链接已失效。数据通过项目页面、Sensing Dataset Platform（sdp8.org）和Kaggle发布，许可为CC BY-NC 4.0。}
signal_details:
- signal: csi
  text: {en: 'Wi-Fi CSI from one ThinkPad X201 transmitter (Intel 5300 NIC) and three receiver laptops placed at the corners of a rectangle at 1.2 m height. The link uses 802.11n on channel 128 (5.64 GHz) at 200 packets per second. The 9 links (1 Tx antenna, 3 receivers with 3 antennas each) carry 30 OFDM subcarriers per link, giving a raw CSI shape of (200t) × 1 × 3 × 3 × 30.', zh: Wi-Fi CSI由一台ThinkPad X201发射机（Intel 5300网卡）和三台接收笔记本组成，布置于矩形四角，高度1.2 m。链路采用802.11n，信道128（5.64 GHz），每秒200个包。9条链路（1根Tx天线，3台接收端各3根天线）每条含30个OFDM子载波，原始CSI形状为(200t) × 1 × 3 × 3 × 30。}
- signal: radar
  text: {en: 'TI IWR6843ISK radar with a TI DCA1000EVM capture board, 60 to 64 GHz FMCW, 3 transmit and 4 receive antennas, 20 frames per second, 64 chirps per frame and 256 samples per chirp. Range-Doppler and range-angle maps are released, each 256 × 64 per frame and concatenated to 256 × 128; the raw shape is (20t) × 3 × 4 × 256 × 64.', zh: TI IWR6843ISK雷达配合TI DCA1000EVM采集板，工作于60至64 GHz FMCW，3根发射天线、4根接收天线，20帧/秒，每帧64个chirp，每个chirp 256个采样。发布的range-Doppler与range-angle热图每帧各为256 × 64，拼接后为256 × 128；原始形状为(20t) × 3 × 4 × 256 × 64。}
- signal: rgb
  text: {en: 'Azure Kinect RGB, captured at 30 fps at 720P and released as 1280 × 720 video at 15 fps. The Kaggle release of RGB video covers 19 consenting participants.', zh: Azure Kinect RGB视频，原始采集为30 fps、720P，发布版本为1280 × 720、15 fps。Kaggle上的RGB视频包含19名同意参与者的数据。}
- signal: depth
  text: {en: 'Azure Kinect depth stream, captured at 30 fps. The released depth video is 512 × 512 at 15 fps, and depth and IR video are split into several parts on Kaggle.', zh: Azure Kinect深度流，原始采集为30 fps。发布的深度视频为512 × 512、15 fps，深度与红外视频在Kaggle上分为多个部分。}
pipeline:
  summary: {en: 'Multi-sensor recordings of 55 actions are cut into 5-second windows, with radar frames converted to heatmaps and the video downsampled to 15 fps.', zh: 55种动作的多传感器记录被切分为5秒窗口，雷达帧转换为热图，视频降采样至15 fps。}
  stages:
  - title: {en: 'Record CSI, RFID, radar and Kinect streams', zh: 记录CSI、RFID、雷达和Kinect数据流}
    detail: {en: 'One Wi-Fi transmitter and three receiver laptops record CSI at 200 packets per second, and an Impinj Speedway R420 reader queries 23 passive tags at 30 queries per second. The TI IWR6843ISK radar outputs 20 frames per second, and the Azure Kinect records RGB, depth and infrared at 30 fps.', zh: 一台Wi-Fi发射机和三台接收笔记本以每秒200个包记录CSI，Impinj Speedway R420读写器以每秒30次查询读取23个无源标签。TI IWR6843ISK雷达输出20帧/秒，Azure Kinect以30 fps记录RGB、深度和红外。}
    inputs:
    - {en: '39 subjects performing 55 actions, 20 repetitions each', zh: 39名受试者，每人执行55种动作各20次}
    outputs:
    - {en: 'Raw CSI, RFID phase, radar ADC frames, Kinect video', zh: 原始CSI、RFID相位、雷达ADC帧、Kinect视频}
  - title: {en: Convert radar frames to heatmaps and point clouds, zh: 将雷达帧转换为热图和点云}
    detail: {en: 'Each radar frame is transformed into range-Doppler and range-angle heatmaps of 256 × 64 each, concatenated to 256 × 128. The page lists mmWave_RA_RE.py and point_clouds_generation.py among its provided Python tools.', zh: 每个雷达帧被转换为各256 × 64的range-Doppler与range-angle热图，并拼接为256 × 128。项目页面列出了提供的Python工具mmWave_RA_RE.py和point_clouds_generation.py。}
    inputs:
    - {en: 'Radar frames, shape (20t) × 3 × 4 × 256 × 64', zh: 雷达帧，形状(20t) × 3 × 4 × 256 × 64}
    outputs:
    - {en: 'Range-Doppler and range-angle heatmaps, mmWave point clouds', zh: range-Doppler与range-angle热图、mmWave点云}
  - title: {en: Downsample video to 15 fps, zh: 将视频降采样至15 fps}
    detail: {en: 'The Azure Kinect streams are downsampled from 30 fps to 15 fps, and the released RGB video is 1280 × 720 while depth and IR video are 512 × 512.', zh: Azure Kinect数据流从30 fps降采样至15 fps，发布的RGB视频为1280 × 720，深度与红外视频为512 × 512。}
    inputs:
    - {en: 'Kinect RGB, depth and IR streams at 30 fps', zh: 30 fps的Kinect RGB、深度和红外数据流}
    outputs:
    - {en: 'RGB video at 1280 × 720 and depth/IR video at 512 × 512, both at 15 fps', zh: 1280 × 720的RGB视频与512 × 512的深度/红外视频，均为15 fps}
  - title: {en: Cut 5-second windows and split by trial, zh: 切分5秒窗口并按次数划分}
    detail: {en: 'Each repetition is cut to a 5-second action window, which gives 1000 CSI packets, 150 RFID reads and 100 radar frames per training sample. For each action and subject, the first 14 trials form the training set (30.0K samples) and the last 6 trials form the test set (12.9K samples).', zh: 每次重复被切分为5秒动作窗口，每个训练样本对应1000个CSI包、150次RFID读数和100帧雷达。每名受试者每个动作的前14次为训练集（30.0K个样本），后6次为测试集（12.9K个样本）。}
    inputs:
    - {en: Per-trial data streams of 5 seconds, zh: 每次试验5秒的各数据流}
    outputs:
    - {en: Training set (30.0K samples) and test set (12.9K samples), zh: 训练集（30.0K个样本）和测试集（12.9K个样本）}
organization: Xi'an Jiaotong University and Zhejiang University
standard: 802.11n
format: NPY, DAT, MAT
facts:
- label: {en: File naming, zh: 文件命名}
  text: {en: 'Each sample file is named a_b_c.npy, where a is the volunteer ID, b is the action class ID (1 to 55) and c is the repetition number.', zh: 每个样本文件命名为 a_b_c.npy，其中 a 为志愿者 ID，b 为动作类别 ID（1 至 55），c 为该动作的重复次数序号。}
- label: {en: Wi-Fi layout, zh: Wi-Fi 数据布局}
  text: {en: 'Wi-Fi arrays of shape 1000 × 1 × 3 × 3 × 30 are reshaped to 1000 × 270, where each receiver fills 90 columns (3 antennas × 30 subcarriers).', zh: 形状为 1000 × 1 × 3 × 3 × 30 的 Wi-Fi 数组被重排为 1000 × 270，每台接收机占 90 列（3 根天线 × 30 个子载波）。}
- label: {en: Mixed file types, zh: 混合文件格式}
  text: {en: 'Some Wi-Fi files with prefixes 04, 07 and 12 are stored as .mat instead of .dat, and the repository states that the CSI content is the same.', zh: 前缀为 04、07 和 12 的部分 Wi-Fi 文件以 .mat 而非 .dat 格式保存，仓库说明两者的 CSI 内容相同。}
- label: {en: RFID length, zh: RFID 长度}
  text: {en: 'The repository Q&A resizes RFID arrays from 150 to 148 time rows per sample, because tag reads are sometimes one or two short of 150.', zh: 仓库问答说明，RFID 数组每个样本的时间维由 150 调整为 148，因为标签读取有时会比 150 少一到两次。}
capabilities:
- key: csi
  status: provided
  note: {en: 'Intel 5300 Wi-Fi CSI on 9 links (1 Tx antenna, 3 Rx with 3 antennas each), 30 subcarriers per link, 200 packets per second; reshaped to 1000 × 270 per 5 s sample.', zh: Intel 5300网卡的Wi-Fi CSI，共9条链路（1根Tx天线，3台Rx各3根天线），每条链路30个子载波，200包/秒；每个5秒样本重排为1000 × 270。}
- key: cir
  status: derivable
  note: {en: Computed from the provided CSI by an inverse Fourier transform over subcarriers., zh: 由所提供的 CSI 沿子载波做逆傅里叶变换得到。}
- {key: paths, status: unknown}
- {key: interaction, status: unknown}
- key: power
  status: derivable
  note: {en: Computed as the squared channel magnitude of the provided channel data., zh: 由所提供信道数据的幅度平方计算得到。}
- key: iq
  status: unknown
  note: {en: 'Raw mmWave ADC frames appear in the processing pipeline, but the raw mmWave download is listed as expired.', zh: 处理流程中出现毫米波原始ADC帧，但原始毫米波数据的下载链接标注为已失效。}
- {key: beam_labels, status: unknown}
- {key: position, status: unknown}
- {key: geometry, status: unknown}
- {key: materials, status: unknown}
- key: rgb
  status: provided
  note: {en: 'Azure Kinect RGB at 1280 × 720, 15 fps; the Kaggle copy covers 19 participants who agreed to public release.', zh: Azure Kinect RGB，1280 × 720，15 fps；Kaggle版本包含19名同意公开的参与者。}
- key: depth
  status: provided
  note: {en: 'Azure Kinect depth at 512 × 512, 15 fps.', zh: Azure Kinect深度，512 × 512，15 fps。}
- key: lidar
  status: none
  note: {en: 'The sensor set is Wi-Fi, RFID, mmWave radar and Azure Kinect; no LiDAR is listed.', zh: 传感器包括Wi-Fi、RFID、毫米波雷达和Azure Kinect，未列出LiDAR。}
- key: radar
  status: provided
  note: {en: 'TI IWR6843ISK at 60–64 GHz FMCW, 20 frames per second; range-Doppler, range-angle and angle-Doppler maps for scenes 1 to 4, point clouds for scenes 1 and 2.', zh: TI IWR6843ISK，60–64 GHz FMCW，20帧/秒；场景1至4的距离-多普勒、距离-角度、角度-多普勒图，以及场景1和2的点云。}
- key: imu
  status: none
  note: {en: The sensor set does not include an IMU., zh: 传感器组成中不包含IMU。}
- key: time_series
  status: provided
  note: {en: 'Each sample is a 5 s action window with 1000 CSI packets, 150 RFID reads and 100 radar frames.', zh: 每个样本为5秒动作窗口，包含1000个CSI包、150次RFID读数和100帧雷达数据。}
- key: multiuser
  status: none
  note: {en: Each sample records one volunteer's action; no simultaneous multi-user channels are described., zh: 每个样本记录单个志愿者的动作；未描述同时存在的多用户信道。}
- key: multibs
  status: none
  note: {en: One Wi-Fi transmitter and three receivers in one indoor setup; no multi-base-station set is described., zh: 同一室内布置中包含一个Wi-Fi发射机和三台接收机；未描述多基站数据集。}
- key: crossfreq
  status: provided
  note: {en: 'Wi-Fi at 5.64 GHz, RFID at 0.92 GHz and mmWave radar at 60–64 GHz are recorded for the same action windows.', zh: 同一动作时间窗口内记录了5.64 GHz Wi-Fi、0.92 GHz RFID和60–64 GHz毫米波雷达数据。}
- {key: near_field, status: unknown}
- key: high_mobility
  status: none
  note: {en: Indoor human actions; no fast-moving users are described., zh: 室内人体动作；未描述高速移动用户。}
- key: dynamic_blockage
  status: provided
  note: {en: The subject performing each action moves through the RF paths and acts as a moving body in the link., zh: 执行动作的受试者在射频路径中移动，构成链路中的移动人体。}
- key: reflection
  status: provided
  note: {en: 'Inherent in the measurement, not labelled per path.', zh: 包含在测量之中，未按路径标注。}
- key: diffraction
  status: provided
  note: {en: 'Inherent in the measurement, not labelled per path.', zh: 包含在测量之中，未按路径标注。}
- key: scattering
  status: provided
  note: {en: 'Inherent in the measurement, not labelled per path.', zh: 包含在测量之中，未按路径标注。}
- key: transmission
  status: provided
  note: {en: 'Inherent in the measurement, not labelled per path.', zh: 包含在测量之中，未按路径标注。}
- {key: polarization, status: unknown}
- {key: em_field, status: unknown}
