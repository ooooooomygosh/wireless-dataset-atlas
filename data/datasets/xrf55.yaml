summary: {en: '42.9K samples of 55 indoor human actions from 39 subjects (about 59.6 hours), with Wi-Fi CSI, RFID phase, mmWave radar and Azure Kinect RGB and depth data.', zh: 共 42.9K 个样本，涵盖 39 名受试者的 55 种室内人体动作（约 59.6 小时），包含 Wi-Fi CSI、RFID 相位、毫米波雷达以及 Azure Kinect 的 RGB 和深度数据。}
