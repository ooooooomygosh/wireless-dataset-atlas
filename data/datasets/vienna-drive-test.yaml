summary: {en: 'Georeferenced LTE and 5G NR drive-test measurements in Vienna, Austria, combining passive wideband scanner observations with active handset logs that include throughput and timing advance. The release also includes building and terrain models, and the measurement tables hold 2,893,129 records.', zh: '奥地利维也纳的地理参考 LTE 与 5G NR 路测数据，结合被动宽带扫描仪观测和主动手机日志（包括吞吐量与 timing advance）。发布内容还包括建筑物与地形模型，测量表共含 2,893,129 条记录。'}
