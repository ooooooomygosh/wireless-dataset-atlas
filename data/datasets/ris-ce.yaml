summary: {en: 'Simulated cascaded channel data for RIS-aided massive MIMO systems, covering hardware imperfections and time-varying cascaded channels with user mobility, split into main, test and validation archives. The data is generated by simulation code adapted from the SimRIS channel simulator.', zh: 面向 RIS 辅助大规模 MIMO 系统的仿真级联信道数据，包含硬件非理想性以及含用户移动性的时变级联信道，分为主数据、测试和验证三个压缩包。数据由基于开源 SimRIS 信道仿真器改进的仿真代码生成。}
sources: ['https://ieee-dataport.org/documents/risce-0', 'https://raw.githubusercontent.com/Holographic-Lab/LPAN/main/README.md', 'https://api.crossref.org/works/10.1109/TWC.2023.3329387']
checked: '2026-11-06'
overview: {en: 'RIS_CE is a simulated cascaded channel dataset for RIS-aided massive MIMO systems, provided by the WiCi Lab at Central China Normal University and released in 2023 under CC BY 4.0. It accompanies the paper ''Multi-Scale Attention Based Channel Estimation for RIS-Aided Massive MIMO Systems'' (IEEE Transactions on Wireless Communications, doi:10.1109/TWC.2023.3329387). The channels come from simulation code based on the open-source SimRIS channel simulator, extended to multiple users, with hardware impairments and, in the time-varying set, user mobility. The repository describes a quasi-static set (doi:10.21227/3c2t-dz81), stored as .mat files with 6 users and 32 pilots as the file names indicate, and a time-varying set (doi:10.21227/pz7h-q132) in which each frame has 6 time blocks, 2 of them pilot blocks, of about 0.24 ms each. The IEEE DataPort record lists main, test and validation archives of 14.2 GB, 6.3 GB and 1.26 GB. The data target estimation of high-dimensional cascaded
    channels from limited pilot overhead, using the LPAN and LPAN-L networks.', zh: 'RIS_CE 是面向 RIS 辅助大规模 MIMO 系统的仿真级联信道数据集，由华中师范大学（Central China Normal University）WiCi Lab 提供，于 2023 年以 CC BY 4.0 发布。它对应论文 ''Multi-Scale Attention Based Channel Estimation for RIS-Aided Massive MIMO Systems''（IEEE Transactions on Wireless Communications，doi:10.1109/TWC.2023.3329387）。信道由基于开源 SimRIS 信道仿真器的仿真代码生成，并扩展到多用户场景，包含硬件非理想性；时变数据集中还包含用户移动性。仓库描述了准静态数据集（doi:10.21227/3c2t-dz81），以 .mat 文件存储，文件名表明为 6 个用户、32 个导频；以及时变数据集（doi:10.21227/pz7h-q132），每帧包含 6 个时间块，其中 2 个为导频块，每块约 0.24 ms。IEEE DataPort 记录列出主数据、测试和验证三个压缩包，大小分别为 14.2 GB、6.3 GB 和 1.26 GB。数据用于在有限导频开销下估计高维级联信道，使用的网络为 LPAN 和 LPAN-L。'}
signal_details:
- signal: csi
  text: {en: 'Cascaded channels of RIS-aided massive MIMO, generated by simulation. Hardware imperfections are modeled. The quasi-static .mat files are already least-squares pre-estimated and normalized. In the time-varying set, the channel changes with user mobility; each frame has 6 time blocks (2 pilot blocks) of about 0.24 ms each.', zh: RIS 辅助大规模 MIMO 的级联信道，由仿真生成，并对硬件非理想性进行建模。准静态 .mat 文件已完成 LS 预估计并归一化。时变数据集中信道随用户移动而变化，每帧包含 6 个时间块（其中 2 个为导频块），每块约 0.24 ms。}
pipeline:
  summary: {en: 'Channels are simulated with an extended SimRIS model, pre-estimated by LS and normalized, and then used to train and test the LPAN models.', zh: 信道由扩展的 SimRIS 模型仿真生成，经 LS 预估计与归一化后，用于训练和测试 LPAN 模型。}
  stages:
  - title: {en: Channel simulation, zh: 信道仿真}
    detail: {en: The multi-user RIS mmWave channel model extends the single-user model of Basar et al. with NLOS modeling of the RIS-user link. The MATLAB dataset-construction code is based on the SimRIS channel simulator package by Basar and Yildirim. The 2023 update revised the hardware-imperfection modeling., zh: 多用户 RIS mmWave 信道模型将 Basar 等人的单用户模型扩展到多用户，并为 RIS 与用户之间的链路加入 NLOS 建模。MATLAB 数据构建代码基于 Basar 与 Yildirim 的 SimRIS 信道仿真器工具包。2023 年更新修订了硬件非理想性建模。}
    inputs:
    - {en: SimRIS MATLAB package, zh: SimRIS MATLAB 工具包}
    outputs:
    - {en: Simulated cascaded channel realizations, zh: 仿真的级联信道实现}
  - title: {en: LS pre-estimation and normalization, zh: LS 预估计与归一化}
    detail: {en: 'The dataset construction includes LS pre-estimation steps, followed by normalization. The quasi-static .mat files are distributed in this pre-estimated and normalized form.', zh: 数据构建过程包括 LS 预估计步骤，之后进行归一化。准静态 .mat 文件以该预估计并归一化的形式发布。}
    inputs:
    - {en: Simulated channels, zh: 仿真信道}
    outputs:
    - {en: 'LS pre-estimated, normalized .mat files', zh: 经 LS 预估计并归一化的 .mat 文件}
  - title: {en: Time-varying frame structure, zh: 时变帧结构}
    detail: {en: 'Each frame has B = 6 time blocks, of which B^p = 2 are pilot blocks, and each block lasts about 0.24 ms. The time-varying scenario includes user mobility, and the data are split into training, validation and test sets.', zh: 每帧包含 B = 6 个时间块，其中 B^p = 2 个为导频块，每块持续约 0.24 ms。时变场景包含用户移动性，数据划分为训练集、验证集和测试集。}
    inputs:
    - {en: Channel sequences with user mobility, zh: 含用户移动性的信道序列}
    outputs:
    - {en: 'Training, validation and test frames', zh: 训练、验证与测试帧}
  - title: {en: Training and testing, zh: 训练与测试}
    detail: {en: 'main.py trains and tests LPAN or LPAN-L on the .mat files, with the data path and model selected in the file. Mobility_LPAN_L1.py holds the LPAN-L variant for time-varying channels, and main_Mobility.py adds transfer learning for domain adaptation of LPAN-L.', zh: main.py 在 .mat 文件上训练和测试 LPAN 或 LPAN-L，数据路径与模型在文件中设定。Mobility_LPAN_L1.py 为时变信道的 LPAN-L 变体，main_Mobility.py 为 LPAN-L 加入用于域适应的迁移学习。}
    inputs:
    - {en: Pre-estimated .mat dataset, zh: 预估计的 .mat 数据集}
    outputs:
    - {en: Channel estimation results from the test phase, zh: 测试阶段的信道估计结果}
