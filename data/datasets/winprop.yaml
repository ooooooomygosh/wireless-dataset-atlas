- {en: Decide whether the task needs power maps or complex multipath before choosing a model., zh: 选择模型前先决定需要功率图还是复数多径。}
- {en: 'Fix buildings/materials, grids, interaction limits, and acceleration settings.', zh: 固定建筑/材料、网格、交互上限与加速选项。}
- {en: Save project files and definitions of exported variables; retain the power-to-image conversion separately., zh: 保存项目文件和导出变量定义；单独保留功率到图像的转换。}
overview: {en: 'Altair WinProp is a commercial suite of tools for wireless propagation and radio network planning, published by Altair Engineering. The documentation covers radio links from satellite to terrestrial and from rural through urban to indoor scenarios. The suite includes the ProMan propagation models and network planners, the WallMan, TuMan and AMan editors for building, tunnel and antenna data, and a command-line interface (WinPropCLI) and API for batch runs. Prediction methods are empirical and semi-empirical models (calibration with measurements is possible), 3D ray tracing, and the urban dominant path model (DPM). Geometry is supplied as a pixel database for rural or suburban areas, a 2.5D vector database of buildings with heights for urban areas, or a 3D vector database of polygons for indoor and small outdoor scenes. Outputs include path loss, delay and angular spread, LOS/NLOS status, directional channel impulse response, angular profile and propagation paths, and coverage
    and capacity results derived from them.', zh: Altair WinProp 是 Altair Engineering 发布的商业无线传播与无线网络规划工具套件。文档涵盖从卫星到地面、从农村、城市到室内的无线链路。套件包括 ProMan 传播模型与网络规划模拟器，用于建筑、隧道和天线数据的 WallMan、TuMan、AMan 编辑工具，以及用于批处理的命令行接口（WinPropCLI）和 API。预测方法包括经验模型与半经验模型（可用测量数据校准）、三维射线追踪以及城市主导路径模型（DPM）。几何数据可采用用于农村或郊区的像素数据库、用于城市且带高度信息的 2.5D 矢量数据库，或用于室内及小型室外场景的三维矢量数据库。输出包括路径损耗、时延扩展与角度扩展、LOS/NLOS 状态、定向信道冲激响应、角度谱和传播路径，并由此计算覆盖与容量结果。}
signal_details:
- signal: pathloss
  text: {en: 'Path loss is predicted for each receiver location. For urban scenarios the documented methods are the COST 231 extended Walfisch-Ikegami model, an empirical vertical-plane model with knife-edge diffraction, the urban dominant path model (DPM) and a 3D ray-tracing model. Delay spread and angular spread can be computed in the same analysis.', zh: 为每个接收位置预测路径损耗。城市场景的文档化方法包括 COST 231 扩展 Walfisch-Ikegami 模型、带刀刃绕射的经验垂直平面模型、城市 DPM 以及三维射线追踪模型。同一分析中还可计算时延扩展和角度扩展。}
- signal: paths
  text: {en: 'Propagation paths are listed among the outputs. Several methods are fully three-dimensional and compute all rays in 3D, while others consider only the vertical plane.', zh: 传播路径列于输出之中。部分方法为完全三维方法，在三维空间中计算所有射线；其他方法仅考虑垂直平面。}
- signal: cir
  text: {en: 'The directional channel impulse response is one of the outputs. Linear and circular antenna configurations are taken into account in the propagation analysis, and antenna patterns can be imported from sources including Feko.', zh: 定向信道冲激响应是输出之一。线性和圆形等天线配置在传播分析中一并计算，天线方向图可从 Feko 等来源导入。}
