summary: {en: 'A collection of propagation and wireless-network-planning tools. DPM, SRT, IRT, and empirical models produce different levels of output. The older RadioMapSeer configuration does not represent all current WinProp capabilities.', zh: 传播与无线网络规划工具集合；DPM、SRT、IRT 与经验模型产生不同层次输出。RadioMapSeer 使用的旧配置不能代表 WinProp 当前全部能力。}
checked: '2026-11-06'
pipeline:
  summary: {en: 'Build the geometry, assign antenna patterns, solve propagation in ProMan, and derive network results as post-processing. Model choice sets the accuracy and computation cost of the outputs.', zh: 依次建立几何、导入天线方向图、在 ProMan 中求解传播，并将网络结果作为后处理得到。模型选择决定输出的精度与计算成本。}
  stages:
  - title: {en: Build the geometry, zh: 建立几何}
    detail: {en: 'Create building data in WallMan, tunnel geometry in TuMan, or import a terrain profile into ProMan for rural and suburban scenes. Vector databases carry building heights; pixel databases carry elevations and optional land usage.', zh: 在 WallMan 中创建建筑数据，在 TuMan 中创建隧道几何，或将地形剖面导入 ProMan 用于农村与郊区场景。矢量数据库包含建筑高度；像素数据库包含高程和可选土地利用。}
    inputs:
    - {en: 'Building, tunnel or terrain data', zh: 建筑、隧道或地形数据}
    outputs:
    - {en: 'Pixel, 2.5D vector or 3D vector database', zh: 像素、2.5D 矢量或 3D 矢量数据库}
  - title: {en: Generate antenna patterns, zh: 生成天线方向图}
    detail: {en: Produce the antenna pattern with Feko or AMan and import it into the project. Linear and circular antenna configurations are supported., zh: 用 Feko 或 AMan 生成天线方向图并导入工程，支持线性和圆形天线配置。}
    inputs:
    - {en: Antenna design, zh: 天线设计}
    outputs:
    - {en: 3D antenna pattern, zh: 三维天线方向图}
  - title: {en: Select the propagation model, zh: 选择传播模型}
    detail: {en: 'Choose empirical or semi-empirical models (calibratable with measurements), 3D ray tracing, the standard ray tracing model (SRT), or the urban dominant path model (DPM). The choice depends on the application, its accuracy requirement and the computational budget.', zh: 在经验或半经验模型（可用测量校准）、三维射线追踪、标准射线追踪模型（SRT）或城市主导路径模型（DPM）之间选择。选择取决于应用、精度要求和计算预算。}
    inputs:
    - {en: Geometry database and site definitions, zh: 几何数据库与站点定义}
  - title: {en: Solve the propagation project, zh: 求解传播工程}
    detail: {en: 'ProMan computes path loss, delay and angular spread, LOS/NLOS status, directional channel impulse response, angular profile and propagation paths. SRT can be solved with parallel MPI processes.', zh: ProMan 计算路径损耗、时延扩展与角度扩展、LOS/NLOS 状态、定向信道冲激响应、角度谱和传播路径。SRT 可使用并行 MPI 进程求解。}
    outputs:
    - {en: Propagation results per receiver location, zh: 各接收位置的传播结果}
  - title: {en: Run network planning or batch jobs, zh: 运行网络规划或批处理}
    detail: {en: Network planning is post-processing of the propagation results and yields coverage maps and capacity results. WinPropCLI runs projects in batch mode and can be used with queuing systems; the C API integrates WinProp into other tools., zh: 网络规划是传播结果的后处理，输出覆盖图和容量结果。WinPropCLI 以批处理方式运行工程，可接入队列系统；C 语言 API 可将 WinProp 集成到其他工具中。}
    outputs:
    - {en: Coverage maps and capacity results, zh: 覆盖图与容量结果}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: 'Path loss, delay spread and angular spread, LOS/NLOS status, directional channel impulse response, angular profile and propagation paths.', zh: 路径损耗、时延扩展与角度扩展、LOS/NLOS 状态、定向信道冲激响应、角度谱和传播路径。}
- label: {en: Network outputs, zh: 网络输出}
  text: {en: 'Coverage maps (cell assignment, best server, active set, channel quality, received power, SINR) and capacity results (throughput, maximum data rates, packet delays, QoS).', zh: 覆盖图（小区分配、最佳服务小区、active set、信道质量、接收功率、SINR）以及容量结果（吞吐量、最大数据速率、分组时延、QoS）。}
- label: {en: Database types, zh: 数据库类型}
  text: {en: Pixel databases store elevations and optional land usage per pixel and are typical for rural and suburban scenarios. 2.5D vector databases store building footprints with heights for urban scenarios. 3D vector databases store flat polygons with arbitrary orientation for indoor and small outdoor scenarios., zh: 像素数据库按像素存储高程和可选土地利用，常用于农村与郊区场景。2.5D 矢量数据库以多边形轮廓及高度描述城市建筑。3D 矢量数据库以任意朝向的平面多边形描述室内及小型室外场景。}
- label: {en: Antenna input, zh: 天线输入}
  text: {en: 'Antenna patterns can be imported from Feko, and AMan generates, edits and analyzes single antennas.', zh: 天线方向图可从 Feko 导入，AMan 用于生成、编辑和分析单个天线。}
- label: {en: Interfaces, zh: 接口}
  text: {en: 'WinPropCLI runs projects without the GUI on Windows and Linux and can be used with queuing systems such as PBS, Torque, LSF and GridEngine. A C API is provided for integration.', zh: WinPropCLI 可在 Windows 和 Linux 上无图形界面运行工程，可用于 PBS、Torque、LSF、GridEngine 等队列系统。同时提供用于集成的 C 语言 API。}
provenance:
- {en: 2.5D/3D geometry and terrain, zh: 2.5D/3D 几何、地形}
- {en: DPM/IRT/SRT/empirical propagation models, zh: DPM/IRT/SRT/经验传播模型}
- {en: Paths/field strengths/powers/optional CIR, zh: 路径/场强/功率/可选 CIR}
- {en: Planning or link calculations, zh: 规划或链路计算}
- {en: User-exported data, zh: 用户导出数据}
technical_notes:
- {en: 'The Methods page lists empirical and semi-empirical models (calibration with measurements possible), 3D ray tracing, and the dominant path model (DPM). The ProMan page names the standard ray tracing model (SRT).', zh: 方法页面列出经验与半经验模型（可用测量校准）、三维射线追踪和主导路径模型（DPM）。ProMan 页面将标准射线追踪模型称为 SRT。}
- {en: Several methods are fully three-dimensional and compute all rays in 3D; others consider only the vertical plane., zh: 部分方法为完全三维方法，在三维空间中计算所有射线；其他方法仅考虑垂直平面。}
limitations:
- {en: Methods that focus on the vertical plane do not compute rays in three dimensions., zh: 仅关注垂直平面的方法不在三维空间中计算射线。}
history: []
usage:
- {en: 'Select the propagation model for the application: the Methods page notes that models differ in assumptions, prediction accuracy and computational resources.', zh: 按应用选择传播模型：方法页面指出，各模型在假设、预测精度和计算资源方面存在差异。}
- {en: 'Geometry comes from WallMan (vector building data and time-variant object motion), TuMan (tunnels), or a terrain profile imported into ProMan for rural and suburban scenarios.', zh: 几何数据来自 WallMan（矢量建筑数据及随时间变化的对象运动）、TuMan（隧道）或导入 ProMan 的地形剖面（农村与郊区场景）。}
- {en: Antenna patterns are produced in Feko or AMan and imported into the project., zh: 天线方向图由 Feko 或 AMan 生成，并导入工程。}
- {en: 'Batch runs use WinPropCLI, and SRT can be solved with parallel MPI processes.', zh: 批量运行可使用 WinPropCLI，SRT 可用并行 MPI 进程求解。}
overview: {en: 'Altair WinProp is a commercial suite of tools for wireless propagation and radio network planning, published by Altair Engineering. Its documentation covers radio links from satellite to terrestrial and from rural through urban to indoor scenarios. ProMan contains the propagation models and network planners for various air interfaces, while WallMan, TuMan and AMan are editors for building, tunnel and antenna data. Prediction methods include empirical and semi-empirical models that can be calibrated with measurements, rigorous 3D ray tracing, and the urban dominant path model (DPM). Geometry is supplied as a pixel database for rural or suburban areas, a 2.5D vector database of buildings with heights for urban areas, or a 3D vector database of polygons for indoor and small outdoor scenes. Outputs include path loss, delay and angular spread, LOS/NLOS status, directional channel impulse response, angular profile, propagation paths, and coverage and capacity results derived from
    them. The WinProp command line interface (WinPropCLI) runs projects in batch mode, and a C API supports integration into other tools.', zh: Altair WinProp 是 Altair Engineering 发布的商业无线传播与无线网络规划工具套件。其文档涵盖从卫星到地面、从农村、城市到室内的无线链路。ProMan 包含面向各类空口的传播模型与网络规划模拟器，WallMan、TuMan 和 AMan 则分别是建筑、隧道和天线数据的编辑工具。预测方法包括可用测量数据校准的经验与半经验模型、严格的三维射线追踪，以及城市主导路径模型（DPM）。几何数据可采用用于农村或郊区的像素数据库、用于城市且带高度信息的建筑 2.5D 矢量数据库，或用于室内及小型室外场景的三维多边形矢量数据库。输出包括路径损耗、时延扩展与角度扩展、LOS/NLOS 状态、定向信道冲激响应、角度谱、传播路径，以及由此得到的覆盖与容量结果。WinProp 命令行接口（WinPropCLI）可批量运行工程，C 语言 API 则支持与其他工具集成。}
signal_details:
- signal: pathloss
  text: {en: 'Path loss is predicted for each receiver location. For urban scenarios the documented methods are the COST 231 extended Walfisch-Ikegami model, an empirical vertical-plane model with knife-edge diffraction, the urban dominant path model (DPM) and a 3D ray-tracing model. Delay spread and angular spread can be computed in the same analysis.', zh: 为每个接收位置预测路径损耗。城市场景的文档化方法包括 COST 231 扩展 Walfisch-Ikegami 模型、带刀刃绕射的经验垂直平面模型、城市 DPM 以及三维射线追踪模型。同一分析中还可计算时延扩展和角度扩展。}
- signal: paths
  text: {en: 'Propagation paths are listed among the outputs. Several methods are fully three-dimensional and compute all rays in 3D, while others consider only the vertical plane.', zh: 传播路径列于输出之中。部分方法为完全三维方法，在三维空间中计算所有射线；其他方法仅考虑垂直平面。}
- signal: cir
  text: {en: 'The directional channel impulse response is one of the outputs. Linear and circular antenna configurations are taken into account in the propagation analysis, and antenna patterns can be imported from sources including Feko.', zh: 定向信道冲激响应是输出之一。线性和圆形等天线配置在传播分析中一并计算，天线方向图可从 Feko 等来源导入。}
