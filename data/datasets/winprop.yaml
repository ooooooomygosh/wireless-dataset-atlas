- {en: Paths/field strengths/powers/optional CIR, zh: 路径/场强/功率/可选 CIR}
- {en: Planning or link calculations, zh: 规划或链路计算}
- {en: User-exported data, zh: 用户导出数据}
technical_notes:
- {en: 'Confirmed: DPM''s dominant-path approach is not equivalent to full multipath SRT.', zh: 已确认：DPM 主导路径方法不等同完整多径 SRT。}
- {en: 'Confirmed: SRT can accelerate computation using neighboring pixels'' path classes or reduced resolution; record these settings.', zh: 已确认：SRT 可使用邻近像素路径类或降低分辨率加速，需记录这些选项。}
- {en: 'Confirmed: the 2026 release notes add pulse radar and support for multiple bistatic RCS interactions.', zh: 已确认：2026 发布说明新增 pulse radar 和多次 bistatic RCS 交互支持。}
limitations:
- {en: DPM-versus-IRT map differences include model-approximation differences and should not be described as measured domain differences., zh: DPM 与 IRT 地图差异同时包含模型近似差异，不能称为真实实测域差异。}
- {en: 'Distinguish 2D footprints, 2.5D buildings, and complete 3D meshes.', zh: 二维 footprint、2.5D 建筑与完整三维 mesh 必须区分。}
history:
- {en: '2026: official release notes describe SRT acceleration, pulse radar, and bistatic RCS improvements.', zh: 2026：官方 release notes 列出 SRT 加速、pulse radar 与 bistatic RCS 改进。}
