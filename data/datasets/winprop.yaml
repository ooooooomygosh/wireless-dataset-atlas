summary: {en: 'A collection of propagation and wireless-network-planning tools. DPM, SRT, IRT, and empirical models produce different levels of output. The older RadioMapSeer configuration does not represent all current WinProp capabilities.', zh: 传播与无线网络规划工具集合；DPM、SRT、IRT 与经验模型产生不同层次输出。RadioMapSeer 使用的旧配置不能代表 WinProp 当前全部能力。}
checked: '2026-11-06'
pipeline:
  summary: {en: 'Generate propagation predictions from geometry databases and wireless settings, then export grids or paths. Model and acceleration settings directly affect data fidelity.', zh: 从几何数据库与无线配置生成传播预测，再输出栅格或路径结果。模型与加速设置直接影响数据保真度。}
  stages:
  - title: {en: Build the environment database, zh: 建立环境数据库}
    detail: {en: 'Import or edit the propagation environment so sites, materials, and prediction regions share consistent geometry.', zh: 导入或编辑传播环境，使站点、材料与预测区域使用统一几何。}
    inputs:
    - {en: Building/indoor geometry and terrain, zh: 建筑/室内几何、地形}
    - {en: Materials and geographic coordinates, zh: 材料和地理坐标}
    outputs:
    - {en: Scene database for propagation solving, zh: 供传播求解使用的场景数据库}
    controls:
    - {en: 'Researcher specifies: 2.5D/3D representation, resolution, building heights, and materials', zh: 研究者固定：2.5D/3D表示、分辨率、建筑高度和材料}
    checks:
    - {en: Check consistent terrain/building height references, zh: 检查地形/建筑高度基准一致}
    - {en: Retain original geometry and simplification rules, zh: 保留原始几何与简化规则}
  - title: {en: Set sites and prediction grids, zh: 设置站点和预测网格}
    detail: {en: 'Specify carrier frequency, antennas, transmit power, and receiver prediction plane/height.', zh: 指定载频、天线、发射功率和接收预测平面/高度。}
    inputs:
    - {en: Scene database, zh: 场景数据库}
    - {en: 'Tx positions, antennas, and target region', zh: Tx位置、天线与目标区域}
    outputs:
    - {en: Site and receiver-grid definitions, zh: 站点与接收栅格定义}
    controls:
    - {en: 'Researcher specifies: band, polarization, antenna orientation, grid spacing, and Tx count', zh: 研究者固定：频段、极化、天线方向、网格间距和Tx数量}
    checks:
    - {en: Check the pixel-to-meter mapping, zh: 检查像素到米的映射}
    - {en: Do not treat images for different transmitters as a joint network result at one instant, zh: 避免把不同Tx图像误认为同一个时刻的联合网络结果}
  - title: {en: Select propagation and acceleration models, zh: 选择传播模型与加速}
    detail: {en: Choose a dominant-path or ray-tracing model. SRT can accelerate computation using neighboring pixels' path classes and a coarser calculation resolution., zh: 选择主导路径或射线追踪模型；SRT可用邻近像素路径类和较低计算分辨率加速。}
    inputs:
    - {en: Sites/grid, zh: 站点/网格}
    - {en: 'DPM, SRT, IRT, or another model', zh: DPM、SRT、IRT或其他模型}
    outputs:
    - {en: Model and accuracy/runtime settings, zh: 模型及精度/运行成本设置}
    controls:
    - {en: 'Researcher specifies: model, reflection/diffraction budget, preprocessing, and acceleration options', zh: 研究者固定：模型、反射/绕射预算、预处理和加速选项}
    checks:
    - {en: Distinguish DPM dominant-path outputs from complete multipath outputs, zh: 区分DPM主导路径与完整多径输出}
    - {en: Record tile/grid and path limits; "WinProp" alone is insufficient, zh: 记录tile/栅格与路径限制，不能仅写WinProp}
  - title: {en: Solve and save physical results, zh: 求解并保存物理结果}
    detail: {en: Compute predictions such as propagation loss/received power. Detailed path or CIR outputs depend on the selected model and output configuration., zh: 计算传播损耗/接收功率等预测；是否输出详细路径或CIR依所选模型和输出配置。}
    inputs:
    - {en: Complete solver settings, zh: 完整求解设置}
    outputs:
    - {en: Propagation-prediction grids, zh: 传播预测栅格}
    - {en: Paths/CIR when supported by the configuration, zh: 配置支持时的路径/CIR}
    controls:
    - {en: 'Researcher specifies: output quantity, dB definition, no-coverage encoding, and receiver height', zh: 研究者固定：输出量、dB定义、无覆盖编码和接收高度}
    checks:
    - {en: Check whether transmit power is already included in the output, zh: 核对发射功率是否已计入结果}
    - {en: 'Distinguish zeros, missing data, and threshold-clipped pixels', zh: 区分零、无数据与被阈值裁剪的像素}
  - title: {en: Create a dataset or evaluate the network, zh: 制作数据集或网络评价}
    detail: {en: Encode floating-point maps as arrays/images or use them in planning metrics. Retain the physical-value-to-pixel conversion before training., zh: 将浮点地图编码为数组/图像，或接入规划指标；训练前保留物理值到像素的转换。}
    inputs:
    - {en: Physical results and grid metadata, zh: 物理结果与网格元数据}
    - {en: Researcher-defined quantization/splitting rules, zh: 研究者定义的量化/切分规则}
    outputs:
    - {en: Map dataset, zh: 地图数据集}
    - {en: 'Coverage, interference, or planning labels', zh: 覆盖、干扰或规划标签}
    controls:
    - {en: 'Researcher specifies: clipping range, quantization precision, and map/site splits', zh: 研究者固定：裁剪范围、量化精度、地图/站点划分}
    checks:
    - {en: A single power map cannot recover complex CSI, zh: 不能由单一功率图恢复复数CSI}
    - {en: Separate high-fidelity simulation references from measured ground truth, zh: 高精度仿真参照与真实测量ground truth分开}
  scope: {en: 'WinProp propagation/planning workflow; select DPM, SRT, or IRT and record the dataset''s specific configuration separately.', zh: WinProp传播/规划工作流；DPM、SRT和IRT分别选择，数据集的具体配置另记。}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: '• Model-generated propagation-prediction grids

      • Optional paths/CIR and planning results', zh: '• 按模型生成的传播预测栅格

      • 可选路径/CIR与规划结果'}
- label: {en: Derived outputs, zh: 派生输出}
  text: {en: '• Normalized PNG/array maps

      • Coverage/outage and multisite power-domain decisions', zh: '• 归一化PNG/数组地图

      • coverage/outage及多站功率域决策'}
- label: {en: What the researcher controls, zh: 研究者可控范围}
  text: {en: controls and checks identify settings to fix or verify when reproducing or using the data. Values explicitly labeled as paper settings come from the cited source; other items are not official defaults., zh: controls和checks是复现/使用时需要固定或验证的项目；其中明确标注论文配置的数值来自原来源，其余不代表官方默认。}
- label: {en: Reproduction notes, zh: 复现说明}
  text: {en: '• See the RadioMapSeer and RadioMapMotion cards for their propagation models, dynamic processing, and encodings.

      • The 2026 pulse-radar capability is not a field already included in existing radio-map packages.', zh: '• RadioMapSeer、RadioMapMotion各自的传播模型、动态处理和编码方式见对应卡片。

      • 2026 pulse radar能力不是既有无线地图包自带字段。'}
