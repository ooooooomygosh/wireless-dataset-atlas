  status: simulate
  note: {en: The native complex output is the directional channel impulse response; MIMO at both base station and mobile station can be set up in a time-variant scenario., zh: 原生复数输出为定向信道冲激响应；可在时变场景中设置基站与移动台两端的 MIMO。}
- key: cir
  status: simulate
  note: {en: Directional channel impulse response is a native output of the propagation analysis., zh: 定向信道冲激响应是传播分析的原生输出。}
- key: paths
  status: simulate
  note: {en: Propagation paths are listed among the outputs of the analysis., zh: 传播路径列于分析输出之中。}
- {key: interaction, status: unknown}
- key: power
  status: simulate
  note: {en: Path loss is predicted for each receiver location; received power appears in network planning results., zh: 为每个接收位置预测路径损耗；接收功率见于网络规划结果。}
