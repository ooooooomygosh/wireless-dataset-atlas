summary: {en: 'The dataset contains per-base-station and per-UE radio and throughput measurements (for example DL/UL bit rate, MCS, SNR, RSRP and buffer status) from a Colosseum network with 7 base stations, 42 UEs and three scheduling policies. Traces are organized by scheduling policy, RBG allocation configuration and experiment.', zh: 该数据集包含基站级和UE级的无线电与吞吐量测量（例如DL/UL bit rate、MCS、SNR、RSRP和缓冲区状态），采集自包含7个基站、42个UE和三种调度策略的Colosseum网络。数据按调度策略、RBG分配配置和实验进行组织。}
