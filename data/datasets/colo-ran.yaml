overview: {en: 'ColO-RAN is a set of per-base-station and per-UE KPI logs from a Colosseum experiment with 7 base stations, 42 UEs and a 10 MHz channel (50 PRBs). It accompanies the 2022 IEEE Transactions on Mobile Computing paper by Polese, Bonati, D''Oro, Basagni and Melodia, and CITATION.cff gives a release date of 2021-12-10. The base stations run the SCOPE framework, which extends srsRAN and reports key performance measurements (KPMs) periodically over the E2 interface. Each base station has three slices, one per traffic class (eMBB, MTC and URLLC), and each class has 14 UEs across the network, two per base station and slice. The UEs are static and uniformly distributed within 50 m of their base station in the Colosseum Rome medium scenario. The traces are grouped by scheduling policy (round robin, waterfilling and proportional fair), by RBG allocation configuration (tr0 to tr27) and by experiment. The released files are CSV time series of the number of connected UEs and the DL/UL bit
    rates per base station, and of UE radio, MCS, SNR, buffer and throughput values. The README documents one scenario, rome_static_medium.', zh: ColO-RAN 是一组来自 Colosseum 实验的基站级和 UE 级 KPI 日志，实验包含 7 个基站、42 个 UE 和 10 MHz 信道（50 个 PRB）。该数据集对应 Polese、Bonati、D'Oro、Basagni 与 Melodia 于 2022 年发表于 IEEE Transactions on Mobile Computing 的论文，CITATION.cff 给出的发布日期为 2021-12-10。基站运行 SCOPE 框架，该框架扩展了 srsRAN，并通过 E2 接口周期性上报关键性能测量（KPM）。每个基站配置三个切片，每个切片对应一类流量（eMBB、MTC 和 URLLC），每类流量在全网共有 14 个 UE，即每个基站每个切片 2 个。UE 静止，并在 Colosseum Rome medium 场景中均匀分布于各自基站 50 m 范围内。数据按调度策略（round robin、waterfilling 和 proportional fair）、RBG 分配配置（tr0 至 tr27）以及实验进行组织。发布文件为 CSV 时间序列，包含每个基站的连接 UE 数与上下行比特率，以及 UE 的无线电、MCS、SNR、缓冲区和吞吐量数值。README 仅记录了一个场景 rome_static_medium。}
signal_details:
- signal: kpi
  text: {en: 'Per-base-station files bsN.csv with columns time, nof_ue, dl_brate and ul_brate. Per-UE files ueN.csv with 21 columns: time, cc, pci, earfcn, rsrp, pl, cfo, dl_mcs, dl_snr, dl_turbo, dl_brate, dl_bler, ul_ta, ul_mcs, ul_buff, ul_brate, ul_bler, rf_o, rf_u, rf_l and is_attached. Each base station folder also contains a slices_bsN folder.', zh: 基站级文件为 bsN.csv，列为 time、nof_ue、dl_brate 和 ul_brate。UE 级文件为 ueN.csv，共 21 列：time、cc、pci、earfcn、rsrp、pl、cfo、dl_mcs、dl_snr、dl_turbo、dl_brate、dl_bler、ul_ta、ul_mcs、ul_buff、ul_brate、ul_bler、rf_o、rf_u、rf_l 和 is_attached。每个基站文件夹还包含一个 slices_bsN 文件夹。}
pipeline:
  summary: {en: 'The Colosseum Rome medium scenario hosts srsRAN-based base stations under the SCOPE framework. RBG allocation and scheduling policy are set per trace directory, and KPMs are logged to CSV.', zh: Colosseum Rome medium 场景中运行基于 srsRAN 的基站，并由 SCOPE 框架管理。RBG 分配与调度策略按跟踪目录设置，KPM 记录为 CSV 文件。}
  stages:
  - title: {en: RF and topology scenario, zh: 射频与拓扑场景}
    detail: {en: 'The Colosseum Rome scenario, medium setting, places 7 base stations (nodes 1, 8, 15, 22, 29, 36 and 43) and 42 static UEs, uniformly distributed within 50 m of their base station. The channel bandwidth is 10 MHz (50 PRBs).', zh: Colosseum Rome 场景（medium 设置）放置 7 个基站（节点 1、8、15、22、29、36 和 43）以及 42 个静止 UE，UE 在各自基站 50 m 范围内均匀分布。信道带宽为 10 MHz（50 个 PRB）。}
    inputs:
    - {en: Colosseum Rome RF scenario, zh: Colosseum Rome 射频场景}
    outputs:
    - {en: 7 base stations and 42 UEs, zh: 7 个基站与 42 个 UE}
  - title: {en: Base station stack, zh: 基站协议栈}
    detail: {en: 'The base stations run the SCOPE framework, which extends srsRAN with open interfaces for runtime reconfiguration of base-station parameters and automatic KPM collection. The E2 termination of the OSC DU is extended so that the near-real-time RIC can reconfigure the base stations and receive periodic reports. Each base station is split into three slices.', zh: 基站运行 SCOPE 框架，该框架在 srsRAN 基础上增加开放接口，支持运行时重配基站参数并自动采集 KPM。OSC DU 的 E2 终端经扩展后，近实时 RIC 可直接重配基站并接收周期性上报。每个基站划分为三个切片。}
    inputs:
    - {en: srsRAN-based base stations, zh: 基于 srsRAN 的基站}
    outputs:
    - {en: Periodic E2 KPM reports, zh: 周期性 E2 KPM 上报}
  - title: {en: Per-slice traffic, zh: 分切片流量}
    detail: {en: Slice 0 carries eMBB UEs with constant bitrate traffic of 4 Mbps per UE. Slice 1 carries MTC UEs with Poisson traffic of 30 packets/s of 125 bytes per UE. Slice 2 carries URLLC UEs with Poisson traffic of 10 packets/s of 125 bytes per UE., zh: 切片 0 承载 eMBB UE，每个 UE 为 4 Mbps 恒定比特率流量。切片 1 承载 MTC UE，每个 UE 为泊松流量，30 包/秒，每包 125 字节。切片 2 承载 URLLC UE，每个 UE 为泊松流量，10 包/秒，每包 125 字节。}
    inputs:
    - {en: 'UE-to-slice assignment, 14 UEs per slice', zh: UE 到切片的分配，每切片 14 个 UE}
    outputs:
    - {en: Traffic load per slice, zh: 各切片流量负载}
  - title: {en: Scheduler and RBG configuration, zh: 调度器与 RBG 配置}
    detail: {en: 'Directories sched0, sched1 and sched2 hold the traces for round-robin, waterfilling and proportional-fair scheduling. Within each, tr0 to tr27 set the number of RBGs per slice; tr0 gives 2, 13 and 2 RBGs to slices 0, 1 and 2.', zh: 目录 sched0、sched1 和 sched2 分别存放 round-robin、waterfilling 与 proportional-fair 调度的跟踪数据。每个目录中，tr0 至 tr27 设定各切片的 RBG 数量；例如 tr0 为切片 0、1、2 分配 2、13、2 个 RBG。}
    inputs:
    - {en: 'Scheduling policy (RR, WF, PF)', zh: 调度策略（RR、WF、PF）}
    - {en: 'RBG allocation, 28 configurations', zh: RBG 分配，共 28 种配置}
    outputs:
    - {en: Experiment folders per configuration, zh: 每种配置下的实验文件夹}
  - title: {en: KPM logging to CSV, zh: KPM 记录为 CSV}
    detail: {en: 'Each experiment folder, for example rome_static_medium/sched0/tr0/exp1, contains bsN.csv for every base station and ueN.csv for every UE. The base-station files hold the UE count and DL/UL bit-rate columns, and the UE files hold 21 radio, MCS, SNR, buffer and throughput columns.', zh: 每个实验文件夹（例如 rome_static_medium/sched0/tr0/exp1）包含每个基站的 bsN.csv 和每个 UE 的 ueN.csv。基站文件包含 UE 数与上下行比特率列，UE 文件包含 21 列无线电、MCS、SNR、缓冲区和吞吐量数据。}
    inputs:
    - {en: Base-station and UE KPM reports, zh: 基站与 UE 的 KPM 上报}
    outputs:
    - {en: bsN.csv and ueN.csv files, zh: bsN.csv 与 ueN.csv 文件}
facts:
- label: {en: Carriers, zh: 载频}
  text: {en: The paper's RF setup uses a DL carrier of 0.98 GHz and a UL carrier of 1.02 GHz on a 10 MHz channel., zh: 论文的射频设置使用 0.98 GHz 的 DL 载频和 1.02 GHz 的 UL 载频，信道带宽为 10 MHz。}
- label: {en: UE classes, zh: UE 类别}
  text: {en: 'Slice 0 carries the eMBB UEs, slice 1 the MTC UEs and slice 2 the URLLC UEs; the README lists the UE indices of each class.', zh: 切片 0 承载 eMBB UE，切片 1 承载 MTC UE，切片 2 承载 URLLC UE；README 列出了每类 UE 的编号。}
capabilities:
- key: csi
  status: none
  note: {en: 'The released ueN.csv and bsN.csv files hold KPM columns only, with no channel matrices.', zh: 发布的 ueN.csv 与 bsN.csv 仅包含 KPM 列，不含信道矩阵。}
- key: cir
  status: none
  note: {en: The CSV columns contain no impulse response or power delay profile., zh: CSV 列中不含冲激响应或功率时延分布。}
- key: paths
  status: none
  note: {en: 'No per-path delay, angle, power or phase columns are released.', zh: 未发布逐径时延、角度、功率或相位列。}
- key: interaction
  status: none
  note: {en: No per-path interaction data are released., zh: 未发布逐径交互数据。}
- key: power
  status: provided
  note: {en: Each ueN.csv has rsrp and pl (path loss) columns; the README gives no units., zh: 每个 ueN.csv 含 rsrp 与 pl（路径损耗）列；README 未给出单位。}
- key: iq
  status: none
  note: {en: The release holds KPI logs and no I/Q samples., zh: 发布内容为 KPI 日志，不含 I/Q 采样。}
- key: beam_labels
  status: none
  note: {en: No beam indices or per-beam gains are released., zh: 未发布波束索引或逐波束增益。}
- key: position
  status: none
  note: {en: The CSV files have no UE or BS coordinates; the README states that UEs lie within 50 m of their BS., zh: CSV 文件不含 UE 或基站坐标；README 说明 UE 位于各自基站 50 m 范围内。}
- key: geometry
  status: none
  note: {en: 'The release contains CSV KPI files and documentation, with no scene or map files.', zh: 发布内容为 CSV 形式的 KPI 文件和文档，不含场景或地图文件。}
- key: materials
  status: none
  note: {en: No material parameters are released., zh: 未发布材料参数。}
- key: rgb
  status: none
  note: {en: The release contains KPI CSV files only., zh: 发布内容仅为 KPI CSV 文件。}
- key: depth
  status: none
  note: {en: The release contains KPI CSV files only., zh: 发布内容仅为 KPI CSV 文件。}
- key: lidar
  status: none
  note: {en: The release contains KPI CSV files only., zh: 发布内容仅为 KPI CSV 文件。}
- key: radar
  status: none
  note: {en: The release contains KPI CSV files only., zh: 发布内容仅为 KPI CSV 文件。}
- key: imu
  status: none
  note: {en: The release contains KPI CSV files only., zh: 发布内容仅为 KPI CSV 文件。}
- key: time_series
  status: provided
  note: {en: Every bsN.csv and ueN.csv has a time column; the README does not state the sampling interval., zh: 每个 bsN.csv 与 ueN.csv 均含 time 列；README 未说明采样间隔。}
- key: multiuser
  status: provided
  note: {en: KPI logs of 42 UEs are recorded in the same experiment; these UEs have no channel data., zh: 同一实验中记录了 42 个 UE 的 KPI 日志；这些 UE 不含信道数据。}
- key: multibs
  status: provided
  note: {en: 'Seven base stations are logged in the same experiment, one bsN.csv each.', zh: 同一实验中记录了 7 个基站的日志，每个基站一个 bsN.csv。}
- key: crossfreq
  status: none
  note: {en: 'The data cover one band pair, DL 0.98 GHz and UL 1.02 GHz, per the paper''s RF setup.', zh: 按论文的射频设置，数据仅覆盖一组频段，即 DL 0.98 GHz 与 UL 1.02 GHz。}
- {key: near_field, status: unknown}
- key: high_mobility
  status: none
  note: {en: UE mobility is static., zh: UE 为静止状态。}
- {key: dynamic_blockage, status: unknown}
- {key: reflection, status: unknown}
- {key: diffraction, status: unknown}
- {key: scattering, status: unknown}
- {key: transmission, status: unknown}
- key: polarization
  status: none
  note: {en: No polarimetric fields are released., zh: 未发布极化相关字段。}
- key: em_field
  status: none
  note: {en: No field-level or antenna-pattern outputs are released., zh: 未发布场级或天线方向图输出。}
