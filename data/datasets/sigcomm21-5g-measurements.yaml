summary: {en: 'Measurement artifacts for 4G and 5G network experiments, covering throughput and speedtest results, handoffs while driving, RRC state probing, power traces, and ABR video streaming and web browsing QoE. Small data files are included in the repository and the full datasets are linked externally.', zh: 面向 4G 与 5G 网络实验的测量数据与分析脚本，涵盖吞吐量与测速结果、驾驶途中的切换、RRC 状态探测、功耗轨迹，以及 ABR 视频流和网页浏览的 QoE。小型数据文件存放在仓库中，完整数据集通过外部链接提供。}
