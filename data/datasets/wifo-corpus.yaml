id: wifo-corpus
name: RF-only channel dataset for WiFo
aliases: [WiFo pre-training channel datasets]
year: 2025
origin: statistical
tasks: [foundation-model, channel-prediction, csi-feedback]
signals: [csi]
bands_ghz: [1.5, 2.5, 3.5, 4.9, 5.9, 6.7, 28]
environment: [indoor, outdoor-urban, rural]
mobility: user speed 0-300 km/h, depending on dataset
standard: 5G NR
samples: 12,000 samples per dataset, 19 datasets (D1-D19)
license: Apache-2.0
access: {url: 'https://huggingface.co/datasets/pku-pcni-lab/RF-only_channel_dataset_for_WiFo', type: open}
code: ['https://github.com/PKU-PCNI/WiFo']
paper: arxiv:2412.08908
used_in: ['doi:10.1109/twc.2026.3681311', 'doi:10.1109/lwc.2026.3664439', 'doi:10.1109/tccn.2026.3717927']
citing: ['doi:10.1109/tmlcn.2025.3585845', 'doi:10.1109/jsac.2025.3643823', 'doi:10.1109/mcom.001.2400761']
summary: {en: 'Simulated MISO-OFDM CSI generated with the QuaDRiGa channel generator for 3GPP scenarios (UMi, UMa, RMa and indoor) at seven 5G NR bands from 1.5 to 28 GHz, with user speeds up to 300 km/h. The 19 datasets (D1 to D19) each contain 12,000 samples.', zh: '由 QuaDRiGa 信道生成器按 3GPP 场景（UMi、UMa、RMa 与室内）生成的仿真 MISO-OFDM CSI，覆盖 1.5 至 28 GHz 的七个 5G NR 频段，用户速度最高 300 km/h。19 个数据集（D1 至 D19）各含 12,000 个样本。'}
sources: ['https://huggingface.co/datasets/pku-pcni-lab/RF-only_channel_dataset_for_WiFo', 'https://github.com/PKU-PCNI/WiFo', 'https://arxiv.org/abs/2412.08908', 'https://arxiv.org/html/2412.08908']
checked: '2026-11-06'
pipeline:
  summary: {en: '19 scenario configurations generate spatial–temporal–frequency CSI. Real/imaginary representations enter a unified masked-reconstruction interface; different masks define completion, temporal extrapolation, and frequency extrapolation.', zh: 19 组场景配置生成时空频 CSI；实虚表示进入统一遮挡重建接口，以不同 mask 表达补全、时间外推和频率外推。}
  stages:
  - title: {en: Define scenarios and motion conditions, zh: 定义场景与移动条件}
    detail: {en: 'The authors specify propagation scenarios, frequencies, antennas, and motion conditions for 19 configurations. UE positions are initialized randomly, with straight-line motion within each sample at speeds from the specified range.', zh: 作者为 19 组配置分别指定传播场景、频率、天线和运动条件；UE 随机初始化位置，并在样本内按给定速度范围作直线移动。}
    inputs:
    - {en: 3GPP scenario categories, zh: 3GPP 场景类别}
    - {en: 'Carrier frequency, UPA, and sampling parameters', zh: 载频、UPA 与采样参数}
    outputs:
    - {en: Configuration and trajectory collection, zh: 配置与轨迹集合}
    controls:
    - {en: 'Author settings: the BS UPA uses half-wavelength spacing; the UE has a single antenna.', zh: 作者设置：BS UPA 使用半波长间距，UE 为单天线。}
    checks:
    - {en: 'Reproduction recommendation: take configurations individually from the paper''s table. Different D numbers do not share a single default carrier frequency, speed, or tensor size.', zh: 复现建议：从论文表格逐项取配置；不同 D 编号不共享一个默认载频、速度或张量尺寸。}
  - title: {en: Generate continuous spatial–temporal–frequency channels with QuaDRiGa, zh: QuaDRiGa 生成连续时空频信道}
    detail: {en: 'Run QuaDRiGa channel generation at sampled trajectory points and organize results into MISO-OFDM samples. Each configuration is reported to contain 12,000 samples.', zh: '在轨迹采样点运行 QuaDRiGa 信道生成并组织成 MISO-OFDM 样本；每组配置报告 12,000 个样本。'}
    inputs:
    - {en: Scenario configuration, zh: 场景配置}
    - {en: UE trajectories, zh: UE 轨迹}
    - {en: Sampling times and subcarrier grid, zh: 采样时刻与子载波网格}
    outputs:
    - {en: Complex spatial–temporal–frequency CSI, zh: 复数时空频 CSI}
    controls:
    - {en: 'Author settings: spatial, temporal, and frequency scales vary by configuration.', zh: 作者设置：空间、时间和频率尺度随配置变化。}
    checks:
    - {en: 'Reproduction recommendation: preserve sampling intervals, speeds, array order, and subcarrier order. Spatially adjacent samples are not independent trials.', zh: 复现建议：保留采样间隔、速度、阵列顺序与子载波顺序；空间相邻样本不等于独立试验。}
  - title: {en: Load MAT files and separate real/imaginary channels, zh: MAT 加载与实虚通道化}
    detail: {en: 'The public DataLoader reads X_val from MAT files, separates complex channels into real and imaginary components, and converts them to float tensors. Dimensions depend on each dataset''s input.', zh: 公开 DataLoader 读取 MAT 内的 X_val，将复信道拆成实部和虚部并转为 float 张量；数据集维度由各自输入决定。}
    inputs:
    - {en: X_test.mat for each dataset, zh: 各数据集 X_test.mat}
    outputs:
    - {en: Two-channel real/imaginary test tensors, zh: 实虚双通道测试张量}
    controls:
    - {en: 'To verify: this loader does not specify any common scaling or normalization before the MAT files were written.', zh: 待核实：MAT 写入前的统一缩放或归一化步骤未在该加载器中给出。}
    checks:
    - {en: 'Reproduction recommendation: check keys, dimensions, and amplitude statistics before adding processing. Do not describe the loader''s real/imaginary separation as unit-power normalization.', zh: 复现建议：先核对键名、维度和幅度统计，再增加处理；不要把加载器的实虚拆分写成单位功率归一化。}
  - title: {en: 'Generate completion, temporal, and frequency tasks', zh: 生成补全、时间与频率任务}
    detail: {en: 'The random strategy shuffles tokens and retains a subset; causal retains a temporal prefix; frequency retains a frequency prefix. mask=1 denotes removed positions, and the model reconstructs targets from visible portions.', zh: random 策略打乱 token 后保留一部分；causal 策略保留时间前缀；frequency 策略保留频率前缀。mask=1 表示移除位置，模型据可见部分重建目标。}
    inputs:
    - {en: Two-channel real/imaginary CSI, zh: 实虚双通道 CSI}
    - {en: Mask strategy, zh: mask 策略}
    outputs:
    - {en: Visible tokens, zh: 可见 token}
    - {en: Reconstruction targets, zh: 重建目标}
    - {en: Task masks and restoration indices, zh: 任务 mask 与恢复索引}
    controls:
    - {en: 'Author code: interpret temporal and frequency masking according to the actual axes in the code.', zh: 作者代码：时间和频率遮挡应按代码实际轴解释。}
    checks:
    - {en: 'Reproduction recommendation: assert that extrapolation targets never enter the encoder; visualize small tensors to check each mask''s boundaries.', zh: 复现建议：断言外推目标未进入 encoder；用可视化小张量检查每种 mask 的边界。}
  - title: {en: Add noise and reconstruction supervision, zh: 加噪与重建监督}
    detail: {en: 'Current model.forward uses mean(imgs²) over the entire input batch to set noise power at 20 dB, adds Gaussian noise before encoding, and uses clean imgs as reconstruction targets.', zh: 当前 model.forward 以整个输入 batch 的 mean(imgs²) 设置 20 dB 噪声功率，加入高斯噪声后编码，干净 imgs 用作重建目标。}
    inputs:
    - {en: Clean CSI, zh: 干净 CSI}
    - {en: Masked task, zh: mask 后的任务}
    outputs:
    - {en: Noisy visible inputs, zh: 带噪可见输入}
    - {en: Clean reconstruction supervision, zh: 干净重建监督}
    controls:
    - {en: 'Author code: 20 dB is the current forward setting; the batch jointly determines the noise scale.', zh: 作者代码：20 dB 是当前 forward 的设置，噪声尺度由 batch 共同计算。}
    checks:
    - {en: 'Reproduction recommendation: fix batch composition and check actual per-sample SNR. Record how changing batch size affects the noise scale.', zh: 复现建议：固定 batch 组成并检查逐样本实际 SNR；改变 batch size 时记录其对噪声尺度的影响。}
  - title: {en: 'Separate training and unseen domains, then release', zh: 划分训练域与未见域并发布}
    detail: {en: 'D1–D16 are used for pretraining and D17–D19 for unseen-configuration testing. The data card lists 9,000/1,000/2,000 train/validation/test samples per configuration. The official repository links training data and publishes test data and model-use code.', zh: 'D1–D16 用于预训练，D17–D19 用于未见配置测试；数据卡给出每组 9,000/1,000/2,000 的 train/validation/test 数量。官方仓库链接训练数据入口，并公开测试数据和模型使用代码。'}
    inputs:
    - {en: CSI samples from D1–D19, zh: D1–D19 的 CSI 样本}
    outputs:
    - {en: Training/validation/test corpora organized by configuration, zh: 按配置组织的训练/验证/测试语料}
    - {en: Public test data and model assets, zh: 公开测试数据与模型资产}
    controls:
    - {en: 'Author protocol: within-domain sample splits and out-of-domain evaluation on D17–D19 are distinct levels.', zh: 作者协议：域内样本划分和 D17–D19 的域外评测是两个层次。}
    checks:
    - {en: 'Reproduction recommendation: report both sample splits and whether configurations appeared in pretraining. Reusing test data does not mean obtaining the complete training corpus.', zh: 复现建议：同时报告样本划分与配置是否在预训练中出现；复用测试数据不等于获得完整训练语料。}
  scope: {en: 'QuaDRiGa corpus construction in the paper, plus the official public test loader and mask/model implementation.', zh: 论文中的 QuaDRiGa 语料构建，及官方公开测试加载器与 mask/model 实现。}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: '• QuaDRiGa-derived complex CSI

      • Test MAT files

      • Public models and code', zh: '• QuaDRiGa 派生复 CSI

      • 测试 MAT 文件

      • 公开模型与代码'}
- label: {en: Derived outputs, zh: 派生输出}
  text: {en: '• Real/imaginary tensors, tokens, and task masks

      • Noisy inputs and clean reconstruction targets

      • Per-task NMSE', zh: '• 实虚张量、token 与 task masks

      • 带噪输入及干净重建目标

      • 各任务 NMSE'}
- label: {en: Reproduction notes, zh: 复现说明}
  text: {en: '• The current loader does not establish how upstream MAT data were normalized.

      • Original MAT files were not read. Actual shapes, dtypes, anomalies, and availability of all training files still require a file-level audit.', zh: '• 当前加载器不证明上游 MAT 的归一化方法。

      • 没有读取原始 MAT；具体 shape、dtype、异常值和全部训练文件可得性仍需文件级审计。'}
provenance:
- {en: '3GPP scenario types, carrier frequencies, speeds, and UPA configurations', zh: 3GPP 场景类型与载频、速度、UPA 配置}
- {en: QuaDRiGa statistical-geometric channel generation, zh: QuaDRiGa 统计几何信道生成}
- {en: Random initial positions and within-sample straight-line trajectories, zh: 随机初始位置与样本内直线轨迹}
- {en: Generate MISO-OFDM CSI using temporal/frequency sampling, zh: 按时频采样生成 MISO-OFDM CSI}
- {en: D1–D16 pretraining; D17–D19 generalization testing, zh: D1–D16 预训练；D17–D19 泛化测试}
technical_notes:
- {en: 'Official design: element spacing is half a wavelength at the center frequency; the UE has a single antenna.', zh: 官方设计：阵元间隔为中心频率半波长，UE 为单天线。}
- {en: 'Official design: each sample''s speed is drawn from the configured range and the trajectory is straight. The realism of the time axis is constrained by generator settings.', zh: 官方设计：各样本速度从配置区间采样、轨迹为直线；时间轴真实性受生成器设置限定。}
- {en: 'Inference: when cross-frequency subsets also change scenario, speed, or array configuration, performance changes cannot be attributed solely to frequency.', zh: 推断：跨频子集同时改变场景、速度或天线配置时，性能变化不能只归因于频率。}
limitations:
- {en: 'D17 at 3.5 GHz and D19 at 28 GHz are not colocated, synchronized pairs and cannot directly form Sub-6→mmWave supervised samples.', zh: D17 的 3.5 GHz 与 D19 的 28 GHz 不是同址同步配对，不能直接构成 Sub-6→mmWave 监督样本。}
- {en: Frequency-domain extrapolation usually predicts subcarriers near the same carrier frequency; it differs from a 3.5→28 GHz cross-band mapping., zh: 频域外推通常是同一载频附近子载波外推，与 3.5→28 GHz 跨频段映射不同。}
- {en: Group by independent channel realization/trajectory before windowing to prevent leakage between overlapping windows., zh: 窗口切分必须先按独立信道实现/轨迹分组，避免重叠窗泄漏。}
history:
- {en: '2024-12-12: WiFo preprint released', zh: 2024-12-12：WiFo 预印本发布}
- {en: '2025-03-19: Paper v2', zh: 2025-03-19：论文 v2}
- {en: '2025: Published in Science China Information Sciences 68:162302', zh: '2025：发表于 Science China Information Sciences 68:162302'}
- {en: '2025-11-28: Official repository announces public pretraining data', zh: 2025-11-28：官方仓库宣布预训练数据开放}
usage:
- {en: 'Select a D number first; fix carrier frequency, subcarrier spacing, T, and UPA from paper Table 1.', zh: 先选 D 编号，从论文 Table 1 固定载频、子载波间隔、T 和 UPA。}
- {en: Obtain test or pretraining data through the official repository. Inspect actual splits in the current files; an HF card title is not proof that all assets are available., zh: 按官方仓库取得测试或预训练数据；检查当前文件实际 split，避免将 HF 卡标题当作全量资产证明。}
- {en: 'Preserve complex values and antenna, time, and frequency axes. Fit normalization on the training set and blank out prediction targets.', zh: 保留复数、天线、时间、频率轴；训练集拟合归一化，预测目标置空。}
- {en: Use persistence and linear extrapolation as baselines and report NMSE by horizon. Calculate beam gain if the data are used for communication decisions. Not run locally., zh: 以 persistence 和线性外推作基线，报告按 horizon 分层 NMSE；若用于通信决策再算波束增益。未本机运行。}
field_notes:
- label: {en: Cross-frequency pairing, zh: 跨频配对}
  text: {en: 'Independent configuration subsets at multiple frequencies, not verified dual-band pairs for the same UE/time.', zh: 多个频率的独立配置子集，不是已确认的同一 UE/时刻双频配对。}
- label: {en: Time, zh: 时间}
  text: {en: Each sample has a time axis; different samples cannot be concatenated into a continuous trajectory., zh: 样本内具有时间轴；不同样本间不可拼接成连续轨迹。}
- label: {en: Beam labels, zh: 波束标签}
  text: {en: Requires explicit UPA geometry and a codebook before derivation from CSI., zh: 需要明确 UPA 几何与码本后由 CSI 计算。}
- label: {en: Position, zh: 位置}
  text: {en: The official DataLoader reads only the X_val complex-channel array from X_test.mat and returns channel samples; this interface has no coordinate labels. Random initial positions used during generation do not establish that positions are released with the evaluation arrays., zh: 官方 DataLoader 只读取 X_test.mat 中的 X_val 复信道数组，返回信道样本；该接口没有坐标标签。生成时使用随机初始位置，不等于位置随评估数组发布。}
- label: {en: Multi-BS, zh: 多基站}
  text: {en: The public loading interface has no BS ID or set of links from one UE to multiple BSs. D1–D19 represent independent system configurations., zh: 公开加载接口没有 BS ID 或同一 UE 到多个 BS 的链路集合；D1–D19 表示独立系统配置。}
- label: {en: Multi-user, zh: 多用户}
  text: {en: 'Methodological derivation: within one D configuration, independent MISO channel samples can represent users, using a shared array, frequency grid, and amplitude convention to calculate multiuser interference. User grouping, power, and noise must be defined separately. The official interface has no native synchronized user groups and does not guarantee shared-scatterer correlation.', zh: 方法推导：可在同一 D 配置内把独立 MISO 信道样本作为用户，使用共同阵列、频率网格和幅度约定计算多用户干扰。用户分组、功率与噪声须另定义；官方接口没有原生同步用户组，也不保证共享散射体相关性。}
tools: [awesome-channel-foundation-models]
overview: {en: 'The WiFo pretraining channel datasets are 19 simulated MISO-OFDM CSI sets, D1 to D19, generated with the QuaDRiGa channel generator for 3GPP scenarios. The PKU-PCNI group published them with the WiFo paper (B. Liu et al., arXiv:2412.08908), which appeared in SCIENCE CHINA Information Sciences in June 2025 and uses the sets to pretrain a channel-prediction foundation model. Each dataset contains 12,000 samples, split into 9,000 for training, 1,000 for validation and 2,000 for inference. Table 1 of the paper gives, for each dataset, the carrier frequency (1.5, 2.5, 3.5, 4.9, 5.9, 6.7 or 28 GHz), K, T, the UPA size, the scenario (UMi, UMa, RMa or indoor, LoS or NLoS) and the speed range, which runs from 0-10 to 120-300 km/h. D1 to D16 are used for pretraining and D17 to D19 for testing on unseen configurations. The Hugging Face test repository holds X_test.mat files for dataset/D1 through dataset/D18; no dataset/D19 folder was found when checked, and the pretraining package
    on a PKU cloud drive was not inspected. The official DataLoader reads the complex X_val array, splits it into real and imaginary channels and applies no normalisation. The public loading interface returns channel samples without coordinate labels, and the D numbers are independent configurations rather than paired measurements of the same UE at several frequencies.', zh: 'WiFo 预训练信道数据集是 19 组仿真 MISO-OFDM CSI 数据，编号 D1 至 D19，由 QuaDRiGa 信道生成器按 3GPP 场景生成。PKU-PCNI 团队随 WiFo 论文（B. Liu 等，arXiv:2412.08908）发布这些数据；该论文 2025 年 6 月发表于 SCIENCE CHINA Information Sciences，用这些数据对信道预测基础模型进行预训练。每组数据包含 12,000 个样本，划分为 9,000 个训练样本、1,000 个验证样本和 2,000 个推理样本。论文 Table 1 逐组给出载频（1.5、2.5、3.5、4.9、5.9、6.7 或 28 GHz）、K、T、UPA 尺寸、场景（UMi、UMa、RMa 或室内，LoS 或 NLoS）以及速度范围（0–10 至 120–300 km/h）。D1 至 D16 用于预训练，D17 至 D19 用于未见配置的测试。Hugging Face 测试仓库中包含 dataset/D1 至 dataset/D18 的 X_test.mat 文件，检查时未发现 dataset/D19 文件夹；PKU 云盘上的预训练数据包内容未经检查。官方 DataLoader 读取复数 X_val 数组，拆分为实部与虚部两个通道，不做归一化。公开加载接口只返回信道样本，不含坐标标签；各 D 编号为相互独立的配置，而非同一 UE 在多个频率下的配对测量。'}
signal_details:
- signal: csi
  text: {en: 'MISO-OFDM channels: the base station uses a UPA, the UE has one antenna, and adjacent antenna spacing is half a wavelength at the centre frequency. Each sample is a complex spatial-temporal-frequency array whose size is set by the configuration in Table 1; for example, D1 has a 1x4 UPA, K = 128 and T = 24. The complex array is stored under the key X_val in each X_test.mat. Within each sample, the UE starts at a random position and moves on a straight line at a speed drawn uniformly from the scenario''s range.', zh: MISO-OFDM 信道：基站采用 UPA，UE 为单天线，相邻天线间距为中心频率处的半波长。每个样本是复数的空-时-频数组，尺寸由 Table 1 中的配置决定；例如 D1 的 UPA 为 1×4，K = 128，T = 24。复数数组保存在各 X_test.mat 的 X_val 键下。每个样本内，UE 从随机初始位置出发，以在场景速度范围内均匀抽取的速度做直线运动。}
