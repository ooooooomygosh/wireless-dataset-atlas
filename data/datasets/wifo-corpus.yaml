signals: [csi]
bands_ghz: [1.5, 2.5, 3.5, 4.9, 5.9, 6.7, 28]
environment: [indoor, outdoor-urban, rural]
mobility: user speed 0-300 km/h, depending on dataset
standard: 5G NR
