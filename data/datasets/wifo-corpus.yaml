used_in: ['doi:10.1109/twc.2026.3681311', 'doi:10.1109/lwc.2026.3664439', 'doi:10.1109/tccn.2026.3717927']
citing: ['doi:10.1109/tmlcn.2025.3585845', 'doi:10.1109/jsac.2025.3643823', 'doi:10.1109/mcom.001.2400761']
summary: {en: 'Simulated MISO-OFDM CSI generated with the QuaDRiGa channel generator for 3GPP scenarios (UMi, UMa, RMa and indoor) at seven 5G NR bands from 1.5 to 28 GHz, with user speeds up to 300 km/h. The 19 datasets (D1 to D19) each contain 12,000 samples.', zh: '由 QuaDRiGa 信道生成器按 3GPP 场景（UMi、UMa、RMa 与室内）生成的仿真 MISO-OFDM CSI，覆盖 1.5 至 28 GHz 的七个 5G NR 频段，用户速度最高 300 km/h。19 个数据集（D1 至 D19）各含 12,000 个样本。'}
sources: ['https://huggingface.co/datasets/pku-pcni-lab/RF-only_channel_dataset_for_WiFo', 'https://github.com/PKU-PCNI/WiFo', 'https://arxiv.org/abs/2412.08908', 'https://arxiv.org/html/2412.08908', 'https://huggingface.co/api/datasets/pku-pcni-lab/RF-only_channel_dataset_for_WiFo', 'https://api.github.com/repos/PKU-PCNI/WiFo', 'https://raw.githubusercontent.com/PKU-PCNI/WiFo/main/src/DataLoader.py', 'https://raw.githubusercontent.com/PKU-PCNI/WiFo/main/src/mask_strategy.py', 'https://raw.githubusercontent.com/PKU-PCNI/WiFo/main/src/model.py', 'https://raw.githubusercontent.com/PKU-PCNI/WiFo/main/src/train.py', 'https://raw.githubusercontent.com/PKU-PCNI/WiFo/main/src/main.py', 'https://arxiv.org/html/2412.08908v2', 'https://huggingface.co/datasets/pku-pcni-lab/RF-only_channel_dataset_for_WiFo/commits/main', 'https://github.com/PKU-PCNI/WiFo/releases', 'https://github.com/PKU-PCNI/WiFo/commits/main', 'https://raw.githubusercontent.com/PKU-PCNI/WiFo/main/README.md']
checked: '2026-11-06'
pipeline:
  summary: {en: '19 scenario configurations generate space-time-frequency CSI with QuaDRiGa. Real and imaginary parts enter one masked-reconstruction interface, and different masks define random completion, temporal extrapolation and frequency extrapolation.', zh: 19 组场景配置用 QuaDRiGa 生成时空频 CSI。实部与虚部进入统一的掩码重建接口，不同掩码分别对应随机补全、时间外推与频率外推。}
  scope: {en: 'QuaDRiGa corpus construction in the paper, plus the official public test loader and mask/model implementation.', zh: 论文中的 QuaDRiGa 语料构建，及官方公开测试加载器与 mask/model 实现。}
  stages:
  - title: {en: Define scenarios and motion, zh: 定义场景与移动条件}
    detail: {en: 'Each of the 19 configurations fixes the carrier frequency, subcarrier count and spacing, number of time samples, UPA size, 3GPP scenario and speed range (Table 1). Each sample starts the UE at a random position and moves it on a straight line at a speed drawn uniformly from the range.', zh: 19 组配置各自固定载频、子载波数与间隔、时间采样数、UPA 尺寸、3GPP 场景与速度范围（Table 1）。每个样本中 UE 从随机位置出发，以该范围内均匀抽取的速度做直线运动。}
    controls:
    - {en: The BS UPA uses half-wavelength spacing at the centre frequency; the UE has a single antenna., zh: 基站 UPA 采用中心频率处的半波长间距；UE 为单天线。}
  - title: {en: Generate MISO-OFDM CSI with QuaDRiGa, zh: 用 QuaDRiGa 生成 MISO-OFDM CSI}
    detail: {en: 'QuaDRiGa generates complex space-time-frequency CSI for each configuration, organized as MISO-OFDM samples. Each configuration has 12,000 samples, split 9,000 / 1,000 / 2,000 into training, validation and inference sets.', zh: 'QuaDRiGa 为每组配置生成复数空-时-频 CSI，组织为 MISO-OFDM 样本。每组 12,000 个样本，按 9,000 / 1,000 / 2,000 划分为训练、验证与推理集。'}
  - title: {en: Store as MAT and load real/imaginary channels, zh: 保存为 MAT 并加载实虚通道}
    detail: {en: 'The public DataLoader reads the X_val array from each X_test.mat, takes its complex values and stacks the real and imaginary parts as two channels, returning float tensors. It applies no normalization.', zh: 公开 DataLoader 从各数据集的 X_test.mat 读取 X_val 数组，将复数值的实部与虚部堆叠为两个通道并返回 float 张量，不做归一化。}
    checks:
    - {en: The loader itself does not show how the MAT files were normalized before release., zh: 加载器本身未说明 MAT 文件在发布前如何归一化。}
  - title: {en: Build masked-reconstruction tasks, zh: 构造掩码重建任务}
    detail: {en: 'Three mask strategies act on the token grid. random removes tokens chosen at random (mask ratio 0.85 in pretraining). temporal (named causal_masking in the code) keeps the first (1 - r) T time indices and masks the rest (ratio 0.5). fre keeps the first (1 - r) W indices along the last axis, which the code treats as frequency (ratio 0.5). Masked positions carry mask value 1.', zh: 三种掩码策略作用于 token 网格。random 随机移除 token（预训练掩码比例 0.85）；temporal（代码中为 causal_masking）保留前 (1 - r) T 个时间索引，遮挡其余部分（比例 0.5）；fre 保留最后一轴 W 上前 (1 - r) W 个索引，代码将该轴视为频率（比例 0.5）。被遮挡位置的 mask 值为 1。}
    controls:
    - {en: 'In the paper, time masking hides future time tokens, and frequency masking hides tokens along the frequency dimension.', zh: 论文中，时间掩码遮挡未来时刻的 token，频率掩码遮挡频率维上的 token。}
  - title: {en: Add noise and reconstruct the masked positions, zh: 加噪并重建被遮挡位置}
    detail: {en: 'model.forward sets the noise power from mean(imgs^2) over the whole input batch for a 20 dB SNR, adds Gaussian noise before encoding, and computes the loss on masked positions against the noisy input. The paper applies the 20 dB noise in both training and inference.', zh: model.forward 以整个输入 batch 的 mean(imgs^2) 计算对应 20 dB 信噪比的噪声功率，在编码前加入高斯噪声，并以加噪后的输入作为被遮挡位置的重建目标。论文在训练与推理中都加入 20 dB 噪声。}
    controls:
    - {en: 'Because the noise power is computed over the whole batch, the batch composition sets the per-sample noise scale.', zh: 噪声功率基于整个 batch 计算，因此 batch 的组成决定每个样本的噪声尺度。}
  - title: {en: Split domains and evaluate NMSE, zh: 划分训练域与未见域并评测 NMSE}
    detail: {en: 'D1 to D16 are used for pretraining and D17 to D19 for zero-shot testing. train.py reports NMSE per dataset and per mask strategy. The GitHub README links the pretraining data on a PKU disk, and the Hugging Face repository holds the D1 to D18 test files.', zh: D1 至 D16 用于预训练，D17 至 D19 用于零样本测试。train.py 按数据集与掩码策略报告 NMSE。GitHub README 将预训练数据链接到 PKU 网盘，Hugging Face 仓库则包含 D1 至 D18 的测试文件。}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: QuaDRiGa-derived complex CSI; test MAT files; public models and code., zh: QuaDRiGa 派生的复数 CSI；测试用 MAT 文件；公开的模型与代码。}
- label: {en: Derived outputs, zh: 派生输出}
  text: {en: 'Real/imaginary tensors, tokens and task masks; noisy inputs and noisy reconstruction targets; NMSE per dataset and mask strategy.', zh: 实部/虚部张量、token 与任务掩码；带噪输入及带噪重建目标；按数据集与掩码策略统计的 NMSE。}
- label: {en: Reproduction notes, zh: 复现说明}
  text: {en: The loader does not show how the upstream MAT data were normalized., zh: 加载器本身未说明上游 MAT 数据的归一化方法。}
provenance:
- {en: '3GPP scenario types, carrier frequencies, speeds, and UPA configurations', zh: 3GPP 场景类型与载频、速度、UPA 配置}
- {en: QuaDRiGa statistical-geometric channel generation, zh: QuaDRiGa 统计几何信道生成}
- {en: Random initial positions and within-sample straight-line trajectories, zh: 随机初始位置与样本内直线轨迹}
- {en: Generate MISO-OFDM CSI using temporal/frequency sampling, zh: 按时频采样生成 MISO-OFDM CSI}
- {en: D1–D16 pretraining; D17–D19 generalization testing, zh: D1–D16 预训练；D17–D19 泛化测试}
technical_notes:
- {en: 'Official design: adjacent element spacing is half a wavelength at the centre frequency, and the UE has a single antenna.', zh: 官方设计：相邻阵元间距为中心频率处的半波长，UE 为单天线。}
- {en: 'Official design: each sample''s speed is drawn uniformly from the configured range, and its trajectory is a straight line.', zh: 官方设计：每个样本的速度在配置范围内均匀抽取，轨迹为直线。}
limitations:
- {en: 'D17 (3.5 GHz) and D19 (28 GHz) are independent simulated configurations with separate random initial positions and trajectories, so they do not form paired samples.', zh: D17（3.5 GHz）与 D19（28 GHz）是相互独立的仿真配置，各自具有随机初始位置与轨迹，因此不构成配对样本。}
- {en: 'Frequency-domain masking reconstructs tokens along the frequency axis within one configuration, which has one carrier frequency; it does not map between carrier frequencies.', zh: 频域掩码在单个配置内沿频率轴重建 token，该配置只有一个载频；它不在不同载频之间做映射。}
history:
- {en: '2024-12-12: WiFo preprint released', zh: 2024-12-12：WiFo 预印本发布}
- {en: '2025-03-19: Paper v2', zh: 2025-03-19：论文 v2}
- {en: '2025: Published in Science China Information Sciences 68:162302', zh: '2025：发表于 Science China Information Sciences 68:162302'}
- {en: '2025-11-28: Official repository announces public pretraining data', zh: 2025-11-28：官方仓库宣布预训练数据开放}
usage:
- {en: 'Select a D number first and take the carrier frequency, subcarrier spacing, T and UPA size from Table 1 of the paper.', zh: 先选定 D 编号，再从论文 Table 1 取得载频、子载波间隔、T 与 UPA 尺寸。}
- {en: The Hugging Face repository holds X_test.mat for D1 to D18; the GitHub README links the pretraining data on a PKU disk., zh: Hugging Face 仓库包含 D1 至 D18 的 X_test.mat；GitHub README 将预训练数据链接到 PKU 网盘。}
- {en: The DataLoader applies no normalization; any scaling is applied outside it., zh: DataLoader 不做归一化；任何缩放都在其外部完成。}
- {en: 'The README evaluation commands run the temporal and fre masks on D1 to D16, and the temporal mask on D17 for zero-shot evaluation.', zh: README 中的评测命令在 D1 至 D16 上运行 temporal 与 fre 掩码，并在 D17 上以 temporal 掩码进行零样本评测。}
field_notes:
- label: {en: Cross-frequency pairing, zh: 跨频配对}
  text: {en: Independent configuration subsets at several frequencies; they are not dual-band pairs for the same UE and time., zh: 多个频率上相互独立的配置子集，不是同一 UE 与同一时刻的双频配对。}
- label: {en: Time, zh: 时间}
  text: {en: 'Each sample has its own time axis, starting from a random UE position on its own straight trajectory, so samples cannot be concatenated into one continuous trajectory.', zh: 每个样本拥有自己的时间轴，从随机的 UE 位置出发，沿自身的直线轨迹运动，因此样本之间不能拼接成连续轨迹。}
- label: {en: Position, zh: 位置}
  text: {en: The DataLoader returns channel samples only and reads no coordinate labels from X_test.mat., zh: DataLoader 只返回信道样本，不从 X_test.mat 读取坐标标签。}
- label: {en: Multi-BS, zh: 多基站}
  text: {en: The public loader has no BS ID and no set of links from one UE to several BSs; D1 to D19 are independent system configurations., zh: 公开加载接口没有基站 ID，也没有同一 UE 到多个基站的链路集合；D1 至 D19 为相互独立的系统配置。}
tools: [awesome-channel-foundation-models]
overview: {en: 'The WiFo pretraining channel datasets are 19 simulated MISO-OFDM CSI sets, D1 to D19, generated with the QuaDRiGa channel generator for 3GPP scenarios. The PKU-PCNI group released them with the WiFo paper (B. Liu et al., arXiv:2412.08908), published in SCIENCE CHINA Information Sciences in June 2025, where they pretrain a channel-prediction foundation model. Each dataset contains 12,000 samples, split into 9,000 for training, 1,000 for validation and 2,000 for inference. Table 1 of the paper lists, for each dataset, the carrier frequency (1.5, 2.5, 3.5, 4.9, 5.9, 6.7 or 28 GHz), K, T, the UPA size, the scenario (UMi, UMa, RMa or indoor, LoS or NLoS) and the speed range, which runs from 0-10 to 120-300 km/h. D1 to D16 are used for pretraining, and D17 to D19 are held out for zero-shot testing because their carrier frequencies (3.5, 6.7 and 28 GHz) do not appear among D1 to D16. The Hugging Face test repository holds X_test.mat files for D1 through D18 and no D19 file; the
    official DataLoader reads the complex X_val array, splits it into real and imaginary channels, and applies no normalization. The D numbers are independent configurations, not paired measurements of the same UE at several frequencies.', zh: 'WiFo 预训练信道数据集包含 19 组仿真 MISO-OFDM CSI 数据，编号 D1 至 D19，由 QuaDRiGa 信道生成器按 3GPP 场景生成。PKU-PCNI 团队随 WiFo 论文（B. Liu 等，arXiv:2412.08908）发布这些数据；该论文于 2025 年 6 月发表于 SCIENCE CHINA Information Sciences，用于预训练信道预测基础模型。每组数据包含 12,000 个样本，划分为 9,000 个训练样本、1,000 个验证样本和 2,000 个推理样本。论文 Table 1 逐组给出载频（1.5、2.5、3.5、4.9、5.9、6.7 或 28 GHz）、K、T、UPA 尺寸、场景（UMi、UMa、RMa 或室内，LoS 或 NLoS）以及速度范围（0–10 至 120–300 km/h）。D1 至 D16 用于预训练；D17 至 D19 作为零样本测试集保留，因为其载频（3.5、6.7 和 28 GHz）未出现在 D1 至 D16 中。Hugging Face 测试仓库包含 D1 至 D18 的 X_test.mat 文件，没有 D19 文件。官方 DataLoader 读取复数 X_val 数组，拆分为实部与虚部两个通道，不做归一化。各 D 编号为相互独立的配置，而非同一 UE 在多个频率下的配对测量。'}
signal_details:
- signal: csi
  text: {en: 'MISO-OFDM channels: the base station uses a UPA, the UE has one antenna, and adjacent antenna spacing is half a wavelength at the centre frequency. Each sample is a complex spatial-temporal-frequency array whose size is set by the configuration in Table 1; for example, D1 has a 1x4 UPA, K = 128 and T = 24. The complex array is stored under the key X_val in each X_test.mat. Within each sample, the UE starts at a random position and moves on a straight line at a speed drawn uniformly from the scenario''s range.', zh: MISO-OFDM 信道：基站采用 UPA，UE 为单天线，相邻天线间距为中心频率处的半波长。每个样本是复数的空-时-频数组，尺寸由 Table 1 中的配置决定；例如 D1 的 UPA 为 1×4，K = 128，T = 24。复数数组保存在各 X_test.mat 的 X_val 键下。每个样本内，UE 从随机初始位置出发，以在场景速度范围内均匀抽取的速度做直线运动。}
format: MAT
antennas: {rx: 1, array: upa}
capabilities:
- key: csi
  status: provided
  note: {en: Complex MISO-OFDM CSI in the X_val arrays of the X_test.mat files for D1 to D18 on Hugging Face; the loader applies no normalization., zh: Hugging Face 上 D1 至 D18 的 X_test.mat 文件中 X_val 数组含复数 MISO-OFDM CSI；加载器不做归一化。}
- key: cir
  status: derivable
  note: {en: Delay-domain CIR by inverse DFT over the released subcarriers; not stored., zh: 对已发布子载波做逆 DFT 可得时延域 CIR；未存储。}
- key: paths
  status: simulate
  note: {en: 'Per-path delays, angles and Doppler shifts are obtainable only by rerunning QuaDRiGa; not released.', zh: 逐径时延、角度与多普勒频移仅能通过重新运行 QuaDRiGa 获得；未发布。}
- {key: interaction, status: unknown}
- key: power
  status: derivable
  note: {en: Relative channel power is computable from CSI magnitudes; absolute path loss is unknown because the MAT normalization is undocumented., zh: 相对信道功率可由 CSI 幅值计算；由于 MAT 归一化未说明，绝对路径损耗未知。}
- key: iq
  status: none
  note: {en: Channel matrices only; no time-domain I/Q waveforms., zh: 仅有信道矩阵，无时域 I/Q 波形。}
- key: beam_labels
  status: derivable
  note: {en: Computable from CSI with a chosen UPA codebook; the codebook is not released., zh: 可由 CSI 结合选定的 UPA 码本计算；码本未发布。}
- {key: position, status: unknown}
- key: geometry
  status: none
  note: {en: No scene or map files; the 3GPP scenario and UPA size are configuration parameters only., zh: 无场景或地图文件；3GPP 场景与 UPA 尺寸仅为配置参数。}
- key: materials
  status: none
  note: {en: No material parameters are released., zh: 未发布材料参数。}
- key: rgb
  status: none
  note: {en: RF-only channel dataset., zh: 纯射频信道数据集。}
- key: depth
  status: none
  note: {en: RF-only channel dataset., zh: 纯射频信道数据集。}
- key: lidar
  status: none
  note: {en: RF-only channel dataset., zh: 纯射频信道数据集。}
- key: radar
  status: none
  note: {en: RF-only channel dataset; no radar sensing data., zh: 纯射频信道数据集；无雷达感知数据。}
- key: imu
  status: none
  note: {en: RF-only channel dataset., zh: 纯射频信道数据集。}
- key: time_series
  status: provided
  note: {en: Each sample holds 16 or 24 snapshots at 0.5 or 1 ms intervals; separate samples cannot be joined into one trajectory., zh: 每个样本包含 16 或 24 个快照，间隔 0.5 或 1 ms；不同样本不能拼接为连续轨迹。}
- key: multiuser
  status: derivable
  note: {en: 'Independent single-user samples within one configuration can be combined; user grouping, power and noise are not released, and shared-scatterer correlation is not guaranteed.', zh: 同一配置内的独立单用户样本可组合为多用户集合；用户分组、功率与噪声未发布，且不保证共享散射体相关性。}
- key: multibs
  status: none
  note: {en: Each configuration is one BS UPA serving a single-antenna UE; the public interface has no BS IDs., zh: 每个配置为一个基站 UPA 服务单天线 UE；公开接口无基站 ID。}
- {key: crossfreq, status: unknown}
- key: near_field
  status: none
  note: {en: Plane-wave UPA steering-vector model; no spherical-wave near-field modelling., zh: 采用平面波 UPA 导向矢量模型，无球面波近场建模。}
- key: high_mobility
  status: provided
  note: {en: 'Table 1 gives user speeds of 30 to 100 km/h for D4, D7, D11, D16, D17 and D19, and 120 to 300 km/h for D2, D5, D10 and D13.', zh: 表 1 给出 D4、D7、D11、D16、D17、D19 的用户速度为 30 至 100 km/h，D2、D5、D10、D13 为 120 至 300 km/h。}
- {key: dynamic_blockage, status: unknown}
- {key: reflection, status: unknown}
- {key: diffraction, status: unknown}
- {key: scattering, status: unknown}
- {key: transmission, status: unknown}
- {key: polarization, status: unknown}
- key: em_field
  status: none
  note: {en: Outputs are complex CSI arrays; no E-field components or antenna patterns., zh: 输出为复数 CSI 数组；无电场分量或天线方向图。}
