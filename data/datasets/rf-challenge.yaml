  date: '2025-03-27'
  summary: {en: 'Expands the dataset description with recording bandwidths of 25 MHz and 61.44 MHz, frame counts per interference type, the SINR definition, the 2.4 GHz ISM recordings and the cable-based generation of the 5G signal.', zh: 扩充数据集描述，补充录制带宽（25 MHz 与 61.44 MHz）、各类干扰的帧数、SINR 定义、2.4 GHz ISM 频段录制，以及 5G 信号的线缆实验室生成方式。}
  url: https://arxiv.org/abs/2409.08839v2
