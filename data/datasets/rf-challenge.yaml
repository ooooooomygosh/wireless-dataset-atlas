summary: {en: 'Single-channel RF recordings of electromagnetic interference and digital communication signals, including a 5G signal, with recording bandwidths of 25 MHz and 61.44 MHz, used to form signal mixtures for interference rejection.', zh: 单通道射频录制数据，包含电磁干扰（EMI）和数字通信信号（含一个5G信号），录制带宽分别为25 MHz和61.44 MHz，用于构建干扰抑制的信号混合样本。}
