- {en: Synthetic MIMO multilink channels, zh: 合成 MIMO 多链路信道}
technical_notes:
- {en: 'Supported by the literature: §3 generates MIMO channels by superposing double-directional plane waves driven by measurement statistics; antenna responses are separate from propagation parameters.', zh: 文献支持：§3以测量统计驱动的双向角度平面波叠加生成MIMO信道；天线响应与传播参数分开。}
- {en: 'Supported by the literature: the basic model primarily uses azimuth angles; elevation can be added for indoor and outdoor-to-indoor scenarios.', zh: 文献支持：基本模型以方位角为主；室内及outdoor-to-indoor场景可加入俯仰角。}
- {en: 'Supported by the literature: §3.4 constructs time evolution using correlated channel segments and gradual transitions between old and new cluster powers; Markov cluster birth/death was an alternative lacking complete parameters at the time.', zh: 文献支持：§3.4用相关channel segments和新旧簇功率渐换建立时间演化；Markov簇birth/death是当时缺少完整参数的备选方法。}
- {en: 'Supported by the literature: §4.1 specifies 2–6 GHz and ≤100 MHz; DS, AS, and K-factor are scenario-parameterized, frequency dependence mainly enters pathloss, and FDD initial phases are independent.', zh: 文献支持：§4.1明确2–6 GHz与≤100 MHz；DS、AS、K-factor按场景参数化，频率依赖主要进入path loss，FDD初相位独立。}
- {en: 'Supported by the literature: §5.1 requires multi-BS/multi-MS links in the same layout to be generated together to preserve correlation; scatterer coordinates are generally unknown.', zh: 文献支持：§5.1要求同一布局的多BS/多MS链接一起生成，以保留相关性；一般散射点坐标未知。}
- {en: 'Confirmed: the current MathWorks support package provides winner2.wim and comm.WINNER2Channel; its 12 scenarios and toolbox dependencies are separately recorded from official documentation.', zh: 已确认：MathWorks当前支持包提供winner2.wim与comm.WINNER2Channel；其12种场景和工具箱依赖由官方文档单独登记。}
limitations:
- {en: The original report describes synthetic channels parameterized by measurements; availability of the underlying measurements requires checking Part II and individual measurement providers., zh: 原始报告描述测量参数化的合成信道；原始测量数据是否公开需另查Part II及各测量方。}
- {en: 'Verify WINNER II, WINNER+, and QuaDRiGa versions and implementations separately.', zh: WINNER II、WINNER+与QuaDRiGa的版本和实现分别核验。}
- {en: Retaining small-scale parameters for FDD is a model assumption; generalization across widely separated frequencies requires independent cross-frequency measurements or a validated multifrequency model., zh: FDD保留小尺度参数是模型假设；宽频跨域泛化需要独立跨频测量或经验证的多频模型。}
- {en: 'The Part I cover is inconsistent between V1.2 and 1.1; record the file title, update date, and source together when citing it.', zh: Part I封面存在V1.2/1.1不一致；引用时同时记录文件题名、更新日期和来源。}
