- {en: '2007-09-30: D1.1.2 delivered; the PDF reviewed here records an update on 2008-02-04 and V1.2 in its headers.', zh: 2007-09-30：D1.1.2交付；本轮PDF记录2008-02-04更新，页眉为V1.2。}
