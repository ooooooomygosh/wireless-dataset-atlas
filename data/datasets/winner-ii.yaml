usage:
- {en: 'Pin the D1.1.2 report and implementation version; for MathWorks, install the support package for the specified release and check toolbox dependencies first.', zh: 固定D1.1.2报告和所用实现版本；MathWorks路线先安装指定release支持包并检查工具箱依赖。}
- {en: 'Choose a scenario, carrier frequency, bandwidth, and arrays within 2–6 GHz; first review LSP correlation distances and scenario tables.', zh: 选择2–6 GHz范围内的场景、载频、带宽与阵列，先查看LSP相关距离及场景表。}
- {en: 'Build the full BS/MS layout and link matrix, generating correlated links together; use continuous segments and phase continuity for temporal prediction.', zh: 建立完整BS/MS布局和链接矩阵，一起生成相关links；时间预测使用连续segments及相位续接。}
- {en: 'For FDD experiments, follow §5.4.3: preserve small-scale parameters, reverse link direction, change carrier frequency, and rerandomize initial phases; disclose this shared-parameter setup.', zh: FDD实验按§5.4.3保存小尺度参数、交换链路方向、改变载频并重新随机初相位，同时披露该共享参数设定。}
- {en: 'Record seeds, layouts, and group-based splits; evaluate communication utility with oracle, persistence, and simple prediction baselines.', zh: 记录种子、布局与分组划分；用oracle、persistence和简单预测基线评估通信utility。}
overview: {en: 'WINNER II Channel Models is a spatial channel model from the WINNER II project (IST-4-027756), specified in deliverable D1.1.2 V1.2 dated September 2007. It generates spatially defined multiuser MIMO channel coefficients with the clustered delay line method, for any number of base stations and mobile stations placed by a layout of geometry and locations. The model covers 12 indoor and outdoor scenarios (A1, A2, B1 to B4, C1 to C4, D1 and D2a) with line-of-sight and non-line-of-sight propagation, RF frequencies up to 6 GHz and signal bandwidths up to 100 MHz. The resource is a generator rather than a fixed dataset: MathWorks implements it as the WINNER II Channel Model add-on for Communications Toolbox, and the coefficients are produced at run time from a model configuration and a layout. The implementation requires MATLAB, Communications Toolbox, DSP System Toolbox and Signal Processing Toolbox, and its use is governed by MathWorks licensing.', zh: WINNER II Channel Models
    是 WINNER II 项目（IST-4-027756）提出的空间信道模型，规范载于 2007 年 9 月发布的交付件 D1.1.2 V1.2。模型采用聚类延迟线（clustered delay line）方法，为任意数量的基站和移动台生成空间定义的多用户 MIMO 信道系数，各节点的几何与位置由布局给出。模型涵盖 12 种室内与室外场景（A1、A2、B1 至 B4、C1 至 C4、D1 和 D2a），支持视距（LOS）与非视距（NLOS）传播，射频频率最高 6 GHz，信号带宽最高 100 MHz。该资源是信道生成器而非固定数据集：MathWorks 将其实现为 Communications Toolbox 的 WINNER II Channel Model 附加组件，信道系数在运行时依据模型配置和布局生成。运行该实现需要 MATLAB、Communications Toolbox、DSP System Toolbox 和 Signal Processing Toolbox，其使用受 MathWorks 许可条款约束。}
signal_details:
- signal: cir
  text: {en: 'comm.WINNER2Channel filters a real or complex input signal through the WINNER II fading channel of each link, in a streaming fashion. ModelConfig sets NumTimeSamples (default 100) and CenterFrequency (default 5.25e9 Hz). The sample rate of each link is V_MS / (c / F_center / 2 / N_SD), where V_MS is the mobile speed, c the speed of light, F_center the carrier frequency and N_SD the sample density.', zh: comm.WINNER2Channel 以流式方式，让实数或复数输入信号经过各链路的 WINNER II 衰落信道。ModelConfig 设置 NumTimeSamples（默认 100）和 CenterFrequency（默认 5.25e9 Hz）。每条链路的采样率为 V_MS / (c / F_center / 2 / N_SD)，其中 V_MS 为移动台速度，c 为光速，F_center 为载频，N_SD 为采样密度。}
- signal: paths
  text: {en: 'The pathgains output is a cell array with one complex array per link, of size N_R × N_T × N_P × N_S, where N_P is the number of paths of that link and N_S is the number of time samples. The number of paths and the link layout are specified by LayoutConfig. FixedPdpUsed and FixedAnglesUsed select predefined path delays, path powers, angles of departure and angles of arrival for specific scenarios.', zh: pathgains 输出为元胞数组，每条链路对应一个复数数组，尺寸为 N_R × N_T × N_P × N_S，其中 N_P 为该链路的路径数，N_S 为时间样本数。路径数和链路布局由 LayoutConfig 指定。FixedPdpUsed 与 FixedAnglesUsed 可为特定场景选用预定义的路径时延、路径功率、出发角（AoD）和到达角（AoA）。}
