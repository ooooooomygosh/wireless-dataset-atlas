summary: {en: 'A generator of spatially defined multiuser MIMO channel coefficients using the clustered delay line method, covering 12 indoor and outdoor scenarios with RF frequencies up to 6 GHz.', zh: 使用聚类延迟线方法生成空间定义多用户 MIMO 信道系数的生成器，涵盖 12 种室内与室外场景，射频频率最高 6 GHz。}
sources: ['https://www.mathworks.com/help/comm/ug/winner-ii-channel.html', 'https://www.mathworks.com/matlabcentral/fileexchange/59690-winner-ii-channel-model-for-communications-toolbox', 'https://api.crossref.org/works/10.1002/9780470748077.ch3']
checked: '2026-11-06'
pipeline:
  summary: {en: 'Generate large-scale parameters and double-directional rays from layouts and measurement statistics, then combine array responses to construct channels; configure time segmentation and FDD construction separately.', zh: 用布局与测量统计生成大尺度参数和双向角度射线，再结合阵列响应构造信道；时间分段和FDD构造需单列配置。}
  stages:
  - title: {en: 'Set layouts, scenarios, and antennas', zh: 设置布局、场景与天线}
    detail: {en: Define links and arrays within one layout; record model-document and software-support-package versions separately., zh: 在同一布局中确定链路及阵列；模型文档与软件支持包版本分别记录。}
    inputs:
    - {en: BS/MS positions and velocities, zh: BS/MS位置和速度}
    - {en: 'WINNER II scenarios, arrays, and frequency', zh: WINNER II场景、阵列和频率}
    outputs:
    - {en: Reproducible multilink layout, zh: 可复现的多链路布局}
    controls:
    - {en: 'Researcher specifies: carrier frequency within 2–6 GHz, bandwidth, scenario, arrays, and seed', zh: 研究者固定：2–6 GHz适用范围内的载频、带宽、场景、阵列与seed}
    checks:
    - {en: Check the selected scenario and elevation-angle support, zh: 核对所用场景及俯仰角支持}
    - {en: Use a shared layout for correlated multi-BS/MS generation, zh: 多BS/MS相关生成使用同一布局}
  - title: {en: Generate large-scale propagation states, zh: 生成大尺度传播状态}
    detail: {en: 'Determine propagation conditions, pathloss, shadow fading, delay/angular spreads, K-factor, and other statistics by scenario.', zh: 按场景决定传播条件、路径损耗、阴影衰落和时延/角扩展、K-factor等统计量。}
    inputs:
    - {en: Scenario parameter tables, zh: 场景参数表}
    - {en: Link layout, zh: 链路布局}
    outputs:
    - {en: Correlated large-scale parameters, zh: 带相关性的大尺度参数}
    controls:
    - {en: 'Researcher specifies: LOS/NLOS selection, statistical correlation, and whether losses are enabled', zh: 研究者固定：LOS/NLOS选择、统计相关与损耗是否启用}
    checks:
    - {en: Check sampled statistics against scenario parameter tables, zh: 检查抽样统计与场景参数表相符}
    - {en: Do not mix parameters from different scenarios into a single default model, zh: 不把不同场景参数混用为单一默认模型}
  - title: {en: Generate small-scale rays, zh: 生成小尺度射线}
    detail: {en: 'Generate delays, powers, arrival/departure angles, polarization, and initial phases. Coordinates of individual scatterers in a real scene are usually unavailable.', zh: 生成时延、功率、到达/出发角、极化与初相位。通常没有真实场景中每个散射点的坐标。}
    inputs:
    - {en: Large-scale parameters, zh: 大尺度参数}
    - {en: Cluster/ray generation rules, zh: 簇/射线生成规则}
    outputs:
    - {en: Statistical ray parameters, zh: 统计射线参数}
    controls:
    - {en: 'Researcher specifies: cluster/ray counts, random state, polarization, and angle conventions', zh: 研究者固定：簇/射线数、随机状态、极化和角度约定}
    checks:
    - {en: Check power normalization and delay ordering, zh: 检查归一化功率与时延排序}
    - {en: Do not treat statistical rays as RT paths in a CAD scene, zh: 不将统计射线当作CAD场景RT路径}
  - title: {en: Synthesize array and time-varying channels, zh: 合成阵列与时变信道}
    detail: {en: 'Superpose rays to obtain MIMO channels; time evolution can connect correlated segments with gradual cluster-power transitions, subject to the specific implementation''s capabilities.', zh: 叠加各射线得到MIMO信道；时间演化可通过相关segments和渐变簇功率连接，具体实现能力需核对。}
    inputs:
    - {en: Ray parameters, zh: 射线参数}
    - {en: Antenna field responses and mobility states, zh: 天线场响应、移动状态}
    outputs:
    - {en: Complex channel coefficients and delays, zh: 复信道系数与时延}
    - {en: Continuous time sequences when conditions permit, zh: 条件成立时的连续时间序列}
    controls:
    - {en: 'Researcher specifies: time sampling, segment length, and transition/merging implementation', zh: 研究者固定：时间采样、segment长度、切换/合并实现}
    checks:
    - {en: Check power and phase continuity between adjacent segments, zh: 检查相邻段功率与相位连续性}
    - {en: Do not claim real mobility simulation after merely redrawing independent drops, zh: 避免仅重抽随机drop后声明已模拟真实移动}
  - title: {en: Export implementation outputs and process task data, zh: 实现导出与任务加工}
    detail: {en: 'Use the selected implementation to generate arrays or filtered waveforms, then construct CSI, prediction, or link tests. Configure FDD separately using the specification''s shared-parameter and independent-initial-phase rules.', zh: 使用所选实现生成数组或滤波波形，再构造CSI、预测或链路测试。FDD按规范的共享参数与独立初相位规则另设。}
    inputs:
    - {en: Model specification or winner2.wim/comm.WINNER2Channel outputs, zh: 模型规范或winner2.wim/comm.WINNER2Channel输出}
    - {en: Researcher-defined frequency-domain/receiver settings, zh: 研究者的频域/接收机设置}
    outputs:
    - {en: Implementation-specific channels/waveforms, zh: 实现特定信道/波形}
    - {en: Researcher-defined labels and KPIs, zh: 研究者定义的标签与KPI}
    controls:
    - {en: 'Researcher specifies: MATLAB and dependency versions, FDD association method, normalization', zh: 研究者固定：MATLAB和依赖版本、FDD关联方式、归一化}
    checks:
    - {en: Identify which specification clauses the implementation covers, zh: 标注实现覆盖了哪些规范条款}
    - {en: FDD construction does not establish measured generalization across arbitrary frequency bands, zh: FDD构造不能直接声称跨任意频段的实测泛化}
  scope: {en: D1.1.2 V1.2 model workflow; the MathWorks support package is one separate implementation., zh: D1.1.2 V1.2模型流程；MathWorks支持包是其一种独立实现。}
