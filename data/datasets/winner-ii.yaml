summary: {en: 'A generator of spatially defined multiuser MIMO channel coefficients using the clustered delay line method, covering 12 indoor and outdoor scenarios with RF frequencies up to 6 GHz.', zh: 使用聚类延迟线方法生成空间定义多用户 MIMO 信道系数的生成器，涵盖 12 种室内与室外场景，射频频率最高 6 GHz。}
sources: ['https://www.mathworks.com/help/comm/ug/winner-ii-channel.html', 'https://www.mathworks.com/matlabcentral/fileexchange/59690-winner-ii-channel-model-for-communications-toolbox', 'https://api.crossref.org/works/10.1002/9780470748077.ch3', 'https://www.mathworks.com/help/comm/ref/comm.winner2channel-system-object.html', 'https://www.mathworks.com/help/comm/ref/winner2.wim.html', 'https://www.mathworks.com/help/comm/ref/winner2.layoutparset.html', 'https://www.mathworks.com/help/comm/ref/winner2.wimparset.html', 'https://web.archive.org/web/2012/http://www.ist-winner.org/WINNER2-Deliverables/D1.1.2v1.2.pdf', 'https://www.mathworks.com/help/comm/release-notes.html']
checked: '2026-11-06'
pipeline:
  summary: {en: 'Generate large-scale parameters and double-directional rays from layouts and measurement statistics, then combine array responses to construct channels; configure time segmentation and FDD construction separately.', zh: 用布局与测量统计生成大尺度参数和双向角度射线，再结合阵列响应构造信道；时间分段和FDD构造需单列配置。}
  scope: {en: D1.1.2 V1.2 model workflow; the MathWorks support package is one separate implementation., zh: D1.1.2 V1.2模型流程；MathWorks支持包是其一种独立实现。}
  stages:
  - title: {en: 'Set the layout, scenario and arrays', zh: 设置布局、场景与天线}
    detail: {en: 'Place the BSs and MSs, with their positions and velocities, in one layout, and choose the scenario, arrays and carrier frequency. Links that share a layout are generated with correlated large-scale parameters.', zh: 在同一布局中设置 BS 与 MS 的位置和速度，并选择场景、阵列与载频。同一布局中的链路以相关的大尺度参数生成。}
    inputs:
    - {en: BS/MS positions and velocities, zh: BS/MS位置和速度}
    - {en: 'WINNER II scenario, array and frequency choices', zh: WINNER II场景、阵列和频率选择}
    outputs:
    - {en: Layout configuration structure (LayoutConfig), zh: 布局配置结构（LayoutConfig）}
    controls:
    - {en: 'Carrier frequency 2-6 GHz, bandwidth up to 100 MHz, scenario, arrays and random seed are set by the user.', zh: 载频（2–6 GHz）、带宽（最高 100 MHz）、场景、阵列与随机种子由用户设置。}
    - {en: 'Scenario numbers map to A1 (1), A2 (2), B1 to B4 (3 to 6), C1 to C4 (10 to 13), D1 (14) and D2a (15).', zh: 场景编号映射为：A1（1）、A2（2）、B1 至 B4（3 至 6）、C1 至 C4（10 至 13）、D1（14）、D2a（15）。}
  - title: {en: Generate large-scale propagation parameters, zh: 生成大尺度传播参数}
    detail: {en: 'Scenario tables set the LOS/NLOS condition, path loss, shadow fading, delay and angular spreads, and K-factor. The specification treats delay spread, angle spreads and K-factor as scenario-dependent without significant frequency dependence (§4.1.2); frequency dependence enters through path loss.', zh: 场景表决定 LOS/NLOS 条件、路径损耗、阴影衰落、时延与角度扩展以及 K 因子。规范（§4.1.2）认为时延扩展、角度扩展与 K 因子只随场景变化，没有显著的频率依赖；频率依赖通过路径损耗体现。}
    inputs:
    - {en: Scenario parameter tables, zh: 场景参数表}
    - {en: Link layout, zh: 链路布局}
    outputs:
    - {en: Correlated large-scale parameters, zh: 相关的大尺度参数}
    controls:
    - {en: 'UseManualPropCondition, PathLossModelUsed and ShadowingModelUsed select the LOS/NLOS and loss settings.', zh: UseManualPropCondition、PathLossModelUsed 与 ShadowingModelUsed 决定 LOS/NLOS 与损耗设置。}
  - title: {en: Draw small-scale rays, zh: 生成小尺度射线}
    detail: {en: 'Rays are drawn as plane waves with delay, power, arrival and departure angles, and initial phase, and rays form clusters. In general the positions of scatterers are unknown (§3).', zh: 射线以平面波形式生成，具有时延、功率、到达角、出发角与初相位，多条射线构成一个簇。散射体位置通常未知（§3）。}
    controls:
    - {en: ModelConfig.PolarisedArrays (default yes) and ModelConfig.RandomSeed set polarization and the random stream., zh: ModelConfig.PolarisedArrays（默认 yes）与 ModelConfig.RandomSeed 分别设置极化与随机数流。}
  - title: {en: Synthesize MIMO channels and time evolution, zh: 合成 MIMO 信道与时间演化}
    detail: {en: Rays are superposed to form the MIMO channel. Time evolution links adjacent channel segments by replacing old clusters with new ones and ramping their power (§3.4); the Markov birth-death alternative was set aside because its parameters were not available., zh: 叠加各射线形成 MIMO 信道。时间演化通过用新段的簇替换旧段的簇并渐变其功率来连接相邻信道段（§3.4）；马尔可夫生灭替代方法因参数不可用而未采用。}
    outputs:
    - {en: Complex channel coefficients and path delays (winner2.wim), zh: 复信道系数与路径时延（winner2.wim）}
    controls:
    - {en: ModelConfig.NumTimeSamples (default 100) and UniformTimeSampling set the time sampling., zh: ModelConfig.NumTimeSamples（默认 100）与 UniformTimeSampling 设置时间采样。}
  - title: {en: Export channels and build FDD links, zh: 导出信道并构造 FDD 链路}
    detail: {en: 'winner2.wim returns channel coefficients and path delays for all links, and comm.WINNER2Channel filters input signals through the links in a streaming fashion. For FDD, §5.4.3 saves the small-scale parameters of one link, swaps the BS and MS positions to compute the reverse link, randomizes the initial phases and changes the carrier frequency.', zh: winner2.wim 为布局中的所有链路返回信道系数与路径时延，comm.WINNER2Channel 以流式方式让输入信号经过各链路滤波。FDD 时，§5.4.3 保存一条链路的小尺度参数，交换 BS 与 MS 位置以计算反向链路，重新随机初相位并改变载频。}
    inputs:
    - {en: Model configuration (ModelConfig) and layout (LayoutConfig), zh: 模型配置（ModelConfig）与布局（LayoutConfig）}
    outputs:
    - {en: 'Channel coefficients, path delays, path gains or filtered waveforms', zh: 信道系数、路径时延、路径增益或滤波后的波形}
    controls:
    - {en: 'MATLAB and toolbox versions, the FDD association and NormalizeChannelOutputs (default true) are set by the user.', zh: MATLAB 与工具箱版本、FDD 关联方式以及 NormalizeChannelOutputs（默认 true）由用户设置。}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: 'The specification provides the model and parameter tables; running the software provides complex channels, path delays and filtered waveforms.', zh: 规范提供模型与参数表；运行软件可得到复信道、路径时延和滤波后的波形。}
- label: {en: Compatibility, zh: 兼容性}
  text: {en: The MathWorks add-on page lists compatibility with MATLAB R2016b to R2026b and was updated on 23 September 2026., zh: MathWorks 附加组件页面列出兼容 MATLAB R2016b 至 R2026b，页面更新于 2026 年 9 月 23 日。}
provenance:
- {en: Measurement campaigns and statistics from the literature, zh: 测量活动与文献统计}
- {en: Scenario parameter tables, zh: 场景参数表}
- {en: Random delays/angles/powers/polarization, zh: 随机时延/角度/功率/极化}
- {en: Ray superposition and array responses, zh: 射线叠加与阵列响应}
- {en: Synthetic MIMO multilink channels, zh: 合成 MIMO 多链路信道}
technical_notes:
- {en: 'Section 3 describes a geometry-based stochastic model: rays (plane waves) with delay, power, AoA and AoD are summed, and antenna responses are kept separate from propagation parameters.', zh: 第 3 节描述几何随机模型：对带时延、功率、AoA 与 AoD 的射线（平面波）求和，天线响应与传播参数分开定义。}
- {en: 'Elevation angles are optional: the generator draws them only if elevation is supported, and the report lists elevation for indoor scenarios among the model''s features.', zh: 仰角是可选的：只有在支持仰角时生成器才会抽取仰角，报告将室内场景的仰角列为模型特性之一。}
- {en: 'Section 4.1 gives the path-loss models for 2-6 GHz and requires support for bandwidths up to 100 MHz; under FDD, the random phases of scatterer contributions are modelled as independent between uplink and downlink.', zh: 第 4.1 节给出 2–6 GHz 的路径损耗模型，并要求支持最高 100 MHz 带宽；FDD 时，上下行间散射体贡献的随机相位被建模为相互独立。}
- {en: 'Links in one layout are generated with correlated large-scale parameters, and scatterer coordinates are generally unknown (§3).', zh: 同一布局中的链路以相关的大尺度参数生成，散射体坐标通常未知（§3）。}
- {en: 'The MathWorks add-on provides winner2.wim and comm.WINNER2Channel; its scenario numbers map as 1 = A1, 2 = A2, 3 to 6 = B1 to B4, 10 to 13 = C1 to C4, 14 = D1 and 15 = D2a.', zh: MathWorks 附加组件提供 winner2.wim 与 comm.WINNER2Channel；其场景编号对应关系为 1 = A1、2 = A2、3 至 6 = B1 至 B4、10 至 13 = C1 至 C4、14 = D1、15 = D2a。}
limitations:
- {en: The report's disclaimer states that the models are based on a literature survey and on measurements made during the project., zh: 报告免责声明指出，模型基于文献综述以及项目期间进行的测量。}
- {en: Retaining small-scale parameters across FDD links is a modelling assumption in §5.4.3., zh: 在 FDD 链路之间保留小尺度参数是 §5.4.3 中的建模假设。}
- {en: 'The Part I cover reads Version 1.1 with an update dated 04/02/2008, while the headers read V1.2.', zh: Part I 封面标注为 Version 1.1 并注明 2008 年 2 月 4 日更新，而页眉标注为 V1.2。}
history:
- {en: '2007-09-30: D1.1.2 delivered; the Part I cover records an update dated 2008-02-04, and the headers read V1.2.', zh: 2007-09-30：D1.1.2 交付；Part I 封面记录 2008 年 2 月 4 日的更新，页眉为 V1.2。}
- {en: '2009-09-30: ''WINNER II Channel Models'' published as a chapter in Radio Technologies and Concepts for IMT-Advanced (Wiley).', zh: 2009-09-30：'WINNER II Channel Models' 作为章节发表于 Radio Technologies and Concepts for IMT-Advanced（Wiley）。}
- {en: '2026-09-23: the MathWorks File Exchange page was updated; this dates the implementation entry, not the WINNER II model.', zh: 2026-09-23：MathWorks File Exchange 页面更新；这一日期对应实现条目，而非 WINNER II 模型本身。}
usage:
- {en: 'Pin the D1.1.2 V1.2 report and the MathWorks add-on release; the add-on requires MATLAB, Communications Toolbox, DSP System Toolbox and Signal Processing Toolbox.', zh: 固定 D1.1.2 V1.2 报告与 MathWorks 附加组件版本；该附加组件需要 MATLAB、Communications Toolbox、DSP System Toolbox 与 Signal Processing Toolbox。}
- {en: 'Choose the scenario by its number (1 = A1, 2 = A2, 3 to 6 = B1 to B4, 10 to 13 = C1 to C4, 14 = D1, 15 = D2a) and a carrier frequency within 2-6 GHz.', zh: 按场景编号选择场景（1 = A1，2 = A2，3 至 6 = B1 至 B4，10 至 13 = C1 至 C4，14 = D1，15 = D2a），并选择 2–6 GHz 内的载频。}
- {en: 'Build the full BS/MS layout and generate its links together, since large-scale parameters are correlated across the links of one layout.', zh: 建立完整的 BS/MS 布局并一起生成其中的链路，因为同一布局内各链路的大尺度参数相互相关。}
- {en: 'For time-varying channels, use the segment-based time evolution of §3.4; ModelConfig.NumTimeSamples and UniformTimeSampling control the time sampling.', zh: 对于时变信道，采用 §3.4 基于信道段的时间演化；ModelConfig.NumTimeSamples 与 UniformTimeSampling 控制时间采样。}
- {en: 'For FDD, follow §5.4.3: save the small-scale parameters, swap the BS and MS positions, change the carrier frequency and randomize the initial phases.', zh: FDD 时按 §5.4.3 操作：保存小尺度参数，交换 BS 与 MS 位置，改变载频并重新随机初相位。}
- {en: Set ModelConfig.RandomSeed (and the layout seed) to make generation repeatable., zh: 设置 ModelConfig.RandomSeed（以及布局种子），使生成结果可重复。}
overview: {en: 'WINNER II Channel Models is a spatial channel model from the WINNER II project (IST-4-027756), specified in deliverable D1.1.2 V1.2 dated September 2007. It generates spatially defined multiuser MIMO channel coefficients with the clustered delay line method, for any number of base stations and mobile stations placed by a layout of geometry and locations. The model covers 12 indoor and outdoor scenarios (A1, A2, B1 to B4, C1 to C4, D1 and D2a) with line-of-sight and non-line-of-sight propagation, with RF frequencies up to 6 GHz and signal bandwidths up to 100 MHz. It is a generator rather than a fixed dataset: MathWorks implements it as the WINNER II Channel Model add-on for Communications Toolbox, which produces coefficients at run time from a model configuration and a layout. The add-on requires MATLAB, Communications Toolbox, DSP System Toolbox and Signal Processing Toolbox.', zh: WINNER II Channel Models 是 WINNER II 项目（IST-4-027756）提出的空间信道模型，规范载于 2007 年 9 月的交付件 D1.1.2
    V1.2。该模型采用聚类延迟线（clustered delay line）方法，为任意数量的基站与移动台生成空间定义的多用户 MIMO 信道系数，各节点的几何与位置由布局给出。模型涵盖 12 种室内与室外场景（A1、A2、B1 至 B4、C1 至 C4、D1 和 D2a），支持视距（LOS）与非视距（NLOS）传播，射频频率最高 6 GHz，信号带宽最高 100 MHz。该资源是信道生成器而非固定数据集：MathWorks 将其实现为 Communications Toolbox 的 WINNER II Channel Model 附加组件，依据模型配置与布局在运行时生成信道系数。该附加组件需要 MATLAB、Communications Toolbox、DSP System Toolbox 和 Signal Processing Toolbox。}
signal_details:
- signal: cir
  text: {en: 'comm.WINNER2Channel filters a real or complex input signal through the WINNER II fading channel of each link, in a streaming fashion. ModelConfig sets NumTimeSamples (default 100) and CenterFrequency (default 5.25e9 Hz). The sample rate of each link is V_MS / (c / F_center / 2 / N_SD), where V_MS is the mobile speed, c the speed of light, F_center the carrier frequency and N_SD the sample density.', zh: comm.WINNER2Channel 以流式方式，让实数或复数输入信号经过各链路的 WINNER II 衰落信道。ModelConfig 设置 NumTimeSamples（默认 100）和 CenterFrequency（默认 5.25e9 Hz）。每条链路的采样率为 V_MS / (c / F_center / 2 / N_SD)，其中 V_MS 为移动台速度，c 为光速，F_center 为载频，N_SD 为采样密度。}
- signal: paths
  text: {en: 'The pathgains output is a cell array with one complex array per link, of size N_R × N_T × N_P × N_S, where N_P is the number of paths of that link and N_S is the number of time samples. The number of paths and the link layout are specified by LayoutConfig. FixedPdpUsed and FixedAnglesUsed select predefined path delays, path powers, angles of departure and angles of arrival for specific scenarios.', zh: pathgains 输出为元胞数组，每条链路对应一个复数数组，尺寸为 N_R × N_T × N_P × N_S，其中 N_P 为该链路的路径数，N_S 为时间样本数。路径数和链路布局由 LayoutConfig 指定。FixedPdpUsed 与 FixedAnglesUsed 可为特定场景选用预定义的路径时延、路径功率、出发角（AoD）和到达角（AoA）。}
