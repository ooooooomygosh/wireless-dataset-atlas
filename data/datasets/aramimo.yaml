summary: {en: 'Over-the-air massive MIMO measurements at 563 MHz from a base station with 42 antennas serving six UEs at 0.64 to 3.84 km on crop and livestock farms around Ames, Iowa, with 6 to 24 MHz channel bandwidths, including raw CSI, IQ pilots, per-UE KPIs and MU-MIMO scheduling summaries.', zh: 在爱荷华州 Ames 周边农场采集的 563 MHz 空口大规模 MIMO 实测数据：基站 42 根天线服务 6 个用户终端，距离 0.64 至 3.84 km，信道带宽 6 至 24 MHz，包含原始 CSI、IQ 导频、用户级 KPI 以及 MU-MIMO 分组与调度汇总。}
