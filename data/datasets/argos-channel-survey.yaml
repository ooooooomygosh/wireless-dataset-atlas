summary: {en: 'Rice multi-antenna multiuser channel measurements for studying array correlation, mobility, and actual MU-MIMO, rather than relying only on a single-user position grid.', zh: Rice 多天线多用户信道测量，适合检验阵列相关性、移动性与实际 MU-MIMO，而非仅使用单用户位置网格。}
checked: '2026-11-06'
pipeline:
  summary: {en: 'Each frame starts with a base-station beacon that synchronizes the users, and the users send LTS pilots in TDMA slots. Base-station radios report raw pilot IQ to the central controller, which stores HDF5 traces. The official Python toolbox then converts IQ to CSI, and the first LTS estimate of each frame sets the beamweights for the second.', zh: 每帧开始时基站发出 beacon 同步用户，用户在 TDMA 时隙中发送 LTS 导频。基站射频节点将原始导频 IQ 上报给中央控制器，控制器保存为 HDF5 轨迹。官方 Python 工具箱随后将 IQ 转换为 CSI，每帧的第一次 LTS 估计用于设定第二次估计所用的波束权重。}
  stages:
  - title: {en: Select topology and radio platform, zh: 选择拓扑与射频平台}
    detail: {en: 'The platform uses ArgosV2 with WARPv3 radios at 2.4 and 5 GHz, and a WURC-based platform for UHF. The primary campaign uses 96 base-station antennas (an 8 by 12 array of omnidirectional monopoles, 63.5 mm apart) serving 8 users. A Python framework configures frequency, antenna count, user count and frame length.', zh: 平台在 2.4 与 5 GHz 采用 ArgosV2 与 WARPv3 射频模块，UHF 频段采用基于 WURC 的平台。主要测量活动使用 96 根基站天线（8×12 全向单极天线阵列，间距 63.5 mm）服务 8 个用户。Python 框架配置频率、天线数、用户数和帧长。}
    inputs:
    - {en: Indoor or outdoor topology, zh: 室内或室外拓扑}
    - {en: 'ArgosV2/WARPv3 and WURC radios, battery-powered user devices', zh: ArgosV2/WARPv3 与 WURC 射频模块、电池供电的用户设备}
    outputs:
    - {en: Topology and RF parameters for each run, zh: 每次运行的拓扑与射频参数}
    controls:
    - {en: 63.5 mm is about half a wavelength at 2.4 GHz and about one wavelength at 5 GHz., zh: 63.5 mm 在 2.4 GHz 下约为半波长，在 5 GHz 下约为一个波长。}
  - title: {en: Configure motion and gain, zh: 配置运动与增益}
    detail: {en: 'Traces cover stationary, environmental-motion, walking-user, linear-track and naturalistic conditions. In most traces AGC is set and then disabled to avoid gain jumps; gain settings are recorded in the trace.', zh: 轨迹覆盖静止、环境运动、用户步行、直线轨道和自然运动等条件。多数轨迹先设置 AGC 再关闭，以避免测量中出现增益跳变；增益设置记录在轨迹中。}
    controls:
    - {en: Analysis traces are 20 to 120 s long with a 2 ms channel resounding interval., zh: 分析用轨迹长 20 至 120 s，信道重探测间隔为 2 ms。}
  - title: {en: Synchronize frames with a beacon, zh: 用 beacon 同步帧}
    detail: {en: 'The base station sends a beacon at the start of each frame to synchronize the users, and the Faros control channel provides time and frequency synchronization. Users then send their pilots in TDMA slots at the beginning of the frame.', zh: 每帧开始时基站发出 beacon 以同步用户，Faros 控制信道提供时间与频率同步。随后各用户在帧前部的 TDMA 时隙中发送导频。}
  - title: {en: Collect multiuser pilot IQ, zh: 采集多用户导频 IQ}
    detail: {en: 'Users send 802.11 LTS pilots with 52 subcarriers. Wideband pilots for 8 users and a noise estimate can be collected in under 100 µs, and every base-station radio records each user''s raw IQ.', zh: 用户发送 52 个子载波的 802.11 LTS 导频。8 个用户的宽带导频与噪声估计可在 100 µs 内采集完成，各基站射频节点记录每个用户的原始 IQ。}
  - title: {en: Store raw HDF5 traces, zh: 保存原始 HDF5 轨迹}
    detail: {en: 'After the pilot phase, base-station radios report pilot IQ to the central controller, which writes it to HDF5 in real time. Uplink data IQ can optionally be stored in the same file.', zh: 导频阶段结束后，基站射频节点将导频 IQ 上报给中央控制器，控制器实时写入 HDF5。上行数据 IQ 可选择一并保存在同一文件中。}
  - title: {en: Convert IQ to CSI with the official toolbox, zh: 用官方工具箱将 IQ 转为 CSI}
    detail: {en: 'The open-source Python toolbox, which uses NumPy and SciPy, converts raw IQ samples to CSI and computes channel correlation, coherence, condition numbers and achievable rates under CSI delay.', zh: 基于 NumPy 与 SciPy 的开源 Python 工具箱将原始 IQ 转换为 CSI，并计算信道相关性、相干性、条件数以及 CSI 时延下的可达速率。}
  - title: {en: Separate beamweight design from evaluation, zh: 将波束权重设计与性能评估分开}
    detail: {en: 'The first LTS estimate of a frame derives the beamweights and the second LTS estimate evaluates the rate, so design and evaluation do not share a noise realization. Conjugate beamforming and zero-forcing are compared with weights computed from delayed CSI.', zh: 同一帧内第一次 LTS 估计用于计算波束权重，第二次 LTS 估计用于评估速率，从而使设计与评估不共享同一噪声实现。共轭波束成形与迫零方法在使用延迟 CSI 计算权重的条件下进行比较。}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: 'HDF5 uplink pilot IQ with trace configuration; topology descriptions, maps, photos and some videos.', zh: HDF5 格式的上行导频 IQ 与轨迹配置；拓扑说明、地图、照片及部分视频。}
- label: {en: Derived outputs, zh: 派生输出}
  text: {en: 'Complex CSI from the official toolbox; correlation, condition numbers, CSI aging and achievable MU-MIMO rates.', zh: 官方工具箱估计的复数 CSI；相关性、条件数、CSI 老化与 MU-MIMO 可达速率。}
- label: {en: Bands, zh: 频段}
  text: {en: 'UHF, 2.4 GHz and 5 GHz each use separate radios and antennas; the hardware can collect the bands simultaneously.', zh: UHF、2.4 GHz 与 5 GHz 各自使用独立的射频模块与天线；硬件可同时采集多个频段。}
technical_notes:
- {en: Frame lengths typically range from 2 ms to 50 ms., zh: 帧长通常为 2 至 50 ms。}
- {en: Continuous mode supports a single user and differs from the multiuser framed traces., zh: 连续模式仅支持单用户，与多用户分帧轨迹不同。}
limitations:
- {en: 'Each band requires separate radios and antennas, so UHF, 2.4 GHz and 5 GHz use different hardware.', zh: 每个频段需要独立的射频模块与天线，UHF、2.4 GHz 与 5 GHz 使用不同硬件。}
- {en: Antenna and user counts vary by trace; the primary campaign uses 96 antennas and 8 users., zh: 天线数与用户数因轨迹而异；主要测量活动使用 96 根天线与 8 个用户。}
history:
- {en: '2016: Asilomar paper describing the Argos Channel Survey measurements.', zh: 2016 年：发表描述 Argos Channel Survey 测量的 Asilomar 论文。}
usage:
- {en: 'Use the first LTS estimate for beamweights and the second for rate evaluation, as in the 2016 paper.', zh: 与 2016 年论文一致，用第一次 LTS 估计计算波束权重，用第二次 LTS 估计评估速率。}
- {en: Select configurations by array and user count; the primary campaign covers 2.4 and 5 GHz with 96 antennas and 8 users., zh: 依据阵列与用户数选择配置；主要测量活动覆盖 2.4 与 5 GHz，使用 96 根天线与 8 个用户。}
field_notes:
- label: {en: CSI, zh: CSI}
  text: {en: The released traces are raw pilot IQ in HDF5; CSI is estimated from them with the official toolbox., zh: 发布的轨迹为 HDF5 格式的原始导频 IQ；CSI 由官方工具箱从中估计。}
- label: {en: Paths, zh: 路径}
  text: {en: 'The paper reports no per-path angles, interaction records, or AoA/AoD ground truth.', zh: 论文未报告逐径角度、交互记录或 AoA/AoD 真值。}
- label: {en: Position, zh: 位置}
  text: {en: Each topology has a map. Controlled-track runs move one user along a linear track., zh: 每个拓扑附有地图；受控轨道轨迹中一名用户沿直线轨道移动。}
- label: {en: RGB, zh: RGB}
  text: {en: 'Each topology includes maps and photos, and some traces include video.', zh: 每个拓扑包含地图与照片，部分轨迹包含视频。}
- label: {en: LiDAR, zh: LiDAR}
  text: {en: The paper reports no LiDAR scans., zh: 论文未报告 LiDAR 扫描数据。}
- label: {en: Radar, zh: 雷达}
  text: {en: The paper reports no radar observations., zh: 论文未报告雷达观测数据。}
- label: {en: Multi-BS, zh: 多基站}
  text: {en: Each topology is one multi-antenna base station built from several WARP nodes under a single central controller., zh: 每个拓扑为一个多天线基站，由若干 WARP 节点在单一中央控制器下组成。}
- label: {en: Cross-frequency, zh: 跨频}
  text: {en: 'The hardware can collect UHF, 2.4 GHz and 5 GHz simultaneously, but each band uses separate radios and antennas.', zh: 硬件可同时采集 UHF、2.4 GHz 与 5 GHz，但每个频段使用独立的射频模块与天线。}
provenance:
- {en: Real indoor/outdoor environments and moving users → Argos multi-antenna platform, zh: 真实室内/室外与移动用户 → Argos 多天线平台}
- {en: Uplink pilots → complex multiuser channel estimates → channel records organized by run, zh: 上行导频 → 多用户复数信道估计 → 按运行组织的信道记录}
overview: {en: 'The Argos Channel Survey is a many-antenna MU-MIMO channel measurement dataset from Rice University, described in the 2016 Asilomar paper "Understanding Real Many-Antenna MU-MIMO Channels" by Shepard, Ding, Guerra and Zhong. The system is built on the ArgosV2 platform with WARPv3 and WURC radios, a central controller and battery-powered user devices. The central controller saves raw uplink pilot IQ samples in real time to HDF5 files. Measurements cover the UHF, 2.4 GHz and 5 GHz bands: at 2.4 and 5 GHz, up to 104 base-station antennas serve 8 users, and at UHF, up to 8 antennas serve 6 users. Topologies include LOS and NLOS scenarios, both indoors and outdoors, with stationary, environmental, user, linear-track and naturalistic mobility. The paper reports over 100 traces across more than 20 topologies, over one billion channel measurements and about 1 TB of data. Each topology is documented with experimental descriptions, maps and photos, and some traces include video. An
    open-source Python toolbox converts the raw IQ samples to CSI, and the paper reports no LiDAR, radar or GPS records.', zh: Argos Channel Survey 是 Rice 大学的多天线 MU-MIMO 信道测量数据集，其论文为 Shepard、Ding、Guerra 与 Zhong 于 2016 年 Asilomar 会议发表的《Understanding Real Many-Antenna MU-MIMO Channels》。测量系统基于 ArgosV2 平台，采用 WARPv3 与 WURC 射频模块，并配有中央控制器和电池供电的用户设备。中央控制器实时将原始上行导频 IQ 样本写入 HDF5 文件。测量覆盖 UHF、2.4 GHz 与 5 GHz 频段：在 2.4 GHz 与 5 GHz，最多 104 根基站天线服务 8 个用户；在 UHF，最多 8 根基站天线服务 6 个用户。拓扑包括室内与室外的 LOS 和 NLOS 场景，移动方式包括静止、环境移动、用户移动、直线轨道移动与自然移动。论文报告了 100 余条轨迹、20 余个拓扑、超过 10 亿次信道测量，数据量约 1 TB。每个拓扑附有实验说明、地图和照片，部分轨迹附有视频。开源 Python 工具箱可将原始 IQ 样本转换为 CSI，论文未报告 LiDAR、雷达或 GPS 记录。}
signal_details:
- signal: csi
  text: {en: 'CSI is computed from raw uplink pilot IQ by the open-source Python channel analysis toolbox, which uses NumPy and SciPy. At the start of each frame, users send 802.11 LTS pilots with 52 subcarriers in TDMA. The system supports up to 20 MHz bandwidth and 16 simultaneous users. Analysis traces of 20 to 120 s used a 2 ms channel resounding interval, and frame lengths typically range from 2 ms to 50 ms.', zh: CSI 由开源 Python 信道分析工具箱从原始上行导频 IQ 样本计算得到，工具箱基于 NumPy 与 SciPy。每帧开始时，用户以 TDMA 方式发送 52 个子载波的 802.11 LTS 导频。系统支持最高 20 MHz 带宽与 16 个同时工作的用户。分析用轨迹长 20 至 120 s，信道重探测间隔为 2 ms；帧长通常为 2 至 50 ms。}
- signal: iq
  text: {en: 'Raw uplink pilot IQ samples are reported from each base-station radio to the central controller after the pilot phase and written to HDF5 files. Each trace records the AGC and gain settings. Uplink data IQ can also be stored when configured. A separate WARPLab-based mode records continuous IQ for one user, up to 6 s at 20 MHz or 3 s at 40 MHz, and keeps the samples in memory at each WARP node.', zh: 各基站射频节点在导频阶段结束后，将原始上行导频 IQ 样本上报给中央控制器，并写入 HDF5 文件。每条轨迹记录 AGC 及增益设置。配置后也可保存上行数据 IQ。另有一种基于 WARPLab 的连续采集模式，仅针对单个用户，20 MHz 下最长 6 s，40 MHz 下最长 3 s，样本保存在各 WARP 节点的内存中。}
- signal: rgb
  text: {en: 'Each topology has experimental descriptions, maps and photos, and some traces include video. These are published with each trace.', zh: 每个拓扑附有实验说明、地图和照片，部分轨迹附有视频，均随每条轨迹发布。}
bandwidth_mhz: 20
size_gb: 1000
capabilities:
- key: csi
  status: derivable
  note: {en: 'Complex CSI is computed from raw pilot IQ by the official Python toolbox (Sec. V); release file names carry an ArgosCSI prefix, and file contents were not inspected.', zh: 复数CSI由官方Python工具箱从原始pilot IQ计算（第V节）；发布文件名带有ArgosCSI前缀，文件内容未检查。}
- key: cir
  status: derivable
  note: {en: An inverse FFT over the 52 LTS subcarriers at 20 MHz gives the impulse response; the paper reports no CIR or PDP output., zh: 对20 MHz下52个LTS子载波的CSI做逆FFT即可得到冲激响应；论文未报告CIR或PDP输出。}
- key: paths
  status: none
  note: {en: 'The released data are pilot IQ and CSI, with no per-path delay, angle, power or phase records.', zh: 发布内容为导频IQ与CSI，不含逐径时延、角度、功率或相位记录。}
- key: interaction
  status: none
  note: {en: 'No ground-truth interaction records (reflecting surfaces, diffraction points) are described.', zh: 未描述真实交互记录（反射面、绕射点等）。}
- key: power
  status: derivable
  note: {en: 'No RSSI is recorded (Sec. III); channel power per antenna and user follows from CSI and the recorded gain settings, and absolute calibration is not stated.', zh: 未记录RSSI（第III节）；逐天线、逐用户信道功率由CSI和记录的增益设置推出，绝对标定未说明。}
- key: iq
  status: provided
  note: {en: Uplink pilot IQ per base-station antenna and user is stored in HDF5 per trace; uplink data IQ is saved only when configured., zh: 每条trace以HDF5存储各基站天线、各用户的上行pilot IQ；上行data IQ仅在配置时保存。}
- key: beam_labels
  status: derivable
  note: {en: Conjugate and zero-forcing beamformer gains and achievable rates are computed from CSI by the toolbox (Sec. V); no beam codebook index is described., zh: 共轭与ZF波束权重增益及可达速率由工具箱从CSI计算（第V节）；未描述码本波束索引。}
- key: position
  status: derivable
  note: {en: Displacement on the linear track follows from time at the stated 4.6 cm/s; no per-frame absolute position is stated for handheld users., zh: 轨道位移可由时间与文中给出的4.6 cm/s推算；手持用户的逐帧绝对位置未说明。}
- key: geometry
  status: provided
  note: {en: Floor-plan maps and pictures of each environment are published; no 3D scene model is described., zh: 各环境发布平面图与照片；未描述3D场景模型。}
- {key: materials, status: unknown}
- key: rgb
  status: provided
  note: {en: Photos are published for each topology and video for some traces; per-frame synchronization and camera calibration are not stated., zh: 每个拓扑附照片，部分trace附视频；未说明逐帧同步与相机标定。}
- {key: depth, status: unknown}
- key: lidar
  status: none
  note: {en: The system records uplink radio IQ and scene photos or maps only; no LiDAR scans are described., zh: 系统仅记录上行无线IQ及场景照片或地图，未描述LiDAR扫描。}
- key: radar
  status: none
  note: {en: The system records communication uplink pilots only; no radar observations or target labels are described., zh: 系统仅采集通信上行导频，未描述雷达观测或目标标签。}
- {key: imu, status: unknown}
- key: time_series
  status: provided
  note: {en: Analysis traces run 20 to 120 s at a 2 ms resounding interval; a few 20-minute office traces use reduced time resolution (Sec. IV)., zh: 分析用trace为20至120 s、重测间隔2 ms；另有若干20分钟办公室trace，时间分辨率较低（第IV节）。}
- key: multiuser
  status: provided
  note: {en: 'Up to 8 simultaneous users in the 2.4 and 5 GHz campaign with 96 BS antennas, and up to 6 users at UHF (Sec. IV).', zh: 2.4和5 GHz主测量中最多8个同时用户（96根基站天线）；UHF最多6个用户（第IV节）。}
- key: multibs
  status: none
  note: {en: 'Each topology uses one multi-antenna base-station array under one central controller (Sec. III, Fig. 1).', zh: 每个拓扑使用单个多天线基站阵列，由一个中央控制器管理（第III节，图1）。}
- key: crossfreq
  status: unknown
  note: {en: 'The paper says the hardware can record UHF, 2.4 and 5 GHz simultaneously, but per-trace pairing in the release is not stated.', zh: 文中称硬件可同时记录UHF、2.4与5 GHz，但发布中逐trace的配对关系未说明。}
- {key: near_field, status: unknown}
- key: high_mobility
  status: unknown
  note: {en: 'The core motion is pedestrian (linear track at 4.6 cm/s); file names list in-car and drive-by outdoor traces, and no speed is stated for them.', zh: 核心运动为步行速度（直线轨道4.6 cm/s）；文件名含车内与drive-by室外trace，但未给出其速度。}
- key: dynamic_blockage
  status: provided
  note: {en: Environmental-mobility traces include people walking and opening doors that occlude paths (Sec. VI-A); the file list also has drive-by and in-car outdoor traces., zh: 环境移动trace包含走动的人员与开关门，会遮挡路径（第VI-A节）；文件列表另含室外drive-by与车内trace。}
- key: reflection
  status: provided
  note: {en: 'Inherent in the measurement, not labelled per path.', zh: 测量中固有存在，未按径标注。}
- key: diffraction
  status: provided
  note: {en: 'Inherent in the measurement, not labelled per path.', zh: 测量中固有存在，未按径标注。}
- key: scattering
  status: provided
  note: {en: 'Inherent in the measurement, not labelled per path.', zh: 测量中固有存在，未按径标注。}
- key: transmission
  status: provided
  note: {en: 'Inherent in the measurement, not labelled per path.', zh: 测量中固有存在，未按径标注。}
- key: polarization
  status: unknown
  note: {en: 'The main array uses vertical monopoles (Sec. IV); UHF file names mention polarized antennas, but no dual-polarized channel data is described.', zh: 主阵列为垂直单极天线（第IV节）；UHF文件名含极化天线字样，但未描述双极化信道数据。}
- {key: em_field, status: unknown}
