- {en: 'Confirmed: §7.6.3 spatial consistency, §7.6.4 blockage, and §7.6.5 multifrequency correlation are separately defined components.', zh: 已确认：§7.6.3 空间一致性、§7.6.4 blockage、§7.6.5 多频相关是分别定义的组件。}
- {en: 'Confirmed: V19.2 §7.6.13/14 contain near-field and spatial-nonstationarity model sections.', zh: 已确认：V19.2 §7.6.13/14 包含近场和空间非平稳模型章节。}
- {en: 'Inference: a tool labeled 3GPP may implement only a subset of the specification; verification must list clauses rather than only the advertised version.', zh: 推断：标为 3GPP 的工具可能只实现规范子集；验证时须列条款而非仅标称版本。}
