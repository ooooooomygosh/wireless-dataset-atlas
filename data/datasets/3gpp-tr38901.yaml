pipeline:
  summary: {en: 'TR 38.901 defines a 12-step generation procedure for the clause 7.5 cluster model. Clause 7.6 adds separately defined components, and the CDL and TDL models in clause 7.7 are tabulated link-level sets.', zh: TR 38.901 为第 7.5 节的簇模型定义了 12 步生成流程。第 7.6 节另行定义附加组件，第 7.7 节的 CDL 与 TDL 模型是表格化的链路级模型集合。}
  scope: {en: 'Generation procedure of TR 38.901 V19.2.0, clauses 7.5 to 7.7.', zh: TR 38.901 V19.2.0 的生成流程，第 7.5 至 7.7 节。}
  stages:
  - title: {en: 'Set environment, layout and arrays', zh: 设置环境、布局与阵列}
    detail: {en: 'Step 1 sets the environment, network layout and antenna array parameters. Table 7.5-6 is split by scenario, and the frequency ranges differ between scenarios (for example RMa up to 7 GHz and SMa up to 24 GHz).', zh: 第 1 步设置环境、网络布局与天线阵列参数。表 7.5-6 按场景划分，不同场景的频率范围不同（例如 RMa 至 7 GHz，SMa 至 24 GHz）。}
    inputs:
    - {en: Scenario and network layout, zh: 场景与网络布局}
    outputs:
    - {en: Model instance with arrays and scenario parameters, zh: 含阵列与场景参数的模型实例}
  - title: {en: Assign states and large-scale parameters, zh: 分配状态与大尺度参数}
    detail: {en: 'Steps 2 to 4 assign LOS/NLOS states (Table 7.4.2-1), compute pathloss (Table 7.4.1-1), and generate correlated large-scale parameters: delay spread, angular spreads ASA, ASD, ZSA and ZSD, Ricean K-factor and shadow fading.', zh: 第 2 至 4 步依据表 7.4.2-1 分配 LOS/NLOS 状态，依据表 7.4.1-1 计算路径损耗，并生成相关的大尺度参数：时延扩展、角扩展 ASA、ASD、ZSA 与 ZSD、莱斯 K 因子和阴影衰落。}
    inputs:
    - {en: Scenario statistics and layout, zh: 场景统计与布局}
    outputs:
    - {en: Link propagation states and large-scale parameters, zh: 链路传播状态与大尺度参数}
  - title: {en: Generate small-scale parameters, zh: 产生小尺度参数}
    detail: {en: 'Steps 5 to 10 draw cluster delays from Table 7.5-6, set cluster powers from an exponential delay distribution, generate cluster arrival and departure angles, couple rays within clusters, generate cross-polarization power ratios and initial random phases. The two strongest clusters are split into three sub-clusters with power fractions 10/20, 6/20 and 4/20.', zh: 第 5 至 10 步依据表 7.5-6 抽取簇时延，按指数时延分布确定簇功率，生成簇的到达角与离开角，执行簇内射线耦合，并生成交叉极化功率比和初始随机相位。两个最强簇被分为三个子簇，功率比例为 10/20、6/20 和 4/20。}
    inputs:
    - {en: Large-scale parameters, zh: 大尺度参数}
    - {en: Scenario cluster and ray parameter tables, zh: 场景簇与射线参数表}
    outputs:
    - {en: 'Cluster and ray delays, powers, angles and polarization parameters', zh: 簇与射线的时延、功率、角度和极化参数}
  - title: {en: Synthesize channel coefficients, zh: 合成信道系数}
    detail: {en: 'Step 11 generates channel coefficients for each cluster and each transmit and receive element pair, and Step 12 applies pathloss and shadowing. Spatial consistency (7.6.3), blockage (7.6.4), multi-frequency correlation (7.6.5), near-field (7.6.13) and spatial non-stationarity (7.6.14) are separate clauses that are enabled under their own conditions.', zh: 第 11 步为每个簇及每对收发阵元生成信道系数，第 12 步施加路径损耗与阴影衰落。空间一致性（7.6.3）、阻挡（7.6.4）、多频率相关（7.6.5）、近场（7.6.13）与空间非平稳（7.6.14）是分别定义的条款，须依各自条件单独启用。}
    outputs:
    - {en: Channel coefficients for the enabled clauses, zh: 所启用条款对应的信道系数}
  - title: {en: Use CDL and TDL models, zh: 使用 CDL 与 TDL 模型}
    detail: {en: 'Clause 7.7 tabulates CDL-A to CDL-E and TDL-A to TDL-E. CDL models can be implemented through Steps 10 and 11 of clause 7.5, or generated from a TDL model using the spatial filter in clause 7.7.4.', zh: 第 7.7 节给出 CDL-A 至 CDL-E 与 TDL-A 至 TDL-E 的表格。CDL 模型可通过第 7.5 节第 10、11 步实现，也可利用第 7.7.4 节的空间滤波器由 TDL 模型生成。}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: PDF specification with formulas and parameter tables; the report contains no fixed sample library., zh: PDF 规范文件，包含公式与参数表；不含固定样本库。}
- label: {en: Derived outputs, zh: 派生输出}
  text: {en: 'Software implementations of the model generate CIR/CFR, CDL/TDL waveforms and system-level evaluation data.', zh: 依据该模型的软件实现可生成 CIR/CFR、CDL/TDL 波形及系统级评估数据。}
- label: {en: Edition, zh: 版本}
  text: {en: 'V19.2.0 (2026-02), Release 19, 164 pages.', zh: V19.2.0（2026-02），Release 19，共 164 页。}
technical_notes:
- {en: 'Clauses 7.6.3 (spatial consistency), 7.6.4 (blockage) and 7.6.5 (multi-frequency correlation) are separately defined components.', zh: 第 7.6.3 节（空间一致性）、7.6.4 节（阻挡）与 7.6.5 节（多频率相关）是分别定义的组件。}
- {en: V19.2.0 clauses 7.6.13 and 7.6.14 contain the near-field and spatial non-stationarity models., zh: V19.2.0 的第 7.6.13 与 7.6.14 节分别包含近场模型与空间非平稳模型。}
- {en: Clause 7.6.4 defines blockage model A and blockage model B as separate subclauses., zh: 第 7.6.4 节分别定义阻挡模型 A 与阻挡模型 B 两个子条款。}
limitations:
- {en: The report contains no measured channel data; the CDL and TDL models are tabulated statistical models rather than recordings., zh: 报告不含实测信道数据；CDL 与 TDL 模型是表格化的统计模型，而非测量记录。}
