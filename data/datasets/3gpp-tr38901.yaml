overview: {en: '3GPP TR 38.901, titled ''Study on channel model for frequencies from 0.5 to 100 GHz'', is an ETSI technical report of 3GPP Release 19 (V19.2.0, 2026-02). It defines channel models for 0.5 to 100 GHz for evaluating physical-layer techniques in 3GPP systems. Its scope consolidates study items on channel models above 6 GHz, NR, indoor industrial scenarios, 7 to 24 GHz channel modelling for NR, and ISAC. Clause 7.5 defines a cluster-based stochastic model in which large-scale parameters are drawn for each BS-UT link and the impulse response is built from clusters and rays. Two tabulated link-level sets are derived from it: CDL-A to CDL-E (clause 7.7.1) and TDL-A to TDL-E (clause 7.7.2), each with a maximum bandwidth of 2 GHz. Further clauses define spatial consistency, blockage models A and B, multi-frequency correlation, near-field and spatial non-stationarity models. The document is a PDF of equations and parameter tables with no measured channel data, and it carries an ETSI
    copyright notice reserving all rights.', zh: 3GPP TR 38.901《Study on channel model for frequencies from 0.5 to 100 GHz》是 3GPP Release 19 的 ETSI 技术报告（V19.2.0，2026-02）。该报告定义 0.5 至 100 GHz 的信道模型，用于评估 3GPP 系统中的物理层技术。其范围汇总了以下研究项目：6 GHz 以上信道模型、NR、室内工业场景、面向 NR 的 7 至 24 GHz 信道建模以及 ISAC。第 7.5 节定义了基于簇的随机模型：大尺度参数按 BS-UT 链路抽取，冲激响应由簇和射线构成。由此导出两组表格化链路级模型：CDL-A 至 CDL-E（第 7.7.1 节）和 TDL-A 至 TDL-E（第 7.7.2 节），最大带宽均为 2 GHz。其余条款定义了空间一致性、阻挡模型 A 与 B、多频率相关性，以及近场和空间非平稳性模型。该文件为包含公式和参数表的 PDF，不含实测信道数据，并附有 ETSI 版权声明，保留全部权利。}
signal_details:
- signal: cir
  text: {en: 'Channel impulse response for each BS-UT link, given by equation (7.5-27) in clause 7.5 as a sum over clusters and rays. Cluster delays are drawn from the delay distribution in Table 7.5-6, and cluster powers follow an exponential delay distribution with a per-cluster shadowing term in dB. CDL-A to CDL-E (clause 7.7.1) and TDL-A to TDL-E (clause 7.7.2) are tabulated link-level models for 0.5 to 100 GHz with a maximum bandwidth of 2 GHz.', zh: 每个 BS-UT 链路的信道冲激响应，由第 7.5 节式 (7.5-27) 给出，为各簇与各射线的求和。簇时延按表 7.5-6 中的时延分布抽取，簇功率采用指数时延分布，并含以 dB 计的每簇阴影项。CDL-A 至 CDL-E（第 7.7.1 节）和 TDL-A 至 TDL-E（第 7.7.2 节）是面向 0.5 至 100 GHz 的表格化链路级模型，最大带宽为 2 GHz。}
- signal: paths
  text: {en: 'Path-level quantities per cluster: cluster delay and power, arrival and departure angles with their spreads (ASA, ASD, ZSA, ZSD), and ray offset angles within a cluster from Table 7.5-3. The two strongest clusters are split into three sub-clusters with power fractions 10/20, 6/20 and 4/20 and power-delay offsets 0, 1.28 and 2.56 as listed in Table 7.5-5.', zh: 每簇的路径级参数：簇时延和功率，到达角与离开角及其扩展量（ASA、ASD、ZSA、ZSD），以及簇内射线偏移角（表 7.5-3）。两个最强簇分为三个子簇，功率比例为 10/20、6/20 和 4/20，功率时延偏移为表 7.5-5 所列的 0、1.28 和 2.56。}
capabilities:
- key: csi
  status: simulate
  note: {en: Channel coefficients are synthesized by a generator run (clauses 7.5 and 8); the report stores none., zh: 信道系数需由生成器运行合成（第 7.5 节与第 8 节）；报告中不存储任何系数。}
- key: cir
  status: simulate
  note: {en: 'The CIR is the cluster-and-ray sum defined in clause 7.5, generated per link by software.', zh: CIR 为第 7.5 节定义的簇与射线求和，由软件按链路生成。}
- key: paths
  status: simulate
  note: {en: 'Cluster delays, powers and angles are drawn per link from the clause 7.5 tables; no drawn values are stored.', zh: 簇时延、功率和角度依据第 7.5 节参数表按链路抽样；不存储抽样结果。}
- key: interaction
  status: simulate
  note: {en: 'Per-path interaction points exist only in the map-based hybrid model (clause 8), which needs a user-supplied digitized map.', zh: 逐径交互点仅存在于基于地图的混合模型（第 8 节），需要用户提供数字化地图。}
- key: power
  status: simulate
  note: {en: 'Pathloss, O2I penetration loss and shadow fading (clause 7.4) are computed by a generator run.', zh: 路径损耗、O2I 穿透损耗和阴影衰落（第 7.4 节）需由生成器运行计算。}
- key: iq
  status: simulate
  note: {en: The report has no I/Q samples; baseband CDL/TDL waveforms are produced by implementations (clause 7.7)., zh: 报告不含 I/Q 采样；基带 CDL/TDL 波形由实现软件生成（第 7.7 节）。}
- key: beam_labels
  status: simulate
  note: {en: Beam indices or per-beam gains need a generator run with a chosen array and codebook (clause 7.3)., zh: 波束索引或每波束增益需使用选定阵列和码本运行生成器得到（第 7.3 节）。}
- key: position
  status: simulate
  note: {en: 'BS and UT positions are inputs to each generator run (clause 7.5 and clause 8, Step 2).', zh: BS 与 UT 位置是每次生成器运行的输入（第 7.5 节及第 8 节 Step 2）。}
- key: geometry
  status: none
  note: {en: The report contains no map or 3D scene files; clause 8 requires the user to supply a digitized map., zh: 报告不含地图或三维场景文件；第 8 节要求用户自行提供数字化地图。}
- key: materials
  status: provided
  note: {en: Contains O2I penetration-loss parameter tables by building and glass type (clause 7.4.3.1); permittivity and conductivity values are not supplied., zh: 包含按建筑与玻璃类型列出的 O2I 穿透损耗参数表（第 7.4.3.1 节）；不提供介电常数和电导率数值。}
- key: rgb
  status: none
  note: {en: The report is a specification of equations and parameter tables with no sensor data., zh: 报告为包含公式和参数表的规范文件，不含传感器数据。}
- key: depth
  status: none
  note: {en: The report is a specification of equations and parameter tables with no sensor data., zh: 报告为包含公式和参数表的规范文件，不含传感器数据。}
- key: lidar
  status: none
  note: {en: The report is a specification of equations and parameter tables with no sensor data., zh: 报告为包含公式和参数表的规范文件，不含传感器数据。}
- key: radar
  status: simulate
  note: {en: Sensing channels for targets with RCS are defined in clause 7.9 (ISAC) and produced by a generator run; no radar data are included., zh: 带 RCS 的感知目标信道在第 7.9 节（ISAC）中定义，需由生成器运行得到；不含雷达数据。}
- key: imu
  status: none
  note: {en: The report is a specification of equations and parameter tables with no sensor data., zh: 报告为包含公式和参数表的规范文件，不含传感器数据。}
- key: time_series
  status: simulate
  note: {en: Time sequences follow from the chosen time sampling and the time-varying Doppler model (clause 7.6.6); no sequence is stored., zh: 时间序列取决于所选的时间采样和时变多普勒模型（第 7.6.6 节）；不存储序列。}
- key: multiuser
  status: simulate
  note: {en: 'The number of UTs is a generator input (clause 8, Step 2); no multi-user data are stored.', zh: UT 数量是生成器输入（第 8 节 Step 2）；不存储多用户数据。}
- key: multibs
  status: simulate
  note: {en: 'The number of BSs is a generator input (clause 8, Step 2); no multi-BS sets are stored.', zh: BS 数量是生成器输入（第 8 节 Step 2）；不存储多基站数据集。}
- key: crossfreq
  status: simulate
  note: {en: Multi-frequency correlation (clause 7.6.5) is a defined component enabled per run; no paired multi-band data are stored., zh: 多频相关（第 7.6.5 节）是可按运行启用的定义组件；不存储成对的多频段数据。}
- key: near_field
  status: simulate
  note: {en: The near-field channel model is clause 7.6.13 of the V19.5.0 text., zh: 近场信道模型见 V19.5.0 文本第 7.6.13 节。}
- key: high_mobility
  status: simulate
  note: {en: 'UT speed is a generator input; the study requirements list mobile speed up to 500 km/h, and in-car UTs are set to 40 km/h in clause 7.2.', zh: UT 速度是生成器输入；研究需求列出移动速度可达 500 km/h，第 7.2 节中车内 UT 设为 40 km/h。}
- key: dynamic_blockage
  status: simulate
  note: {en: Blockage models A and B (clause 7.6.4) with moving blockers are generator options; no blocker trajectories are stored., zh: 带移动遮挡体的阻挡模型 A 与 B（第 7.6.4 节）为生成器选项；不存储遮挡体轨迹。}
- key: reflection
  status: simulate
  note: {en: 'Reflection is cluster-based, plus an optional explicit ground-reflection model (clause 7.6.8); it is not labelled per path.', zh: 反射通过簇模型表示，并可选用显式地面反射模型（第 7.6.8 节）；不按径标注。}
- key: diffraction
  status: simulate
  note: {en: 'Diffraction appears only in the deterministic ray tracing of the map-based model (clause 8), not in the cluster model.', zh: 绕射仅出现在基于地图模型（第 8 节）的确定性射线追踪中，簇模型中不包含。}
- key: scattering
  status: simulate
  note: {en: Scattering enters through the cluster model (clause 7.5) and the map-based model (clause 8); it is not labelled per path., zh: 散射通过簇模型（第 7.5 节）和基于地图模型（第 8 节）体现；不按径标注。}
- key: transmission
  status: simulate
  note: {en: Building and car penetration loss (clause 7.4.3) is applied as a loss term; no per-path transmission is stored., zh: 建筑与车辆穿透损耗（第 7.4.3 节）以损耗项形式施加；不存储逐径穿透信息。}
- key: polarization
  status: simulate
  note: {en: XPR and polarized antenna models (clauses 7.3.2 and 7.5) are generated per ray; no polarimetric data are stored., zh: XPR 与极化天线模型（第 7.3.2 节及第 7.5 节）按射线生成；不存储极化测量数据。}
- key: em_field
  status: provided
  note: {en: Antenna field patterns are given as parametric formulas and tables in clause 7.3; the report contains no sampled E-field data., zh: 天线场型以参数化公式和表格形式给出（第 7.3 节）；报告不含采样的电场数据。}
