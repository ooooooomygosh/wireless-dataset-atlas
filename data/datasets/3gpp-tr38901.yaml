summary: {en: 'A standardized stochastic channel generator for 0.5 to 100 GHz that defines CDL and TDL channel models, a map-based hybrid model and an ISAC channel model.', zh: 面向 0.5 至 100 GHz 的标准化随机信道生成器，定义了 CDL 与 TDL 信道模型、基于地图的混合信道模型以及 ISAC 信道模型。}
sources: ['https://www.etsi.org/deliver/etsi_tr/138900_138999/138901/', 'https://www.etsi.org/deliver/etsi_tr/138900_138999/138901/19.02.00_60/tr_138901v190200p.pdf', 'https://portal.3gpp.org/desktopmodules/Specifications/SpecificationDetails.aspx?specificationId=3173', 'https://api.crossref.org/works/10.1002/9781119471509.w5gref048', 'https://www.etsi.org/deliver/etsi_tr/138900_138999/138901/19.05.00_60/tr_138901v190500p.pdf', 'https://www.etsi.org/deliver/etsi_tr/138900_138999/138901/19.04.00_60/tr_138901v190400p.pdf', 'https://www.etsi.org/deliver/etsi_tr/138900_138999/138901/19.03.00_60/tr_138901v190300p.pdf', 'https://www.etsi.org/deliver/etsi_tr/138900_138999/138901/18.01.00_60/tr_138901v180100p.pdf', 'https://www.etsi.org/deliver/etsi_tr/138900_138999/138901/19.01.00_60/tr_138901v190100p.pdf', 'https://www.etsi.org/deliver/etsi_tr/138900_138999/138901/18.00.00_60/tr_138901v180000p.pdf', 'https://www.etsi.org/deliver/etsi_tr/138900_138999/138901/17.01.00_60/tr_138901v170100p.pdf',
