overview: {en: '3GPP TR 38.901, titled ''Study on channel model for frequencies from 0.5 to 100 GHz'', is a technical report of 3GPP RAN WG1, with RAN WG2, RAN WG3 and RAN WG4 as secondary groups. It defines channel models for the 0.5 to 100 GHz range and is intended to help evaluate physical layer techniques in 3GPP systems. The scope consolidates the findings of several study items, including channel models above 6 GHz, NR, indoor industrial scenarios, channel modelling for 7 to 24 GHz for NR, and ISAC. Clause 7.5 defines a cluster-based stochastic model in which large-scale parameters are drawn for each BS-UT link and the impulse response is built from clusters and rays. Two link-level sets are derived from it, CDL-A to CDL-E and TDL-A to TDL-E, each with a maximum bandwidth of 2 GHz. Further clauses define spatial consistency, blockage models A and B, multi-frequency correlation, near-field and spatial non-stationarity models. The document is an open ETSI PDF that contains equations
    and parameter tables and no measured channel data. The ETSI and 3GPP terms cover the document itself and do not define a software implementation or a data licence.', zh: 3GPP TR 38.901《Study on channel model for frequencies from 0.5 to 100 GHz》是 3GPP RAN WG1 的技术报告，RAN WG2、RAN WG3 和 RAN WG4 为次要参与工作组。该报告定义 0.5 至 100 GHz 频段的信道模型，用于评估 3GPP 系统中的物理层技术。其范围汇总了多项研究项目的结论，包括 6 GHz 以上信道模型、NR、室内工业场景、面向 NR 的 7 至 24 GHz 信道建模以及 ISAC。第 7.5 节定义了基于簇的随机模型，大尺度参数按 BS-UT 链路生成，冲激响应由簇和射线构成。由此导出两组链路级模型：CDL-A 至 CDL-E 与 TDL-A 至 TDL-E，最大带宽均为 2 GHz。其余条款定义了空间一致性、阻挡模型 A 与 B、多频率相关性，以及近场和空间非平稳性模型。该文档为公开的 ETSI PDF，包含公式和参数表，不含实测信道数据。ETSI 和 3GPP 的条款适用于该文档本身，并不定义软件实现或数据许可。}
signal_details:
- signal: cir
  text: {en: 'Channel impulse response for each BS-UT link, given by equation (7.5-27) in clause 7.5 as a sum over clusters and rays. Cluster delays are drawn from the delay distribution in Table 7.5-6, and cluster powers follow an exponential delay distribution with a per-cluster shadowing term in dB. Each ray in a cluster carries power Pn/M, where M is the number of rays per cluster. CDL-A to CDL-E (clause 7.7.1) and TDL-A to TDL-E (clause 7.7.2) are tabulated link-level models for 0.5 to 100 GHz with a maximum bandwidth of 2 GHz.', zh: 每个 BS-UT 链路的信道冲激响应，由第 7.5 节式 (7.5-27) 给出，为各簇与各射线的求和。簇时延按表 7.5-6 中的时延分布抽取，簇功率采用指数时延分布，并含以 dB 计的每簇阴影项。簇内每条射线的功率为 Pn/M，其中 M 为每簇射线数。CDL-A 至 CDL-E（第 7.7.1 节）和 TDL-A 至 TDL-E（第 7.7.2 节）是面向 0.5 至 100 GHz 的表格化链路级模型，最大带宽为 2 GHz。}
- signal: paths
  text: {en: 'Path-level quantities per cluster: cluster delay and power, arrival and departure angles with their spreads (ASA, ASD, ZSA, ZSD), and ray offset angles within a cluster from Table 7.5-3. The two strongest clusters are split into three sub-clusters with power fractions 10/20, 6/20 and 4/20 and power-delay offsets 0, 1.28 and 2.56 as listed in Table 7.5-5.', zh: 每簇的路径级参数：簇时延和功率，到达角与离开角及其扩展量（ASA、ASD、ZSA、ZSD），以及簇内射线偏移角（表 7.5-3）。两个最强簇分为三个子簇，功率比例为 10/20、6/20 和 4/20，功率时延偏移为表 7.5-5 所列的 0、1.28 和 2.56。}
