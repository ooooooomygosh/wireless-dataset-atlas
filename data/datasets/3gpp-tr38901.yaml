summary: {en: 'A standardized stochastic channel generator for 0.5 to 100 GHz that defines CDL and TDL channel models, a map-based hybrid model and an ISAC channel model.', zh: 面向 0.5 至 100 GHz 的标准化随机信道生成器，定义了 CDL 与 TDL 信道模型、基于地图的混合信道模型以及 ISAC 信道模型。}
sources: ['https://www.etsi.org/deliver/etsi_tr/138900_138999/138901/', 'https://www.etsi.org/deliver/etsi_tr/138900_138999/138901/19.02.00_60/tr_138901v190200p.pdf', 'https://portal.3gpp.org/desktopmodules/Specifications/SpecificationDetails.aspx?specificationId=3173', 'https://api.crossref.org/works/10.1002/9781119471509.w5gref048']
checked: '2026-11-06'
pipeline:
  summary: {en: 'The specification provides step-by-step layout, propagation-state, correlated-parameter, and channel-synthesis procedures; do not assume every “3GPP model” implementation supports all §7.6 mechanisms and §7.7 CDL/TDL models.', zh: 规范给出布局、传播状态、相关参数和信道合成的逐步过程；§7.6附加机制与§7.7 CDL/TDL不能默认全部由任意“3GPP模型”软件实现。}
  stages:
  - title: {en: 'Fix clauses, layout, and arrays', zh: 固定条款、布局与阵列}
    detail: {en: 'Set the environment and coordinate system following §7.5 Step 1, specifying carrier frequency, bandwidth, and antennas; frequency applicability differs by scenario.', zh: 依据§7.5 Step1设置环境和坐标系统，给定载频、带宽与天线；不同场景有不同频率适用范围。}
    inputs:
    - {en: Specification version and target scenario, zh: 规范版本与目标场景}
    - {en: 'BS/UT positions, arrays, orientations, and velocities', zh: BS/UT位置、阵列、方向和速度}
    outputs:
    - {en: Model instance with explicit clauses and input parameters, zh: 明确条款与输入参数的模型实例}
    controls:
    - {en: 'Researcher specifies: implementation name/version, scenario, frequency, arrays/polarization, and coordinates', zh: 研究者固定：实现名称/版本、场景、频率、阵列/极化及坐标}
    checks:
    - {en: Check zenith and elevation definitions, zh: 检查zenith与elevation定义}
    - {en: List implemented and unimplemented additional clauses, zh: 列出已实现与未实现的附加条款}
  - title: {en: Generate states and correlated large-scale parameters, zh: 产生状态和相关大尺度参数}
    detail: {en: '§7.5 Steps 2–4 assign LOS/NLOS and indoor states, compute pathloss, then sample correlated DS, angular spreads, K-factor, and SF.', zh: §7.5 Steps2–4赋予LOS/NLOS和室内状态，计算pathloss，再抽样相关的DS、角扩展、K-factor和SF。}
    inputs:
    - {en: Scenario statistics and layout, zh: 场景统计与布局}
    outputs:
    - {en: Link propagation states and large-scale parameters, zh: 链路传播状态与大尺度参数}
    controls:
    - {en: 'Researcher specifies: state rules, loss/shadowing switches, correlation structure', zh: 研究者固定：状态规则、损耗/阴影开关、相关结构}
    checks:
    - {en: Distinguish the basic drop model from the spatial-consistency extension, zh: 区分基本drop模型与空间一致扩展}
    - {en: Implement co-located sector sharing as specified, zh: 同址sector共享关系按规范实现}
  - title: {en: Generate small-scale parameters, zh: 产生小尺度参数}
    detail: {en: 'Generate cluster delays, powers, and angles, perform ray coupling, then generate XPR and initial phases. Delays are not uniquely determined by a real city''s geometry.', zh: 生成簇时延、功率和角度，执行射线耦合，再生成XPR与初始相位。时延不是由一张真实城市几何图唯一确定。}
    inputs:
    - {en: Large-scale parameters, zh: 大尺度参数}
    - {en: Scenario cluster/ray parameter tables, zh: 场景簇/射线参数表}
    outputs:
    - {en: 'Cluster/ray delays, powers, angles, and polarization parameters', zh: 簇/射线时延、功率、角度和极化参数}
    controls:
    - {en: 'Researcher specifies: random state, normalization, weak-cluster removal, and parameter-table version', zh: 研究者固定：随机状态、归一化、弱簇删除和参数表版本}
    checks:
    - {en: 'Check power normalization, angle conventions, and random coupling', zh: 检查功率归一化、角度约定与随机耦合}
    - {en: Retain generated parameters for statistical checks, zh: 保留生成参数用于统计复核}
  - title: {en: Synthesize channels and add selected extensions, zh: 合成信道并添加选定扩展}
    detail: {en: 'Steps 11–12 generate complex coefficients for each element pair and apply pathloss/SF; enable spatial consistency, blockage, multifrequency, near-field, or nonstationarity models separately under their respective clauses.', zh: Steps11–12得到逐阵元对复系数并应用pathloss/SF；空间一致、blockage、多频、近场或非平稳模型按对应条款另行启用。}
    inputs:
    - {en: Ray parameters, zh: 射线参数}
    - {en: Array field responses and motion, zh: 阵列场响应与运动}
    outputs:
    - {en: CIR/complex coefficients generated by the implementation, zh: 实现生成的CIR/复系数}
    - {en: State records for enabled extensions, zh: 所启用扩展的状态记录}
    controls:
    - {en: 'Researcher specifies: time sampling, extension clauses, and their parameters', zh: 研究者固定：时间采样、扩展条款及其参数}
    - {en: 'For CDL/TDL, explicitly state use of §7.7 instead of claiming the complete layout-generation workflow', zh: CDL/TDL应明确使用§7.7而非声称执行完整布局生成链}
    checks:
    - {en: Validate individual clauses before combining them, zh: 先验证单条款再组合}
    - {en: Check the software's claimed version against its implemented subset, zh: 检查软件宣称的版本与实际实现子集}
  - title: {en: Calibrate the implementation and export task data, zh: 校准实现与导出任务数据}
    detail: {en: 'Check statistical and implementation consistency, then convert outputs to CFR, waveforms, or network inputs; the specification itself does not provide ready-to-train samples.', zh: 研究者检验统计与实现一致性，再转CFR、波形或网络输入；规范文件本身不提供可直接训练的数据样本。}
    inputs:
    - {en: Software outputs, zh: 软件输出}
    - {en: Specification calibration references or small analytical examples, zh: 规范校准参考或解析小例子}
    outputs:
    - {en: Calibration results, zh: 校准结果}
    - {en: Researcher-generated data and configuration, zh: 研究者生成的数据与配置}
    controls:
    - {en: 'Researcher specifies: calibration scenario, error statistics, task normalization, and splits', zh: 研究者固定：校准场景、误差统计、任务归一化和切分}
    checks:
    - {en: Avoid counting pathloss multiple times across tools, zh: 避免多个工具重复计入pathloss}
    - {en: Passing standards calibration does not establish on-site OTA calibration, zh: 不能把标准校准通过等同现场OTA校准}
  scope: {en: Generation logic in TR 38.901 V19.2.0; execution requires a specific software implementation., zh: TR38.901 V19.2.0规范的生成逻辑；必须由具体软件实现执行。}
