summary: {en: 'Channel impulse response recordings of a vehicle-to-vehicle link at about 60 GHz with 8 GHz bandwidth, with two oncoming cars on a campus road. The data consists of almost 1000 CIR recordings in MAT files.', zh: 两辆相向行驶汽车在校园道路上的车对车链路信道冲激响应（CIR）记录，中心频率约60 GHz，带宽8 GHz。数据为MAT文件，共近1000条CIR记录。}
