checked: '2026-11-06'
overview: {en: 'The V2V Millimeter-Wave Channel Measurements at 56-64 GHz dataset holds channel impulse response (CIR) recordings of a vehicle-to-vehicle link, from Brno University of Technology. The campaign used a center frequency of about 60 GHz and 8 GHz of bandwidth. The scenario is two oncoming cars on a two-lane road on the campus of the university. The data consist of two independent runs with 468 CIR realizations each, almost 1,000 recordings in total, stored in run1.mat and run2.mat with a time vector in t.MAT. The related paper, Vehicle-to-Vehicle Millimeter-Wave Channel Measurements at 56-64 GHz, was presented at VTC2019-Fall. The archive is 113.6 MB under CC BY 4.0 and requires an IEEE DataPort subscription.', zh: 56-64 GHz V2V 毫米波信道测量数据集包含一条车对车（V2V）链路的信道冲激响应（CIR）记录，由布尔诺理工大学（Brno University of Technology）提供。中心频率约 60 GHz，带宽 8 GHz。场景为校园双车道道路上两辆相向行驶的汽车。数据包含两次独立测量，每次 468 条 CIR 实现，共近 1000 条记录，分别存于 run1.mat 与 run2.mat，时间向量存于 t.MAT。相关论文为 Vehicle-to-Vehicle Millimeter-Wave Channel Measurements
    at 56-64 GHz，发表于 VTC2019-Fall。压缩包为 113.6 MB，许可协议为 CC BY 4.0，访问需要 IEEE DataPort 订阅。}
signal_details:
- signal: cir
  text: {en: 'Channel impulse response realizations, 468 per run and almost 1000 in total, stored as MAT files run1.mat and run2.mat, with a time vector in t.MAT. Center frequency around 60 GHz with 8 GHz bandwidth.', zh: 信道冲激响应（CIR）实现，每次测量 468 条，共近 1000 条，以 MAT 文件 run1.mat 与 run2.mat 存储，时间向量存于 t.MAT。中心频率约 60 GHz，带宽 8 GHz。}
pipeline:
  summary: {en: Two cars pass each other on a campus road while a correlative time-domain channel sounder records channel impulse responses. The recordings are released as MAT files with a time vector., zh: 两辆汽车在校园道路上相向通过，同时由相关型时域信道探测仪记录信道冲激响应。记录以 MAT 文件发布，并附带时间向量。}
  stages:
  - title: {en: Measurement campaign, zh: 测量活动}
    detail: {en: The campaign records several passes of two oncoming cars on a two-lane road on the Brno University of Technology campus. It consists of two independent runs., zh: 测量活动记录布尔诺理工大学校园双车道道路上两辆相向汽车的多次通过，共两次独立测量。}
    inputs:
    - {en: two vehicles on a two-lane campus road, zh: 校园双车道道路上的两辆车}
  - title: {en: Channel sounding, zh: 信道探测}
    detail: {en: A correlative time-domain channel sounder operating around 60 GHz with 8 GHz of bandwidth records the channel during the passes., zh: 工作在约 60 GHz、带宽 8 GHz 的相关型时域信道探测仪在车辆通过期间记录信道。}
    outputs:
    - {en: channel impulse response recordings, zh: 信道冲激响应记录}
  - title: {en: CIR realizations, zh: CIR 实现}
    detail: {en: 'Each run contributes 468 CIR realizations, giving almost 1000 CIR recordings in total.', zh: 每次测量产生 468 条 CIR 实现，共近 1000 条 CIR 记录。}
    outputs:
    - {en: 468 CIR realizations per run, zh: 每次测量 468 条 CIR 实现}
  - title: {en: Packaging, zh: 数据打包}
    detail: {en: 'The data are stored as run1.mat and run2.mat, with a time vector in t.MAT. An example MATLAB plotting script, V2V_CIR_show.m, is included.', zh: 数据存为 run1.mat 与 run2.mat，时间向量存于 t.MAT。随数据附带一个示例 MATLAB 绘图脚本 V2V_CIR_show.m。}
    outputs:
    - {en: 'run1.mat, run2.mat and t.MAT', zh: run1.mat、run2.mat 与 t.MAT}
facts:
- label: {en: Reference analysis, zh: 参考论文分析}
  text: {en: 'The related paper evaluates RMS delay spread as a function of received power, temporal decorrelation of the channel impulse response, and the Pearson correlation coefficient as a function of received power.', zh: 相关论文分析了 RMS 时延扩展随接收功率的变化、信道冲激响应的时间去相关性，以及 Pearson 相关系数随接收功率的变化。}
- label: {en: Licence identifier, zh: 许可证标识}
  text: {en: 'DataCite lists Creative Commons Attribution 4.0 International for DOI 10.21227/cfvn-hp41, while the IEEE DataPort page reads Creative Commons Attribution.', zh: DataCite 为 DOI 10.21227/cfvn-hp41 列出的许可是 Creative Commons Attribution 4.0 International，而 IEEE DataPort 页面写的是 Creative Commons Attribution。}
capabilities:
- key: csi
  status: derivable
  note: {en: Computed from the provided impulse response by a Fourier transform., zh: 由所提供的冲激响应做傅里叶变换得到。}
- key: cir
  status: provided
  note: {en: '468 CIR realizations per run in two runs, almost 1000 in total, stored in run1.mat and run2.mat.', zh: 两次测量各 468 条 CIR 实现，共近 1000 条，存于 run1.mat 与 run2.mat。}
- key: paths
  status: none
  note: {en: 'Only CIR realizations are released; per-path delays, angles and powers are not extracted.', zh: 仅发布 CIR 实现，未提取每径时延、角度与功率。}
- key: interaction
  status: none
  note: {en: No per-path interaction or geometry data are released., zh: 未发布每径交互或几何数据。}
- key: power
  status: derivable
  note: {en: 'Received power per CIR realization follows from the stored impulse responses, as in the reference paper analysis; it is not stored as a separate field.', zh: 每条 CIR 实现的接收功率可由所存冲激响应计算，与参考论文的分析一致；数据中未单独存储该字段。}
- key: iq
  status: none
  note: {en: Only processed CIR realizations and a time vector are listed; no raw I/Q samples., zh: 仅列出处理后的 CIR 实现与时间向量，无原始 I/Q 采样。}
- key: beam_labels
