summary: {en: 'Sample covariance matrix snapshots from a four-element ULA of coherent RTL-SDR receivers (KerberosSDR), recorded from 868 MHz LoRa beacons in open-area, office, corridor and interior-to-outdoor settings. Nearly 50k measured snapshots, over 2.6 million including augmentation, with ground-truth AoA labels from -70 to 70 degrees in 10-degree steps.', zh: 来自四元件 ULA 的采样协方差矩阵快照，由四路相干 RTL-SDR 接收机（KerberosSDR）接收 868 MHz LoRa 信标，场景包括开阔区域、办公室、走廊及室内到室外。实测快照近 5 万个，含数据增强后超过 260 万个，附带 -70 至 70 度、步长 10 度的 AoA 真值标签。}
sources: ['https://arxiv.org/abs/2112.00695', 'https://ar5iv.labs.arxiv.org/html/2112.00695', 'https://raw.githubusercontent.com/zdai257/DeepAoANet/master/README.md', 'https://aston.box.com/v/deepaoanet-zdai', 'https://api.crossref.org/works/10.1109/ACCESS.2021.3140146', 'https://api.github.com/repos/zdai257/DeepAoANet', 'https://arxiv.org/abs/2112.00695v1', 'https://arxiv.org/abs/2112.00695v2', 'http://export.arxiv.org/api/query?id_list=2112.00695', 'https://github.com/zdai257/DeepAOANet/releases', 'https://github.com/zdai257/DeepAOANet/commits/master']
checked: '2026-11-06'
overview: {en: 'The DeepAoANet SDR AoA dataset contains sample covariance matrix snapshots from a four-element ULA of coherent RTL-SDR receivers (KerberosSDR), recorded from intermittent LoRa beacons at 868 MHz. Dai et al. describe the dataset in the DeepAoANet paper, posted to arXiv in December 2021 and published in IEEE Access, volume 10 (2022). Nearly 50,000 measured snapshots were collected in an open area, an open area with copper reflectors, an office, a corridor and interior-to-outdoor settings, and phase-shift and synthetic superposition augmentation brings the total to over 2.6 million. Ground-truth AoA labels run from -70 to 70 degrees in 10-degree steps, and the phase-shift augmentation extends the field of view to -74 to 74 degrees. The dataset is one Archive.zip of about 48.9 GB on a Box share, and the code repository processes its raw AoA ROS bags into .pkl dataframes. The raw data were recorded with a LoRa transmitter only, and the README recommends fine-tuning with local
    signals before use on other signals.', zh: DeepAoANet SDR AoA 数据集包含来自四元件 ULA 的采样协方差矩阵快照，由四路相干 RTL-SDR 接收机（KerberosSDR）接收 868 MHz 的间歇性 LoRa 信标。Dai 等人在 DeepAoANet 论文中描述了该数据集，论文于 2021 年 12 月发布在 arXiv 上，并以 IEEE Access 第 10 卷（2022 年）正式发表。实测快照近 5 万个，采集场景包括开阔区域、带铜板反射体的开阔区域、办公室、走廊以及室内到室外；经相位偏移与合成叠加增强后，总数超过 260 万。AoA 真值标签范围为 -70 至 70 度，步长 10 度；相位偏移增强将视场扩展到 -74 至 74 度。数据为 Box 共享站点上的一个约 48.9 GB 的 Archive.zip，代码仓库将其中的原始 AoA ROS bag 处理为 .pkl dataframe。原始数据仅使用 LoRa 发射机采集，README 建议在用于其他信号前先用本地信号进行微调。}
signal_details:
- signal: iq
  text: {en: 'Four-channel IQ from a KerberosSDR (four coherent RTL-SDRs) with a centre frequency of 868 MHz, a sampling rate of 2 MHz, a bandwidth of 125 kHz and a uniform gain of 22.9 dB on all channels. The sampling window is 2^15 samples, and each snapshot is a 4x4x8 sample covariance matrix, i.e. 128 floating-point values, computed from 8 sliding windows of 2^12 samples. Data are recorded in ROS bags, and the code converts them to .pkl dataframes.', zh: 来自 KerberosSDR（四路相干 RTL-SDR）的四通道 IQ，中心频率 868 MHz，采样率 2 MHz，带宽 125 kHz，四个通道统一增益 22.9 dB。采样窗口为 2^15 个样本，每个快照是 4x4x8 的采样协方差矩阵，即 128 个浮点数，由 8 个长度为 2^12 个样本的滑动窗口计算得到。数据以 ROS bag 形式记录，代码将其转换为 .pkl dataframe。}
pipeline:
  summary: {en: 'LoRa beacons are recorded by a four-channel SDR with GPS-derived AoA labels, converted to covariance snapshots, augmented by phase shifts and superposition, then packaged as ROS bags and dataframes.', zh: 四通道 SDR 记录 LoRa 信标并附带由 GPS 推导的 AoA 标签，随后转换为协方差快照，经相位偏移与叠加增强，最后打包为 ROS bag 与 dataframe。}
  stages:
  - title: {en: Receiver setup, zh: 接收机设置}
    detail: {en: 'A KerberosSDR with four whip antennas at an inter-element spacing factor of 0.2 is tuned to 868 MHz with a 2 MHz sampling rate and 125 kHz bandwidth. Antennas are disconnected while the noise source is active for sample and phase synchronization, then reconnected, and a band-pass FIR filter with 100 taps and decimation 4 is applied at the centre frequency.', zh: 四根鞭状天线、单元间距因子为 0.2 的 KerberosSDR 调谐至 868 MHz，采样率 2 MHz，带宽 125 kHz。同步时断开天线并启用噪声源完成采样与相位同步，之后重新连接天线，并在中心频率处施加 100 抽头、抽取因子为 4 的带通 FIR 滤波器。}
    inputs:
    - {en: KerberosSDR and four whip antennas, zh: KerberosSDR 与四根鞭状天线}
    outputs:
    - {en: phase-synchronized four-channel IQ, zh: 相位同步的四通道 IQ}
  - title: {en: Transmitter and AoA labels, zh: 发射机与 AoA 标签}
    detail: {en: 'A Dragino LoRa-GPS board stacked on a Raspberry Pi 4 transmits LoRa beacons at 0.5 Hz with spreading factor 11, carrying full NMEA messages. Ground-truth AoA is derived from relative GPS positions and a compass for direction alignment, with labels from -70 to 70 degrees in 10-degree steps.', zh: 叠放在 Raspberry Pi 4 上的 Dragino LoRa-GPS 板以 0.5 Hz 发送扩频因子为 11 的 LoRa 信标，负载为完整 NMEA 语句。AoA 真值由相对 GPS 位置及用于方向对齐的罗盘得到，标签范围为 -70 至 70 度，步长 10 度。}
    inputs:
    - {en: relative GPS positions and compass heading, zh: 相对 GPS 位置与罗盘方位}
    outputs:
    - {en: AoA ground-truth labels, zh: AoA 真值标签}
  - title: {en: Covariance snapshots, zh: 协方差快照}
    detail: {en: 'Each snapshot uses 8 sliding windows of 2^12 samples taken from a 2^15-sample sampling window, forming a 4x4x8 sample covariance feature of 128 values. Inputs are normalized with standard scaling.', zh: 每个快照使用从 2^15 个样本采样窗口中截取的 8 个长度为 2^12 个样本的滑动窗口，形成 4x4x8 的采样协方差特征，共 128 个值。输入经标准化缩放处理。}
    inputs:
    - {en: four-channel IQ windows, zh: 四通道 IQ 窗口}
    outputs:
    - {en: 128-value covariance feature per snapshot, zh: 每个快照 128 个值的协方差特征}
  - title: {en: Augmentation, zh: 数据增强}
    detail: {en: 'Angular shifts of -4, -2, 2 and 4 degrees are applied to the raw snapshots as phase shifts across the array elements, which extends the labels and gives a field of view from -74 to 74 degrees. Two-source samples are synthesized by superposing IQ recorded at different AoAs in non-LOS scenarios, with a random phase difference between the carriers.', zh: 对原始快照施加 -4、-2、2 和 4 度的角度偏移，并以阵元间相位偏移的形式实现，从而扩展标签并使视场达到 -74 至 74 度。双源样本由非视距场景中不同 AoA 下记录的 IQ 叠加合成，载波之间引入随机相位差。}
    inputs:
    - {en: single-source snapshots and non-LOS IQ, zh: 单源快照与非视距 IQ}
    outputs:
    - {en: augmented single-source and two-source samples, zh: 增强后的单源与双源样本}
  - title: {en: Packaging as ROS bags and dataframes, zh: 打包为 ROS bag 与 dataframe}
    detail: {en: 'ROS is used for both field recording and data synthesis. The repository scripts Create_Synthetic.py and Multilabel_Create_Synthetic.py create augmented rosbags from raw AoA rosbags, and AOAsingle_main.py and AOAmultilabel_main.py convert the rosbags to .pkl dataframes.', zh: ROS 同时用于现场采集与数据合成。仓库脚本 Create_Synthetic.py 和 Multilabel_Create_Synthetic.py 由原始 AoA rosbag 生成增强 rosbag，AOAsingle_main.py 和 AOAmultilabel_main.py 将 rosbag 转换为 .pkl dataframe。}
    inputs:
    - {en: raw AoA rosbags, zh: 原始 AoA rosbag}
    outputs:
    - {en: augmented rosbags and .pkl dataframes, zh: 增强 rosbag 与 .pkl dataframe}
bandwidth_mhz: 0.125
standard: LoRa
facts:
- label: {en: Label format, zh: 标签格式}
  text: {en: 'Each label is (L, θ1, θ2), where L is the number of sources. θ1 is set when one source is present, and for two sources both angles are stored in ascending order.', zh: '每个标签为 (L, θ1, θ2)，其中 L 为信号源数量。存在单个信号源时填写 θ1；存在两个信号源时，两个角度按升序存放。'}
- label: {en: Composition, zh: 数据构成}
  text: {en: 'Table III splits the snapshots by scenario (LOS, LOS with rotating copper reflectors, NLOS office, NLOS corridor, NLOS interior-to-outdoor, and two-source combinations) into raw, phase-shifted and synthetic counts.', zh: Table III 按场景（LOS、带旋转铜板反射体的 LOS、NLOS 办公室、NLOS 走廊、NLOS 室内到室外，以及双源组合）列出快照的原始、相位偏移和合成数量。}
capabilities:
- key: csi
  status: derivable
  note: {en: 'Per-antenna complex IQ is released; the stored 4x4x8 features are sample covariance matrices, not channel matrices.', zh: 已发布每天线的复数 IQ；存储的 4x4x8 特征为采样协方差矩阵，而非信道矩阵。}
- {key: cir, status: unknown}
- key: paths
  status: unknown
  note: {en: 'Released labels are source AoAs from GPS geometry; per-path delays, powers and phases are not described.', zh: 发布的标签为基于 GPS 几何得到的信源 AoA；未描述每径时延、功率和相位。}
- key: interaction
  status: unknown
  note: {en: 'Copper-reflector and NLOS settings are described, but per-path interaction points are not labelled.', zh: 描述了铜板反射体和 NLOS 场景，但未标注每径的交互点。}
- key: power
  status: derivable
  note: {en: Per-channel received power follows from the released IQ; no RSSI or beam power field is described., zh: 每通道接收功率可由发布的 IQ 计算；未描述 RSSI 或波束功率字段。}
- key: iq
  status: provided
  note: {en: 'Four-channel IQ at 868 MHz, 2 MHz sampling rate, 125 kHz bandwidth, single KerberosSDR configuration.', zh: 四通道 IQ，中心频率 868 MHz，采样率 2 MHz，带宽 125 kHz，单一 KerberosSDR 配置。}
- key: beam_labels
  status: none
  note: {en: No beam index or per-beam gain is described; the labels are AoA values., zh: 未描述波束索引或每波束增益；标签为 AoA 值。}
- key: position
  status: unknown
  note: {en: GPS positions were used to derive the labels; the release is described with AoA labels only., zh: GPS 位置用于推导标签；发布内容描述为 AoA 标签。}
- {key: geometry, status: unknown}
- {key: materials, status: unknown}
- key: rgb
  status: none
  note: {en: The dataset lists IQ as its only signal; no image data are described., zh: 数据集仅列出 IQ 信号；未描述图像数据。}
- key: depth
  status: none
  note: {en: The dataset lists IQ as its only signal; no depth data are described., zh: 数据集仅列出 IQ 信号；未描述深度数据。}
- key: lidar
  status: none
  note: {en: The dataset lists IQ as its only signal; no LiDAR data are described., zh: 数据集仅列出 IQ 信号；未描述 LiDAR 数据。}
- key: radar
  status: none
  note: {en: The dataset lists IQ as its only signal; no radar data are described., zh: 数据集仅列出 IQ 信号；未描述雷达数据。}
- key: imu
  status: none
  note: {en: A compass is used only to align labels; no IMU stream is described., zh: 罗盘仅用于对齐标签；未描述 IMU 数据流。}
- key: time_series
  status: unknown
  note: {en: Snapshots come from intermittent 0.5 Hz beacons; timestamps and temporal ordering are not described., zh: 快照来自间歇发送的 0.5 Hz 信标；未描述时间戳和时序。}
- key: multiuser
  status: provided
  note: {en: 'Two-source samples are synthetic superpositions of single-source recordings at different AoAs, not jointly recorded users.', zh: 双源样本是由不同 AoA 下的单源记录合成的叠加，并非同时记录的多个用户。}
- key: multibs
  status: none
  note: {en: A single four-element receiver is used., zh: 仅使用单个四元件接收机。}
- key: crossfreq
  status: none
  note: {en: Single 868 MHz band only., zh: 仅有 868 MHz 单一频段。}
- key: near_field
  status: none
  note: {en: The model uses a plane-wave steering vector; near-field array modelling is not described., zh: 模型采用平面波导向矢量；未描述近场阵列建模。}
- key: high_mobility
  status: none
  note: {en: The receiver is static in the reported experiments; no moving users with a stated speed are described., zh: 报告的实验中接收机静止；未描述速度明确的移动用户。}
- {key: dynamic_blockage, status: unknown}
- key: reflection
  status: provided
  note: {en: 'inherent in the measurement, not labelled per path', zh: 由测量本身包含，未按径标注。}
- key: diffraction
  status: provided
  note: {en: 'inherent in the measurement, not labelled per path', zh: 由测量本身包含，未按径标注。}
- key: scattering
  status: provided
  note: {en: 'inherent in the measurement, not labelled per path', zh: 由测量本身包含，未按径标注。}
- key: transmission
  status: provided
  note: {en: 'inherent in the measurement, not labelled per path', zh: 由测量本身包含，未按径标注。}
- key: polarization
  status: unknown
  note: {en: Four whip antennas are described; no polarimetric measurement is described., zh: 描述了四根鞭状天线；未描述极化测量。}
- {key: em_field, status: unknown}
