summary: {en: 'Python-generated baseband Bluetooth 5.1 signals and pure-tone data for an 8-element URA, with additive noise and coherent interfering signals at random arrival angles. The dataset is distributed in four parts.', zh: 由 Python 生成器产生的 Bluetooth 5.1 基带信号与纯音数据，面向 8 元 URA 阵列，包含加性噪声以及随机到达角的相干干扰信号。数据集分为四个部分发布。}
