technical_notes:
- {en: 'The X3D description lists reflection, transmission, diffraction, atmospheric absorption and diffuse scattering; the versions table lists diffuse scattering under the Professional edition.', zh: X3D 说明列出反射、透射、绕射、大气吸收和漫散射；版本对比表将漫散射列为 Professional 版功能。}
- {en: Calculations use measured or simulated 3D antenna patterns with full polarization and phase information., zh: 计算使用包含完整极化和相位信息的实测或仿真三维天线方向图。}
- {en: 'Exact path correction moves shooting-and-bouncing ray paths so that they end at the exact receiver location, instead of at a collection sphere around the receiver.', zh: 精确路径修正使弹跳射线路径终止于精确的接收点位置，而不是接收点周围的收集球面。}
limitations:
- {en: 'Diffuse scattering, Engineered Electromagnetic Surfaces and adjacent path generation are listed as Professional-edition capabilities, so the Standard edition does not provide them.', zh: 漫散射、工程电磁表面（EES）和邻近路径生成被列为 Professional 版功能，Standard 版不提供这些功能。}
- {en: The cited sources are vendor product pages; they describe capabilities and do not report measurement validation., zh: 所引用的来源均为厂商产品页面，描述的是功能，不包含测量验证结果。}
history:
- {en: Release 4.0 adds a mobility framework for time-based movement of transceivers and objects in a user-defined scene., zh: 4.0 版本新增移动框架，可在用户定义的场景中模拟收发端与对象随时间的运动。}
usage:
- {en: 'Confirm the edition (Standard, Professional or MIMO) first, because diffuse scattering, EES, fast ray-based models and MIMO tools differ between editions.', zh: 先确认版本（Standard、Professional 或 MIMO），因为漫散射、EES、快速射线模型和 MIMO 工具在各版本之间有所不同。}
- {en: MIMO capacity analysis uses multi-port S-parameters to capture mutual coupling between antenna elements., zh: MIMO 容量分析可使用多端口 S 参数描述天线单元之间的互耦。}
- {en: 'Export channel results to ASCII or MATLAB format for post-processing, and export MIMO results to CSV.', zh: 信道结果可导出为 ASCII 或 MATLAB 格式用于后处理，MIMO 结果可导出为 CSV。}
tools: [project-raymobtime-pipeline]
overview: {en: 'Wireless InSite is a commercial propagation prediction suite from Remcom, based in State College, Pennsylvania. It combines 3D ray tracing (the X3D model and the legacy Full 3D model) for indoor, urban and rural environments, including indoor-outdoor propagation, and the Professional edition adds fast ray-based and empirical models. It predicts coverage, multipath channel characteristics and throughput for 5G, 6G and WiFi networks. The X3D model includes reflections, transmissions, diffractions and atmospheric absorption, places no restriction on geometry shape or transmitter and receiver height, and supports frequencies up to 100 GHz; diffuse scattering depends on the edition. Outputs include received power, path loss, electric field, propagation paths, delay spread, angles of arrival and departure, power delay profile, complex impulse responses, and MIMO results such as SINR, BER and throughput, which can be exported to ASCII or MATLAB format. Release 4.0 adds time-based
    mobility of transceivers and objects within a user-defined scene. The product is sold in Standard, Professional and MIMO editions, and the capabilities differ by edition.', zh: Wireless InSite 是 Remcom 公司开发的商业无线传播预测软件套件，公司位于美国宾夕法尼亚州 State College。套件包括三维射线追踪（X3D 模型及旧版 Full 3D 模型），适用于室内、城市、农村及室内外混合传播场景；Professional 版另含快速射线方法与经验模型。它用于预测 5G、6G 和 WiFi 网络的覆盖、多径信道特性与吞吐量。X3D 模型包含反射、透射、绕射和大气吸收，对几何形状及收发端高度没有限制，频率最高支持 100 GHz；漫散射取决于版本。输出包括接收功率、路径损耗、电场、传播路径、时延扩展、到达角与出发角、功率时延分布、复冲激响应，以及 SINR、BER、吞吐量等 MIMO 结果，并可导出为 ASCII 或 MATLAB 格式。4.0 版本新增用户定义场景中收发端与对象随时间移动的功能。该产品以 Standard、Professional 和 MIMO 版本销售，各版本功能不同。}
signal_details:
- signal: pathloss
  text: {en: 'The channel outputs include received power and path loss at each receiver point. The communications analysis adds SINR, throughput, capacity and bit error rate, and identifies coverage outages. Results can be plotted along routes or against frequency or time.', zh: 信道输出包括每个接收点的接收功率和路径损耗。通信分析另外给出 SINR、吞吐量、容量和误码率，并识别覆盖中断。结果可沿路线绘制，或随频率、时间变化绘制。}
- signal: paths
  text: {en: 'Propagation paths are native solver outputs, computed from the scene geometry and the interactions enabled in the model. The X3D model corrects shooting-and-bouncing ray paths so that they end at the exact receiver location.', zh: 传播路径是求解器的原生输出，由场景几何和模型中启用的相互作用计算得到。X3D 模型对 SBR 射线路径进行修正，使其终止于精确的接收点位置。}
- signal: cir
  text: {en: 'Complex impulse responses are native outputs. Calculations use 3D antenna patterns with full polarization and phase information, the tool generates time and frequency domain output, and results can be exported to ASCII or MATLAB format for post-processing.', zh: 复冲激响应是原生输出之一。计算使用包含完整极化和相位信息的三维天线方向图，工具可生成时域与频域输出，结果可导出为 ASCII 或 MATLAB 格式以便后处理。}
capabilities:
- key: csi
  status: simulate
  note: {en: H-matrix output is listed for the MIMO edition; the solver also outputs complex impulse responses., zh: H 矩阵输出列于 MIMO 版本；求解器还输出复冲激响应。}
- key: cir
  status: simulate
  note: {en: Complex impulse response with time and frequency domain output is a native solver output., zh: 复冲激响应（含时域与频域输出）是求解器的原生输出。}
- key: paths
  status: simulate
  note: {en: Propagation paths are native solver outputs computed from the scene and enabled interactions., zh: 传播路径是求解器的原生输出，由场景与已启用的相互作用计算得到。}
- {key: interaction, status: unknown}
- key: power
  status: simulate
  note: {en: Received power and path loss are output at each receiver point., zh: 每个接收点输出接收功率与路径损耗。}
- {key: iq, status: unknown}
- {key: beam_labels, status: unknown}
- {key: position, status: unknown}
- key: geometry
  status: simulate
  note: {en: 'Scene geometry (STL, DAE, KMZ, SHP, DXF, DEM, GeoTIFF) is imported by the user as solver input.', zh: 场景几何（STL、DAE、KMZ、SHP、DXF、DEM、GeoTIFF）由用户导入，作为求解器输入。}
- key: materials
  status: provided
  note: {en: A built-in material database is installed with the software; user-defined materials are also supported., zh: 软件自带内置材料库；也支持用户自定义材料。}
- key: rgb
  status: none
  note: {en: A ray-tracing solver with no camera outputs is described., zh: 描述的是射线追踪求解器，不含相机输出。}
- key: depth
  status: none
  note: {en: A ray-tracing solver with no depth outputs is described., zh: 描述的是射线追踪求解器，不含深度输出。}
- key: lidar
  status: none
  note: {en: A ray-tracing solver with no LiDAR outputs is described., zh: 描述的是射线追踪求解器，不含激光雷达输出。}
- key: radar
  status: none
  note: {en: Radar simulation is a separate product (WaveFarer) and not part of Wireless InSite., zh: 雷达仿真是独立产品（WaveFarer），不属于 Wireless InSite。}
- key: imu
  status: none
  note: {en: No motion sensor data is described., zh: 未描述运动传感器数据。}
- key: time_series
  status: simulate
  note: {en: Release 4.0 time-based mobility and dynamic scenarios produce results versus time; sequences require running the solver., zh: 4.0 版本的时间相关移动与动态场景可输出随时间变化的结果；序列需通过运行求解器得到。}
- key: multiuser
  status: simulate
  note: {en: Several transmitters and receivers can be placed in one scene; the number used is set by the user., zh: 同一场景可放置多个收发端，使用数量由用户设置。}
- key: multibs
  status: simulate
  note: {en: 'Multiple transmitters are supported, with strongest base-to-mobile output.', zh: 支持多个发射端，并输出最强基站到移动台的结果。}
- key: crossfreq
  status: simulate
  note: {en: 'Frequency sweeps on the same scene are supported, with band-dependent material tables.', zh: 支持对同一场景进行频率扫描，并提供随频段变化的材料表。}
- {key: near_field, status: unknown}
- {key: high_mobility, status: unknown}
- key: dynamic_blockage
  status: simulate
  note: {en: Dynamic scenario modelling of moving vehicles and pedestrians captures fading over time., zh: 对移动车辆与行人的动态场景建模，可捕捉随时间变化的衰落。}
- key: reflection
  status: simulate
  note: {en: X3D includes reflections; the enabled mechanisms are set per project., zh: X3D 包含反射；各机制是否启用由工程设置。}
- key: diffraction
  status: simulate
  note: {en: X3D includes diffractions; the enabled mechanisms are set per project., zh: X3D 包含绕射；各机制是否启用由工程设置。}
- key: scattering
  status: simulate
  note: {en: Diffuse scattering is a Professional-edition feature., zh: 漫散射为 Professional 版功能。}
- key: transmission
  status: simulate
  note: {en: X3D includes transmissions; the enabled mechanisms are set per project., zh: X3D 包含透射；各机制是否启用由工程设置。}
- key: polarization
  status: simulate
  note: {en: Antenna patterns with full polarization and phase information are used; cross-polarization is output for diffuse scattering., zh: 计算使用包含完整极化与相位信息的天线方向图；漫散射输出含交叉极化。}
- key: em_field
  status: simulate
  note: {en: Electric field magnitude and phase are native outputs., zh: 电场幅度与相位为原生输出。}
