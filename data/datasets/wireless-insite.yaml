summary: {en: 'Commercial propagation-prediction software with X3D, fast-ray, and empirical models; also an upstream engine for several public wireless datasets. A software purchase does not provide the original project for a particular public scenario.', zh: 商业传播预测软件，包含 X3D、快速射线与经验模型；也是多个公开无线数据集的上游。购买软件不等于获得同一公开场景的原始项目。}
checked: '2026-11-06'
pipeline:
  summary: {en: 'Import geometry and materials, place transmitters and receivers with antenna patterns, solve paths and fields with X3D or another model, and export channel and communication results. Results depend on the edition and on the interaction mechanisms enabled in the project.', zh: 导入几何与材料，放置收发端并导入天线方向图，用 X3D 或其他模型求解路径与场强，并导出信道及通信结果。结果取决于版本以及工程中启用的相互作用机制。}
  stages:
  - title: {en: Prepare the scene, zh: 准备场景}
    detail: {en: 'Import city, indoor, terrain and foliage geometry (STL, DAE/KMZ, SHP, DXF, DEM, GeoTIFF and other formats), crop the scene and assign material properties. City geometry can be processed for building association, simplification and error checking.', zh: 导入城市、室内、地形和植被几何（STL、DAE/KMZ、SHP、DXF、DEM、GeoTIFF 等格式），裁剪场景并指定材料属性。城市几何可进行建筑关联、简化和错误检查。}
    inputs:
    - {en: 'City, indoor, terrain and foliage data', zh: 城市、室内、地形与植被数据}
    - {en: Material properties from the installed database or user libraries, zh: 内置材料库或用户材料库中的材料属性}
    outputs:
    - {en: Scene with materials and cached geometry, zh: 带材料属性和几何缓存的场景}
  - title: {en: 'Place transmitters, receivers and antennas', zh: 放置收发端与天线}
    detail: {en: 'Define receiver points, trajectories, arcs, planar surfaces, and cylindrical or spherical surfaces. Import measured or simulated antenna patterns from XFdtd, Odyssey or MSI Planet, or convert other solver or measurement data into the standard 3D pattern format. MIMO arrays are built in the array builder.', zh: 定义接收点、轨迹、弧线、平面、柱面或球面接收集合。可导入 XFdtd、Odyssey 或 MSI Planet 的实测或仿真天线方向图，也可将其他求解器或测量数据转换为标准三维方向图格式。MIMO 阵列在阵列构建器中建立。}
    inputs:
    - {en: Transmitter and receiver positions or grids, zh: 收发端位置或网格}
    - {en: Antenna patterns, zh: 天线方向图}
    outputs:
    - {en: Link set with antenna configuration, zh: 带天线配置的链路集合}
  - title: {en: Select the propagation model, zh: 选择传播模型}
    detail: {en: 'Choose X3D (CPU or GPU, exact path correction and adjacent path generation), the legacy Full 3D model (shooting-and-bouncing rays or Eigenray), the 2D vertical-plane model, or the fast ray-based and empirical models of the Professional edition. Enable reflection, transmission, diffraction, atmospheric absorption and diffuse scattering as the edition allows.', zh: 选择 X3D（支持 CPU 或 GPU、精确路径修正和邻近路径生成）、旧版 Full 3D 模型（弹跳射线法或 Eigenray）、二维垂直平面模型，或 Professional 版的快速射线与经验模型。在版本允许的范围内启用反射、透射、绕射、大气吸收和漫散射。}
    controls:
    - {en: 'Diffuse scattering model: Lambertian, Directive, Directive with Backscatter, or Degli-Esposti', zh: 漫散射模型：Lambertian、Directive、Directive with Backscatter 或 Degli-Esposti}
  - title: {en: Run the solver with mobility and uncertainty, zh: 运行求解，包括移动与不确定性分析}
    detail: {en: 'Compute paths, fields and powers. Release 4.0 models time-based movement of transceivers and objects. Monte Carlo analysis defines material properties, frequency and transmit power as distributions and propagates their uncertainty to received power and path loss.', zh: 计算路径、场强与功率。4.0 版本可模拟收发端与对象随时间的运动。蒙特卡洛分析可将材料属性、频率和发射功率定义为分布，并把它们的不确定性传递到接收功率和路径损耗。}
    controls:
    - {en: Partitioning of transmitters and receivers sets how many simulations run at once, zh: 收发端分区决定同时运行的仿真数量}
  - title: {en: Export and evaluate communications, zh: 导出并评估通信指标}
    detail: {en: 'Export received power, path loss, electric field, delay spread, angles, power delay profiles, complex impulse responses and H-matrices to ASCII or MATLAB format. The communications analyzer computes SINR, throughput, capacity, BER and coverage outages, and MIMO results can be exported to CSV.', zh: 将接收功率、路径损耗、电场、时延扩展、角度、功率时延分布、复冲激响应和 H 矩阵导出为 ASCII 或 MATLAB 格式。通信分析器计算 SINR、吞吐量、容量、误码率和覆盖中断，MIMO 结果可导出为 CSV。}
    outputs:
    - {en: Exported channel files and communication metrics, zh: 导出的信道文件与通信指标}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: 'Received power, path loss, electric field, delay spread, angles of arrival and departure, power delay profile, radiation hazard quantities, complex impulse responses and H-matrices; for MIMO, SINR, BER, throughput and capacity.', zh: 接收功率、路径损耗、电场、时延扩展、到达角与出发角、功率时延分布、辐射危害量、复冲激响应与 H 矩阵；MIMO 情形下还包括 SINR、BER、吞吐量和容量。}
- label: {en: Editions, zh: 版本}
  text: {en: 'Standard provides 2D and 3D ray tracing for urban, indoor and longer-range rural scenarios. Professional adds fast ray-based and empirical models, diffuse scattering and Engineered Electromagnetic Surfaces. MIMO adds the MIMO array builder, MIMO simulation optimization and throughput analysis on top of Professional.', zh: Standard 提供用于城市、室内和较远距离农村场景的二维与三维射线追踪。Professional 增加快速射线与经验模型、漫散射和工程电磁表面（EES）。MIMO 在 Professional 基础上增加 MIMO 阵列构建器、MIMO 仿真优化和吞吐量分析。}
- label: {en: Geometry and terrain formats, zh: 几何与地形格式}
  text: {en: 'Geometry formats include STL, DAE, KMZ, SHP and DXF. Terrain formats include DEM, DTED, JDEM, SDTS, ASCII grid and GeoTIFF.', zh: 几何格式包括 STL、DAE、KMZ、SHP 和 DXF；地形格式包括 DEM、DTED、JDEM、SDTS、ASCII Grid 和 GeoTIFF。}
- label: {en: Licensing, zh: 授权}
  text: {en: 'The product is sold through a request-pricing process, and one year of Remcom Professional Support is included with each purchase.', zh: 该产品通过申请报价方式销售，每次购买包含一年 Remcom Professional Support。}
- label: {en: Reproduction notes, zh: 复现说明}
  text: {en: This record does not include a run of the commercial software., zh: 本条目不包含对该商业软件的运行记录。}
