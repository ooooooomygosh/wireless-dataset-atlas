tools: [project-raymobtime-pipeline]
overview: {en: 'Wireless InSite is a commercial propagation prediction suite from Remcom, based in State College, Pennsylvania. It combines 3D ray tracing (the X3D model and a legacy Full 3D model), fast ray-based methods and empirical models for outdoor, indoor, indoor-to-outdoor and outdoor-to-indoor applications. It predicts coverage, multipath channel characteristics and throughput for 5G, 6G and WiFi networks. The X3D model includes reflections, transmissions, diffractions and atmospheric absorption, and diffuse scattering depending on the edition; it places no restriction on geometry shape or transmitter and receiver height, and it supports frequencies up to 100 GHz. Outputs include received power, path loss, electric field, propagation paths, delay spread, angles of arrival and departure, power delay profile, complex impulse responses and MIMO results such as SINR and throughput, which can be exported to ASCII or MATLAB formats. Release 4.0 adds time-based mobility of transceivers
    and objects. The product is sold in Standard, Professional and MIMO editions, and the capabilities differ by edition.', zh: Wireless InSite 是 Remcom 公司开发的商业无线传播预测软件套件，公司位于美国宾夕法尼亚州 State College。套件包括三维射线追踪（X3D 模型及旧版 Full 3D 模型）、快速射线方法以及经验模型，适用于室外、室内、室内到室外和室外到室内场景。它用于预测 5G、6G 和 WiFi 网络的覆盖、多径信道特性与吞吐量。X3D 模型包含反射、透射、绕射和大气吸收，根据版本还包含漫散射；对几何形状和收发端高度没有限制，频率最高支持 100 GHz。输出包括接收功率、路径损耗、电场、传播路径、时延扩展、到达角与出发角、功率时延分布、复冲激响应，以及 SINR、吞吐量等 MIMO 结果，可导出为 ASCII 或 MATLAB 格式。4.0 版本新增收发端与对象的时间相关移动功能。该产品以 Standard、Professional 和 MIMO 版本销售，各版本功能不同。}
signal_details:
- signal: pathloss
  text: {en: 'The channel outputs include received power and path loss at each receiver point. The communications analysis adds SINR, throughput, capacity and bit error rate, and identifies coverage outages. Results can be plotted along routes or against frequency or time.', zh: 信道输出包括每个接收点的接收功率和路径损耗。通信分析另外给出 SINR、吞吐量、容量和误码率，并识别覆盖中断。结果可沿路线绘制，或随频率、时间变化绘制。}
- signal: paths
  text: {en: 'Propagation paths are native solver outputs, computed from the scene geometry and the interactions enabled in the model. The X3D model corrects shooting-and-bouncing ray paths so that they end at the exact receiver location.', zh: 传播路径是求解器的原生输出，由场景几何和模型中启用的相互作用计算得到。X3D 模型对 SBR 射线路径进行修正，使其终止于精确的接收点位置。}
- signal: cir
  text: {en: 'Complex impulse responses are native outputs. Calculations use 3D antenna patterns with full polarization and phase information, the tool generates time and frequency domain output, and results can be exported to ASCII or MATLAB format for post-processing.', zh: 复冲激响应是原生输出之一。计算使用包含完整极化和相位信息的三维天线方向图，工具可生成时域与频域输出，结果可导出为 ASCII 或 MATLAB 格式以便后处理。}
