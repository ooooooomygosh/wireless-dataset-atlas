summary: {en: 'Commercial propagation-prediction software with X3D, fast-ray, and empirical models; also an upstream engine for several public wireless datasets. A software purchase does not provide the original project for a particular public scenario.', zh: 商业传播预测软件，包含 X3D、快速射线与经验模型；也是多个公开无线数据集的上游。购买软件不等于获得同一公开场景的原始项目。}
checked: '2026-11-06'
pipeline:
  summary: {en: 'Import geometry and materials, configure wireless devices and propagation mechanisms, solve paths/fields, and export channel results. A public dataset uses one particular fixed project configuration.', zh: 导入几何和材料，设置无线设备与传播机制，求得路径/场强后导出信道结果。公开数据集采用的是其中一个固定工程配置。}
  stages:
  - title: {en: Prepare the scene project, zh: 准备场景工程}
    detail: {en: 'Create or import the propagation environment and check object topology, dimensions, and materials. The scene project determines which blocking and reflecting structures can be resolved.', zh: 建立或导入传播环境，并检查物体拓扑、尺寸和材料。场景工程决定可解析的遮挡与反射结构。}
    inputs:
    - {en: 'CAD/GIS, terrain, and buildings', zh: CAD/GIS、地形和建筑}
    - {en: Materials and coordinate system, zh: 材料与坐标系统}
    outputs:
    - {en: Wireless InSite scene project, zh: Wireless InSite场景工程}
    controls:
    - {en: 'Researcher specifies: scene boundaries, units, terrain/building simplification, and material sources', zh: 研究者固定：场景边界、单位、地形/建筑简化和材料来源}
    checks:
    - {en: Check missing buildings and floating/overlapping geometry, zh: 检查缺失建筑与悬空/重叠几何}
    - {en: Separate unknown real materials from measured parameters, zh: 将实际材质未知项与已测参数分开}
  - title: {en: Place Tx/Rx devices and antennas, zh: 放置Tx/Rx与天线}
    detail: {en: 'Set carrier frequency, transmission conditions, and receiver sampling positions. Measured or simulated patterns can be used in link calculations.', zh: 设定载频、发射条件和接收采样位置；实测或仿真的方向图可进入无线链路计算。}
    inputs:
    - {en: Scene project, zh: 场景工程}
    - {en: 'Tx/Rx positions or grids, and array patterns', zh: 收发位置或网格、阵列方向图}
    outputs:
    - {en: Link set and antenna configuration, zh: 链路集合与天线配置}
    controls:
    - {en: 'Researcher specifies: frequency, bandwidth, power, polarization, pose, and receiver-grid spacing', zh: 研究者固定：频率、带宽、功率、极化、姿态和接收网格间距}
    checks:
    - {en: Check pattern coordinates and position units, zh: 检查方向图坐标与位置单位}
    - {en: Count receiver locations with no propagation paths, zh: 统计无传播路径的接收位置}
  - title: {en: Select the model and interaction budget, zh: 选择模型与交互预算}
    detail: {en: 'Select the solver and reflection, transmission, diffraction, absorption/scattering settings for the task. Record engine capabilities separately from the mechanisms actually enabled in a historical dataset.', zh: 按任务选择求解模型和反射、透射、绕射、吸收/散射配置。引擎支持的机制与某个历史数据集实际启用机制分别记录。}
    inputs:
    - {en: Link set, zh: 链路集合}
    - {en: X3D or another propagation model, zh: X3D或其他传播模型}
    outputs:
    - {en: Reproducible solver task, zh: 可重复的求解任务}
    controls:
    - {en: 'Researcher specifies: maximum interactions, ray sampling, scattering model, and output truncation', zh: 研究者固定：最大交互次数、射线采样、散射模型和输出裁剪}
    checks:
    - {en: Check stability by increasing interactions or sampling, zh: 用增加交互/采样的对照检查结果稳定性}
    - {en: Do not apply current 4.0 capabilities to the older O1 scenario, zh: 不要将当前4.0能力套用到旧O1场景}
  - title: {en: Run static or moving scenes, zh: 运行静态或移动场景}
    detail: {en: Run field and path calculations. Version 4.0 supports time-dependent mobility workflows; the project still defines trajectories and dynamic objects., zh: 运行场强和路径计算；4.0支持时间相关移动工作流，具体轨迹和动态对象仍由工程配置定义。}
    inputs:
    - {en: Solver task, zh: 求解任务}
    - {en: Optional time-dependent device/object states, zh: 可选时间相关设备/对象状态}
    outputs:
    - {en: 'Paths, field strengths, powers, or complex impulse responses', zh: 路径、场强、功率或复冲激响应}
    - {en: Time-series results after configuration, zh: 配置后得到的时序结果}
    controls:
    - {en: 'Researcher specifies: time step, trajectories, object IDs, and per-step solving strategy', zh: 研究者固定：时间步、轨迹、对象ID和每步求解策略}
    checks:
    - {en: Check pose/position consistency across snapshots, zh: 检查快照间姿态/位置一致}
    - {en: 'Record failures, truncation, and empty links, not only successful samples', zh: 记录失败、截断与空链路，不只保存成功样本}
  - title: {en: Export and task postprocessing, zh: 导出与任务后处理}
    detail: {en: 'Export the required results, then convert them to formats such as DeepMIMO or compute beam/network labels for the task. Formats and fields depend on output settings.', zh: 导出所需结果，并按研究任务转换为DeepMIMO等格式或计算波束/网络标签；格式和字段取决于output设置。}
    inputs:
    - {en: Outputs at selected receiver points, zh: 所选接收点的输出}
    - {en: Dataset-conversion or codebook/network-task scripts, zh: 数据集转换或码本/网络任务脚本}
    outputs:
    - {en: Exported path/CIR/MIMO results, zh: 导出的路径/CIR/MIMO结果}
    - {en: Researcher-defined CSI and labels, zh: 研究者定义的CSI与标签}
    controls:
    - {en: 'Researcher specifies: export fields, phase/power units, array, and codebook', zh: 研究者固定：导出字段、相位/功率单位、阵列与码本}
    checks:
    - {en: 'Check path counts, total power, and units before and after export', zh: 核对导出前后路径数、总功率和单位}
    - {en: Retain project parameters as well as training tensors, zh: 保留工程参数，不能只保留训练张量}
  scope: {en: 'Commercial Wireless InSite production workflow; choose X3D, other models, and 4.0 time-dependent capabilities according to version.', zh: 商业Wireless InSite生成流程；X3D与其他模型及4.0时间动态能力需按版本选用。}
