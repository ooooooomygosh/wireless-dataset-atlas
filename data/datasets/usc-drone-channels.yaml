summary: {en: 'Measured 3.5 GHz channel frequency responses over 2,301 subcarriers (46 MHz) from a drone-mounted transmitter at 31,619 positions, with 128 ground user positions in a 200 m x 200 m outdoor area, covering LOS and NLOS cases and stored as .mat files.', zh: '在 200 m × 200 m 室外区域内采集的 3.5 GHz 实测信道频率响应，包含 2,301 个子载波（46 MHz 带宽）、无人机发射机的 31,619 个位置和 128 个地面用户位置，涵盖 LOS 与 NLOS 场景，以 .mat 文件存储。'}
