overview: {en: 'USC Drone-Based Channel Measurements is a set of measured 3.5 GHz channel responses produced at the University of Southern California. A transmitter mounted on a drone flew over a 200 m x 200 m outdoor area, and 128 ground user positions served as receivers. The drone recorded 31,619 positions at heights of 25 m to 45 m, sampled every 5 cm along four trajectories. Both line-of-sight and non-line-of-sight cases are included. Channel responses are stored as complex channel frequency responses over 2,301 frequency points spanning 3.477 to 3.523 GHz, in MATLAB .mat files together with GPS arrays for the drone and user positions. The cited paper motivates such data with statistical channel modeling and ray-tracing validation for cell-free massive MIMO. The data page does not describe the sounder hardware, the sounding signal, antenna gain, calibration, or timestamps, and the 76.16 GB archive requires an IEEE DataPort subscription.', zh: 'USC Drone-Based Channel Measurements 是南加州大学产出的一组
    3.5 GHz 实测信道响应数据。发射机搭载在无人机上，在 200 m × 200 m 的室外区域内飞行，128 个地面用户位置作为接收端。无人机在 25 m 至 45 m 高度的四条轨迹上采集了 31,619 个位置，每 5 cm 采样一次。数据同时包含视距（LOS）与非视距（NLOS）场景。信道响应以复数信道频率响应（CFR）的形式存储于 MATLAB .mat 文件中，覆盖 2,301 个频点，频率范围 3.477 至 3.523 GHz，并附带无人机与用户位置的 GPS 数组。所引论文以统计信道建模和射线追踪结果验证为动机，面向 cell-free massive MIMO 系统。'}
signal_details:
- signal: csi
  text: {en: 'Complex channel frequency responses (CFR) in linear scale, 2,301 frequency points over 46 MHz (3.477 to 3.523 GHz). Stored as MATLAB .mat files, one file per trajectory-cluster pair named H(a-b), with a = trajectory 1 to 4 and b = cluster 1 to 16. Each file holds an array of size A x 8 x 2301, where A is the number of drone positions in that trajectory.', zh: '线性刻度的复数信道频率响应（CFR），在 46 MHz 带宽（3.477 至 3.523 GHz）内包含 2,301 个频点。以 MATLAB .mat 文件存储，每个轨迹与用户簇组合对应一个文件，命名为 H(a-b)，其中 a 为轨迹编号 1 至 4，b 为簇编号 1 至 16。每个文件的数组尺寸为 A × 8 × 2301，A 为该轨迹中的无人机位置数量。'}
