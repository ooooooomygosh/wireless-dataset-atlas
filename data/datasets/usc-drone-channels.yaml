  status: provided
  note: {en: Channels are ordered along four trajectories and were captured every 50 ms in the campaign; the release lists no timestamps., zh: 信道沿四条轨迹按顺序排列，测量中每 50 ms 采集一次；发布内容未列出时间戳。}
- key: multiuser
  status: unknown
  note: {en: 'Each file holds 8 users per cluster, but the sources do not say whether they were captured simultaneously; clusters come from separate flights.', zh: 每个文件含每簇 8 个用户，但来源未说明它们是否同时采集；各簇来自不同飞行。}
- key: multibs
  status: none
  note: {en: 'Drone positions are sampled one after another over minutes, and the paper says the channels lie in different coherence blocks.', zh: 无人机位置沿轨迹依次采样，历时数分钟，论文指出各信道位于不同的相干块。}
- key: crossfreq
  status: none
  note: {en: A single 3.5 GHz band is released., zh: 仅发布 3.5 GHz 单一频段。}
- {key: near_field, status: unknown}
- key: high_mobility
  status: none
  note: {en: 'The drone transmitter moves at 4 m/s, about 14 km/h.', zh: 无人机发射机以 4 m/s（约 14 km/h）飞行。}
- key: dynamic_blockage
  status: none
  note: {en: The paper states that dynamic conditions such as trucks blocking the LOS path cannot be accounted for., zh: 论文指出，卡车遮挡视距路径等动态信道条件无法计入数据。}
- key: reflection
