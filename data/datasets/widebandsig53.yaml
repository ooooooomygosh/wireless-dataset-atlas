summary: {en: 'Synthetic wideband complex I/Q samples from 53 signal classes, 550 thousand samples containing about 2 million unique signals, generated with the TorchSig toolkit.', zh: 来自 53 类信号的合成宽带复数 I/Q 样本，共 55 万个样本，包含约 200 万个唯一信号，由 TorchSig 工具包生成。}
