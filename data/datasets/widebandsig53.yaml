checked: '2026-11-06'
overview: {en: 'WidebandSig53 (WBSig53) is a synthetic benchmark of wideband complex I/Q examples for signal detection and recognition. Peraton Labs published it in 2022 with arXiv:2211.10335, and the examples are generated with the TorchSig toolkit. The dataset contains 550 thousand examples with about 2 million signals from 53 signal classes. Each example is 262,144 complex I/Q samples. The four sub-datasets are clean training (250k examples), clean validation (25k), impaired training (250k) and impaired validation (25k). Clean examples hold 1 to 6 signal sources at 20 to 40 dB Es/N0 without impairments. Impaired examples draw SNR uniformly from 0 to 30 dB and add 5 fixed impairments and 2 randomly chosen ones. The signal classes belong to the ASK, PAM, PSK, QAM, FSK and OFDM families. The examples are generated rather than captured over the air.', zh: 'WidebandSig53（WBSig53）是用于宽带复数 I/Q 信号检测与识别的合成基准数据集。Peraton Labs 于 2022 年发布该数据集，论文为 arXiv:2211.10335，样本由 TorchSig 工具包生成。数据集包含 55 万个样本，约
    200 万个信号，覆盖 53 个信号类别。每个样本为 262,144 个复数 I/Q 采样点。四个子集为：Clean 训练集（25 万）、Clean 验证集（2.5 万）、Impaired 训练集（25 万）和 Impaired 验证集（2.5 万）。Clean 样本包含 1 至 6 个信号源，SNR 为 20 至 40 dB（Es/N0），不施加损伤。Impaired 样本在 0 至 30 dB 之间均匀抽取 SNR，并施加 5 种固定损伤与随机选取的 2 种附加损伤。信号类别属于 ASK、PAM、PSK、QAM、FSK 与 OFDM 调制族。样本为生成数据，不是空口采集。'}
signal_details:
- signal: iq
  text: {en: 'Complex-valued I/Q samples, with I as the real part and Q as the imaginary part, 262,144 samples per example. The data are synthetic and generated by TorchSig. Clean examples contain 1 to 6 signal sources at 20 to 40 dB Es/N0. Signal frequencies are expressed relative to the normalized bandwidth of each example.', zh: '复数 I/Q 采样，I 为实部，Q 为虚部，每个样本含 262,144 个采样点。数据为合成生成，由 TorchSig 产生。Clean 样本包含 1 至 6 个信号源，SNR 为 20 至 40 dB（Es/N0）。Impaired 样本在 0 至 30 dB 之间均匀抽取 SNR。'}
pipeline:
  summary: {en: 'TorchSig draws signal sources, places them in time and frequency, applies impairments to the impaired sets, and writes the examples into four sub-datasets.', zh: TorchSig 随机抽取信号源，将其放置于时间与频率轴上，对 Impaired 子集施加损伤，并将样本写入四个子数据集。}
  stages:
  - title: {en: Draw signal sources, zh: 抽取信号源}
    detail: {en: 'Each clean example selects 1 to 6 signal sources from the 53 classes, and each source gets an SNR from 20 to 40 dB Es/N0. OFDM sources are selected twice as often as the other families. Non-OFDM sources are bursty or frequency-hopping with probability 0.2 for each behavior.', zh: 每个 Clean 样本从 53 个类别中选取 1 至 6 个信号源，每个信号源的 SNR 在 20 至 40 dB（Es/N0）之间。OFDM 信号源被选中的概率是其他调制族的两倍。非 OFDM 信号源以 0.2 的概率分别为突发型或跳频型。}
    inputs:
    - {en: 53 signal classes in six modulation families, zh: 六个调制族中的 53 个信号类别}
    outputs:
    - {en: Signal source list with class and SNR, zh: 包含类别与 SNR 的信号源列表}
  - title: {en: Place bursts in time and frequency, zh: 在时间与频率上放置突发}
    detail: {en: 'Center frequencies fall between -0.4 and 0.4 of the normalized example bandwidth, and bandwidths range from 0.0125 to 0.7. Bursts last 0.05 to 0.2 of the example, with a silence of 1 to 3 burst durations. Frequency-hopping sources use 2 to 16 channels. Each source starts or stops inside the example with probability 0.2.', zh: 中心频率位于归一化样本带宽的 -0.4 至 0.4 之间，带宽范围为 0.0125 至 0.7。突发持续时间为样本长度的 0.05 至 0.2，静默时间为突发时长的 1 至 3 倍。跳频信号源使用 2 至 16 个信道。每个信号源以 0.2 的概率在样本内部开始或结束。}
    inputs:
    - {en: Signal source list, zh: 信号源列表}
    outputs:
    - {en: 'Composite complex example of 262,144 samples', zh: '包含 262,144 个采样点的复数合成样本'}
  - title: {en: Apply impairments to the impaired sets, zh: 对 Impaired 子集施加损伤}
    detail: {en: 'The impaired sets draw SNR uniformly from 0 to 30 dB. Five impairments apply to the full example with fixed likelihoods: Time Shift 25%, Frequency Shift 25%, Random Resampling 25%, Spectral Inversion 50% and AWGN 100%. Two of seven further effects are chosen at random for each example: Magnitude Rescaling, RF Roll-Off, Random Convolve, Rayleigh Fading Channel, Drop Samples, Phase Shift and IQ Imbalance.', zh: Impaired 子集的 SNR 在 0 至 30 dB 之间均匀抽取。五种损伤以固定概率作用于整个样本：Time Shift 25%、Frequency Shift 25%、Random Resampling 25%、Spectral Inversion 50%、AWGN 100%。另外七种效果中，每个样本随机选取两种：Magnitude Rescaling、RF Roll-Off、Random Convolve、Rayleigh Fading Channel、Drop Samples、Phase Shift 与 IQ Imbalance。}
    inputs:
    - {en: Composite complex examples, zh: 复数合成样本}
    outputs:
    - {en: Impaired examples, zh: Impaired 样本}
  - title: {en: Transform examples to spectrograms, zh: 将样本转换为频谱图}
    detail: {en: 'The detection and recognition experiments apply a 512-point FFT with segment length 512, no overlap and a Blackman-Harris window. The result is a 512 x 512 complex spectrogram. Its real and imaginary parts are stacked as a (2, 512, 512) network input.', zh: '检测与识别实验使用 512 点 FFT，分段长度 512，无重叠，窗函数为 Blackman-Harris。结果为 512 x 512 的复数频谱图，其实部与虚部堆叠为 (2, 512, 512) 的网络输入。'}
    inputs:
    - {en: 'I/Q examples of 262,144 samples', zh: '262,144 个采样点的 I/Q 样本'}
    outputs:
    - {en: 'Complex spectrograms of shape (2, 512, 512)', zh: '形状为 (2, 512, 512) 的复数频谱图'}
  - title: {en: Write the sub-datasets, zh: 写出子数据集}
    detail: {en: 'The examples form four sub-datasets: clean training (250k), clean validation (25k), impaired training (250k) and impaired validation (25k). The TorchSig README shows the generation path: a TorchSigIterableDataset with dataset metadata, DatasetCreator to write examples to disk, and StaticTorchSigDataset to read them back.', zh: 样本构成四个子数据集：Clean 训练集（25 万）、Clean 验证集（2.5 万）、Impaired 训练集（25 万）和 Impaired 验证集（2.5 万）。TorchSig README 给出了生成流程：使用带数据集元数据的 TorchSigIterableDataset，通过 DatasetCreator 将样本写入磁盘，再由 StaticTorchSigDataset 读回。}
    inputs:
    - {en: Generated examples from TorchSig, zh: TorchSig 生成的样本}
    outputs:
    - {en: Four sub-datasets with training and validation splits, zh: 包含训练与验证划分的四个子数据集}
