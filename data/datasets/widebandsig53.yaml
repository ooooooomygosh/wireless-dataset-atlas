summary: {en: 'Synthetic wideband complex I/Q samples from 53 signal classes, 550 thousand samples containing about 2 million unique signals, generated with the TorchSig toolkit.', zh: 来自 53 类信号的合成宽带复数 I/Q 样本，共 55 万个样本，包含约 200 万个唯一信号，由 TorchSig 工具包生成。}
sources: ['https://arxiv.org/abs/2211.10335', 'https://arxiv.org/html/2211.10335v1', 'https://github.com/torchdsp/torchsig', 'https://raw.githubusercontent.com/torchdsp/torchsig/main/README.md', 'https://raw.githubusercontent.com/torchdsp/torchsig/main/LICENSE.md', 'https://github.com/torchdsp/torchsig/releases', 'https://github.com/torchdsp/torchsig/tags']
checked: '2026-11-06'
overview: {en: 'WidebandSig53 (WBSig53) is a synthetic benchmark of wideband complex I/Q examples for signal detection and recognition. The 2022 arXiv preprint arXiv:2211.10335 comes from authors at Peraton Labs, the Laboratory for Telecommunication Sciences and Applied Insight. The examples are generated with the TorchSig toolkit, which the authors extended for this dataset, rather than captured over the air. The dataset contains 550 thousand examples with about 2 million signals from 53 signal classes in the ASK, PAM, PSK, QAM, FSK and OFDM families. Each example holds 262,144 complex I/Q samples, and the four sub-datasets are clean training (250k examples), clean validation (25k), impaired training (250k) and impaired validation (25k). Clean examples hold 1 to 6 signal sources at 20 to 40 dB Es/N0 without impairments. Impaired examples draw the SNR uniformly from 0 to 30 dB and apply five impairments with fixed probabilities (Time Shift 25%, Frequency Shift 25%, Random Resampling 25%,
    Spectral Inversion 50% and AWGN 100%), plus two of seven further effects chosen at random for each example.', zh: 'WidebandSig53（WBSig53）是面向宽带复数 I/Q 信号检测与识别的合成基准数据集。该数据集见于 2022 年 arXiv 预印本 arXiv:2211.10335，作者来自 Peraton Labs、Laboratory for Telecommunication Sciences 与 Applied Insight。样本由 TorchSig 工具包生成，作者为此扩展了该工具包，样本并非空口采集。数据集包含 55 万个样本，约 200 万个信号，覆盖 53 个信号类别，类别属于 ASK、PAM、PSK、QAM、FSK 与 OFDM 调制族。每个样本含 262,144 个复数 I/Q 采样点，四个子数据集为：Clean 训练集（25 万）、Clean 验证集（2.5 万）、Impaired 训练集（25 万）和 Impaired 验证集（2.5 万）。Clean 样本包含 1 至 6 个信号源，SNR 为 20 至 40 dB（Es/N0），不施加损伤。Impaired 样本在 0 至 30 dB 之间均匀抽取 SNR，以固定概率施加五种损伤（Time Shift 25%、Frequency Shift 25%、Random Resampling 25%、Spectral Inversion 50%、AWGN 100%），并为每个样本随机加入七种附加效果中的两种。'}
signal_details:
- signal: iq
  text: {en: 'Complex-valued I/Q samples, with I as the real part and Q as the imaginary part, 262,144 samples per example. The data are synthetic and generated by TorchSig. Clean examples contain 1 to 6 signal sources at 20 to 40 dB Es/N0, and impaired examples draw the SNR uniformly from 0 to 30 dB. Signal frequencies are expressed relative to the normalized bandwidth of each example.', zh: '复数 I/Q 采样，I 为实部，Q 为虚部，每个样本含 262,144 个采样点。数据为合成生成，由 TorchSig 产生。Clean 样本包含 1 至 6 个信号源，SNR 为 20 至 40 dB（Es/N0）；Impaired 样本的 SNR 在 0 至 30 dB 之间均匀抽取。信号频率以各样本的归一化带宽表示。'}
pipeline:
  summary: {en: 'TorchSig draws signal sources, places them in time and frequency, applies impairments to the impaired sets, and writes the examples into four sub-datasets.', zh: TorchSig 随机抽取信号源，将其放置于时间与频率轴上，对 Impaired 子集施加损伤，并将样本写入四个子数据集。}
  stages:
  - title: {en: Draw signal sources, zh: 抽取信号源}
    detail: {en: 'Each clean example selects 1 to 6 signal sources from the 53 classes, and each source gets an SNR from 20 to 40 dB Es/N0. OFDM sources are selected twice as often as sources from the other families. Non-OFDM sources are bursty or frequency-hopping, each with probability 0.2.', zh: 每个 Clean 样本从 53 个类别中选取 1 至 6 个信号源，每个信号源的 SNR 在 20 至 40 dB（Es/N0）之间。OFDM 信号源被选中的概率是其他调制族的两倍。非 OFDM 信号源各以 0.2 的概率成为突发型或跳频型。}
    inputs:
    - {en: 53 signal classes in six modulation families, zh: 六个调制族中的 53 个信号类别}
    outputs:
    - {en: Signal source list with class and SNR, zh: 包含类别与 SNR 的信号源列表}
  - title: {en: Place bursts in time and frequency, zh: 在时间与频率上放置突发}
    detail: {en: 'Center frequencies fall between -0.4 and 0.4 of the normalized example bandwidth, and bandwidths range from 0.0125 to 0.7 of it. Bursty sources last 0.05 to 0.2 of the example, with silences of 1 to 3 burst durations. Frequency-hopping sources use 2 to 16 channels. Each source starts or stops inside the example with probability 0.2, and sources are placed so that no two signals overlap.', zh: 中心频率位于归一化样本带宽的 -0.4 至 0.4 之间，带宽为归一化样本带宽的 0.0125 至 0.7。突发型信号源持续时间为样本长度的 0.05 至 0.2，静默时间为突发时长的 1 至 3 倍。跳频信号源使用 2 至 16 个信道。每个信号源以 0.2 的概率在样本内部开始或结束，且任意两个信号互不重叠。}
    inputs:
    - {en: Signal source list, zh: 信号源列表}
    outputs:
    - {en: 'Composite complex example of 262,144 samples', zh: '包含 262,144 个采样点的复数合成样本'}
  - title: {en: Apply impairments to the impaired sets, zh: 对 Impaired 子集施加损伤}
    detail: {en: 'The impaired sets draw SNR uniformly from 0 to 30 dB. Five impairments act on the full example with fixed probabilities: Time Shift 25%, Frequency Shift 25%, Random Resampling 25%, Spectral Inversion 50% and AWGN 100%. A modified RandAugment step then picks two of seven further effects per example: Magnitude Rescaling, RF Roll-Off, Random Convolve, Rayleigh Fading Channel, Drop Samples, Phase Shift and IQ Imbalance.', zh: Impaired 子集的 SNR 在 0 至 30 dB 之间均匀抽取。五种损伤以固定概率作用于整个样本：Time Shift 25%、Frequency Shift 25%、Random Resampling 25%、Spectral Inversion 50%、AWGN 100%。经过修改的 RandAugment 步骤随后为每个样本从 Magnitude Rescaling、RF Roll-Off、Random Convolve、Rayleigh Fading Channel、Drop Samples、Phase Shift 与 IQ Imbalance 中随机选取两种施加。}
    inputs:
    - {en: Composite complex examples, zh: 复数合成样本}
    outputs:
    - {en: Impaired examples, zh: Impaired 样本}
  - title: {en: Transform examples to spectrograms, zh: 将样本转换为频谱图}
    detail: {en: 'The detection and recognition experiments apply a 512-point FFT with segment length 512, no overlap and a Blackman-Harris window. The result is a 512 x 512 complex spectrogram. Its real and imaginary parts are stacked as a (2, 512, 512) network input.', zh: '检测与识别实验使用 512 点 FFT，分段长度 512，无重叠，窗函数为 Blackman-Harris。结果为 512 x 512 的复数频谱图，其实部与虚部堆叠为 (2, 512, 512) 的网络输入。'}
    inputs:
    - {en: 'I/Q examples of 262,144 samples', zh: '262,144 个采样点的 I/Q 样本'}
    outputs:
    - {en: 'Complex spectrograms of shape (2, 512, 512)', zh: '形状为 (2, 512, 512) 的复数频谱图'}
  - title: {en: Write the sub-datasets, zh: 写出子数据集}
    detail: {en: 'The examples form four sub-datasets: clean training (250k), clean validation (25k), impaired training (250k) and impaired validation (25k). The TorchSig README shows the generation path: a TorchSigIterableDataset with dataset metadata, DatasetCreator to write examples to disk, and StaticTorchSigDataset to read them back.', zh: 样本构成四个子数据集：Clean 训练集（25 万）、Clean 验证集（2.5 万）、Impaired 训练集（25 万）和 Impaired 验证集（2.5 万）。TorchSig README 给出了生成流程：使用带数据集元数据的 TorchSigIterableDataset，通过 DatasetCreator 将样本写入磁盘，再由 StaticTorchSigDataset 读回。}
    inputs:
    - {en: Generated examples from TorchSig, zh: TorchSig 生成的样本}
    outputs:
    - {en: Four sub-datasets with training and validation splits, zh: 包含训练与验证划分的四个子数据集}
facts:
- label: {en: Detection labels, zh: 检测标签}
  text: {en: 'Detection targets are boxes (t_c, f_c, d, B) for center time, center frequency, duration and bandwidth. Segmentation targets are 512 x 512 masks with 1 inside signal areas and 0 elsewhere.', zh: '检测任务的目标为边界框 (t_c, f_c, d, B)，分别表示中心时间、中心频率、持续时间与带宽。分割任务的目标为 512 x 512 掩码，信号区域为 1，其余为 0。'}
- label: {en: Recognition labels, zh: 识别标签}
  text: {en: 'For recognition, the 53 classes are reduced to six modulation families: ASK, FSK, OFDM, PAM, PSK and QAM.', zh: 识别任务中，53 个类别被归并为六个调制族：ASK、FSK、OFDM、PAM、PSK 与 QAM。}
- label: {en: Overlap, zh: 重叠}
  text: {en: 'Signals within an example are separated in time or frequency, so no two signals overlap.', zh: 同一样本内的信号在时间或频率上相互分离，任意两个信号均不重叠。}
- label: {en: Splits, zh: 划分}
  text: {en: The release provides training and validation sub-datasets for both the clean and the impaired data., zh: 发布内容包括 clean 与 impaired 两类数据各自的训练集与验证集。}
limitations:
- {en: 'Impairments act on the whole example and affect all signal sources equally, so per-source channel differences are not modeled.', zh: 损伤作用于整个样本，对所有信号源的影响相同，因此未建模逐信号源的信道差异。}
capabilities:
- key: csi
  status: none
  note: {en: Complex IQ signal samples only; no channel matrices., zh: 仅含复数 IQ 信号样本，无信道矩阵。}
- key: cir
  status: none
  note: {en: No channel impulse response; a Rayleigh-fading FIR impairment is applied to the IQ samples., zh: 无信道冲激响应；IQ 样本上施加的是瑞利衰落 FIR 损伤模型。}
- key: paths
  status: none
  note: {en: 'No per-path delays, angles or powers; the generator applies impairments, not ray paths.', zh: 无逐径时延、角度或功率；生成器施加的是信号损伤，而非射线路径。}
- key: interaction
  status: none
  note: {en: 'No propagation paths, so no interaction points or surfaces.', zh: 无传播路径，因此没有交互点或表面信息。}
- {key: power, status: unknown}
- key: iq
  status: provided
  note: {en: Complex IQ arrays per sample; the sample rate is not stated in the sources., zh: 每个样本为复数 IQ 数组；来源未给出采样率。}
- key: beam_labels
  status: none
  note: {en: No beam indices or array gains; labels are signal classes and signal parameters., zh: 无波束索引或阵列增益；标签为信号类别及信号参数。}
- key: position
  status: none
  note: {en: No position or GPS labels; the geolocation stack in TorchSig v2.2.0 is a generator feature., zh: 无位置或 GPS 标签；TorchSig v2.2.0 中的地理定位模块属于生成器功能。}
- key: geometry
  status: none
  note: {en: No scene or map files are released., zh: 未发布场景或地图文件。}
- key: materials
  status: none
  note: {en: No material parameters are released., zh: 未发布材料参数。}
- key: rgb
  status: none
  note: {en: Synthetic RF dataset with no image modality; RGB appears only as an analogy for I/Q channels., zh: 合成射频数据集，无图像模态；文中 RGB 仅用于类比 I/Q 通道。}
- key: depth
  status: none
  note: {en: Complex IQ only; no depth data., zh: 仅含复数 IQ，无深度数据。}
- key: lidar
  status: none
  note: {en: Complex IQ only; no LiDAR data., zh: 仅含复数 IQ，无激光雷达数据。}
- key: radar
  status: none
  note: {en: No radar sensing returns; the dataset holds signal waveforms only., zh: 无雷达感知回波；数据集仅包含信号波形。}
- key: imu
  status: none
  note: {en: No inertial data., zh: 无惯性测量数据。}
- key: time_series
  status: none
  note: {en: Samples are independent captures; start and stop times exist only inside each capture., zh: 样本为相互独立的采集；起止时间仅存在于各次采集内部。}
- key: multiuser
  status: provided
  note: {en: One capture mixes several simultaneous signal sources with per-signal labels; per-user channels are not stored., zh: 单次采集混合多个同时存在的信号源，并附逐信号标签；不存储逐用户信道。}
- key: multibs
  status: none
  note: {en: No base-station structure; each sample is a single IQ capture., zh: 无基站结构；每个样本为单次 IQ 采集。}
- key: crossfreq
  status: none
  note: {en: Each sample is one capture; there are no paired multi-band data of the same signals., zh: 每个样本为一次采集；不存在同一信号的成对多频段数据。}
- {key: near_field, status: unknown}
- {key: high_mobility, status: unknown}
- {key: dynamic_blockage, status: unknown}
- key: reflection
  status: none
  note: {en: No ray-based propagation; reflections are not modelled., zh: 无射线传播，未建模反射。}
- key: diffraction
  status: none
  note: {en: Not modelled; the dataset applies signal impairments only., zh: 未建模；数据集仅施加信号损伤。}
- key: scattering
  status: none
  note: {en: 'Only a Rayleigh-fading FIR impairment is applied, with no scattering geometry.', zh: 仅施加瑞利衰落 FIR 损伤，无散射几何。}
- key: transmission
  status: none
  note: {en: Not modelled., zh: 未建模。}
- key: polarization
  status: none
  note: {en: No polarization modelling; the data are complex IQ., zh: 无极化建模；数据为复数 IQ。}
- key: em_field
  status: none
  note: {en: Outputs are IQ signal samples; no field or antenna-pattern outputs., zh: 输出为 IQ 信号样本，无场量或天线方向图输出。}
versions:
- version: v2.2.0
  date: '2026-08-31'
  summary: {en: 'TorchSig v2.2.0 adds a geolocation stack, a config-based Lightning DataModule, multi-label classification support, and new signal families and builders.', zh: TorchSig v2.2.0 新增地理定位模块、基于配置的 Lightning DataModule、多标签分类支持，以及新的信号类型与生成器。}
  url: https://github.com/torchdsp/torchsig/releases/tag/v2.2.0
- version: v2.1.1
  date: '2026-04-27'
  summary: {en: 'TorchSig v2.1.1 removes the Rust dependency, updates the Dockerfiles, fixes dataset writing and bounding boxes, adds dataset statistics, and is published on PyPI.', zh: TorchSig v2.1.1 移除 Rust 依赖，更新 Dockerfile，修复数据集写入与边界框问题，新增数据集统计，并发布到 PyPI。}
  url: https://github.com/torchdsp/torchsig/releases/tag/v2.1.1
- version: v2.1.0
  date: '2026-02-10'
  summary: {en: 'TorchSig v2.1.0 restructures DatasetMetadata and SignalBuilder (renamed BaseSignalGenerator), removes the bundled models and image datasets, merges StaticDataset with CustomDataset, and moves to numpy 2.', zh: TorchSig v2.1.0 重构 DatasetMetadata 与 SignalBuilder（更名为 BaseSignalGenerator），移除内置模型与图像数据集，合并 StaticDataset 与 CustomDataset，并升级到 numpy 2。}
  url: https://github.com/torchdsp/torchsig/releases/tag/v2.1.0
- version: v2.0.0
  date: '2025-09-03'
  summary: {en: 'TorchSig v2.0.0 is a structural release with a v1.1.0 to v2.0.0 migration guide, custom datasets for user data, unified narrowband and wideband transforms, clock jitter and drift, a Rust resampler, HDF5 replacing Zarr, and a beta TorchSig-GUI.', zh: TorchSig v2.0.0 为结构性版本，附带 v1.1.0 至 v2.0.0 迁移指南；新增用户数据自定义数据集、统一的窄带与宽带变换、时钟抖动与漂移、Rust 重采样器，以 HDF5 替代 Zarr，并提供 beta 版 TorchSig-GUI。}
  url: https://github.com/torchdsp/torchsig/releases/tag/v2.0.0
- version: v1.1.0
  date: '2025-04-29'
  summary: {en: 'TorchSig v1.1.0 fixes signal-generation bugs, implements the remaining transforms, optimises Zarr dataset writing, adds a dataset YAML example, fixes reproducibility, and adds PNG/JPG output.', zh: TorchSig v1.1.0 修复信号生成缺陷，实现其余变换，优化 Zarr 数据集写入，新增数据集 YAML 示例，修复可复现性问题，并支持 PNG/JPG 输出。}
  url: https://github.com/torchdsp/torchsig/releases/tag/v1.1.0
- version: v1.0.0
  date: '2025-03-04'
  summary: {en: 'TorchSig v1.0.0 is the stable release after v1.0.0-beta, with notebook fixes and a min_num_signals option in the generate scripts.', zh: TorchSig v1.0.0 为 v1.0.0-beta 之后的稳定版，修复 notebook 问题，并在生成脚本中新增 min_num_signals 选项。}
  url: https://github.com/torchdsp/torchsig/releases/tag/v1.0.0
- version: v1.0.0-beta
  date: '2025-02-19'
  summary: {en: 'TorchSig v1.0.0-beta is an almost entirely new, not backward-compatible version with YAML dataset configuration, official narrowband and wideband configs, and NewDataset and StaticDataset classes.', zh: TorchSig v1.0.0-beta 为几乎全新的、不向后兼容的版本，支持 YAML 数据集配置，提供官方窄带与宽带配置，并引入 NewDataset 与 StaticDataset 类。}
  url: https://github.com/torchdsp/torchsig/releases/tag/v1.0.0-beta
- version: v0.6.1
  date: '2025-01-31'
  summary: {en: 'TorchSig v0.6.1 adds timm model loading, an example for SigMF loading, new pretrained narrowband and wideband models, and fixes notebooks 6 to 10 and 13.', zh: TorchSig v0.6.1 新增 timm 模型加载、SigMF 加载示例及新的窄带与宽带预训练模型，并修复 notebook 6 至 10 与 13。}
  url: https://github.com/torchdsp/torchsig/releases/tag/v0.6.1
- version: v0.6.0
  date: '2024-10-21'
  summary: {en: 'TorchSig v0.6.0 adds eight signal classes (53 to 61 in total, including FM, AM variants, chirp spread spectrum and LFM) and renames Sig53 to Narrowband and WidebandSig53 to Wideband.', zh: TorchSig v0.6.0 新增八类信号（总数由 53 增至 61，包括 FM、多种 AM、chirp 扩频与 LFM），并将 Sig53 更名为 Narrowband、WidebandSig53 更名为 Wideband。}
  url: https://github.com/torchdsp/torchsig/releases/tag/v0.6.0
- version: v0.5.3.1
  date: '2024-09-24'
  summary: {en: TorchSig v0.5.3.1 fixes a GitHub LFS bandwidth limit by changing the gr-spectrumdetect example model file., zh: TorchSig v0.5.3.1 通过调整 gr-spectrumdetect 示例模型文件，解决 GitHub LFS 带宽限制问题。}
  url: https://github.com/torchdsp/torchsig/releases/tag/v0.5.3.1
- version: arXiv v1
  date: '2022-11-04'
