origin: simulation
tasks: [spectrum-sensing, modulation-classification]
signals: [iq]
bands_ghz: []
environment: []
samples: 550 thousand synthetically-generated samples containing about 2 million unique signals
license: MIT
access: {url: 'https://github.com/torchdsp/torchsig', type: open}
code: ['https://github.com/torchdsp/torchsig']
paper: arxiv:2211.10335
used_in: []
