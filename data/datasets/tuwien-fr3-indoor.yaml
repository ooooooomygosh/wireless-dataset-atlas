summary: {en: 'Indoor vector network analyzer MIMO S21 measurements from 6 to 24 GHz, with 6001 frequency points, 9 Tx and 9 Rx virtual ULA ports, six Rx positions and nine far-field factors. Noise measurements with 200 repetitions are provided in the same format.', zh: 室内矢量网络分析仪测得的 MIMO S21 数据，频率范围 6 至 24 GHz，共 6001 个频点，使用 9 个发射和 9 个接收虚拟 ULA 端口，包含 6 个接收位置和 9 个远场因子。另提供格式相同的噪声测量数据，共 200 次重复。}
