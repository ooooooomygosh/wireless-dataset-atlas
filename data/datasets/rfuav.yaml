summary: {en: 'Raw RF IQ recordings of 37 UAV types captured with USRP hardware in real-world environments, totalling about 1.3 TB. The release also includes spectrogram images and XML metadata files.', zh: 来自37种无人机类型的原始射频IQ录制数据，使用USRP采集，录制于真实环境，总量约1.3 TB。数据集还包含频谱图和XML元数据文件。}
