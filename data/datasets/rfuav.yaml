  status: provided
  note: {en: Interleaved fp32 IQ at 100 MHz sampling rate; the public subset holds 37 raw drone clips., zh: 交错排列的 fp32 IQ，采样率 100 MHz；公开子集包含 37 个无人机原始数据片段。}
- key: beam_labels
  status: none
  note: {en: No beam indices or per-beam gains are included; the recordings are single-link IQ., zh: 不包含波束索引或逐波束增益；录制数据为单链路 IQ。}
- key: position
  status: none
  note: {en: The XML files list USRP parameters only; there are no position or GPS fields., zh: XML 文件仅记录 USRP 参数，不含位置或 GPS 字段。}
- key: geometry
  status: none
  note: {en: No 3D scene or map files are included., zh: 不包含三维场景或地图文件。}
- key: materials
  status: none
  note: {en: No material parameters are included., zh: 不包含材料参数。}
- key: rgb
  status: none
