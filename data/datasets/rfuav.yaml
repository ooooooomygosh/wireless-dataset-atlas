summary: {en: 'Raw RF IQ recordings of 37 UAV types captured with USRP hardware in real-world environments, totalling about 1.3 TB. The release also includes spectrogram images and XML metadata files.', zh: 来自37种无人机类型的原始射频IQ录制数据，使用USRP采集，录制于真实环境，总量约1.3 TB。数据集还包含频谱图和XML元数据文件。}
sources: ['https://github.com/kitoweeknd/RFUAV', 'https://huggingface.co/datasets/kitofrank/RFUAV', 'https://raw.githubusercontent.com/kitoweeknd/RFUAV/main/LICENSE', 'https://arxiv.org/abs/2503.09033', 'https://arxiv.org/html/2503.09033', 'https://raw.githubusercontent.com/kitoweeknd/RFUAV/main/README.md', 'https://huggingface.co/api/datasets/kitofrank/RFUAV', 'https://huggingface.co/api/datasets/kitofrank/RFUAV/commits/main', 'https://github.com/kitoweeknd/RFUAV/commits/main', 'https://github.com/kitoweeknd/RFUAV/releases', 'https://export.arxiv.org/api/query?id_list=2503.09033']
checked: '2026-11-06'
overview: {en: 'RFUAV is a benchmark of raw RF recordings from 37 UAV types, described in arXiv:2503.09033 and released under Apache-2.0 on Hugging Face. The raw data were captured in a real-world setting with two USRP X310 units at a 100 MHz sampling rate, with the center frequency tuned for each drone, and the SNR of the recordings ranges from 10 dB to 48 dB across drone types. The raw data total about 1.3 TB and are stored as interleaved fp32 IQ streams, with one XML parameter file per drone type. The Hugging Face release is a public subset that contains the 37 raw data clips, spectrogram images in train and valid folders, a five-drone validation set, and model weights. The GitHub repository provides MATLAB and Python code that converts raw files into spectrograms, adds noise to adjust SNR, and runs the detection and classification models. The authors target UAV signal detection, UAV type identification, SNR estimation and benchmarking across SNR levels.', zh: 'RFUAV 是 37 种无人机的原始射频录制数据集，对应论文
    arXiv:2503.09033，在 Hugging Face 上以 Apache-2.0 许可证发布。原始数据在真实环境中由两台 USRP X310 以 100 MHz 采样率采集，每种无人机分别调整中心频率，各类型录制信号的 SNR 范围为 10 dB 至 48 dB。原始数据总量约 1.3 TB，以 fp32 交错 IQ 流存储，每种无人机类型对应一个 XML 参数文件。Hugging Face 发布的是公开子集，包含 37 个原始数据片段、train 与 valid 文件夹中的频谱图图像、一个 5 种无人机的验证集以及模型权重。GitHub 仓库提供 MATLAB 与 Python 代码，用于将原始文件转换为频谱图、通过加噪调整 SNR，并运行检测与分类模型。作者的目标任务包括无人机信号检测、无人机类型识别、SNR 估计，以及跨 SNR 水平的基准测试。'}
signal_details:
- signal: iq
  text: {en: 'Binary interleaved IQ streams, each sample stored as two fp32 values. Two USRP X310 units are used: USRPI records the raw data to a collector PC running Ubuntu 22.04 and GNU Radio v3.9.10 over a 10GbE link. Sampling rate 100 MHz. Center frequencies 2.41 to 5.8 GHz, tuned per drone. Raw data size per drone type from 15.71 GB to 127.71 GB. Each drone type has an XML file with the USRP parameters: DeviceType, Drone, SerialNumber, DataType, ReferenceSNRLevel, CenterFrequency, SampleRate, IFBandwidth and ScaleFactor.', zh: 二进制交错 IQ 流，每个采样点以两个 fp32 数值存储。使用两台 USRP X310，其中 USRPI 通过 10GbE 链路将原始数据录制到运行 Ubuntu 22.04 与 GNU Radio v3.9.10 的采集 PC。采样率 100 MHz。中心频率 2.41 至 5.8 GHz，按无人机分别调谐。每种无人机类型的原始数据大小为 15.71 GB 至 127.71 GB。每种无人机类型对应一个 XML 文件，记录 USRP 参数：DeviceType、Drone、SerialNumber、DataType、ReferenceSNRLevel、CenterFrequency、SampleRate、IFBandwidth 与 ScaleFactor。}
- signal: spectrum
  text: {en: 'Spectrograms computed from the raw IQ with STFT, using a Hamming window in the paper. The example conversion function uses 1024 FFT points and 0.1 s per image at a 100 MHz sample rate, and writes PNG images; a second function writes spectrogram video at 5 fps. The Hugging Face release contains spectrogram image sets in train and valid folders, organized by drone type.', zh: 由原始 IQ 数据经 STFT 计算得到的频谱图，论文中使用汉明窗。转换函数示例使用 1024 点 FFT、每幅图 0.1 s、100 MHz 采样率，输出 PNG 图像；另一函数以 5 fps 输出频谱视频。Hugging Face 发布的频谱图图像位于 train 与 valid 文件夹中，按无人机类型组织。}
pipeline:
  summary: {en: 'Raw IQ is recorded with USRP hardware, cut into segments, converted to spectrograms, and augmented with added noise (awgn1) to cover lower SNR levels.', zh: 原始 IQ 由 USRP 硬件录制，切分为片段，转换为频谱图，并通过 awgn1 函数添加噪声以覆盖较低的 SNR 水平。}
  stages:
  - title: {en: Signal capture, zh: 信号采集}
    detail: {en: 'USRPI records each drone''s signal to a collector PC, with the transmitter connected directly to USRPI or placed nearby. USRPO replays packets to a spectrum analyzer covering 9 kHz to 13.2 GHz for quality checks. The sampling rate is 100 MHz, and the gain is adjusted to keep the SNR high.', zh: USRPI 将每种无人机的信号录制到采集 PC，发射机直接连接 USRPI 或放置在附近。USRPO 将数据包回放至频谱分析仪（覆盖 9 kHz 至 13.2 GHz）以检查质量。采样率为 100 MHz，增益经调整以保持较高的 SNR。}
    inputs:
    - {en: UAV transmitter, zh: 无人机发射机}
    outputs:
    - {en: Raw binary IQ files and XML parameter files, zh: 原始二进制 IQ 文件与 XML 参数文件}
  - title: {en: Segmentation, zh: 分段切割}
    detail: {en: The MATLAB tool rawdata_crop.m cuts raw recordings into smaller data packets at a set segment interval; 2 s is the example value., zh: MATLAB 工具 rawdata_crop.m 按设定的分段间隔将原始录制切割为较小的数据包，示例间隔为 2 s。}
    inputs:
    - {en: Raw IQ recordings, zh: 原始 IQ 录制数据}
    outputs:
    - {en: Segmented data packets, zh: 分段数据包}
  - title: {en: Spectrogram conversion, zh: 频谱图转换}
    detail: {en: 'The conversion function applies STFT to each IQ segment at a 100 MHz sample rate, with 1024 FFT points and 0.1 s per image in the documented example, and writes PNG images. A second function writes spectrogram video at 5 fps.', zh: 转换函数对每段 IQ 数据应用 STFT，采样率为 100 MHz，文档示例使用 1024 点 FFT 与每幅图 0.1 s，并输出 PNG 图像。另一函数以 5 fps 输出频谱视频。}
    inputs:
    - {en: IQ segments with sample rate and STFT size, zh: 带采样率与 STFT 长度的 IQ 片段}
    outputs:
    - {en: PNG spectrogram images and spectrogram video, zh: PNG 频谱图与频谱视频}
  - title: {en: SNR augmentation, zh: SNR 增广}
    detail: {en: 'The awgn1 function adjusts the noise level of a recording, based on its SNR estimate, to reach target SNRs from -20 dB to 20 dB, in 2 dB steps by default; a custom scale can be set. The data_augmentation function uses these versions to address the mismatch between the training set, which holds drone images at their original SNR, and the benchmark, which covers several SNR levels.', zh: awgn1 函数依据录制数据的 SNR 估计值调整噪声水平，使其达到 -20 dB 至 20 dB 的目标 SNR，默认步长为 2 dB，也可自定义。data_augmentation 函数利用这些版本解决训练集（仅包含原始 SNR 的无人机图像）与覆盖多个 SNR 水平的基准之间的不一致问题。}
    inputs:
    - {en: Raw IQ with SNR estimate, zh: 带 SNR 估计值的原始 IQ}
    outputs:
    - {en: Noise-adjusted IQ at target SNRs, zh: 目标 SNR 下的加噪 IQ 数据}
facts:
- label: {en: Hugging Face archives, zh: Hugging Face 压缩包}
  text: {en: 'The Hugging Face release stores each drone''s raw clip as a .rar archive: 37 archives for the raw data and 5 archives in a separate validation set.', zh: Hugging Face 发布版中，每种无人机的原始数据片段以 .rar 压缩包存储：原始数据共 37 个压缩包，另有 5 个压缩包构成单独的验证集。}
- label: {en: Per-drone characteristics, zh: 各无人机特征表}
  text: {en: 'Table 4 of the paper lists, for each drone type, the file size, reference SNR, center frequency, FHSBW, VTSBW, FHSDT, FHSDC and FHSPP.', zh: 论文表 4 按无人机类型列出文件大小、参考 SNR、中心频率、FHSBW、VTSBW、FHSDT、FHSDC 与 FHSPP。}
- label: {en: RF drone fingerprint, zh: RF 无人机指纹}
  text: {en: 'The paper defines an RF drone fingerprint from the frequency-hopping bandwidth, duration, duty cycle and period (FHSBW, FHSDT, FHSDC, FHSPP) together with the video transmission bandwidth (VTSBW).', zh: 论文以跳频带宽、持续时间、占空比与周期（FHSBW、FHSDT、FHSDC、FHSPP）以及图传带宽（VTSBW）定义 RF 无人机指纹。}
- label: {en: SNR range of the benchmark, zh: 基准的 SNR 范围}
  text: {en: 'The benchmark covers SNR levels from -20 dB to 20 dB, while the training set contains drone images at their original SNR only.', zh: 基准覆盖 -20 dB 至 20 dB 的 SNR 水平，而训练集仅包含原始 SNR 下的无人机图像。}
