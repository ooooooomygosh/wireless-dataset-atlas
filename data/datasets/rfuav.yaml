  note: {en: Received power and SNR can be computed from the raw IQ; the repository's MATLAB function snrEsti estimates SNR., zh: 接收功率和 SNR 可由原始 IQ 计算；仓库中的 MATLAB 函数 snrEsti 用于估计 SNR。}
