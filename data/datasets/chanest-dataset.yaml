summary: {en: 'Simulated OFDM grids of 612 subcarriers by 14 symbols with DM-RS Type 2 pilots at 7 GHz over TDL-A to TDL-E channels, with SNR from -10 to 30 dB. Each sample stores least-squares estimates with 2-D interpolation as input and the perfect channel as label, for SISO and MIMO configurations.', zh: 在 7 GHz 频段、采用 DM-RS Type 2 导频的仿真 OFDM 资源网格（612 个子载波、14 个符号），信道模型为 TDL-A 至 TDL-E，信噪比为 -10 至 30 dB。每个样本以带二维插值的最小二乘估计作为输入，以理想信道作为标签，支持 SISO 与 MIMO 配置。}
