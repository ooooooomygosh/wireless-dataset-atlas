facts:
- label: {en: Radio configuration, zh: 无线电配置}
  text: {en: 'Recordings were made with AGC disabled, a Tx gain of 80 dB, an Rx gain of 60 dB, and EARFCN 203 on the indoor eNodeB.', zh: 采集时关闭 AGC，Tx 增益为 80 dB，Rx 增益为 60 dB，室内 eNodeB 的 EARFCN 为 203。}
- label: {en: Random test-point split, zh: 随机测试点划分}
  text: {en: 'In the paper''s random test-point experiment, 90% of the locations (3,585) serve as reference points and the other 398 as test points. The test-point fingerprints are split evenly into validation and test sets.', zh: '论文的随机测试点实验中，90% 的位置（3,585 个）作为参考点，其余 398 个作为测试点。测试点的指纹平均分为验证集和测试集。'}
technical_notes:
- {en: 'In LTE, only every third subcarrier of the channel estimate comes from independent training symbols; the others are interpolated. The paper''s analysis therefore keeps 400 of the 1200 complex values per port.', zh: 在 LTE 中，信道估计仅每三个子载波来自独立的训练符号，其余子载波为插值结果。因此论文分析中每个端口只保留 1200 个复数值中的 400 个。}
- {en: 'In roughly half of the measurements, only 80 of the 1200 subcarriers carry valid CSI because of an SDR limit during data transmission. The paper''s analysis deletes these measurements.', zh: 约一半的测量中，由于数据传输时 SDR 的限制，1200 个子载波中只有 80 个含有效 CSI。论文分析中删除了这些测量。}
- {en: Fewer than 1% of the measurements show irregularities from concurrent writes to the output file; the affected subcarriers are replaced by interpolation., zh: 少于 1% 的测量因同时写入输出文件而出现异常，受影响的子载波通过插值替换。}
