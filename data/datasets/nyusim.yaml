summary: {en: 'A channel generator for 0.5 to 150 GHz (MATLAB version 4.0) that produces drop-based and spatially consistent simulations for UMi, UMa, RMa, InH and InF scenarios.', zh: 面向 0.5 至 150 GHz 的信道生成器（MATLAB 4.0 版），可为 UMi、UMa、RMa、InH 和 InF 场景生成 drop-based 与空间一致性仿真结果。}
sources: ['https://wireless.engineering.nyu.edu/nyusim/', 'https://wireless.engineering.nyu.edu/nyusim-thz-mmwave-channel-simulator-research/', 'https://api.crossref.org/works?query.title=NYUSIM+hybrid+channel+simulator+millimeter-wave&rows=3&select=DOI,title,issued']
checked: '2026-11-06'
pipeline:
  summary: {en: 'Generate synthetic spatiotemporal channels from measurement-derived scenario statistics, then add antennas/trajectories and task postprocessing. Measurement-driven parameters do not make every output a measurement record.', zh: 从测量归纳出的场景统计生成合成时空信道，再加入天线/轨迹与任务后处理。测量驱动参数不等于每个输出都是实测记录。}
  stages:
  - title: {en: Select implementation and scenario parameters, zh: 选择实现与场景参数}
    detail: {en: 'Select the implementation and scenario; 4.0 supports drop-based and spatial-consistency modes, configured through a GUI or text parameter files.', zh: 选定实现及场景；4.0支持drop-based和spatial-consistency模式，输入可通过GUI或文本参数文件配置。}
    inputs:
    - {en: MATLAB 4.0 or a specified version of another implementation, zh: MATLAB4.0或明确版本的其他实现}
    - {en: UMi/UMa/RMa/InH/InF scenarios, zh: UMi/UMa/RMa/InH/InF场景}
    outputs:
    - {en: Runtime version and parameter file, zh: 运行版本与参数文件}
    controls:
    - {en: 'Researcher specifies: frequency, RF bandwidth, scenario, LOS/NLOS, and input file', zh: 研究者固定：频率、RF带宽、场景、LOS/NLOS及输入文件}
    checks:
    - {en: Check the meaning of same-named parameters across implementations, zh: 核对不同实现的同名参数含义}
    - {en: Do not treat MATLAB 4.0 and ns-3 1.0 as the same software version, zh: 不要把MATLAB4.0与ns-3 1.0当作同一软件版本}
  - title: {en: Configure links or mobility sampling, zh: 设定链路或移动采样}
    detail: {en: Configure individual samples or spatially continuous receiver movement according to the selected mode; the mobility mode determines correlation between snapshots., zh: 按所选模式设定单次抽样或空间连续的接收机运动；运动模式影响快照之间的相关性。}
    inputs:
    - {en: Tx/Rx geometry and antenna settings, zh: 收发几何与天线设置}
    - {en: Static drops or mobility trajectories, zh: 静态drop或移动轨迹}
    outputs:
    - {en: Link set with positions/sampling rules, zh: 带位置/采样规则的链路集合}
    controls:
    - {en: 'Researcher specifies: distance, Tx/Rx heights, antennas, trajectories, and sampling interval', zh: 研究者固定：距离、Tx/Rx高度、天线、轨迹和采样间隔}
    checks:
    - {en: Check whether independent drops are being mistaken for time series, zh: 检查独立drop是否被误当时间序列}
    - {en: Verify joint multiuser/multi-BS correlation in the specific implementation, zh: 多用户/多BS联合相关性需另核验具体实现}
  - title: {en: Generate statistical propagation and multipath, zh: 生成统计传播与多径}
    detail: {en: 'Generate propagation parameters such as delays, powers, and angles from scenario statistics, updating them with receiver position in continuous mode.', zh: 由场景统计生成时延、功率、角度等传播参数，并在连续模式中随接收机位置更新。}
    inputs:
    - {en: Scenario statistics and link settings, zh: 场景统计与链路设置}
    outputs:
    - {en: Synthetic PDP/CIR and path parameters, zh: 合成PDP/CIR及路径参数}
    controls:
    - {en: 'Researcher specifies: random seed, sample count, mode, and available statistical parameters', zh: 研究者固定：随机种子、样本数、模式和可用统计参数}
    checks:
    - {en: Compare PDP/delay-spread statistics with the selected scenario parameters, zh: 比较PDP/延迟扩展等统计与所选场景参数}
    - {en: Do not interpret random paths as reconstructed street reflection surfaces, zh: 不要把随机路径解释为已重建的街道反射面}
  - title: {en: Save outputs for verification, zh: 保存可复核输出}
    detail: {en: Save model outputs and input parameters; verify serialization formats and exportable quantities separately for each language implementation., zh: 保存模型输出及输入参数；各语言实现的序列化格式和可导出量单独确认。}
    inputs:
    - {en: Generated PDP/CIR and run configuration, zh: 生成的PDP/CIR和运行配置}
    outputs:
    - {en: Numerical propagation results and configuration records, zh: 数值传播结果与配置记录}
    controls:
    - {en: 'Researcher specifies: power/delay units, antenna conventions, data precision, and output path', zh: 研究者固定：功率/时延单位、天线口径、数据精度和输出路径}
    checks:
    - {en: Check whether phase and complex coefficients are retained; PDP alone does not establish availability of full CSI, zh: 检查是否保留相位和复系数，避免仅凭PDP声称已有完整CSI}
    - {en: Save the handling policy for failed/empty results, zh: 保存失败/空结果策略}
  - title: {en: Convert outputs into communication task data, zh: 转为通信任务数据}
    detail: {en: 'Derive frequency-domain channels, beam labels, or link evaluations from information actually present in the outputs; do not invent unrecoverable phase from power statistics.', zh: 按输出实际包含的信息派生频域信道、波束标签或链路评估，不从功率统计虚构不可恢复的相位。}
    inputs:
    - {en: Path or CIR outputs, zh: 路径或CIR输出}
    - {en: 'Researcher-defined OFDM, codebook, and noise configuration', zh: 研究者定义的OFDM、码本与噪声配置}
    outputs:
    - {en: CSI/beam samples when conditions permit, zh: 条件成立时的CSI/beam样本}
    - {en: Link metrics, zh: 链路指标}
    controls:
    - {en: 'Researcher specifies: frequency-domain transform, codebook, noise, and train/test scenarios', zh: 研究者固定：频域变换、码本、噪声和训练/测试场景}
    checks:
    - {en: Perform single-link analytical checks before evaluating learning methods, zh: 先做单链路解析检查，再评估学习方法}
    - {en: Distinguish extrapolation across scenarios from generalization to real measurements, zh: 明确场景外推与真实测量外推的区别}
  scope: {en: This card primarily uses NYUSIM 4.0 MATLAB; pin Python/ns-3 versions independently., zh: NYUSIM 4.0 MATLAB为本卡主要依据；Python/ns-3实现独立固定版本。}
