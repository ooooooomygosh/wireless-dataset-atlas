citing: ['doi:10.1109/jproc.2024.3412828', 'doi:10.1109/ojcoms.2025.3592365']
summary: {en: 'A channel generator for 0.5 to 150 GHz (MATLAB version 4.0) that produces drop-based and spatially consistent simulations for UMi, UMa, RMa, InH and InF scenarios.', zh: 面向 0.5 至 150 GHz 的信道生成器（MATLAB 4.0 版），可为 UMi、UMa、RMa、InH 和 InF 场景生成 drop-based 与空间一致性仿真结果。}
sources: ['https://wireless.engineering.nyu.edu/nyusim/', 'https://wireless.engineering.nyu.edu/nyusim-thz-mmwave-channel-simulator-research/', 'https://api.crossref.org/works?query.title=NYUSIM+hybrid+channel+simulator+millimeter-wave&rows=3&select=DOI,title,issued', 'https://api.crossref.org/works/10.1109/comst.2023.3344671', 'https://arxiv.org/abs/2305.01828', 'https://arxiv.org/html/2305.01828v1', 'https://wireless.engineering.nyu.edu/nyusim-thz-mmwave-channel-simulator-research2/', 'https://wireless.engineering.nyu.edu/wp-json/wp/v2/pages?slug=nyusim', 'https://wireless.engineering.nyu.edu/nyusim-5g-channel-sim-available/', 'https://wireless.engineering.nyu.edu/nyusim-version-1-3-now-available/', 'https://wireless.engineering.nyu.edu/nyusim-version-1-4-now-available/', 'https://wireless.engineering.nyu.edu/download-nyusim-version-3-0/', 'https://apps.nsnam.org/app/nyusim/', 'https://github.com/hiteshPoddar/NYUSIM_in_ns3/releases/tag/v1.0', 'https://github.com/hiteshPoddar/NYUSIM_in_ns3/tags']
checked: '2026-11-06'
pipeline:
  summary: {en: 'Select the implementation and scenario, choose the drop-based or spatial-consistency mode, then generate multipath components from the statistical model. The outputs are simulated realizations, not measured records.', zh: 选定实现与场景，选择 drop-based 或空间一致性模式，然后由统计模型生成多径分量。输出为仿真实现，而非测量记录。}
  stages:
  - title: {en: Select implementation and scenario, zh: 选择实现与场景}
    detail: {en: 'NYUSIM 4.0 for MATLAB covers the UMi, UMa, RMa, InH and InF scenarios from 0.5 to 150 GHz, with RF bandwidth from CW to 1 GHz. Inputs can be entered in the GUI or loaded from a .txt parameter file, and the parameter file saved for a run (BasicParameters.txt) records all input values.', zh: MATLAB 版 NYUSIM 4.0 覆盖 UMi、UMa、RMa、InH 与 InF 场景，频率范围 0.5 至 150 GHz，射频带宽从 CW 至 1 GHz。输入可在 GUI 中填写，也可读取 .txt 参数文件；运行所保存的参数文件（BasicParameters.txt）记录全部输入值。}
    inputs:
    - {en: 'MATLAB 4.0 package, or NYUSIM 1.0 for ns-3 from the ns-3 app store', zh: MATLAB 4.0 软件包，或 ns-3 app store 中的 NYUSIM 1.0}
    outputs:
    - {en: Parameter file recording the inputs of the run, zh: 记录本次运行输入的参数文件}
    checks:
    - {en: 'Record the implementation and version, because MATLAB 4.0 and ns-3 1.0 are separate releases', zh: 记录实现与版本，因 MATLAB 4.0 与 ns-3 1.0 为两个独立版本}
  - title: {en: Choose the simulation mode, zh: 选择仿真模式}
    detail: {en: Drop-based mode gives statistically independent realizations for user-set TX-RX separations. Spatial-consistency mode gives responses that change smoothly with receiver motion., zh: drop-based 模式给出 TX-RX 间距由用户设定的统计独立实现。空间一致性模式给出随接收机运动平滑变化的响应。}
    checks:
    - {en: Check whether independent drops are mistaken for a time series, zh: 检查是否把相互独立的 drop 误当作时间序列}
  - title: {en: Generate multipath components from statistics, zh: 由统计量生成多径分量}
    detail: {en: 'Channel statistics are stored in fetchChanParams.m in the MATLAB 4.0 code. The ns-3 implementation of the drop-based model draws time clusters, subpath delays, powers and departure and arrival angles, then removes subpaths below the receiver power threshold.', zh: 信道统计量存放在 MATLAB 4.0 代码的 fetchChanParams.m 中。drop-based 模型的 ns-3 实现会生成时间簇、子径时延、功率以及出发与到达角，并去除低于接收机功率门限的子径。}
    outputs:
    - {en: 'Multipath components with delay, power and angles for each realization', zh: 每个实现的多径分量，含时延、功率与角度}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: 'Multipath components (time clusters and subpaths) with delays, powers and departure and arrival angles, as described for the ns-3 implementation (arXiv:2305.01828).', zh: '多径分量（时间簇与子径），含时延、功率及出发与到达角，依据 ns-3 实现的说明（arXiv:2305.01828）。'}
- label: {en: Frequency interpolation, zh: 频率插值}
  text: {en: 'In the ns-3 implementation, path loss exponents and shadowing values at other frequencies are interpolated from the 28 GHz and 140 GHz values, because most scenarios were measured only at those frequencies.', zh: 在 ns-3 实现中，其他频率的路径损耗指数与阴影衰落值由 28 GHz 与 140 GHz 的取值插值得到，因为多数场景仅在这两个频率上测量。}
provenance:
- {en: NYU measurement-derived statistical parameters, zh: NYU 实测统计参数}
- {en: Scenario/frequency/LOS and array configuration, zh: 场景/频率/LOS 与阵列配置}
- {en: Random clusters/subpaths and spatial-consistency process, zh: 随机簇/子径和空间一致过程}
- {en: CIR/channel parameters, zh: CIR/信道参数}
- {en: User-defined CSI and experiments, zh: 用户定义 CSI 与实验}
technical_notes:
- {en: 'NYUSIM 4.0 covers five scenarios (UMi, UMa, RMa, InH and InF) and provides drop-based and spatial-consistency modes.', zh: NYUSIM 4.0 覆盖五种场景（UMi、UMa、RMa、InH 与 InF），并提供 drop-based 与空间一致性两种模式。}
- {en: 'The ns-3 implementation paper states that the model is based on NYU WIRELESS measurement campaigns from 2011 to 2022, at 28, 38, 73 and 140 GHz.', zh: ns-3 实现论文称，该模型基于 NYU WIRELESS 2011 至 2022 年的测量活动，频率包括 28、38、73 与 140 GHz。}
limitations:
- {en: Version numbers differ across implementations. NYUSIM 4.0 (MATLAB) and NYUSIM 1.0 (ns-3) are separate releases and are not interchangeable., zh: 不同实现的版本号不同。NYUSIM 4.0（MATLAB）与 NYUSIM 1.0（ns-3）为两个独立版本，不可互换。}
- {en: 'The simulator produces no RGB or point-cloud data, so visual-wireless associations cannot be validated directly with its output.', zh: 仿真器不输出 RGB 或点云数据，因此无法直接用其输出验证视觉与无线的关联。}
history:
- {en: '2023-03-06: NYUSIM 4.0 for MATLAB and NYUSIM 1.0 for ns-3 announced. The MATLAB release enables drop-based and spatial-consistency modes for all five scenarios.', zh: 2023 年 3 月 6 日：发布 MATLAB 版 NYUSIM 4.0 与 ns-3 版 NYUSIM 1.0。MATLAB 版对全部五种场景启用 drop-based 与空间一致性模式。}
- {en: 'The research page states that v4.0 has been migrated to Python (NYUSIM Python), with FR3 (7 to 24 GHz) modeling planned. No separate release number is given.', zh: 研究页面称 v4.0 已迁移至 Python（NYUSIM Python），并计划加入 FR3（7 至 24 GHz）建模。页面未给出单独的版本号。}
usage:
- {en: 'Obtain the implementation and its user manual from the official website through the download form, then fix the scenario, frequency and bandwidth in the parameter file.', zh: 通过官网下载表单获取实现版本及其用户手册，然后在参数文件中固定场景、频率与带宽。}
- {en: 'Save the parameter file of each run (BasicParameters.txt), so that the configuration can be shared and rerun.', zh: 保存每次运行的参数文件（BasicParameters.txt），以便共享配置并重复运行。}
overview: {en: 'NYUSIM is a channel simulator from NYU WIRELESS at New York University for millimeter-wave and sub-terahertz channels. The NYU WIRELESS research page describes its statistical models as built on propagation measurements and validated through more than a decade of measurements in urban, indoor, factory and rural environments. NYUSIM 4.0 for MATLAB covers 0.5 GHz to 150 GHz with an RF bandwidth from CW to 1 GHz, and models UMi, UMa, RMa, InH and InF scenarios under LOS and NLOS. Drop-based and spatial-consistency simulation modes are enabled for all five scenarios. An ns-3 version, NYUSIM 1.0, is available from the ns-3 app store. The MATLAB package is obtained through a download form for Windows or Mac, and its license asks users to cite NYU WIRELESS publications. The output is a set of channel realizations generated from a statistical model rather than recorded measurement data. The research page also states that v4.0 has been migrated to Python, with FR3 modeling planned,
    but gives no separate release number for that version.', zh: NYUSIM 是 New York University 的 NYU WIRELESS 发布的毫米波与亚太赫兹信道仿真器。NYU WIRELESS 研究页面称其统计模型基于传播测量，并经十余年城市、室内、工厂与乡村环境的测量验证。MATLAB 版 NYUSIM 4.0 覆盖 0.5 GHz 至 150 GHz，射频带宽为 CW（0 Hz）至 1 GHz，涵盖 UMi、UMa、RMa、InH 和 InF 场景及 LOS 与 NLOS 两种情况。五个场景均支持 drop-based 与空间一致性两种仿真模式。ns-3 版本 NYUSIM 1.0 可从 ns-3 app store 获取。MATLAB 版需通过 Windows 或 Mac 的下载表单获取，许可条款要求使用者引用 NYU WIRELESS 发表的文献。输出为统计模型生成的信道实现，而非记录的测量数据。研究页面还称 v4.0 已迁移至 Python，并计划加入 FR3（7–24 GHz）建模，但未给出该版本的单独版本号。}
signal_details:
- signal: paths
  text: {en: 'Multipath components in drop-based or spatially consistent channel realizations. Drop-based mode gives statistically independent realizations for user-set TX-RX separations, and spatial-consistency mode gives responses that change smoothly with receiver motion. The NYUSIM Python version described on the research page stores antenna patterns in 3Dant format and interpolates the gain for each MPC in its departure and arrival directions.', zh: drop-based 或空间一致性信道实现中的多径分量（MPC）。drop-based 模式给出 TX-RX 间距由用户设定的统计独立实现，空间一致性模式给出随接收机运动平滑变化的响应。研究页面所述 NYUSIM Python 版本以 3Dant 格式存储天线方向图，并在每个 MPC 的出发与到达方向上插值增益。}
capabilities:
- key: csi
  status: simulate
  note: {en: The complex MIMO channel matrix is computed for each realization from the configured arrays (ns-3 1.0 implementation)., zh: 每次实现均根据所设阵列计算复数 MIMO 信道矩阵（ns-3 1.0 实现）。}
- key: cir
  status: simulate
  note: {en: 'Wideband channel impulse responses are generated statistically for each realization, as the release notes describe.', zh: 宽带信道冲激响应按每次实现由统计模型生成，与发布说明的描述一致。}
- key: paths
  status: simulate
  note: {en: 'Delay, power, and departure and arrival angles of each multipath component are generated per realization (ns-3 1.0 implementation).', zh: 每次实现生成各多径分量的时延、功率及出发与到达角（ns-3 1.0 实现）。}
- {key: interaction, status: unknown}
- key: power
  status: simulate
  note: {en: Path loss and received power spectral density are computed in each run (ns-3 1.0 implementation)., zh: 路径损耗与接收功率谱密度在每次运行中计算（ns-3 1.0 实现）。}
- {key: iq, status: unknown}
- key: beam_labels
  status: simulate
  note: {en: Beamforming gain is computed in each run from user-set Tx and Rx beamforming vectors., zh: 每次运行中，波束成形增益由用户设定的发射与接收波束成形矢量计算得出。}
- key: position
  status: simulate
  note: {en: 'TX-RX separations are set by the user, and no position dataset is released.', zh: TX-RX 间距由用户设定，不发布位置数据集。}
- {key: geometry, status: unknown}
- {key: materials, status: unknown}
- key: rgb
  status: none
  note: {en: 'The outputs are channel realizations only, with no image data.', zh: 输出仅为信道实现，不含图像数据。}
- key: depth
  status: none
  note: {en: 'The outputs are channel realizations only, with no sensor data.', zh: 输出仅为信道实现，不含传感器数据。}
- key: lidar
  status: none
  note: {en: 'The outputs are channel realizations only, with no point-cloud data.', zh: 输出仅为信道实现，不含点云数据。}
- key: radar
  status: none
  note: {en: 'The outputs are channel realizations only, with no sensor data.', zh: 输出仅为信道实现，不含传感器数据。}
- key: imu
  status: none
  note: {en: 'The outputs are channel realizations only, with no sensor data.', zh: 输出仅为信道实现，不含传感器数据。}
- key: time_series
  status: simulate
  note: {en: 'Spatial-consistency mode gives responses that change smoothly with receiver motion, whereas drop-based realizations are statistically independent.', zh: 空间一致性模式给出随接收机运动平滑变化的响应，而 drop-based 实现在统计上相互独立。}
- {key: multiuser, status: unknown}
- {key: multibs, status: unknown}
- {key: crossfreq, status: unknown}
- {key: near_field, status: unknown}
- {key: high_mobility, status: unknown}
- key: dynamic_blockage
  status: simulate
  note: {en: 'Human blockage is implemented in the MATLAB version, and the ns-3 1.0 implementation omits it.', zh: MATLAB 版实现了人体遮挡，ns-3 1.0 实现未包含该功能。}
- {key: reflection, status: unknown}
- {key: diffraction, status: unknown}
- {key: scattering, status: unknown}
- {key: transmission, status: unknown}
- key: polarization
  status: simulate
  note: {en: 'Four polarization combinations (V-V, V-H, H-V, H-H) and cross-polarization coefficients are generated per multipath component (ns-3 1.0 implementation).', zh: 每个多径分量生成四种极化组合（V-V、V-H、H-V、H-H）及交叉极化系数（ns-3 1.0 实现）。}
- {key: em_field, status: unknown}
versions:
- version: 4.0 (Python)
  summary: {en: 'NYUSIM v4.0 has been migrated to Python, and FR3 (7 to 24 GHz) modeling is planned for it; the research page gives no separate release number.', zh: NYUSIM v4.0 已迁移至 Python，计划为其加入 FR3（7 至 24 GHz）建模；研究页面未给出单独的版本号。}
  url: https://wireless.engineering.nyu.edu/nyusim-thz-mmwave-channel-simulator-research/
- version: 1.0 (ns-3 GitHub release)
  date: '2023-09-21'
  summary: {en: 'The NYUSIM_in_ns3 repository publishes its v1.0 release, with the drop-based ns-3 implementation tested on ns-3.39.', zh: NYUSIM_in_ns3 仓库发布 v1.0 版本，其中的 drop-based ns-3 实现在 ns-3.39 上测试。}
