- {en: 'First check statistics in drop mode, then enable spatial consistency to generate continuous trajectories.', zh: 先在 drop 模式复核统计量，再启用 spatial consistency 生成连续轨迹。}
- {en: Record the seed and parameter file; use independent changes to statistical parameters as stress tests., zh: 记录 seed 与参数文件，独立统计参数变化作为 stress test。}
overview: {en: 'NYUSIM is a channel simulator from NYU WIRELESS at New York University for sub-terahertz and millimeter-wave channels. The official page describes its statistical foundation as built on propagation measurements, validated through over a decade of measurements in urban, indoor, factory and rural environments. NYUSIM 4.0 for MATLAB covers 0.5 GHz to 150 GHz, with an RF bandwidth from CW to 1 GHz for each scenario, and models UMi, UMa, RMa, InH and InF under LOS and NLOS. Drop-based and spatial-consistency simulation modes are enabled for all five scenarios. An ns-3 version, NYUSIM 1.0, is available from the ns-3 app store. The output is channel realizations generated from a statistical model, not recorded data, and the MATLAB package is obtained through a download form for Windows or Mac.', zh: NYUSIM 是 New York University 的 NYU WIRELESS 发布的信道仿真器，用于亚太赫兹（sub-terahertz）与毫米波信道。官方页面将其统计基础描述为基于传播测量，并称该模型经过十余年测量的验证，测量环境包括城市、室内、工厂和乡村。MATLAB 版 NYUSIM 4.0 覆盖 0.5 GHz 至 150 GHz，各场景 RF
    带宽为 CW（0 Hz）至 1 GHz，涵盖 UMi、UMa、RMa、InH 和 InF 场景及 LOS 与 NLOS 两种情况。五个场景均支持 drop-based 与空间一致性两种仿真模式。ns-3 版本 NYUSIM 1.0 可从 ns-3 app store 获取。输出为统计模型生成的信道实现，而非记录数据；MATLAB 版需通过 Windows 或 Mac 的下载表单获取。}
signal_details:
- signal: paths
  text: {en: 'Multipath components (MPCs) in drop-based or spatially consistent channel realizations. Antenna patterns are stored in the 3Dant format, with gain, phase and polarization over azimuth and elevation. Gain is interpolated for each MPC in its departure and arrival directions, and the received power is adjusted accordingly. Drop-based mode gives statistically independent realizations for user-set TX-RX separations, and spatial-consistency mode gives responses that change smoothly with receiver motion.', zh: drop-based 或空间一致性信道实现中的多径分量（MPC）。天线方向图以 3Dant 格式存储，包含方位角与俯仰角上的增益、相位和极化。每个 MPC 在出发与到达方向上插值得到增益，并据此调整接收功率。drop-based 模式给出 TX-RX 间距由用户设定的统计独立实现，空间一致性模式给出随接收机运动平滑变化的响应。}
