summary: {en: 'Ray-traced indoor pathloss radio maps of 25 indoor environments at 868 MHz, 1.8 GHz and 3.5 GHz, sampled every 0.25 m. The test set of the ICASSP 2025 challenge is not part of the published data.', zh: 基于射线追踪生成的室内路径损耗无线电地图，覆盖25个室内环境，频率为868 MHz、1.8 GHz和3.5 GHz，采样间距为0.25 m。ICASSP 2025挑战赛的测试集未包含在已发布数据中。}
