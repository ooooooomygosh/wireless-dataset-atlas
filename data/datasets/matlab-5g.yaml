summary: {en: '5G NR waveforms, coding, link simulation, and channel-model implementations including CDL/TDL. Outputs can form training data, but the Toolbox does not define a unique data distribution.', zh: 5G NR 波形、编码、链路仿真与 CDL/TDL 等信道模型实现。其输出可构成训练数据，但 Toolbox 不对应唯一数据分布。}
checked: '2026-11-06'
pipeline:
  summary: {en: 'Define the NR transmitter configuration and channel, then filter waveforms or generate channel outputs directly; use receiver processing to measure errors/throughput. The toolbox is not a unified dataset.', zh: 先定义NR发送配置和信道，再过滤波形或直接生成信道输出，最后经接收处理统计误码/吞吐。工具箱不是统一数据集。}
  stages:
  - title: {en: Configure the NR link and transmit signal, zh: 配置NR链路与发送信号}
    detail: {en: Generate transmit resource grids and waveforms for the research task; transmitter settings determine what the receiver estimates and decodes., zh: 根据研究任务生成发送资源栅格和波形；发送端设置决定接收端估计和解码对象。}
    inputs:
    - {en: NR carrier/resource configuration, zh: NR载波/资源配置}
    - {en: 'Coding, modulation, reference signals, and payload bits', zh: 编码、调制、参考信号与业务比特}
    outputs:
    - {en: 'Transmit bits, resource grids, and time-domain waveforms', zh: 发送比特、资源栅格和时域波形}
    controls:
    - {en: 'Researcher specifies: numerology, bandwidth/resources, modulation and coding, DM-RS, and frame count', zh: 研究者固定：numerology、带宽/资源、调制编码、DM-RS与帧数}
    checks:
    - {en: Check that inputs and labels correspond to the same frame and resource locations, zh: 检查输入/标签对应同一帧与资源位置}
    - {en: Retain transmitted reference signals to distinguish estimated CSI from ground truth, zh: 保留发送参考信号以区分估计CSI与真值}
  - title: {en: Instantiate channels such as CDL/TDL, zh: 实例化CDL/TDL等信道}
    detail: {en: Configure nrCDLChannel or nrTDLChannel; handle CDL angle/array information and TDL use cases according to the respective objects., zh: 配置nrCDLChannel或nrTDLChannel；CDL的角度/阵列与TDL的用途区别按对应对象处理。}
    inputs:
    - {en: Channel profile, zh: 信道profile}
    - {en: 'Antenna, delay-spread, Doppler, and related parameters', zh: 天线、delay spread、Doppler等参数}
    outputs:
    - {en: Channel System object and configuration, zh: 信道System object及配置}
    controls:
    - {en: 'Researcher specifies: profile, DelaySpread, MaximumDopplerShift, SampleRate, and seed', zh: 研究者固定：profile、DelaySpread、MaximumDopplerShift、SampleRate与seed}
    checks:
    - {en: Check object-supported options against the selected release, zh: 核对对象支持的选项与所用release}
    - {en: Do not assume single-link CDL is a complete multisite spatially consistent model, zh: 不要把单链路CDL默认成完整多站点空间一致模型}
  - title: {en: Filter waveforms or output channels, zh: 过滤波形或输出信道}
    detail: {en: Apply the channel to waveforms and output path gains/sample times; disabling ChannelFiltering generates channels only. Direct OFDM-response support from R2024b requires version-appropriate calls., zh: 可对波形施加信道并输出path gains/sample times；关闭ChannelFiltering可只生成信道。R2024b起的直接OFDM response能力需按版本调用。}
    inputs:
    - {en: Transmit waveform or configuration with ChannelFiltering disabled, zh: 发送波形或ChannelFiltering关闭配置}
    outputs:
    - {en: Received waveforms, zh: 接收波形}
    - {en: 'Path gains, time samples, or OFDM channel responses', zh: path gains、时间采样或OFDM信道响应}
    controls:
    - {en: 'Researcher specifies: ChannelFiltering, output format, channel sampling, and normalization', zh: 研究者固定：ChannelFiltering、输出格式、信道采样与归一化}
    checks:
    - {en: Check filter delays and time alignment, zh: 核对滤波器时延与时间对齐}
    - {en: 'Distinguish output path gains, ideal CSI, and receiver-estimated CSI', zh: 区分输出路径增益、理想CSI与接收估计CSI}
  - title: {en: Add the receiver and error sources, zh: 加入接收机和误差来源}
    detail: {en: 'Run the receiver chain required by the task to obtain estimated channels, soft bits, and decoded results; ideal synchronization/estimation are optional baseline assumptions.', zh: 执行研究任务所需接收链，得到估计信道、软比特和解码结果；理想同步/估计是可选基线假设。}
    inputs:
    - {en: Channel-affected waveforms, zh: 受信道影响的波形}
    - {en: Noise and synchronization/channel-estimation/equalization configuration, zh: 噪声及同步/信道估计/均衡配置}
    outputs:
    - {en: Estimated CSI, zh: 估计CSI}
    - {en: Decoded data and error statistics, zh: 解码数据和错误统计}
    controls:
    - {en: 'Researcher specifies: SNR definition, synchronization assumptions, estimator, HARQ, and receiver algorithm', zh: 研究者固定：SNR定义、同步假设、估计器、HARQ与接收算法}
    checks:
    - {en: Compare ideal and practical estimation branches, zh: 比较理想与实际估计分支}
    - {en: Check noise-power consistency with antenna/FFT normalization, zh: 检查噪声功率与天线/FFT归一化一致}
  - title: {en: Save training samples and link metrics, zh: 保存训练样本与链路指标}
    detail: {en: 'Save samples with task configuration and compute BLER/throughput; for AI, explicitly define visible pilots, historical quantities, and label times.', zh: 按任务保存带配置的样本并统计BLER/吞吐；用于AI时显式限定可见导频、历史量和标签时间。}
    inputs:
    - {en: 'Channel ground truth, estimates, and decoding results', zh: 信道真值、估计量和解码结果}
    outputs:
    - {en: MAT arrays or researcher-defined formats, zh: MAT数组或研究者定义格式}
    - {en: 'BLER, throughput, and model samples', zh: BLER、吞吐与模型样本}
    controls:
    - {en: 'Researcher specifies: sampling windows, train/test profiles, SNR, and seed grouping', zh: 研究者固定：采样窗口、训练/测试profile、SNR和seed分组}
    checks:
    - {en: Avoid placing the same random channel trajectory in multiple splits, zh: 避免同一随机信道轨迹跨切分}
    - {en: Report decoding/throughput impact beyond prediction accuracy, zh: 预测准确率之外报告解码/吞吐影响}
  scope: {en: MathWorks 5G Toolbox link simulation and nrCDLChannel interfaces; outputs vary by MATLAB release., zh: MathWorks 5G Toolbox链路仿真与nrCDLChannel接口；输出随MATLAB release变化。}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: '• NR waveforms, channel outputs, and receiver results generated during a run', zh: • 运行后生成的NR波形、信道输出和接收机结果}
- label: {en: Derived outputs, zh: 派生输出}
  text: {en: '• CSI estimation/prediction samples

      • BLER/throughput and AI decision labels', zh: '• CSI估计/预测样本

