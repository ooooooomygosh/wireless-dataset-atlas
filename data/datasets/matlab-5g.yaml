tools: [project-colosseum-scenario-generator]
overview: {en: 'The MATLAB 5G Toolbox is a MathWorks toolbox for generating and simulating 5G NR signals, with standard-compliant functions and reference examples for the 3GPP 5G New Radio specifications. It covers waveform generation, link-level and system-level simulation with BLER as a link metric, golden reference verification, and conformance testing that includes O-RAN tests. The channel model nrCDLChannel implements the TR 38.901 CDL clustered delay line models, and for non-terrestrial networks it follows TR 38.811. Its outputs depend on the chosen configuration: the channel-impaired signal, path gains with sample times, or an OFDM channel response with a timing offset when a carrier configuration is passed. The documented defaults are the CDL-A delay profile, a 30 ns delay spread, a 4 GHz carrier frequency, a 5 Hz maximum Doppler shift and a 30.72 MHz sample rate. The toolbox is a generator, and the sources describe no fixed corpus or dataset. The release notes date the OFDM channel-response
    output to R2024b and the NTN delay profiles and GPU processing to R2026a.', zh: MATLAB 5G Toolbox 是 MathWorks 的工具箱，用于生成和仿真 5G NR 信号，提供符合 3GPP 5G New Radio 规范的标准兼容函数和参考示例。其功能包括波形生成、链路级与系统级仿真（以 BLER 作为链路指标）、黄金参考验证，以及包含 O-RAN 测试的一致性测试。信道模型 nrCDLChannel 实现 TR 38.901 的 CDL 簇延迟线模型，非地面网络场景遵循 TR 38.811。输出取决于所选配置：信道损伤后的信号、带采样时刻的路径增益，或在传入载波配置时输出带定时偏移的 OFDM 信道响应。文档给出的默认值为 CDL-A 时延分布、30 ns 时延扩展、4 GHz 载频、5 Hz 最大多普勒频移和 30.72 MHz 采样率。发行说明中，OFDM 信道响应输出见于 R2024b，NTN 时延分布和 GPU 处理见于 R2026a。}
signal_details:
- signal: iq
  text: {en: 'Waveforms are generated with the Wireless Waveform Generator app, and their analysis uses the Wireless Waveform Analyzer. nrCDLChannel takes an input signal (signalIn) and returns the channel-impaired output signal (signalOut); the default SampleRate is 30.72 MHz.', zh: 波形可用 Wireless Waveform Generator 应用生成，并用 Wireless Waveform Analyzer 分析。nrCDLChannel 接收输入信号 (signalIn)，返回经信道损伤后的输出信号 (signalOut)；默认 SampleRate 为 30.72 MHz。}
- signal: cir
  text: {en: 'With ChannelResponseOutput set to path-gains (the default), nrCDLChannel returns pathGains and sampleTimes, the fading path gains and the sample times of the channel snapshots. The getPathFilters object function returns the path filter impulse responses.', zh: 当 ChannelResponseOutput 设为 path-gains（默认值）时，nrCDLChannel 返回 pathGains 和 sampleTimes，即衰落路径增益与信道快照的采样时刻。getPathFilters 对象函数返回路径滤波器冲激响应。}
- signal: csi
  text: {en: 'With ChannelResponseOutput set to ofdm-response and an nrCarrierConfig object passed as input, nrCDLChannel returns ofdmResponse and timingOffset. The release notes date this option to R2024b. The toolbox page lists channel estimation as part of signal reception and recovery.', zh: 当 ChannelResponseOutput 设为 ofdm-response 并传入 nrCarrierConfig 对象时，nrCDLChannel 返回 ofdmResponse 和 timingOffset。发行说明中该选项的引入版本为 R2024b。工具箱页面将信道估计列为信号接收与恢复的一部分。}
