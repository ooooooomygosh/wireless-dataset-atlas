- {en: 'Confirmed: nrCDLChannel supports path-gain and time-sample outputs; ChannelFiltering can be disabled to generate channels only.', zh: 已确认：nrCDLChannel 支持路径增益与时间采样输出，并可关闭 ChannelFiltering 只生成信道。}
