id: contrawimae
name: ContraWiMAE Dataset
aliases: [ContraWiMAEDataset]
year: 2025
origin: ray-tracing
tasks: [foundation-model, beam-management, channel-estimation]
signals: [csi]
bands_ghz: [3.5, 28]
bandwidth_mhz: 0.96
environment: []
antennas: {tx: 32, rx: 1, array: ula}
subcarriers: 32
samples: about 2.5M pretraining samples (56 scenarios) and 0.55M downstream samples (10 scenarios)
size_gb: 25.5
format: NumPy NPZ
license: MIT
access: {url: 'https://huggingface.co/datasets/BerkIGuler/ContraWiMAEDataset', type: open}
code: ['https://github.com/BerkIGuler/WirelessContrastiveMaskedLearning']
paper: arxiv:2505.09160
used_in: []
citing: ['doi:10.1109/iccworkshops63917.2026.11586587', 'doi:10.1109/ojcoms.2026.3735905']
summary: {en: 'Simulated MISO channel samples generated with DeepMIMO ray tracing at 3.5 GHz, with 28 GHz channels for some downstream scenarios; each sample has 32 TX antennas, 32 subcarriers at 30 kHz spacing and up to 20 paths. Pretraining data cover 56 city scenarios (about 2.5M samples) and downstream data cover 10 unseen cities (about 0.55M samples).', zh: 基于 DeepMIMO 射线追踪生成的仿真 MISO 信道样本，载频为 3.5 GHz，部分下游场景为 28 GHz；每个样本包含 32 根发射天线、间隔 30 kHz 的 32 个子载波以及至多 20 条路径。预训练数据覆盖 56 个城市场景（约 250 万样本），下游数据覆盖 10 个未见城市（约 55 万样本）。}
sources: ['https://huggingface.co/datasets/BerkIGuler/ContraWiMAEDataset', 'https://arxiv.org/html/2505.09160v2', 'https://arxiv.org/abs/2505.09160', 'https://github.com/BerkIGuler/WirelessContrastiveMaskedLearning', 'https://huggingface.co/api/datasets/BerkIGuler/ContraWiMAEDataset', 'https://raw.githubusercontent.com/BerkIGuler/WirelessContrastiveMaskedLearning/master/README.md', 'https://raw.githubusercontent.com/BerkIGuler/WirelessContrastiveMaskedLearning/master/configs/default_training.yaml', 'https://raw.githubusercontent.com/BerkIGuler/WirelessContrastiveMaskedLearning/master/contrawimae/training/data_utils.py', 'https://raw.githubusercontent.com/BerkIGuler/WirelessContrastiveMaskedLearning/master/contrawimae/training/trainer.py', 'https://raw.githubusercontent.com/BerkIGuler/WirelessContrastiveMaskedLearning/master/contrawimae/models/modules/masking.py', 'https://raw.githubusercontent.com/BerkIGuler/WirelessContrastiveMaskedLearning/master/contrawimae/models/modules/augmentations.py',
  'https://huggingface.co/datasets/BerkIGuler/ContraWiMAEDataset/raw/main/README.md', 'https://huggingface.co/api/datasets/BerkIGuler/ContraWiMAEDataset/commits/main', 'https://huggingface.co/datasets/BerkIGuler/ContraWiMAEDataset/commits/main', 'https://arxiv.org/abs/2505.09160v1', 'https://arxiv.org/abs/2505.09160v2', 'https://github.com/BerkIGuler/WirelessContrastiveMaskedLearning/commits/master', 'https://github.com/BerkIGuler/WirelessContrastiveMaskedLearning/releases']
checked: '2026-11-06'
pipeline:
  summary: {en: 'DeepMIMO channels, user positions, LoS flags, original indices and beam labels are packaged into NPZ files. Training-set statistics standardize the real and imaginary parts, and the contrastive branch builds paired noisy views with paired real/imaginary masks.', zh: DeepMIMO 信道及用户位置、LoS 标志、原始索引和波束标签被封装为 NPZ 文件。训练集统计量用于标准化实部与虚部；对比分支构造成对的带噪视图与实虚配对掩码。}
  stages:
  - title: {en: Select scenarios and base stations, zh: 选择场景与基站}
    detail: {en: The data card lists about 2.5 million pretraining samples from 56 scenarios and 0.55 million downstream samples from 10 scenarios. Pretraining uses 3.5 GHz only; 28 GHz channels exist only for downstream scenarios that have ray-tracing data., zh: 数据卡列出约 250 万预训练样本（56 个场景）和 55 万下游样本（10 个场景）。预训练仅使用 3.5 GHz；28 GHz 信道只存在于具有射线追踪数据的下游场景中。}
    inputs:
    - {en: DeepMIMO ray-tracing scenarios and base stations, zh: DeepMIMO 射线追踪场景与基站}
    - {en: User positions and original indices, zh: 用户位置与原始索引}
    outputs:
    - {en: 'Links organized by scenario, base station and frequency', zh: 按场景、基站和频率组织的链路集合}
  - title: {en: Synthesize array-subcarrier channels, zh: 合成阵列-子载波信道}
    detail: {en: 'The samples use 32 antennas with half-wavelength spacing, 32 subcarriers at 30 kHz spacing, up to 20 paths and isotropic single-polarized elements, giving channels with example shape N × 1 × 32 × 32.', zh: 样本采用间距为半波长的 32 根天线、32 个子载波（间隔 30 kHz）、最多 20 条路径以及各向同性单极化阵元，示例 channels 形状为 N × 1 × 32 × 32。}
    inputs:
    - {en: Path and array parameters, zh: 路径与阵列参数}
    outputs:
    - {en: 'Complex CSI with positions, LoS flags and beam labels', zh: 复数 CSI，以及位置、LoS 标志与波束标签}
    checks:
    - {en: The paper states that its evaluation uses ray-tracing data with idealized antenna patterns, zh: 论文指出其评估使用理想化天线方向图的射线追踪数据}
  - title: {en: Package and load NPZ files, zh: NPZ 封装与加载}
    detail: {en: 'Each NPZ file holds six keys: channels, rx_pos, tx_pos, los, active_mask_original_indices and beam_labels. The loader takes channels[:, 0, :, :], converts it to complex64 and standardizes the real and imaginary parts separately.', zh: '每个 NPZ 文件包含六个键：channels、rx_pos、tx_pos、los、active_mask_original_indices 和 beam_labels。加载器取 channels[:, 0, :, :]，转换为 complex64，并分别标准化实部与虚部。'}
    outputs:
    - {en: Two-dimensional complex channel samples and labels for downstream tasks, zh: 二维复信道样本及下游任务标签}
    controls:
    - {en: The singleton receive axis is removed explicitly, zh: 显式去除单例接收轴}
  - title: {en: Split samples and fit normalization statistics, zh: 划分样本并拟合归一化统计量}
    detail: {en: 'The trainer builds the train and validation sets first, computes the real and imaginary means and standard deviations on the training set, and reuses them for validation. It supports scenario splits by filename pattern and random sample splits with seed 42.', zh: 训练器先建立训练集与验证集，再用训练集计算实部与虚部的均值和标准差，并复用于验证集。支持按文件名模式划分场景，也支持随机种子为 42 的样本划分。}
    controls:
    - {en: 'Code default val_split is 0.2; the default configuration sets 0.1, which matches the paper''s 90/10 split', zh: 代码默认 val_split 为 0.2；默认配置设为 0.1，与论文的 90/10 划分一致}
  - title: {en: Contrastive views and paired masks, zh: 对比视图与配对掩码}
    detail: {en: 'Positive views add AWGN at SNRs between 5 and 40 dB, and the mask generator hides the same patch positions in the real and imaginary parts. The paper sets the mask ratio to 0.9; the MaskGenerator class defaults to 0.6, and the default configuration uses 0.9.', zh: 正样本视图添加 SNR 介于 5 至 40 dB 之间的 AWGN，掩码生成器在实部和虚部的相同位置进行遮挡。论文掩码比例为 0.9；MaskGenerator 类的默认值为 0.6，默认配置使用 0.9。}
    controls:
    - {en: Frequency-shift and phase-rotation augmentations are disabled by default; the AWGN scaling assumes unit-variance channels, zh: 频移与相位旋转增广默认关闭；AWGN 缩放假设信道为单位方差}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: 'Six-key NPZ files: complex CSI (channels), coordinates (rx_pos, tx_pos), LoS flags, original indices and beam labels, together with the official training code and a default configuration.', zh: 六键 NPZ 文件：复数 CSI（channels）、坐标（rx_pos、tx_pos）、LoS 标志、原始索引与波束标签；另有官方训练代码和默认配置。}
- label: {en: Derived outputs, zh: 派生输出}
  text: {en: 'Training-set standardization statistics and, during training, noisy positive pairs with masks and reconstruction targets.', zh: 训练集标准化统计量；训练过程中生成带噪正样本对、掩码与重建目标。}
provenance:
- {en: DeepMIMO urban scenarios and RT paths, zh: DeepMIMO 城市场景与 RT 路径}
- {en: 'Channel postprocessing with 32 elements, 32 subcarriers, and 30 kHz spacing', zh: 32 阵元、32 子载波、30 kHz 间隔的信道后处理}
- {en: 'Up to 20 paths and isotropic, single-polarized elements', zh: 最多 20 条路径、各向同性单极化阵元}
- {en: Preserve coordinates/LoS/original indices and generate codebook labels, zh: 保留坐标/LoS/原始索引并生成码本标签}
- {en: Separate NPZ packages for pretraining and downstream data, zh: 预训练与下游 NPZ 分包}
technical_notes:
- {en: 'The simulation uses half-wavelength spacing, isotropic single-polarized antennas and up to 20 paths.', zh: 仿真采用半波长阵元间距、各向同性单极化天线，最多 20 条路径。}
- {en: 'The paper lists hardware impairments and over-the-air measurement validation as future work, and mobility and Doppler effects as a further extension.', zh: 论文将硬件损伤和空口（OTA）实测验证列为未来工作，并将移动性与多普勒效应列为进一步扩展。}
limitations:
- {en: 'The data card writes the beam_labels columns as beam_labels[:0], [:1] and [:2], with codebook sizes 16, 32 and 32, while its example output shows beam_labels with shape (N, 3).', zh: '数据卡将 beam_labels 各列写为 beam_labels[:0]、[:1] 与 [:2]，码本大小分别为 16、32 和 32；其示例输出中 beam_labels 的形状为 (N, 3)。'}
- {en: 'All samples come from DeepMIMO ray tracing, so the dataset covers a single simulation engine.', zh: 所有样本均来自 DeepMIMO 射线追踪，因此数据集仅覆盖一种仿真工具。}
history:
- {en: '2025-05-14: arXiv preprint v1 submitted.', zh: 2025-05-14：arXiv 预印本 v1 提交。}
- {en: '2025-10-22: arXiv v2, the extended version, posted.', zh: 2025-10-22：arXiv v2（扩展版）发布。}
- {en: 'The workshop paper ''Robust Channel Representation for Wireless: A Multi-Task Masked Contrastive Approach'' appeared at the NeurIPS 2025 AI4NextG workshop; the data card cites it as the earlier paper that introduced the dataset.', zh: '研讨会论文《Robust Channel Representation for Wireless: A Multi-Task Masked Contrastive Approach》发表于 NeurIPS 2025 AI4NextG 研讨会；数据卡称其为最早介绍该数据集的论文。'}
usage:
- {en: The data card's loading example reads one pretraining file and lists its keys and shapes; use the same check on a downloaded file., zh: 数据卡的加载示例读取一个预训练文件并列出其键与形状；下载的文件可用同样方式检查。}
- {en: 'The downstream train and test folders contain files from different cities, for example city_7_sandiego in train and city_3_houston in test.', zh: 下游 train 与 test 文件夹包含不同城市的文件，例如 train 中有 city_7_sandiego，test 中有 city_3_houston。}
- {en: The repository's data folder holds only a simple sample dataset stored with Git LFS; the complete NPZ data come from the data card., zh: 仓库的 data 目录仅包含一个使用 Git LFS 存储的简单样本数据集；完整 NPZ 数据来自数据卡。}
- {en: 'The paper''s system parameters match the LWM configuration, which allows direct comparison with LWM.', zh: 论文的系统参数与 LWM 配置一致，便于与 LWM 直接比较。}
field_notes:
- label: {en: Cross-frequency coverage, zh: 跨频覆盖}
  text: {en: Only some downstream scenarios include 28 GHz channels., zh: 只有部分下游场景包含 28 GHz 信道。}
- label: {en: Multi-BS, zh: 多基站}
  text: {en: 'Some scenarios have several base stations with uniformly distributed users, stored as separate per-BS files (bs000, bs001 and so on).', zh: 部分场景包含多个基站和均匀分布的用户，每个基站的数据存为独立文件（bs000、bs001 等）。}
- label: {en: Paths, zh: 路径}
  text: {en: Each NPZ file has six keys and no per-path arrays; the maximum of 20 paths is a parameter of the DeepMIMO generation., zh: 每个 NPZ 文件有六个键，不含逐径数组；最多 20 条路径是 DeepMIMO 生成时的参数。}
tools: [project-contrawimae, awesome-channel-foundation-models]
overview: {en: 'ContraWiMAE Dataset is a set of simulated complex MISO channel samples generated with DeepMIMO ray tracing. It is released on Hugging Face under the MIT license and accompanies arXiv paper 2505.09160. Each sample is one channel between a single-antenna user and a base station with 32 transmit antennas in a half-wavelength uniform linear array, over 32 subcarriers at 30 kHz spacing (960 kHz total), with up to 20 paths. The pretraining split has about 2.5M samples from 56 city scenarios at 3.5 GHz. The downstream split has about 0.55M samples from 10 unseen cities, and 28 GHz channels are included for some of these scenarios. The NPZ files are organized in sub6 and mmwave folders with pretrain and task/train and task/test splits, totalling 25.5 GB, and the paper evaluates cross-frequency beam selection, LoS detection and channel estimation.', zh: ContraWiMAE Dataset 是基于 DeepMIMO 光线追踪生成的仿真复数 MISO 信道样本集。数据以 MIT 许可证发布于 Hugging Face，并对应 arXiv 论文 2505.09160。每个样本是单天线用户与一个基站之间的信道，基站为
    32 根发射天线组成的半波长均匀线阵，包含 32 个子载波，间隔 30 kHz（总带宽 960 kHz），最多 20 条路径。预训练划分约含 250 万样本，来自 56 个城市场景，载频为 3.5 GHz。下游划分约含 55 万样本，来自 10 个未见城市，其中部分场景包含 28 GHz 信道。NPZ 文件分为 sub6 和 mmwave 两个文件夹，含 pretrain 以及 task/train、task/test 划分，总大小 25.5 GB；论文评估跨频段波束选择、LoS 检测和信道估计。}
signal_details:
- signal: csi
  text: {en: 'Complex channel matrices are stored under the channels key, with shape (N, 1, 32, 32) in the example file; the data card lists the axes as channels, RX antennas, TX antennas and subcarriers. Samples are simulated with DeepMIMO ray tracing at 3.5 GHz, and at 28 GHz for some downstream scenarios. Each file also stores rx_pos (user 3D position), tx_pos, los (0 for nLoS, 1 for LoS) and beam_labels (best-beam indices from uniform codebooks).', zh: '复数信道矩阵存储在 channels 键中，示例文件中形状为 (N, 1, 32, 32)；数据卡将各轴列为信道数、RX 天线、TX 天线和子载波。样本由 DeepMIMO 光线追踪仿真生成，载频为 3.5 GHz，部分下游场景另有 28 GHz。每个文件还存储 rx_pos（用户三维位置）、tx_pos、los（0 表示 nLoS，1 表示 LoS）以及 beam_labels（均匀码本下的最优波束索引）。'}
organization: University of California, Irvine
capabilities:
- key: csi
  status: provided
  note: {en: 'The channels key holds complex CSI with shape (N, 1, 32, 32) in the example file; all files are 3.5 GHz, and six downstream cities also have 28 GHz files.', zh: 'channels 键保存复数 CSI，示例文件中形状为 (N, 1, 32, 32)；所有文件为 3.5 GHz，六个下游城市另有 28 GHz 文件。'}
- key: cir
  status: derivable
  note: {en: Delay-domain taps follow from an inverse FFT over the 32 subcarriers (960 kHz total); the card does not document this step., zh: 时延域抽头可由 32 个子载波（总带宽 960 kHz）上的逆 FFT 得到；数据卡未记录该步骤。}
- key: paths
  status: simulate
  note: {en: 'Per-path arrays are not in the NPZ files; rerunning DeepMIMO ray tracing for the same scenarios regenerates them, with up to 20 paths.', zh: NPZ 文件中无逐径数组；对同一场景重新运行 DeepMIMO 射线追踪可生成，最多 20 条路径。}
- {key: interaction, status: unknown}
- key: power
  status: derivable
  note: {en: Received power per link follows from the channel magnitudes summed over subcarriers; no power field is stored., zh: 每条链路的接收功率可由各子载波信道幅度平方求和得到；文件中不存储功率字段。}
- key: iq
  status: none
  note: {en: 'Only processed complex channel matrices are released, with no raw I/Q samples.', zh: 仅发布处理后的复信道矩阵，不含原始 I/Q 采样。}
- key: beam_labels
  status: provided
  note: {en: 'Best-beam indices from uniform codebooks; the card lists codebook sizes 16, 32 and 32.', zh: 基于均匀码本的最优波束索引；数据卡列出码本大小为 16、32 和 32。}
- key: position
  status: provided
  note: {en: rx_pos gives the 3D user position and tx_pos the transmitter position., zh: rx_pos 为用户三维位置，tx_pos 为发射端位置。}
- {key: geometry, status: unknown}
- {key: materials, status: unknown}
- key: rgb
  status: none
  note: {en: 'The release contains channel NPZ files only, with no images.', zh: 发布内容仅为信道 NPZ 文件，不含图像。}
- key: depth
  status: none
  note: {en: 'The release contains channel NPZ files only, with no depth maps.', zh: 发布内容仅为信道 NPZ 文件，不含深度图。}
- key: lidar
  status: none
  note: {en: 'The release contains channel NPZ files only, with no point clouds.', zh: 发布内容仅为信道 NPZ 文件，不含点云。}
- key: radar
  status: none
  note: {en: 'The release contains channel NPZ files only, with no radar data.', zh: 发布内容仅为信道 NPZ 文件，不含雷达数据。}
- key: imu
  status: none
  note: {en: 'The release contains channel NPZ files only, with no inertial measurements.', zh: 发布内容仅为信道 NPZ 文件，不含惯性测量数据。}
- key: time_series
  status: none
  note: {en: Samples are single user-BS channels with no timestamps or ordered sequences., zh: 样本为单个用户与基站之间的信道，不含时间戳或有序序列。}
- key: multiuser
  status: derivable
  note: {en: Users in one scenario and base-station file can be grouped by original UE index; the card does not state that they are simultaneous., zh: 同一场景与基站文件中的用户可按原始 UE 索引分组；数据卡未说明它们是否同时存在。}
- key: multibs
  status: derivable
  note: {en: 'Per-BS files of one city can be matched by user index or position; the card does not confirm a shared, synchronized user set.', zh: 同一城市的各基站文件可按用户索引或位置对应；数据卡未确认存在共享且同步的用户集合。}
- key: crossfreq
  status: derivable
  note: {en: 'The 3.5 GHz and 28 GHz files of Austin, Columbus, Houston, Miami, San Diego and Dallas can be paired by user index or position; the card does not confirm the pairing.', zh: 奥斯汀、哥伦布、休斯顿、迈阿密、圣地亚哥和达拉斯的 3.5 GHz 与 28 GHz 文件可按用户索引或位置配对；数据卡未确认该配对。}
- {key: near_field, status: unknown}
- key: high_mobility
  status: none
  note: {en: The paper lists mobility and Doppler effects as a future extension., zh: 论文将移动性与多普勒效应列为后续扩展。}
- {key: dynamic_blockage, status: unknown}
- {key: reflection, status: unknown}
- {key: diffraction, status: unknown}
- {key: scattering, status: unknown}
- {key: transmission, status: unknown}
- key: polarization
  status: none
  note: {en: The array elements are isotropic and single-polarized., zh: 阵元为各向同性单极化。}
- key: em_field
  status: none
  note: {en: Only channel matrices are released; no field components or antenna patterns., zh: 仅发布信道矩阵，不含场分量或天线方向图。}
