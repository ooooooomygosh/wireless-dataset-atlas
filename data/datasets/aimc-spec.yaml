summary: {en: 'Synthetic radar intrapulse signals with 30 modulation types at 5 SNR levels, stored as complex I/Q pulses in HDF5 files with one file per modulation type. The dataset is built for spectrogram-based image classification.', zh: 合成雷达脉内信号，包含 30 种调制类型和 5 个信噪比等级，以复数 I/Q 脉冲形式存储于 HDF5 文件中，每种调制类型对应一个文件。数据面向基于频谱图的图像分类。}
sources: ['https://ieee-dataport.org/documents/aimc-spec', 'https://arxiv.org/abs/2601.08265']
checked: '2026-11-06'
overview: {en: 'AIMC-Spec is a synthetic dataset of radar intrapulse signals for automatic intrapulse modulation classification. Sebastian Cocks at the University of Adelaide produced it, and it was published on IEEE DataPort (DOI 10.21227/0xs0-3056, created 9 July 2025) and as the arXiv preprint 2601.08265 by Cocks, Dreo, Ng and Dayoub. It contains 30 modulation types at five SNR levels, +6, +3, 0, -3 and -6 dB. Each pulse is stored as complex I/Q samples in HDF5, with one file per modulation type in separate training and testing directories. The paper states 100,000 training and 1,000 test signals per modulation for each SNR level. The pulses are generated by a Python script, and the noise is additive white Gaussian noise applied when the data are loaded, so the noise is not stored in the files. The authors frame the data for spectrogram-based image classification and benchmark five deep learning architectures on one shared input format.', zh: 'AIMC-Spec 是用于自动脉内调制分类的雷达脉内信号合成数据集。该数据集由 University
    of Adelaide 的 Sebastian Cocks 制作，发布于 IEEE DataPort（DOI 10.21227/0xs0-3056，创建于 2025 年 7 月 9 日），并以 arXiv 预印本 2601.08265 的形式发布，作者为 Cocks、Dreo、Ng 和 Dayoub。数据包含 30 种调制类型，覆盖 5 个信噪比等级，即 +6、+3、0、-3 和 -6 dB。每个脉冲以复数 I/Q 采样形式存储于 HDF5 文件中，每种调制类型对应一个文件，训练集和测试集分别位于独立目录。论文给出每种调制、每个信噪比等级各 100,000 个训练信号和 1,000 个测试信号。脉冲由 Python 脚本生成，噪声为加性高斯白噪声，在数据加载时添加，因此噪声不存储在文件中。作者面向基于频谱图的图像分类设计数据，并在统一输入格式下对五种深度学习架构进行基准测试。'}
signal_details:
- signal: iq
  text: {en: 'Complex I/Q samples of single radar pulses, stored in HDF5 with one entry per pulse. Pulse width is drawn uniformly from 0.5 us to 18 us at 1 ns resolution. The sampling rate is 50 MHz. The carrier lies in a 50 MHz band centred at 9500 MHz, in 0.001 MHz steps. Additive white Gaussian noise is applied at +6, +3, 0, -3 and -6 dB, with SNR computed from the average pulse power excluding zero padding.', zh: 单个雷达脉冲的复数 I/Q 采样，以 HDF5 存储，每个脉冲为一个条目。脉宽在 0.5 us 至 18 us 之间均匀采样，分辨率为 1 ns。采样率为 50 MHz。载频位于以 9500 MHz 为中心的 50 MHz 频带内，步长为 0.001 MHz。以 +6、+3、0、-3 和 -6 dB 添加加性高斯白噪声，信噪比基于不含零填充的平均脉冲功率计算。}
pipeline:
  summary: {en: 'A Python script generates the pulses and stores them as complex I/Q in HDF5, then noise is added at load time and spectrograms are computed for classification.', zh: Python 脚本生成脉冲并以复数 I/Q 形式存储于 HDF5 中，随后在加载时添加噪声，并计算用于分类的频谱图。}
  stages:
  - title: {en: Pulse parameter sampling, zh: 脉冲参数采样}
    detail: {en: 'A Python script selects parameters for each modulation type. Pulse width is drawn uniformly from 0.5 us to 18 us at 1 ns resolution, and the carrier is drawn uniformly from a 50 MHz band centred at 9500 MHz in 0.001 MHz steps. No pulse width and carrier pair is repeated more than three times per modulation.', zh: Python 脚本为每种调制类型选择参数。脉宽在 0.5 us 至 18 us 之间均匀采样，分辨率 1 ns；载频在以 9500 MHz 为中心的 50 MHz 频带内以 0.001 MHz 步长均匀采样。每种调制中，任一脉宽与载频组合重复次数不超过三次。}
    inputs:
    - {en: 30 modulation types, zh: 30 种调制类型}
    outputs:
    - {en: Pulse parameter sets, zh: 脉冲参数组}
  - title: {en: Pulse synthesis, zh: 脉冲合成}
    detail: {en: The script synthesises complex I/Q pulses at a 50 MHz sampling rate. The paper gives no equations for the individual modulation types and states that release of the full generation pipeline was constrained., zh: 脚本以 50 MHz 采样率合成复数 I/Q 脉冲。论文未给出各调制类型的公式，并称完整生成流程的发布受到限制。}
    inputs:
    - {en: Pulse parameter sets, zh: 脉冲参数组}
    outputs:
    - {en: Complex I/Q pulses, zh: 复数 I/Q 脉冲}
  - title: {en: HDF5 storage, zh: HDF5 存储}
    detail: {en: Each modulation type is written with h5py to one binary .h5 file in the train or test directory. Each entry holds one pulse as complex I/Q samples with metadata. The paper reports 28 GB for the training directory and 288 MB for the test directory., zh: 每种调制类型通过 h5py 写入训练或测试目录中的一个二进制 .h5 文件。每个条目保存一个脉冲的复数 I/Q 采样及元数据。论文报告训练目录为 28 GB，测试目录为 288 MB。}
    inputs:
    - {en: Complex I/Q pulses, zh: 复数 I/Q 脉冲}
    outputs:
    - {en: 30 .h5 files per split, zh: 每个划分 30 个 .h5 文件}
  - title: {en: Noise addition, zh: 噪声添加}
    detail: {en: 'A custom Python dataset class adds additive white Gaussian noise to the raw complex pulse at load time, at +6, +3, 0, -3 and -6 dB. SNR is computed from the average pulse power excluding zero padding, so 0 dB means the pulse power equals the noise power.', zh: 自定义的 Python 数据集类在加载时将加性高斯白噪声添加到原始复数脉冲上，信噪比为 +6、+3、0、-3 和 -6 dB。信噪比基于不含零填充的平均脉冲功率计算，因此 0 dB 表示脉冲功率等于噪声功率。}
    inputs:
    - {en: Complex I/Q pulses, zh: 复数 I/Q 脉冲}
    outputs:
    - {en: Noisy complex pulses, zh: 加噪复数脉冲}
  - title: {en: Spectrogram computation, zh: 频谱图计算}
    detail: {en: 'The spectrogram uses a 256-point Hann window with 50% overlap, as stated in the Fig. 2 caption, and is computed with CuPy. Section IV gives different time-frequency transforms per model, including SPWVD images at 128x128 pixels and CWD and CTFD images at 64x64 pixels.', zh: 频谱图采用 256 点 Hann 窗、50% 重叠，见图 2 说明，并使用 CuPy 计算。第 IV 节为各模型给出不同的时频变换，包括 128x128 像素的 SPWVD 图像以及 64x64 像素的 CWD 和 CTFD 图像。}
    inputs:
    - {en: Noisy complex pulses, zh: 加噪复数脉冲}
    outputs:
    - {en: Spectrogram images, zh: 频谱图图像}
  - title: {en: Train and validation split, zh: 训练集与验证集划分}
    detail: {en: 'The script src/build_iq_train_subset.py builds reproducible train and validation subsets from the training data, using a chosen random seed and split ratio, drawn without replacement with balance per modulation. The paper''s experiments use an 80:20 split.', zh: '脚本 src/build_iq_train_subset.py 根据选定的随机种子和划分比例，从训练数据中构建可复现的训练集和验证集，采样不放回，并在每种调制类型内保持均衡。论文实验采用 80:20 的划分。'}
    inputs:
    - {en: Training directory, zh: 训练目录}
    outputs:
    - {en: Train and validation subsets, zh: 训练集和验证集}
