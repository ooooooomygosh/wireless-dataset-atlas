checked: '2026-11-06'
pipeline:
  summary: {en: 'A rotary unit moves the transmit antenna on a 2 m diameter circle while the receiver stays static in an adjacent room. A 100 MHz cable reference and encoder-triggered acquisition give each carrier the same transmit positions, and each run is recorded as a channel transfer function over snapshots and subcarriers.', zh: 旋转单元以 2 m 直径的圆形轨迹移动发射天线，接收端在相邻房间保持静止。100 MHz 有线参考与编码器触发采集使各载频采用相同的发射位置，每次运行记录为以快照和子载波为索引的信道传输函数。}
  scope: {en: 'Controlled rotating-trajectory single-link channel transfer functions at 2.55, 5.9 and 25.5 GHz, from the official repository and its README; the 2022 EuCAP paper describes the measurement method.', zh: 官方仓库及其 README 所述的受控旋转轨迹单链路信道传输函数，覆盖 2.55、5.9 和 25.5 GHz；测量方法见 2022 年 EuCAP 论文。}
  stages:
  - title: {en: Move the transmit antenna on a rotary arm, zh: 旋转臂带动发射天线运动}
    detail: {en: 'A rotary unit spins the transmit antenna about a central axis on a circular trajectory with a 2 m diameter, at a constant, adjustable speed. Each run starts and stops at -40 and +40 degrees, so the antenna covers an arc segment. The unit sits on a sliding board that moves along the x and y axes, and adjacent positions are 0.4 wavelength apart.', zh: 旋转单元使发射天线绕中心轴在直径 2 m 的圆形轨迹上以恒定且可调的速度运动。每次运行在旋转臂到达 -40 度和 +40 度时开始和停止，因此天线沿一段圆弧运动。旋转单元安装在可沿 x 轴和 y 轴移动的滑板上，相邻位置相隔 0.4 个波长。}
    inputs:
    - {en: Rotary unit on a sliding board, zh: 滑板上的旋转单元}
    outputs:
    - {en: Transmit positions along a circular arc, zh: 沿圆弧分布的发射位置}
  - title: {en: Fix the static receiver and laboratory, zh: 固定静止接收端与实验室环境}
    detail: {en: 'The receive antenna stays on a laboratory table in the adjacent room, about 10 m from the transmitter. The laboratory is the fading environment and must stay static between runs, so runs at different carriers and speeds can be compared.', zh: 接收天线固定在相邻房间的实验台上，距发射端约 10 m。实验室是衰落环境，各次运行之间须保持静止，以便比较不同载频和速度的运行。}
    controls:
    - {en: Fixed receive position in a static laboratory, zh: 接收位置固定，实验室保持静止}
  - title: {en: Synchronize and trigger acquisition, zh: 同步并触发采集}
    detail: {en: 'The arbitrary waveform generator at the transmitter and the signal analyzer at the receiver share a 100 MHz reference cable. A rotational encoder, decoded by a counter and comparator, sends a trigger by cable to both instruments, so every run starts at a defined arm position and each carrier uses the same transmit positions.', zh: 发射端任意波形发生器与接收端信号分析仪通过 100 MHz 参考线缆相连。旋转编码器的信号经计数器和比较器解码后，以线缆触发两台设备，使每次运行都在确定的旋转臂位置开始，各载频采用相同的发射位置。}
    controls:
    - {en: 100 MHz cable reference and encoder-triggered acquisition, zh: 100 MHz 线缆参考与编码器触发采集}
  - title: {en: Transmit OFDM training sequences, zh: 发送OFDM训练序列}
    detail: {en: 'The transmitter sends a low-PAPR Zadoff-Chu sequence as identical OFDM symbols, 50,000 per run, organized as 500 snapshots of 100 symbols. At the receiver, the first symbol of each snapshot serves as a cyclic prefix and is discarded, and the remaining 99 symbols are averaged to raise the SNR.', zh: '发射端以相同 OFDM 符号的形式发送低 PAPR 的 Zadoff-Chu 序列，每次运行 50,000 个符号，组织为 500 个快照，每个快照 100 个符号。接收端丢弃每个快照的第一个符号（作为循环前缀），并对其余 99 个符号取平均以提高 SNR。'}
  - title: {en: Estimate and store the channel transfer function per run, zh: 估计并存储每次运行的信道传输函数}
    detail: {en: 'The receiver obtains a time-variant channel transfer function for each run, indexed by snapshot and subcarrier. Each run is saved as a complex array with snapshots as rows and subcarriers as columns, together with a JSON file that records the center frequency, subcarrier count, sampling rates and record length.', zh: 接收端为每次运行得到以快照和子载波为索引的时变信道传输函数。每次运行保存为复数数组（行为快照，列为子载波），并附带记录中心频率、子载波数、采样率和记录长度的 JSON 文件。}
    outputs:
    - {en: Complex channel transfer function arrays (.npy) and run parameter files (.json), zh: 复数信道传输函数数组（.npy）和运行参数文件（.json）}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: 'Time-variant channel transfer function arrays (.npy), organized by carrier, campaign and speed; a JSON parameter file per run with center frequency, subcarrier count, sampling rates and record length.', zh: 时变信道传输函数数组（.npy），按载频、campaign 和速度组织；每次运行一个 JSON 参数文件，包含中心频率、子载波数、采样率和记录长度。}
- label: {en: Derived outputs, zh: 派生输出}
  text: {en: 'Channel impulse response obtained by an IFFT of each transfer function over subcarriers, as in the comparative example script.', zh: 对各传输函数沿子载波做 IFFT 得到信道冲激响应，与比较示例脚本一致。}
- label: {en: Grid layout, zh: 网格布局}
  text: {en: 'The 2.55 GHz campaign has 126 positions on a 7 by 18 grid in X and Y, spaced 0.4 wavelength apart, and eight speed folders from 20 to 200 km/h. Each of the four comparative scenarios has 126 grid positions.', zh: 2.55 GHz campaign 在 X 与 Y 方向上为 7 × 18 网格，共 126 个位置，相邻位置相隔 0.4 个波长，并有 20 至 200 km/h 的八个速度目录。四个比较场景各有 126 个网格位置。}
- label: {en: Array shape, zh: 数组形状}
  text: {en: The 2.55 GHz campaign file and the comparative files checked are 500 by 200 (snapshots by subcarriers); the 25.5 GHz scenario C file at 20 km/h is 499 by 2500., zh: 核查的 2.55 GHz campaign 文件与比较子集文件形状为 500 × 200（快照 × 子载波）；25.5 GHz 场景 C、20 km/h 文件形状为 499 × 2500。}
provenance:
- {en: Controlled static laboratory → moving antenna on a rotating arm, zh: 受控静态实验室 → 旋转臂移动天线}
- {en: Common frequency reference and position triggering → repeated measurements at different carriers, zh: 公共频率参考与位置触发 → 不同载频重复测量}
- {en: OFDM training signal → averaged estimates of time-varying CTF, zh: OFDM 训练信号 → 平均估计时变 CTF}
technical_notes:
- {en: 'The 20 and 200 km/h speeds are used in all three bands, and each carrier is measured at the same transmit positions.', zh: 20 和 200 km/h 两种速度在三个频段中均有，各载频在相同的发射位置测量。}
- {en: 'Frequency and time references run over cables (100 MHz reference and trigger lines), and the laboratory must remain static between runs.', zh: 频率与时间参考通过线缆传输（100 MHz 参考与触发线），各次运行之间实验室须保持静止。}
- {en: The 5.9 GHz and 25.5 GHz campaigns in the main folders use a single transmitter position., zh: 主目录中的 5.9 GHz 与 25.5 GHz campaign 使用单一发射位置。}
limitations:
- {en: 'The three carriers are measured in separate runs, not simultaneously.', zh: 三个载频分别在不同运行中测量，并非同时采集。}
- {en: 'Each run uses one transmit and one receive antenna, so the release contains no array channel.', zh: 每次运行使用一根发射天线和一根接收天线，因此数据中不含阵列信道。}
- {en: 'The 5.9 GHz and 25.5 GHz main-folder campaigns cover only 20 and 200 km/h, so cross-band pairing is limited to those speeds.', zh: 5.9 GHz 与 25.5 GHz 主目录 campaign 仅包含 20 和 200 km/h，因此跨频配对限于这两种速度。}
- {en: 'The 25.5 GHz scenario C file at 20 km/h has 499 snapshots, not the 500 given in the README.', zh: 25.5 GHz 场景 C、20 km/h 文件含 499 个快照，而非 README 所述的 500 个。}
- {en: 'The channel is measured in a static laboratory with a rotating antenna, not on public roads.', zh: 信道在静态实验室中以旋转天线测量，并非在公共道路上采集。}
history:
- {en: '2021: the testbed is described at WSA 2021 in the paper Sub 6 GHz versus mmWave Measurements in a Controlled High-Mobility Environment.', zh: 2021 年：测试平台在 WSA 2021 论文 Sub 6 GHz versus mmWave Measurements in a Controlled High-Mobility Environment 中描述。}
- {en: '2022: the EuCAP paper compares 2.55 GHz and 25.5 GHz channels measured at the same positions and velocities.', zh: 2022 年：EuCAP 论文比较了在相同位置和速度下测得的 2.55 GHz 与 25.5 GHz 信道。}
- {en: 'The IEEE DataPort record (doi:10.21227/3tpp-j394) is dated 30 October 2022.', zh: 'IEEE DataPort 记录（doi:10.21227/3tpp-j394）的日期为 2022 年 10 月 30 日。'}
usage:
- {en: Read measurement parameters and channel transfer functions from the band-specific directories; each speed has its own folder., zh: 从各频段目录读取测量参数与信道传输函数，每个速度对应一个目录。}
- {en: 'Comparative files are named estimated_channel_<scenario>_X<x>Y<y>.npy; example.py selects a scenario and grid position, then plots the transfer function and the impulse response.', zh: 比较子集文件命名为 estimated_channel_<scenario>_X<x>Y<y>.npy；example.py 选择场景与网格位置后，绘制传输函数与冲激响应。}
- {en: example.py uses a 100 MHz bandwidth to build the delay axis of the impulse response., zh: example.py 以 100 MHz 带宽构造冲激响应的时延轴。}
field_notes:
- label: {en: Paths, zh: 路径}
  text: {en: The release contains channel transfer function arrays and parameter files only; per-path angles and interaction records are not included., zh: 数据仅含信道传输函数数组和参数文件，不包含逐径角度和交互记录。}
- label: {en: Beam labels, zh: 波束标签}
  text: {en: The release has one transmit and one receive antenna and no beam-sweep labels., zh: 数据为一根发射天线与一根接收天线，不含波束扫描标签。}
overview: {en: 'Vienna Multi-Band Channel Sounding is a set of indoor laboratory channel measurements made by TU Wien at 2.55, 5.9 and 25.5 GHz. A rotary unit moves the transmit antenna on a circular trajectory 2 m in diameter at a constant, adjustable speed, while the receive antenna stays fixed on a table in an adjacent room about 10 m away. Each carrier is measured at the same transmit positions, and the speeds of 20 and 200 km/h appear in all three bands, so runs at different carriers can be paired by position and speed. Each run stores a time-variant channel transfer function over snapshots and OFDM subcarriers for one transmit and one receive antenna. The release is organized by carrier, campaign and speed, and the 2.55 GHz campaign covers 126 positions on a 7 by 18 grid. The measurements compare sub-6 GHz and mmWave channels in a controlled high-mobility setup, as described in a 2022 EuCAP paper.', zh: Vienna Multi-Band Channel Sounding 是 TU Wien 在室内实验室完成的信道测量，载频为 2.55、5.9 和 25.5
    GHz。旋转单元以恒定且可调的速度带动发射天线沿直径 2 m 的圆形轨迹运动，接收天线固定在相邻房间约 10 m 外的实验台上。各载频在相同的发射位置测量，20 和 200 km/h 两种速度在三个频段中均有，因此不同载频的运行可按位置和速度配对。每次运行给出以快照（时间）和 OFDM 子载波为索引的时变信道传输函数，收发均为单天线。数据按载频、campaign 和速度组织，2.55 GHz campaign 覆盖 7 × 18 网格上的 126 个位置。测量在受控的高速环境中比较 sub-6 GHz 与 mmWave 信道，对应 2022 年 EuCAP 论文。}
signal_details:
- signal: csi
  text: {en: 'Time-variant channel transfer function (CTF) indexed by snapshot and OFDM subcarrier, measured with one transmit and one receive antenna at 2.55, 5.9 and 25.5 GHz. Each run sends 50,000 identical OFDM symbols, organized as 500 snapshots of 100 symbols. The first symbol of each snapshot serves as the cyclic prefix and is discarded, and the remaining 99 symbols are averaged. The training signal is a low-PAPR Zadoff-Chu sequence.', zh: '以快照（时间）和 OFDM 子载波为索引的时变信道传输函数（CTF），收发均为单天线，载频为 2.55、5.9 和 25.5 GHz。每次运行发送 50,000 个相同的 OFDM 符号，组织为 500 个快照，每个快照 100 个符号。每个快照的第一个符号作为循环前缀并丢弃，其余 99 个符号取平均。训练序列为低 PAPR 的 Zadoff-Chu 序列。'}
size_gb: 0.64
bandwidth_mhz: 100
format: NPY, JSON
capabilities:
- key: csi
  status: provided
  note: {en: 'Complex CTF arrays per run: 500 snapshots by 200 subcarriers at 2.55 GHz, one transmit and one receive antenna.', zh: 每次运行给出复数 CTF 数组：2.55 GHz 为 500 个快照乘 200 个子载波，收发各一根天线。}
- key: cir
  status: derivable
  note: {en: 'The impulse response is an IFFT of the CTF over subcarriers, as in the comparative example.py.', zh: 冲激响应由 CTF 沿子载波做 IFFT 得到，方法见 comparative_analysis 中的 example.py。}
- key: paths
  status: none
  note: {en: 'The release holds CTF arrays and parameter JSON files only, with no per-path delays, angles or powers.', zh: 发布内容仅含 CTF 数组和参数 JSON 文件，不含逐径时延、角度或功率。}
- key: interaction
  status: none
  note: {en: No per-path geometry or interaction records are released., zh: 不含逐径几何或交互记录。}
- key: power
  status: derivable
  note: {en: Relative channel power follows from |H|^2 over subcarriers. The parameter files give output_level but no absolute received-power reference., zh: 相对信道功率可由各子载波 |H|^2 计算得到。参数文件给出 output_level，但没有绝对接收功率基准。}
- key: iq
  status: none
  note: {en: 'Only estimated CTF arrays are released, with no raw I/Q samples.', zh: 仅发布估计得到的 CTF 数组，不含原始 I/Q 采样。}
- key: beam_labels
  status: none
  note: {en: 'One transmit and one receive antenna per run, with no beam-sweep codebook labels.', zh: 每次运行收发各一根天线，没有波束扫描码本标签。}
- key: position
  status: derivable
  note: {en: Transmit grid indices X and Y are in the file names. Coordinates follow from the documented 0.4 wavelength spacing and the 2 m rotary arc., zh: 文件名中含发射位置网格索引 X 与 Y。坐标由文档给出的 0.4 个波长间距和 2 m 旋转圆弧推算。}
- key: geometry
  status: none
  note: {en: 'The README has a room-plan image only, with no 3D scene or map files.', zh: README 中仅有房间平面图图片，不含三维场景或地图文件。}
- key: materials
  status: none
  note: {en: 'No material parameters are released. The release holds CTF arrays, parameter files and an example script.', zh: 不含材料参数。发布内容为 CTF 数组、参数文件和示例脚本。}
- key: rgb
  status: none
  note: {en: No camera images are released., zh: 发布内容不含相机图像。}
- key: depth
  status: none
  note: {en: No depth images or depth sensor data are released., zh: 发布内容不含深度图像或深度传感器数据。}
- key: lidar
  status: none
  note: {en: No lidar data are released., zh: 发布内容不含激光雷达数据。}
- key: radar
