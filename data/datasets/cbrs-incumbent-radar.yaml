overview: {en: 'This is a synthetic RF dataset of incumbent radar waveforms in the 3.5 GHz CBRS band, hosted by NIST and described in a NIST J. Research data article by Caromi, Souryal and Hall. The waveforms are generated synthetically, with white Gaussian noise added to each one, and the radar signals span a range of modulation types and parameters. The start time and center frequency of each radar signal are randomized within the waveform. The task is binary: decide whether a radar is present, regardless of its signal type. The authors note that an energy detector is a naive baseline. The waveforms are distributed as MAT files split into groups, and the group and file numbers serve to track waveform records during generation and algorithm development. The dataset is intended for training and testing machine learning and deep learning detectors. The data are released under the NIST open license.', zh: 这是一个合成射频数据集，包含 3.5 GHz CBRS 频段内的在役雷达波形，由 NIST 发布，并附有 Caromi、Souryal 与 Hall 撰写的 NIST Journal
    of Research 数据论文。波形以合成方式生成，每条波形叠加高斯白噪声，雷达信号涵盖多种调制类型与参数。每个雷达信号的起始时间与中心频率在波形内随机化。任务为二分类：判断雷达是否存在，与信号类型无关。作者指出能量检测器是一个简单的基线方法。波形以 MAT 文件形式分组发布，组号与文件号用于在生成与算法开发过程中追踪波形记录。数据集用于训练与测试机器学习及深度学习检测器。数据以 NIST 开放许可发布。}
