  text: {en: 'Synthetic radar waveforms in the 3.5 GHz CBRS band with added white Gaussian noise. Modulation types and waveform parameters are randomized over wide ranges, and the start time and center frequency of each radar signal are randomized within the waveform. Distributed as .mat files in groups.', zh: 3.5 GHz CBRS 频段内的合成雷达波形，叠加高斯白噪声。调制类型与波形参数在较宽范围内随机化，每个雷达信号的起始时间与中心频率在波形内随机化。以 .mat 文件分组发布。}
