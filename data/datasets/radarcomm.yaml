- key: reflection
  status: provided
  note: {en: 'Present only in the 2.45 GHz over-the-air capture: inherent in the measurement, not labelled per path.', zh: 仅存在于 2.45 GHz 空口采集数据中：测量本身包含该机制，未按径标注。}
- key: diffraction
  status: provided
  note: {en: 'Present only in the 2.45 GHz over-the-air capture: inherent in the measurement, not labelled per path.', zh: 仅存在于 2.45 GHz 空口采集数据中：测量本身包含该机制，未按径标注。}
- key: scattering
  status: provided
  note: {en: 'Present only in the 2.45 GHz over-the-air capture: inherent in the measurement, not labelled per path.', zh: 仅存在于 2.45 GHz 空口采集数据中：测量本身包含该机制，未按径标注。}
- key: transmission
  status: provided
  note: {en: 'Present only in the 2.45 GHz over-the-air capture: inherent in the measurement, not labelled per path.', zh: 仅存在于 2.45 GHz 空口采集数据中：测量本身包含该机制，未按径标注。}
- key: polarization
  status: none
  note: {en: The over-the-air capture uses one VERT2450 antenna; no polarimetric data are listed., zh: 空口采集使用一个 VERT2450 天线；未列出极化测量数据。}
- key: em_field
