- key: imu
  status: none
  note: {en: No IMU data are released., zh: 未发布 IMU 数据。}
- {key: time_series, status: unknown}
- key: multiuser
  status: none
  note: {en: Each sample is a single waveform; no multi-user channel sets are described., zh: 每个样本为单一波形；未描述多用户信道集合。}
- key: multibs
  status: none
  note: {en: Each sample is a single waveform; no multi-base-station sets are described., zh: 每个样本为单一波形；未描述多基站集合。}
- key: crossfreq
  status: none
  note: {en: Only one band (2.45 GHz) is listed for the over-the-air capture; no paired multi-band data., zh: 空口采集仅列出一个频段（2.45 GHz）；无成对多频段数据。}
- key: near_field
  status: none
  note: {en: No array or spherical-wave modelling; the dataset is a waveform set., zh: 无阵列或球面波建模；本数据集为波形集合。}
- key: high_mobility
  status: none
  note: {en: The synthetic dynamic channel has a maximum Doppler frequency of 2 Hz., zh: 合成动态信道的最大多普勒频率为 2 Hz。}
- key: dynamic_blockage
  status: none
