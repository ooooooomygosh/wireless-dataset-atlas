- key: geometry
  status: none
  note: {en: No 3D scene or map files are released., zh: 未发布三维场景或地图文件。}
- key: materials
  status: none
  note: {en: No material parameters are released., zh: 未发布材料参数。}
- key: rgb
  status: none
  note: {en: No camera images are released., zh: 未发布相机图像。}
- key: depth
  status: none
  note: {en: No depth data are released., zh: 未发布深度数据。}
- key: lidar
  status: none
  note: {en: No LiDAR data are released., zh: 未发布 LiDAR 数据。}
