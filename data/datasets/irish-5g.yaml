summary: {en: 'Client-side 5G KPI traces from a major Irish mobile operator, logged with G-NetTrack Pro under static and car mobility for video streaming and file download traffic. The traces include channel, context, cell and throughput metrics, and the repository adds an ns-3 5G simulation framework for synthetic data.', zh: 来自爱尔兰一家主要移动运营商的客户端 5G KPI 数据，使用 G-NetTrack Pro 记录，覆盖静止和乘车两种移动模式下的视频流和文件下载流量。数据包含信道、上下文、小区和吞吐量指标，仓库另附 ns-3 5G 仿真框架用于生成合成数据。}
