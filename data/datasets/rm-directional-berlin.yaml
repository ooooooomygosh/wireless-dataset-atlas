summary: {en: 'Simulated path loss radio maps with directive transmitter antennas over Berlin city maps at 3.7 GHz, with building and vegetation height maps, transmitter parameters and RGBIR aerial images. The paper reports 74,515 radio maps covering 256 m x 256 m at 1 m spatial resolution.', zh: '基于柏林城市地图的仿真路径损耗无线电地图，采用定向发射天线，载频 3.7 GHz，并配有建筑与植被高度图、发射机参数以及 RGBIR 航拍图像。论文报告共 74,515 幅无线电地图，覆盖 256 m × 256 m 区域，空间分辨率为 1 m。'}
sources: ['https://arxiv.org/abs/2402.00878', 'https://arxiv.org/html/2402.00878', 'https://github.com/fabja19/RML', 'https://zenodo.org/records/10210089', 'https://zenodo.org/api/records/10210089', 'https://raw.githubusercontent.com/fabja19/RML/main/README.md', 'https://zenodo.org/api/records/10210089/versions', 'https://github.com/fabja19/RML_v2_img']
checked: '2026-11-06'
overview: {en: 'RMDirectionalBerlin is a simulated radio map dataset of path loss at 3.7 GHz over Berlin city maps, with directive transmitter antennas. It accompanies arXiv:2402.00878 by Fabian Jaensch, Giuseppe Caire and Begüm Demir, and is published on Zenodo under CC BY 4.0 (DOI 10.5281/zenodo.10210089, version 1, 27 November 2023). The paper reports 74,515 radio maps from 424 Berlin city maps, each covering 256 m x 256 m at 1 m resolution. The maps were produced by ray tracing in Wireless InSite, using building and vegetation height polygons derived from Berlin LiDAR data. The inputs include building and vegetation nDSMs, RGBIR aerial images, transmitter positions and parameters, antenna patterns and line-of-sight files. The main archive is 4.5 GB, the model checkpoints archive is 4.9 GB, and the GIS files archive is 56.9 MB. The data are intended for training CNN-based radio map estimators, and the code is in the RML repository.', zh: 'RMDirectionalBerlin 是柏林城市地图上 3.7 GHz 路径损耗的仿真无线电地图数据集，采用定向发射天线。数据集对应
    arXiv:2402.00878，作者为 Fabian Jaensch、Giuseppe Caire 与 Begüm Demir，发布于 Zenodo，采用 CC BY 4.0 许可（DOI 10.5281/zenodo.10210089，第 1 版，2023 年 11 月 27 日）。论文报告共 74,515 幅无线电地图，来自 424 张柏林城市地图，每幅覆盖 256 m x 256 m，分辨率为 1 m。地图由 Wireless InSite 射线追踪生成，使用基于柏林 LiDAR 数据得到的建筑与植被高度多边形。输入包括建筑与植被 nDSM、RGBIR 航拍图像、发射机位置与参数、天线方向图以及视距文件。主压缩包为 4.5 GB，模型检查点压缩包为 4.9 GB，GIS 文件压缩包为 56.9 MB。数据用于训练基于 CNN 的无线电地图估计模型，代码位于 RML 仓库。'}
signal_details:
- signal: pathloss
  text: {en: 'Path loss maps computed as simulated received power minus transmit power, cut off at the -127 dB noise floor and linearly scaled to [0, 1] as grayscale images. The simulation uses a 3.7 GHz carrier, isotropic receivers at 1.5 m height on a 1 m grid, and a maximum path loss setting of -50 dB.', zh: '路径损耗图由仿真接收功率减去发射功率得到，在 -127 dB 噪声底处截断，并线性缩放到 [0, 1] 的灰度图像。仿真载频为 3.7 GHz，接收机为各向同性天线，位于 1.5 m 高度，按 1 m 间距排列；最大路径损耗设置为 -50 dB。'}
pipeline:
  summary: {en: 'LiDAR point clouds become height polygons, which feed a Wireless InSite ray-tracing run, and the received power is converted into scaled path loss maps.', zh: LiDAR 点云被转换为高度多边形，输入 Wireless InSite 射线追踪仿真，接收功率再转换为缩放后的路径损耗图。}
  stages:
  - title: {en: LiDAR classification, zh: LiDAR 分类}
    detail: {en: 'Raw LiDAR point clouds from Geoportal Berlin are classified into ground, building and vegetation with LAStools. Building footprints refine the building class. The output is building and vegetation nDSMs, meaning heights above a flat ground approximation.', zh: 来自 Geoportal Berlin 的原始 LiDAR 点云通过 LAStools 分为地面、建筑与植被三类，建筑足迹用于细化建筑类别。输出为建筑与植被 nDSM，即相对于平坦地面近似的高度。}
    inputs:
    - {en: LiDAR point clouds and building footprints, zh: LiDAR 点云与建筑足迹}
    outputs:
    - {en: Building and vegetation nDSMs, zh: 建筑与植被 nDSM}
  - title: {en: Height polygon construction, zh: 高度多边形构建}
    detail: {en: Neighboring pixels of similar height in the nDSMs are grouped into 2D polygons with height attributes. Vegetation boundaries are interpolated more coarsely to reduce runtime., zh: nDSM 中高度相近的相邻像素被合并为带高度属性的二维多边形。植被边界采用较粗的插值以减少运行时间。}
    inputs:
    - {en: Building and vegetation nDSMs, zh: 建筑与植被 nDSM}
    outputs:
    - {en: 2D polygons with height attributes, zh: 带高度属性的二维多边形}
  - title: {en: Ray tracing, zh: 射线追踪}
    detail: {en: 'The Wireless InSite X3D model simulates each transmitter at 3.7 GHz with up to 2 reflections, 1 diffraction and 0 transmissions. Transmitters sit on roof edges and corners, 2 m from the roof, at heights of 6 m to 30 m above ground, with directive antennas whose half-power beam widths range from 15 to 90 degrees. Receivers form a grid with 1 m spacing at 1.5 m height.', zh: Wireless InSite X3D 模型以 3.7 GHz 对每个发射机进行仿真，最多 2 次反射、1 次绕射、0 次透射。发射机位于屋顶边缘和角点，距屋顶 2 m，离地高度 6 m 至 30 m，采用半功率波束宽度为 15 至 90 度的定向天线。接收机按 1 m 间距布置于 1.5 m 高度的网格上。}
    inputs:
    - {en: 'Height polygons, transmitter positions and antenna patterns', zh: 高度多边形、发射机位置与天线方向图}
    outputs:
    - {en: Received power at each receiver, zh: 每个接收机处的接收功率}
  - title: {en: Path loss map generation, zh: 路径损耗图生成}
    detail: {en: 'Path loss is the received power minus the transmit power. Values are cut off at the -127 dB noise floor and scaled linearly to [0, 1] as grayscale images, one map per 256 m x 256 m area at 1 m resolution.', zh: '路径损耗为接收功率减去发射功率。数值在 -127 dB 噪声底处截断，并线性缩放到 [0, 1] 作为灰度图像，每幅图对应 256 m x 256 m 区域，分辨率为 1 m。'}
    inputs:
    - {en: Received power and transmit power, zh: 接收功率与发射功率}
    outputs:
    - {en: Grayscale path loss radio maps, zh: 灰度路径损耗无线电地图}
organization: TU Berlin
samples: 74,515 radio maps
size_gb: 4.49
facts:
- label: {en: 'Train, validation and test split', zh: 训练、验证与测试划分}
  text: {en: '80% of the samples are used for training, 10% for validation and 10% for testing, with city maps kept disjoint between the sets.', zh: 80% 的样本用于训练，10% 用于验证，10% 用于测试，各集合之间的城市地图互不重叠。}
- label: {en: Path loss scale, zh: 路径损耗尺度}
  text: {en: 'Path loss is clipped at -127 dB and mapped linearly onto [0, 1], so an RMSE in grayscale multiplied by 77 gives an RMSE in dB.', zh: '路径损耗在 -127 dB 处截断并线性映射到 [0, 1]，因此灰度 RMSE 乘以 77 即为以 dB 计的 RMSE。'}
- label: {en: Material model, zh: 材料模型}
  text: {en: Ground and buildings are solid structures that reflect and diffract but do not transmit. Vegetation is modelled only as an attenuating material., zh: 地面与建筑被视为实体结构，可反射与绕射但不透射。植被仅建模为衰减材料。}
- label: {en: Archive layout, zh: 压缩包结构}
  text: {en: 'RMBerlinDirectional.zip contains path_gain (target radio maps as PNG), gis (building and vegetation nDSMs as PNG), img (RGBIR aerial images as TIF), tx_antennas and antenna_patterns (NPY), los (NPY), and JSON files listing sample IDs and transmitter settings.', zh: RMBerlinDirectional.zip 包含 path_gain（目标无线电地图，PNG）、gis（建筑与植被 nDSM，PNG）、img（RGBIR 航拍图像，TIF）、tx_antennas 与 antenna_patterns（NPY）、los（NPY），以及列出样本编号和发射机设置的 JSON 文件。}
limitations:
- {en: The paper notes a few minor errors in the classification or shapes of the building and vegetation maps., zh: 论文指出，建筑与植被地图的分类或形状中仍有少量误差。}
- {en: 'The exact materials of individual buildings and tree types are unknown, so standard material types were assigned on import.', zh: 单栋建筑与树种的具体材料无法确定，因此导入仿真时统一赋予标准材料类型。}
history:
- {en: 'Version 1 was published on Zenodo on 27 November 2023. The Zenodo record points to a newer version (DOI 10.5281/zenodo.10210088) with updated results on radio map prediction from images, and the code repository points to a v2 repository (RML_v2_img) for the same topic.', zh: 第 1 版于 2023 年 11 月 27 日发布于 Zenodo。Zenodo 记录指向一个较新版本（DOI 10.5281/zenodo.10210088），其中包含基于图像的无线电地图预测的更新结果；代码仓库则指向同一主题的 v2 仓库（RML_v2_img）。}
capabilities:
- key: csi
  status: simulate
  note: {en: Complex channel values are not stored; only path loss maps are released. Re-running the Wireless InSite ray tracing on the released polygons and transmitter settings would produce them., zh: 未存储复数信道值，仅发布路径损耗图。需基于已发布的多边形与发射机设置重新运行 Wireless InSite 射线追踪。}
- key: cir
  status: simulate
  note: {en: No impulse responses or delay profiles are released; re-running the ray tracing would produce them., zh: 未发布冲激响应或时延功率谱；重新运行射线追踪可得到。}
- key: paths
  status: simulate
  note: {en: 'No per-path delays, angles or powers are released; re-running the ray tracing would produce them.', zh: 未发布逐径时延、角度或功率；重新运行射线追踪可得到。}
- key: interaction
  status: simulate
  note: {en: No per-path interaction records are released; re-running the ray tracing with up to 2 reflections and 1 diffraction would produce them., zh: 未发布逐径交互记录；按最多 2 次反射、1 次绕射重新运行射线追踪可得到。}
- key: power
  status: provided
  note: {en: 'Path loss maps are released as grayscale PNG images. Values are clipped at -127 dB and scaled linearly to [0, 1] over the range -127 to -50 dB, so dB values follow from the inverse scaling.', zh: '路径损耗图以灰度 PNG 形式发布。数值在 -127 dB 处截断，并线性映射到 [0, 1]（对应 -127 至 -50 dB），可通过反向缩放得到 dB 值。'}
- key: iq
  status: none
  note: {en: The data are path loss radio maps; no I/Q samples are released., zh: 数据为路径损耗无线电地图，未发布 I/Q 采样。}
- key: beam_labels
  status: simulate
  note: {en: 'The release includes the 3D scene, so re-running a ray tracer on it produces this output.', zh: 发布内容包含三维场景，在其上重新运行射线追踪即可产生该输出。}
- key: position
  status: provided
  note: {en: Transmitter positions and parameters are released for each sample; receivers lie on a 1 m grid at 1.5 m height. No GPS data., zh: 每个样本发布发射机位置与参数；接收机位于 1.5 m 高度、1 m 间距的网格上。无 GPS 数据。}
- key: geometry
  status: provided
  note: {en: Building and vegetation nDSM height maps and simplified height polygons in GeoJSON are released; a separate X3D scene file is not listed., zh: 发布建筑与植被 nDSM 高度图以及 GeoJSON 格式的简化高度多边形；文件列表中未列出单独的 X3D 场景文件。}
- key: materials
  status: none
  note: {en: No material parameter files are released; standard material types are assigned on import., zh: 未发布材料参数文件；导入仿真时赋予标准材料类型。}
- key: rgb
  status: provided
  note: {en: RGBIR aerial images are released as TIF files for each sample (img folder)., zh: 每个样本的 RGBIR 航拍图像以 TIF 格式发布（img 文件夹）。}
- key: depth
  status: none
  note: {en: 'Height maps are nDSMs above a flat ground approximation, not camera depth images.', zh: 高度图为相对平坦地面近似的 nDSM，而非相机深度图。}
- key: lidar
  status: none
  note: {en: Raw LiDAR point clouds are not released; the released height maps are derived from them., zh: 未发布原始 LiDAR 点云；已发布的高度图由其导出。}
- key: radar
  status: none
  note: {en: RF simulation dataset; no radar sensing data., zh: 射频仿真数据集，无雷达感知数据。}
- key: imu
  status: none
  note: {en: No IMU data are released., zh: 未发布 IMU 数据。}
- key: time_series
  status: none
  note: {en: 'Static snapshots: each sample is one map for one transmitter setting, with no timestamps or ordered sequences.', zh: 静态快照：每个样本为一个发射机设置下的一幅地图，无时间戳或有序序列。}
