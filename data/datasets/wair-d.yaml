technical_notes:
- {en: 'Supported by the literature: the original text describes direct, reflected, and diffracted paths; diffuse scattering was not inferred from this.', zh: 文献支持：原文说明直达、反射、绕射路径；未据此推断漫散射启用。}
- {en: 'Supported by the literature: BS height is 6 m and UE height is 1.5 m, with omnidirectional antennas during RT.', zh: 文献支持：BS 高 6 m、UE 高 1.5 m，RT 阶段使用全向天线。}
- {en: 'Supported by the literature: UE positions are resampled when no propagation paths exist.', zh: 文献支持：无传播路径的 UE 会重新抽取位置。}
- {en: 'Inference: this selection biases samples toward connected links; outage studies need regeneration that retains empty-path cases.', zh: 推断：上述选择条件使样本偏向可连接链路，outage 研究需要重新生成保留空路径。}
limitations:
- {en: A frequency-response generation formula does not turn 2.6 GHz into publicly released 3.5 GHz data., zh: 不能用频率响应生成公式将 2.6 GHz 标成已公开 3.5 GHz。}
- {en: Map extent and shared regions within a city affect the strength of OOD evaluation., zh: 地图范围与同城区域共享会影响 OOD 强度。}
- {en: Mark unverified material parameters and cross-frequency path-set relationships as unknown., zh: 材料参数与路径集合跨频关系未核实应显示未知。}
history:
- {en: '2022: the original paper defines two scenarios and five-band responses.', zh: 2022：原论文定义两个场景及五频段响应。}
usage:
- {en: 'Obtain files through the original paper''s access route; first check layouts, BS/UE IDs, and H_cf_G.npy.', zh: 从原论文入口取得文件，先核查布局、BS/UE IDs 和 H_cf_G.npy。}
- {en: Fix array responses and subcarriers to generate complex CSI; retain same-link IDs across all five frequencies., zh: 固定阵列响应和子载波，生成复数 CSI；保留五频同链路 ID。}
- {en: Separate environments/cities; do not call random UE splits generalization to new sites., zh: 按环境/城市隔离；不要把随机 UE 划分称作新站点泛化。}
paper_summary:
- label: {en: System, zh: 系统}
  text: {en: 'Transforms partial STF-domain CSI into the DDA domain, reconstructing channels with windowed attention and frame-structure encoding; task heads use a frozen encoder.', zh: 部分STF域CSI变换到DDA域，以窗口注意力与帧结构编码恢复信道；冻结编码器接任务头。}
- label: {en: Prediction target, zh: 预测对象}
  text: {en: 'Time/frequency extrapolation, pilot-based channel estimation, sub-6-assisted 28 GHz beam classes, and LoS.', zh: 时间/频率外推、导频信道估计、sub-6辅助28 GHz beam类别与LoS。}
- label: {en: Decision target, zh: 决策目标}
  text: {en: 'Evaluated with NMSE, beam Top-1, and LoS F1; final communication utility is still missing.', zh: 以NMSE、beam Top-1和LoS F1评估；尚缺最终通信效用。}
- label: {en: Protocol, zh: 评估协议}
  text: {en: 'DeepMIMO pretraining uses 18 cities with 4 held out; WAIR-D is split by environment. LuViRA uses 17 trajectories for adaptation and 70 for testing, constituting adaptation to measured data.', zh: DeepMIMO 18城预训练、4城留出；WAIR-D按环境隔离。LuViRA为17条轨迹适配、70条轨迹测试，属于实测适配。}
- label: {en: Key finding, zh: 主要发现}
  text: {en: The paper separates simulation holdouts from LuViRA measurement adaptation; LuViRA results use target-domain training trajectories and therefore represent measured-domain adaptation. Current public HF assets cover only part of the derived test data., zh: 论文将仿真留出与LuViRA实测适配分开；LuViRA结果使用目标域训练轨迹，属于实测域适配。当前公开HF资产只覆盖部分测试派生数据。}
- label: {en: Remaining gap, zh: 尚未解决的问题}
  text: {en: Test NMSE gains against low-order physics-based predictors and final rates; do not infer current public-asset coverage from the paper's 2.85M-sample training corpus., zh: 用低阶物理预测器和最终速率检验NMSE收益；当前公开资产的覆盖范围不能按论文2.85M训练语料规模直接推定。}
overview: {en: 'WAIR-D (Wireless AI Research Dataset) is a simulated dataset of radio propagation paths and channel responses. Huawei Wireless Technology Laboratory and Zhejiang University published it in 2022 (arXiv:2212.02159). Scenario 1 has 10,000 environments with 5 base stations and 30 UEs in each, giving 1.5 million radio links. Scenario 2 has 100 environments with 1 base station and 10,000 UEs in each, giving 1 million radio links. The environments come from OpenStreetMap building and street data for more than 40 cities. The authors place base stations and UEs at random and trace the propagation paths with the PyLayers 3D ray tracer. Every BS-UE link keeps at least one propagation path, because a UE without a path is placed again. The files contain no measured channels. Channel matrices are computed from the stored paths for the bandwidth, subcarrier and antenna settings chosen by the user. The paper demonstrates environment reconstruction from channel data and spatial beam prediction,
    in which 16 of 64 beams are measured.', zh: 'WAIR-D（Wireless AI Research Dataset）是无线传播路径与信道响应的仿真数据集，由华为无线技术实验室与浙江大学于 2022 年发布（arXiv:2212.02159）。场景 1 包含 10,000 个环境，每个环境 5 个基站、30 个 UE，共 150 万条无线链路。场景 2 包含 100 个环境，每个环境 1 个基站、10,000 个 UE，共 100 万条无线链路。环境取自 OpenStreetMap 中 40 多个城市的建筑与街道数据。作者在每个环境中随机放置基站与 UE，并使用 PyLayers 三维射线追踪器计算传播路径。每条 BS-UE 链路至少保留一条传播路径，没有路径的 UE 会被重新放置。文件中不含实测信道。信道矩阵由存储的路径，按用户选定的带宽、子载波与天线设置计算得到。论文演示了基于信道数据的环境重建，以及空间波束预测（64 个波束中测量 16 个）。'}
signal_details:
- signal: paths
  text: {en: 'Path.npy stores the delay, angle of arrival (AoA) and angle of departure (AoD) of each propagation path of every radio link in an environment. Path responses at five carrier frequencies, 2.6, 6, 28, 60 and 100 GHz, are stored in H_cf_G.npy files, where cf is the carrier frequency. The paths are computed with PyLayers on OSM maps with omnidirectional antennas at 6 m (BS) and 1.5 m (UE). The paper states that direct, reflected and diffracted paths are included, and that the LOS or NLOS label of each path can be read from the data.', zh: Path.npy 存储每个环境中所有无线链路的每条传播路径的时延、到达角（AoA）和离开角（AoD）。五个载频 2.6、6、28、60 和 100 GHz 的路径响应分别存于 H_cf_G.npy 文件中，cf 为载频。路径由 PyLayers 基于 OSM 地图计算，基站高 6 m、UE 高 1.5 m，均采用全向天线。论文指出结果包含直达、反射与绕射路径，每条路径的 LOS 或 NLOS 标签可根据数据判定。}
- signal: csi
  text: {en: 'The channel frequency response of a link is the sum over paths of the path response times exp(-j2 pi f tau), where tau is the path delay and f is a frequency vector set by the user. For OFDM, the subcarrier frequencies follow from bandwidth, subcarrier spacing and carrier frequency. The antenna dimension comes from UPA or other response matrices computed from AoA and AoD. The generation code is supplied as generator.py, parameters.py and util.py. Table 1 of the paper gives two settings. Environment reconstruction uses 6 GHz, 31.25 MHz bandwidth, 64 OFDM subcarriers and 16T4R antennas. Spatial beam prediction uses 28 GHz, 46.08 MHz bandwidth, 384 OFDM subcarriers and 64T1R antennas. Both use half-wavelength antenna spacing.', zh: 链路的信道频率响应，是各路径响应乘以 exp(-j2πfτ) 后求和得到，其中 τ 为路径时延，f 为用户设定的频率向量。对于 OFDM，子载波频率由带宽、子载波间隔和载频确定。天线维度由 UPA 或其他天线响应矩阵依据 AoA 与 AoD 计算得到。生成代码为 generator.py、parameters.py 和 util.py。论文表 1 给出两组设置：环境重建采用 6 GHz、31.25 MHz 带宽、64 个 OFDM 子载波和 16T4R 天线；空间波束预测采用 28 GHz、46.08
      MHz 带宽、384 个 OFDM 子载波和 64T1R 天线。两组天线间距均为半波长。}
