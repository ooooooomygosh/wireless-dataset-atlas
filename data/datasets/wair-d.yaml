code: []
paper: arxiv:2212.02159
used_in: ['doi:10.1109/lwc.2025.3578370']
citing: ['doi:10.1109/lwc.2024.3402102', 'doi:10.1109/jstsp.2024.3453548']
summary: {en: 'WAIR-D contains ray-traced radio propagation paths and path responses on real city maps for two scenarios: 10,000 environments with 5 base stations and 30 UEs each, and 100 environments with 1 base station and 10,000 UEs each. Path responses are provided at 2.6, 6, 28, 60 and 100 GHz.', zh: 'WAIR-D 包含基于真实城市地图、由射线追踪生成的无线传播路径与路径响应数据，共两个场景：10,000 个环境（每个环境 5 个基站、30 个用户）和 100 个环境（每个环境 1 个基站、10,000 个用户）。路径响应提供 2.6、6、28、60 和 100 GHz 五个载频。'}
sources: ['https://arxiv.org/abs/2212.02159', 'https://arxiv.org/pdf/2212.02159', 'https://www.mobileai-dataset.com/html/default/yingwen/DateSet/1590994253188792322.html?index=1', 'https://arxiv.org/abs/2212.02159v1']
checked: '2026-11-06'
pipeline:
  summary: {en: 'Environments are cut from OpenStreetMap buildings and streets in more than 40 cities, BSs and UEs are dropped at random, and PyLayers computes omnidirectional per-path responses at five carriers. CSI is then synthesized from the stored paths with the chosen array and OFDM settings. Map sources are real; propagation outputs are simulated.', zh: 从 40 多个城市的 OpenStreetMap 建筑与街道数据中截取环境，随机放置 BS 与 UE，并由 PyLayers 计算五个载频下的全向逐路径响应。随后按所选阵列与 OFDM 设置，由存储的路径合成 CSI。地图来源真实，传播输出为仿真结果。}
  scope: {en: 'Generation workflow from Section II and Table 1 of the original WAIR-D paper (arXiv:2212.02159).', zh: 'WAIR-D 原论文（arXiv:2212.02159）第 II 节与表 1 所述的生成流程。'}
  stages:
  - title: {en: Extract environments from OpenStreetMap, zh: 从OpenStreetMap提取环境}
    detail: {en: 'The simulator visits random locations in more than 40 large cities and reads buildings and streets from OpenStreetMap. Each environment is stored separately with its map image, and its region size is kept in Info.npy.', zh: 模拟器随机访问 40 多个大城市中的位置，从 OpenStreetMap 读取建筑与街道。每个环境单独保存其地图图像，区域尺寸保存在 Info.npy 中。}
    inputs:
    - {en: OpenStreetMap buildings and streets, zh: OpenStreetMap 建筑与街道}
    outputs:
    - {en: Environment map image and region size, zh: 环境地图图像与区域尺寸}
  - title: {en: Drop BSs and UEs, zh: 放置BS与UE}
    detail: {en: 'BSs and UEs are dropped at random in each environment. BS height is 6 m and UE height is 1.5 m, and both use omnidirectional antennas. A UE whose link to a BS has no propagation path is dropped again. Scenario 1 has 5 BSs and 30 UEs in each of 10,000 environments; Scenario 2 has 1 BS and 10,000 UEs in each of 100 environments picked from the Scenario 1 set.', zh: '在每个环境中随机放置 BS 与 UE，BS 高 6 m，UE 高 1.5 m，二者均为全向天线。若某 UE 与某 BS 之间的链路没有传播路径，则重新放置该 UE。场景 1 为 10,000 个环境，每个环境 5 个 BS 和 30 个 UE；场景 2 从场景 1 的环境中选取 100 个，每个环境 1 个 BS 和 10,000 个 UE。'}
    outputs:
    - {en: Node coordinates and BS-UE link list, zh: 节点坐标与 BS-UE 链路清单}
  - title: {en: Trace propagation paths with PyLayers, zh: 用PyLayers追踪传播路径}
    detail: {en: 'PyLayers computes direct, reflected and diffracted paths for each BS-UE link. Path.npy stores the delay, AoA and AoD of every path, and H_cf_G.npy stores the path responses for each of the five carriers, 2.6, 6, 28, 60 and 100 GHz.', zh: PyLayers 计算每条 BS-UE 链路的直达、反射和绕射路径。Path.npy 保存每条路径的时延、AoA 与 AoD，H_cf_G.npy 保存 2.6、6、28、60 和 100 GHz 五个载频各自的路径响应。}
    outputs:
    - {en: 'Per-path delay, AoA and AoD; path responses per carrier', zh: 逐路径时延、AoA 与 AoD；各载频的路径响应}
  - title: {en: Synthesize CSI from the stored paths, zh: 由存储路径合成CSI}
    detail: {en: 'For a chosen frequency vector f, the channel frequency response of a link is the sum over its paths of each path response times exp(-j2 pi f tau), where tau is the path delay. OFDM subcarrier frequencies follow from bandwidth, subcarrier spacing and carrier frequency. UPA or other array responses computed from AoA and AoD add the antenna dimension.', zh: 对于所选频率向量 f，链路的信道频率响应为其各路径响应乘以 exp(-j2πfτ) 后求和，τ 为路径时延。OFDM 子载波频率由带宽、子载波间隔和载频确定。由 AoA 与 AoD 计算的 UPA 或其他阵列响应加入天线维度。}
    inputs:
    - {en: 'Stored paths, array response, OFDM configuration', zh: 存储的路径、阵列响应与 OFDM 配置}
    outputs:
    - {en: MIMO-OFDM CSI for the chosen configuration, zh: 所选配置下的 MIMO-OFDM CSI}
  - title: {en: Build the example tasks, zh: 构建示例任务}
    detail: {en: 'The paper''s examples are environment reconstruction, with 6 GHz, 31.25 MHz, 64 subcarriers, 16T4R arrays and 150 links per environment, and spatial beam prediction, with 28 GHz, 46.08 MHz, 384 subcarriers and 64T1R arrays. In the beam example, 16 of 64 beams are measured and K in {1, 2, 3, 5, 7} candidate beams are chosen. The release includes positioning example code.', zh: '论文的示例任务包括环境重建（6 GHz、31.25 MHz、64 个子载波、16T4R 阵列，每个环境 150 条链路）与空间波束预测（28 GHz、46.08 MHz、384 个子载波、64T1R 阵列）。波束示例中，64 个波束测量 16 个，并从中选取 K ∈ {1, 2, 3, 5, 7} 个候选波束。数据中包含定位示例代码。'}
    outputs:
    - {en: 'Task inputs and labels for reconstruction, beam and positioning examples', zh: 环境重建、波束与定位示例的任务输入与标签}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: 'Per-environment folders (for example data/scenario_1/00001) with environment.png, Info.npy (BS and UE positions and region size), Path.npy (delay, AoA and AoD of each path) and H_cf_G.npy (path responses at each carrier).', zh: 每个环境一个文件夹（如 data/scenario_1/00001），包含 environment.png、Info.npy（BS 与 UE 位置及区域尺寸）、Path.npy（每条路径的时延、AoA 与 AoD）和 H_cf_G.npy（各载频的路径响应）。}
- label: {en: Derived outputs, zh: 派生输出}
  text: {en: 'Channel frequency responses and MIMO-OFDM CSI computed from the stored paths for a chosen carrier, bandwidth, subcarrier set and antenna array; per-path LOS or NLOS labels.', zh: 根据所选载频、带宽、子载波集合和天线阵列，由存储的路径计算得到的信道频率响应与 MIMO-OFDM CSI；每条路径的 LOS 或 NLOS 标签。}
- label: {en: Link counts, zh: 链路数量}
  text: {en: 'Scenario 1 has 150 radio links per environment; Scenario 2 has 10,000 links per environment, all from one BS.', zh: '场景 1 每个环境 150 条无线链路；场景 2 每个环境 10,000 条链路，均来自同一个基站。'}
provenance:
- {en: OSM buildings and streets from 40+ cities, zh: 40+ 城市 OSM 建筑与街道}
- {en: Place BSs/UEs, zh: 放置 BS/UE}
- {en: PyLayers path tracing, zh: PyLayers 路径追踪}
- {en: 'Five-band path responses: H_cf_G.npy', zh: 五频段路径响应 H_cf_G.npy}
- {en: Array and subcarrier responses, zh: 阵列与子载波响应}
- {en: Derived CSI/localization/beam labels, zh: 派生 CSI/定位/波束标签}
technical_notes:
- {en: 'The original paper describes direct, reflected and diffracted paths.', zh: 原论文描述了直达、反射与绕射路径。}
- {en: 'Ray tracing uses a 6 m BS height, a 1.5 m UE height and omnidirectional antennas.', zh: 射线追踪采用 6 m 基站高度、1.5 m 用户高度，并使用全向天线。}
- {en: 'A UE with no propagation path to a BS is redrawn, so every BS-UE link in the release has at least one path.', zh: 与某基站之间没有任何传播路径的 UE 会被重新抽取位置，因此发布数据中每条 BS-UE 链路至少有一条路径。}
limitations:
- {en: 'Path responses are released only at 2.6, 6, 28, 60 and 100 GHz; other carriers require new ray tracing.', zh: 路径响应仅发布于 2.6、6、28、60 和 100 GHz；其他载频需要重新进行射线追踪。}
- {en: 'Because every link has a path, the release contains no links without coverage.', zh: 由于每条链路都有路径，发布数据中不包含无覆盖链路。}
- {en: The paper does not give the materials or the interaction limits used in PyLayers., zh: 论文未给出 PyLayers 所用的材料参数与交互次数上限。}
history:
- {en: '2022: the original paper defines the two scenarios and the five-carrier path responses.', zh: 2022 年：原论文定义了两个场景及五个载频的路径响应。}
- {en: The dataset portal lists the dataset with a date of 2022-11-11., zh: 数据门户页面标注的日期为 2022-11-11。}
usage:
- {en: 'Channel data with user-specified system settings are generated by generator.py, parameters.py and util.py from the stored paths.', zh: generator.py、parameters.py 与 util.py 根据存储的路径和用户设定的系统参数生成信道数据。}
- {en: 'tasks/positioning contains sample code for data preparation, model construction and training.', zh: tasks/positioning 包含数据准备、模型构建和训练的示例代码。}
- {en: Scenario 1 suits training across many environments; Scenario 2 suits a dedicated model for one environment., zh: 场景 1 适合跨大量环境训练；场景 2 适合为单个环境训练专用模型。}
- {en: 'In the paper''s beam-prediction example, a model pre-trained on 1,000 Scenario 1 environments is transferred to one Scenario 2 environment and fine-tuned.', zh: '论文的波束预测示例中，先在 1,000 个场景 1 环境上预训练，再迁移到一个场景 2 环境并进行微调。'}
paper_summary:
- label: {en: System, zh: 系统}
  text: {en: 'Transforms partial STF-domain CSI into the DDA domain, reconstructing channels with windowed attention and frame-structure encoding; task heads use a frozen encoder.', zh: 部分STF域CSI变换到DDA域，以窗口注意力与帧结构编码恢复信道；冻结编码器接任务头。}
- label: {en: Prediction target, zh: 预测对象}
  text: {en: 'Time/frequency extrapolation, pilot-based channel estimation, sub-6-assisted 28 GHz beam classes, and LoS.', zh: 时间/频率外推、导频信道估计、sub-6辅助28 GHz beam类别与LoS。}
- label: {en: Decision target, zh: 决策目标}
  text: {en: 'Evaluated with NMSE, beam Top-1, and LoS F1; final communication utility is still missing.', zh: 以NMSE、beam Top-1和LoS F1评估；尚缺最终通信效用。}
- label: {en: Protocol, zh: 评估协议}
  text: {en: 'DeepMIMO pretraining uses 18 cities with 4 held out; WAIR-D is split by environment. LuViRA uses 17 trajectories for adaptation and 70 for testing, constituting adaptation to measured data.', zh: DeepMIMO 18城预训练、4城留出；WAIR-D按环境隔离。LuViRA为17条轨迹适配、70条轨迹测试，属于实测适配。}
- label: {en: Key finding, zh: 主要发现}
  text: {en: The paper separates simulation holdouts from LuViRA measurement adaptation; LuViRA results use target-domain training trajectories and therefore represent measured-domain adaptation. Current public HF assets cover only part of the derived test data., zh: 论文将仿真留出与LuViRA实测适配分开；LuViRA结果使用目标域训练轨迹，属于实测域适配。当前公开HF资产只覆盖部分测试派生数据。}
- label: {en: Remaining gap, zh: 尚未解决的问题}
  text: {en: Test NMSE gains against low-order physics-based predictors and final rates; do not infer current public-asset coverage from the paper's 2.85M-sample training corpus., zh: 用低阶物理预测器和最终速率检验NMSE收益；当前公开资产的覆盖范围不能按论文2.85M训练语料规模直接推定。}
overview: {en: 'WAIR-D (Wireless AI Research Dataset) is a simulated dataset of radio propagation paths and channel responses. Huawei Wireless Technology Laboratory and Zhejiang University published it in 2022 (arXiv:2212.02159). Scenario 1 has 10,000 environments with 5 base stations and 30 UEs in each, giving 1.5 million radio links. Scenario 2 has 100 environments with 1 base station and 10,000 UEs in each, giving 1 million radio links. The environments come from OpenStreetMap building and street data for more than 40 cities. The authors place base stations and UEs at random and trace the propagation paths with the PyLayers 3D ray tracer. Every BS-UE link keeps at least one propagation path, because a UE without a path is placed again. The files contain no measured channels. Channel matrices are computed from the stored paths for the bandwidth, subcarrier and antenna settings chosen by the user. The paper demonstrates environment reconstruction from channel data and spatial beam prediction,
    in which 16 of 64 beams are measured.', zh: 'WAIR-D（Wireless AI Research Dataset）是无线传播路径与信道响应的仿真数据集，由华为无线技术实验室与浙江大学于 2022 年发布（arXiv:2212.02159）。场景 1 包含 10,000 个环境，每个环境 5 个基站、30 个 UE，共 150 万条无线链路。场景 2 包含 100 个环境，每个环境 1 个基站、10,000 个 UE，共 100 万条无线链路。环境取自 OpenStreetMap 中 40 多个城市的建筑与街道数据。作者在每个环境中随机放置基站与 UE，并使用 PyLayers 三维射线追踪器计算传播路径。每条 BS-UE 链路至少保留一条传播路径，没有路径的 UE 会被重新放置。文件中不含实测信道。信道矩阵由存储的路径，按用户选定的带宽、子载波与天线设置计算得到。论文演示了基于信道数据的环境重建，以及空间波束预测（64 个波束中测量 16 个）。'}
signal_details:
- signal: paths
  text: {en: 'Path.npy stores the delay, angle of arrival (AoA) and angle of departure (AoD) of each propagation path of every radio link in an environment. Path responses at five carrier frequencies, 2.6, 6, 28, 60 and 100 GHz, are stored in H_cf_G.npy files, where cf is the carrier frequency. The paths are computed with PyLayers on OSM maps with omnidirectional antennas at 6 m (BS) and 1.5 m (UE). The paper states that direct, reflected and diffracted paths are included, and that the LOS or NLOS label of each path can be read from the data.', zh: Path.npy 存储每个环境中所有无线链路的每条传播路径的时延、到达角（AoA）和离开角（AoD）。五个载频 2.6、6、28、60 和 100 GHz 的路径响应分别存于 H_cf_G.npy 文件中，cf 为载频。路径由 PyLayers 基于 OSM 地图计算，基站高 6 m、UE 高 1.5 m，均采用全向天线。论文指出结果包含直达、反射与绕射路径，每条路径的 LOS 或 NLOS 标签可根据数据判定。}
- signal: csi
  text: {en: 'The channel frequency response of a link is the sum over paths of the path response times exp(-j2 pi f tau), where tau is the path delay and f is a frequency vector set by the user. For OFDM, the subcarrier frequencies follow from bandwidth, subcarrier spacing and carrier frequency. The antenna dimension comes from UPA or other response matrices computed from AoA and AoD. The generation code is supplied as generator.py, parameters.py and util.py. Table 1 of the paper gives two settings. Environment reconstruction uses 6 GHz, 31.25 MHz bandwidth, 64 OFDM subcarriers and 16T4R antennas. Spatial beam prediction uses 28 GHz, 46.08 MHz bandwidth, 384 OFDM subcarriers and 64T1R antennas. Both use half-wavelength antenna spacing.', zh: 链路的信道频率响应，是各路径响应乘以 exp(-j2πfτ) 后求和得到，其中 τ 为路径时延，f 为用户设定的频率向量。对于 OFDM，子载波频率由带宽、子载波间隔和载频确定。天线维度由 UPA 或其他天线响应矩阵依据 AoA 与 AoD 计算得到。生成代码为 generator.py、parameters.py 和 util.py。论文表 1 给出两组设置：环境重建采用 6 GHz、31.25 MHz 带宽、64 个 OFDM 子载波和 16T4R 天线；空间波束预测采用 28 GHz、46.08
      MHz 带宽、384 个 OFDM 子载波和 64T1R 天线。两组天线间距均为半波长。}
capabilities:
- key: csi
  status: derivable
  note: {en: 'Computed from the stored path delays, path responses and a chosen array and OFDM configuration by the released generator.py.', zh: 由已存储的路径时延、路径响应以及所选阵列与 OFDM 配置，通过发布的 generator.py 计算。}
- key: cir
  status: derivable
  note: {en: 'Follows from the stored per-path delays and carrier path responses, summing each response at its delay.', zh: 由已存储的逐路径时延与各载频路径响应得到，即将各路径响应置于其时延处求和。}
- key: paths
  status: provided
  note: {en: 'Path.npy holds delay, AoA and AoD of every path; H_cf_G.npy holds path responses at 2.6, 6, 28, 60 and 100 GHz.', zh: Path.npy 保存每条路径的时延、AoA 与 AoD；H_cf_G.npy 保存 2.6、6、28、60 和 100 GHz 的路径响应。}
- key: interaction
  status: simulate
  note: {en: 'The release includes the 3D scene, so re-running a ray tracer on it produces this output.', zh: 发布内容包含三维场景，在其上重新运行射线追踪即可产生该输出。}
- key: power
  status: derivable
  note: {en: Received power and path loss follow from the stored complex path responses., zh: 接收功率与路径损耗可由已存储的复数路径响应计算得到。}
- key: iq
  status: none
  note: {en: Only channel responses are released; no transmitted or received waveform samples are stored., zh: 仅发布信道响应，不存储发射或接收的波形采样。}
- key: beam_labels
  status: derivable
  note: {en: 'Beam labels follow from CSI and a chosen codebook; the paper''s beam example uses 64 beams, of which 16 are measured.', zh: 波束标签可由 CSI 与所选码本计算得到；论文的波束示例共 64 个波束，其中 16 个被测量。}
- key: position
  status: provided
  note: {en: Info.npy holds the BS and UE positions and the region size of each environment., zh: Info.npy 保存每个环境的 BS 与 UE 位置及区域尺寸。}
- key: geometry
  status: provided
  note: {en: Each environment has a map image (environment.png) built from OSM buildings and streets; no 3D scene files are listed in the release., zh: 每个环境附带由 OSM 建筑与街道生成的地图图像（environment.png）；发布文件中未列出三维场景文件。}
- {key: materials, status: unknown}
- key: rgb
  status: none
  note: {en: 'environment.png is a map image, not a camera photograph.', zh: environment.png 为地图图像，并非相机拍摄的照片。}
- key: depth
  status: none
  note: {en: The release contains no depth images or depth maps., zh: 发布内容不含深度图像或深度图。}
- key: lidar
  status: none
  note: {en: The release contains no LiDAR point clouds., zh: 发布内容不含 LiDAR 点云。}
- key: radar
  status: none
  note: {en: The release contains no radar measurements., zh: 发布内容不含雷达测量数据。}
- key: imu
  status: none
  note: {en: The release contains no inertial measurements., zh: 发布内容不含惯性测量数据。}
- key: time_series
  status: none
  note: {en: 'Each environment is a static snapshot, and its files carry no time index.', zh: 每个环境为静态快照，文件中不含时间索引。}
- key: multiuser
  status: provided
  note: {en: 'Scenario 1 has 30 UEs per BS and Scenario 2 has 10,000 UEs per BS in each environment, all in the same snapshot.', zh: '场景 1 每个环境每个 BS 对应 30 个 UE，场景 2 每个环境每个 BS 对应 10,000 个 UE，均处于同一快照。'}
- key: multibs
  status: provided
  note: {en: Scenario 1 places 5 BSs in each environment on the same map; Scenario 2 uses 1 BS., zh: 场景 1 每个环境在同一地图上放置 5 个 BS；场景 2 使用 1 个 BS。}
- key: crossfreq
  status: provided
  note: {en: 'Path responses at 2.6, 6, 28, 60 and 100 GHz are stored for the same set of propagation paths.', zh: 2.6、6、28、60 和 100 GHz 的路径响应基于同一组传播路径存储。}
- key: near_field
  status: simulate
  note: {en: 'The release includes the 3D scene, so re-running a ray tracer on it produces this output.', zh: 发布内容包含三维场景，在其上重新运行射线追踪即可产生该输出。}
- key: high_mobility
  status: simulate
  note: {en: 'The release includes the 3D scene, so re-running a ray tracer on it produces this output.', zh: 发布内容包含三维场景，在其上重新运行射线追踪即可产生该输出。}
- key: dynamic_blockage
  status: none
  note: {en: Static snapshots; the release represents no moving blockers., zh: 静态快照，发布内容不包含移动遮挡物。}
