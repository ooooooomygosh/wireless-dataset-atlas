summary: {en: 'WAIR-D contains ray-traced radio propagation paths and path responses on real city maps for two scenarios: 10,000 environments with 5 base stations and 30 UEs each, and 100 environments with 1 base station and 10,000 UEs each. Path responses are provided at 2.6, 6, 28, 60 and 100 GHz.', zh: 'WAIR-D 包含基于真实城市地图、由射线追踪生成的无线传播路径与路径响应数据，共两个场景：10,000 个环境（每个环境 5 个基站、30 个用户）和 100 个环境（每个环境 1 个基站、10,000 个用户）。路径响应提供 2.6、6、28、60 和 100 GHz 五个载频。'}
