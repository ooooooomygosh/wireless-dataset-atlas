id: wair-d
name: WAIR-D
aliases: [Wireless AI Research Dataset]
year: 2022
organization: Huawei Wireless Technology Laboratory; Zhejiang University
origin: ray-tracing
tasks: [beam-management, localization, channel-modeling]
signals: [paths, csi]
bands_ghz: [2.6, 6, 28, 60, 100]
environment: [outdoor-urban]
samples: 10,000 environments (Scenario 1) and 100 environments (Scenario 2); 1.5 million and 1 million radio links
format: NPY, PNG
license: Not stated
access: {url: 'https://www.mobileai-dataset.com/html/default/yingwen/DateSet/1590994253188792322.html?index=1', type: registration}
code: []
paper: arxiv:2212.02159
used_in: ['doi:10.1109/lwc.2025.3578370']
citing: ['doi:10.1109/lwc.2024.3402102', 'doi:10.1109/jstsp.2024.3453548']
summary: {en: 'WAIR-D contains ray-traced radio propagation paths and path responses on real city maps for two scenarios: 10,000 environments with 5 base stations and 30 UEs each, and 100 environments with 1 base station and 10,000 UEs each. Path responses are provided at 2.6, 6, 28, 60 and 100 GHz.', zh: 'WAIR-D 包含基于真实城市地图、由射线追踪生成的无线传播路径与路径响应数据，共两个场景：10,000 个环境（每个环境 5 个基站、30 个用户）和 100 个环境（每个环境 1 个基站、10,000 个用户）。路径响应提供 2.6、6、28、60 和 100 GHz 五个载频。'}
sources: ['https://arxiv.org/abs/2212.02159', 'https://arxiv.org/pdf/2212.02159', 'https://www.mobileai-dataset.com/html/default/yingwen/DateSet/1590994253188792322.html?index=1']
checked: '2026-11-06'
pipeline:
  summary: {en: 'Extract environments from real maps, generate omnidirectional per-path data with PyLayers, then construct CSI using array and OFDM configurations. Map sources are real; propagation outputs are simulated.', zh: 从真实地图提取环境，用PyLayers生成全向逐路径数据，再按阵列和OFDM配置构造CSI。地图来源真实，传播输出为模拟。}
  stages:
  - title: {en: Build environments from OSM, zh: 从OSM建立环境}
    detail: {en: Extract regional geometry and organize it into separate environments for subsequent path tracing., zh: 提取区域几何并组织成独立环境，供后续路径追踪。}
    inputs:
    - {en: OSM buildings and streets from more than 40 cities, zh: 40多个城市的OSM建筑与街道}
    - {en: Target regions and environment scales, zh: 目标区域与环境尺度}
    outputs:
    - {en: Environment maps and geometric descriptions, zh: 环境地图和几何描述}
    controls:
    - {en: 'Paper configuration: 10,000 environments in Scenario 1 and 100 in Scenario 2', zh: '论文配置：Scenario1为10,000环境，Scenario2为100环境'}
    - {en: 'For reproduction, fix map dates, boundaries, and material settings', zh: 研究者复现时固定地图日期、边界和材料设置}
    checks:
    - {en: Check whether duplicate or adjacent maps cross train/test splits, zh: 检查重复或相邻地图是否跨训练/测试}
    - {en: Verify scale conversion from maps to RT coordinates, zh: 核验地图到RT坐标的尺度}
  - title: {en: Sample BSs and UEs, zh: 采样BS和UE}
    detail: {en: 'Scenario 1 uses 5 BSs/30 UEs per environment; Scenario 2 uses 1 BS/10,000 UEs; the original paper sets BS height to 6 m and UE height to 1.5 m.', zh: 'Scenario1每环境设置5BS/30UE，Scenario2设置1BS/10,000UE；原文BS高6m、UE高1.5m。'}
    inputs:
    - {en: Environment geometry, zh: 环境几何}
    - {en: Scenario grouping and placement rules, zh: 场景分组及位置规则}
    outputs:
    - {en: Node coordinates and link list, zh: 节点坐标和链路清单}
    controls:
    - {en: 'Paper configuration: omnidirectional antennas during RT', zh: 论文配置：RT阶段全向天线}
    - {en: 'For reproduction, fix placement distributions and seeds', zh: 研究者复现时固定位置分布与seed}
    checks:
    - {en: The original generation workflow resamples UEs with no propagation paths, zh: 原生成流程会重采没有传播路径的UE}
    - {en: Outage tasks require reconstructing a distribution that includes locations with no paths, zh: outage任务需重建包含无路径位置的分布}
  - title: {en: Solve paths with PyLayers, zh: 用PyLayers求路径}
    detail: {en: 'Compute direct, reflected, diffracted, and other propagation paths, saving path responses and associated angles and delays.', zh: 计算直达、反射和绕射等传播路径，保存路径响应及相关角度、时延信息。}
    inputs:
    - {en: 'Maps, materials, and omnidirectional Tx/Rx nodes', zh: 地图、材料和全向收发节点}
    - {en: The original paper's five-band configuration, zh: 原文五频段配置}
    outputs:
    - {en: Per-link path parameters, zh: 逐链路路径参数}
    - {en: Multifrequency path-response files such as H_cf_G.npy, zh: 多频路径响应H_cf_G.npy等文件}
    controls:
    - {en: 'Researcher specifies: frequencies, interaction budget, materials, and path filtering', zh: 研究者固定：频点、交互预算、材料与路径筛选}
    - {en: Use the five specific frequencies documented in the downloaded package, zh: 具体五频点沿用所下载包说明}
    checks:
    - {en: Check cross-frequency indices and matching BS/UE coordinates, zh: 核对跨频索引和同一BS/UE坐标}
    - {en: Confirm per-frequency handling of materials and path sets, zh: 确认材料和路径集合的逐频处理方式}
  - title: {en: Synthesize array and OFDM channels, zh: 合成阵列与OFDM信道}
    detail: {en: Synthesize complex CSI using array responses and subcarrier phases; selected arrays/bandwidth determine the final training tensors., zh: 以阵列响应和子载波相位合成复数CSI；所选阵列/带宽决定最终训练张量。}
    inputs:
    - {en: 'Per-path responses, angles, and delays', zh: 逐路径响应、角度与时延}
    - {en: Array and OFDM configuration, zh: 阵列和OFDM配置}
    outputs:
    - {en: MIMO-OFDM CSI for the configuration, zh: 配置对应的MIMO-OFDM CSI}
    controls:
    - {en: 'Researcher specifies: antenna count, spacing, orientation, subcarriers, and normalization', zh: 研究者固定：天线数、间距、朝向、子载波与归一化}
    checks:
    - {en: Check antenna and subcarrier axes, zh: 核对天线和子载波轴}
    - {en: Label carrier-frequency postprocessing separately from original per-frequency path outputs, zh: 改载频后处理与原始逐频路径输出分别标注}
  - title: {en: 'Create localization, beam, or network tasks', zh: 制作定位、波束或网络任务}
    detail: {en: 'Generate labels and split by environment/city, preserving maps and original link indices.', zh: 研究者生成标签并按环境/城市切分，保留地图和原始链路索引。}
    inputs:
    - {en: 'CSI, positions, and environment metadata', zh: CSI、位置和环境元数据}
    - {en: Codebook or decision rules, zh: 码本或决策规则}
    outputs:
    - {en: Task inputs/labels, zh: 任务输入/标签}
    - {en: Evaluation sets separated by environment or city, zh: 环境或城市隔离的评估集}
    controls:
    - {en: 'Researcher specifies: labels, noise, splits, and units', zh: 研究者固定：标签、噪声、切分和单位}
    checks:
    - {en: Confirm headroom using an oracle and strong simple baselines, zh: 用oracle和强简单基线确认headroom}
    - {en: 'For multiuser coexistence, use channels from the same environment and an explicit interference model', zh: 多用户共存使用同环境信道及明确干扰模型}
  scope: {en: Generation workflow from WAIR-D's original paper §II and Table 1; portal file licensing and current package structure must be checked against actual downloads., zh: WAIR-D原论文§II与Table1中的生成流程；门户文件许可与当前包结构仍以实际下载为准。}
