checked: '2026-11-06'
overview: {en: 'The Indoor Jamming I/Q Measurements dataset contains raw I/Q samples recorded during jamming experiments in an indoor office. Alhazbi and Oligeri of Hamad Bin Khalifa University and Sciancalepore of Eindhoven University of Technology published it on Zenodo in October 2022, and it is associated with a Data in Brief article (DOI 10.1016/j.dib.2022.108773). Seven USRP Ettus Research X310 software-defined radios transmit and receive BPSK-modulated bit sequences in an office where the transmitter and receiver have no line of sight. Each experiment has a transmitter, a receiver and a jammer; the transmitter and receiver hardware stay fixed, while the jammer is one of five radios of the same model and brand. The recordings cover no jamming, tone (sinusoidal) jamming and Gaussian-noise jamming at different transmission distances and jamming power levels. The receiver stores each experiment as a two-column matrix of raw I/Q samples. The dataset is open access under a CC BY 4.0 license.',
  zh: 室内干扰 I/Q 测量数据集收录了在室内办公环境中进行干扰实验时采集的原始 I/Q 样本。作者 Alhazbi 与 Oligeri 来自 Hamad Bin Khalifa University，Sciancalepore 来自 Eindhoven University of Technology，数据于 2022 年 10 月发布在 Zenodo 上，并与 Data in Brief 论文（DOI 10.1016/j.dib.2022.108773）相关联。七台 USRP Ettus Research X310 软件无线电在收发端无视距的办公室环境中传输 BPSK 调制的比特序列。每次实验包含一台发射机、一台接收机和一台干扰机；收发端硬件保持不变，干扰机使用同一型号与品牌的五台无线电之一。数据覆盖无干扰、单音（正弦）干扰和高斯噪声干扰，并包含不同传输距离与干扰功率等级。接收端将每次实验存储为两列的原始 I/Q 样本矩阵。数据集以 CC BY 4.0 许可协议开放获取。}
signal_details:
- signal: iq
  text: {en: 'Raw I/Q samples captured by seven USRP Ettus Research X310 SDRs. Each experiment is stored as one two-column matrix of I/Q values for a predetermined bit sequence ([0, 255]) modulated with BPSK.', zh: '七台 USRP Ettus Research X310 软件无线电采集的原始 I/Q 样本。每次实验存储为一个两列的 I/Q 矩阵，对应以 BPSK 调制的预定比特序列（[0, 255]）。'}
pipeline:
  summary: {en: 'Seven USRP X310 radios transmit BPSK bit sequences with and without jamming in an indoor office, and the receiver stores raw I/Q samples.', zh: 七台 USRP X310 无线电在室内办公环境中发送带有或不带干扰的 BPSK 比特序列，接收端存储原始 I/Q 样本。}
  stages:
  - title: {en: Testbed configuration, zh: 试验平台配置}
    detail: {en: 'Seven USRP Ettus Research X310 SDRs are used in an office without line of sight between transmitter and receiver. Each experiment has a transmitter, a receiver and a jammer. Transmitter and receiver hardware are fixed across experiments; the jammer is one of five radios of the same model and brand.', zh: 七台 USRP Ettus Research X310 软件无线电用于办公室环境，发射机与接收机之间无视距。每次实验包含一台发射机、一台接收机和一台干扰机。收发端硬件在所有实验中保持不变；干扰机为同一型号与品牌的五台无线电之一。}
    inputs:
    - {en: Seven USRP X310 SDRs, zh: 七台 USRP X310 软件无线电}
    outputs:
    - {en: 'Transmitter, receiver and jammer roles', zh: 发射机、接收机与干扰机角色}
  - title: {en: BPSK transmission, zh: BPSK 发送}
    detail: {en: 'A predetermined bit sequence ([0, 255]) is BPSK-modulated and transmitted.', zh: '预定比特序列（[0, 255]）经 BPSK 调制后发送。'}
    inputs:
    - {en: Predetermined bit sequence, zh: 预定比特序列}
    outputs:
    - {en: BPSK signal, zh: BPSK 信号}
  - title: {en: Jamming and recording conditions, zh: 干扰与采集条件}
    detail: {en: 'Jamming types are none (silent), tone (sinusoidal) and Gaussian noise. The recordings vary the transmission distance and the jamming power level.', zh: 干扰类型包括无干扰（静默）、单音（正弦）干扰和高斯噪声干扰。采集时改变传输距离与干扰功率等级。}
    inputs:
    - {en: 'Jamming type, distance and power settings', zh: 干扰类型、距离与功率设置}
    outputs:
    - {en: Jammed and unjammed experiments, zh: 有干扰与无干扰的实验}
  - title: {en: Reception and storage, zh: 接收与存储}
    detail: {en: The receiver stores each experiment as a two-column matrix of raw I/Q samples., zh: 接收机将每次实验存储为两列的原始 I/Q 样本矩阵。}
    inputs:
    - {en: Received BPSK signal, zh: 接收到的 BPSK 信号}
    outputs:
    - {en: Raw I/Q matrix per experiment, zh: 每次实验的原始 I/Q 矩阵}
  - title: {en: Release on Zenodo, zh: 在 Zenodo 发布}
    detail: {en: 'The dataset is deposited on Zenodo under DOI 10.5281/zenodo.7119040 as open access under CC BY 4.0, and it is described in a Data in Brief article.', zh: 数据集以开放获取方式、CC BY 4.0 许可协议发布于 Zenodo（DOI 10.5281/zenodo.7119040），并在 Data in Brief 论文中加以描述。}
    inputs:
    - {en: Raw I/Q matrices, zh: 原始 I/Q 矩阵}
    outputs:
    - {en: Zenodo dataset record, zh: Zenodo 数据集记录}
usage:
- {en: 'The data paper lists three uses: active and reactive jamming detection, jamming identification at the physical layer, and mitigation techniques supported by real data.', zh: 数据论文列出三类用途：主动与反应式干扰检测、物理层干扰识别，以及基于真实数据的干扰缓解技术。}
