summary: {en: 'Raw I/Q samples of BPSK bit sequences recorded by seven USRP X310 software-defined radios in an office environment without line of sight. The recordings cover no jamming, tone and Gaussian-noise jamming at varied distances and jamming powers, stored in 31 MAT files.', zh: 七台 USRP X310 软件无线电在无视距的办公室环境中采集的 BPSK 比特序列原始 I/Q 样本。记录涵盖无干扰、单音干扰和高斯噪声干扰，并包含不同距离与干扰功率条件，数据存储于 31 个 MAT 文件中。}
