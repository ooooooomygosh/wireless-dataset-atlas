facts:
- label: {en: Sample order, zh: 样本顺序}
  text: {en: 'Samples 0 to 9999 are normal. The anomalous samples follow in blocks of 2,000 per jammer type, in the order deceptive, sweep, barrage, pilot and random hop.', zh: '样本 0 至 9999 为正常样本。异常样本按干扰类型分块排列，每类 2,000 个，顺序为 deceptive、sweep、barrage、pilot 与 random hop。'}
- label: {en: Label definitions, zh: 标签定义}
  text: {en: 'SNR and SJR average the signal and jammer powers over the whole observation time. A jammer active for only part of the time, such as pilot, random hop or part of the deceptive samples, therefore raises the SJR.', zh: SNR 与 SJR 对整个观测时段内的信号功率和干扰功率取平均。仅在部分时段活动的干扰机（如 pilot、random hop 以及部分 deceptive 样本）会使 SJR 升高。}
- label: {en: Jammer placement, zh: 干扰机布置}
  text: {en: 'Each sample holds at most one jammer, placed at random inside the hall at 1.5 m height with a power between 0 and 30 dBm. Normal samples have empty jammer power and location fields, and their SJR is inf.', zh: 每个样本至多一个干扰机，随机放置在车间内 1.5 m 高度，发射功率在 0 至 30 dBm 之间。正常样本的干扰功率与位置字段为空，其 SJR 为 inf。}
- label: {en: Paper split, zh: 论文划分}
  text: {en: 'Table IV of the paper uses 5,900 normal and 1,450 samples per jammer type for supervised training, with random hop excluded, and 8,800 normal samples for unsupervised training. Both test sets hold 1,000 normal samples and 500 per jammer type.', zh: '论文表 IV 中，有监督训练使用 5,900 个正常样本和每类 1,450 个样本（不含 random hop），无监督训练使用 8,800 个正常样本。两种测试集均包含 1,000 个正常样本和每类 500 个样本。'}
usage:
- {en: 'Paper baselines (Table V, AUC): the VAE, trained on normal samples only, reaches 0.98 for barrage, 0.85 for deceptive, 0.87 for pilot, 0.95 for sweep and 0.91 for the unseen random hop. ResNet-18 reaches 1.00, 0.91, 0.88, 0.98 and 0.84.', zh: 论文基线（表 V，AUC）：仅用正常样本训练的 VAE 在 barrage、deceptive、pilot、sweep 上分别为 0.98、0.85、0.87、0.95，在未见过的 random hop 上为 0.91。ResNet-18 对应结果为 1.00、0.91、0.88、0.98 与 0.84。}
