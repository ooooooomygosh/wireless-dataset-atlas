summary: {en: 'Complex IQ captures of WiFi (IEEE 802.11g) and Bluetooth 5.0 emissions from 10 commercial combo-chip devices, recorded with a USRP X300 at 66.67 MS/s in two time frames. Each capture contains 40 MSamples and has a JSON metadata file.', zh: 来自10台商用组合芯片设备的WiFi（IEEE 802.11g）与蓝牙5.0发射信号的复数IQ采样，由USRP X300以66.67 MS/s在两个时间段采集。每个采集文件包含40 MSample，并附带JSON元数据文件。}
