checked: '2026-11-06'
overview: {en: 'The Bluetooth and Wi-Fi RF Fingerprinting Dataset contains raw IQ captures of WiFi (IEEE 802.11g) and Bluetooth 5.0 emissions from ten commercial devices. Eight Raspberry Pi 4B boards with Cypress CYW43455 WiFi-Bluetooth combo chips and two Lenovo laptops with Intel Dual Band Wireless-AC 7260 chips were recorded. A USRP X300 with a UBX160 daughterboard and VERT2450 antenna captured the emissions at 66.67 MS/s, with the receiver tuned to 2.44 GHz, in an indoor laboratory. The captures were made on two days separated by several months, and each technology has 120 captures of 40 MSamples. Each capture is a binary complex64 file with a JSON metadata file of the same name. Bluetooth captures vary the transmitter-receiver distance from 0.5 m to 3.0 m in 0.5 m steps, and WiFi captures vary the transmit power. ANDRO Computational Solutions, LLC produced the dataset and described it in an IEEE Communications Magazine article. IEEE DataPort hosts the files and requires a subscription
    and login.', zh: '蓝牙与Wi-Fi射频指纹数据集包含十台商用设备发射的WiFi（IEEE 802.11g）与Bluetooth 5.0信号的原始IQ采集数据。被记录的设备包括八块搭载Cypress CYW43455 WiFi-Bluetooth组合芯片的Raspberry Pi 4B开发板，以及两台搭载Intel Dual Band Wireless-AC 7260芯片的Lenovo笔记本。采集使用配备UBX160子板并通过VERT2450天线接收的USRP X300，接收机调谐至2.44 GHz，以66.67 MS/s采样，地点为室内实验室。数据分两天采集，两天相隔数月，每种技术各有120次采集，每次采集40 MSamples。每次采集为二进制complex64文件，并附有同名的JSON元数据文件。蓝牙采集将收发距离从0.5 m变化到3.0 m，步长0.5 m；WiFi采集改变发射功率。ANDRO Computational Solutions, LLC制作了该数据集，并在IEEE Communications Magazine的一篇文章中对其进行了描述。IEEE DataPort托管文件，访问需要订阅并登录。'}
signal_details:
- signal: iq
  text: {en: 'Raw binary IQ captures in complex64 format, one .dat file per capture, recorded with a USRP X300 with UBX160 daughterboard and VERT2450 antenna on the RX2 port. Sampling rate 66.67 MS/s and 40 MSamples per capture. Each .dat file is paired with a .meta.json file of the same name, in a modified SigMF format. The metadata holds global settings (sample rate, record date, datatype), capture fields (center frequency, sample start, transmission number) and annotations such as environment, distance, protocol, transmitter and receiver details, modulation and gain.', zh: 原始二进制IQ采集数据，格式为complex64，每次采集一个.dat文件。采集设备为USRP X300，配备UBX160子板，RX2端口连接VERT2450天线。采样率66.67 MS/s，每次采集40 MSamples。每个.dat文件配有同名的.meta.json文件，格式为修改后的SigMF。元数据包含全局设置（采样率、记录日期、数据类型）、采集字段（中心频率、采样起点、发送编号）以及标注（环境、距离、协议、收发端信息、调制方式和增益）。}
pipeline:
  summary: {en: 'Ten commercial devices transmit WiFi or Bluetooth one at a time, a USRP X300 records the emissions at 66.67 MS/s, and each capture is stored as an IQ file with a JSON metadata file.', zh: 十台商用设备每次只发射WiFi或Bluetooth之一，USRP X300以66.67 MS/s记录发射信号，每次采集保存为一个IQ文件和一个JSON元数据文件。}
  stages:
  - title: {en: Emitter setup, zh: 发射端配置}
    detail: {en: 'Only one emitter transmits at a time. The WiFi radio is unblocked with rfkill only during WiFi captures, which prevents simultaneous transmissions. WiFi emitters run as IEEE 802.11g access points on channel 8 (centered at 2447 MHz, 20 MHz bandwidth) and broadcast beacons every 15 ms. Bluetooth emitters send a 103 MB text file over OBEX to an LG Nexus 5 phone, and each transfer lasts at least 5 minutes.', zh: 同一时间只有一个发射端工作。WiFi射频仅在WiFi采集期间通过rfkill解除屏蔽，以避免同时发射。WiFi发射端作为IEEE 802.11g接入点，在信道8（中心频率2447 MHz，带宽20 MHz）上以15 ms间隔广播信标。Bluetooth发射端通过OBEX向LG Nexus 5手机发送一个103 MB的文本文件，每次传输至少持续5分钟。}
    inputs:
    - {en: 10 commercial devices, zh: 10台商用设备}
    outputs:
    - {en: WiFi beacons and Bluetooth OBEX transfers, zh: WiFi信标与Bluetooth OBEX传输}
  - title: {en: Capture, zh: 采集}
    detail: {en: 'A USRP X300 with a UBX160 daughterboard and VERT2450 antenna on the RX2 port records the passive reception at 66.67 MS/s, the highest rate the receiver supports without sample drops. The receiver is tuned to 2.44 GHz. Bluetooth captures cover six transmitter-receiver separations, from 0.5 m to 3.0 m in 0.5 m steps, for each device, and WiFi captures vary the transmit power. Day-1 and Day-2 captures use the same receiver settings, separated by several months.', zh: 配备UBX160子板并通过RX2端口连接VERT2450天线的USRP X300，以66.67 MS/s被动记录接收信号，这是接收机在无采样丢失时支持的最高速率。接收机调谐至2.44 GHz。蓝牙采集对每台设备覆盖六个收发距离，从0.5 m至3.0 m，步长0.5 m；WiFi采集改变发射功率。Day-1与Day-2采集使用相同的接收机设置，两者相隔数月。}
    inputs:
    - {en: RF emissions from the devices, zh: 设备的射频发射信号}
    outputs:
    - {en: Raw IQ samples, zh: 原始IQ采样}
  - title: {en: Storage and metadata, zh: 存储与元数据}
    detail: {en: 'Each capture is written as a binary .dat file of complex64 IQ samples and a .meta.json file of the same name, in a modified SigMF format. The files are packed in four .tar.gz archives (Day1BT, Day2BT, Day1WIFI and Day2WIFI) that total about 29.8 GB compressed. A script that parses the JSON metadata is provided with the dataset.', zh: 每次采集写入一个complex64格式的二进制.dat文件和一个同名的.meta.json文件，格式为修改后的SigMF。文件打包为四个.tar.gz压缩包（Day1BT、Day2BT、Day1WIFI和Day2WIFI），压缩后合计约29.8 GB。数据集附带一个用于解析JSON元数据的脚本。}
    inputs:
    - {en: Raw IQ samples, zh: 原始IQ采样}
    outputs:
    - {en: '.dat files, .meta.json files and four .tar.gz archives', zh: .dat文件、.meta.json文件及四个.tar.gz压缩包}
bandwidth_mhz: 66.67
facts:
- label: {en: Train and test split, zh: 训练与测试划分}
  text: {en: 'Day-1 and Day-2 captures were recorded months apart, and the source suggests training on Day-1 and testing on Day-2 to measure generalization across days.', zh: Day-1与Day-2两组数据相隔数月采集。数据来源建议用Day-1训练、用Day-2测试，以检验跨日泛化能力。}
