summary: {en: 'IQ captures from a 60 GHz beam sweep in an indoor office, over 64 TX and 64 RX beam index pairs at 60.48 GHz and 65.34 GHz. Each RX capture contains 1,580 IQ samples, and the data covers 25 locations.', zh: '在室内办公环境中，对64个发射与64个接收波束索引对进行60 GHz波束扫描得到的IQ采样，载波频率为60.48 GHz和65.34 GHz。每次接收采集包含1,580个IQ样本，数据覆盖25个位置。'}
