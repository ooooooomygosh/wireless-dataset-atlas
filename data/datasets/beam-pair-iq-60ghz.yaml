checked: '2026-11-06'
overview: {en: 'This dataset holds IQ captures from a 60 GHz beam sweep in an indoor office, produced by the University of South Carolina. It covers all 64 transmit and 64 receive beam indices (AWV), giving 4,096 beam pairs, at 60.48 GHz and 65.34 GHz. The data accompany the INFOCOM 2023 CNERT workshop paper on the mmWaveSDR platform. A fixed and a mobile software-defined radio, each built on a Xilinx RFSoC2x2 board with a Sivers EVK06002 front end, made the measurements. Measurements were taken at 25 link distances, from 9.75 m down to 2.44 m in 12-inch steps. Each receive capture contains 1,580 IQ samples, and entries are indexed by location, RX beam and transfer. The data are two MATLAB .mat files, one per carrier frequency, of 1.38 GB at 60.48 GHz and 2.21 GB at 65.34 GHz, and a 542.67 MB raw archive from which main_postProcessing.py regenerates them.', zh: '该数据集为室内办公环境中 60 GHz 波束扫描得到的 IQ 采样，由南卡罗来纳大学制作。数据覆盖 64 个发射波束索引（AWV）与 64 个接收波束索引的全部组合，共 4,096 个波束对，载波频率为 60.48 GHz 和 65.34 GHz。数据对应
    INFOCOM 2023 CNERT 研讨会关于 mmWaveSDR 平台的论文。一台固定式与一台移动式软件无线电完成测量，二者均基于 Xilinx RFSoC2x2 板卡，并配有 Sivers EVK06002 前端。测量在 25 个链路距离上进行，距离从 9.75 m 按 12 英寸步长减小到 2.44 m。每次接收采集包含 1,580 个 IQ 样本，条目按位置、接收波束与传输序号索引。数据为两个 MATLAB .mat 文件，分别对应一个载波频率，大小分别为 1.38 GB（60.48 GHz）和 2.21 GB（65.34 GHz），另有 542.67 MB 的原始压缩包，由 main_postProcessing.py 可重新生成上述文件。'}
signal_details:
- signal: iq
  text: {en: '1,580 IQ samples per RX capture, each sample carried as 16 bits, from converters running at 1.536 Gsps. Each entry in the MAT files holds IQdata, locationIndex, beamIndexRX, beamIndexTXdetect and PPDUinfo, indexed as location{i}.rxBeam{j}.transfer{k}.', zh: '每次接收采集包含 1,580 个 IQ 样本，每个样本以 16 bit 表示，转换器运行速率为 1.536 Gsps。MAT 文件中每个条目保存 IQdata、locationIndex、beamIndexRX、beamIndexTXdetect 与 PPDUinfo，索引形式为 location{i}.rxBeam{j}.transfer{k}。'}
pipeline:
  summary: {en: 'A mobile SDR announces each of 64 transmit beams in a PPDU, and a fixed SDR captures 1,580 IQ samples for every transfer on each of its 64 receive beams. The companion computer then decodes the PPDUs and computes the SNR, CFR and CIR of each transfer.', zh: '移动式 SDR 依次宣告 64 个发射波束，每个宣告以一个 PPDU 发出；固定式 SDR 在其 64 个接收波束上，对每次传输采集 1,580 个 IQ 样本。随后由伴随计算机解码 PPDU，并计算每次传输的 SNR、CFR 与 CIR。'}
  stages:
  - title: {en: TX beam announcement, zh: 发射波束宣告}
    detail: {en: 'The mobile SDR, a Xilinx RFSoC2x2 with a Sivers EVK06002 front end, sets each of the 64 default AWVs for 60.48 GHz, which sweep azimuth from -45 to 45 degrees. For each index it transmits a 1,280-sample OFDM PPDU whose data bits encode the TX AWV index, together with a test waveform and a trigger waveform. All 64 announcements finish in less than 2 s.', zh: '移动式 SDR 由 Xilinx RFSoC2x2 与 Sivers EVK06002 前端组成，依次设置 60.48 GHz 下的 64 个默认 AWV，方位角从 -45 度扫描到 45 度。对每个索引，它发送一个 1,280 个样本的 OFDM PPDU，其数据比特编码发射 AWV 索引，并与测试波形和触发波形一同发送。64 次宣告在 2 s 内全部完成。'}
    inputs:
    - {en: 64 default AWVs at 60.48 GHz, zh: 60.48 GHz 下的 64 个默认 AWV}
    outputs:
    - {en: PPDUs with the announced TX AWV index, zh: 携带发射 AWV 索引的 PPDU}
  - title: {en: RX capture with trigger detection, zh: 接收采集与触发检测}
    detail: {en: 'The fixed SDR sets an RX AWV index and waits 2 s. Its FPGA then detects the trigger waveform and stores the following 1,580 IQ samples, 16 bits per component, in ADC FIFOs for each transfer. Detection uses a normalised correlation over 128 lags, with a threshold of 1/4 that must be exceeded four times, 128 samples apart, by eight parallel detectors.', zh: '固定式 SDR 设置一个接收 AWV 索引并等待 2 s。随后 FPGA 检测触发波形，并将其后的 1,580 个 IQ 样本（每个分量 16 bit）存入 ADC FIFO，每次传输一组。检测采用 128 个延迟的归一化相关，阈值为 1/4，需连续四次超过阈值且间隔 128 个样本，由八个并行检测器完成。'}
    inputs:
    - {en: RX AWV index and trigger waveform, zh: 接收 AWV 索引与触发波形}
    outputs:
    - {en: '1,580 IQ samples per transfer', zh: '每次传输 1,580 个 IQ 样本'}
  - title: {en: PPDU decoding and metrics, zh: PPDU 解码与指标计算}
    detail: {en: 'The companion computer reads each transfer and decodes the PPDU. When decoding succeeds, it recovers the TX AWV index and computes the SNR, the channel frequency response (CFR) and the channel impulse response (CIR).', zh: 伴随计算机读取每次传输的数据并解码 PPDU。解码成功时，恢复发射 AWV 索引，并计算 SNR、信道频率响应（CFR）与信道冲激响应（CIR）。}
    inputs:
    - {en: IQ transfer, zh: IQ 传输数据}
    outputs:
    - {en: 'TX AWV index, SNR, CFR and CIR', zh: 发射 AWV 索引、SNR、CFR 与 CIR}
  - title: {en: Storage in MATLAB files, zh: 保存为 MATLAB 文件}
    detail: {en: 'Transfers are stored as location{i}.rxBeam{j}.transfer{k} in measurement_lab_f6048.mat and measurement_lab_f6534.mat, one file per carrier frequency. Each entry holds the IQ samples, the detected TX beam index, and a PPDUinfo structure.', zh: '传输数据以 location{i}.rxBeam{j}.transfer{k} 的结构保存在 measurement_lab_f6048.mat 与 measurement_lab_f6534.mat 中，每个载波频率一个文件。每个条目包含 IQ 样本、检测到的发射波束索引以及 PPDUinfo 结构。'}
    inputs:
    - {en: decoded transfers, zh: 已解码的传输数据}
    outputs:
    - {en: 'two MATLAB .mat files, one per carrier frequency', zh: 两个 MATLAB .mat 文件，每个载波频率一个}
  - title: {en: Analysis scripts, zh: 分析脚本}
    detail: {en: 'The dataset includes mainAnalysis.m, which produces SNR matrices for a TX-RX AWV pair, and main_postProcessing.py with libraryCommunications.py for PPDU decoding. The paper shows SNR as matrices with the RX AWV on one axis and the TX AWV on the other, for each distance.', zh: 数据集包含 mainAnalysis.m，用于生成某一发射-接收 AWV 对的 SNR 矩阵；以及 main_postProcessing.py 与 libraryCommunications.py，用于 PPDU 解码。论文将各距离下的 SNR 展示为接收 AWV 与发射 AWV 为坐标轴的矩阵。}
    inputs:
    - {en: MATLAB .mat files, zh: MATLAB .mat 文件}
    outputs:
    - {en: SNR matrices per distance, zh: 各距离下的 SNR 矩阵}
facts:
- label: {en: Beam codebook, zh: 波束码本}
  text: {en: 'The default codebook has 64 TX and 64 RX AWV indices. It sweeps azimuth from -45 to 45 degrees, side wall to side wall, which gives 4,096 TX-RX index pairs.', zh: '默认码本包含 64 个发射与 64 个接收 AWV 索引，方位角从 -45 度扫描到 45 度（侧墙至侧墙），共 4,096 个收发索引对。'}
- label: {en: Link distances, zh: 链路距离}
  text: {en: 'The link distance between the SDRs is reduced from 9.75 m to 2.44 m in 12-inch steps, which gives 25 locations.', zh: 两台 SDR 之间的链路距离从 9.75 m 按 12 英寸步长减小到 2.44 m，共 25 个位置。}
technical_notes:
- {en: 'The RFSoC2x2 converters run at 1.536 Gsps. The programmable logic moves 8 IQ samples per clock, and each sample component is 16 bits.', zh: RFSoC2x2 的转换器采样率为 1.536 Gsps。可编程逻辑每个时钟周期处理 8 个 IQ 样本，每个分量为 16 bit。}
