bands_ghz: [3.66]
antennas: {tx: 1, rx: 1}
size_gb: 71.6
facts:
- label: {en: Scene source, zh: 场景来源}
  text: {en: 'All 1,777 scenes were generated from OpenStreetMap building data. The generation manifests list no randomized fallback scenes.', zh: '全部 1,777 个场景由 OpenStreetMap 建筑数据生成，生成清单中没有随机回退场景。'}
- label: {en: Scene placement, zh: 场景位置}
  text: {en: 'The manifests give the requested and the actual latitude and longitude, the number of OSM attempts (up to 10) and the offset distance (up to about 3 km), because a retry can move the scene.', zh: 清单记录了请求位置与实际位置的纬度和经度、OSM 尝试次数（最多 10 次）以及偏移距离（最多约 3 km），因为重试可能会移动场景。}
- label: {en: Receivers per scene, zh: 每个场景的接收点数}
  text: {en: 'After outdoor-point filtering, a scene holds between 3,758 and 16,384 receivers. The raytracing.log file lists the receiver count for each scene.', zh: '经过室外点过滤后，每个场景的接收点数在 3,758 至 16,384 之间。raytracing.log 逐场景列出接收点数。'}
- label: {en: Carrier and antennas, zh: 载频与天线}
  text: {en: 'The default configuration uses a 3.66 GHz carrier, an isotropic transmitter and dipole receivers. The sample CSV stores the frequency as 3.66e9 Hz.', zh: 默认配置使用 3.66 GHz 载频，发射机为全向天线，接收机为偶极子天线。示例 CSV 中频率字段为 3.66e9 Hz。}
technical_notes:
- {en: 'The default ray-tracing configuration allows up to 3 reflections, uses 90,000 ray samples, and enables diffraction and scattering.', zh: '默认光线追踪配置最多允许 3 次反射，使用 90,000 个射线样本，并启用绕射与散射。'}
limitations:
- {en: 'The Hugging Face release covers Boston and Miami only. The ten-city distribution, listed as Link 2 in the GitHub README, is a separate download.', zh: Hugging Face 发布版仅包含波士顿与迈阿密两个城市。GitHub README 中列为 Link 2 的十城市数据为单独下载。}
