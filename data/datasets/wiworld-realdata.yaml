  status: derivable
  note: {en: Frequency response is not stored; it follows from the released complex CIRs by a Fourier transform over delay bins., zh: 频率响应未直接存储；可由发布的复数CIR沿时延bin做傅里叶变换得到。}
- key: cir
  status: provided
  note: {en: 'Complex CIRs over delay bins: 3.7 GHz with 200 MHz bandwidth and 5.00 ns resolution, 6.775 GHz with 600 MHz and 1.67 ns.', zh: 按时延bin组织的复数CIR：3.7 GHz，带宽200 MHz，时延分辨率5.00 ns；6.775 GHz，带宽600 MHz，时延分辨率1.67 ns。}
