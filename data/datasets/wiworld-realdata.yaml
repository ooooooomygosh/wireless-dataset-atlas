  text: {en: '• This review read paper Sec. II A–D and Table II; the original manifest was not obtained from the portal.

      • Add serialization details, synchronization residuals, and actual downloaded volume after obtaining the data. The overall acquisition plan is not the current release manifest.', zh: '• 本轮已读论文Sec.II A–D和Table II，未从入口取得原始manifest。

      • 具体序列化、同步残差和已下载体量应在获取数据后补充，整体采集计划不作为当前发布清单。'}
provenance:
- {en: 'Mobile campus measurements → dual-band CIR, images/LiDAR/radar/GNSS acquisition', zh: 校园移动测量 → 双频CIR、图像/LiDAR/radar/GNSS采集}
- {en: 'Metadata manifest associates route, time, array, and quality flags → sample-level multimodal records', zh: metadata manifest关联路线、时间、阵列与quality flag → 样本级多模态记录}
technical_notes:
- {en: 'Literature-supported: the resource includes measured CIR and multiview/panoramic images, rather than rendered geometry alone.', zh: 文献支持：资源包含实测CIR和多视角/全景图像，而非只渲染几何。}
- {en: 'Unknown: cross-frequency hardware clock, phase, and sensor-synchronization residuals have not yet been verified from files.', zh: 未知：跨频硬件时钟、相位和传感同步残差尚未由文件核实。}
limitations:
- {en: Do not confuse the mmWave radar carrier with a mmWave communication-CSI band., zh: 不能把毫米波雷达载频误当通信CSI的毫米波频段。}
- {en: One public route does not support conclusions about unseen cities or BSs without additional data., zh: 一条公开路线不支持未经补充的unseen-city或unseen-BS结论。}
history:
- {en: '2026-06-23: original preprint.', zh: 2026-06-23：原始预印本。}
- {en: '2026-11-05: reading the portal did not establish a download manifest.', zh: 2026-11-05：门户读取未能确认下载清单。}
usage:
- {en: 'After obtaining an official release, first inspect pair_id, timestamp, route_id, and quality_flag in the manifest.', zh: 取得正式release后先检查manifest中的pair_id、timestamp、route_id、quality_flag。}
- {en: Start with path-loss prediction; full CSI reconstruction requires checking phase and array definitions., zh: 把路径损耗预测作为初始任务；完整CSI重建需核对相位和阵列定义。}
field_notes:
- label: {en: Beam labels, zh: 波束标签}
  text: {en: 'The current public route contains CIR records from a fixed Tx and mobile horn/omni Rx. It has no codebook sweep, beam-response vector, or optimal-beam labels.', zh: 当前公开路线是固定Tx和移动horn/omni Rx的CIR记录；没有码本遍历、beam-response向量或最优beam标签。}
- label: {en: Multi-user, zh: 多用户}
  text: {en: The current public route has only one mobile Rx and no simultaneous multi-UE complex channel matrix. Planned extensions are not current capabilities., zh: 当前公开路线只有一个移动Rx，不包含同一时刻多UE复数信道矩阵；未来扩展不是当前能力。}
- label: {en: Multi-BS, zh: 多基站}
  text: {en: Multiple Tx markers in the paper's figures describe the overall campaign. The current release covers one representative route and contains no synchronized multi-Tx/BS sample groups., zh: 论文图中多个Tx标记描述整体campaign，当前发布一条代表性路线；没有同步多Tx/BS样本组。}
- label: {en: Paths, zh: 路径}
  text: {en: 'This field refers to per-path angles at both link ends and interaction records, which the public interface does not provide. Delay-domain representations or path parameters can be estimated from CSI, but separate-path interaction records are not provided.', zh: 本栏指逐径双端角度/交互记录，公开接口不提供。可从CSI得到时延域或估计路径参数，但未提供分离路径的交互记录。}
overview: {en: 'WiWorld-RealData is a real-world channel and environment dataset from Beijing University of Posts and Telecommunications (BUPT), described in arXiv:2606.24476 (submitted June 2026) for 6G wireless world model research. It combines wideband channel impulse responses (CIRs) measured at 3.7 GHz and 6.775 GHz with multi-view and panoramic images, LiDAR point clouds, mmWave radar observations and GNSS trajectories. The measurements were made on the BUPT Haidian Campus with an upgraded BUPTSounder Pro system, where the Tx stood on an elevated campus building at 20.5 m, the mobile Rx at 2.5 m, and the Rx moved at 1 to 1.4 m/s. The campaign comprises 15 continuous routes and 36 outdoor route segments and produced about 10 TB of data, while the public release contains one route at 3.7 GHz and one at 6.775 GHz within a highlighted region. Each 100 ms CIR file is matched with the nearest record of each sensing modality within 50 ms, and a unified manifest lists sample identifiers, Tx
    and Rx identifiers, center frequency, time offsets and quality flags. The authors evaluate environment-assisted path-loss prediction, which reaches an MAE of 2.02 dB and an RMSE of 2.69 dB after few-shot adaptation on a continuous test segment, and they list cross-band propagation analysis, environment-aware channel modeling and wireless digital twins as target uses.', zh: 'WiWorld-RealData是北京邮电大学（BUPT）发布的真实环境信道与环境感知数据集，相关论文为arXiv:2606.24476（2026年6月提交），面向6G无线世界模型研究。数据包含3.7 GHz和6.775 GHz的宽带信道冲激响应（CIR），以及多视角与全景图像、LiDAR点云、毫米波雷达观测和GNSS轨迹。测量在BUPT海淀校区进行，使用升级的BUPTSounder Pro系统：Tx固定于校园建筑的高处（20.5 m），移动Rx高2.5 m，Rx以1至1.4 m/s的速度移动。整个测量活动包含15条连续路线和36个户外路段，约产生10 TB数据；公开发布包含高亮区域内3.7 GHz和6.775 GHz各一条路线。每个100 ms的CIR文件与各感知模态中最近的记录在50 ms内匹配，统一manifest记录样本标识、Tx与Rx标识、中心频率、时间偏移和quality flag。作者以环境辅助路径损耗预测为验证任务，在连续测试路段上经少样本适应后得到MAE 2.02 dB、RMSE 2.69 dB，并列出跨频段传播分析、环境感知信道建模和无线数字孪生等用途。'}
signal_details:
- signal: cir
  text: {en: 'Measured with the BUPTSounder Pro channel sounder. The Tx radiates a wideband PN11 sounding signal, and the mobile Rx records complex I/Q that is correlated with a calibrated reference sequence to obtain CIRs. At 3.7 GHz the bandwidth is 200 MHz, the sampling rate 200 MSamples/s and the delay resolution 5.00 ns; at 6.775 GHz the values are 600 MHz, 600 MSamples/s and 1.67 ns. The Tx uses a horn or an omnidirectional antenna (horn gain 10.21 dBi at 3.7 GHz and 10.20 dBi at 6.775 GHz; omnidirectional gain 0.95 dBi and 0.99 dBi), and the Rx uses an omnidirectional antenna. CIRs whose start times fall within the same 100 ms window are grouped into one .mat file.', zh: 由BUPTSounder Pro信道探测系统测量。Tx发射宽带PN11探测信号，移动Rx记录复数I/Q，并与校准后的参考序列相关以得到CIR。3.7 GHz时带宽为200 MHz，采样率200 MSamples/s，时延分辨率5.00 ns；6.775 GHz时分别为600 MHz、600 MSamples/s和1.67 ns。Tx使用喇叭天线或全向天线（3.7 GHz喇叭增益10.21 dBi，6.775 GHz为10.20 dBi；全向增益分别为0.95 dBi和0.99 dBi），Rx使用全向天线。起始时间位于同一100 ms窗口内的CIR被存入同一个.mat文件。}
- signal: rgb
  text: {en: 'Four network cameras on the Rx platform record multi-view images, and a panoramic camera records panoramic images, both at 10 fps. Panoramic images are also collected at the fixed Tx. Faces and license plates in the released images are anonymized.', zh: Rx平台上的四台网络摄像头采集多视角图像，全景相机采集全景图像，两者均为10 fps。固定Tx处同样采集全景图像。已公开图像中的人脸和车牌已做匿名化处理。}
- signal: lidar
  text: {en: A LiDAR sensor on the mobile Rx platform produces point clouds at 10 Hz. Point clouds are also collected at the fixed Tx location., zh: 移动Rx平台上的LiDAR传感器以10 Hz生成点云，固定Tx位置同样采集点云。}
- signal: radar
  text: {en: 'A millimeter-wave radar on the mobile Rx platform produces observations at 20 Hz, which capture dynamic-object information.', zh: 移动Rx平台上的毫米波雷达以20 Hz输出观测，用于获取动态物体信息。}
- signal: gps
  text: {en: 'A GNSS receiver on the mobile Rx platform records at 20 Hz, and GNSS records are also collected at the fixed Tx. GNSS receivers and rubidium clocks at the Tx and Rx provide a common timing reference.', zh: 移动Rx平台上的GNSS接收机以20 Hz记录，固定Tx处同样采集GNSS记录。Tx和Rx处的GNSS接收机与铷钟共同提供统一时间参考。}
