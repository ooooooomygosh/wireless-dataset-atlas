summary: {en: A 2026 resource combining multifrequency RF and environmental observations along mobile campus routes. It supports exploration of wireless world-model data interfaces; the current public release must be distinguished from the full acquisition plan., zh: 2026年提出的校园移动路线多频RF与环境观测资源；适合探索无线world model的数据接口，但现阶段公开范围需与整个采集计划区分。}
checked: '2026-11-06'
pipeline:
  summary: {en: 'Dual-band CIRs and environmental sensor streams are recorded along campus routes. Each CIR file is anchored to the nearest sensor record within 50 ms, and a unified manifest links the samples.', zh: 沿校园路线记录双频 CIR 与环境传感器数据。每个 CIR 文件与 50 ms 内最近的传感器记录对齐，统一 manifest 将各样本关联起来。}
  stages:
  - title: {en: 'Set the route, Tx/Rx and bands', zh: 设定路线、收发端与频段}
    detail: {en: 'The released route uses a fixed Tx on an elevated campus building and a mobile Rx on a measurement platform, with channel sounding at 3.7 GHz and 6.775 GHz.', zh: 发布路线采用固定在校园建筑高处的 Tx，以及安装于移动测量平台上的 Rx，在 3.7 GHz 与 6.775 GHz 进行信道探测。}
    inputs:
    - {en: Haidian Campus routes and the fixed Tx site, zh: 海淀校区路线与固定 Tx 站点}
    - {en: BUPTSounder Pro channel-sounding system, zh: BUPTSounder Pro 信道探测系统}
    controls:
    - {en: Tx antenna is a horn or omnidirectional antenna; Rx antenna is omnidirectional, zh: Tx 天线为喇叭或全向天线；Rx 天线为全向天线}
    outputs:
    - {en: 'Route, band and Tx-Rx link definitions', zh: 路线、频段和 Tx-Rx 链路定义}
  - title: {en: Record CIR and environmental streams, zh: 记录 CIR 与环境数据流}
    detail: {en: 'The Tx radiates a wideband PN11 sounding signal, and the Rx correlates the recorded complex I/Q with a calibrated reference sequence to obtain CIRs. Cameras, LiDAR, radar and GNSS are triggered by one control script and keep their own timestamps.', zh: 发射端发送宽带 PN11 探测信号，接收端记录复数 I/Q，并与校准后的参考序列相关得到 CIR。相机、LiDAR、雷达和 GNSS 由统一控制脚本触发，并各自保留时间戳。}
    controls:
    - {en: Cameras and panoramic camera at 10 fps; LiDAR at 10 Hz; radar and GNSS at 20 Hz, zh: 相机与全景相机 10 fps；LiDAR 10 Hz；雷达与 GNSS 20 Hz}
    outputs:
    - {en: 'CIR files grouped by 100 ms window, and timestamped sensor files', zh: 按 100 ms 窗口分组的 CIR 文件，以及带时间戳的传感器文件}
  - title: {en: Match samples in time, zh: 按时间匹配样本}
    detail: {en: 'Each 100 ms CIR file is the anchor. Each sensing modality contributes its temporally nearest record when the absolute time difference does not exceed 50 ms. The actual time differences are recorded, and unmatched fields are marked NAN.', zh: 每个 100 ms 的 CIR 文件作为锚点。各感知模态取时间上最近的记录，且绝对时间差不超过 50 ms。实际时间差被记录，未匹配的字段标记为 NAN。}
    outputs:
    - {en: Sample-level associations with time offsets and quality flags, zh: 带时间偏移和 quality flag 的样本级关联}
  - title: {en: Organize the release with a manifest, zh: 用 manifest 组织发布内容}
    detail: {en: 'Data are organized by scenario, route, frequency and sample, with modality-specific directories. Each manifest row gives the sample identifier, Tx and Rx identifiers, center frequency, reference timestamp, file paths, time offsets and quality flags.', zh: 数据按场景、路线、频率和样本分层组织，各模态存放于独立目录。manifest 的每一行给出样本标识、Tx 与 Rx 标识、中心频率、参考时间戳、文件路径、时间偏移和 quality flag。}
    outputs:
    - {en: Unified metadata manifest, zh: 统一的元数据 manifest}
  - title: {en: Build the path-loss case study, zh: 构建路径损耗案例}
    detail: {en: 'The label is -10 log10 of the snapshot-averaged power summed over valid delay bins, computed from 3.7 GHz CIRs. A multimodal regressor (ResNet-34 for images, PointNet++ for LiDAR, an MLP for positions and GPT-2 fusion) is trained on the source samples, adapted with 20 target samples, and evaluated on the rest of the target segment.', zh: 标签由 3.7 GHz CIR 计算：对快照求平均、对有效时延 bin 求和后取 -10 log10。多模态回归模型（图像使用 ResNet-34，LiDAR 使用 PointNet++，位置使用 MLP，并以 GPT-2 融合）先在源域样本上训练，再用 20 个目标域样本适应，并在目标路段其余样本上评估。}
    outputs:
    - {en: Path-loss MAE 2.02 dB and RMSE 2.69 dB on the target segment, zh: 目标路段路径损耗 MAE 2.02 dB、RMSE 2.69 dB}
facts:
- label: {en: Release scope, zh: 发布范围}
  text: {en: The Science Data Bank page states that the current release contains four routes forming a single loop. The arXiv paper describes one route at each band., zh: Science Data Bank 页面称当前发布包含构成单一环路的四条路线；arXiv 论文描述的是每个频段一条路线。}
- label: {en: Campaign scale, zh: 采集规模}
  text: {en: 'The full campaign covers 15 continuous routes and 36 outdoor route segments, about 10 TB in total, with more than 200,000 multi-view images, about 50,000 panoramic images, 50,000 LiDAR point clouds, 50,000 radar records and 100,000 GNSS records.', zh: 完整采集包含 15 条连续路线和 36 个户外路段，总量约 10 TB，含 20 万张以上多视角图像、约 5 万张全景图像、5 万帧 LiDAR 点云、5 万条雷达记录和 10 万条 GNSS 记录。}
- label: {en: License and access, zh: 许可与访问}
  text: {en: The Science Data Bank metadata gives CC BY-NC-ND 4.0. Users complete an access application form before downloading., zh: Science Data Bank 元数据标注为 CC BY-NC-ND 4.0；下载前需填写访问申请表。}
- label: {en: File naming, zh: 文件命名}
  text: {en: 'Data files follow SCN_BUPT_TX<ant><pos>_RX<route>_F<freq>_<datatype>_<YYYYMMDDHHMMSSmmm>. CIRs are stored as .mat files, one per 100 ms window.', zh: 数据文件遵循 SCN_BUPT_TX<ant><pos>_RX<route>_F<freq>_<datatype>_<YYYYMMDDHHMMSSmmm> 命名规则。CIR 以 .mat 文件存储，每个 100 ms 窗口一个文件。}
- label: {en: Sample identifier, zh: 样本标识}
  text: {en: 'Aligned sample IDs follow RX<route>_F<freq>_<sample_index>, and the index increases independently within each Rx-frequency combination.', zh: 对齐样本的 ID 格式为 RX<route>_F<freq>_<sample_index>，索引在每个 Rx-频率组合内独立递增。}
- label: {en: Path-loss label, zh: 路径损耗标签}
  text: {en: The label is computed from the calibrated 3.7 GHz CIR as -10 log10 of the snapshot-averaged power summed over the valid delay bins., zh: 标签由校准后的 3.7 GHz CIR 计算，为对快照求平均、对有效时延 bin 求和后的功率取 -10 log10。}
- label: {en: Case-study split, zh: 案例划分}
  text: {en: 'The case study uses 2,889 aligned 3.7 GHz samples. Samples 150 to 750 form the target segment, the remaining samples form the source domain split 9:1 into training and validation, and 20 labeled target samples (about 3.3% of the target) are used for adaptation.', zh: '案例使用 2,889 个对齐的 3.7 GHz 样本。第 150 至 750 个样本构成目标路段，其余样本为源域并按 9:1 划分为训练集与验证集，另用 20 个带标签的目标样本（约占目标样本的 3.3%）进行适应。'}
- label: {en: Privacy, zh: 隐私处理}
  text: {en: Faces and license plates in the released images are anonymized., zh: 已发布图像中的人脸与车牌已做匿名化处理。}
provenance:
- {en: 'Mobile campus measurements → dual-band CIR, images/LiDAR/radar/GNSS acquisition', zh: 校园移动测量 → 双频CIR、图像/LiDAR/radar/GNSS采集}
- {en: 'Metadata manifest associates route, time, array, and quality flags → sample-level multimodal records', zh: metadata manifest关联路线、时间、阵列与quality flag → 样本级多模态记录}
technical_notes:
- {en: 'The CIRs are measured complex channel responses, and the images and point clouds are captured by sensors rather than rendered from geometry.', zh: CIR 为实测复数信道响应，图像和点云由传感器采集，而非由几何渲染生成。}
- {en: 'The 3.7 GHz and 6.775 GHz CIRs have delay resolutions of 5.00 ns and 1.67 ns, respectively.', zh: 3.7 GHz 与 6.775 GHz 的 CIR 时延分辨率分别为 5.00 ns 与 1.67 ns。}
limitations:
- {en: The mmWave radar is a sensing modality. Channel data exist only at 3.7 GHz and 6.775 GHz., zh: 毫米波雷达是感知模态，信道数据仅在 3.7 GHz 与 6.775 GHz 提供。}
- {en: 'The described setup has one fixed Tx and one mobile Rx, and the paper reports no multi-BS or multi-UE sample groups.', zh: 所述设置为一个固定 Tx 与一个移动 Rx，论文未报告多基站或多 UE 样本组。}
