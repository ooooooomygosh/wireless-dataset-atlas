- {en: Complete the access application listed on the Science Data Bank page before downloading., zh: 下载前需完成 Science Data Bank 页面所列的访问申请。}
- {en: 'Under CC BY-NC-ND 4.0, the data may be shared non-commercially with attribution, but adapted versions may not be redistributed.', zh: 依据 CC BY-NC-ND 4.0，数据可在署名前提下非商业共享，但改编版本不可再发布。}
- {en: 'Start from the manifest, which provides the sample identifier, Tx and Rx identifiers, center frequency, reference timestamp, time offsets and quality flags.', zh: 从 manifest 入手，其中包含样本标识、Tx 与 Rx 标识、中心频率、参考时间戳、时间偏移和 quality flag。}
- {en: The demonstrated task in the paper is environment-assisted path-loss prediction using labels derived from 3.7 GHz CIRs., zh: 论文演示的任务是利用 3.7 GHz CIR 导出的标签进行环境辅助路径损耗预测。}
field_notes:
- label: {en: Beam labels, zh: 波束标签}
  text: {en: 'The paper lists CIRs, images, LiDAR, radar and GNSS as the released contents. It describes no codebook sweep, beam-response vector or optimal-beam labels.', zh: 论文列出的发布内容为 CIR、图像、LiDAR、雷达和 GNSS，未描述码本遍历、beam 响应向量或最优 beam 标签。}
- label: {en: Multi-user, zh: 多用户}
  text: {en: 'The described setup uses one mobile Rx, and the paper reports no simultaneous multi-UE complex channel matrix.', zh: 所述设置仅使用一个移动 Rx，论文未报告同一时刻的多 UE 复数信道矩阵。}
- label: {en: Multi-BS, zh: 多基站}
  text: {en: 'Fig. 2 shows Tx locations for the full campaign. The released route is described with one fixed Tx, and the paper reports no synchronized multi-Tx sample groups.', zh: 图 2 给出整体采集中的 Tx 位置。发布路线描述为单个固定 Tx，论文未报告同步的多 Tx 样本组。}
- label: {en: Paths, zh: 路径}
  text: {en: The released data are complex CIRs over delay bins. Per-path angles and interaction records are not described., zh: 发布数据为各时延 bin 上的复数 CIR，未描述逐径角度与交互记录。}
overview: {en: 'WiWorld-RealData is a real-world channel and environment dataset from Beijing University of Posts and Telecommunications (BUPT), described in arXiv:2606.24476 and published on Science Data Bank under DOI 10.57760/sciencedb.40663. It combines wideband channel impulse responses (CIRs) measured at 3.7 GHz and 6.775 GHz with multi-view and panoramic images, LiDAR point clouds, millimeter-wave radar observations and GNSS trajectories. The measurements were made on the BUPT Haidian Campus with an upgraded BUPTSounder Pro system, with the Tx fixed on an elevated campus building at 20.5 m, the mobile Rx at 2.5 m, and the Rx moving at 1 to 1.4 m/s. The full campaign comprises 15 continuous routes and 36 outdoor route segments and produced about 10 TB of data. The arXiv paper describes the public release as one route at each band within a highlighted region, whereas the Science Data Bank page states that the current release contains four routes forming a single loop, with the remaining
    data to be released after de-identification. Each 100 ms CIR file is matched with the nearest record of each sensing modality within 50 ms, and a unified manifest lists sample identifiers, Tx and Rx identifiers, center frequency, time offsets and quality flags. The authors'' environment-assisted path-loss prediction reaches an MAE of 2.02 dB and an RMSE of 2.69 dB after few-shot adaptation on a continuous test segment. The paper lists cross-band propagation analysis, environment-aware channel modeling and wireless digital twins as target uses.', zh: 'WiWorld-RealData 是北京邮电大学（BUPT）发布的真实环境信道与环境感知数据集，相关论文为 arXiv:2606.24476，数据发布于 Science Data Bank，DOI 为 10.57760/sciencedb.40663。数据包含 3.7 GHz 与 6.775 GHz 的宽带信道冲激响应（CIR），以及多视角与全景图像、LiDAR 点云、毫米波雷达观测和 GNSS 轨迹。测量在 BUPT 海淀校区进行，使用升级的 BUPTSounder Pro 系统：Tx 固定于校园建筑高处（20.5 m），移动 Rx 高 2.5 m，并以 1 至 1.4 m/s 的速度移动。整个测量活动包含 15 条连续路线和 36 个户外路段，约产生 10 TB 数据。arXiv 论文将公开发布描述为高亮区域内每个频段各一条路线，而 Science Data Bank 页面称当前发布包含构成单一环路的四条路线，其余数据将在去标识化后陆续发布。每个 100 ms 的
    CIR 文件与各感知模态中时间最近的记录匹配，匹配门限为 50 ms；统一 manifest 记录样本标识、Tx 与 Rx 标识、中心频率、时间偏移和 quality flag。作者的环境辅助路径损耗预测在连续测试路段上经少样本适应后达到 MAE 2.02 dB、RMSE 2.69 dB。论文列出的目标用途包括跨频段传播分析、环境感知信道建模和无线数字孪生。'}
signal_details:
- signal: cir
  text: {en: 'Measured with the BUPTSounder Pro channel sounder. The Tx radiates a wideband PN11 sounding signal, and the mobile Rx records complex I/Q that is correlated with a calibrated reference sequence to obtain CIRs. At 3.7 GHz the bandwidth is 200 MHz, the sampling rate 200 MSamples/s and the delay resolution 5.00 ns; at 6.775 GHz the values are 600 MHz, 600 MSamples/s and 1.67 ns. The Tx uses a horn or an omnidirectional antenna (horn gain 10.21 dBi at 3.7 GHz and 10.20 dBi at 6.775 GHz; omnidirectional gain 0.95 dBi and 0.99 dBi), and the Rx uses an omnidirectional antenna. CIRs whose start times fall within the same 100 ms window are grouped into one .mat file.', zh: 由BUPTSounder Pro信道探测系统测量。Tx发射宽带PN11探测信号，移动Rx记录复数I/Q，并与校准后的参考序列相关以得到CIR。3.7 GHz时带宽为200 MHz，采样率200 MSamples/s，时延分辨率5.00 ns；6.775 GHz时分别为600 MHz、600 MSamples/s和1.67 ns。Tx使用喇叭天线或全向天线（3.7 GHz喇叭增益10.21 dBi，6.775 GHz为10.20 dBi；全向增益分别为0.95 dBi和0.99 dBi），Rx使用全向天线。起始时间位于同一100 ms窗口内的CIR被存入同一个.mat文件。}
- signal: rgb
  text: {en: 'Four network cameras on the Rx platform record multi-view images, and a panoramic camera records panoramic images, both at 10 fps. Panoramic images are also collected at the fixed Tx. Faces and license plates in the released images are anonymized.', zh: Rx平台上的四台网络摄像头采集多视角图像，全景相机采集全景图像，两者均为10 fps。固定Tx处同样采集全景图像。已公开图像中的人脸和车牌已做匿名化处理。}
- signal: lidar
  text: {en: A LiDAR sensor on the mobile Rx platform produces point clouds at 10 Hz. Point clouds are also collected at the fixed Tx location., zh: 移动Rx平台上的LiDAR传感器以10 Hz生成点云，固定Tx位置同样采集点云。}
- signal: radar
  text: {en: 'A millimeter-wave radar on the mobile Rx platform produces observations at 20 Hz, which capture dynamic-object information.', zh: 移动Rx平台上的毫米波雷达以20 Hz输出观测，用于获取动态物体信息。}
- signal: gps
  text: {en: 'A GNSS receiver on the mobile Rx platform records at 20 Hz, and GNSS records are also collected at the fixed Tx. GNSS receivers and rubidium clocks at the Tx and Rx provide a common timing reference.', zh: 移动Rx平台上的GNSS接收机以20 Hz记录，固定Tx处同样采集GNSS记录。Tx和Rx处的GNSS接收机与铷钟共同提供统一时间参考。}
size_gb: 3790
