citing: []
summary: {en: A 2026 resource combining multifrequency RF and environmental observations along mobile campus routes. It supports exploration of wireless world-model data interfaces; the current public release must be distinguished from the full acquisition plan., zh: 2026年提出的校园移动路线多频RF与环境观测资源；适合探索无线world model的数据接口，但现阶段公开范围需与整个采集计划区分。}
checked: '2026-11-06'
pipeline:
  summary: {en: Dual-band CIR and environmental sensor streams are collected along campus routes and associated through timestamps and a metadata manifest. Nearest-neighbor matching retains time offsets and quality flags., zh: 沿校园路线采集双频CIR及环境传感器，各流通过时间戳和metadata manifest关联；最近邻匹配保留时间偏移与quality flag。}
  stages:
  - title: {en: 'Define the route, wireless deployment, and release scope', zh: 固定路线、无线部署与发布范围}
    detail: {en: 'The current release describes a representative route with a fixed Tx and one mobile Rx, recording wireless observations at 3.7 and 6.775 GHz. The scale of the paper''s overall campaign and this public route are tracked separately.', zh: 当前发布描述以固定Tx、单移动Rx的代表性路线为对象，在3.7和6.775 GHz记录无线观测。论文整体campaign规模与这条公开路线分别维护。}
    inputs:
    - {en: Campus route and fixed Tx, zh: 校园路线和固定Tx}
    - {en: Mobile horn/omni Rx, zh: 移动horn/omni Rx}
    - {en: 3.7/6.775 GHz channel-sounding system, zh: 3.7/6.775 GHz声探系统}
    outputs:
    - {en: Route/band/Tx-Rx link identity, zh: 路线/频段/Tx-Rx link身份}
    - {en: Deployment and hardware metadata, zh: 部署与硬件元数据}
    controls:
    - {en: 6.775 GHz is the second sub-7 GHz band; distinguish the current route from future extensions., zh: 6.775 GHz属于第二sub-7 GHz频段，当前路线与后续扩展分开}
    checks:
    - {en: 'Reproduction check: confirm the routes, links, and bands actually listed in the manifest; do not fill in samples from the overall plan.', zh: 复现检查：确认manifest实际列出的路线、链路和频段，避免按整体计划补齐样本}
  - title: {en: Collect CIR and multimodal environmental streams, zh: 采集CIR与多模态环境流}
    detail: {en: 'The wireless system records CIR while the mobile measurement platform also acquires environmental images, LiDAR, radar, and GNSS. Each modality retains its own sample times and device information.', zh: 无线系统记录CIR，移动测量平台同时采集环境图像、LiDAR、雷达和GNSS。各模态保留自身采样时间和设备信息。}
    inputs:
    - {en: Dual-band channel sounding, zh: 双频声探}
    - {en: 'Imaging, LiDAR, radar, and GNSS devices', zh: 图像、LiDAR、radar、GNSS设备}
    outputs:
    - {en: CIR and environmental sensor files, zh: CIR与环境传感文件}
    - {en: Timestamps for each stream, zh: 各流的时间戳}
    controls:
    - {en: Public documentation describes the modality pipeline; specific file extensions and native axes require manifest verification., zh: 公开说明已描述模态链；具体文件扩展名和原始轴需manifest确认}
    checks:
    - {en: 'Reproduction check: inspect actual availability, sampling period, coordinate system, and sensor extrinsics for each modality.', zh: 复现检查：检查每种模态实际存在率、采样周期、坐标系与传感器外参}
  - title: {en: Align times and preserve matching errors, zh: 对齐时间并保留匹配误差}
    detail: {en: The paper describes associating modalities by nearest-neighbor time matching and storing offsets and quality flags in the manifest. This establishes sample associations; cross-frequency hardware clock/phase residuals still require verification from raw files., zh: 论文描述按最近邻时间关联模态，并在manifest保存匹配偏移和质量标记。此过程构建样本关系，硬件跨频时钟/相位残差仍需原始文件核验。}
    inputs:
    - {en: Per-stream timestamps, zh: 各流时间戳}
    - {en: Route and sample identity, zh: 路线与sample身份}
    outputs:
    - {en: Sample-level modality associations, zh: sample级模态关联}
    - {en: Time offsets and quality flags, zh: time offset和quality flag}
    controls:
    - {en: 'Check phase coherence, temporal proximity, and geographic correspondence separately.', zh: 相位相干、时间接近和地理位置对应分别检查}
    checks:
    - {en: 'Reproduction check: report offset distributions for each modality; reject matches outside the task''s acceptable time window.', zh: 复现检查：报告各模态偏移分布；剔除超过任务容许时间窗的匹配}
  - title: {en: Organize the release with a manifest, zh: 用manifest组织发布物}
    detail: {en: 'Organize data by scenario, route, band, Tx-Rx link, modality, and sample. The manifest connects wireless and environmental observations. Users read the manifest first, then load the required modalities.', zh: 按scenario、route、band、Tx-Rx link、modality、sample组织数据，manifest连接无线与环境观测。用户先读取manifest，再按需要加载模态。}
    inputs:
    - {en: 'CIR, sensor files, and quality metadata', zh: CIR、传感文件及质量元数据}
    outputs:
    - {en: Traceable sample catalog, zh: 可追溯的样本目录}
    - {en: Associated files and deployment metadata, zh: 关联文件与部署元数据}
    controls:
    - {en: Use the actual manifest to establish the current public contents and download accessibility., zh: 公开入口当前内容和下载可达性需以真实manifest为准}
    checks:
    - {en: 'Reproduction check: verify file existence, unique sample keys, and band/link consistency.', zh: 复现检查：检查文件存在、唯一sample键、频段与链路的一致性}
  - title: {en: Build route-level cross-frequency or multimodal tasks, zh: 建立路线级跨频或多模态任务}
    detail: {en: 'Create cross-frequency targets only for explicitly associated dual-band samples. Group learning experiments by route segment or independent run. Evaluate CIR statistics, position-neighbor methods, and unimodal baselines first, then analyze the incremental value of environmental information.', zh: 仅对明确关联的双频样本建立跨频目标。学习实验按路线段或独立运行分组，先评估CIR统计、位置近邻和单模态基线，再分析环境信息的增量价值。}
    inputs:
    - {en: Valid manifest entries, zh: 有效manifest条目}
    - {en: 'CIR, GNSS, and environmental observations', zh: CIR、GNSS和环境观测}
    outputs:
    - {en: Paired-sample table, zh: 配对样本表}
    - {en: Route-level splits and simple baselines, zh: 路线级split与简单基线}
    controls:
    - {en: Fix offset thresholds and normalization during training/validation; limit time-window inputs according to acquisition completion times., zh: 偏移门限和归一化在训练/验证阶段固定；时间窗输入按采集完成时刻限定}
    checks:
    - {en: 'Reproduction check: inspect leakage from overlapping route segments, repeated images, time offsets, and revisits to the same route.', zh: 复现检查：检查路段重叠、重复画面、时间偏移和同一路线回访的泄漏}
  scope: {en: One representative dual-band mobile route described in the current public release. The full campaign on the order of 10 TB and the current release scope are recorded separately., zh: 当前公开描述的一条代表性双频移动路线；整体10 TB级campaign与当前发布范围分别记录。}
