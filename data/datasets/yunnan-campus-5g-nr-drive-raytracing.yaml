limitations:
- en: The dataset covers one operator, one band and one campus, with 12 vehicle sessions.
  zh: 数据仅覆盖一家运营商、一个频段和一个校园，共 12 次车载路测。
- en: Measurement-filled maps write measured values into simulated cells. The paper says they are for completion studies and should not be used as independent simulation labels.
  zh: 测量填充图将实测值写入仿真栅格。论文称其用于补全研究，不应作为独立的仿真标签使用。
- en: The building model is a simplified mass model. No CityGML level of detail is assigned.
  zh: 建筑模型为简化体量模型，未标注 CityGML 细节层次。
