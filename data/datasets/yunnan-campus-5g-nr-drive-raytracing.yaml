    zh: 未发布信道冲激响应。
- key: paths
  status: none
  note:
    en: No path-level output; the ray-tracing products are radio maps.
    zh: 无路径级输出，射线追踪产品为无线地图。
- key: interaction
  status: none
  note:
    en: No path interaction data are released.
    zh: 未发布路径交互数据。
- key: power
  status: provided
  note:
    en: Measured SS-RSRP, plus Sionna RT RSRP maps per station and for the joint best-server map.
    zh: 实测 SS-RSRP，以及每个基站和联合最优服务小区的 Sionna RT RSRP 地图。
- key: iq
  status: none
  note:
    en: No raw I/Q samples.
    zh: 无原始 I/Q 采样。
- key: beam_labels
  status: none
  note:
    en: No beam labels; the transmit array is a generic directional model.
    zh: 无波束标签；发射阵列为通用定向模型。
- key: position
  status: provided
  note:
    en: WGS84 latitude and longitude in the CSV files; Blender-local coordinates in the processed files.
    zh: CSV 文件含 WGS84 经纬度，处理后文件含 Blender 本地坐标。
- key: geometry
  status: provided
  note:
    en: DEM-derived terrain mesh (ground.ply) and simplified building mesh (ynu_chenggong_campus-001.ply).
    zh: 由 DEM 生成的地形网格（ground.ply）与简化建筑网格（ynu_chenggong_campus-001.ply）。
- key: materials
  status: provided
  note:
    en: 'Material names only: itu_wet_ground for terrain and itu_concrete for buildings.'
    zh: 仅给出材料名称：地面为 itu_wet_ground，建筑为 itu_concrete。
- key: rgb
  status: none
  note:
    en: No camera images.
    zh: 无相机图像。
- key: depth
  status: none
  note:
    en: No depth data.
    zh: 无深度数据。
- key: lidar
  status: none
  note:
    en: No LiDAR data.
    zh: 无 LiDAR 数据。
- key: radar
  status: none
  note:
    en: No radar data.
    zh: 无雷达数据。
- key: imu
  status: none
  note:
    en: No IMU data.
    zh: 无 IMU 数据。
- key: time_series
  status: provided
  note:
    en: Each drive-test record has a measurement time; the radio maps are static.
    zh: 每条路测记录含测量时间；无线地图为静态。
- key: multiuser
  status: none
  note:
    en: One receiver per drive test; no multi-user data.
    zh: 每次路测仅一个接收端，无多用户数据。
- key: multibs
  status: provided
  note:
    en: 27 physical base stations and 79 PCIs, with per-station maps and multi-cell PCI-RSRP lists.
    zh: 27 个物理基站与 79 个 PCI，含每站地图及多小区 PCI-RSRP 列表。
- key: crossfreq
  status: none
  note:
    en: Single band at 2.565 GHz (n41).
    zh: 仅 2.565 GHz（n41）单一频段。
- key: near_field
  status: none
  note:
    en: Maps use a 1 m grid; no near-field modelling is described.
    zh: 地图为 1 m 网格，未描述近场建模。
- key: high_mobility
  status: provided
  note:
    en: Vehicle speed is recorded in each drive-test record; the speed range is not stated.
    zh: 每条路测记录含车速；未说明速度范围。
- key: dynamic_blockage
  status: none
  note:
    en: Static scene; no dynamic obstacles are modelled.
    zh: 场景为静态，未建模动态障碍物。
- key: reflection
  status: simulate
  note:
    en: Sionna RT, maximum depth 5, run on the released meshes reproduces it.
    zh: 在发布的网格上以最大深度 5 运行 Sionna RT 可复现。
- key: diffraction
  status: simulate
  note:
    en: Diffraction and edge diffraction are enabled in the Sionna RT settings.
    zh: Sionna RT 设置中已启用绕射与边缘绕射。
- key: scattering
  status: unknown
- key: transmission
  status: unknown
- key: polarization
  status: simulate
  note:
    en: The transmit array uses VH polarization in the Sionna RT settings.
    zh: Sionna RT 设置中发射阵列采用 VH 极化。
- key: em_field
  status: none
  note:
    en: Only received power is released, not field values.
    zh: 仅发布接收功率，不含场值。
