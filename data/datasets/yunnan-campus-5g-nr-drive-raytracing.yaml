summary:
  en: Twelve 5G NR n41 drive-test sessions on a mountainous campus, with Sionna RT radio maps for 27 base stations and a joint best-server RSRP map calibrated to the measurements.
  zh: 山地校园内 12 次 5G NR n41 路测数据，提供 27 个基站的 Sionna RT 无线地图，以及经实测校准的联合最优服务小区 RSRP 地图。
overview:
  en: 'The dataset covers 5G NR radio propagation on the Chenggong Campus of Yunnan University in Kunming, China, a mountainous campus. Twelve drive-test sessions were recorded by a vehicle-mounted Android terminal running Cellular-Pro on vehicle-accessible roads. The network is a China Mobile 5G SA cell on n41 at 2.565 GHz, with 100 MHz bandwidth and 273 resource blocks. The raw CSV files hold 14,355 records with time, WGS84 position, vehicle speed, ARFCN, PCI, gNodeB ID, SS-RSRP, SS-RSRQ and SS-SINR, along with the PCIs and RSRP values detected at the same time. Twenty-seven physical base stations and 79 PCIs were verified in the field. A DEM-derived terrain mesh and a simplified 3D building model are released as PLY files in a shared Blender-local frame. The radio maps were computed with Sionna RT 1.2.2 using the same settings as calibration: maximum depth 5, diffraction and edge diffraction enabled, terrain as itu_wet_ground and buildings as itu_concrete. Each base station has a 512 x 512 m map on a nominal 1 m grid. The joint best-server map covers 4000 x 3000 m and is released in raw and calibration-adjusted versions, with RSRP, PCI, station and sector per cell. Nine trajectories were used for calibration and three for held-out evaluation. On 2,380 held-out cells, the calibration-adjusted joint map gives an RMSE of 12.06 dB and an MAE of 9.89 dB. The Mendeley Data record is under CC BY 4.0. The Zenodo record holds the processing and application code.'
  zh: 该数据集记录了中国昆明云南大学呈贡校区（山地校园）的 5G NR 无线传播情况。车载 Android 终端运行 Cellular-Pro，在可通车道路上完成 12 次路测。网络为中国移动 n41 频段的 5G SA 小区，载频 2.565 GHz，带宽 100 MHz，273 个资源块。原始 CSV 文件共 14,355 条记录，包含时间、WGS84 位置、车速、ARFCN、PCI、gNodeB ID、SS-RSRP、SS-RSRQ 与 SS-SINR，并给出同一时刻检测到的多个 PCI 及其 RSRP 值。27 个物理基站与 79 个 PCI 经实地核验。由 DEM 生成的地形网格与简化三维建筑模型以 PLY 格式发布，采用统一的 Blender 本地坐标系。无线地图由 Sionna RT 1.2.2 计算，与校准所用设置一致：最大深度 5，启用绕射与边缘绕射，地面材料为 itu_wet_ground，建筑材料为 itu_concrete。每个基站提供 512 x 512 m 的地图，名义网格为 1 m。联合最优服务小区地图覆盖 4000 x 3000 m，提供原始与校准后两个版本，每个栅格给出 RSRP、PCI、物理基站与扇区。9 条轨迹用于校准，3 条轨迹留作评估。在 2,380 个留出栅格上，校准后的联合地图 RMSE 为 12.06 dB，MAE 为 9.89 dB。Mendeley Data 记录采用 CC BY 4.0 许可，Zenodo 记录提供处理与应用代码。
pipeline:
  summary:
    en: Drive-test RSRP is aligned to a Blender scene, station parameters are fitted with Sionna RT on nine trajectories, and per-station and joint radio maps are exported and checked on three held-out trajectories.
    zh: 路测 RSRP 与 Blender 场景对齐，用 9 条轨迹通过 Sionna RT 拟合基站参数，导出逐站与联合无线地图，并在 3 条留出轨迹上检验。
  stages:
  - title:
      en: Drive tests and station verification
      zh: 路测与站点核验
    detail:
      en: An Android terminal running Cellular-Pro recorded 12 sessions on vehicle-accessible campus roads in 5G SA mode on the China Mobile n41 network. The 27 physical base stations and 79 PCIs were verified by field survey.
      zh: 使用运行 Cellular-Pro 的 Android 终端，在中国移动 n41 网络的 5G SA 模式下沿校园可通车道路完成 12 次路测。27 个物理基站与 79 个 PCI 经实地勘测核验。
    inputs:
    - en: Cellular-Pro radio logs
      zh: Cellular-Pro 无线日志
    - en: Field survey of base stations
      zh: 基站实地勘测
    outputs:
    - en: Raw CSV files (14,355 records)
      zh: 原始 CSV 文件（14,355 条记录）
    - en: Station and PCI reference
      zh: 基站与 PCI 参考表
  - title:
      en: Spatial alignment and scene build
      zh: 空间对齐与场景构建
    detail:
      en: WGS84 coordinates are projected to EPSG:3857 and then translated to a Blender-local origin. The receiver height is set to DEM plus 1.5 m. Each PCI and RSRP pair in the multi-cell lists becomes a separate observation.
      zh: WGS84 坐标先投影到 EPSG:3857，再平移至 Blender 本地原点。接收机高度取 DEM 加 1.5 m。多小区列表中的每组 PCI 与 RSRP 拆分为独立观测。
    inputs:
    - en: WGS84 measurements, DEM, 3D campus model
      zh: WGS84 测量、DEM、校园三维模型
    outputs:
    - en: Terrain and building PLY meshes, PCI-RSRP table
      zh: 地形与建筑 PLY 网格，PCI-RSRP 表
  - title:
      en: Station parameter calibration
      zh: 基站参数校准
    detail:
      en: Nine calibration trajectories fit the station parameters in Sionna RT 1.2.2. The search covers antenna height from 20 to 35 m above ground, a shared carrier power from 50 to 55 dBm, azimuth offset in 5 degree steps, and downtilt from -15 to +15 degrees. Height, azimuth and downtilt are frozen after calibration. The network power offset of 3.535361 dB is selected by leave-one-trajectory-out validation on the calibration trajectories.
      zh: 九条校准轨迹在 Sionna RT 1.2.2 中拟合基站参数。搜索范围包括相对地面 20 至 35 m 的天线高度、50 至 55 dBm 的共享载波功率、步长 5 度的方位偏移，以及 -15 至 +15 度的下倾角。校准稳定后，高度、方位与下倾角被固定。网络功率偏移 3.535361 dB 由校准轨迹上的留一轨迹验证选定。
    inputs:
    - en: Calibration trajectories (9)
      zh: 校准轨迹（9 条）
    outputs:
    - en: Calibrated station parameters
      zh: 校准后的基站参数
    controls:
    - en: Maximum depth 5; diffraction and edge diffraction on
      zh: 最大深度 5；启用绕射与边缘绕射
  - title:
      en: Radio-map generation and evaluation
      zh: 无线地图生成与评估
    detail:
      en: Per-station maps cover a 512 x 512 m window on a nominal 1 m grid. The joint best-server map covers 4000 x 3000 m, in raw and calibration-adjusted versions. Three held-out trajectories give 2,380 matched cells, with RMSE 12.06 dB and MAE 9.89 dB.
      zh: 逐站地图覆盖 512 x 512 m 窗口，名义网格为 1 m。联合最优服务小区地图覆盖 4000 x 3000 m，提供原始与校准后两个版本。三条留出轨迹给出 2,380 个匹配栅格，RMSE 为 12.06 dB，MAE 为 9.89 dB。
    outputs:
    - en: Per-station NPZ maps, joint maps, provenance masks, held-out tables
      zh: 逐站 NPZ 地图、联合地图、来源掩码与留出评估表
    checks:
    - en: Held-out trajectories are not used for fitting.
      zh: 留出轨迹不参与拟合。
technical_notes:
- en: 'Provenance codes: 0 is missing or invalid, 1 is the original Sionna RT value, 2 is a measurement-filled value, and 3 is the Sionna RT value after the calibration-only residual layer.'
  zh: 来源编码：0 表示缺失或无效，1 表示原始 Sionna RT 值，2 表示实测填充值，3 表示经校准残差层修正后的 Sionna RT 值。
