checked: '2026-11-06'
overview: {en: 'RF-Fingerprint-BT-IoT is a set of real-world Bluetooth IQ captures from 10 commercial emitters, 2 laptops and 8 commercial chips, recorded in indoor laboratory settings. The receiver was a National Instruments Ettus USRP X300 with a UBX160 daughterboard and a VERT2450 antenna, tuned to 2.414 GHz with a 2 MHz recorded bandwidth. Each capture contains 40 million complex samples in a binary .dat file of complex64 IQ values, with a .meta.json file that follows SigMF specifications with fingerprinting extensions. The data are split into two days: Day1BT (7.47 GB), a line-of-sight set with transmitter-receiver separations from 1.6 ft to 9.8 ft in 0.8 ft steps, and Day2BT (3 GB), a multipath set with emitters in the lab corners, the receiver at the centre and a maximum separation of 24.2 ft. The DataPort page recommends Day1BT for training and describes Day2BT as a harder test of generalization. The associated paper is ''Embedding-Assisted Attentional Deep Learning for Real-World
    RF Fingerprinting of Bluetooth'' (IEEE TCCN, 2023).', zh: RF-Fingerprint-BT-IoT 是来自 10 个商用发射端（2 台笔记本、8 个商用芯片）的真实蓝牙 IQ 采集数据，采集于室内实验室环境。接收机为 National Instruments Ettus USRP X300，配备 UBX160 子板与 VERT2450 天线，中心频率 2.414 GHz，录制带宽 2 MHz。每次采集包含 4000 万（40 MS）个复数采样，以二进制 .dat 文件保存 complex64 IQ 数值，并附带遵循 SigMF 规范并加入指纹扩展的 .meta.json 文件。数据分为两天：Day1BT（7.47 GB）为视距数据，收发距离从 1.6 ft 到 9.8 ft，步长 0.8 ft；Day2BT（3 GB）为多径数据，发射端位于实验室角落，接收机位于中心，最大距离 24.2 ft。DataPort 页面建议使用 Day1BT 训练，并将 Day2BT 描述为更困难的泛化测试。相关论文为《Embedding-Assisted Attentional Deep Learning for Real-World RF Fingerprinting of Bluetooth》（IEEE TCCN，2023）。}
signal_details:
- signal: iq
  text: {en: 'Complex64 IQ samples stored as binary .dat files, with 40 MS (40 million samples) per capture at a 2.414 GHz center frequency and 2 MHz recorded bandwidth, captured with a USRP X300 (UBX160 daughterboard, VERT2450 antenna). Each capture has a .meta.json metadata file.', zh: 以二进制 .dat 文件保存的 complex64 IQ 采样，每次采集 40 MS（4000 万个采样），中心频率 2.414 GHz，录制带宽 2 MHz，由 USRP X300（UBX160 子板，VERT2450 天线）采集。每次采集对应一个 .meta.json 元数据文件。}
pipeline:
  summary: {en: 'Ten Bluetooth emitters are captured with a USRP X300 receiver in an indoor laboratory, in a line-of-sight day and a multipath day, and archived as SigMF-style files.', zh: 在室内实验室中，使用 USRP X300 接收机对 10 个蓝牙发射端进行采集，分为视距与多径两天，并以 SigMF 风格文件归档。}
  stages:
  - title: {en: Place emitters and set geometry, zh: 放置发射端并设定几何布局}
    detail: {en: 'Ten commercial Bluetooth emitters (2 laptops, 8 chips) are placed in an indoor laboratory. In Day1BT, the transmitter-receiver separation runs from 1.6 ft to 9.8 ft in 0.8 ft steps in a line-of-sight setup. In Day2BT, each emitter sits in a corner of the laboratory, the receiver stands at the centre, and the maximum separation is 24.2 ft, giving a multipath scattering scenario.', zh: 十个商用蓝牙发射端（2 台笔记本、8 个商用芯片）被放置于室内实验室。Day1BT 为视距设置，收发距离从 1.6 ft 到 9.8 ft，步长 0.8 ft。Day2BT 中每个发射端位于实验室角落，接收机位于中心，最大距离为 24.2 ft，形成多径散射场景。}
    inputs:
    - {en: '10 commercial Bluetooth emitters (2 laptops, 8 chips)', zh: 10 个商用蓝牙发射端（2 台笔记本、8 个芯片）}
    outputs:
    - {en: Line-of-sight and multipath capture layouts, zh: 视距与多径采集布局}
  - title: {en: Capture IQ with USRP X300, zh: 使用 USRP X300 采集 IQ}
    detail: {en: An Ettus USRP X300 with a UBX160 daughterboard and a VERT2450 antenna records at 2.414 GHz center frequency and 2 MHz recorded bandwidth. Each capture holds 40 million complex samples., zh: 配备 UBX160 子板与 VERT2450 天线的 Ettus USRP X300 以 2.414 GHz 中心频率、2 MHz 录制带宽进行采集。每次采集包含 4000 万个复数采样。}
    inputs:
    - {en: Bluetooth transmissions from each emitter, zh: 各发射端的蓝牙发射信号}
    outputs:
    - {en: Complex IQ captures, zh: 复数 IQ 采集}
  - title: {en: Write capture and metadata files, zh: 写入采集与元数据文件}
    detail: {en: 'Each capture is stored as a binary .dat file of complex64 IQ samples and a .meta.json file that follows SigMF specifications, extended for fingerprinting.', zh: 每次采集保存为 complex64 IQ 采样的二进制 .dat 文件，以及遵循 SigMF 规范并扩展用于指纹识别的 .meta.json 文件。}
    inputs:
    - {en: IQ samples and capture metadata, zh: IQ 采样与采集元数据}
    outputs:
    - {en: Paired .dat and .meta.json files, zh: 成对的 .dat 与 .meta.json 文件}
  - title: {en: Archive by recording day, zh: 按录制日归档}
    detail: {en: 'The captures are distributed as Day1BT.tar.gz (7.47 GB, line-of-sight) and Day2BT.tar.gz (3 GB, multipath) on IEEE DataPort.', zh: 采集文件以 Day1BT.tar.gz（7.47 GB，视距）与 Day2BT.tar.gz（3 GB，多径）两个压缩包的形式在 IEEE DataPort 发布。}
    inputs:
    - {en: Paired capture files, zh: 成对的采集文件}
    outputs:
    - {en: Two daily tar.gz archives, zh: 两个按日归档的 tar.gz 文件}
facts:
- label: {en: Train and test split, zh: 训练与测试划分}
  text: {en: 'The authors suggest training on Day1BT and testing generalization on Day2BT. The two days were recorded in different time frames, locations and testbed setups.', zh: 作者建议使用 Day1BT 训练，并使用 Day2BT 检验泛化能力。两天的数据分别在不同时间段、不同地点、不同测试平台上采集。}
- label: {en: File pairs, zh: 文件配对}
  text: {en: Each capture consists of a binary .dat file with complex64 IQ samples and an associated .meta.json metadata file., zh: 每次采集包含一个 complex64 IQ 采样的二进制 .dat 文件，以及对应的 .meta.json 元数据文件。}
- label: {en: Distance metadata, zh: 距离元数据}
  text: {en: 'For Day1BT, the transmitter-receiver separation of each capture is given in that capture''s JSON metadata file.', zh: 对于 Day1BT，每次采集的收发距离记录在该次采集的 JSON 元数据文件中。}
