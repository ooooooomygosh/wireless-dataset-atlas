summary: {en: 'This generator is an ns-3 module for 5G mmWave cellular network simulation with 3GPP TR 38.901-based channel models, and it outputs simulated network-level metrics.', zh: 该生成器是用于 5G mmWave 蜂窝网络仿真的 ns-3 模块，采用基于 3GPP TR 38.901 的信道模型，输出仿真得到的网络级指标。}
sources: ['https://github.com/nyuwireless-unipd/ns3-mmwave', 'https://raw.githubusercontent.com/nyuwireless-unipd/ns3-mmwave/master/README.md', 'https://arxiv.org/abs/1705.02882', 'https://arxiv.org/pdf/1705.02882', 'https://raw.githubusercontent.com/nyuwireless-unipd/ns3-mmwave/master/LICENSE', 'https://github.com/nyuwireless-unipd/ns3-mmwave/releases', 'https://github.com/nyuwireless-unipd/ns3-mmwave/releases?page=2', 'https://github.com/nyuwireless-unipd/ns3-mmwave/tags', 'https://github.com/nyuwireless-unipd/ns3-mmwave/tags?after=v1.2', 'https://github.com/nyuwireless-unipd/ns3-mmwave/commits/master', 'https://arxiv.org/html/1705.02882v3']
checked: '2026-11-06'
overview: {en: 'ns-3 mmWave is an open-source module for the ns-3 network simulator that models 5G mmWave cellular networks. The GitHub repository and the paper End-to-End Simulation of 5G mmWave Networks by Mezzavilla et al. (arXiv:1705.02882, first submitted in May 2017 and last revised in February 2018) describe the module. It is built on the ns-3 LTE (LENA) module: it reuses LENA''s EPC and RRC layers and inherits its RLC layer, with a modified acknowledged-mode retransmission entity and optional active queue management, and it adds custom mmWave PHY and MAC layers. The paper describes LTE and mmWave dual connectivity, which the README places on the new-handover branch. The module is released under GPL-2.0. Its outputs are simulated network KPIs such as PHY throughput, IP-layer latency, fairness index and utilization, so the records are simulation results rather than measurements.', zh: 'ns-3 mmWave 是 ns-3 网络仿真器的一个开源模块，用于仿真 5G mmWave 蜂窝网络。GitHub 仓库以及 Mezzavilla 等人的论文 End-to-End Simulation
    of 5G mmWave Networks（arXiv:1705.02882，2017 年 5 月首次提交，2018 年 2 月最后修订）对该模块作了说明。该模块基于 ns-3 LTE（LENA）模块：复用 LENA 的 EPC 与 RRC 层，继承其 RLC 层并修改了确认模式的重传实体，同时可选启用主动队列管理，另外新增自定义的 mmWave PHY 与 MAC 层。论文描述了 LTE 与 mmWave 双连接，README 将该功能列在 new-handover 分支中。模块以 GPL-2.0 许可发布。输出为仿真得到的网络 KPI，如 PHY 吞吐量、IP 层时延、公平性指数和利用率，因此记录为仿真结果而非实测数据。'}
signal_details:
- signal: kpi
  text: {en: 'Simulated network KPIs from the paper''s multi-user examples: downlink PHY throughput in Mbit/s (cell, mean UE, 5% worst UE and max UE), IP-layer latency in ms, and Jain''s fairness index and utilization (received IP-layer rate over allocated PHY rate) for the RR, PF, MR and EDF schedulers. The two cases are 70 UEs at 10 Mbps each and 7 UEs at 100 Mbps each, with 10 drops per case.', zh: 论文多用户示例中仿真得到的网络 KPI：下行 PHY 吞吐量（单位 Mbit/s，包括小区、平均 UE、最差 5% UE 和最大 UE）、IP 层时延（单位 ms），以及 RR、PF、MR、EDF 调度器的 Jain 公平性指数和利用率（接收的 IP 层速率与分配的 PHY 速率之比）。两组场景分别为 70 个 UE 每个 10 Mbps，以及 7 个 UE 每个 100 Mbps，每组运行 10 次 drop。}
pipeline:
  summary: {en: 'The module runs inside ns-3: the user builds ns-3 with the mmWave module, selects a channel model and a scheduler, and the simulation reports PHY throughput, IP-layer latency, fairness index and utilization.', zh: 该模块在 ns-3 内运行：用户编译包含 mmWave 模块的 ns-3，选择信道模型与调度器，仿真输出 PHY 吞吐量、IP 层时延、公平性指数和利用率。}
  stages:
  - title: {en: Build ns-3 with the mmWave module, zh: 编译包含 mmWave 模块的 ns-3}
    detail: {en: 'The README builds the module with ./waf configure --enable-examples followed by ./waf. The paper cites ns-3 version 3.27 as the base platform, with the LTE LENA module underneath.', zh: README 通过 ./waf configure --enable-examples 随后执行 ./waf 完成编译。论文引用 ns-3 3.27 版本作为基础平台，底层为 LTE LENA 模块。}
    inputs:
    - {en: ns-3 source with mmWave module, zh: 包含 mmWave 模块的 ns-3 源码}
    outputs:
    - {en: built ns-3 executables, zh: 编译后的 ns-3 可执行程序}
  - title: {en: Select the channel model, zh: 选择信道模型}
    detail: {en: 'The paper lists a 3GPP statistical model for 6 to 100 GHz with spatial consistency, blockage (model A) and outdoor-to-indoor loss, using up to 20 clusters of 20 rays each. Other inputs are QuaDRiGa at 10, 28, 43, 60 and 82 GHz, ray-tracing or measurement traces giving loss, delay, angle of arrival and angle of departure per path, and the NYU statistical model at 28 and 73 GHz.', zh: 论文列出 3GPP 统计信道模型，适用于 6 至 100 GHz，支持空间一致性、遮挡（model A）和室外到室内损耗，最多 20 个簇、每簇 20 条射线。其他可选输入包括 10、28、43、60 和 82 GHz 的 QuaDRiGa，逐路径给出损耗、时延、到达角与离开角的光线追踪或测量 trace，以及 28 与 73 GHz 的 NYU 统计模型。}
    inputs:
    - {en: scenario and channel model parameters, zh: 场景与信道模型参数}
    - {en: optional ray-tracing or measurement path traces, zh: 可选的光线追踪或测量路径 trace}
    outputs:
    - {en: 'channel for each link, updated over time', zh: 各链路随时间更新的信道}
  - title: {en: 'Simulate PHY, MAC and scheduling', zh: 仿真 PHY、MAC 与调度}
    detail: {en: 'Default numerology: 1 ms frame with 10 subframes of 100 µs, 24 symbols of 4.16 µs per subframe, and 1 GHz bandwidth in 72 subbands of 13.89 MHz. Four variable-TTI TDMA schedulers are available (Round Robin, Proportional Fair, Earliest Deadline First and Maximum Rate), with 20 HARQ processes and up to 3 HARQ attempts per transport block.', zh: 默认参数：1 ms 帧，每帧 10 个子帧，每子帧 100 µs，含 24 个符号（每符号约 4.16 µs），带宽 1 GHz，分为 72 个子带，每子带 13.89 MHz。提供四种可变 TTI 的 TDMA 调度器（Round Robin、Proportional Fair、Earliest Deadline First 与 Maximum Rate），HARQ 进程数为 20，每个传输块最多 3 次传输尝试。}
    inputs:
    - {en: UE traffic and channel for each link, zh: UE 业务与各链路信道}
    outputs:
    - {en: 'per-UE throughput, latency and fairness', zh: 各 UE 的吞吐量、时延与公平性}
  - title: {en: Collect the KPIs, zh: 收集 KPI}
    detail: {en: 'The paper''s multi-user examples report the KPIs in its Tables II to IV. The README''s example ./waf --run simple-global-routing is a generic ns-3 example, not part of the mmWave module; it writes a simple-global-routing.tr text trace and pcap files readable with tcpdump.', zh: 论文的多用户示例在表 II 至表 IV 中给出 KPI。README 中的示例 ./waf --run simple-global-routing 属于通用 ns-3 示例，不属于 mmWave 模块；它生成 simple-global-routing.tr 文本 trace 以及可用 tcpdump 读取的 pcap 文件。}
    inputs:
    - {en: 'simulation run with the chosen channel model, scheduler and traffic', zh: 使用所选信道模型、调度器与业务的仿真运行}
    outputs:
    - {en: 'PHY throughput, IP-layer latency, fairness index and utilization', zh: PHY 吞吐量、IP 层时延、公平性指数与利用率}
bandwidth_mhz: 1000
organization: NYU WIRELESS, NYU Tandon School of Engineering; University of Padova
facts:
- label: {en: Trace input format, zh: trace 输入格式}
  text: {en: 'Ray-tracing and measurement traces must contain the number of paths and, for each path, the propagation loss, delay, angle of arrival and angle of departure.', zh: 光线追踪与测量 trace 须包含路径数量，以及每条路径的传播损耗、时延、到达角与离开角。}
- label: {en: Frequency coverage, zh: 频率覆盖范围}
  text: {en: 'The 3GPP model covers 6 to 100 GHz, QuaDRiGa is listed for 10, 28, 43, 60 and 82 GHz, and the NYU statistical model is available only at 28 and 73 GHz.', zh: 3GPP 模型覆盖 6 至 100 GHz，QuaDRiGa 列出的频点为 10、28、43、60 和 82 GHz，NYU 统计模型仅适用于 28 和 73 GHz。}
- label: {en: Example mobility, zh: 示例中的移动性}
  text: {en: 'In the multi-user examples, UEs are at similar distances from the eNB and move at a constant 25 m/s, typical of vehicular users.', zh: 多用户示例中，各 UE 与 eNB 的距离相近，并以恒定 25 m/s 的速度移动，该速度为典型车辆用户速度。}
technical_notes:
- {en: The README places the LTE and mmWave integration and the dual connectivity features on the new-handover branch of the repository., zh: README 将 LTE 与 mmWave 的集成及双连接功能置于仓库的 new-handover 分支中。}
- {en: 'The mmWave frame structure is shorter than the LTE one, so the RLC acknowledged-mode retransmission timers are modified to match it.', zh: mmWave 帧结构比 LTE 短，因此 RLC 确认模式的重传定时器经过修改以与之匹配。}
limitations:
- {en: Ray-tracing and measurement traces constrain the simulation to the routes for which they were generated., zh: 光线追踪与测量 trace 将仿真限定在生成这些 trace 的路线上。}
- {en: 'Only TDMA operation is supported at present, so UE data are not assigned to individual subbands as they would be in OFDMA.', zh: 目前仅支持 TDMA 操作，因此 UE 数据不能像 OFDMA 那样分配到各个子带。}
- {en: 'The Maximum Rate scheduler gives very poor fairness when users have mixed rates, and the paper describes it as mainly useful for testing system capacity.', zh: 用户速率差异较大时，Maximum Rate 调度器的公平性很差，论文称其主要用于测试系统容量。}
