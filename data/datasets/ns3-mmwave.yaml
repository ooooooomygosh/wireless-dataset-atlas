versions:
- version: v8.0
  date: '2024-06-26'
  summary: {en: 'Moves the baseline to ns-3.42, which brings the 3GPP TR 38.811 non-terrestrial network channel model, and includes bug fixes and memory optimizations.', zh: 将基线升级至 ns-3.42，引入 3GPP TR 38.811 非地面网络信道模型，并包含缺陷修复与内存优化。}
  url: https://github.com/nyuwireless-unipd/ns3-mmwave/releases
- version: v7.0
  date: '2023-03-21'
  summary: {en: 'Moves the baseline to ns-3.38, which includes the spectrum module optimizations from the GSoC 2022 project, and fixes a few memory leaks.', zh: 将基线升级至 ns-3.38，包含 GSoC 2022 项目带来的频谱模块优化，并修复若干内存泄漏。}
- version: v6.1
  date: '2022-10-21'
  summary: {en: 'Minor release that restores multi-user support in MmWaveSpectrumPhy, corrects its FDD/TDD error message, removes a hard-coded -Werror flag, and makes the NR error model the default.', zh: 小版本，恢复 MmWaveSpectrumPhy 的多用户支持，修正其 FDD/TDD 错误信息，移除硬编码的 -Werror 编译选项，并将 NR 误差模型设为默认。}
- version: v6.0
  date: '2022-09-23'
  summary: {en: 'Moves the baseline to ns-3.36.1 with a CMake build system in place of Waf, widens the NR frame number to uint32_t, and assumes 12 OFDM symbols for transport block error estimation in CQI determination.', zh: 将基线升级至 ns-3.36.1，以 CMake 构建系统替代 Waf，将 NR 帧号扩展为 uint32_t，并在 CQI 确定中采用 12 个 OFDM 符号估计传输块误码率。}
- version: v5.0
  date: '2022-05-02'
  summary: {en: Moves the baseline to ns-3.35 and updates the antenna and beamforming models., zh: 将基线升级至 ns-3.35，并更新天线与波束成形模型。}
- version: '4.0'
  date: '2021-06-01'
  summary: {en: 'Adds NR-compliant error models adapted from 5G-LENA 1.0, support for an external energy-consumption module for mmWave devices, and moves the code to ns-3.33.', zh: 新增改编自 5G-LENA 1.0 的 NR 兼容误差模型，支持用于 mmWave 设备的外部能耗分析模块，并将代码迁移至 ns-3.33。}
- version: v3.0
  date: '2020-09-15'
  summary: {en: 'Updates the PHY and MAC layers to the 3GPP NR frame structure and numerology, adds a 3GPP TR 38.901 channel model and ray-tracing or measurement trace input, adds SVD- and DFT-based beamforming, and moves the other modules to ns-3.31.', zh: 将 PHY 与 MAC 层更新为 3GPP NR 帧结构与参数集，新增 3GPP TR 38.901 信道模型以及光线追踪或测量 trace 输入，新增基于 SVD 与 DFT 的波束成形，并将其他模块更新至 ns-3.31。}
- version: V2.0
  date: '2018-09-07'
  summary: {en: Updates the module to ns-3.29 and adds carrier aggregation and multi-sector antennas., zh: 将模块更新至 ns-3.29，并新增载波聚合与多扇区天线。}
- version: v1.2
  date: '2017-10-05'
  summary: {en: Updates the new-handover branch to ns-3.27 and adds a dual-connectivity example., zh: 将 new-handover 分支更新至 ns-3.27，并新增双连接示例。}
- version: mmWave-dc-3.27
  date: '2017-10-05'
  summary: {en: 'Release of the new-handover branch with LTE/mmWave dual connectivity, updated to ns-3.27.', zh: 发布带有 LTE/mmWave 双连接功能的 new-handover 分支，并更新至 ns-3.27。}
- version: v1.1
  date: '2017-02-13'
  summary: {en: 'Adds the 3GPP channel model for 6 to 100 GHz with spatial consistency and blockage options, a MIMO beamforming architecture with two computation methods, and an example script.', zh: 新增 6 至 100 GHz 的 3GPP 信道模型，包含空间一致性与遮挡选项，新增含两种计算方法的 MIMO 波束成形架构，并附示例脚本。}
- version: v1.0
  date: '2017-02-13'
  summary: {en: 'Tag only, with no release page; the tagged commit is titled ''Reduce simulation time''.', zh: 仅有标签，没有发布页面；标签对应的提交标题为 'Reduce simulation time'。}
