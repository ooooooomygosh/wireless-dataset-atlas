summary: {en: 'S21 channel measurements from a vector network analyzer over 5.225–5.875 GHz with 201 frequency points, for a UAV-mounted RIS in indoor flight experiments, together with EKF-based UAV and RIS state estimates and RIS configurations. The dataset has three scenarios with six flights each, stored as 10 s files at 50 Hz.', zh: 矢量网络分析仪在 5.225–5.875 GHz 范围内测得的 S21 信道测量数据（201 个频点），对象为室内飞行实验中搭载 RIS 的无人机，并附带基于 EKF 的无人机与 RIS 状态估计以及 RIS 配置。数据包含三个场景，每个场景六次飞行，以 50 Hz 采样的 10 秒文件存储。}
