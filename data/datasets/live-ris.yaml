summary: {en: 'S21 channel measurements from a vector network analyzer over 5.225–5.875 GHz with 201 frequency points, for a UAV-mounted RIS in indoor flight experiments, together with EKF-based UAV and RIS state estimates and RIS configurations. The dataset has three scenarios with six flights each, stored as 10 s files at 50 Hz.', zh: 矢量网络分析仪在 5.225–5.875 GHz 范围内测得的 S21 信道测量数据（201 个频点），对象为室内飞行实验中搭载 RIS 的无人机，并附带基于 EKF 的无人机与 RIS 状态估计以及 RIS 配置。数据包含三个场景，每个场景六次飞行，以 50 Hz 采样的 10 秒文件存储。}
sources: ['https://zenodo.org/records/23011126', 'https://github.com/DavidMller/risdataset', 'https://arxiv.org/abs/2609.34993', 'https://arxiv.org/html/2609.34993v1', 'https://zenodo.org/api/records/23011126', 'https://api.github.com/repos/DavidMller/risdataset', 'https://api.github.com/repos/DavidMller/risdataset/git/trees/HEAD?recursive=1', 'https://raw.githubusercontent.com/DavidMller/risdataset/main/README.md', 'https://raw.githubusercontent.com/DavidMller/risdataset/main/Scenario_i/a_DynamicRIS/Flight1/Scenario_i_DynamicRIS_VNA_Magnitudes_Flight1.csv', 'https://raw.githubusercontent.com/DavidMller/risdataset/main/Scenario_i/a_DynamicRIS/Flight1/Scenario_i_DynamicRIS_EKF_Config_Flight1.csv', 'https://raw.githubusercontent.com/DavidMller/risdataset/main/Scenario_i/a_DynamicRIS/Flight1/Scenario_i_DynamicRIS_EKF_UAVPose_Flight1.csv', 'https://raw.githubusercontent.com/DavidMller/risdataset/main/Scenario_i/a_DynamicRIS/Flight1/Scenario_i_DynamicRIS_MCS_UAVPose_Flight1.csv', 'https://zenodo.org/api/records/23011126/versions',
  'https://github.com/DavidMller/risdataset/releases', 'https://github.com/DavidMller/risdataset/commits/main']
checked: '2026-11-06'
pipeline:
  summary: {en: 'Pose estimates drive the RIS configurations. The RIS switches at 50 Hz while the VNA records S21, and each flight is synchronized by alternating RIS phases at its start and end. A 61-71 ns time gate isolates the RIS-reflected component, and per-flight CSV files are released by scenario and configuration.', zh: 位姿估计驱动 RIS 配置。RIS 以 50 Hz 切换，VNA 同步记录 S21；每次飞行利用起始与结束阶段交替切换的 RIS 相位完成同步。61–71 ns 时间门用于分离 RIS 反射分量，随后按场景与配置发布逐飞行 CSV 文件。}
  stages:
  - title: {en: 'Deploy Tx, Rx and the flying RIS', zh: 布置 Tx、Rx 与飞行中的 RIS}
    detail: {en: 'Transmit and receive horns and the UAV-mounted RIS are set up in three deployment geometries. The RIS design frequency is 5.385 GHz, and the VNA sweeps 201 frequency points from 5.225 to 5.875 GHz.', zh: 在三种部署几何下布置发射喇叭、接收喇叭与 UAV 搭载的 RIS。RIS 设计频率为 5.385 GHz，VNA 在 5.225–5.875 GHz 内扫描 201 个频点。}
    inputs:
    - {en: Indoor single-Tx/Rx link, zh: 室内单 Tx/Rx 链路}
    - {en: 'UAV and a 10×12, 120-element, 1-bit RIS', zh: UAV 与 10×12、120 元 1-bit RIS}
    outputs:
    - {en: Deployment geometry and system settings, zh: 部署几何与系统设置}
    - {en: Controllable RIS surface, zh: 可控 RIS 阵面}
    controls:
    - {en: 'Each flight corresponds to one pair of VNA ports, and the three scenarios are organized independently.', zh: 每次飞行对应一对 VNA 端口，三个场景相互独立组织。}
    checks:
    - {en: 'Reproduction check: verify horn and RIS positions, orientations and element order in the state encoding.', zh: 复现检查：核对喇叭与 RIS 的位置、朝向以及状态编码中的单元顺序。}
  - title: {en: Estimate pose and generate RIS configurations, zh: 估计位姿并生成 RIS 配置}
    detail: {en: EKF state estimates provide the control poses from which RIS configurations are calculated. Motion capture provides the ground-truth position and attitude for comparison., zh: 由 EKF 状态估计给出控制位姿，并据此计算 RIS 配置。动作捕捉提供位置与姿态真值用于对比。}
    inputs:
    - {en: UAV sensing and state estimation, zh: UAV 传感与状态估计}
    - {en: Target Tx/Rx geometry, zh: 目标 Tx/Rx 几何}
    - {en: Motion-capture ground truth, zh: 动作捕捉真值}
    outputs:
    - {en: Estimated and ground-truth poses, zh: 估计位姿与真值位姿}
    - {en: Optimized binary RIS configurations, zh: 优化后的二进制 RIS 配置}
    controls:
    - {en: The release stores EKF estimates and motion-capture ground truth in separate files., zh: 发布数据将 EKF 估计与动作捕捉真值分别存放于不同文件。}
    checks:
    - {en: 'Reproduction check: verify pose coordinate transforms, angular units (radians) and 120 valid bits per configuration.', zh: 复现检查：核对位姿坐标变换、角度单位（弧度）以及每次配置的 120 个有效比特。}
  - title: {en: Align RIS switching and VNA measurements, zh: 对齐 RIS 切换与 VNA 测量}
    detail: {en: Configurations and EKF timestamps are logged on the Raspberry Pi at 50 Hz. The VNA is synchronized through the alternating RIS phases at the start and end of each flight. Each flight CSV contains 500 rows covering 10 s., zh: 配置与 EKF 时间戳在树莓派上以 50 Hz 记录。VNA 通过每次飞行开始与结束时交替切换的 RIS 相位实现同步。每个飞行 CSV 含 10 s、500 行。}
    inputs:
    - {en: RIS configuration sequence, zh: RIS 配置序列}
    - {en: VNA frequency sweep, zh: VNA 频率扫描}
    - {en: Flight-pose timestamps, zh: 飞行位姿时间戳}
    outputs:
    - {en: Per-timestep associations between configurations and S21, zh: 逐时刻配置与 S21 的关联}
    - {en: Flight time series, zh: 飞行时间序列}
    controls:
    - {en: Each released 10 s segment is the middle part of a 40 s flight. The 5 s takeoff and landing periods and the alternating-phase intervals at the start and end of the flight are excluded., zh: 每个发布的 10 s 片段取自 40 s 飞行的中段。起降各 5 s 以及飞行首尾用于交替相位同步的区间均被排除。}
    checks:
    - {en: 'Reproduction check: inspect offsets between configuration activation and measurement times, and record any duplicated or missing rows.', zh: 复现检查：检查配置生效时刻与测量时刻之间的偏差，并记录重复或缺失的行。}
  - title: {en: Extract RIS-related responses with a time gate, zh: 用时间门提取 RIS 相关响应}
    detail: {en: 'The VNA applies a 61–71 ns time gate to suppress other reflections and extract the RIS-reflected contribution. The released field is S21 magnitude in dB, so the gate position and width determine the physical meaning of the power value.', zh: VNA 施加 61–71 ns 时间门以抑制其他反射，提取 RIS 反射分量。发布字段为 S21 幅度（dB），因此门的位置与宽度决定功率数值的物理含义。}
    inputs:
    - {en: VNA transmission responses, zh: VNA 传输响应}
    - {en: 61–71 ns time gate, zh: 61–71 ns 时间门}
    outputs:
    - {en: Time-gated S21 magnitude, zh: 时间门处理后的 S21 幅值}
    controls:
    - {en: The public CSV field is S21 magnitude. Distinguish the hardware's complex-response capability from the fields actually released., zh: 公开 CSV 字段为 S21 幅值。需区分硬件的复频响能力与实际发布的字段。}
    checks:
    - {en: 'Reproduction check: assess the effect of gate width and position on power results, and keep these processing conditions when raw frequency sweeps are unavailable.', zh: 复现检查：评估门宽与门位置对功率结果的影响；若原始频率扫描不可得，保留这些处理条件。}
  - title: {en: Release data by flight and evaluate control performance, zh: 按飞行发布数据并评估控制效果}
    detail: {en: 'The official CSV files are organized by scenario, RIS configuration and flight. For reproduction, group whole flights first, then compare configuration policies, state-estimation errors and measured received power.', zh: 官方 CSV 按场景、RIS 配置与飞行组织。复现时先以完整飞行分组，再比较配置策略、状态估计误差与实测接收功率。}
    inputs:
    - {en: 'Time, pose, RIS bits and S21', zh: 时间、位姿、RIS 比特与 S21}
    - {en: 'Scenario, configuration and flight directories', zh: 场景、配置与飞行目录}
    outputs:
    - {en: Per-flight CSV files, zh: 逐飞行 CSV 文件}
    - {en: 'Position and attitude, configuration and S21 labels', zh: 位置与姿态、配置与 S21 标签}
    controls:
    - {en: 'Windows from the same flight share states and hardware conditions, so keep them in one group.', zh: 同一飞行的各窗口共享状态与硬件条件，因此应整体分组。}
    checks:
    - {en: 'Reproduction check: verify the expected 500 rows, field units and configuration switches. Evaluation must not use the target S21 from the same instant as a decision input.', zh: 复现检查：核对预期的 500 行、字段单位与配置切换。评估时不得将同一时刻的目标 S21 用作决策输入。}
  scope: {en: 'Official public CSV fields and paper Sec. III–V: an indoor single-link experiment with a UAV carrying a 120-element, 1-bit RIS.', zh: 官方公开 CSV 字段与论文第 III–V 节：UAV 搭载 120 元 1-bit RIS 的室内单链路实验。}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: 'CSV files organized by scenario, configuration and flight, containing time, estimated and ground-truth pose, RIS bits and S21 magnitude.', zh: 按场景、配置与飞行组织的 CSV 文件，包含时间、估计与真值位姿、RIS 比特与 S21 幅度。}
- label: {en: Derived outputs, zh: 派生输出}
  text: {en: 'Received-power comparisons between dynamic, static and off RIS configurations, as reported in the paper.', zh: 论文报告的动态、静态与关闭 RIS 配置之间的接收功率比较。}
- label: {en: Time column, zh: 时间列}
  text: {en: 'The README describes the timestamp as UNIX time in nanoseconds, but the CSV headers read ''time [s]''. The sample flight (Scenario_i, dynamic, Flight1) starts at 126.343 s. In the sample flight, the EKF, VNA and motion-capture files start at the same time value.', zh: 'README 将时间戳描述为纳秒 UNIX 时间，但 CSV 表头为 ''time [s]''。样例飞行（Scenario_i，动态，Flight1）从 126.343 s 开始。样例飞行中，EKF、VNA 与动作捕捉文件从同一时间值开始。'}
provenance:
- {en: Indoor flight of a UAV-mounted RIS → EKF state estimates/ground truth, zh: 室内飞行UAV-mounted RIS → EKF状态估计/ground truth}
- {en: Optimized configurations → 1-bit RIS switching, zh: 优化配置 → 1-bit RIS切换}
- {en: 'VNA + directional horns and time gating → synchronized S21 magnitude, pose, and RIS-configuration records in the public CSV files', zh: VNA+方向喇叭与time-gating → 公开CSV中的S21幅值、位姿与RIS配置同步记录}
technical_notes:
- {en: The VNA uses a 61–71 ns time gate to suppress non-RIS reflections., zh: VNA 采用 61–71 ns 时间门以抑制非 RIS 反射。}
- {en: 'Measurements and RIS switching are aligned at 50 Hz. S21 is measured between two horn ports, so the release has one magnitude channel per time step rather than array CSI.', zh: 测量与 RIS 切换以 50 Hz 对齐。S21 在两个喇叭端口之间测得，因此发布数据每个时间步只有一个幅度通道，而非阵列 CSI。}
limitations:
- {en: 'The time gate isolates the RIS-reflected contribution, so the released magnitude is not the total received power.', zh: 时间门只提取 RIS 反射分量，因此发布的幅度并非总接收功率。}
- {en: 'Each scenario has three configuration methods (dynamic, static, off) with two flights each, so the released configurations are limited to these policies.', zh: 每个场景包含动态、静态与关闭三种配置方法，各两次飞行，因此发布的配置仅限于这三种策略。}
- {en: 'The README limits use to non-commercial research and educational purposes, while the Zenodo record lists CC BY 4.0, which permits commercial use.', zh: README 将使用范围限定为非商业科研与教育用途，而 Zenodo 记录标注为 CC BY 4.0，该许可允许商业使用。}
history:
- {en: '2026-09-28: Dataset v1.0 released on Zenodo; arXiv:2609.34993 posted.', zh: '2026-09-28：Zenodo 数据集 v1.0 发布，arXiv:2609.34993 上线。'}
- {en: '2026-09-29: Last push to the GitHub repository.', zh: 2026-09-29：GitHub 仓库最后一次推送。}
usage:
- {en: 'Align EKF estimates, ground truth, RIS configurations and S21 on the time column of each flight.', zh: 按各飞行的时间列，将 EKF 估计、真值、RIS 配置与 S21 对齐。}
- {en: 'The dataset covers only the recorded RIS vectors from the dynamic, static and off configurations.', zh: 数据集仅包含动态、静态与关闭三种配置下记录的 RIS 向量。}
- {en: The repository's ExampleEvaluation.py and ExampleEvaluation.m demonstrate loading and plotting the data., zh: 仓库中的 ExampleEvaluation.py 与 ExampleEvaluation.m 演示了数据读取与绘图。}
field_notes:
- label: {en: CSI, zh: CSI}
  text: {en: 'The README field table lists only S21 magnitude (dB), and the VNA CSV checked has one magnitude column. The paper describes amplitude and phase response, but no phase or complex column is released.', zh: README 字段表仅列出 S21 幅度（dB），所检查的 VNA CSV 只有一列幅度。论文描述了幅度与相位响应，但未发布相位或复数列。}
- label: {en: Beam labels, zh: 波束标签}
  text: {en: RIS configurations are provided directly as 120-bit binary vectors per time step. They are not communication beam-sweep labels., zh: RIS 配置以每个时间步 120 位二进制向量的形式直接给出，并非通信波束扫描标签。}
- label: {en: RGB, zh: RGB}
  text: {en: 'Motion-capture cameras provide position and attitude ground truth. The released CSV files contain processed poses, not camera video or image observation sequences.', zh: 动作捕捉相机用于位置与姿态真值；发布的 CSV 包含处理后的位姿，没有相机视频或图像观测序列。}
- label: {en: Multi-BS, zh: 多基站}
  text: {en: 'Three scenarios change the deployment geometry of a single Tx/Rx/RIS. Each flight still uses one pair of VNA ports, not a simultaneous multi-BS network.', zh: 3 个场景改变单个 Tx/Rx/RIS 的部署几何；同一次飞行仍为单对 VNA 端口，不是同时多基站网络。}
overview: {en: 'LIVE-RIS is an indoor in-flight channel measurement dataset for a reconfigurable intelligent surface (RIS) mounted under a UAV. David Müller, Kevin Weinberger, Aydin Sezgin and Martin Mönnigmann (Ruhr University Bochum) describe it in arXiv:2609.34993, and it is released on Zenodo (record 23011126, version 1.0, CC BY 4.0). A Keysight P5026B vector network analyzer with the S9010B time-gating option measured S21 between two directional horn antennas over 5.225–5.875 GHz at 201 frequency points, while a 120-element, 1-bit RIS (10 × 12 elements, design frequency 5.385 GHz) flew on a Holybro X500 quadcopter. The dataset has three scenarios, and each scenario contains dynamic, static and off RIS configurations with two flights per configuration, 18 flights in total. Ten Vicon Vantage V5 cameras provide motion capture, which replaces GNSS in the flight controller EKF for UAV pose estimation. The released CSV files cover 10 s segments sampled at 50 Hz (500 time steps each) and include
    the RIS configuration vectors and the S21 magnitude in dB. The setup has one Tx horn and one Rx horn per flight.', zh: 'LIVE-RIS 是一个室内飞行信道测量数据集，测量对象为安装在无人机下方的可重构智能表面（RIS）。作者为 David Müller、Kevin Weinberger、Aydin Sezgin 与 Martin Mönnigmann（Ruhr University Bochum），论文为 arXiv:2609.34993，数据发布于 Zenodo（记录号 23011126，版本 1.0，CC BY 4.0）。Keysight P5026B 矢量网络分析仪配合 S9010B 时间门控选项，在 5.225–5.875 GHz 范围内以 201 个频点测量两个定向喇叭天线之间的 S21；同时，一块 120 单元、1-bit 的 RIS（10 × 12 单元，设计频率 5.385 GHz）搭载在 Holybro X500 四旋翼无人机上飞行。数据集包含三个场景，每个场景含动态、静态与关闭三种 RIS 配置，每种配置两次飞行，共 18 次飞行。十台 Vicon Vantage V5 相机提供动作捕捉，在飞控 EKF 中替代 GNSS 用于无人机位姿估计。发布的 CSV 文件覆盖 10 s 片段，采样率 50 Hz（每个文件 500 个时间步），包含 RIS 配置向量与以 dB 计的 S21 幅度。每次飞行使用一个发射喇叭与一个接收喇叭。'}
signal_details:
- signal: csi
  text: {en: 'S21 is measured with the VNA over 5.225–5.875 GHz (650 MHz span) at 201 frequency points, with a time gate of 61–71 ns, and one acquisition per 50 Hz interval. Horn antennas are LB-187-15-C-SF (A-Info), with gain of at least 16.35 dBi. The released CSV column is S21 Magnitude in dB. The RIS configuration is a 120-element binary vector (0 = 0°, 1 = 180°), indexed column-wise from the top-left corner as seen from the UAV. Each file holds 10 s at 50 Hz, which gives 500 time steps.', zh: S21 由 VNA 在 5.225–5.875 GHz（650 MHz 带宽）内以 201 个频点测得，时间门控为 61–71 ns，每个 50 Hz 间隔采集一次。喇叭天线型号为 LB-187-15-C-SF（A-Info），增益至少 16.35 dBi。发布的 CSV 列为 S21 Magnitude，单位 dB。RIS 配置为 120 元素二进制向量（0 = 0°，1 = 180°），从无人机视角的左上角开始按列索引。每个文件包含 10 s、50 Hz 的数据，即 500 个时间步。}
capabilities:
- key: csi
  status: none
  note: {en: Only S21 magnitude in dB is released; no complex phase., zh: 仅发布以 dB 表示的 S21 幅度，不含复数相位。}
- key: cir
  status: none
  note: {en: 'Only S21 magnitude per frequency point is released, so no complex impulse response can be formed.', zh: 仅发布各频点的 S21 幅度，无法由此形成复数冲激响应。}
- key: paths
  status: none
  note: {en: 'The released columns contain no per-path delay, angle or power.', zh: 发布的数据列中不含逐径时延、角度或功率。}
- key: interaction
  status: none
  note: {en: No per-path interaction records; time gating keeps only the RIS-reflected contribution., zh: 无逐径交互记录；时间门控仅保留 RIS 反射分量。}
- key: power
  status: provided
  note: {en: 'S21 magnitude in dB, a channel gain value rather than absolute received power.', zh: 以 dB 表示的 S21 幅度，是信道增益而非绝对接收功率。}
- key: iq
  status: none
  note: {en: No raw I/Q samples; the VNA S21 is stored as magnitude only., zh: 无原始 I/Q 采样；VNA 的 S21 仅以幅度形式存储。}
- key: beam_labels
  status: provided
  note: {en: Per-time-step RIS phase profiles of 120 binary entries; not beam indices or per-beam gains., zh: 每个时刻的 RIS 相位配置，为 120 维二值向量；不是波束索引，也不是逐波束增益。}
- key: position
  status: provided
  note: {en: 'UAV and RIS positions and attitudes as EKF estimates in the NWU frame, at 50 Hz.', zh: 无人机与 RIS 的位置和姿态，为 NWU 坐标系下的 EKF 估计值，采样率 50 Hz。}
- key: geometry
  status: none
  note: {en: 'Tx, Rx and RIS coordinates appear only in README tables; there are no 3D scene or map files.', zh: 收发机与 RIS 坐标仅见于 README 表格，无三维场景或地图文件。}
- key: materials
  status: none
  note: {en: No material parameters are released., zh: 未发布材料参数。}
- key: rgb
  status: none
  note: {en: Motion capture provides poses only; no camera images are released., zh: 动作捕捉仅提供位姿，未发布相机图像。}
- key: depth
