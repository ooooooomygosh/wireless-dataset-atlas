summary: {en: 'Synchronized, calibrated mmWave radar point clouds and RGB(D) images of 20 volunteers performing 100 motions, with skeleton and mesh annotations. Scenes include lab settings and smoke, rain, occlusion and poor-lighting conditions.', zh: 20 名志愿者执行 100 种动作时同步、标定的毫米波雷达点云与 RGB(D) 图像，附带骨架与网格标注。场景包括实验室环境以及烟雾、降雨、遮挡和低光照条件。}
