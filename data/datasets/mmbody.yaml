summary: {en: 'Synchronized, calibrated mmWave radar point clouds and RGB(D) images of 20 volunteers performing 100 motions, with skeleton and mesh annotations. Scenes include lab settings and smoke, rain, occlusion and poor-lighting conditions.', zh: 20 名志愿者执行 100 种动作时同步、标定的毫米波雷达点云与 RGB(D) 图像，附带骨架与网格标注。场景包括实验室环境以及烟雾、降雨、遮挡和低光照条件。}
sources: ['https://chen3110.github.io/mmbody/index.html', 'https://github.com/Chen3110/mmBody', 'https://arxiv.org/abs/2209.05070', 'https://arxiv.org/html/2209.05070v3', 'https://api.crossref.org/works/10.1145/3503161.3548262', 'https://raw.githubusercontent.com/Chen3110/mmBody/main/README.md', 'https://arberobotics.com/wp-content/uploads/2021/05/4D-Imaging-radar-product-overview.pdf', 'https://github.com/Chen3110/mmBody/releases', 'https://github.com/Chen3110/mmBody/commits/main', 'https://arxiv.org/abs/2209.05070v1', 'https://arxiv.org/abs/2209.05070v2', 'https://arxiv.org/abs/2209.05070v3']
checked: '2026-11-06'
overview: {en: 'mmBody is a mmWave radar benchmark for 3D body reconstruction. The State Key Laboratory of Industrial Control Technology at Zhejiang University produced it, and it was published at the ACM International Conference on Multimedia (ACM MM) 2022. It contains synchronized, calibrated mmWave radar point clouds and RGB and depth images from two Azure Kinect cameras, together with motion capture labels. The data cover 100 motions performed by 20 volunteers in seven scenes, with more than 200k frames. The scenes include two labs, a furnished lab, poor lighting, rain, smoke and occlusion of the radar. Labels are skeleton and SMPL-X mesh annotations, obtained by fitting SMPL-X to OptiTrack marker data with MoSh++. The benchmark tasks are 3D joint and mesh reconstruction from radar point clouds, Kinect point clouds and RGB images, with P4Transformer and VIBE as baselines. Access requires a request, and the terms allow non-commercial academic use only, without modification or redistribution.',
  zh: mmBody 是一个面向三维人体重建的毫米波雷达基准数据集。该数据集由浙江大学工业控制技术国家重点实验室（State Key Laboratory of Industrial Control Technology）制作，发表于 ACM International Conference on Multimedia（ACM MM）2022。数据包含同步、标定后的毫米波雷达点云，以及来自两台 Azure Kinect 相机的 RGB 与深度图像，并附带动作捕捉标签。数据覆盖 20 名志愿者在 7 个场景中执行的 100 种动作，超过 200k 帧。场景包括两个实验室、一个布置了家具的实验室、低光照环境、降雨、烟雾以及雷达遮挡。标签为骨架和 SMPL-X 网格标注，通过 MoSh++ 将 SMPL-X 拟合到 OptiTrack 标记点数据上得到。基准任务为基于雷达点云、Kinect 点云和 RGB 图像的三维关节与网格重建，基线方法为 P4Transformer 和 VIBE。获取数据需要提交申请，使用条款仅允许非商业学术用途，不得修改或再分发。}
signal_details:
- signal: radar
  text: {en: 'Arbe Robotics Phoenix radar with a 48 transmit by 48 receive channel antenna array. Range resolution is 0.4 m and angle resolution about 2.0 degrees. The product rate is 10 to 30 FPS, and the actual capture rate is about 14 FPS. An onboard processor produces point clouds whose points carry 3D location, range velocity, amplitude and energy power. The radar is placed 3 to 5 m from the subjects.', zh: Arbe Robotics Phoenix 雷达，发射 48 通道、接收 48 通道的天线阵列。距离分辨率 0.4 m，角度分辨率约 2.0 度。产品标称帧率为 10 至 30 FPS，实际采集帧率约 14 FPS。板载处理器生成点云，每个点包含三维位置、range velocity、幅度和能量功率。雷达与受试者的距离为 3 至 5 m。}
- signal: rgb
  text: {en: 'Color images from the two Azure Kinect units at 30 FPS. The master unit sits directly under the radar, and the sub unit sits 1.5 to 2 m from the body on one side of the radar-body line.', zh: 两台 Azure Kinect 的彩色图像，30 FPS。master 相机位于雷达正下方，sub 相机位于雷达与人体连线的一侧，距人体 1.5 至 2 m。}
- signal: depth
  text: {en: Depth images from the same two Azure Kinect units at 30 FPS. Camera intrinsics are provided as 3 x 3 matrices for the master and sub cameras., zh: 同两台 Azure Kinect 的深度图像，30 FPS。提供 master 与 sub 相机的 3 x 3 内参矩阵。}
pipeline:
  summary: {en: 'Radar, two Kinect cameras and OptiTrack motion capture are calibrated to the radar frame, and SMPL-X labels are fitted from marker data with MoSh++.', zh: 雷达、两台 Kinect 相机和 OptiTrack 动作捕捉系统标定到雷达坐标系，SMPL-X 标签由标记点数据通过 MoSh++ 拟合得到。}
  stages:
  - title: {en: Multi-sensor capture, zh: 多传感器采集}
    detail: {en: 'The radar is mounted on a 3D-printed holder on a tripod about 0.8 m above the ground and records subjects 3 to 5 m away. Two Azure Kinect units stream color and depth at 30 FPS. Eight OptiTrack cameras on tripods around a circle of 8 m radius, at 2.5 m height, track 37 markers at up to 300 FPS.', zh: 雷达安装在三脚架上的 3D 打印支架上，离地约 0.8 m，记录距离 3 至 5 m 的受试者。两台 Azure Kinect 以 30 FPS 输出彩色与深度流。8 台 OptiTrack 相机置于半径 8 m 的圆周上，高 2.5 m，以最高 300 FPS 跟踪 37 个标记点。}
    outputs:
    - {en: 'radar point clouds, RGB-D images, marker trajectories', zh: 雷达点云、RGB-D 图像、标记点轨迹}
  - title: {en: Calibration, zh: 标定}
    detail: {en: 'The radar frame is the target coordinate frame for all labels. Kinect calibration uses a 1 m x 1 m Aruco tag, with the transform computed by Colored ICP. The radar-to-Kinect transform is set beforehand on the shared holder. The radar-to-MoCap transform is computed from markers on the radar, located by OptiTrack.', zh: 雷达坐标系是所有标签的目标坐标系。Kinect 标定使用 1 m x 1 m 的 Aruco 标记板，变换由 Colored ICP 计算。雷达与 Kinect 的变换在共用支架上预先设定。雷达与动作捕捉系统的变换由雷达上的标记点经 OptiTrack 定位后计算得到。}
    inputs:
    - {en: marker and tag observations, zh: 标记点与标记板观测}
    outputs:
    - {en: sensor-to-radar transforms, zh: 各传感器到雷达的变换}
  - title: {en: Synchronization, zh: 同步}
    detail: {en: 'The radar runs on an Ubuntu VM on the same physical machine as the camera capture system, and the MoCap PC is synchronized to the camera system over a local network. The radar provides receive timestamps only, so misalignment is checked manually and adjusted slightly per sequence.', zh: 雷达运行在与相机采集系统同一台物理机器上的 Ubuntu 虚拟机中，动作捕捉 PC 通过局域网与相机系统同步。雷达只提供接收时间戳，因此人工检查时间错位，并对每个序列做细微调整。}
    outputs:
    - {en: time-aligned sequences, zh: 时间对齐的序列}
  - title: {en: Ground-truth fitting, zh: 真值拟合}
    detail: {en: 'MoSh++ fits SMPL-X to the MoCap marker locations. The output is 22 joints and 10475 mesh vertices. The shape parameter beta has 16 dimensions, and the pose has a global rotation plus 21 body joints. Hand pose and facial expression are fixed to template values.', zh: MoSh++ 将 SMPL-X 拟合到动作捕捉标记点位置。输出为 22 个关节和 10475 个网格顶点。形状参数 beta 为 16 维，姿态包括全局旋转和 21 个身体关节。手部姿态和面部表情固定为模板值。}
    inputs:
    - {en: MoCap marker locations, zh: 动作捕捉标记点位置}
    outputs:
    - {en: 'SMPL-X parameters, joints and mesh', zh: SMPL-X 参数、关节与网格}
  - title: {en: Point cloud preprocessing, zh: 点云预处理}
    detail: {en: 'Radar points are sampled to 1024 per frame, with features of 3D coordinates, amplitude, velocity and energy. Kinect point clouds are sampled to 4096 per frame. Each frame is cropped with a bounding box derived from the ground-truth skeleton.', zh: 雷达点云每帧采样为 1024 个点，特征包括三维坐标、幅度、速度和能量。Kinect 点云每帧采样为 4096 个点。每帧依据真值骨架得到的包围盒进行裁剪。}
    inputs:
    - {en: 'radar and Kinect point clouds, ground-truth skeletons', zh: 雷达与 Kinect 点云、真值骨架}
    outputs:
    - {en: fixed-size cropped point clouds, zh: 固定点数的裁剪点云}
bands_ghz: [77]
antennas: {tx: 48, rx: 48}
facts:
- label: {en: Split, zh: 数据划分}
  text: {en: 'Training uses 20 sequences from 10 subjects recorded in the two labs. The test set holds 2 sequences from 2 subjects in each of the seven scenes, and the Lab2 test subjects also appear in training. Each sequence has about 2,000 frames.', zh: '训练集使用两个实验室中 10 名受试者的 20 个序列。测试集在七个场景中各包含 2 名受试者的 2 个序列，其中 Lab2 的测试受试者同时出现在训练集中。每个序列约 2,000 帧。'}
- label: {en: Coordinate frame, zh: 坐标系}
  text: {en: 'The radar frame is the world frame, with X horizontal, Y depth and Z height in meters. The calib.txt transforms map each sensor frame to it.', zh: 雷达坐标系为世界坐标系，X 为水平方向，Y 为深度方向，Z 为高度方向，单位为米。calib.txt 中的变换矩阵将各传感器坐标系映射到该坐标系。}
- label: {en: Error metrics, zh: 误差指标}
  text: {en: Joint and vertex errors are the mean and the maximum Euclidean distance per frame. Shape error is the mean squared error between ground-truth and estimated shape parameters., zh: 关节与顶点误差取每帧的平均与最大欧氏距离。形状误差为真值与估计形状参数之间的均方误差。}
capabilities:
- key: csi
  status: none
  note: {en: Radar point clouds and Kinect images only; no channel matrices., zh: 仅有雷达点云与 Kinect 图像，无信道矩阵。}
- key: cir
  status: none
  note: {en: No impulse response or power delay profile; the radar output is a point cloud., zh: 没有冲激响应或功率时延谱；雷达输出为点云。}
- key: paths
  status: none
  note: {en: 'Points carry 3D location, range velocity, amplitude and energy, but no per-path delay, phase or angle list.', zh: 点包含三维位置、径向速度、幅度和能量，但没有逐径时延、相位或角度列表。}
- key: interaction
  status: none
  note: {en: No per-path interaction records., zh: 没有逐径交互记录。}
- key: power
  status: provided
  note: {en: 'Per-point reflected energy power in the radar point cloud, not link-level received power or RSSI.', zh: 雷达点云中每个点的反射能量功率，而非链路级接收功率或 RSSI。}
- key: iq
  status: none
  note: {en: Point clouds are produced by the radar's onboard processor; raw radar signals are not part of the release., zh: 点云由雷达板载处理器生成，原始雷达信号不在发布内容中。}
- key: beam_labels
  status: none
  note: {en: No beam indices or per-beam gains; the radar output is a point cloud., zh: 没有波束索引或逐波束增益；雷达输出为点云。}
- key: position
  status: provided
  note: {en: MoCap 3D joint and vertex coordinates of the subject in the radar frame; no device or GPS position., zh: MoCap 给出的受试者关节与网格顶点三维坐标（雷达坐标系）；无设备位置或 GPS。}
- key: geometry
  status: none
  note: {en: Only human meshes and calibration files are released; no 3D scene or map files., zh: 仅发布人体网格与标定文件，无三维场景或地图文件。}
- key: materials
  status: none
  note: {en: 'Occluding materials (paper, plastic wrap, foam board, cloth) are named but no material parameters are released.', zh: 遮挡材料（纸、塑料包装膜、泡沫板、布）有名称，但不提供材料参数。}
- key: rgb
  status: provided
  note: {en: Color images from two Azure Kinect cameras at 30 FPS., zh: 两台 Azure Kinect 的彩色图像，30 FPS。}
- key: depth
  status: provided
  note: {en: Depth images from the same two Azure Kinect cameras., zh: 同两台 Azure Kinect 的深度图像。}
- key: lidar
  status: none
  note: {en: 'The capture system has a radar, Kinect cameras and MoCap only.', zh: 采集系统仅包含雷达、Kinect 相机与 MoCap。}
- key: radar
  status: provided
  note: {en: 'Arbe Phoenix radar point clouds at about 14 FPS; each point has 3D location, range velocity, amplitude and energy.', zh: Arbe Phoenix 雷达点云，约 14 FPS；每个点包含三维位置、径向速度、幅度和能量。}
- key: imu
  status: none
  note: {en: No IMU in the capture system., zh: 采集系统中无 IMU。}
- key: time_series
  status: provided
  note: {en: 'Frame sequences of about 2000 frames per test sequence; radar frames carry reception timestamps, not exact capture times; Kinect at 30 FPS.', zh: 帧序列，每个测试序列约 2000 帧；雷达帧带接收时间戳，并非精确采集时刻；Kinect 为 30 FPS。}
- {key: multiuser, status: unknown}
- key: multibs
  status: none
  note: {en: Single radar; no multi-base-station set., zh: 单个雷达，无多基站集合。}
- key: crossfreq
  status: none
  note: {en: Single radar and camera system; no paired multi-band data., zh: 单雷达与相机系统，无成对多频段数据。}
- {key: near_field, status: unknown}
- {key: high_mobility, status: unknown}
- key: dynamic_blockage
  status: none
  note: {en: Occlusion means the radar covered by static materials; no moving blockers are described., zh: 遮挡指雷达被静态材料覆盖；未描述移动遮挡物。}
- key: reflection
  status: provided
  note: {en: 'Inherent in the measurement, not labelled per path.', zh: 由测量本身包含，未按径标注。}
- key: diffraction
  status: provided
  note: {en: 'Inherent in the measurement, not labelled per path.', zh: 由测量本身包含，未按径标注。}
- key: scattering
  status: provided
  note: {en: 'Inherent in the measurement, not labelled per path.', zh: 由测量本身包含，未按径标注。}
- key: transmission
  status: provided
  note: {en: 'Inherent in the measurement, not labelled per path; the occlusion scenes test penetration through materials.', zh: 由测量本身包含，未按径标注；遮挡场景测试了穿透材料的能力。}
- {key: polarization, status: unknown}
- key: em_field
  status: none
  note: {en: 'Outputs are point clouds, images and meshes; no field-level quantities or antenna patterns.', zh: 输出为点云、图像与网格，无场量或天线方向图。}
