checked: '2026-11-06'
overview: {en: 'This dataset contains over-the-air captures of LTE signals and NIST Type 1 radar signals in the shared CBRS band, collected in an RF anechoic chamber with software-defined radios and recorded with the authors'' open-source RF data recording API. Tassie, Gaber, Chaudhary, Soltani, Belgiovine, Loehning, Kotzsch, Schroeder and Chowdhury, from Northeastern University and National Instruments, released it on IEEE DataPort in 2022 and described it in an IEEE Communications Magazine article in 2023 (DOI 10.1109/MCOM.002.2200682). The LTE signals use several bandwidths and test models, and the radar signal is generated by NIST''s radar waveform generator. The dataset has 5640 samples, each with a 40 ms frame duration, in overlapping and non-overlapping LTE-radar scenarios at SINR from 15 to 35 dB. Each data file is stored in SigMF format at a 30.72 MHz sampling rate, with a companion metadata file that records the sampling rate, number of samples and center frequency. The dataset
    totals 55.5 GB and is licensed under Creative Commons Attribution, and the IEEE DataPort copy requires a subscription.', zh: 该数据集包含共享 CBRS 频段内 LTE 信号与 NIST Type 1 雷达信号的空口采集数据，采集在射频消声室中借助软件无线电完成，并由作者开源的 RF 数据记录 API 录制。Tassie、Gaber、Chaudhary、Soltani、Belgiovine、Loehning、Kotzsch、Schroeder 与 Chowdhury 来自 Northeastern University 与 National Instruments，数据于 2022 年发布在 IEEE DataPort，并于 2023 年在 IEEE Communications Magazine 文章中加以介绍（DOI 10.1109/MCOM.002.2200682）。LTE 信号包含多种带宽与测试模型，雷达信号由 NIST 雷达波形生成器产生。数据集包含 5640 个样本，每个样本帧长 40 ms，覆盖 SINR 为 15 至 35 dB 的 LTE 与雷达重叠及非重叠场景。每个数据文件以 SigMF 格式存储，采样率为 30.72 MHz，并附有同名元数据文件，记录采样率、样本数与中心频率。数据总量为 55.5 GB，以 Creative Commons Attribution 许可发布，IEEE DataPort 副本需要订阅。}
signal_details:
- signal: iq
  text: {en: 'Over-the-air captures recorded by software-defined radios as SigMF data files at 30.72 MHz sampling rate, each sample with a 40 ms frame duration. Each data file has a companion SigMF metadata file recording sampling rate, number of samples and center frequency.', zh: 软件无线电在空口采集的数据，以 SigMF 数据文件存储，采样率 30.72 MHz，每个样本帧长 40 ms。每个数据文件附有同名 SigMF 元数据文件，记录采样率、样本数与中心频率。}
- signal: radar
  text: {en: 'NIST Type 1 radar signals from NIST''s radar waveform generator, captured over the air both with and without overlap with LTE signals, at SINR from 15 to 35 dB.', zh: 来自 NIST 雷达波形生成器的 NIST Type 1 雷达信号，在空口采集，分别包含与 LTE 信号重叠及不重叠的情况，SINR 为 15 至 35 dB。}
pipeline:
  summary: {en: LTE and NIST Type 1 radar waveforms are transmitted over the air through software-defined radios in an anechoic chamber and recorded as SigMF files., zh: LTE 与 NIST Type 1 雷达波形经软件无线电在消声室中空口发射，并以 SigMF 文件形式录制。}
  stages:
  - title: {en: Waveform generation, zh: 波形生成}
    detail: {en: LTE signals are produced with several bandwidths and test models. The Type 1 radar waveform is produced by NIST's radar waveform generator., zh: LTE 信号以多种带宽与测试模型生成。Type 1 雷达波形由 NIST 雷达波形生成器生成。}
    inputs:
    - {en: LTE bandwidth and test model settings, zh: LTE 带宽与测试模型设置}
    outputs:
    - {en: LTE and radar waveforms, zh: LTE 与雷达波形}
  - title: {en: Over-the-air transmission, zh: 空口发射}
    detail: {en: 'Simultaneous LTE and radar signals are transmitted by software-defined radios inside an RF anechoic chamber, in overlapping and non-overlapping scenarios at SINR from 15 to 35 dB.', zh: LTE 与雷达信号由软件无线电在射频消声室内同时发射，覆盖 SINR 为 15 至 35 dB 的重叠与非重叠场景。}
    inputs:
    - {en: LTE and radar waveforms, zh: LTE 与雷达波形}
    outputs:
    - {en: over-the-air signal mixtures, zh: 空口信号混合}
  - title: {en: Recording, zh: 录制}
    detail: {en: The captures are recorded with the authors' open-source RF data recording API on the software-defined radio testbed., zh: 采集数据通过作者开源的 RF 数据记录 API，在软件无线电测试平台上录制。}
    inputs:
    - {en: received over-the-air signals, zh: 接收到的空口信号}
    outputs:
    - {en: raw sample data files, zh: 原始采样数据文件}
  - title: {en: SigMF packaging, zh: SigMF 封装}
    detail: {en: 'Each data file has a SigMF metadata file of the same name that records the sampling rate (30.72 MHz), the number of samples and the center frequency.', zh: 每个数据文件都有同名的 SigMF 元数据文件，记录采样率（30.72 MHz）、样本数与中心频率。}
    inputs:
    - {en: raw sample data files, zh: 原始采样数据文件}
    outputs:
    - {en: SigMF data and metadata file pairs, zh: SigMF 数据与元数据文件对}
size_gb: 55.5
facts:
- label: {en: Size and copies, zh: 大小与副本}
  text: {en: The Genesys Lab page gives the dataset size as 55.5 GB and links to a Northeastern University repository handle (hdl.handle.net/2047/D20487508) for the download. The IEEE DataPort copy is a single IEEE_UPLOAD.zip file of 16.86 GB., zh: Genesys Lab 页面给出数据集大小为 55.5 GB，并将下载链接指向 Northeastern University 仓库句柄（hdl.handle.net/2047/D20487508）。IEEE DataPort 副本为单个 IEEE_UPLOAD.zip 文件，大小为 16.86 GB。}
- label: {en: Reference article, zh: 参考文章}
  text: {en: 'The IEEE Communications Magazine article is titled Detection of Co-Existing RF Signals in CBRS Using ML: Dataset and API-Based Collection Testbed.', zh: 'IEEE Communications Magazine 文章标题为 Detection of Co-Existing RF Signals in CBRS Using ML: Dataset and API-Based Collection Testbed。'}
limitations:
- {en: 'The captures were made inside an RF anechoic chamber with software-defined radios, so the set is a lab recording rather than a field recording.', zh: 采集在射频消声室内借助软件无线电完成，因此该数据集是实验室录制，而非外场录制。}
history:
- {en: 'The dataset was posted on IEEE DataPort on October 28, 2022, and the companion article appeared in IEEE Communications Magazine in 2023.', zh: 数据集于 2022 年 10 月 28 日发布在 IEEE DataPort，配套文章于 2023 年刊登在 IEEE Communications Magazine。}
usage:
- {en: The Genesys Lab page presents the IEEE Communications Magazine article as the paper that used this dataset., zh: Genesys Lab 页面将 IEEE Communications Magazine 文章列为使用该数据集的论文。}
