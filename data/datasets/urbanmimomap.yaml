  status: derivable
  note: {en: Not stored; beam indices can be computed from the released H with a chosen codebook., zh: 未存储；可使用所选码本由发布的 H 计算波束索引。}
- key: position
  status: derivable
  note: {en: Receivers lie on a 0.5 m grid over each 256 m x 256 m scenario; no coordinate file is described., zh: 接收点位于每个 256 m x 256 m 场景的 0.5 m 网格上；来源未描述坐标文件。}
- key: geometry
  status: provided
  note: {en: Scene (.odb) and environment files are in the complete code package; the GitHub repository holds samples only., zh: 场景（.odb）与环境文件包含在完整代码包中；GitHub 仓库仅含样例。}
