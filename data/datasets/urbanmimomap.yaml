summary: {en: 'Ray-traced 4x4 complex MIMO channel matrices at 3.5 GHz and 50 MHz bandwidth over 350 urban map scenarios built from OpenStreetMap data. Each of the 42,000 NPZ files holds one channel matrix H, and precoding-aware radio maps are included.', zh: '在3.5 GHz、50 MHz带宽下，基于350个由OpenStreetMap数据构建的城市地图场景，经光线追踪得到4x4复数MIMO信道矩阵。42,000个NPZ文件各包含一个信道矩阵H，并包含预编码感知的无线电地图。'}
sources: ['https://arxiv.org/abs/2509.06270', 'https://arxiv.org/html/2509.06270', 'https://github.com/UNIC-Lab/UrbanMIMOMap', 'https://raw.githubusercontent.com/UNIC-Lab/UrbanMIMOMap/main/README.md', 'https://api.github.com/repos/UNIC-Lab/UrbanMIMOMap/license', 'https://doi.org/10.1109/globecom59602.2025.11432757', 'https://raw.githubusercontent.com/UNIC-Lab/UrbanMIMOMap/main/LICENSE', 'https://github.com/UNIC-Lab/UrbanMIMOMap/commits/main']
checked: '2026-11-06'
overview: {en: 'UrbanMIMOMap is a ray-traced MIMO channel dataset with precoding-aware radio maps, released by the UNIC Lab at Xidian University with a GlobeCom 2025 paper. It covers 350 outdoor urban scenarios built from OpenStreetMap data, each 256 m x 256 m at 0.5 m resolution. Channels were simulated with Altair WinProp''s Dominant Path Model at 3.5 GHz and 50 MHz bandwidth, using an isotropic base-station antenna at 23 dBm. Each scenario has 120 transmitter configurations (40 base stations at three azimuths), and the release has 42,000 NPZ files. Each file stores one complex 4x4 channel matrix H between 1x4 dual-polarized ULAs at the transmitter and the receiver, with the receiver at 1.5 m height. The dataset also contains precoding-aware received-power maps computed from H with a fixed precoder. The full data are distributed through Baidu Netdisk and OneDrive, and the OneDrive copy holds 50 maps.', zh: 'UrbanMIMOMap 是一个光线追踪生成的 MIMO 信道数据集，同时提供预编码感知的无线电地图，由 Xidian University 的 UNIC Lab
    发布，对应 GlobeCom 2025 论文。数据集包含 350 个基于 OpenStreetMap 数据构建的室外城市场景，每个场景为 256 m x 256 m，分辨率 0.5 m。信道由 Altair WinProp 的 Dominant Path Model 仿真，载频 3.5 GHz，带宽 50 MHz，基站采用全向天线，发射功率 23 dBm。每个场景有 120 组发射配置（40 个基站，每个基站三个方位角），数据集共 42,000 个 NPZ 文件。每个文件保存一个复数 4x4 信道矩阵 H，收发两端均为 1x4 双极化 ULA，接收高度 1.5 m。数据集还包含由 H 与固定预编码器计算得到的预编码感知接收功率地图。完整数据通过百度网盘和 OneDrive 分发，其中 OneDrive 版本包含 50 个地图。'}
signal_details:
- signal: csi
  text: {en: 'One complex 4x4 MIMO channel matrix H per NPZ file, one file per transmitter configuration, for example 0_5_60.npz (azimuth 60 degrees), in folders resu_npz_map_0 to resu_npz_map_349. Carrier 3.5 GHz and bandwidth 50 MHz. Transmit and receive arrays are 1x4 ULAs with 0.5 lambda spacing and dual polarization. Transmit azimuths are 0, 60 and 120 degrees with tilt -10 degrees, and the receiver height is 1.5 m. Files for isotropic antennas use the suffix iso.', zh: 每个 NPZ 文件保存一个复数 4x4 MIMO 信道矩阵 H，每个发射配置对应一个文件，例如 0_5_60.npz（方位角 60 度），场景目录为 resu_npz_map_0 至 resu_npz_map_349。载频 3.5 GHz，带宽 50 MHz。收发阵列均为 1x4 ULA，阵元间距 0.5 lambda，双极化。发射方位角为 0 度、60 度和 120 度，倾角 -10 度；接收高度 1.5 m。全向天线文件使用后缀 iso。}
pipeline:
  summary: {en: 'Ray tracing in Altair WinProp turns OpenStreetMap-based urban scenes into per-point propagation paths, which are then combined into 4x4 MIMO channel matrices and precoded received-power maps.', zh: Altair WinProp 光线追踪将基于 OpenStreetMap 的城市场景转换为逐点传播路径，再合成 4x4 MIMO 信道矩阵和预编码接收功率地图。}
  stages:
  - title: {en: Build 3D urban scenarios, zh: 构建三维城市场景}
    detail: {en: '3D urban models are built from OpenStreetMap data, with Ankara and Berlin given as examples. Building heights are 6.6 m to 19.8 m and vehicles are 2 m tall, and coordinates come from processed RadioMapSeer data. Each scenario is 256 m x 256 m at 0.5 m resolution, giving 262,144 sampling points at 1.5 m height.', zh: '三维城市模型基于 OpenStreetMap 数据构建，论文以 Ankara 和 Berlin 为例。建筑高度为 6.6 m 至 19.8 m，车辆高度为 2 m，坐标来自处理后的 RadioMapSeer 数据。每个场景为 256 m x 256 m，分辨率 0.5 m，共 262,144 个采样点，高度 1.5 m。'}
    inputs:
    - {en: OpenStreetMap data, zh: OpenStreetMap 数据}
    - {en: RadioMapSeer coordinates, zh: RadioMapSeer 坐标}
    outputs:
    - {en: 350 scenario models, zh: 350 个场景模型}
  - title: {en: Trace dominant propagation paths, zh: 追踪主导传播路径}
    detail: {en: 'Altair WinProp computes path delay and DoD/DoA for all 262,144 points with the Dominant Path Model, using an isotropic base-station antenna at 23 dBm, 3500 MHz and 50 MHz bandwidth. The authors chose this model over Intelligent Ray Tracing for speed.', zh: 'Altair WinProp 使用 Dominant Path Model 为全部 262,144 个点计算路径时延和 DoD/DoA，基站天线为全向，发射功率 23 dBm，频率 3500 MHz，带宽 50 MHz。作者选择该模型而非 Intelligent Ray Tracing，以兼顾速度。'}
    inputs:
    - {en: Scenario models, zh: 场景模型}
    - {en: Transmitter sites, zh: 发射站点}
    outputs:
    - {en: Stored path data per point, zh: 每点存储的路径数据}
  - title: {en: Synthesize 4x4 channel matrices, zh: 合成 4x4 信道矩阵}
    detail: {en: 'Each entry of H is obtained by coherently summing the path contributions after the element patterns, with coupling set to False and coherent addition set to True. H_ij is the complex gain from transmit element j to receive element i. The transmit array is a 1x4 ULA with 0.5 lambda spacing, dual polarization, and azimuths 0, 60 and 120 degrees with tilt -10 degrees.', zh: H 的每个元素通过在阵元方向图之后对各路径贡献做相干求和得到，耦合设为 False，相干叠加设为 True。H_ij 表示从发射阵元 j 到接收阵元 i 的复增益。发射阵列为 1x4 ULA，阵元间距 0.5 lambda，双极化，方位角 0、60、120 度，倾角 -10 度。}
    inputs:
    - {en: Stored path data, zh: 存储的路径数据}
    - {en: Antenna pattern file Beams2Control4Data.ffe, zh: 天线方向图文件 Beams2Control4Data.ffe}
    outputs:
    - {en: Complex 4x4 channel matrix H per configuration, zh: 每组配置的复数 4x4 信道矩阵 H}
  - title: {en: Compute precoded received power, zh: 计算预编码接收功率}
    detail: {en: 'The received power P_rx = ||Hw||^2 uses the precoder w = (1/2)[1 1 1 1]^T with ||w||^2 = 1, and noise is neglected. P_rx is converted to dBm as 10 log10(P_rx) + 30 and min-max normalized over the whole dataset.', zh: '接收功率 P_rx = ||Hw||^2 使用预编码器 w = (1/2)[1 1 1 1]^T，满足 ||w||^2 = 1，忽略噪声。P_rx 按 10 log10(P_rx) + 30 转换为 dBm，并在整个数据集上做 min-max 归一化。'}
    inputs:
    - {en: Channel matrices H, zh: 信道矩阵 H}
    outputs:
    - {en: Precoding-aware radio maps, zh: 预编码感知无线电地图}
facts:
- label: {en: Channel matrix convention, zh: 信道矩阵约定}
  text: {en: 'H_ij is the complex gain from transmit element j to receive element i. Its magnitude combines path loss, shadow fading and multipath, and its phase combines path length, reflection and diffraction shifts, and array factors.', zh: H_ij 表示从发射阵元 j 到接收阵元 i 的复增益。其幅度综合路径损耗、阴影衰落和多径效应，相位综合路径长度、反射与绕射相移以及阵列因子。}
- label: {en: Transmitter configurations, zh: 发射配置}
  text: {en: 'Each scenario has 40 transmitting base stations, and each base station is simulated at three azimuths (0, 60 and 120 degrees), giving 120 configurations per scenario.', zh: 每个场景有 40 个发射基站，每个基站在三个方位角（0 度、60 度和 120 度）下仿真，每个场景共 120 组配置。}
- label: {en: File naming, zh: 文件命名}
  text: {en: 'File names give the environment, transmitter and azimuth in that order, so 0_5_60 is scenario 0, transmitter 5 at azimuth 60 degrees, and 0_5_iso uses an isotropic antenna.', zh: 文件名依次给出场景、发射端和方位角，例如 0_5_60 表示场景 0、发射端 5、方位角 60 度，0_5_iso 使用全向天线。}
capabilities:
- key: csi
  status: provided
  note: {en: 'One complex 4x4 H per sampling point; 262,144 points per scenario, in 42,000 NPZ files.', zh: '每个采样点一个复数 4x4 H；每个场景 262,144 个点，共 42,000 个 NPZ 文件。'}
- key: cir
  status: derivable
  note: {en: Computed from the provided CSI by an inverse Fourier transform over subcarriers., zh: 由所提供的 CSI 沿子载波做逆傅里叶变换得到。}
- key: paths
  status: simulate
  note: {en: 'The release includes the 3D scene, so re-running a ray tracer on it produces this output.', zh: 发布内容包含三维场景，在其上重新运行射线追踪即可产生该输出。}
- key: interaction
  status: simulate
  note: {en: 'The release includes the 3D scene, so re-running a ray tracer on it produces this output.', zh: 发布内容包含三维场景，在其上重新运行射线追踪即可产生该输出。}
- key: power
  status: provided
  note: {en: 'FEGT-precoded received-power maps, min-max normalised to [0, 1]; dBm values follow from H.', zh: 'FEGT 预编码接收功率地图，已线性归一化到 [0, 1]；dBm 值可由 H 计算。'}
