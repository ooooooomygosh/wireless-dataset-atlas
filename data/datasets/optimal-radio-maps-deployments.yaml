pipeline:
  summary:
    en: 'City maps from OpenStreetMap are evaluated exhaustively with SAIPP-Net at every free candidate position. The optimal placements and score maps are then exported as images and CSV files for each building.'
    zh: 对 OpenStreetMap 城市图中的每个可行候选位置，使用 SAIPP-Net 穷举评估。随后为每个建筑导出最优布置、得分图与 CSV 排名文件。
  stages:
    - title: {en: Prepare city maps and candidate positions, zh: 准备城市图与候选位置}
      detail: {en: 'Each city map is a 256 × 256 binary image of building and free-space pixels, built from OpenStreetMap. Candidates are the free pixels in the central 150 × 150 region, about 10,000 to 18,000 per map.', zh: '每张城市图为 256 × 256 的二值图，像素表示建筑或自由空间，数据源自 OpenStreetMap。候选位置为中心 150 × 150 区域内的自由空间像素，每张地图约 10,000 至 18,000 个。'}
      inputs: [{en: OpenStreetMap city maps, zh: OpenStreetMap 城市图}]
      outputs: [{en: Binary city map and candidate list, zh: 二值城市图与候选位置列表}]
    - title: {en: Predict received-power maps with SAIPP-Net, zh: 用 SAIPP-Net 预测接收功率图}
      detail: {en: 'For each candidate, SAIPP-Net predicts a received-power map from the city map and the transmitter. Predicted pixel values map to dBm with P_rx = 60 · p / 255 − 84, with a 23 dBm transmit power. The full run uses about 1.67 billion SAIPP-Net inferences.', zh: '对每个候选位置，SAIPP-Net 由城市图与发射机位置预测接收功率图。预测像素值按 P_rx = 60 · p / 255 − 84 转换为 dBm，发射功率为 23 dBm。全部数据共进行约 16.7 亿次 SAIPP-Net 推理。'}
      inputs: [{en: City map and candidate transmitter, zh: 城市图与候选发射机}]
      outputs: [{en: Predicted received-power map per candidate, zh: 每个候选位置的预测接收功率图}]
    - title: {en: Select optimal placements and score maps, zh: 选取最优布置与得分图}
      detail: {en: 'Average coverage and average received power are computed over the same central free-space region. The power-optimal and coverage-optimal positions are the candidates that maximise each objective, and the score maps store the per-pixel objective values.', zh: '在同一中心自由空间区域上计算平均覆盖与平均接收功率。功率最优与覆盖最优位置分别为使对应目标最大的候选位置，得分图记录每个像素的目标值。'}
      inputs: [{en: Predicted maps for all candidates, zh: 所有候选位置的预测图}]
      outputs: [{en: Optimal positions and two score maps, zh: 最优位置与两张得分图}]
    - title: {en: Export images, rankings and metadata, zh: 导出图像、排名与元数据}
      detail: {en: 'The release stores normalised score maps, best-transmitter images, predicted power and binary coverage maps, the merged best-transmitter CSV, and top-500 ranking CSV files per building. The file normalization_metadata.json holds the reconstruction parameters.', zh: '发布内容包括归一化得分图、最优发射机图像、预测功率图与二值覆盖图、合并的最优发射机 CSV，以及每个建筑的前 500 排名 CSV。normalization_metadata.json 保存重建参数。'}
      inputs: [{en: Predicted maps and score maps, zh: 预测图与得分图}]
      outputs: [{en: PNG images, CSV files and JSON metadata, zh: PNG 图像、CSV 文件与 JSON 元数据}]
facts:
  - label: {en: Dual objectives, zh: 双目标权衡}
    text: {en: 'Coverage-optimal placement sacrifices 13.86% of received power, while power-optimal placement sacrifices 5.50% of coverage.', zh: '覆盖最优布置损失 13.86% 的接收功率，功率最优布置损失 5.50% 的覆盖。'}
  - label: {en: Optimal placement distance, zh: 最优位置距离}
    text: {en: 'The average distance between power-optimal and coverage-optimal positions is 36.18 ± 24.12 pixels.', zh: '功率最优与覆盖最优位置之间的平均距离为 36.18 ± 24.12 像素。'}
technical_notes:
  - {en: 'Received power in dBm is P_rx = 60 · p / 255 − 84 for pixel value p in 0 to 255, so 0 maps to −84 dBm and 255 maps to −24 dBm. The coverage threshold is −84 dBm.', zh: '像素值 p（0 至 255）对应的接收功率为 P_rx = 60 · p / 255 − 84 dBm，0 对应 −84 dBm，255 对应 −24 dBm。覆盖阈值为 −84 dBm。'}
limitations:
  - {en: 'The radio maps are SAIPP-Net predictions, not ray-tracing outputs. The values inherit the model error, and the paper states that exhaustive ray-tracing labelling is out of reach at this scale.', zh: '无线电地图为 SAIPP-Net 预测值，并非射线追踪输出，数值继承模型误差。论文指出，在此规模下穷举射线追踪标注不可行。'}
  - {en: 'Candidate transmitters are restricted to the central 150 × 150 m region, where the underlying model was trained. Positions outside this region are not covered.', zh: '候选发射机限于中心 150 × 150 m 区域，即底层模型的训练范围，区域外的位置未覆盖。'}
  - {en: 'Downloads on IEEE DataPort require a subscription. The files were not downloaded.', zh: 'IEEE DataPort 下载需要订阅，未下载文件。'}
