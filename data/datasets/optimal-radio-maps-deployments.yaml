summary:
  en: 'Predicted received-power maps and optimal single-transmitter placements for 167,525 urban building scenarios, produced by a learned propagation model trained on ray-tracing data. Each scenario has coverage-optimal and power-optimal labels.'
  zh: 基于射线追踪数据训练的学习型传播模型，为 167,525 个城市建筑场景给出预测的接收功率图与单发射机最优布置。每个场景同时提供覆盖最优和功率最优两组标签。
overview:
  en: 'This dataset gives optimal single-transmitter placements for 167,525 urban building scenarios, each 256 × 256 m. For each scenario, the transmitter is searched over free-space pixels in the central 150 × 150 m region, about 10,000 to 18,000 candidates per map. The received-power radio maps are produced by SAIPP-Net, a UNet-based model trained on the IRT4 subset of RadioMapSeer, which provides ray-traced pathloss maps for urban areas. The release gives two optimal placements per scenario, one maximising coverage and one maximising average received power. For each placement it includes the predicted received-power map and the binary coverage map. It also includes two score maps over the feasible region, one for power and one for coverage, stored as normalised images. The release also lists the top-500 transmitter locations per building for each objective. Building maps are 256 × 256 binary images. The power maps are 8-bit images, and the average score maps are 16-bit images for higher precision. The main archive is 12.1 GB, the top-500 ranking archive is 2.7 GB and the buildings archive is 400.18 MB. The authors split the scenarios with a fixed seed of 42 into 80 percent training, 10 percent validation and 10 percent test. The dataset is served from IEEE DataPort, where a subscription is required to download the files. The code repository provides training and evaluation code for the heatmap-based and score-map-based models.'
  zh: 该数据集为 167,525 个城市建筑场景给出单发射机的最优布置，每个场景为 256 × 256 m。对每个场景，发射机在中心 150 × 150 m 区域的自由空间像素中搜索，每张地图约 10,000 至 18,000 个候选位置。接收功率图由 SAIPP-Net 生成，该模型为基于 UNet 的网络，训练于 RadioMapSeer 的 IRT4 子集，后者提供城市区域的射线追踪路径损耗图。每个场景发布两个最优布置，分别以覆盖最大化和平均接收功率最大化为目标。对每个布置，数据集包含预测的接收功率图与二值覆盖图。另有两张覆盖整个可行区域的得分图，分别对应功率与覆盖，以归一化图像存储。每个建筑还给出两种目标下的前 500 个发射位置排名。建筑图为 256 × 256 的二值图像。功率图为 8 位图像，平均得分图为 16 位图像以保证精度。主要压缩包为 12.1 GB，前 500 排名压缩包为 2.7 GB，建筑压缩包为 400.18 MB。作者以固定随机种子 42 将场景划分为 80% 训练集、10% 验证集与 10% 测试集。数据通过 IEEE DataPort 发布，下载文件需要订阅。论文基于该数据集比较了热图法与得分图法两类学习方法，并讨论覆盖与功率两个目标之间的权衡。代码仓库提供热图法与得分图法全部模型的训练与评估代码。两种目标下的布置各自对应一组预测图与覆盖图，便于直接比较同一建筑在两种目标下的布置效果。'
