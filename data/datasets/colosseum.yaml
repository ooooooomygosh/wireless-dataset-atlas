technical_notes:
- {en: The platform combines real SDRs with an FPGA-based channel emulator (MCHEM)., zh: 该平台将真实 SDR 与基于 FPGA 的信道仿真器 MCHEM 结合。}
- {en: The official MATLAB scenario generator supports OpenStreetMap and ray-tracing inputs and produces FIR scenarios., zh: 官方 MATLAB 场景生成器支持 OSM 与射线追踪输入，并生成 FIR 场景。}
- {en: 'The official generator sets fc, node antennas and orientations, mobility trajectories and the number of reflections, and outputs chMatrix, coordinates and Time. Its example approximates each channel with four non-zero taps before import into Colosseum.', zh: 官方生成器设置 fc、节点天线与朝向、移动轨迹和反射次数，并输出 chMatrix、coordinates 和 Time；其示例在导入 Colosseum 前将每条信道近似为四个非零抽头。}
limitations:
- {en: 'The 128 SRNs each drive one X310 with two UBX-160 daughterboards, which gives the 256 SDRs quoted for the platform.', zh: 128 个 SRN 各驱动一台带两块 UBX-160 子板的 X310，对应平台所称的 256 台 SDR。}
- {en: 'Only 4 of the 512 taps are non-zero in generated scenarios, so the emulated channel is an approximation of the generator output.', zh: 生成的场景中 512 个抽头仅 4 个非零，因此仿真信道是生成器输出的近似。}
- {en: 'The authors state that MCHEM was designed for terrains up to 1 km × 1 km, because of the maximum propagation delay its FPGAs can emulate.', zh: 作者指出，MCHEM 因 FPGA 可仿真的最大传播时延，设计地形上限为 1 km × 1 km。}
history:
- {en: The platform was originally built by DARPA and Johns Hopkins APL for the Spectrum Collaboration Challenge. Northeastern's Institute for the Wireless Internet of Things now operates it under an NSF grant., zh: 该平台最初由 DARPA 与约翰霍普金斯大学应用物理实验室为频谱协作挑战赛（SC2）建设；现由东北大学物联网研究所在 NSF 资助下运营。}
- {en: '2020-10-02: Colosseum became generally available to researchers.', zh: 2020-10-02：Colosseum 正式向研究者开放。}
- {en: '2021: the platform paper was published in the proceedings of IEEE DySPAN.', zh: 2021 年：平台论文发表于 IEEE DySPAN 会议论文集。}
usage:
- {en: 'Request team access through the New Team Request form, then reserve SRNs on the Colosseum website.', zh: 通过 New Team Request 表单申请团队访问，然后在 Colosseum 网站预约 SRN。}
- {en: 'Choose an RF scenario from the catalog and an LXC image for each SRN, either a Colosseum image or one uploaded by the user.', zh: 从场景目录中选择 RF 场景，并为每个 SRN 选择 LXC 镜像（平台提供或用户上传）。}
- {en: 'Batch jobs are described in JSON files that specify the duration, RF and traffic scenarios, the number of SRNs and the LXC images.', zh: 批处理作业通过 JSON 文件描述，包括时长、RF 与业务场景、SRN 数量和 LXC 镜像。}
- {en: 'After the experiment, retrieve the /logs contents from the NAS through the file proxy server.', zh: 实验结束后，通过文件代理服务器从 NAS 取回 /logs 内容。}
tools: [project-colosseum-scenario-generator]
overview: {en: 'Colosseum is a remotely accessible wireless network emulator operated by Northeastern University''s Institute for the Wireless Internet of Things and generally available since October 2, 2020. It has 256 software-defined radios (NI USRP X310) on 128 Standard Radio Nodes, each node driving one X310 with two UBX-160 daughterboards. The MCHEM channel emulator supports up to 256 × 256 independently customizable channels, and RF scenarios cover areas of up to 1 km² with up to 65,536 wireless channels. The SDRs cover 10 MHz to 6 GHz, and the emulated bandwidth is 80 MHz in the 2021 platform paper and 100 MHz on the current website. Each emulated channel is an FIR filter with 512 pre-computed complex-valued taps that represents the channel impulse response between two SRNs. TGEN, based on the NRL MGEN generator, emulates IP traffic flows between the SRNs. Data are produced by user experiments: when an experiment ends, the contents of each container''s /logs directory are copied
    to the Colosseum NAS. Access is requested through the New Team Request form, and the Experiments Portal is reached through the Colosseum VPN.', zh: 'Colosseum 是东北大学物联网研究所运营的远程可访问无线网络仿真器，自 2020 年 10 月 2 日起向用户开放。平台由 128 个标准无线电节点（SRN）组成，共 256 台软件定义无线电（NI USRP X310）；每个节点驱动一台 X310，每台 X310 配有两块 UBX-160 子板。MCHEM 信道仿真器支持最多 256 × 256 个可独立配置的信道，RF 场景可覆盖面积达 1 km² 的区域，信道数最多 65,536 个。SDR 覆盖 10 MHz 至 6 GHz，仿真带宽在 2021 年平台论文中为 80 MHz，在当前官网中为 100 MHz。每个仿真信道是一个 FIR 滤波器，包含 512 个预先计算的复数抽头，表示两个 SRN 之间的信道冲激响应。TGEN 基于 NRL 的 MGEN 生成器，在 SRN 之间仿真 IP 业务流。数据由用户运行的实验产生：实验结束后，每个容器 /logs 目录的内容被复制到 Colosseum NAS。访问需通过 New Team Request 表单申请，实验门户需经 Colosseum VPN 访问。'}
signal_details:
- signal: cir
  text: {en: 'MCHEM stores each channel as an FIR filter with 512 pre-computed complex-valued taps for each pair of SRNs. Because of the computational and storage cost, only 4 taps are non-zero in the generated scenarios. The CIR can be derived from channel modeling equations, field measurements or ray-tracing tools. The official MATLAB generator saves chMatrix, plMatrix, NodesName, coordinates, Time and origin to RFscenario.mat.', zh: MCHEM 为每对 SRN 保存一个 FIR 滤波器，包含 512 个预先计算的复数抽头。由于计算与存储成本，生成的场景中仅 4 个抽头为非零值。CIR 可由信道建模公式、实测或光线追踪工具得到。官方 MATLAB 生成器将 chMatrix、plMatrix、NodesName、coordinates、Time 和 origin 保存至 RFscenario.mat。}
- signal: traffic
  text: {en: 'TGEN, based on the NRL MGEN generator, emulates IP traffic flows between the SRNs. A traffic scenario defines the set of flows together with their packet rate, packet size and distribution.', zh: TGEN 基于 NRL 的 MGEN 生成器，在 SRN 之间仿真 IP 业务流。流量场景定义一组业务流及其包速率、包长和分布。}
- signal: kpi
  text: {en: 'When an experiment ends, the contents of each container''s /logs directory are copied to the NAS. The use cases in the platform paper report downlink throughput, downlink spectral efficiency, CQI, uplink error rate, SINR and the resource allocation ratio.', zh: 实验结束后，各容器 /logs 目录的内容被复制到 NAS。平台论文的用例报告了下行吞吐量、下行频谱效率、CQI、上行误差率、SINR 以及资源分配比例。}
capabilities:
- key: csi
  status: simulate
  note: {en: Channel matrices come from RF scenarios that the user generates and runs on the platform., zh: 信道矩阵来自用户生成并在平台上运行的 RF 场景。}
- key: cir
  status: simulate
  note: {en: 'Each SRN pair has a 512-tap FIR filter, and generated scenarios set only 4 taps non-zero.', zh: 每对 SRN 之间为 512 抽头的 FIR 滤波器，生成的场景中仅 4 个抽头非零。}
- key: paths
  status: simulate
  note: {en: 'The raw ray-tracer output holds per-path delays and gains (tau, h) before the four-tap approximation.', zh: 射线追踪器的原始输出在四抽头近似之前包含逐径时延与增益（tau、h）。}
- {key: interaction, status: unknown}
- key: power
  status: simulate
  note: {en: The generator derives a path-loss matrix (plMatrix) from the channel matrix in each run., zh: 每次运行时，生成器由信道矩阵推导路径损耗矩阵（plMatrix）。}
- {key: iq, status: unknown}
- {key: beam_labels, status: unknown}
- key: position
  status: simulate
  note: {en: Node coordinates and the Time vector are generator outputs for stationary positions or routes., zh: 节点坐标与 Time 向量是生成器对静止位置或路线的输出。}
- key: geometry
  status: simulate
  note: {en: The 3D scene is built from an OpenStreetMap file that the user exports for the chosen area., zh: 三维场景由用户为所选区域导出的 OpenStreetMap 文件构建。}
- key: materials
  status: simulate
  note: {en: Building and terrain materials are set in the ray-tracing configuration., zh: 建筑与地面材料在射线追踪配置中设置。}
- key: rgb
  status: none
  note: {en: 'The platform description lists SDRs, containers and traffic generation, with no camera input.', zh: 平台说明列出 SDR、容器和业务生成，不含摄像头输入。}
- key: depth
  status: none
  note: {en: 'The platform description lists SDRs, containers and traffic generation, with no depth sensing.', zh: 平台说明列出 SDR、容器和业务生成，不含深度感知。}
- key: lidar
  status: none
  note: {en: 'The platform description lists SDRs, containers and traffic generation, with no lidar input.', zh: 平台说明列出 SDR、容器和业务生成，不含激光雷达输入。}
- key: radar
  status: none
  note: {en: 'The platform description lists SDRs, containers and traffic generation, with no radar sensing data.', zh: 平台说明列出 SDR、容器和业务生成，不含雷达感知数据。}
- key: imu
  status: none
  note: {en: 'The platform description lists SDRs, containers and traffic generation, with no inertial sensing.', zh: 平台说明列出 SDR、容器和业务生成，不含惯性感知。}
- key: time_series
  status: simulate
  note: {en: Time-stamped KPI and traffic logs are produced by experiments that the user runs on the platform., zh: 带时间戳的 KPI 与业务日志由用户在平台上运行的实验产生。}
- key: multiuser
  status: simulate
  note: {en: 'SRNs and their traffic flows are set per experiment, up to the platform''s 128 SRNs.', zh: SRN 及其业务流按实验设置，上限为平台的 128 个 SRN。}
- key: multibs
  status: simulate
  note: {en: 'Several base stations run in one experiment, for example the seven base stations of the ColO-RAN experiments.', zh: 同一实验中可运行多个基站，例如 ColO-RAN 实验中的 7 个基站。}
- key: crossfreq
  status: simulate
  note: {en: 'The carrier frequency fc is a generator input, and the SDRs cover 10 MHz to 6 GHz.', zh: 载频 fc 是生成器输入，SDR 覆盖 10 MHz 至 6 GHz。}
- {key: near_field, status: unknown}
- key: high_mobility
  status: simulate
  note: {en: Node routes are generator inputs; the sources read state no maximum speed., zh: 节点路线是生成器输入；所读资料未给出最大速度。}
- {key: dynamic_blockage, status: unknown}
- key: reflection
  status: simulate
  note: {en: The number of reflections is a generator setting; per-path reflection flags are not documented., zh: 反射次数为生成器设置；未记录逐径反射标志。}
- {key: diffraction, status: unknown}
- {key: scattering, status: unknown}
- {key: transmission, status: unknown}
- {key: polarization, status: unknown}
- {key: em_field, status: unknown}
