summary: {en: 'Testbed and emulator: 256 software-defined radios with a hardware channel emulator that produce channel impulse responses, IP traffic flows, and experiment logs including SINR, CQI, and downlink throughput.', zh: 试验平台与仿真器：由 256 台软件定义无线电和硬件信道仿真器组成，生成信道冲激响应、IP 业务流以及包含 SINR、CQI 和下行吞吐量的实验日志。}
sources: ['https://advancedwireless.org/colosseum/', 'https://colosseum.sites.northeastern.edu/', 'https://openrangym.com/experimental-platforms/colosseum', 'https://arxiv.org/abs/2110.10617', 'https://ar5iv.labs.arxiv.org/html/2110.10617', 'https://github.com/Colosseum-MATLAB-Project/ColosseumScenarioGenerator']
checked: '2026-11-06'
pipeline:
  summary: {en: 'A propagation model first generates a programmable FIR scenario. MCHEM connects real SDR signals through these digital channels, and protocol software then produces IQ, logs, and network results.', zh: 传播模型先生成可编程FIR场景，MCHEM把真实SDR的信号通过这些数字信道连接，协议软件再产生IQ、日志和网络结果。}
  stages:
  - title: {en: Select the propagation source and scenario, zh: 选择传播来源与场景}
    detail: {en: The official MATLAB example generates channels from maps and RT. Other inputs may come from measurements or models; preserve their respective provenance., zh: 官方MATLAB示例使用地图和RT生成信道；其他输入可来自测量或模型，须保留各自来源。}
    inputs:
    - {en: OSM/3D environment or existing channels, zh: OSM/三维环境或已有信道}
    - {en: 'Node positions, trajectories, and RF configuration', zh: 节点位置、轨迹和射频配置}
    outputs:
    - {en: Node and scenario configuration, zh: 节点与场景配置}
    - {en: Traceable propagation inputs, zh: 可追溯的传播输入}
    controls:
    - {en: 'Researcher specifies: map, fc, array/orientation, mobility trajectories, and time step', zh: 研究者固定：地图、fc、阵列/朝向、移动轨迹和时间步}
    checks:
    - {en: Distinguish simulated inputs from OTA-measured inputs, zh: 区分模拟输入与OTA测量输入}
    - {en: Check node IDs and coordinate/time indices, zh: 检查节点ID和坐标/时间索引}
  - title: {en: Generate per-link multipath and power, zh: 生成逐链路多径和功率}
    detail: {en: 'Set parameters such as the reflection budget, calculate multipath for node pairs at each mobility instant, and generate channel and pathloss matrices.', zh: 设置反射预算等参数，对节点对和移动时刻计算多径，生成信道及pathloss矩阵。}
    inputs:
    - {en: Scenario and nodes, zh: 场景与节点}
    - {en: MATLAB RT configuration, zh: MATLAB RT配置}
    outputs:
    - {en: chMatrix、plMatrix, zh: chMatrix、plMatrix}
    - {en: coordinates and Time, zh: coordinates与Time}
    controls:
    - {en: 'Researcher specifies: reflection count, path count, antennas, and output normalization', zh: 研究者固定：反射次数、路径数、天线与输出归一化}
    checks:
    - {en: 'Check connected-link indices, zero-path cases, and power units', zh: 检查互通链路索引、零路径和功率单位}
    - {en: Verify stationary-node and mobility-trajectory settings, zh: 核对静止节点与移动轨迹设置}
  - title: {en: Approximate and convert to an FIR scenario, zh: 近似并转换为FIR场景}
    detail: {en: 'The official example approximates multipath with four nonzero taps, outputs RFscenario.mat, and converts it into a format loadable by Colosseum.', zh: 官方示例把多径近似为四个非零tap，输出RFscenario.mat后转换成Colosseum可加载格式。}
    inputs:
    - {en: Per-path delays/gains, zh: 逐径时延/增益}
    - {en: Channel representation supported by MCHEM, zh: MCHEM支持的信道表示}
    outputs:
    - {en: Compressed FIR parameters, zh: 压缩后的FIR参数}
    - {en: MCHEM scenario files, zh: MCHEM场景文件}
    controls:
    - {en: 'Researcher specifies: tap approximation, sampling rate, delay/gain quantization, and update interval', zh: 研究者固定：tap近似、采样率、时延/增益量化和更新时间}
    checks:
    - {en: Compare the PDP/frequency response and total power before and after approximation, zh: 比较近似前后的PDP/频域响应与总功率}
    - {en: Record errors introduced by tap compression, zh: 记录tap压缩造成的误差}
  - title: {en: Configure SDRs and experiment software, zh: 配置SDR与实验软件}
    detail: {en: 'Load software and RF settings onto reserved resources, connect real transceivers to the digital channel emulator, and run network traffic.', zh: 在预约资源上加载软件和射频设置，将真实收发设备接入数字信道仿真器，运行网络业务。}
    inputs:
    - {en: MCHEM scenario, zh: MCHEM场景}
    - {en: Available nodes and container/protocol software, zh: 可用节点与容器/协议软件}
    outputs:
    - {en: Hardware-in-the-loop RF/protocol experiment, zh: 硬件在环射频/协议实验}
    controls:
    - {en: 'Researcher specifies: device mapping, center frequency, bandwidth, gain, protocol stack, and traffic', zh: 研究者固定：设备映射、中心频率、带宽、增益、协议栈和流量}
    checks:
    - {en: 'Check device clocks, power, and the scaling of the input FIR', zh: 核对设备时钟、功率与输入FIR的尺度}
    - {en: Analyze hardware effects separately from propagation-model effects, zh: 将硬件因素与传播模型因素分开分析}
  - title: {en: Collect and organize results, zh: 采集并整理结果}
    detail: {en: 'Collect IQ or protocol traces according to the experiment configuration, associate them with nodes, times, and FIR states, then compute network KPIs.', zh: 按实验配置采集IQ或协议trace，关联节点、时间和FIR状态，再计算网络KPI。}
    inputs:
    - {en: SDR signals, zh: SDR信号}
    - {en: Protocol logs and traffic statistics, zh: 协议日志和业务统计}
    outputs:
    - {en: Enabled IQ/log/KPI outputs, zh: 所启用的IQ/日志/KPI}
    - {en: Experiment and channel configuration records, zh: 实验与信道配置记录}
    controls:
    - {en: 'Researcher specifies: collection points, clock alignment, number of repetitions, and statistics window', zh: 研究者固定：采集点、时钟对齐、重复次数和统计窗口}
    checks:
    - {en: Save channel scenarios and software versions for replay, zh: 保存信道场景和软件版本以便重播}
    - {en: The propagation realism of hardware-in-the-loop results depends on the input scenario, zh: 硬件在环结果的传播真实性取决于输入场景}
  scope: {en: From the official MATLAB RT scenario generator to MCHEM hardware-in-the-loop experiments; other channel inputs require their own provenance., zh: 官方MATLAB RT场景生成器到MCHEM硬件在环实验；其他信道输入需分别追溯。}
