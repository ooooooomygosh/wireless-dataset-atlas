summary: {en: 'Testbed and emulator: 256 software-defined radios with a hardware channel emulator that produce channel impulse responses, IP traffic flows, and experiment logs including SINR, CQI, and downlink throughput.', zh: 试验平台与仿真器：由 256 台软件定义无线电和硬件信道仿真器组成，生成信道冲激响应、IP 业务流以及包含 SINR、CQI 和下行吞吐量的实验日志。}
sources: ['https://advancedwireless.org/colosseum/', 'https://colosseum.sites.northeastern.edu/', 'https://openrangym.com/experimental-platforms/colosseum', 'https://arxiv.org/abs/2110.10617', 'https://ar5iv.labs.arxiv.org/html/2110.10617', 'https://github.com/Colosseum-MATLAB-Project/ColosseumScenarioGenerator', 'https://arxiv.org/abs/2110.10617v1', 'https://arxiv.org/abs/2110.10617v2', 'https://arxiv.org/html/2110.10617v2', 'https://raw.githubusercontent.com/Colosseum-MATLAB-Project/ColosseumScenarioGenerator/master/README.md', 'https://github.com/Colosseum-MATLAB-Project/ColosseumScenarioGenerator/commits/main', 'https://github.com/Colosseum-MATLAB-Project/ColosseumScenarioGenerator/releases', 'https://github.com/Colosseum-MATLAB-Project/ColosseumScenarioGenerator/tags']
checked: '2026-11-06'
pipeline:
  summary: {en: 'The official MATLAB ray-tracing generator turns an OpenStreetMap area and node trajectories into per-link channels, approximates each channel with four non-zero taps, and packages them as an RF scenario. MCHEM applies these FIR channels to the signals of real SDRs on reserved SRNs, and container logs are copied to the NAS when the experiment ends.', zh: 官方 MATLAB 射线追踪生成器将 OpenStreetMap 区域与节点轨迹转换为逐链路信道，每条信道近似为四个非零抽头，并封装为 RF 场景。MCHEM 将这些 FIR 信道作用于预约 SRN 上真实 SDR 的信号，实验结束时容器日志复制到 NAS。}
  scope: {en: From the official MATLAB ray-tracing scenario generator to MCHEM hardware-in-the-loop experiments., zh: 从官方 MATLAB 射线追踪场景生成器到 MCHEM 硬件在环实验。}
  stages:
  - title: {en: Build the ray-traced scenario, zh: 构建射线追踪场景}
    detail: {en: 'The generator takes an OSM 3D model of the area and a node configuration: origin, carrier frequency fc, node powers, heights, antennas and azimuths, stationary positions or routes, sampling interval Ts and scenario duration. Ray-tracing settings include the number of reflections and the building and terrain materials.', zh: 生成器输入区域的 OSM 三维模型和节点配置，包括原点、载频 fc、节点功率、高度、天线与方位角、静止位置或路线、采样间隔 Ts 以及场景时长；射线追踪设置包括反射次数以及建筑和地面材料。}
    inputs:
    - {en: OSM 3D model of the area, zh: 区域的 OSM 三维模型}
    - {en: Node configuration and mobility routes, zh: 节点配置与移动路线}
    controls:
    - {en: 'Researcher sets fc, node antennas and orientations, mobility type, Ts, scenario duration and the number of reflections', zh: 研究者设置 fc、节点天线与朝向、移动类型、Ts、场景时长和反射次数}
  - title: {en: Compute multipath and path loss per snapshot, zh: 逐快照计算多径与路径损耗}
    detail: {en: 'channelSimulator computes the multipath components between each transmitter and receiver at each snapshot, and generatePLmatrix derives the path-loss matrix from the channel matrix.', zh: channelSimulator 为每个快照计算各收发节点对之间的多径分量，generatePLmatrix 由信道矩阵推导路径损耗矩阵。}
    inputs:
    - {en: 'Scenario, nodes and ray-tracing configuration', zh: 场景、节点与射线追踪配置}
    outputs:
    - {en: 'chMatrix, coordinates and Time', zh: chMatrix、coordinates 与 Time}
  - title: {en: Approximate each channel with four non-zero taps, zh: 将每条信道近似为四个非零抽头}
    detail: {en: chApproximation reduces each channel to four non-zero taps that MCHEM can load and returns the approximated channel and path-loss matrices. The result is saved to RFscenario.mat with the metadata required by the Colosseum scenario toolchain., zh: chApproximation 将每条信道近似为 MCHEM 可加载的四个非零抽头，并返回近似后的信道与路径损耗矩阵；结果与 Colosseum 场景工具链所需元数据一并保存为 RFscenario.mat。}
    inputs:
    - {en: Multipath channel matrix from the ray tracer, zh: 射线追踪器输出的多径信道矩阵}
    outputs:
    - {en: 'RFscenario.mat (chMatrix, plMatrix, NodesName, coordinates, Time, origin)', zh: RFscenario.mat（chMatrix、plMatrix、NodesName、coordinates、Time、origin）}
  - title: {en: Run hardware-in-the-loop experiments, zh: 运行硬件在环实验}
    detail: {en: 'Users reserve SRNs on the Colosseum website and choose an LXC image for each node. Containers are instantiated on the SRNs, and colosseumcli starts the RF and traffic scenarios. The RF scenario server feeds the channel taps to MCHEM at run time, and MCHEM processes the signals of the SRN USRPs through the FIR channels.', zh: 用户在 Colosseum 网站预约 SRN，并为每个节点选择 LXC 镜像；容器在 SRN 上实例化，colosseumcli 启动 RF 与业务场景。RF 场景服务器在运行时向 MCHEM 提供信道抽头，MCHEM 通过 FIR 信道处理 SRN 的 USRP 信号。}
    inputs:
    - {en: 'RF scenario, traffic scenario and LXC images', zh: RF 场景、业务场景与 LXC 镜像}
    outputs:
    - {en: Network experiment on real SDR hardware with emulated channels, zh: 使用仿真信道、基于真实 SDR 硬件的网络实验}
    controls:
    - {en: 'Researcher sets the number of SRNs, the LXC image on each node, and the scenarios; batch jobs are specified in JSON files', zh: 研究者设置 SRN 数量、各节点的 LXC 镜像和场景；批处理作业以 JSON 文件描述}
  - title: {en: Collect logs and snapshots, zh: 收集日志与快照}
    detail: {en: 'When the experiment ends, the contents of each container''s /logs directory are copied to the Colosseum NAS, from where the file proxy server retrieves them. Container snapshots can be saved as LXC images on the NAS.', zh: 实验结束后，各容器 /logs 目录的内容被复制到 Colosseum NAS，并可通过文件代理服务器取回；容器快照可以以 LXC 镜像形式保存在 NAS 上。}
    outputs:
    - {en: Container /logs contents and LXC snapshot images on the NAS, zh: NAS 上的容器 /logs 内容与 LXC 快照镜像}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: RFscenario.mat from the official generator; container /logs contents and LXC snapshots saved to the NAS., zh: 官方生成器输出 RFscenario.mat；容器 /logs 内容与 LXC 快照保存在 NAS 上。}
