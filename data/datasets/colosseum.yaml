tools: [project-colosseum-scenario-generator]
overview: {en: 'Colosseum is a remotely accessible wireless network emulator at Northeastern University''s Institute for the Wireless Internet of Things, generally available since October 2, 2020. It uses 256 software-defined radios (NI USRP X310) on 128 Standard Radio Nodes, and the MCHEM channel emulator supports up to 256 × 256 independently customizable channels. The platform emulates RF scenarios of up to 1 km² with up to 65,535 wireless channels and up to 80 MHz of bandwidth, while the SDRs cover 10 MHz to 6 GHz. Each emulated channel is an FIR filter with 512 pre-computed complex-valued taps that represents the channel impulse response between two SRNs. TGEN, based on the NRL MGEN generator, emulates IP traffic flows between the SRNs. The data are produced by the experiments that users run: when an experiment ends, the contents of each container''s /logs directory are copied to the Colosseum NAS. Access is requested through a New Team Request form, and the Experiments Portal requires
    the Colosseum VPN; no data license is stated.', zh: 'Colosseum 是东北大学物联网研究所运营的远程可访问无线网络仿真器，自 2020 年 10 月 2 日起向用户开放。平台由 128 个标准无线电节点（SRN）上的 256 台软件定义无线电（NI USRP X310）组成，MCHEM 信道仿真器支持最多 256 × 256 个可独立配置的信道。平台可仿真面积达 1 km² 的射频场景，信道数最多 65,535 个，带宽最高 80 MHz；SDR 覆盖 10 MHz 至 6 GHz。每个仿真信道是一个 FIR 滤波器，包含 512 个预先计算的复数抽头，表示两个 SRN 之间的信道冲激响应。TGEN 基于 NRL 的 MGEN 生成器，在 SRN 之间仿真 IP 业务流。数据由用户运行的实验产生：实验结束后，每个容器 /logs 目录的内容被复制到 Colosseum NAS。'}
signal_details:
- signal: cir
  text: {en: 'Channel impulse responses are implemented as 512 pre-computed complex-valued FIR taps per pair of SRNs in MCHEM. Because of computational and storage cost, only 4 taps are non-zero in the generated scenarios. The CIR can be derived from channel modeling equations, field measurements or ray-tracing tools. The official MATLAB generator saves chMatrix, plMatrix, NodesName, coordinates and Time, together with origin, to RFscenario.mat.', zh: 信道冲激响应在 MCHEM 中以每对 SRN 之间 512 个预先计算的复数 FIR 抽头实现。由于计算与存储成本，生成的场景中仅 4 个抽头为非零值。CIR 可由信道建模公式、实测或光线追踪工具得到。官方 MATLAB 生成器将 chMatrix、plMatrix、NodesName、coordinates 和 Time 以及 origin 保存至 RFscenario.mat。}
- signal: traffic
  text: {en: 'TGEN, based on the NRL MGEN generator, emulates IP traffic flows between the SRNs. A traffic scenario defines the set of flows together with their packet rate, packet size and distribution.', zh: TGEN 基于 NRL 的 MGEN 生成器，在 SRN 之间仿真 IP 业务流。流量场景定义一组业务流及其包速率、包长和分布。}
- signal: kpi
  text: {en: 'Experiment logs from each container''s /logs directory, copied to the NAS when the experiment ends. The platform paper''s use cases report downlink throughput, downlink spectral efficiency, CQI, uplink error rate, SINR and the resource allocation ratio. The sources give no log file schema.', zh: 实验日志来自每个容器的 /logs 目录，实验结束后复制到 NAS。平台论文的用例报告了下行吞吐量、下行频谱效率、CQI、上行误差率、SINR 和资源分配比例。}
