- {en: RT/measurements or models supply channels, zh: RT/测量或模型提供信道}
- {en: Convert to emulator FIR parameters, zh: 转换为 emulator FIR 参数}
- {en: MCHEM and real SDR hardware, zh: MCHEM 与真实 SDR 硬件}
- {en: Real software protocol stacks and traffic, zh: 真实软件协议栈和业务}
