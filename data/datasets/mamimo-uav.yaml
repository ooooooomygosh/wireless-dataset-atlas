summary: {en: 'CSI estimated from pilot sequences sent by a drone flying several trajectories on the KU Leuven campus, received at a base station with an 8×8 rectangular patch array on a parking lot. The dataset is distributed as a 15.8 GB ZIP file.', zh: 无人机在 KU Leuven 校园内沿若干轨迹飞行并发送导频序列，停车场上 8×8 矩形贴片天线阵列的基站据此估计信道状态信息（CSI）。数据集以 15.8 GB 的 ZIP 文件分发。}
sources: ['https://rdr.kuleuven.be/dataset.xhtml?persistentId=doi%3A10.48804%2F0IMQDF', 'https://rdr.kuleuven.be/api/datasets/:persistentId/?persistentId=doi:10.48804/0IMQDF', 'https://api.crossref.org/works/10.1109/TVT.2023.3340447', 'https://rdr.kuleuven.be/api/datasets/:persistentId/versions/:latest/files?persistentId=doi:10.48804/0IMQDF', 'https://rdr.kuleuven.be/api/access/datafile/119635', 'https://rdr.kuleuven.be/api/access/datafile/119650', 'https://rdr.kuleuven.be/api/access/datafile/119647', 'https://rdr.kuleuven.be/api/access/datafile/119645', 'https://rdr.kuleuven.be/api/access/datafile/119646', 'https://api.openalex.org/works/doi:10.1109/TVT.2023.3340447', 'https://arxiv.org/pdf/2310.06579', 'https://rdr.kuleuven.be/api/datasets/:persistentId/versions?persistentId=doi:10.48804/0IMQDF', 'https://arxiv.org/abs/2310.06579']
