pipeline:
  summary: {en: 'A UAV flies over the campus and sends uplink pilots, and a sky-facing 8×8 array at the base station estimates the channel. The release provides BIN channels, CSV flight logs and two Python scripts that combine them.', zh: UAV在校园上空飞行并发送上行导频，基站处朝向天空的8×8阵列估计信道。发布内容包括BIN信道、CSV飞行日志以及将二者结合的两个Python脚本。}
  scope: {en: KU Leuven RDR V3 air-to-ground CSI from a single UAV to a 64-antenna ground base station., zh: KU Leuven RDR V3单UAV到64天线地面基站的空地CSI。}
  stages:
  - title: {en: Place the array and fly the UAV, zh: 部署阵列并飞行UAV}
    detail: {en: 'A base station on the ESAT parking lot uses an 8×8 rectangular patch array pointing towards the sky. A drone flew several trajectories over the KU Leuven campus. In the analysis paper''s campaign, the BS array was 11 m high, the UAV flew at 8, 11 and 24 m, and the flight speed was 1.5 m/s.', zh: ESAT停车场的基站采用朝向天空的8×8矩形贴片阵列。无人机在KU Leuven校园上空飞行了多条轨迹。分析论文的测量中，基站阵列高11 m，无人机飞行高度为8、11和24 m，飞行速度为1.5 m/s。}
    outputs:
    - {en: Flight trajectories and array deployment, zh: 飞行轨迹与阵列部署}
  - title: {en: Transmit pilots and estimate the channel, zh: 发送导频并估计信道}
    detail: {en: 'The UAV transmits an LTE-compliant OFDM sounding signal built from a Zadoff-Chu sequence, and the paper logs CSI every 1 ms. The base station uses 32 USRPs with two channels each to serve 64 patch antennas, with one 10 MHz GPS-disciplined oscillator reference distributed through octo-clock splitters. The OFDM signal has 100 subcarriers at 180 kHz spacing, 18 MHz in total, at a 2.610 GHz carrier.', zh: UAV发送由Zadoff-Chu序列构成的、符合LTE标准的OFDM探测信号，论文中每1 ms记录一次CSI。基站使用32个USRP（每个两路通道）服务64个贴片天线，并由一个10 MHz GPS驯服振荡器经octo-clock分配器提供参考时钟。OFDM信号包含100个子载波，间隔180 kHz，总带宽18 MHz，载频为2.610 GHz。}
    inputs:
    - {en: UAV uplink sounding signal, zh: UAV上行探测信号}
    - {en: Receive observations from 64 array elements, zh: 64个阵元的接收观测}
    outputs:
    - {en: Array CSI that varies along the flight, zh: 随飞行变化的阵列CSI}
  - title: {en: Log GPS and align it with channels, zh: 记录GPS并与信道对齐}
    detail: {en: 'The UAV GPS was logged every 10 ms in the paper''s campaign. The released CSV logs contain time in milliseconds, UTC datetime, latitude, longitude, height and speed, with height in feet and speed in mph. prepare_data.py converts height and speed to metric units and linearly interpolates GPS to the channel sampling times of each measurement.', zh: 分析论文的测量中，UAV的GPS每10 ms记录一次。发布的CSV日志包含毫秒时间、UTC时间、纬度、经度、高度和速度，其中高度单位为英尺，速度单位为mph。prepare_data.py将高度与速度换算为公制单位，并将GPS线性插值到每次测量的信道采样时刻。}
    inputs:
    - {en: GPS and drone telemetry, zh: GPS与无人机遥测}
    outputs:
    - {en: CSV flight logs and GPS aligned to each BIN measurement, zh: CSV飞行日志及与每个BIN测量对齐的GPS}
  - title: {en: Store CSI as BIN tensors, zh: 以BIN张量存储CSI}
    detail: {en: 'Each BIN file holds one measurement as big-endian signed 16-bit values scaled by 2^-8. binary_interpreter.py reads it into a complex tensor of shape (symbols, antennas, users, subcarriers), which for these files is (S, 64, 1, 100). The file name carries the start time and acquisition settings.', zh: '每个BIN文件保存一次测量，内容为大端有符号16位整数并乘以2^-8。binary_interpreter.py将其读取为复数张量，形状为（符号数, 天线数, 用户数, 子载波数），对这些文件即（S, 64, 1, 100）。文件名包含开始时间与采集设置。'}
    inputs:
    - {en: Channel estimates from the sounder, zh: 探测器输出的信道估计}
    outputs:
    - {en: 'BIN complex channels, CSV logs and Python readers', zh: BIN复数信道、CSV日志与Python读取脚本}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: '• BIN channel data (14 measurement files)

      • CSV GPS, time and drone-metric logs (23 files)

      • Python scripts binary_interpreter.py and prepare_data.py', zh: '• BIN信道数据（14个测量文件）

      • CSV的GPS、时间与无人机指标日志（23个文件）

      • Python脚本binary_interpreter.py与prepare_data.py'}
- label: {en: Combined records, zh: 合并记录}
  text: {en: '• prepare_data.py selects the GPS rows inside each measurement''s time window and pairs them with that channel file, after converting feet to metres and mph to m/s.', zh: • prepare_data.py在每次测量的时间窗口内选取GPS记录，与对应信道文件配对，并将英尺换算为米、mph换算为m/s。}
- label: {en: Requirements, zh: 依赖环境}
  text: {en: '• The README says the scripts were written for Python 3.8.10. requirements.txt pins numpy 1.23.3, pandas 1.5.2, scipy 1.9.1 and tqdm 4.64.1; plotting also needs matplotlib 3.6.0 and Cartopy 0.21.1.', zh: • README称脚本基于Python 3.8.10编写。requirements.txt固定了numpy 1.23.3、pandas 1.5.2、scipy 1.9.1与tqdm 4.64.1；绘图还需要matplotlib 3.6.0与Cartopy 0.21.1。}
provenance:
- {en: UAV trajectories on the KU Leuven campus → uplink pilot transmission, zh: KU Leuven校园UAV航迹 → 上行pilot发送}
- {en: Sky-facing 8×8 antenna array reception → channel estimation, zh: 8×8天线阵列朝天接收 → 信道估计}
- {en: 'CSI, GPS, and acquisition parameters → bin/csv files and loading scripts', zh: CSI、GPS和采集参数 → bin/csv及读取脚本}
technical_notes:
- {en: 'Confirmed: the base station array is a uniform rectangular array of 8×8 patch elements (64 elements), as stated in the release and in the analysis paper.', zh: 已确认：基站阵列为8×8矩形贴片均匀阵列（64个阵元），与发布说明及分析论文一致。}
- {en: 'Confirmed: the paper''s sounder uses 32 USRPs with two channels each and one 10 MHz GPS-disciplined oscillator reference distributed through octo-clock splitters.', zh: 已确认：论文测量系统使用32个USRP（每个两路通道），并由一个10 MHz GPS驯服振荡器经octo-clock分配器提供参考时钟。}
- {en: 'The paper''s campaign used a base-station receive gain of 15 dB. The release also contains g30.0 files, so the gain must be read from each file name.', zh: 论文测量的基站接收增益为15 dB。发布数据还包含g30.0文件，因此需从各文件名读取增益。}
- {en: Each BIN file is read as big-endian signed 16-bit values scaled by 2^-8. Odd-indexed values form the real part and even-indexed values the imaginary part (binary_interpreter.py)., zh: 每个BIN文件按大端有符号16位整数读取并乘以2^-8。奇数位为实部，偶数位为虚部（binary_interpreter.py）。}
limitations:
- {en: 'The release covers one fixed base station, so it contains no unseen-base-station test condition.', zh: 发布数据仅包含一个固定基站，因此不含未见基站的测试条件。}
- {en: 'Every BIN file has one user layer (l1), so the release contains no multi-user channel tensors.', zh: 所有BIN文件均为一个用户层（l1），因此发布数据不含多用户信道张量。}
- {en: 'The 2022 and 2023 files differ in symbol count, subsample rate and gain (for example s40000 with sr1 and g15.0 against s50000 with sr2 and g30.0), so the files are not uniform.', zh: 2022年与2023年文件在符号数、子采样率与增益上不同（例如s40000、sr1、g15.0与s50000、sr2、g30.0），因此文件并不一致。}
history:
- {en: '2023-06-22: first public record in the KU Leuven RDR (publication date).', zh: 2023-06-22：首次在KU Leuven RDR公开（发布日期）。}
- {en: '2024-05: the analysis paper was published in IEEE TVT, volume 73, issue 5 (Crossref).', zh: 2024年5月：分析论文发表于IEEE TVT第73卷第5期（据Crossref）。}
- {en: '2026-10-02: version 3.0 was released on the portal; some files keep the 2023-06-22 publication date.', zh: 2026-10-02：门户发布3.0版；部分文件保留2023-06-22的发布日期。}
usage:
- {en: Read README.txt and the two scripts before parsing; the README defines the file-name fields., zh: 解析前先阅读README.txt与两个脚本；README定义了文件名字段。}
- {en: 'Read BIN files with binary_interpreter.py (read_channel_file), and align them with the CSV logs by time using prepare_data.py.', zh: 使用binary_interpreter.py（read_channel_file）读取BIN文件，并用prepare_data.py按时间与CSV日志对齐。}
- {en: Downloads require a guestbook. The portal offers the whole release as a 15.8 GB ZIP or as individual files., zh: 下载需填写guestbook。门户提供整包15.8 GB的ZIP，也可单独下载各文件。}
- {en: Cite the dataset in the form shown on its dataset page; the license is CC BY-NC 4.0., zh: 按数据集页面给出的格式引用；许可为CC BY-NC 4.0。}
field_notes:
- label: {en: Paths, zh: 路径}
  text: {en: 'The release has no per-path delays, angles or interaction records. It supplies channel tensors, GPS and flight logs, and scripts.', zh: 发布数据不含逐径时延、角度或交互记录；仅提供信道张量、GPS与飞行日志及脚本。}
- label: {en: Geometry, zh: 几何}
  text: {en: 'In the analysis paper''s campaign, the BS array was 11 m high and the UAV flew at 8, 11 and 24 m, at a constant 1.5 m/s along a straight line.', zh: 分析论文的测量中，基站阵列高11 m，无人机以8、11和24 m的高度、恒定1.5 m/s沿直线飞行。}
overview: {en: 'The MaMIMO-UAV 3D Channel State Information dataset was released by Colpaert, Thys, Cui and Pollin of KU Leuven (ESAT) through the KU Leuven Research Data Repository, with a publication date of 22 June 2023. A base station on the parking lot in front of the ESAT building has an 8×8 rectangular patch array of 64 elements pointing towards the sky. A drone flew several trajectories over the KU Leuven campus while transmitting pilot sequences, and the channel between the drone and the base station is estimated from those pilots. The release contains 43 public files: 14 BIN channel measurements recorded on 21 June 2022 and 16 March 2023, 23 CSV flight logs with GPS and drone metrics, two Python scripts, two figures, a README and a requirements file. The full download is a 15.8 GB ZIP, and access requires filling in a guestbook. The dataset is licensed under CC BY-NC 4.0. The analysis paper, 3D Non-Stationary Channel Measurement and Analysis for MaMIMO-UAV Communications, appeared
    in IEEE Transactions on Vehicular Technology in 2024.', zh: MaMIMO-UAV 3D信道状态信息数据集由KU Leuven（ESAT）的Colpaert、Thys、Cui和Pollin通过KU Leuven研究数据存储库发布，发布日期为2023年6月22日。ESAT大楼前停车场的基站设有64个阵元的8×8矩形贴片阵列，阵面朝向天空。无人机在KU Leuven校园内沿若干轨迹飞行并发送导频序列，无人机与基站之间的信道由这些导频估计得到。数据集共43个文件：14个BIN信道测量（记录日期为2022年6月21日和2023年3月16日）、23个含GPS与无人机指标的CSV飞行日志、2个Python脚本、2张图，以及README和依赖文件。完整下载为15.8 GB的ZIP包，访问需填写guestbook。数据采用CC BY-NC 4.0许可。相关分析论文《3D Non-Stationary Channel Measurement and Analysis for MaMIMO-UAV Communications》于2024年发表于IEEE Transactions on Vehicular Technology。}
signal_details:
- signal: csi
  text: {en: 'Channel estimates from uplink pilot sequences sent by the drone and received by a base station with an 8×8 rectangular patch array of 64 elements. Each BIN file is one measurement with a tensor of shape S×M×N×F: S captured channels, M = 64 antennas, N users, F = 100 subcarriers. File names encode the start time, antenna count (n64), user layers (l1 means one user), captured symbols (s), subsample rate (sr1 = 0.5 ms, sr2 = 1 ms), center frequency (f2.610G) and receive gain in dB (g15.0 or g30.0).', zh: 由无人机发送的上行导频序列估计得到的信道，基站接收端为8×8矩形贴片阵列，共64个阵元。每个BIN文件为一次测量，张量形状为S×M×N×F：S为采集的信道数，M = 64个天线，N为用户数，F = 100个子载波。文件名包含开始时间、天线数（n64）、用户层（l1表示1个用户）、采集符号数（s）、子采样率（sr1 = 0.5 ms，sr2 = 1 ms）、中心频率（f2.610G）以及接收增益（dB，g15.0或g30.0）。}
bandwidth_mhz: 18
subcarriers: 100
samples: 14 BIN channel measurements and 23 CSV flight logs
capabilities:
- key: csi
  status: provided
  note: {en: 'Complex channel tensors per BIN file, shaped S x 64 x 1 x 100 (64 BS antennas, one user layer, 100 subcarriers).', zh: 每个BIN文件为复信道张量，形状为S×64×1×100（64个基站天线、一个用户层、100个子载波）。}
- {key: cir, status: unknown}
- key: paths
  status: none
  note: {en: 'The README lists no per-path delays, angles or interaction records; the release holds channel tensors, GPS logs and scripts.', zh: README未列出逐径时延、角度或交互记录；发布内容包括信道张量、GPS日志与脚本。}
- key: interaction
  status: none
  note: {en: The release contains no per-path interaction records., zh: 发布内容不含逐径交互记录。}
- key: power
  status: derivable
  note: {en: prepare_data.py computes power as the sum of |H|^2 over antennas and subcarriers; no power field is stored., zh: prepare_data.py将功率计算为各天线与子载波上|H|^2之和；数据中未存储功率字段。}
- key: iq
  status: none
  note: {en: 'The BIN files hold channel estimates from pilots, not raw receiver I/Q samples.', zh: BIN文件保存由导频得到的信道估计，而非原始接收I/Q采样。}
- key: beam_labels
  status: derivable
  note: {en: Beam labels are not stored; they can be computed from the 64-element channel tensors with a chosen codebook., zh: 数据中未存储波束标签；可用所选码本由64阵元信道张量计算。}
- key: position
  status: provided
  note: {en: 'UAV latitude, longitude and height come from the CSV logs and are aligned to each measurement by prepare_data.py.', zh: UAV的纬度、经度与高度来自CSV日志，由prepare_data.py与每次测量对齐。}
- key: geometry
  status: none
  note: {en: The release has no 3D scene or map files; its only campus figure is a trajectory plot., zh: 发布内容没有三维场景或地图文件；仅有一张校园轨迹图。}
- key: materials
  status: none
  note: {en: The release has no material parameters., zh: 发布内容不含材料参数。}
- key: rgb
  status: none
  note: {en: The release has no camera images., zh: 发布内容不含相机图像。}
- key: depth
  status: none
  note: {en: The release has no depth data., zh: 发布内容不含深度数据。}
- key: lidar
  status: none
  note: {en: The release has no lidar data., zh: 发布内容不含激光雷达数据。}
- key: radar
  status: none
  note: {en: The release has no radar data., zh: 发布内容不含雷达数据。}
- {key: imu, status: unknown}
- key: time_series
  status: provided
  note: {en: 'Each BIN file is an ordered sequence of S channels at 0.5 ms (sr1) or 1 ms (sr2) spacing, with the start time in the file name.', zh: 每个BIN文件是按0.5 ms（sr1）或1 ms（sr2）间隔排列的S个信道的有序序列，起始时间在文件名中。}
- key: multiuser
  status: none
  note: {en: 'Every BIN file has one user layer (l1), so the release holds one UAV.', zh: 每个BIN文件仅有一个用户层（l1），因此发布内容只包含一架UAV。}
- key: multibs
  status: none
  note: {en: The release covers one fixed base station., zh: 发布内容仅覆盖一个固定基站。}
- key: crossfreq
