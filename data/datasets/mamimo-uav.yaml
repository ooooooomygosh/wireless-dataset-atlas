used_in: []
citing: ['doi:10.1109/twc.2025.3537766', 'doi:10.1109/jiot.2025.3560358', 'doi:10.1109/tccn.2025.3587802']
summary: {en: 'CSI estimated from pilot sequences sent by a drone flying several trajectories on the KU Leuven campus, received at a base station with an 8×8 rectangular patch array on a parking lot. The dataset is distributed as a 15.8 GB ZIP file.', zh: 无人机在 KU Leuven 校园内沿若干轨迹飞行并发送导频序列，停车场上 8×8 矩形贴片天线阵列的基站据此估计信道状态信息（CSI）。数据集以 15.8 GB 的 ZIP 文件分发。}
sources: ['https://rdr.kuleuven.be/dataset.xhtml?persistentId=doi%3A10.48804%2F0IMQDF', 'https://rdr.kuleuven.be/api/datasets/:persistentId/?persistentId=doi:10.48804/0IMQDF', 'https://api.crossref.org/works/10.1109/TVT.2023.3340447']
checked: '2026-11-06'
pipeline:
  summary: {en: A UAV flies over the campus and transmits uplink pilots; a sky-facing 8×8 array estimates the channel. GPS and acquisition settings accompany the BIN/CSV data and are read with official Python scripts., zh: UAV在校园飞行并发送上行pilot，朝天的8×8阵列估计信道；GPS与采集设置随BIN/CSV数据发布，由官方Python脚本读取。}
  stages:
  - title: {en: Deploy the ground array and define UAV trajectories, zh: 部署地面阵列与UAV航迹}
    detail: {en: The ground-based 64-antenna rectangular array points skyward while the UAV follows actual flight trajectories. The current public record specifies a 2.610 GHz carrier., zh: 地面64天线矩形阵列朝向空中，UAV沿实际航迹飞行。当前公开记录的载频为2.610 GHz。}
    inputs:
    - {en: Campus environment and flight routes, zh: 校园场景和飞行路线}
    - {en: Ground-based 8×8 patch array and a single UAV transmitter, zh: 地面8×8 patch阵列与单UAV发射机}
    outputs:
    - {en: Actual flights and array deployment, zh: 真实飞行和阵列部署}
    - {en: Trajectory/file identity, zh: 航迹/文件身份}
    controls:
    - {en: 'Use the parameters and files corresponding to RDR V3, preserving array orientation.', zh: 使用RDR V3对应参数和文件，保留阵列朝向}
    checks:
    - {en: 'Reproduction check: verify antenna coordinates, the GPS coordinate reference, and the altitude definition.', zh: 复现检查：核对天线坐标、GPS坐标基准与高度定义}
  - title: {en: Transmit pilots and estimate array channels, zh: 发送pilot并估计阵列信道}
    detail: {en: 'The base station estimates the complex UAV-to-array channel using uplink pilots. Measurements include actual propagation effects as well as attitude, antenna directivity, and RF-chain effects.', zh: 基站用上行pilot估计UAV至阵列的复数信道，测量包含实际传播及姿态、天线方向性和射频链影响。}
    inputs:
    - {en: UAV uplink training signals, zh: UAV上行训练信号}
    - {en: Receive observations from 64 array channels, zh: 64路阵列接收观测}
    outputs:
    - {en: Array CSI varying over the flight, zh: 随飞行变化的阵列CSI}
    controls:
    - {en: The reviewed data record does not fully specify clock distribution or residual calibration errors; reproduction requires reading the parameters included in the package., zh: 已读数据记录未完整披露时钟分配和标定残差，复现需读取包内参数}
    checks:
    - {en: 'Reproduction check: inspect faulty antennas, amplitude/phase jumps, SNR, and sampling intervals first; record hardware gain changes.', zh: 复现检查：先检查坏天线、幅相跳变、SNR与采样间隔；记录硬件增益变化}
  - title: {en: 'Release CSI, GPS, and loading code', zh: 发布CSI、GPS与读取代码}
    detail: {en: 'The records are organized as BIN channels, CSV labels/logs, and Python loading code. Associations between current positions and channel records are recovered from the data records and loading scripts.', zh: 原始记录以BIN信道、CSV标签/日志和Python读取代码组织。当前位置与信道记录的关联按数据记录及读取脚本恢复。}
    inputs:
    - {en: Channel estimates, zh: 信道估计}
    - {en: GPS and acquisition parameters, zh: GPS和采集参数}
    outputs:
    - {en: BIN complex channels, zh: BIN复数信道}
    - {en: CSV positioning/log records, zh: CSV定位/日志}
    - {en: Python reader, zh: Python reader}
    controls:
    - {en: The current portal lists 43 files totaling 15.8 GB; the file count is not the trajectory count., zh: 当前门户43个文件、集合15.8 GB；文件数不代表轨迹数}
    checks:
    - {en: 'Reproduction check: verify BIN dtype, endianness, axis order, and CSV time correspondence; inspect missing GPS samples and altitude anomalies.', zh: 复现检查：验证BIN dtype、endianness、轴顺序和CSV时间对应；核查GPS缺测与高度异常}
  - title: {en: Construct tasks using complete flights, zh: 按完整飞行构建任务}
    detail: {en: 'For positioning or prediction experiments, group by flight/run before constructing history windows and future targets. Beam tasks require explicit antenna coordinates and a codebook; first calculate oracle gains from the measured channels.', zh: 定位或预测实验先按飞行/run分组，再建立历史窗口和未来目标。波束任务需要显式给出阵列坐标与码本，先用实测信道计算oracle收益。}
    inputs:
    - {en: 'CSI, GPS, time, and flight identity', zh: CSI、GPS、时间与飞行身份}
    outputs:
    - {en: Flight-level splits, zh: 飞行级split}
    - {en: Prediction windows or derived beam gains, zh: 预测窗口或派生beam收益}
    controls:
    - {en: 'Keep GPS interpolation, normalization, and target construction causal; extensions from single-UAV observations to multiuser settings require separate assumptions.', zh: GPS插值、归一化和目标构造保持因果；单UAV观测的多用户扩展另设假设}
    checks:
    - {en: 'Reproduction check: inspect future-GPS leakage, adjacent windows crossing splits, and repeated acquisitions along the same route.', zh: 复现检查：检查未来GPS泄漏、相邻窗口跨split及同一路线重复采集}
  scope: {en: KU Leuven RDR V3 air-to-ground CSI from a single UAV to a 64-antenna ground base station., zh: KU Leuven RDR V3单UAV到64天线地面基站的空地CSI。}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: '• BIN channel data

      • CSV GPS/acquisition records

      • Official Python loading scripts', zh: '• BIN信道数据

      • CSV GPS/采集记录

      • 官方Python读取脚本'}
- label: {en: Derived outputs, zh: 派生输出}
  text: {en: '• Angle/spatial-correlation estimates

      • Fixed-codebook responses and beam labels

      • Flight-level prediction samples and splits', zh: '• 角度/空间相关估计

      • 固定码本响应与beam标签

      • 飞行级预测样本与split'}
- label: {en: Reproduction notes, zh: 复现说明}
  text: {en: '• Verify clocking, calibration, and GPS association accuracy from the files/code during the first load; do not infer an error bound from the term “real-time.”

      • This review verified the data record and format; no BIN samples were read.', zh: '• 时钟、校准及GPS关联精度应在首次加载时从文件/代码核实，不据“实时”一词补出误差界。

      • 本轮确认数据记录与格式，未读取BIN样本。'}
provenance:
- {en: UAV trajectories on the KU Leuven campus → uplink pilot transmission, zh: KU Leuven校园UAV航迹 → 上行pilot发送}
- {en: Sky-facing 8×8 antenna array reception → channel estimation, zh: 8×8天线阵列朝天接收 → 信道估计}
- {en: 'CSI, GPS, and acquisition parameters → bin/csv files and loading scripts', zh: CSI、GPS和采集参数 → bin/csv及读取脚本}
technical_notes:
- {en: 'Verified: actual flights and an 8×8 rectangular patch array at a single base station.', zh: 已确认：真实飞行与单基站8×8矩形patch阵列。}
- {en: 'Inference: actual attitude and hardware variations affect the channel; position changes must be distinguished from antenna directivity effects.', zh: 推断：真实姿态与硬件变化会进入信道，需区分位置变化和天线方向性影响。}
limitations:
- {en: Random frame splits within the same flight can cause leakage., zh: 同一flight随机帧拆分易泄漏。}
- {en: A single fixed BS does not directly test generalization to unseen BSs., zh: 固定单BS不能直接验证unseen-BS泛化。}
- {en: The generic pop-up text on the RDR website does not establish that this dataset is restricted; the actual file table marks the files as Public., zh: RDR网页通用弹窗文本不是该数据真的受限；实际文件表标Public。}
history:
- {en: '2023-06-22: first public RDR record.', zh: 2023-06-22：RDR首次公开记录。}
- {en: '2024: original analysis paper in TVT.', zh: 2024：TVT原始分析论文。}
- {en: '2026-11-05: the portal lists V3.0. Some files have a publication date of 2026-10-02; this is not inferred to be the release date of the entire version.', zh: 2026-11-05：门户标V3.0；部分文件发布日期2026-10-02，未推断为全版本发布日期。}
usage:
- {en: 'Read the official Python instructions first, verify the n64 and frequency fields for each file, then associate the GPS records.', zh: 先读取官方Python说明，核对每文件n64和频率字段，再关联GPS。}
- {en: 'Preserve flight/run groups; compare persistence, a constant-velocity position baseline, and the oracle beam.', zh: 保留flight/run分组；比較persistence、恒速位置基线与oracle beam。}
field_notes:
- label: {en: Paths, zh: 路径}
  text: {en: 'This field refers to per-path angles at both link ends and interaction records, which the public interface does not provide. Angles, spatial correlation, and related parameters can be estimated from complex array channels. The release record does not directly supply per-path geometric interaction ground truth; estimates depend on array calibration and channel dimensions.', zh: 本栏指逐径双端角度/交互记录，公开接口不提供。可基于复数阵列信道估计角度/空间相关等参数；发布记录没有直接给出逐路径几何交互真值，估计结果取决于阵列标定和信道维度。}
overview: {en: 'The MaMIMO-UAV 3D Channel State Information dataset was released by Colpaert, Thys, Cui and Pollin of KU Leuven (ESAT) through the KU Leuven Research Data Repository, with a publication date of 22 June 2023. The related paper, 3D Non-Stationary Channel Measurement and Analysis for MaMIMO-UAV Communications, appeared in IEEE Transactions on Vehicular Technology in 2024. A base station on the parking lot in front of the ESAT building uses an 8×8 rectangular patch array pointing towards the sky. A drone flew several trajectories on the KU Leuven campus while transmitting pilot sequences, and the channel between the drone and the base station is estimated from those pilots. File names carry dates from 21 June 2022 and 16 March 2023. The release contains 43 public files, distributed as a 15.8 GB ZIP archive, in BIN data, CSV and Python code formats. The dataset is licensed under CC BY-NC 4.0, and access requires a guestbook.', zh: MaMIMO-UAV 3D 信道状态信息数据集由 KU Leuven（ESAT）的 Colpaert、Thys、Cui
    和 Pollin 通过 KU Leuven 研究数据存储库发布，发布日期为 2023 年 6 月 22 日。相关论文 3D Non-Stationary Channel Measurement and Analysis for MaMIMO-UAV Communications 发表于 2024 年的 IEEE Transactions on Vehicular Technology。ESAT 大楼前停车场的基站使用 8×8 矩形贴片阵列，阵面朝向天空。无人机在 KU Leuven 校园内沿若干轨迹飞行并发送导频序列，无人机与基站之间的信道由这些导频估计得到。文件名中包含的日期为 2022 年 6 月 21 日和 2023 年 3 月 16 日。数据集共 43 个公开文件，以 15.8 GB 的 ZIP 压缩包分发，格式为 BIN 数据、CSV 和 Python 代码。数据采用 CC BY-NC 4.0 许可，访问需填写 guestbook。}
signal_details:
- signal: csi
  text: {en: 'Channel estimated from pilot sequences transmitted by the drone and received at the base station, which has an 8×8 rectangular patch array of 64 elements. Data files are BIN; the file names contain n64, s40000, s50000 or s80000, sr1 or sr2, f2.610G, and g15.0 or g30.0. The record does not define these name fields.', zh: 由无人机发送的导频序列估计得到，基站接收端为 8×8 矩形贴片阵列，共 64 个阵元。数据文件为 BIN 格式，文件名中包含 n64、s40000、s50000 或 s80000、sr1 或 sr2、f2.610G、g15.0 或 g30.0。记录中未定义这些文件名字段。}
