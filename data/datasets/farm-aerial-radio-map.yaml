limitations:
- {en: 'The repository tree has no files for P1, F1, D7, D8 or D9, although the README table lists these groups.', zh: '仓库文件树中没有 P1、F1、D7、D8、D9 的文件，但 README 表格列出了这些数据组。'}
- {en: 'D6 is present only as unpacked .npy files for scenes 52 and 53. Only freq21 and freq33 folders appear, while the README lists 3.5 GHz for D6.', zh: 'D6 仅以解压后的 .npy 文件形式存在，涉及场景 52 与 53，且只出现 freq21 与 freq33 文件夹，而 README 列出 D6 含 3.5 GHz。'}
- {en: 'The README gives a volume of 15,000 per group. The repository does not state how this maps to files.', zh: 'README 给出每组体量为 15,000，但仓库未说明该数字与文件的对应关系。'}
- {en: 'The release holds RSS maps only. Path-level outputs and the 3D scene files are not described.', zh: '发布内容仅含 RSS 地图，文档未描述路径级输出与三维场景文件。'}
- {en: 'Sionna RT version, the material settings and the metric grid spacing of the 512 x 512 maps are not stated in the sources.', zh: '来源未说明 Sionna RT 版本、材料设置以及 512 x 512 地图的实际网格间距。'}
- {en: 'The README states that a fuller ARM-Omni release is planned.', zh: 'README 称计划在后续版本中发布更完整的 ARM-Omni 数据。'}
technical_notes:
- {en: 'Scene IDs are not continuous across dataset groups. Use the extracted folder names as the authoritative scene IDs.', zh: '场景编号在各数据组之间不连续，应以解压后的文件夹名作为场景编号。'}
facts:
- label: {en: File naming, zh: 文件命名}
  text: {en: 'Files follow <dataset>/<scene_id>/<frequency>/<antenna_pattern>/tx<ID>_yaw<VALUE>.npy, for example D1/7/freq59/iso/tx45_yaw0.npy. The README does not define the frequency codes.', zh: '文件路径格式为 <dataset>/<scene_id>/<frequency>/<antenna_pattern>/tx<ID>_yaw<VALUE>.npy，例如 D1/7/freq59/iso/tx45_yaw0.npy。README 未定义频率代码。'}
