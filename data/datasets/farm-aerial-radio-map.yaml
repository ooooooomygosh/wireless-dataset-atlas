summary: {en: 'Ray-traced aerial radio maps from ARM-Omni at 2.1 to 7.1 GHz, with receiver heights up to 150 m and 30, 60 and 120 degree and isotropic antenna patterns, for training and evaluating the FARM model.', zh: '由 ARM-Omni 光线追踪生成的低空无线电地图，频率 2.1 至 7.1 GHz，接收高度最高 150 m，包含 30 度、60 度、120 度波束与全向天线方向图，用于 FARM 模型的训练与评估。'}
overview: {en: 'The FARM Aerial Radio Map (ARM) dataset is released on Hugging Face with the FARM paper (arXiv:2604.17362). It was generated with ARM-Omni, which uses the TensorFlow-based ray tracer Sionna RT. The paper collects 130 urban scenes from OpenStreetMap. It builds a 3D urban environment from building footprints and elevation data and derives a height map at 1 m resolution for each 1000 m x 1000 m area. For each scenario, 100 transmitter positions are sampled with a grid-based strategy. The README lists 13 groups: D1 to D10, P1, F1 and A1. The carriers are 2.1, 2.6, 3.3, 3.5, 4.9, 5.9 and 7.1 GHz. The maximum receiver height is 100 to 150 m. The antenna patterns are 30 degree, 60 degree, 120 degree and isotropic. Most groups use a 512 x 512 map grid, and P1 uses 256 x 256. Each file holds one volume of shape 1 x 30 x 512 x 512, with 30 receiver height layers and one radio-map channel. The values are received signal strength (RSS) encoded as uint8. The no-signal threshold of -120 dB corresponds to the value 130. Building pixels have the value 0 in every layer. Each scene is stored as one .tar.gz archive. After extraction, the .npy files are named by transmitter, yaw, frequency and antenna pattern, and tx_positions_512.csv gives the transmitter locations. The paper reports about 26.4 million radio maps for the complete pipeline. The repository holds a subset of these, and the README states that a fuller ARM-Omni release is planned.', zh: 'FARM 空中无线电地图（ARM）数据集与 FARM 论文（arXiv:2604.17362）一同发布于 Hugging Face。数据由 ARM-Omni 生成，使用基于 TensorFlow 的射线追踪器 Sionna RT。论文从 OpenStreetMap 收集了 130 个城市场景，涵盖居住区、商业区和混合用途街区。论文依据建筑轮廓与高程数据构建三维城市环境，并为每个 1000 m x 1000 m 区域生成分辨率为 1 m 的高度图。每个场景采用基于网格的方法采样 100 个发射机位置。README 列出 13 个数据组：D1 至 D10、P1、F1 和 A1。载频为 2.1、2.6、3.3、3.5、4.9、5.9 和 7.1 GHz，最大接收高度为 100 至 150 m。天线方向图包括 30 度、60 度、120 度波束和全向天线。多数数据组使用 512 x 512 地图网格，P1 使用 256 x 256。每个文件保存一个形状为 1 x 30 x 512 x 512 的张量，包含 30 个接收高度层和一个无线电地图通道。数值为接收信号强度（RSS），以 uint8 编码。-120 dB 的无信号阈值对应像素值 130，建筑像素在各层的值均为 0。每个场景存为一个 .tar.gz 压缩包。解压后的 .npy 文件按发射机、偏航角、频率和天线方向图命名，tx_positions_512.csv 给出发射机位置。论文称完整流程共生成约 2640 万张无线电地图。本仓库仅包含其中一部分，README 称后续计划发布更完整的 ARM-Omni 数据。'}
pipeline:
  summary: {en: 'ARM-Omni builds 3D urban scenes from OpenStreetMap footprints and elevation, samples transmitter sites on a grid, runs Sionna RT for each transmission configuration, and encodes the RSS volumes as uint8 .npy files in per-scene archives.', zh: 'ARM-Omni 依据 OpenStreetMap 的建筑轮廓与高程构建三维城市场景，以网格方式采样发射机站点，对每种发射配置运行 Sionna RT，并将 RSS 体数据以 uint8 .npy 文件形式存入各场景的压缩包。'}
  stages:
  - title: {en: Build urban environments, zh: 构建城市环境}
    detail: {en: 'The paper collects 130 diverse urban scenes from OpenStreetMap. Building footprints and elevation data form a 3D urban environment, and a height map at 1 m resolution is generated for each 1000 m x 1000 m area.', zh: '论文从 OpenStreetMap 收集了 130 个多样的城市场景。建筑轮廓与高程数据构成三维城市环境，并为每个 1000 m x 1000 m 区域生成分辨率为 1 m 的高度图。'}
    inputs:
    - {en: OpenStreetMap building footprints, zh: OpenStreetMap 建筑轮廓}
    - {en: Elevation data, zh: 高程数据}
    outputs:
    - {en: 3D urban environments, zh: 三维城市环境}
  - title: {en: Select transmitter sites, zh: 选择发射机站点}
    detail: {en: 'For each scenario, 100 transmitter positions are sampled with a grid-based strategy to ensure spatial diversity.', zh: '每个场景采用基于网格的策略采样 100 个发射机位置，以保证空间多样性。'}
    inputs:
    - {en: 3D urban environments, zh: 三维城市环境}
    outputs:
    - {en: Transmitter positions in tx_positions_512.csv, zh: tx_positions_512.csv 中的发射机位置}
  - title: {en: Ray-trace RSS volumes, zh: 光线追踪 RSS 体数据}
    detail: {en: 'Sionna RT runs for diverse transmission configurations, including frequency, antenna pattern and transmitter yaw. The paper states that reflections, diffractions and material-specific propagation are considered when computing RSS at each receiver voxel.', zh: 'Sionna RT 针对多种发射配置运行，包括频率、天线方向图与发射机偏航角。论文称，计算每个接收体素的 RSS 时考虑了反射、绕射及材料相关的传播特性。'}
    inputs:
    - {en: Urban environments and transmitter positions, zh: 城市环境与发射机位置}
    outputs:
    - {en: RSS volume per receiver voxel over 30 height layers, zh: 每个接收体素在 30 个高度层上的 RSS 体数据}
  - title: {en: Encode and package scenes, zh: 编码并打包场景}
    detail: {en: 'Values are stored as uint8, with the -120 dB no-signal threshold mapped to 130 and building pixels set to 0. Each scene is packed as a .tar.gz archive. After extraction, files are arranged as frequency and antenna-pattern folders.', zh: '数值以 uint8 存储，-120 dB 无信号阈值映射为 130，建筑像素置为 0。每个场景打包为一个 .tar.gz 压缩包，解压后按频率与天线方向图文件夹组织。'}
    inputs:
    - {en: RSS volumes, zh: RSS 体数据}
    outputs:
    - {en: Scene archives and tx_positions_512.csv, zh: 场景压缩包与 tx_positions_512.csv}
