overview: {en: 'WiSig is a WiFi signal dataset from the UCLA CORES Lab for RF fingerprinting, described in an arXiv preprint in 2021 and in IEEE Access in 2022. It contains about 10 million WiFi packets sent by 174 off-the-shelf transmitters and recorded by 41 USRP receivers. The captures were made on the ORBIT testbed, a 20 × 20 grid of nodes, where each transmitter sent random UDP bytes to a WiFi access point on channel 13 (2462 MHz, 20 MHz). Four captures were made on 1, 8, 15 and 23 March 2021, and the receivers ran without time or frequency synchronization. The raw captures total about 1.4 TB and contain idle time and ACK responses, while the processed identification signals are 256 IQ samples per packet in equalized and non-equalized versions, forming Full WiSig at 76.9 GB. Four compact subsets (ManySig, ManyTx, ManyRx and SingleDay) are published as separate zip files and share some transmitters, receivers and signals. The authors use the data to study how receivers and channels affect
    transmitter identification, and Full WiSig is not balanced across Tx-Rx pairs.', zh: WiSig 是 UCLA CORES Lab 发布的 WiFi 信号数据集，面向 RF 指纹识别，2021 年发表于 arXiv 预印本，2022 年刊于 IEEE Access。数据包含 174 台商用现成（off-the-shelf）WiFi 发射机发送的约 1000 万个数据包，由 41 台 USRP 接收机记录。采集在 ORBIT 测试平台上进行，该平台为 20 × 20 的节点网格；发射机向 WiFi 接入点发送随机 UDP 字节，使用信道 13（2462 MHz，20 MHz 带宽）。采集分四次进行，日期为 2021 年 3 月 1 日、8 日、15 日和 23 日，各接收机之间不做时间或频率同步。原始采集约 1.4 TB，包含空闲时间和 ACK 响应；处理后的标识信号（Id signal）为每个数据包的 256 个 IQ 采样，分为未均衡与均衡两个版本，合称 Full WiSig，共 76.9 GB。ManySig、ManyTx、ManyRx 和 SingleDay 四个紧凑子集以独立 zip 文件发布，彼此共享部分发射机、接收机和信号。作者借助该数据研究接收机与信道如何影响发射机识别，Full WiSig 中各 Tx-Rx 对的信号数量不均衡。}
signal_details:
- signal: iq
  text: {en: 'Raw IQ samples from USRP B210, X310 and N210 receivers at 25 Msps and a 2462 MHz center frequency (WiFi 802.11a/g, channel 13, 20 MHz), captured for 0.512 s per transmission. The transmitters use Atheros 5212, 9220, 9280 and 9580 WiFi modules. The MATLAB reader in wisig-process-raw reads the raw files as 32-bit complex values. Identification signals contain the first 256 IQ samples of each packet, in a non-equalized and an equalized version.', zh: 来自USRP B210、X310和N210接收机的原始IQ采样，采样率25 Msps，中心频率2462 MHz（WiFi 802.11a/g，信道13，20 MHz），每次发射采集0.512 s。发射端WiFi模块为Atheros 5212、9220、9280和9580。wisig-process-raw中的MATLAB读取函数将原始文件按32位复数读取。标识信号为每个数据包的前256个IQ采样，分为未均衡和均衡两个版本。}
pipeline:
  summary: {en: 'Transmitters send WiFi traffic to an access point while USRP receivers record IQ, after which packets are detected, optionally equalized, and cut to 256-sample identification signals.', zh: 发射机向WiFi接入点发送流量，USRP接收机同时记录IQ；之后检测数据包，可选均衡，并截取为256采样的标识信号。}
  stages:
  - title: {en: Capture raw IQ during WiFi transmissions, zh: 采集WiFi发射期间的原始IQ}
    detail: {en: 'Transmitters send random bytes over UDP to a WiFi access point on channel 13, one transmitter at a time. The USRP receivers record IQ at 25 Msps for 0.512 s per transmission, without time or frequency synchronization. The raw captures total 1.4 TB and include idle time and ACK responses.', zh: 发射机逐一向WiFi接入点发送UDP随机字节流（信道13，2462 MHz，20 MHz）。USRP接收机以25 Msps采集IQ，每次发射0.512 s，各接收机之间不做时间或频率同步。原始采集共1.4 TB，包含空闲时间和ACK响应。}
    inputs:
    - {en: 174 WiFi transmitters (Atheros 802.11a/g modules), zh: 174台WiFi发射机（Atheros 802.11a/g模块）}
    - {en: '41 USRP receivers (B210, X310, N210)', zh: 41台USRP接收机（B210、X310、N210）}
    outputs:
    - {en: 'Raw WiSig captures, 1.4 TB', zh: 原始WiSig采集数据，1.4 TB}
  - title: {en: Detect packets and remove ACK responses, zh: 检测数据包并去除ACK响应}
    detail: {en: 'A window of Nw = 100 IQ samples is compared with a fixed threshold Lw = 0.005 to detect signals. A valid packet is a signal longer than Npkt = 1000 followed by a signal shorter than Nack = 2000, and transmitters with fewer than 10 packets are removed. The MATLAB scripts in matlab_detection_screening take about 5 hours per day of data and save whole packets as .mat files.', zh: 以Nw = 100个IQ采样为窗口，与固定门限Lw = 0.005比较以检测信号。有效数据包为长度大于Npkt = 1000、随后紧跟长度小于Nack = 2000的信号段，发包少于10个的发射机被剔除。matlab_detection_screening中的MATLAB脚本每天数据约需5小时，并将完整数据包保存为.mat文件。}
    inputs:
    - {en: Raw IQ files for one day, zh: 单日原始IQ文件}
    outputs:
    - {en: Whole packets per Tx-Rx pair (.mat), zh: 每个Tx-Rx对的完整数据包（.mat）}
  - title: {en: Equalize preambles (optional), zh: 均衡前导码（可选）}
    detail: {en: 'Packets are resampled from 25 Msps to 20 Msps, then L-STF autocorrelation finds the packet start and the frequency offset is corrected. The channel is estimated from the L-LTF, the packet is equalized with MMSE, and the result is resampled back to 25 Msps. The steps use the default parameters of the MATLAB R2019b WLAN toolbox.', zh: 数据包从25 Msps重采样到20 Msps，L-STF自相关定位包起始并校正频偏。利用L-LTF估计信道，采用MMSE均衡，再重采样回25 Msps。上述步骤使用MATLAB R2019b WLAN toolbox的默认参数。}
    inputs:
    - {en: Whole packets (.mat), zh: 完整数据包（.mat）}
    outputs:
    - {en: Equalized preamble file per Tx-Rx pair (.mat), zh: 每个Tx-Rx对的均衡前导码文件（.mat）}
  - title: {en: Select the first 256 IQ samples, zh: 选取前256个IQ采样}
    detail: {en: 'The first 256 IQ samples of each packet are kept with transmitter, receiver and day labels, in a non-equalized and an equalized version. Transmitters with few packets are removed again after equalization.', zh: 保留每个数据包的前256个IQ采样，并附带发射机、接收机和日期标签，分为未均衡和均衡两个版本。均衡后发包过少的发射机会再次被剔除。}
    inputs:
    - {en: Whole packets and equalized preambles, zh: 完整数据包和均衡后前导码}
    outputs:
    - {en: 'Identification signals with Tx, Rx and day labels', zh: 带有发射机、接收机和日期标签的标识信号}
  - title: {en: Assemble one pkl file per receiver, zh: 按接收机组装pkl文件}
    detail: {en: 'A Jupyter notebook in python_pkl_creation reads the MATLAB packet files and writes one pkl file for each receiver, for either the non-equalized or the equalized data. Tx-Rx pairs with few packets or small files are skipped. The assembled Full WiSig dataset is 76.9 GB and is not balanced across Tx-Rx pairs.', zh: python_pkl_creation中的Jupyter notebook读取MATLAB数据包文件，为每个接收机生成一个pkl文件，可用于未均衡或均衡数据。数据包数量少或文件小的Tx-Rx对会被跳过。组装后的Full WiSig为76.9 GB，各Tx-Rx对的信号数量不均衡。}
    inputs:
    - {en: 'MATLAB packet files (.mat) per receiver, non-equalized or equalized', zh: 每个接收机的MATLAB数据包文件（.mat），未均衡或均衡}
    outputs:
    - {en: Full WiSig pkl file per receiver (76.9 GB in total), zh: 每个接收机一个Full WiSig pkl文件（合计76.9 GB）}
bandwidth_mhz: 20
format: raw binary IQ, MAT, PKL
facts:
- label: {en: Compact subsets, zh: 紧凑子集}
  text: {en: 'ManySig has 6 Tx, 12 Rx and 1000 signals per Tx-Rx pair over 4 days (1.4 GB zipped); ManyTx has 150 Tx, 18 Rx and 50 signals per pair (2.5 GB); ManyRx has 10 Tx, 32 Rx and 200 signals per pair (1.2 GB); SingleDay has 28 Tx, 10 Rx and 800 signals per pair on one day (1 GB).', zh: ManySig 含 6 个发射机、12 个接收机，每个 Tx-Rx 对 1000 个信号，覆盖 4 天（压缩包 1.4 GB）；ManyTx 含 150 个发射机、18 个接收机，每对 50 个信号（2.5 GB）；ManyRx 含 10 个发射机、32 个接收机，每对 200 个信号（1.2 GB）；SingleDay 含 28 个发射机、10 个接收机，每对 800 个信号，仅覆盖 1 天（1 GB）。}
- label: {en: Balance and overlap, zh: 均衡性与重叠}
  text: {en: 'Only ManySig and SingleDay are perfectly balanced; the other two subsets have at least 90% of Tx per Rx meeting the signal count. The subsets share some transmitters, receivers and signals, so they should not be treated as distinct.', zh: 只有 ManySig 和 SingleDay 完全均衡；其余两个子集中，每个接收机至少 90% 的发射机满足信号数量要求。各子集之间共享部分发射机、接收机和信号，不应视为相互独立的数据。}
- label: {en: Full WiSig size, zh: Full WiSig 大小}
  text: {en: Full WiSig is 76.9 GB unzipped and 42 GB zipped; the zipped archive for each file is about 8 GB., zh: Full WiSig 解压后为 76.9 GB，压缩后为 42 GB；每个压缩文件约 8 GB。}
- label: {en: Raw layout, zh: 原始数据结构}
  text: {en: 'Raw WiSig has 4 day folders, one folder per receiver within each day, and 9 tar files per receiver, each with captures from up to 20 transmitters.', zh: 原始 WiSig 包含 4 个日期文件夹，每天每个接收机一个文件夹，每个接收机 9 个 tar 文件，每个文件包含最多 20 个发射机的采集数据。}
