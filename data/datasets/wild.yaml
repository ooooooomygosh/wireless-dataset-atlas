summary: {en: 'The dataset contains 4D complex WiFi channel matrices (datapoints x frequency x antennas x access points), RSSI values and XY location labels from indoor setups in two UCSD buildings. It also provides 2D heatmap features used by the DLoc network.', zh: 该数据集包含四维复数WiFi信道矩阵（数据点 x 频率 x 天线 x 接入点）、RSSI值以及XY位置标签，采集自加州大学圣地亚哥分校两栋建筑的室内场景。另提供DLoc网络所用的二维热图特征。}
