overview: {en: 'WILD (Wireless Indoor Localization Dataset) provides WiFi channel measurements with XY location labels from indoor setups at UC San Diego. The WCSNG group released it in June 2020 with the DLoc paper (Ayyalasomayajula et al., MobiCom 2020), and a second version followed through a Kaggle competition in December 2022. The eight setups are five in Jacobs Hall (ground floor, 18 m x 8 m, 4 APs, 1500 sq. ft. environment, recorded 28 July and 16 August 2019) and three in Atkinson Hall (ground floor, 8 m x 5 m, 3 APs, 500 sq. ft. environment, recorded 16, 18 and 22 July 2019). Each setup has a channels_<setup>.mat file with complex channel matrices, RSSI and XY labels, and a features_<setup>.mat file with heatmap inputs for the DLoc network. Split-index files reproduce the DLoc partitions. The downloads are password-protected and are released after accepting terms through a form.', zh: WILD（Wireless Indoor Localization Dataset）提供加州大学圣地亚哥分校（UCSD）室内场景的 WiFi 信道测量数据，附带 XY 位置标签。WCSNG
    团队于 2020 年 6 月随 DLoc 论文（Ayyalasomayajula 等，MobiCom 2020）发布该数据集，2022 年 12 月通过 Kaggle 竞赛发布第二版。八个采集场景中，Jacobs Hall 有五个（地面层，18 m × 8 m，4 个 AP，环境面积 1500 sq. ft.，采集日期为 2019 年 7 月 28 日和 8 月 16 日），Atkinson Hall 有三个（地面层，8 m × 5 m，3 个 AP，环境面积 500 sq. ft.，采集日期为 2019 年 7 月 16、18 和 22 日）。每个场景对应一个 channels_<setup>.mat 文件，包含复数信道矩阵、RSSI 和 XY 标签；另有一个 features_<setup>.mat 文件，包含 DLoc 网络使用的热图输入。划分索引文件用于复现 DLoc 的数据划分。下载需要密码，须先通过条款表单获取。}
signal_details:
- signal: csi
  text: {en: 'Complex WiFi channel matrices in channels_<setup>.mat (HDF5), shaped datapoints x frequency x antennas x access points. opt.freq holds the subcarrier frequencies and opt.lambda their wavelengths; ant_sep gives the antenna separation used on all APs. The ap cell array lists the [n_ant x 2] XY positions of each AP''s antennas, ap_aoa gives the rotation added to each AP''s AoA, and d1 and d2 are the sampled x and y axes. features_<setup>.mat holds 4D heatmap features with and without time offsets, and labels_gaussian_2d holds the target heatmaps.', zh: 'HDF5 格式的 channels_<setup>.mat 中保存复数 WiFi 信道矩阵，维度为 数据点 × 频率 × 天线 × 接入点（datapoints × frequency × antennas × AP）。opt.freq 为子载波频率向量，opt.lambda 为对应波长，ant_sep 为所有 AP 使用的天线间距。ap 为元胞数组，给出每个 AP 各天线的 [n_ant × 2] XY 坐标；ap_aoa 为每个 AP 加在 AoA 上的旋转量；d1 与 d2 为采样的 x 轴与 y 轴。features_<setup>.mat 含有带时间偏移与不带时间偏移的 4D 热图特征，labels_gaussian_2d 为目标热图。'}
- signal: rssi
  text: {en: 'RSSI matrix of shape datapoints x access points, stored in the same channels_<setup>.mat file as the channel matrix, with one value per AP per datapoint.', zh: RSSI 矩阵，维度为 数据点 × 接入点（datapoints × AP），与信道矩阵保存在同一个 channels_<setup>.mat 文件中，每个数据点每个 AP 一个值。}
