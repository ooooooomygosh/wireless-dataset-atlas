summary: {en: 'Synthetic CSI from Sionna ray-tracing simulation of an outdoor campus with ten base stations covering about 625 m by 535 m, with pedestrian users and mixed LoS and NLoS paths. The data include user positions, timestamps, speeds, multipath delays and path coefficients, and path loss.', zh: 基于 Sionna 射线追踪仿真的合成 CSI 数据，场景为约 625 m × 535 m 的户外校园，包含 10 个基站和行人用户，同时存在视距与非视距路径。数据包括用户位置、时间戳、速度、多径时延与路径系数，以及路径损耗。}
