  status: derivable
  note: {en: Multiuser sets are built by aligning times and link validity across user trajectories. Scheduling labels are not released., zh: 多用户集合需在用户轨迹间对齐时间并判定链路有效性。未发布调度标签。}
- key: multibs
  status: provided
