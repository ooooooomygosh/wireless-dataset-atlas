summary: {en: 'mmWave radar point clouds from 18 subjects, labelled for subject identification, action classification and keypoint estimation. The repository does not state the number of frames or actions.', zh: 来自18名受试者的 mmWave 雷达点云，标注用于受试者身份识别、动作分类和关键点估计。仓库未给出帧数或动作数量。}
