overview: {en: 'MIRAGE-2019 is a human-generated dataset of mobile app traffic with associated ground-truth. The Traffic Research Group at the University of Naples Federico II (DIETI) maintains it. The associated paper is titled MIRAGE: Mobile-app Traffic Capture and Ground-truth Creation, by Aceto, Ciuonzo, Montieri, Persico and Pescapè, and was presented at the 4th IEEE ICCCS in Rome in October 2019. More than 280 experimenters used 40 mobile apps on 3 devices to generate the traffic. The project states that the human-generated datasets were collected with the MIRAGE architecture, which it describes as a reproducible architecture for mobile-app traffic capture and ground-truth creation. The latest downloadable release is version 2, distributed as one tar.gz archive. The dataset is licensed under CC BY-NC-ND 4.0.', zh: 'MIRAGE-2019 是一个人工生成的移动应用流量数据集，附带真值（ground-truth）。该数据集由那不勒斯费德里科二世大学（University of Naples Federico II）的 Traffic Research Group（DIETI）维护。相关论文题为《MIRAGE: Mobile-app Traffic Capture
    and Ground-truth Creation》，作者为 Aceto、Ciuonzo、Montieri、Persico 和 Pescapè，发表于 2019 年 10 月在意大利罗马举行的第 4 届 IEEE ICCCS。超过 280 名实验人员在 3 台设备上操作 40 个移动应用，产生了这些流量。项目页面称，人工生成的数据集使用 MIRAGE 架构采集，该架构被描述为可复现的移动应用流量采集与真值生成架构。最新可下载版本为第 2 版，以一个 tar.gz 压缩包发布。数据集采用 CC BY-NC-ND 4.0 许可。'}
signal_details:
- signal: traffic
  text: {en: 'Mobile app network traffic generated by human users: 40 apps on 3 devices, with more than 280 experimenters. Ground-truth accompanies the traffic. The public release is the archive MIRAGE-2019_traffic_dataset_downloadable_v2.tar.gz.', zh: 由人工操作产生的移动应用网络流量：3 台设备上的 40 个应用，超过 280 名实验人员参与。流量附带真值。公开版本为压缩包 MIRAGE-2019_traffic_dataset_downloadable_v2.tar.gz。}
samples: 4,606 PCAP traces
format: JSON
pipeline:
  summary: {en: Volunteers run Android apps on rooted devices while tcpdump records the traffic and strace logs system calls. Biflows are then labelled from the logs and exported as JSON., zh: 志愿者在已 root 的 Android 设备上运行应用，tcpdump 记录流量，strace 记录系统调用。随后根据日志为双向流打标签，并导出为 JSON。}
  stages:
  - title: {en: App sessions by volunteers, zh: 志愿者应用会话}
    detail: {en: 'Before each session the app is updated to the latest version on the Italian Play Store. Volunteers perform typical uses of one app, including first install, login and registration.', zh: 每次会话前，应用会更新到意大利 Play Store 的最新版本。志愿者使用单个应用的常见功能，包括首次安装、登录和注册。}
  - title: {en: Capture, zh: 流量采集}
    detail: {en: 'Connecting a device to the USB hub starts tcpdump on the capture server''s wired interface, filtered by device MAC address. Strace logs network system calls on the device through ADB. Traffic reaches the Internet through a Wi-Fi access point.', zh: 设备通过 USB 集线器连接后，采集服务器有线接口上的 tcpdump 按设备 MAC 地址过滤抓包；同时通过 ADB 在设备上用 strace 记录网络相关系统调用。流量经 Wi-Fi 接入点访问互联网。}
  - title: {en: Biflow segmentation, zh: 双向流切分}
    detail: {en: 'PCAP traces are split into biflows by the 5-tuple of IP addresses, ports and transport protocol, with both directions merged. The known IP addresses of the devices fix the upstream direction.', zh: PCAP 轨迹按 IP 地址、端口和传输层协议组成的五元组切分为双向流，两个方向的包合并在一起。已知的设备 IP 地址用于确定上行方向。}
  - title: {en: Labelling, zh: 标注}
    detail: {en: Each biflow takes the Android package name whose getsockname and connect calls match its 5-tuple in the strace log. Biflows without a match take the most common label of their trace and are flagged as heuristic., zh: 每个双向流的标签为 strace 日志中 getsockname 和 connect 调用与其五元组精确匹配的 Android 包名。无法匹配的双向流取其所在轨迹中最常见的标签，并标记为启发式标签。}
  - title: {en: Feature extraction and export, zh: 特征提取与导出}
    detail: {en: 'Labelled biflows are written as JSON files, with per-packet fields for the first 32 packets, per-flow length and inter-arrival features, and metadata.', zh: 带标签的双向流被写成 JSON 文件，包含前 32 个包的逐包字段、逐流长度与到达间隔特征，以及元数据。}
facts:
- label: {en: Devices, zh: 设备}
  text: {en: 'Three rooted devices were used: Xiaomi Mi5, Google Nexus 7 and Samsung Galaxy A5, all running CyanogenMod 13.0 (Android 6.0.1).', zh: 使用三台已 root 的设备：Xiaomi Mi5、Google Nexus 7 和 Samsung Galaxy A5，均运行 CyanogenMod 13.0（Android 6.0.1）。}
- label: {en: Participants, zh: 参与者}
  text: {en: 'More than 280 student volunteers aged 19 to 25 took part, with an 85/15 split between males and females, between May 2017 and May 2019 in the ARCLAB laboratory.', zh: 280 多名年龄在 19 至 25 岁之间的学生志愿者参与采集，男女比例为 85/15，采集时间为 2017 年 5 月至 2019 年 5 月，地点为 ARCLAB 实验室。}
- label: {en: Capture sessions, zh: 采集会话}
  text: {en: 'Each experimental session lasted up to two hours and contained 12 capture sessions of 5 to 10 minutes. In total, the dataset holds 4,606 PCAP traces.', zh: '每次实验最长两小时，包含 12 次时长 5 至 10 分钟的采集会话。数据集共包含 4,606 个 PCAP 轨迹。'}
- label: {en: Released fields, zh: 发布的字段}
  text: {en: 'Per-packet fields cover the first 32 packets of each biflow: source and destination ports, direction, L4 payload bytes, inter-arrival time, TCP window size and raw L4 payload. Per-flow features cover upstream, downstream and complete IP packet lengths and inter-arrival times.', zh: 逐包字段覆盖每个双向流的前 32 个包，包括源端口和目的端口、方向、L4 载荷字节数、到达间隔、TCP 窗口大小和原始 L4 载荷。逐流特征覆盖上行、下行和完整 IP 包长及到达间隔。}
- label: {en: App coverage, zh: 应用覆盖}
  text: {en: 'The dataset covers 40 Android apps from 16 Google Play categories, and the project site lists the metadata of each app.', zh: 数据集覆盖 40 个 Android 应用，分属 16 个 Google Play 类别，项目网站列出了每个应用的元数据。}
- label: {en: Heuristic labels, zh: 启发式标签}
  text: {en: 'Biflows without an exact strace match are labelled with the most common package name in their PCAP trace, and the label is flagged so that users can keep only the strict matches.', zh: 未能与 strace 记录精确匹配的双向流，会被赋予其 PCAP 轨迹中最常见的包名，该标签会被明确标记，用户可只保留精确匹配的数据。}
capabilities:
- key: csi
  status: none
  note: {en: This is network traffic capture with no radio channel measurements., zh: 这是网络流量采集，不包含无线信道测量。}
- key: cir
  status: none
  note: {en: No radio channel data are released; the data are packet and flow features., zh: 不包含无线信道数据，发布的是包和流级特征。}
- key: paths
  status: none
  note: {en: No radio propagation data are released., zh: 不发布无线传播数据。}
- key: interaction
  status: none
  note: {en: 'No propagation paths or interaction points are present, since the data are network traces.', zh: 不含传播路径或交互点，数据为网络轨迹。}
- key: power
  status: none
  note: {en: No received power or RSSI is released; the fields are packet lengths and inter-arrival times., zh: 不发布接收功率或 RSSI，字段为包长和到达间隔。}
- key: iq
  status: none
  note: {en: No raw I/Q samples are released; the fields are packet header values and payload bytes., zh: 不发布原始 I/Q 采样，字段为包头数值和载荷字节。}
- key: beam_labels
  status: none
  note: {en: 'No beam indices or gains are present, since no radio beams are involved.', zh: 不含波束索引或增益，不涉及无线波束。}
- key: position
  status: none
  note: {en: The released fields contain no device location or GPS data., zh: 发布字段不含设备位置或 GPS 数据。}
- key: geometry
  status: none
  note: {en: No 3D scene or map files are released., zh: 不发布 3D 场景或地图文件。}
- key: materials
  status: none
  note: {en: No material parameters are released; the data are network traffic., zh: 不发布材料参数，数据为网络流量。}
