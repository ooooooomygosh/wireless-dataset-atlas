- key: lidar
  status: none
  note: {en: No lidar data are released., zh: 不发布激光雷达数据。}
- key: radar
  status: none
  note: {en: No radar data are released., zh: 不发布雷达数据。}
- key: imu
  status: none
  note: {en: No IMU data are released., zh: 不发布 IMU 数据。}
- key: time_series
  status: provided
  note: {en: 'Each biflow carries ordered per-packet fields for its first 32 packets, including inter-arrival times.', zh: 每个双向流携带前 32 个包的有序逐包字段，包括到达间隔。}
- key: multiuser
  status: unknown
  note: {en: 'The paper says traffic of three devices was captured at the same time, but the released per-packet fields carry inter-arrival times rather than absolute timestamps.', zh: 论文称三台设备的流量同时采集，但发布的逐包字段为到达间隔而非绝对时间戳。}
