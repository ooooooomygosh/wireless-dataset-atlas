overview: {en: 'MIRAGE-2019 is a human-generated dataset of mobile app traffic with associated ground-truth. The Traffic Research Group at the University of Naples Federico II (DIETI) maintains it. The associated paper is titled MIRAGE: Mobile-app Traffic Capture and Ground-truth Creation, by Aceto, Ciuonzo, Montieri, Persico and Pescapè, and was presented at the 4th IEEE ICCCS in Rome in October 2019. More than 280 experimenters used 40 mobile apps on 3 devices to generate the traffic. The project states that the human-generated datasets were collected with the MIRAGE architecture, which it describes as a reproducible architecture for mobile-app traffic capture and ground-truth creation. The latest downloadable release is version 2, distributed as one tar.gz archive. The dataset is licensed under CC BY-NC-ND 4.0.', zh: 'MIRAGE-2019 是一个人工生成的移动应用流量数据集，附带真值（ground-truth）。该数据集由那不勒斯费德里科二世大学（University of Naples Federico II）的 Traffic Research Group（DIETI）维护。相关论文题为《MIRAGE: Mobile-app Traffic Capture
    and Ground-truth Creation》，作者为 Aceto、Ciuonzo、Montieri、Persico 和 Pescapè，发表于 2019 年 10 月在意大利罗马举行的第 4 届 IEEE ICCCS。超过 280 名实验人员在 3 台设备上操作 40 个移动应用，产生了这些流量。项目页面称，人工生成的数据集使用 MIRAGE 架构采集，该架构被描述为可复现的移动应用流量采集与真值生成架构。最新可下载版本为第 2 版，以一个 tar.gz 压缩包发布。数据集采用 CC BY-NC-ND 4.0 许可。'}
