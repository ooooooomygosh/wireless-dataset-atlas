  text: {en: 'Mobile app network traffic generated by human users: 40 apps on 3 devices, with more than 280 experimenters. Ground-truth accompanies the traffic. The public release is the archive MIRAGE-2019_traffic_dataset_downloadable_v2.tar.gz.', zh: 由人工操作产生的移动应用网络流量：3 台设备上的 40 个应用，超过 280 名实验人员参与。流量附带真值。公开版本为压缩包 MIRAGE-2019_traffic_dataset_downloadable_v2.tar.gz。}
