summary: {en: 'Human-generated mobile app network traffic from 40 apps on 3 devices, collected by more than 280 experimenters, with associated ground-truth. The data is distributed as a downloadable archive of the latest release.', zh: 人工生成的移动应用网络流量数据，由 280 多名实验人员在 3 台设备上操作 40 个应用产生，并附带真值（ground-truth）。数据以可下载压缩包的形式发布。}
