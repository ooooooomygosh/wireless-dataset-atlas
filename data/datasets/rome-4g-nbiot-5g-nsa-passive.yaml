summary: {en: 'Geo-tagged passive scanner records and active Speedtest and online gaming tests on 4G, NB-IoT and 5G NSA networks in Rome, collected over seven weeks. The CSV files total about 2.6 GB.', zh: '2023 年在罗马采集的 4G、NB-IoT 与 5G NSA 网络被动与主动测量数据，含地理标签与无线指标，CSV 合计约 2.6 GB。'}
overview:
  en: 'The dataset holds network measurements collected over seven weeks in Rome, Italy, on the infrastructure of two mobile network operators, anonymized as Op1 and Op2. It covers LTE (4G), NB-IoT and 5G New Radio in non-standalone mode. The passive part has one CSV file per technology: 4G passive measurements, NB-IoT passive measurements and 5G passive measurements. Each record carries a UTC timestamp, UE GPS latitude, longitude and altitude, moving speed, carrier frequency, EARFCN, MNC, band, PCI, cell identity, eNodeB ID, and radio fields such as RSRP, RSRQ, SINR and received power. Cell GPS positions with positioning error margins are given for 4G and NB-IoT only. The 5G file holds SS-RSRP and PSS-RSRP values, SSB beam identifiers and the number of detected SSB beams. It is the largest file, at about 2.2 GB. The active part has two CSV files. The Speedtest file reports downlink and uplink throughput with packet metrics. The online gaming file reports round-trip time, packet delay variation and an interactivity score. Each active session is labelled with one of three mobility scenarios: indoor static, outdoor walking or outdoor driving. The UE mode field records whether 5G was enabled or disabled. The five CSV files total about 2.6 GB and come with a PDF description of all fields.'
  zh: '该数据集包含 2023 年在意大利罗马采集的七周网络测量数据，测量在两家移动运营商的基础设施上进行，运营商以 Op1 与 Op2 匿名表示。数据覆盖 4G LTE、NB-IoT 与 5G NR（非独立组网）。被动测量部分按技术分为三个 CSV 文件：4G、NB-IoT 与 5G。每条记录包含 UTC 时间戳、UE 的 GPS 经纬度与海拔、移动速度、载频、EARFCN、MNC、频段、PCI、小区标识、eNodeB ID，以及 RSRP、RSRQ、SINR 与接收功率等无线指标。小区 GPS 位置及定位误差仅见于 4G 与 NB-IoT。5G 文件含 SS-RSRP 与 PSS-RSRP、SSB 波束标识以及检测到的 SSB 波束数，是最大的文件，约 2.2 GB。主动测量部分包含两个 CSV 文件：Speedtest 文件记录上下行吞吐量与分组指标；在线游戏文件记录往返时延、分组时延变化与交互分数。每个主动测试会话标注一种移动场景：室内静止、户外步行或户外驾车。UE 模式字段记录 5G 功能开启或关闭。五个 CSV 文件合计约 2.6 GB，并附带全部字段说明的 PDF 文件。字段说明中，标注星号的字段仅适用于 4G 与 NB-IoT；5G 数据涵盖 SS、DMRS、RS、PBCH、PSS 与 SS-PBCH 等不同类型的 5G 信号。'
pipeline:
  summary: {en: 'Passive scanner records and active Speedtest and online gaming sessions are logged on operator networks, anonymized and released as CSV files with a feature description.', zh: '在运营商网络上记录被动扫描数据与主动 Speedtest、在线游戏会话，经匿名化后以 CSV 文件及字段说明形式发布。'}
  stages:
  - title: {en: Log passive measurements, zh: 记录被动测量}
    detail: {en: 'Each passive record holds time, UE GPS position, speed, carrier and cell identifiers, and radio fields for LTE, NB-IoT and 5G NR.', zh: '每条被动记录包含时间、UE 的 GPS 位置、速度、载波与小区标识，以及 LTE、NB-IoT 与 5G NR 的无线指标。'}
    inputs:
    - {en: 'Operator 4G, NB-IoT and 5G NSA networks', zh: 运营商 4G、NB-IoT 与 5G NSA 网络}
    outputs:
    - {en: '4G, NB-IoT and 5G passive measurement CSV files', zh: 4G、NB-IoT 与 5G 被动测量 CSV 文件}
  - title: {en: Run active tests, zh: 执行主动测试}
    detail: {en: 'Speedtest sessions log downlink and uplink throughput and packet metrics. Online gaming sessions log round-trip time, packet delay variation and an interactivity score. Each session carries a mobility scenario.', zh: 'Speedtest 会话记录上下行吞吐量与分组指标；在线游戏会话记录往返时延、分组时延变化与交互分数。每个会话标注移动场景。'}
    inputs:
    - {en: 'Operator networks in indoor static, outdoor walking and outdoor driving scenarios', zh: 室内静止、户外步行与户外驾车场景下的运营商网络}
    outputs:
    - {en: 'Speedtest and online gaming CSV files', zh: Speedtest 与在线游戏 CSV 文件}
    controls:
    - {en: 'UE mode (5G-enabled or 5G-disabled) recorded per measurement', zh: 每次测量记录 UE 模式（5G 开启或关闭）}
  - title: {en: Anonymize and package, zh: 匿名化与打包发布}
    detail: {en: 'Operators are labelled Op1 and Op2. The files are published on Zenodo under CC BY 4.0 with a PDF listing every feature.', zh: '运营商以 Op1 与 Op2 标注。文件以 CC BY 4.0 许可发布于 Zenodo，并附列出全部字段的 PDF。'}
    outputs:
    - {en: Zenodo record with five CSV files and a description PDF, zh: 包含五个 CSV 文件与字段说明 PDF 的 Zenodo 记录}
