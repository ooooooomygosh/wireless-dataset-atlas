summary: {en: 'S21 channel measurements at 5 GHz with an RIS prototype in an anechoic chamber, covering stationary specular and non-specular geometries, a rotating stage, and RIS states set by greedy and model-based algorithms.', zh: 在 5 GHz 频段使用 RIS 原型，于无回声暗室中进行 S21 信道测量，包括固定的镜面与非镜面反射几何布置、旋转台场景，以及由贪心算法和基于模型的算法设定的 RIS 状态。}
