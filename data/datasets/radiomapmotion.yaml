- {en: 'The original preprint and current README use input windows of 10 and 8 frames, respectively. Fix the code version and inspect the loader; do not mix these reproduction protocols.', zh: 原预印本与当前README的输入窗分别为10和8帧；需固定代码版本并检查loader，不能混合复现实验。}
- {en: Image structure metrics do not replace outage/throughput evaluation., zh: 图像结构指标不替代 outage/吞吐量评价。}
