- {en: 'Historical maps → future maps: 10→5 in the preprint; 8→5 in the current README.', zh: 历史地图→未来地图：预印本10→5；当前README8→5}
technical_notes:
- {en: 'Supported by the paper: Altair WinProp DPM; 3.5 GHz, 23 dBm, Tx and Rx heights of 1.5 m, isotropic antennas, a 256×256 m area, and a 1 m grid.', zh: 文献支持：Altair WinProp DPM；3.5 GHz、23 dBm、收发高度均1.5 m、各向同性天线、256×256 m区域及1 m栅格。}
- {en: 'Supported by the paper: rule-driven vehicles at 0.1 seconds/frame; the authors explicitly state that the motion rules were not validated against real traffic data.', zh: 文献支持：规则驱动车辆、0.1秒/帧；作者明确未以真实交通数据验证运动规则。}
- {en: 'Supported by the paper: experiments in the original preprint use ground-truth simulated historical maps as input. Errors from reconstructing dense maps from sparse real measurements are not included in those experiments.', zh: 文献支持：原预印本实验以真实仿真历史地图作为输入；实际稀疏测量到稠密地图的重建误差未进入该实验。}
- {en: 'Verified: official evaluation uses NMSE/RMSE/PSNR/SSIM; communication utility requires additional decision experiments.', zh: 已确认：官方评估 NMSE/RMSE/PSNR/SSIM；通信 utility 需额外决策实验。}
limitations:
