id: radiomapmotion
name: RadioMapMotion
year: 2025
origin: simulation
tasks: [radio-map, channel-prediction]
signals: [pathloss]
format: PNG
mobility: vehicle trajectories
samples: 15,000 train, 5,000 validation, 5,000 test and 5,000 new-environment test sequences
license: Not stated
access: {url: 'https://github.com/UNIC-Lab/RadioMapMotion', type: open}
code: ['https://github.com/UNIC-Lab/RadioMapMotion']
paper: doi:10.1109/tccn.2026.3685413
used_in: []
citing: ['doi:10.1109/iccc70295.2026.11680295']
summary: {en: 'Radio map sequences of path loss along vehicle trajectories in 300 numbered environments, each sequence with 8 context frames and 5 prediction frames. The frames are stored as PNG images.', zh: 沿车辆轨迹生成的无线电地图序列（路径损耗），覆盖 300 个编号环境。每个序列包含 8 个输入帧和 5 个预测帧，以 PNG 图像存储。}
sources: ['https://github.com/UNIC-Lab/RadioMapMotion', 'https://arxiv.org/abs/2511.17526', 'https://api.openalex.org/works/doi:10.1109/TCCN.2026.3685413']
checked: '2026-11-06'
pipeline:
  summary: {en: 'Vehicle rules produce continuous geometric states. WinProp DPM generates maps frame by frame, which are then packaged into historical and future windows by environment/trajectory/Tx.', zh: 车辆规则产生连续几何状态，WinProp DPM逐帧生成地图，再按环境/轨迹/Tx封装历史与未来窗口。}
  stages:
  - title: {en: 'Fix the environment, vehicles, and Tx', zh: 固定环境、车辆与Tx}
    detail: {en: 'Create a 256×256 m area with a 1 m receiver grid. The paper uses 3.5 GHz, 23 dBm, isotropic antennas, and Tx/Rx heights of 1.5 m.', zh: 建立256×256m区域和1m接收栅格；原文使用3.5GHz、23dBm、各向同性天线及1.5m收发高度。}
    inputs:
    - {en: 300 environments, zh: 300个环境}
    - {en: 5 trajectories and 20 Tx configurations per environment, zh: 每环境5条轨迹和20个Tx配置}
    outputs:
    - {en: Environment and Tx configuration, zh: 环境与Tx配置}
    - {en: Map spatial coordinates, zh: 地图空间坐标}
    controls:
    - {en: 'Paper configuration: environment/trajectory/Tx hierarchy', zh: 论文配置：环境/轨迹/Tx层级}
    - {en: 'Researcher specifies: vehicle geometry, buildings, and materials', zh: 研究者固定：车辆几何、建筑和材料}
    checks:
    - {en: Check consistency between pixels and physical coordinates, zh: 检查像素与物理坐标一致}
    - {en: Samples from different Tx belong to the same environment, zh: 不同Tx样本属于同一环境}
  - title: {en: Advance vehicles according to rules, zh: 按规则推进车辆}
    detail: {en: Advance vehicle positions at 0.1 s frame intervals to produce 15 frames of scene evolution per sequence., zh: 以0.1s帧间隔推进车辆位置，形成每序列15帧的场景演化。}
    inputs:
    - {en: Road layout and initial vehicles, zh: 环境道路和初始车辆}
    - {en: Motion rules, zh: 运动规则}
    outputs:
    - {en: Continuous geometric states and frame indices, zh: 连续几何状态和frame索引}
    controls:
    - {en: 'Paper configuration: rule-driven vehicle motion', zh: 论文配置：规则驱动车辆运动}
    - {en: 'For reconstruction, the researcher fixes speed, turning, collision rules, and seed', zh: 研究者重建时固定速度、转向、碰撞规则与seed}
    checks:
    - {en: Check motion continuity between frames, zh: 核对帧间运动连续性}
    - {en: The realism of the motion rules requires validation against independent traffic data, zh: 运动规则的现实性需独立交通数据验证}
  - title: {en: Run WinProp DPM for each frame, zh: 逐帧运行WinProp DPM}
    detail: {en: 'Compute radio maps for every Tx in each frame, with changes determined jointly by the specified vehicle motion and DPM propagation.', zh: 计算各帧各Tx的无线地图，使变化由所设车辆运动与DPM传播共同决定。}
    inputs:
    - {en: Per-frame geometry and Tx, zh: 每帧几何与Tx}
    - {en: Fixed propagation configuration, zh: 固定传播配置}
    outputs:
    - {en: '30,000 sequences corresponding to 450,000 map frames', zh: '30,000序列对应450,000地图帧'}
    controls:
    - {en: 'Researcher specifies: WinProp version, DPM settings, receiver grid, and no-coverage encoding', zh: 研究者固定：WinProp版本、DPM设置、接收栅格和无覆盖编码}
    checks:
    - {en: Check for unintended changes in Tx/grid across frames, zh: 检查各帧Tx/网格不发生非预期变化}
    - {en: Separate static error from dynamic variation under the same configuration, zh: 同一配置下分离静态误差和动态变化}
  - title: {en: Save physical maps and images, zh: 保存物理地图与图像}
    detail: {en: The original preprint describes physical values in .npz and 8-bit PNGs; the current README shows gain/ image sequences accessed by env/traj/tx/frame indices., zh: 原预印本描述.npz物理值及8-bit PNG；当前README展示gain/图像序列，按env/traj/tx/frame索引访问。}
    inputs:
    - {en: Floating-point pathloss maps, zh: 浮点路径损耗地图}
    - {en: Image normalization rules, zh: 图像归一化规则}
    outputs:
    - {en: Version-specific .npz or PNG directory, zh: 版本对应的.npz或PNG目录}
    - {en: Hierarchical indices, zh: 层级索引}
    controls:
    - {en: 'Researcher specifies: downloaded package, dB-to-grayscale conversion, and loader', zh: 研究者固定：所下载包、dB到灰度转换和loader}
    checks:
    - {en: Check whether the current package actually contains the original floating-point maps, zh: 检查当前包是否实际含浮点原图}
    - {en: Use consistent signs and normalization directions for pathloss and gain, zh: 统一pathloss与gain的符号和归一化方向}
  - title: {en: Construct prediction windows and evaluate, zh: 构造预测窗口与评估}
    detail: {en: The preprint predicts 5 frames from 10; the current repository README uses 8→5. Fix the loader and evaluate new trajectories in known environments separately from unseen environments., zh: 预印本以10帧预测5帧；当前仓库README使用8→5。研究者固定loader并分别评估已见环境新轨迹与未见环境。}
    inputs:
    - {en: Historical map sequences, zh: 历史地图序列}
    - {en: Future maps and environment/trajectory groups, zh: 未来地图及环境/轨迹分组}
    outputs:
    - {en: Historical/future map samples, zh: 历史/未来地图样本}
    - {en: NMSE/RMSE/PSNR/SSIM and custom communication metrics, zh: NMSE/RMSE/PSNR/SSIM及自定义通信指标}
    controls:
    - {en: 'Researcher specifies: window, overlap stride, environment split, and source of historical observations', zh: 研究者固定：窗口、重叠步长、环境切分与历史观测来源}
    checks:
    - {en: Historical inputs in the original experiment are ground-truth simulated maps, zh: 原实验历史输入为仿真真值地图}
    - {en: Deployment evaluation must include map reconstruction error and test coverage/outage gains, zh: 实际部署需加入地图重建误差并测试coverage/outage收益}
  scope: {en: Generation settings from preprint v1 and the current repository structure; distinguish 10→5 and 8→5 input windows by version., zh: 原预印本v1生成设置与当前仓库目录；输入窗口10→5和8→5须按版本区分。}
