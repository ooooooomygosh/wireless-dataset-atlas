overview: {en: 'RadioMapMotion is a simulated dataset of radio-map sequences for forecasting future pathloss maps from past maps, introduced by Jia, Cheng and Wang (arXiv 2511.17526, 2025). The maps are generated with the Altair WinProp ray tracer using the Dominant Path Model at 3.5 GHz, 23 dBm Tx power, isotropic antennas, and 1.5 m Tx and Rx heights. Each scene covers a 256 × 256 m area on a 1 m grid. Vehicles follow rule-driven motion at 0.1 s per frame in 300 numbered environments, with 5 trajectories and 20 transmitter positions per environment. The paper reports 30,000 sequences and 450,000 map frames, split into 15,000 training, 5,000 validation, 5,000 test and 5,000 new-environment test sequences. The paper uses 10 context frames and 5 prediction frames per sequence, while the README states 8 context frames and 5 prediction frames. The dataset contains only pathloss maps and no CSI, and the motion rules are not validated against real traffic data.', zh: 'RadioMapMotion 是一个仿真数据集，用于根据历史无线电地图预测未来的路径损耗地图序列，由
    Jia、Cheng 和 Wang 在 arXiv 2511.17526（2025）中提出。地图由 Altair WinProp 射线追踪器采用 Dominant Path Model（DPM）生成，载频 3.5 GHz，发射功率 23 dBm，天线为各向同性，收发高度均为 1.5 m。每个场景覆盖 256 × 256 m 区域，网格为 1 m。车辆按规则驱动运动，每帧 0.1 s，共 300 个编号环境，每个环境包含 5 条轨迹和 20 个发射机位置。论文报告共 30,000 个序列和 450,000 帧地图，划分为 15,000 个训练序列、5,000 个验证序列、5,000 个测试序列和 5,000 个新环境测试序列。论文中每个序列包含 10 帧上下文和 5 帧预测，README 则给出 8 帧上下文和 5 帧预测。数据集仅包含路径损耗地图，不含 CSI，运动规则未经真实交通数据验证。'}
signal_details:
- signal: pathloss
  text: {en: 'Pathloss in dB on a 256 × 256 grid with 1 m spacing, computed with WinProp DPM at 3.5 GHz. The paper describes compressed floating-point .npz files in dB, and the README distributes PNG images under data/gain/. The PNG values are 8-bit grayscale: pathloss is clipped to [-135, -39.5] dB, scaled linearly to [0, 1] and quantized to integer levels 0–255. The paper does not define how uncovered cells are encoded.', zh: '路径损耗（dB），256 × 256 网格，间距 1 m，由 WinProp DPM 在 3.5 GHz 下计算。论文描述了以 dB 表示的压缩浮点 .npz 文件，README 则在 data/gain/ 下提供 PNG 图像。PNG 为 8 位灰度：路径损耗裁剪到 [-135, -39.5] dB，线性缩放到 [0, 1]，再量化为 0–255 的整数等级。论文未定义未覆盖栅格的编码方式。'}
