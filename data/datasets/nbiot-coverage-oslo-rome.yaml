summary: {en: 'Geo-tagged NB-IoT scans from a Rohde and Schwarz TSMA6 scanner in 7 Oslo and 6 Rome campaigns, with RF values and CIR maximum delay per NPCI and eNodeB, plus estimated eNodeB positions. The archive is about 47 MB.', zh: '使用 Rohde and Schwarz TSMA6 扫描仪在奥斯陆 7 次、罗马 6 次测量活动中采集的带地理标签 NB-IoT 扫描数据，含每个 NPCI 与 eNodeB 的射频值及 CIR 最大时延，并附 eNodeB 估计位置。压缩包约 47 MB。'}
overview:
  en: 'The dataset holds NB-IoT network scans collected in two outdoor urban settings, Oslo in Norway and Rome in Italy. A Rohde and Schwarz TSMA6 mobile network scanner recorded 7 campaigns in Oslo and 6 in Rome. Each raw coverage row is geo-tagged and gives the NB-IoT Physical Cell Identifier (NPCI), operator, country code, eNodeB ID, RSSI, SINR, RSRP and RSRQ, with a time stamp and GPS information. A second raw file per campaign gives channel impulse response (CIR) statistics for each NPCI, including the maximum delay. Processed data are stored per city in MATLAB workspace (.mat) files. Each data point is identified by a latitude and longitude pair and holds RF and CIR maximum-delay measurements for each NPCI, operator and eNodeB combination detected at that point. Estimated eNodeB positions are given as one CSV file per city. For Rome, the release adds a script that interpolates missing data in the original measurements and a second MATLAB workspace with the interpolated data. MATLAB scripts and a function regenerate the processed data from the raw CSV files of each city. The data are distributed as one zip archive of about 47 MB, with CSV and MATLAB formats.'
  zh: '该数据集包含在两个户外城市环境中采集的 NB-IoT 网络扫描数据，城市分别为挪威奥斯陆与意大利罗马。测量使用 Rohde and Schwarz TSMA6 移动网络扫描仪，奥斯陆共 7 次测量活动，罗马共 6 次。每条原始覆盖记录均带地理标签，包含时间戳、GPS 信息、NB-IoT 物理小区标识（NPCI）、运营商、国家码、eNodeB ID，以及 RSSI、SINR、RSRP 与 RSRQ。每次测量还附有一个信道冲激响应（CIR）统计文件，给出各 NPCI 的 CIR 统计量，包括最大时延。处理后的数据按城市以 MATLAB 工作区（.mat）文件保存。每个数据点由一组经纬度标识，记录该点检测到的每个 NPCI、运营商与 eNodeB 组合的射频测量值与 CIR 最大时延。各城市的 eNodeB 估计位置以 CSV 文件提供。罗马数据另附一个缺失数据插值脚本，以及一个含插值结果的 MATLAB 工作区。MATLAB 脚本与函数可由各城市的原始 CSV 文件重新生成处理后的数据。数据以一个约 47 MB 的 zip 压缩包发布，格式为 CSV 与 MATLAB。原始数据按每次测量活动分文件存放，处理结果按城市分别保存。CIR 统计文件中每行为一条 NPCI 检测记录，包含时间戳、GPS 信息、网络字段（NPCI、运营商、国家码、eNodeB-ID）与 CIR 统计量。'
pipeline:
  summary: {en: 'Raw NB-IoT scans from each campaign are grouped by location into MATLAB workspaces per city. eNodeB positions are released as CSV, and Rome adds interpolated data.', zh: '各次测量的原始 NB-IoT 扫描数据按位置归并为每个城市的 MATLAB 工作区。eNodeB 位置以 CSV 发布，罗马数据另含插值结果。'}
  stages:
  - title: {en: Scan NB-IoT campaigns, zh: 进行 NB-IoT 扫描测量}
    detail: {en: 'A Rohde and Schwarz TSMA6 scanner records NB-IoT cells during 7 campaigns in Oslo and 6 in Rome. Each coverage row is geo-tagged and carries NPCI, operator, country code, eNodeB ID, RSSI, SINR, RSRP and RSRQ. A separate file per campaign carries the CIR statistics for each NPCI.', zh: 'Rohde and Schwarz TSMA6 扫描仪在奥斯陆 7 次、罗马 6 次测量活动中记录 NB-IoT 小区。每条覆盖记录带地理标签，包含 NPCI、运营商、国家码、eNodeB ID、RSSI、SINR、RSRP 与 RSRQ。每次测量另有单独文件，给出各 NPCI 的 CIR 统计量。'}
    inputs:
    - {en: 'NB-IoT signals in Oslo and Rome', zh: '奥斯陆与罗马的 NB-IoT 信号'}
    outputs:
    - {en: 'NB-IoT_coverage_C<X>.csv and NB-IoT_RefSig_cir_C<X>.csv for each campaign', zh: '每次测量一组 NB-IoT_coverage_C<X>.csv 与 NB-IoT_RefSig_cir_C<X>.csv'}
  - title: {en: Group measurements by location, zh: 按位置归并测量数据}
    detail: {en: 'A MATLAB script groups entries by latitude and longitude. Each data point holds the RF and CIR maximum-delay values for every NPCI, operator and eNodeB combination detected there.', zh: 'MATLAB 脚本按纬度与经度归并记录。每个数据点保存该点检测到的每个 NPCI、运营商与 eNodeB 组合的射频值与 CIR 最大时延。'}
    inputs:
    - {en: 'Raw CSV files of each campaign', zh: '各次测量的原始 CSV 文件'}
    outputs:
    - {en: 'Processed MATLAB workspace (.mat) for each city', zh: '每个城市一个处理后的 MATLAB 工作区（.mat）'}
    controls:
    - {en: 'MATLAB script and function supplied with the release', zh: '发布包附带 MATLAB 脚本与函数'}
  - title: {en: Estimate eNodeB positions, zh: 估计 eNodeB 位置}
    detail: {en: 'Estimated eNodeB positions are released as one CSV file per city.', zh: '每个城市的 eNodeB 估计位置以一个 CSV 文件发布。'}
    outputs:
    - {en: 'eNodeB position CSV for each city', zh: '每个城市一个 eNodeB 位置 CSV 文件'}
  - title: {en: Interpolate Rome data, zh: 插值罗马数据}
    detail: {en: 'A script interpolates missing data in the original Rome measurements. The interpolated values are released as a second MATLAB workspace. The rationale and procedure are given in De Nardis et al., Sensors 2023.', zh: '脚本对罗马原始测量中缺失的数据进行插值。插值结果以第二个 MATLAB 工作区发布。插值依据与步骤见 De Nardis 等人，Sensors 2023。'}
    inputs:
    - {en: 'Original Rome MATLAB workspace', zh: '罗马原始 MATLAB 工作区'}
    outputs:
    - {en: 'Interpolated Rome MATLAB workspace', zh: '罗马插值后的 MATLAB 工作区'}
