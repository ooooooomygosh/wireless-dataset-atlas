summary: {en: 'Time-varying industrial radio channel measurements taken at a 1 kHz measurement frequency from a moving setup on a constant vehicle trajectory. The record describes 10 measurement scenarios, with obstacles added between repetitions.', zh: 在工业环境中，沿固定车辆轨迹运动的测量装置以 1 kHz 测量频率采集的时变无线信道数据。记录描述了 10 个测量场景，重复测量之间加入了障碍物。}
