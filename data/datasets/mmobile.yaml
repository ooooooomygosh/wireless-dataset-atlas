pipeline:
  summary: {en: 'A fixed gNB and a UE that steps through discrete positions on four links. At each position the transmit beam is scanned, and an OFDM sounder records a 256-entry complex channel estimate and a received-power value for every beam, saved in four MAT files.', zh: gNB 固定，UE 在四条链路上沿离散位置移动。每个位置扫描发射波束，OFDM 声探为每个波束记录 256 个复数信道估计值和一个接收功率值，保存在四个 MAT 文件中。}
  scope: {en: 'Four official MAT files, analyse_mmobile_data.m and cosineInterpolateCIR.m from the GitHub repository (last push 2022-05-25), with the README; 28 GHz position-by-beam channels.', zh: GitHub 仓库中的四个官方 MAT 文件，以及 analyse_mmobile_data.m 和 cosineInterpolateCIR.m（最后一次推送为 2022-05-25），并参照 README；28 GHz 位置×波束信道。}
  stages:
  - title: {en: Set up four links and discrete UE positions, zh: 设置四条链路与离散 UE 位置}
    detail: {en: 'The gNB is fixed and the UE is placed at discrete positions on indoor 2.5 m and 4.2 m links and outdoor 10 m and 30 m links, with 21, 32, 31 and 45 positions respectively. Position resolution is 0.1, 0.1, 0.2 and 0.6 m. The outdoor 30 m link contains a blockage between 3.9 m and 4.8 m.', zh: gNB 固定，UE 放置于室内 2.5 m 与 4.2 m 链路及室外 10 m 与 30 m 链路的离散位置上，分别为 21、32、31 和 45 个位置。位置分辨率为 0.1、0.1、0.2 和 0.6 m。室外 30 m 链路在 3.9 m 至 4.8 m 之间存在遮挡。}
    outputs:
    - {en: Position index for each link configuration, zh: 每种链路配置的位置索引}
    controls:
    - {en: 'The outdoor 30 m step is 0.6 m in the README and 0.3 m in analyse_mmobile_data.m. The README gives movement directions of 90, 90, 90 and 120 degrees, while the script uses orientations of 0, 0, 0 and 30 degrees.', zh: 室外 30 m 的步长在 README 中为 0.6 m，在 analyse_mmobile_data.m 中为 0.3 m。README 给出的运动方向为 90、90、90、120 度，脚本中的朝向参数为 0、0、0、30 度。}
  - title: {en: Scan transmit beams at each position, zh: 在每个位置扫描发射波束}
    detail: {en: At each location the transmit beam is scanned and data are collected for every beam. The MAT arrays hold 31 beam indices per position., zh: 每个位置扫描发射波束并逐波束采集数据。MAT 数组中每个位置对应 31 个波束索引。}
    outputs:
    - {en: Position-by-beam observations, zh: 位置×波束观测}
  - title: {en: Estimate OFDM channels and received power, zh: 估计 OFDM 信道与接收功率}
    detail: {en: 'The sounder uses 256 subcarriers at 240 kHz spacing, which the README states is consistent with the 5G NR numerology at FR2. Each position and beam yields a 256-entry complex estimate (rx_h_est_vec) and a received-power value (rssi).', zh: 声探使用 256 个子载波，间隔 240 kHz。README 称该参数与 FR2 的 5G NR 参数集一致。每个位置和波束得到一个 256 项复数估计值（rx_h_est_vec）和一个接收功率值（rssi）。}
    outputs:
    - {en: Complex channel estimate per beam (rx_h_est_vec), zh: 每波束复数信道估计（rx_h_est_vec）}
    - {en: Received power per beam (rssi), zh: 每波束接收功率（rssi）}
  - title: {en: Store one MAT file per link configuration, zh: 每种链路配置保存一个 MAT 文件}
    detail: {en: 'The dataset folder holds indoor_2_5m_data.mat, indoor_4_2m_data.mat, outdoor_10m_data.mat and outdoor_30m_data.mat. Each file is in MATLAB 5.0 format and contains only rssi and rx_h_est_vec, with no timestamps or per-path fields.', zh: dataset 文件夹包含 indoor_2_5m_data.mat、indoor_4_2m_data.mat、outdoor_10m_data.mat 与 outdoor_30m_data.mat。每个文件为 MATLAB 5.0 格式，仅包含 rssi 与 rx_h_est_vec，不含时间戳或逐径字段。}
    outputs:
    - {en: Four MAT files, zh: 四个 MAT 文件}
  - title: {en: Interpolate and plot CIR with the official script, zh: 用官方脚本插值并绘制 CIR}
    detail: {en: 'analyse_mmobile_data.m takes one position and one beam and passes the 256-entry vector through cosineInterpolateCIR, a raised-cosine upsampling by a factor of 8 with rolloff 0.25 and filter span 16 symbols. It plots the result against a time axis in ns, computed with a bandwidth of 240 kHz x 256 x 0.8, which assumes that 80% of the subcarriers carry data. The script also plots RSS over position and beam angle.', zh: analyse_mmobile_data.m 取一个位置和一个波束，将 256 项向量输入 cosineInterpolateCIR（上采样倍数 8，滚降系数 0.25，滤波器跨度 16 个符号的升余弦插值），并以 ns 为单位的时间轴绘图。时间轴按 240 kHz × 256 × 0.8 的带宽计算，即假设 80% 的子载波承载数据。脚本还绘制随位置和波束角变化的 RSS 图。}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: 'rssi (positions × 31) and rx_h_est_vec (positions × 31 × 256, complex) in each of the four MAT files.', zh: 四个 MAT 文件中各自包含 rssi（位置数 × 31）与 rx_h_est_vec（位置数 × 31 × 256，复数）。}
- label: {en: Derived outputs, zh: 派生输出}
  text: {en: 'Distance axis (step × index) and a geometric angle per position, computed in analyse_mmobile_data.m, plus the cosine-interpolated vector and its delay axis in ns.', zh: analyse_mmobile_data.m 计算得到的每个位置的距离轴（步长 × 索引）与几何角度，以及插值后的向量及其以 ns 为单位的时延轴。}
provenance:
- {en: Real indoor/outdoor fixed gNB and mobile UE → transmit-beam sweeps at each position, zh: 真实室内外固定gNB与移动UE → 各位置发射波束扫描}
- {en: OFDM sounding → complex frequency-domain channel for each beam → position/beam indices, zh: OFDM声探 → 每波束复数频域信道 → 位置/beam索引}
technical_notes:
- {en: The official script treats each 256-entry rx_h_est_vec vector as a channel impulse response and labels its axis in ns., zh: 官方脚本将每个 256 项 rx_h_est_vec 向量视为信道冲激响应，并以 ns 标注其时间轴。}
limitations:
- {en: 'The README gives a 0.6 m position resolution for the outdoor 30 m link, while analyse_mmobile_data.m uses 0.3 m.', zh: README 给出室外 30 m 链路的位置分辨率为 0.6 m，而 analyse_mmobile_data.m 使用 0.3 m。}
- {en: 'The MAT files contain no timestamps, so UE-motion acquisition times are not available; positions are indexed discretely.', zh: MAT 文件不含时间戳，因此没有 UE 运动采集时间；位置以离散索引标识。}
- {en: 'The GitHub repository has no LICENSE file, and the GitHub API reports no license.', zh: GitHub 仓库没有 LICENSE 文件，GitHub API 也未报告许可证。}
history:
- {en: '2020-09-25: mMobile paper published in the mmNets''20 proceedings; the MAT files were created in August 2020.', zh: 2020-09-25：mMobile 论文发表于 mmNets'20 论文集；MAT 文件创建于 2020 年 8 月。}
- {en: '2022-05-25: last push to the GitHub repository.', zh: 2022-05-25：GitHub 仓库最后一次推送。}
usage:
- {en: 'Read rx_h_est_vec as (position, beam, subcarrier); analyse_mmobile_data.m indexes it as squeeze(rx_h_est_vec(loc, beamidx, :)).', zh: '将 rx_h_est_vec 按（位置、波束、子载波）读取；analyse_mmobile_data.m 中的索引方式为 squeeze(rx_h_est_vec(loc, beamidx, :))。'}
- {en: 'The figures folder holds the script''s CIR and RSS plots for each of the four configurations, eight PNG files in total.', zh: figures 文件夹保存了脚本对四种配置输出的 CIR 与 RSS 图，共 8 个 PNG 文件。}
field_notes:
- label: {en: Paths, zh: 路径}
  text: {en: 'The MAT files contain no per-path records (no path angles, delays or interaction types). The geometric angle computed by the script is derived from position and link geometry.', zh: MAT 文件不含逐径记录（无路径角度、时延或交互类型）。脚本计算的几何角度由位置与链路几何推导得到。}
- label: {en: Camera, zh: 相机}
  text: {en: The repository contains no camera or image data; the figures folder holds script outputs only., zh: 仓库不含相机或图像数据；figures 文件夹仅包含脚本输出。}
- label: {en: Time, zh: 时间}
  text: {en: 'The time axis in analyse_mmobile_data.m is a delay axis in ns derived from the bandwidth, not an acquisition time.', zh: analyse_mmobile_data.m 中的时间轴是由带宽推导出的以 ns 为单位的时延轴，并非采集时间。}
overview: {en: 'mMobile is a 28 GHz channel measurement dataset from the University of California San Diego, described in a 2020 mmNets''20 paper. It contains full CSI measurements for a mobile user at four gNB-UE link configurations: indoor at 2.5 m (21 positions) and 4.2 m (32 positions), and outdoor at 10 m (31 positions) and 30 m (45 positions), 129 UE positions in total. At each position the transmit beam is scanned, so each record is tagged by UE location and beam index. The channel uses 256 subcarriers at 240 kHz spacing, which the authors state matches 5G NR numerology at FR2. The spatial resolutions are 0.1 m, 0.1 m, 0.2 m, and 0.6 m, and the 30 m outdoor configuration includes a blockage between 3.9 m and 4.8 m. The public GitHub repository holds the data in a dataset/ folder, with the MATLAB scripts analyse_mmobile_data.m and cosineInterpolateCIR.m.', zh: mMobile 是一个 28 GHz 信道测量数据集，由美国加州大学圣地亚哥分校发布，对应 2020 年 mmNets'20 论文。数据包含移动用户在四种 gNB–UE 链路配置下的完整 CSI 测量：室内 2.5 m（21 个位置）与 4.2
    m（32 个位置），室外 10 m（31 个位置）与 30 m（45 个位置），共 129 个 UE 位置。每个位置都扫描发射波束，因此每条记录按 UE 位置和波束索引标注。信道使用 256 个子载波，间隔 240 kHz，作者称其与 FR2 的 5G NR 参数集一致。空间分辨率分别为 0.1 m、0.1 m、0.2 m 和 0.6 m，其中 30 m 室外配置包含 3.9 m 至 4.8 m 之间的遮挡。公开的 GitHub 仓库将数据保存在 dataset/ 文件夹中，并附有 MATLAB 脚本 analyse_mmobile_data.m 和 cosineInterpolateCIR.m。}
signal_details:
- signal: csi
  text: {en: 'Full channel measurements at 28 GHz. Each position holds 31 beam-specific vectors of 256 complex values (rx_h_est_vec), with 240 kHz subcarrier spacing.', zh: 28 GHz 完整信道测量。每个位置包含 31 个按波束区分的向量，每个向量为 256 个复数值（rx_h_est_vec），子载波间隔 240 kHz。}
- signal: rssi
  text: {en: 'Received power for each position and beam, stored as a positions-by-31 array (rssi) in each MAT file.', zh: 每个位置和每个波束的接收功率，以每个 MAT 文件中的 positions × 31 数组（rssi）保存。}
mobility: mobile UE at discrete positions on each link (21 to 45 positions, 0.1 to 0.6 m steps) with a fixed gNB
capabilities:
- key: csi
  status: provided
  note: {en: 'Complex 28 GHz channel estimates (rx_h_est_vec) with 256 subcarriers at 240 kHz, per UE location and transmit beam; 129 locations in total.', zh: 28 GHz 复数信道估计（rx_h_est_vec），256 个子载波、240 kHz 间隔，按 UE 位置与发射波束给出；共 129 个位置。}
- key: cir
  status: derivable
  note: {en: The released script plots the 256-element channel vector against a delay axis and interpolates it with cosineInterpolateCIR.m; no other transform is documented., zh: 发布的脚本将 256 个元素的信道向量按时延轴绘制，并用 cosineInterpolateCIR.m 插值；未记录其他变换。}
- key: paths
  status: none
  note: {en: 'The script computes only a line-of-sight angle of departure from geometry; no per-path delay, angle or interaction list is released.', zh: 脚本仅根据几何计算视距出发角，未发布逐径时延、角度或交互列表。}
- key: interaction
  status: none
  note: {en: No per-path interaction records., zh: 没有逐径交互记录。}
- key: power
  status: provided
  note: {en: RSS per UE location and beam index in the four MAT files (rssi)., zh: 四个 MAT 文件中按 UE 位置与波束索引给出的 RSS（rssi）。}
