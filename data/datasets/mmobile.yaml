  status: none
  note: {en: Released arrays are channel estimates and RSS; raw I/Q samples are not described., zh: 发布的数组为信道估计与 RSS；未描述原始 I/Q 采样。}
- key: beam_labels
  status: provided
  note: {en: 'Each record carries a beam index, and RSS per beam gives per-beam gains.', zh: 每条记录带有波束索引，逐波束 RSS 给出逐波束增益。}
