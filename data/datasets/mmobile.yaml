summary: {en: '28 GHz CSI measurements with 256 subcarriers at 240 kHz spacing, tagged by UE location and beam index, for indoor 2.5 m and 4.2 m and outdoor 10 m and 30 m gNB-UE links. The four configurations contain 129 UE locations in total.', zh: 28 GHz 信道状态信息（CSI）测量，包含 256 个子载波（子载波间隔 240 kHz），按用户位置和波束索引标注，覆盖室内 2.5 m 和 4.2 m、室外 10 m 和 30 m 的 gNB–UE 链路。四种配置共 129 个用户位置。}
