pipeline:
  summary:
    en: 'Intelligent ray tracing gives path-level records for each Tx–Rx pair on equal-height urban maps. These records are aggregated into 180-bin APS labels, which are normalised and packed with the condition image into training samples.'
    zh: 智能射线追踪为等高城市地图上的每个收发对给出路径级记录。这些记录被聚合为 180 维 APS 标签，再经归一化后与条件图像一同打包为训练样本。
  stages:
    - title: {en: Build maps and Tx/Rx locations, zh: 构建地图与收发位置}
      detail: {en: 'Each of 51 equal-height urban maps has 100 transmitter and 500 receiver locations, giving about 2.55 million Tx–Rx pairs under the same IRT settings.', zh: '51 个等高城市地图各有 100 个发射位置和 500 个接收位置，同一 IRT 设置下共约 255 万个收发对。'}
      inputs: [{en: Urban building maps, zh: 城市建筑地图}]
      outputs: [{en: Tx–Rx pair list per map, zh: 每张地图的收发对列表}]
    - title: {en: Run intelligent ray tracing, zh: 运行智能射线追踪}
      detail: {en: 'The IRT simulator outputs path-level records, each with delay, arrival angle and linear received power.', zh: 'IRT 仿真器为每条路径输出一条记录，包含时延、到达角和线性接收功率。'}
      inputs: [{en: Map and Tx/Rx pair, zh: 地图与收发对}]
      outputs: [{en: Path-level records per Tx–Rx pair, zh: 每个收发对的路径级记录}]
    - title: {en: Aggregate into 180-bin APS labels, zh: 聚合为 180 维 APS 标签}
      detail: {en: 'Path contributions are combined with a sinc-based delay kernel and an array-response kernel over N antenna elements. Each 2° angle bin keeps the maximum over delay.', zh: '路径贡献经基于 sinc 的时延核和 N 阵元的阵列响应核合成，每个 2° 角度分箱取时延维度上的最大值。'}
      inputs: [{en: Path records, zh: 路径记录}]
      outputs: [{en: 180-bin APS per Tx–Rx pair, zh: 每个收发对的 180 维 APS}]
      controls: [{en: 'Bandwidth-related sampling rate f_s and antenna spacing normalised by wavelength', zh: '与带宽相关的采样率 f_s 及以波长归一化的阵元间距'}]
    - title: {en: Normalise, split and pack samples, zh: 归一化、划分并打包样本}
      detail: {en: 'Each dB-domain APS is shifted by its sample maximum, converted to linear power and standardised with dataset-level statistics. Maps 0–45 form the training set and maps 46–50 the held-out test set. data/preprocess.py with --aps_norm std writes NPZ samples.', zh: '每个 dB 域 APS 减去样本内最大值，转换为线性功率，并用数据集级统计量标准化。地图 0–45 为训练集，地图 46–50 为留出测试集。data/preprocess.py 配合 --aps_norm std 写出 NPZ 样本。'}
      inputs: [{en: APS labels and building maps, zh: APS 标签与建筑地图}]
      outputs: [{en: 'NPZ samples with aps_norm (180) and cond_img (3 × 256 × 256)', zh: '含 aps_norm（180 维）与 cond_img（3 × 256 × 256）的 NPZ 样本'}]
facts:
  - label: {en: Reference baseline, zh: 参考基线}
    text: {en: 'MS-AReg reaches a cosine similarity of 0.948, a peak location error of 1.20° and an inference latency of 0.101 ms per sample on the 249,993-sample test set.', zh: 'MS-AReg 在 249,993 个样本的测试集上取得余弦相似度 0.948、峰值位置误差 1.20° 与每样本 0.101 ms 的推理延迟。'}
  - label: {en: Dominant peaks, zh: 主导峰}
    text: {en: 'About 75% of held-out samples contain at most two dominant peaks, with 2.28 dominant peaks per sample on average.', zh: '约 75% 的留出样本至多含两个主导峰，平均每个样本 2.28 个主导峰。'}
technical_notes:
  - {en: 'The preprocessing script takes --aps_norm std. The shift, linear conversion and standardisation in the paper are applied before training, so the normalised target differs from the raw APS arrays.', zh: '预处理脚本使用 --aps_norm std 参数。论文中的减最大值、线性转换与标准化在训练前完成，因此归一化目标不同于原始 APS 数组。'}
limitations:
  - {en: 'Only equal-height buildings are modelled, so building height variation is absent from the benchmark.', zh: '仅建模等高建筑，基准中不含建筑高度变化。'}
  - {en: 'The paper does not state the carrier frequency, bandwidth or antenna array size, so the APS labels cannot be tied to a band or array.', zh: '论文未说明载频、带宽与天线阵列规模，因此 APS 标签无法对应到具体频段或阵列。'}
  - {en: 'The dataset licence is not stated. The code repository reports no licence on GitHub.', zh: '数据集许可未说明；代码仓库在 GitHub 上未显示许可证。'}
  - {en: 'The data are hosted on Baidu Netdisk behind the extraction code p7sz. The files were not downloaded, so the file layout is taken from the README.', zh: '数据托管于百度网盘，提取码为 p7sz。未下载文件，文件结构依据仓库 README。'}
