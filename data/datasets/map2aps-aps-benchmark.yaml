summary:
  en: 'A benchmark that predicts 180-bin angle power spectra from urban building maps and Tx/Rx positions. Labels come from intelligent ray-tracing records over 51 equal-height urban maps and about 2.55 million Tx–Rx samples.'
  zh: 基于智能射线追踪记录构建的基准，由城市建筑图与收发位置预测 180 个角度分箱的功率谱。数据覆盖 51 个等高城市地图，约 255 万组收发样本。
overview:
  en: 'Map2APS is a benchmark for predicting the angle power spectrum (APS) of a Tx–Rx link from a rasterized urban map and the transmitter and receiver positions. The release covers 51 urban maps in which all buildings have the same height. Each map has 100 transmitter locations and 500 receiver locations, giving about 2.55 million samples. The labels come from intelligent ray tracing (IRT). For each Tx–Rx pair, the path records (delay, arrival angle and linear received power) are aggregated with a sinc delay kernel and an array-response kernel into a 180-bin APS over [-180°, 180°) at 2° resolution, keeping the dominant directional energy in each bin. The model input is a three-channel 256 × 256 condition image: a binary building map plus Gaussian heatmaps at the transmitter and the receiver. Maps 0 to 45 are used for training and model development. Maps 46 to 50 form a held-out test set with no map overlap, and the test set contains 249,993 samples. The raw APS arrays are stored as aps_*.npy files in per-map folders, and building layouts are stored as one JSON file per map. The repository preprocessing script writes NPZ samples that hold a normalised 180-element APS vector (aps_norm) and the 3 × 256 × 256 condition image (cond_img).'
  zh: 'Map2APS 是一个基准，用于由城市栅格地图和收发机位置预测收发链路的角度功率谱（APS）。数据覆盖 51 个城市地图，每个地图中所有建筑高度相同。每个地图有 100 个发射位置和 500 个接收位置，共约 255 万个样本。标签来自智能射线追踪（IRT）：对每个收发对，将路径记录（时延、到达角和线性接收功率）经 sinc 时延核与阵列响应核聚合，得到覆盖 [-180°, 180°) 的 180 点 APS，角度分辨率为 2°，每个角度分箱保留主导方向能量。模型输入为三通道 256 × 256 条件图像，包括二值建筑图以及发射端和接收端的高斯热图。地图 0 至 45 用于训练和模型开发，地图 46 至 50 作为无地图重叠的留出测试集，测试集含 249,993 个样本。原始 APS 数组以 aps_*.npy 文件存放于各地图文件夹，建筑布局为每张地图一个 JSON 文件。仓库中的预处理脚本输出 NPZ 样本，包含归一化的 180 维 APS 向量（aps_norm）与 3 × 256 × 256 条件图像（cond_img）。训练目标为归一化后的 180 维向量，因此模型学习的是相对方向谱形状与主导峰结构，而非绝对功率。基准在同一交叉地图划分下比较多类回归模型，评价指标包括 MAE、PSNR、NMSE、余弦相似度、谱角、峰值位置误差以及主导方向命中率与召回率，并报告每个样本的推理延迟。'
