summary: {en: 'Aggregated mobile phone activity (SMS, call and Internet CDR counts) per grid square for Milan and the Province of Trentino, released with geolocated tweets, weather, electricity, news and administrative datasets.', zh: 米兰市和特伦托省按网格区块汇总的手机活动数据（短信、通话和互联网 CDR 计数），并与地理定位推文、气象、电力、新闻及行政区划数据一同发布。}
