overview: {en: 'This dataset is a multi-source open record of urban life in the city of Milan and the Province of Trentino, Italy. Telecom Italia is the source of the telecommunications part and released the data in 2015 with the Scientific Data descriptor DOI 10.1038/sdata.2015.55. The telecommunications files are derived from Call Detail Records (CDRs) of the Telecom Italia cellular network, which log user activity for billing and network management. The Dataverse entries contain SMS, call and Internet activity computed from these CDRs for Milan and for Trentino. The same release includes weather, news, social-network, electricity and administrative data for the two areas. The telecom files are daily text files, one per day from 1 November 2013 to 1 January 2014, with 62 files each for Milan and Trentino. Some datasets are spatially aggregated over grids, the Milano Grid and the Trentino Grid, which are provided as GeoJSON files. The authors name energy consumption, mobility planning,
    tourist and migrant flows, urban structures, event detection and urban well-being as target problems.', zh: 该数据集是意大利米兰市和特伦托省城市生活的多源开放记录。电信部分的数据来源为 Telecom Italia，于 2015 年随 Scientific Data 数据说明文章发布（DOI 10.1038/sdata.2015.55）。电信文件由 Telecom Italia 蜂窝网络的呼叫详单记录（CDR）计算得出，CDR 记录用户活动，用于计费和网络管理。Dataverse 条目包含基于这些 CDR 计算的米兰和特伦托的 SMS、通话和互联网活动数据。同一发布还包括两个地区的气象、新闻、社交网络、电力和行政区划数据。电信文件为每日文本文件，从 2013 年 11 月 1 日至 2014 年 1 月 1 日，米兰和特伦托各 62 个文件。部分数据集按网格进行空间汇总，即 Milano Grid 和 Trentino Grid，以 GeoJSON 文件提供。作者列出的目标问题包括能源消耗、出行规划、游客和移民流动、城市结构、事件检测以及城市宜居性。}
signal_details:
- signal: traffic
  text: {en: 'Telecom Italia cellular-network activity for SMS, calls and Internet, computed from CDRs, with one file per day. There are 62 daily text files for Milan (MI) and 62 for Trentino (TN), covering 1 November 2013 to 1 January 2014. File sizes range from 277,460,259 to 376,123,111 bytes for Milan and from 149,176,708 to 310,794,216 bytes for Trentino. The grid polygons are supplied as GeoJSON: milano-grid.geojson (3,168,596 bytes) and trentino-grid.geojson (2,117,045 bytes).', zh: 'Telecom Italia 蜂窝网络的 SMS、通话和互联网活动数据，由 CDR 计算得出，每天一个文件。米兰（MI）和特伦托（TN）各有 62 个每日文本文件，时间范围为 2013 年 11 月 1 日至 2014 年 1 月 1 日。米兰文件大小为 277,460,259 至 376,123,111 字节，特伦托文件大小为 149,176,708 至 310,794,216 字节。网格多边形以 GeoJSON 提供：milano-grid.geojson（3,168,596 字节）和 trentino-grid.geojson（2,117,045 字节）。'}
