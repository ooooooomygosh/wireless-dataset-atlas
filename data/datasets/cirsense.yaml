summary: {en: '802.11ax CSI at 5.25 GHz with 160 MHz bandwidth, collected with PicoScenes and an Intel AX200 NIC, for single-target breathing, ranging, two-target and NLoS breathing sensing. Ground truth is a NeuLog respiration belt and measured target distances.', zh: 载频5.25 GHz、带宽160 MHz 的 802.11ax CSI，使用 PicoScenes 与 Intel AX200 网卡采集，涵盖单目标呼吸、测距、双目标和 NLoS 呼吸感知。真值为 NeuLog 呼吸带及测得的目标距离。}
