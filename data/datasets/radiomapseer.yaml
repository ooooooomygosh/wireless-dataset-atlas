id: radiomapseer
name: RadioMapSeer
year: 2022
origin: simulation
tasks: [radio-map, localization]
signals: [pathloss, rssi]
environment: [outdoor-urban]
size_gb: 3
license: CC BY 4.0
access: {url: 'https://radiomapseer.github.io/', type: open}
code: ['https://github.com/RonLevie/RadioUNet']
paper: arxiv:2212.11777
used_in: []
citing: ['doi:10.1109/twc.2023.3273202', 'doi:10.1109/tccn.2024.3502492', 'doi:10.1109/twc.2024.3457431']
summary: {en: 'Simulated radio maps of path loss, received signal strength and time of arrival over dense urban areas modeled on actual city layouts. The main download is about 3 GB.', zh: 基于真实城市布局建模的密集城区仿真无线电地图，包括路径损耗、接收信号强度（RSS）和到达时间（ToA）。主下载包约 3 GB。}
sources: ['https://radiomapseer.github.io/', 'https://arxiv.org/abs/2212.11777']
checked: '2026-11-06'
pipeline:
  summary: {en: 'Urban maps and Tx positions enter WinProp; DPM or IRT generates pathloss/ToA grids, which are then encoded as images. Model fidelity and image encoding are two separate processing stages.', zh: 城市地图和Tx位置进入WinProp，DPM或IRT生成路径损耗/ToA栅格，再编码成图像。模型保真度和图像编码是两层独立加工。}
  stages:
  - title: {en: Prepare maps and transmitter positions, zh: 准备地图与发射机位置}
    detail: {en: 'Build maps and propagation regions, setting building heights, antenna heights, and frequencies for the specific package.', zh: 建立地图及传播区域，按具体包设置建筑高度、天线高度和频率。}
    inputs:
    - {en: 'Building footprints, roads, and optional vehicles', zh: 建筑footprint、道路和可选车辆}
    - {en: Tx positions per map, zh: 每图Tx位置}
    outputs:
    - {en: Maps/masks, zh: 地图/掩码}
    - {en: Tx coordinates and scene configuration, zh: Tx坐标和场景配置}
    controls:
    - {en: 'Researcher specifies: 2D/3D package, coordinate scale, building/antenna heights', zh: 研究者固定：2D/3D包、坐标尺度、建筑/天线高度}
    - {en: Verify the 701/700 map count against the downloaded package, zh: 701/700地图口径按下载包核验}
    checks:
    - {en: Retain a shared map ID for all Tx positions on the same map, zh: 同地图各Tx保留共同map ID}
    - {en: 'Record geometry, frequency, and antenna configurations separately for 3D and 2D versions', zh: 3D与2D版本的几何、频率和天线配置分别记录}
  - title: {en: Select DPM or IRT solver settings, zh: 选择DPM或IRT求解配置}
    detail: {en: 'Compute propagation with DPM, IRT2, or IRT4; original IRT uses 100 m tiles and later high-accuracy versions use 10 m tiles.', zh: 分别用DPM、IRT2或IRT4计算传播；原始IRT使用100m tile，后续高精度版本用10m tile。}
    inputs:
    - {en: Environment maps, zh: 环境地图}
    - {en: WinProp model and interaction/acceleration parameters, zh: WinProp模型和交互/加速参数}
    outputs:
    - {en: Solver jobs labeled by model, zh: 按模型标记的求解任务}
    controls:
    - {en: 'Researcher specifies: DPM/IRT level, tile size, propagation parameters, and grid', zh: 研究者固定：DPM/IRT级别、tile、传播参数和网格}
    - {en: Original IRT4 covers only a smaller Tx subset, zh: 原始IRT4仅为较小Tx子集}
    checks:
    - {en: Separate model differences from map differences, zh: 将模型差异与地图差异分开}
    - {en: 'Preserve the identities of the original package and later, more realistic simulation packages', zh: 保留原始包和后续更真实模拟包的身份}
  - title: {en: Solve pathloss and optional ToA, zh: 求解路径损耗及可选ToA}
    detail: {en: Generate propagation maps from each Tx to all locations; ToA is available only in corresponding extensions. Vehicle-inclusive 2D versions correct the propagation maps using the DPM difference with/without vehicles., zh: 生成每个Tx到各位置的传播图；ToA仅在相应扩展提供。含车2D版本使用DPM有车/无车差值修正相应传播图。}
    inputs:
    - {en: Solver task, zh: 求解任务}
    - {en: Receiver grid, zh: 接收栅格}
    outputs:
    - {en: Floating-point pathloss grids, zh: 浮点pathloss栅格}
    - {en: ToA or vehicle-inclusive maps provided by the corresponding package, zh: 相应包提供的ToA或含车地图}
    controls:
    - {en: 'Paper processing: multiply the vehicle-induced difference by 0.5 and add it to the corresponding map', zh: 论文处理：含车差值乘0.5后加入对应地图}
    - {en: 'Researcher specifies: output quantity, no-coverage values, and thresholds', zh: 研究者固定：输出量、无覆盖值与阈值}
    checks:
    - {en: Indicate whether vehicles are represented by synthetic corrections or independent RT for each model, zh: 标记车辆是修正合成还是逐模型独立RT}
    - {en: Use IRT4 as a simulation reference, zh: IRT4作为模拟参照使用}
  - title: {en: Encode images and auxiliary masks, zh: 编码图像与辅助掩码}
    detail: {en: 'Clip and scale propagation quantities to grayscale as specified by the package, and pair them with map masks.', zh: 按包规定将传播量裁剪、缩放为灰度图，并与地图掩码配对。}
    inputs:
    - {en: Physical grids, zh: 物理栅格}
    - {en: Building/road/Tx-position masks, zh: 建筑/道路/Tx位置掩码}
    outputs:
    - {en: PNG/array training samples, zh: PNG/数组训练样本}
    - {en: Mapping between physical values and pixels, zh: 物理值与像素的映射}
    controls:
    - {en: 'Researcher specifies: dB range, quantization, thresholds, and pixel coordinates', zh: 研究者固定：dB范围、量化、阈值与像素坐标}
    checks:
    - {en: Check whether normalization is invertible and which ranges are clipped, zh: 检查归一化是否可逆及被裁剪范围}
    - {en: Restore a consistent physical quantity before comparing models, zh: 模型比较先还原到一致物理量}
  - title: {en: Define map-estimation and downstream tasks, zh: 定义地图估计与下游任务}
    detail: {en: 'Build sparse-to-dense map estimation, localization, or coverage tasks; group by map to control leakage from shared geometry.', zh: 研究者建立稀疏到稠密地图估计、定位或覆盖任务；以地图分组控制共享几何泄漏。}
    inputs:
    - {en: 'Images, Tx positions, and optional sparse measurement points', zh: 图像、Tx和可选稀疏测量点}
    - {en: Train/test map IDs, zh: 训练/测试map ID}
    outputs:
    - {en: Estimation/localization samples, zh: 估计/定位样本}
    - {en: Map errors and coverage-decision results, zh: 地图误差及覆盖决策结果}
    controls:
    - {en: 'Researcher specifies: sampling-point visibility, splits, noise, and thresholds', zh: 研究者固定：采样点可见性、切分、噪声和阈值}
    checks:
    - {en: Random Tx splits within the same map must be labeled as tests on seen maps, zh: 同图不同Tx随机划分需标为已见地图测试}
    - {en: Power maps support corresponding power-domain decisions; complex CSI requires separate generation, zh: 功率地图只支持相应功率域决策，复CSI需另生成}
  scope: {en: 'Distinguish original RadioMapSeer, Pathloss/ToA, and 3D IRT extensions by package.', zh: 原始RadioMapSeer与Pathloss/ToA、3D IRT扩展按包区分。}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: '• Precomputed pathloss maps and map masks

      • ToA/3D IRT maps from the specified extensions', zh: '• 预计算路径损耗图和地图掩码

      • 指定扩展的ToA/3D IRT地图'}
- label: {en: Derived outputs, zh: 派生输出}
  text: {en: '• Sparse-observation samples

      • Localization, coverage/outage, and power-domain planning labels', zh: '• 稀疏观测样本

      • 定位、coverage/outage和功率域规划标签'}
- label: {en: What the researcher controls, zh: 研究者可控范围}
  text: {en: controls and checks identify settings to fix or verify when reproducing or using the data. Values explicitly labeled as paper settings come from the cited source; other items are not official defaults., zh: controls和checks是复现/使用时需要固定或验证的项目；其中明确标注论文配置的数值来自原来源，其余不代表官方默认。}
- label: {en: Reproduction notes, zh: 复现说明}
  text: {en: '• Official website and extension paper reviewed; the approximately 3 GB original package was not downloaded.

      • Use the selected package and loader to determine exact encoding ranges, map counts, and Tx subsets.', zh: '• 已读官网与扩展论文，未下载约3GB原始包。

      • 具体编码范围、地图数量与Tx子集以使用的包和loader为准。'}
provenance:
- {en: Urban building footprints and Tx positions, zh: 城市建筑 footprint 与 Tx 位置}
- {en: WinProp DPM/IRT2/IRT4, zh: WinProp DPM/IRT2/IRT4}
- {en: Spatial pathloss maps, zh: 空间路径损耗图}
- {en: Scalar/image encoding and building masks, zh: 标量/图像编码与建筑掩码}
- {en: RadioUNet-style tasks, zh: RadioUNet 类任务}
technical_notes:
- {en: 'Supported by the literature: DPM/IRT2 are coarse models; the IRT4 subset provides a finer simulation reference.', zh: 文献支持：DPM/IRT2 为粗模型，IRT4 子集用于更精细模拟对照。}
- {en: 'Confirmed: the official website explicitly describes later IRT2/IRT4 versions as more realistic than older versions and also provides 3D IRT2.', zh: 已确认：官网明确后续 IRT2/IRT4 比旧版更真实，并另有 3D IRT2。}
- {en: 'Inference: IRT4 remains a simulation reference and must not be labeled real measurement ground truth.', zh: 推断：IRT4 仍是模拟参照，不能标作真实测量 ground truth。}
- {en: 'Supported by the literature: original IRT uses 100 m tiles, while later high-accuracy versions use 10 m tiles; 2D vehicle-inclusive versions add 0.5 times the DPM difference with/without vehicles to the corresponding propagation maps, rather than independently rerunning vehicles for every IRT model.', zh: 文献支持：原始 IRT tile 为100 m，后续高精度版本为10 m；2D含车版本由DPM有车/无车差值乘0.5后加到对应传播图，并非每种IRT均独立重跑车辆。}
limitations:
- {en: Randomly splitting different Tx positions from the same map shares building layouts., zh: 同地图不同 Tx 的随机拆分会共享建筑布局。}
- {en: Converting normalized grayscale to pathloss in dB requires the original mapping; grayscale cannot directly serve as absolute power., zh: 归一化灰度与 dB 路径损耗需要原转换关系，不能直接作绝对功率。}
- {en: 3D at 3.5 GHz and 2D at 5.9 GHz also differ in antenna heights and building settings; they are not controlled cross-frequency pairs., zh: 3D 3.5 GHz 与 2D 5.9 GHz 同时改变天线高度和建筑设置，不是受控跨频配对。}
history:
- {en: '2019: the RadioUNet preprint provides the original data reference.', zh: 2019：RadioUNet 预印本公开原始数据线索。}
- {en: 'Later: the official website links the Pathloss/ToA data paper and upgraded IRT/3D data.', zh: 后续：官网链接 Pathloss/ToA 数据论文与升级 IRT/3D 数据。}
usage:
- {en: Select the original or an extension package and read its corresponding data paper., zh: 选定原始或扩展包，读取对应数据论文。}
- {en: 'Keep map IDs separated, then compare DPM and IRT labels.', zh: 保持 map ID 隔离，再比较 DPM 与 IRT 标签。}
- {en: 'Report errors in dB or a restored physical scale, specifying image encoding and clipping.', zh: 报告以 dB 或恢复尺度定义的误差，列出图像编码和 clipping。}
overview: {en: 'RadioMapSeer is a simulated image dataset of radio maps over dense urban areas, described by Yapar, Levie, Kutyniok and Caire in arXiv 2212.11777 (2022). The maps are based on real city maps of six cities: Ankara, Berlin, Glasgow, Ljubljana, London and Tel Aviv. The dataset contains 701 maps of 256 × 256 m at 1 m per pixel, with 80 transmitter positions per map for the full 2D and 3D sets; the IRT4 subset has 2 transmitters per map, giving 1,402 samples. Simulations use the WinProp ray tracer with the DPM, IRT2 and IRT4 models, at 5.9 GHz for the 2D maps and 3.5 GHz for the 3D rooftop maps. The dataset description covers pathloss, received signal strength (RSS) and time-of-arrival (ToA) maps, and the main download is about 3 GB on Google Drive. More realistic IRT2 and IRT4 datasets and a 3D IRT2 dataset are published on IEEE DataPort, and the data are licensed under CC BY 4.0.', zh: 'RadioMapSeer 是一个密集城市区域无线电地图的仿真图像数据集，由 Yapar、Levie、Kutyniok 和 Caire 在 arXiv 2212.11777（2022）中介绍。地图基于安卡拉、柏林、格拉斯哥、卢布尔雅那、伦敦和特拉维夫六个城市的真实城市地图。数据集包含
    701 幅地图，每幅为 256 × 256 m，分辨率 1 m/像素；二维和三维完整集中每幅地图有 80 个发射机位置，IRT4 子集每幅地图有 2 个发射机，共 1,402 个样本。仿真使用 WinProp 射线追踪器，采用 DPM、IRT2 和 IRT4 模型，二维地图载频为 5.9 GHz，三维屋顶地图载频为 3.5 GHz。数据集说明涵盖路径损耗、接收信号强度（RSS）和到达时间（ToA）地图，主下载包约 3 GB，托管于 Google Drive。IEEE DataPort 上发布了更贴近实际的 IRT2 和 IRT4 数据集以及三维 IRT2 数据集，数据采用 CC BY 4.0 许可。'}
signal_details:
- signal: pathloss
  text: {en: 'Pathloss maps of 256 × 256 pixels at 1 m per pixel, one map per transmitter position. Simulated with WinProp DPM, IRT2 or IRT4 (no software version given), using 23 dBm Tx power and isotropic antennas. Tx height is 1.5 m for the 2D maps and 3 m above rooftop for the 3D maps. Saved as PNG images, with pathloss truncated and scaled to gray levels 0–255. The original IRT uses 100 m tiles; the higher-accuracy versions use 10 m tiles.', zh: 路径损耗地图，256 × 256 像素，每像素 1 m，每个发射机位置对应一幅地图。二维地图 Tx 高度为 1.5 m，三维地图为屋顶以上 3 m。以 PNG 图像保存，路径损耗经截断并缩放为 0–255 灰度等级。原始 IRT 使用 100 m tile，高精度版本使用 10 m tile。}
- signal: rssi
  text: {en: 'Simulated received signal strength (RSS) maps, listed alongside the pathloss maps in the dataset description (arXiv 2212.11777). The sources opened give no separate RSS file format or units.', zh: 仿真接收信号强度（RSS）地图，与路径损耗地图一同列于数据集说明（arXiv 2212.11777）。}
