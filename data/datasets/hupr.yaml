checked: '2026-11-06'
overview: {en: 'HuPR is a benchmark for human pose estimation with millimeter-wave radar, published at WACV 2023 by Lee, Kini, Peng, Ma and Hwang. Two cross-calibrated IWR1843BOOST radars and one monocular RGB camera on the same plane recorded six subjects in indoor scenes. The data consist of 235 sequences of one minute each, split into 193 training, 21 validation and 21 test sequences, with 600 radar-camera triplets per sequence and 141,000 triplets in total. Radar and camera capture 10 frames per second. Keypoint labels are 2D poses that a pretrained HRNet produces from the RGB frames, so the labels involve no manual annotation. Three actions are recorded: static poses, standing with hand waving, and walking with hand waving. An extra test set adds obstacles, low light and no light. Processed radar data are stored as per-frame .npy files in hori and vert folders for each sequence, and the annotations are JSON files for the train, validation and test splits.', zh: 'HuPR 是一个基于毫米波雷达的人体姿态估计基准数据集，由
    Lee、Kini、Peng、Ma 和 Hwang 于 WACV 2023 发表。两台经过交叉标定的 IWR1843BOOST 雷达与一台单目 RGB 相机位于同一平面，在室内记录了六名受试者。数据包含 235 段序列，每段一分钟，划分为 193 段训练序列、21 段验证序列和 21 段测试序列；每段序列含 600 组雷达-相机三元组，共 141,000 组。雷达与相机以每秒 10 帧同步采集。标签为预训练 HRNet 网络在 RGB 图像上生成的二维关键点，不依赖人工标注。数据包含三类动作：静止姿态、站立挥手和行走挥手。另有一个额外测试集，包含遮挡、低光照和无光照条件。处理后的雷达数据以每帧一个 .npy 文件的形式存放在每段序列的 hori 与 vert 文件夹中，标注以 JSON 文件分别给出训练、验证和测试划分。'}
signal_details:
- signal: radar
  text: {en: 'Two identical TI IWR1843BOOST sensors, one rotated 90 degrees relative to the other, placed as close as 3 cm apart. Each sensor has 4 physical transmitters and 3 physical receivers, which form a virtual array of 1 transmitter and 8 receivers. Each frame has 256 ADC samples and 64 chirps, with a chirp duration of 72 us, a sample rate of 4400 ksps, and a frame rate of 10 frames per second. Range resolution is 4.8 cm up to 11 m; the azimuth field of view is 120 degrees and the elevation field of view is 30 degrees, each at 15 degrees resolution.', zh: 两台相同的 TI IWR1843BOOST 传感器，其中一台相对另一台旋转 90°，两者间距可小至 3 cm。每台传感器含 4 个物理发射天线和 3 个物理接收天线，形成 1 个虚拟发射与 8 个虚拟接收的阵列。每帧包含 256 个 ADC 采样点和 64 个 chirp，chirp 时长 72 us，采样率 4400 ksps，帧率 10 fps。距离分辨率为 4.8 cm，最远 11 m；方位角视场为 120°，俯仰角视场为 30°，两者分辨率均为 15°。}
- signal: rgb
  text: {en: One monocular RGB camera mounted on the same plane as the radars. It captures 256×256 frames in sync with the radars at 10 frames per second., zh: 一台单目 RGB 相机与雷达位于同一平面，与雷达同步以每秒 10 帧采集 256×256 图像。}
pipeline:
  summary: {en: 'Two radars and one camera record synchronized frames. Radar frames become velocity-windowed 4D maps, and 2D keypoints from HRNet run on the camera frames serve as labels.', zh: 两台雷达与一台相机同步采集数据帧。雷达帧转换为经速度窗口截取的四维图，相机帧经 HRNet 生成的二维关键点作为标签。}
  stages:
  - title: {en: Synchronized acquisition, zh: 同步采集}
    detail: {en: 'The two IWR1843BOOST radars and the RGB camera are configured to capture 10 frames per second. Each radar frame holds 256 ADC samples and 64 chirps, with a chirp duration of 72 us and a sample rate of 4400 ksps.', zh: 两台 IWR1843BOOST 雷达与 RGB 相机配置为每秒采集 10 帧。每个雷达帧包含 256 个 ADC 采样点和 64 个 chirp，chirp 时长 72 us，采样率 4400 ksps。}
    inputs:
    - {en: Radar chirp configuration, zh: 雷达 chirp 配置}
    outputs:
    - {en: Raw radar frames, zh: 原始雷达帧}
    - {en: RGB frames of 256×256, zh: 256×256 RGB 图像}
  - title: {en: Radar 4D FFT and velocity window, zh: 雷达四维 FFT 与速度窗口}
    detail: {en: 'A 4D FFT over ADC samples, chirps, and the horizontal and vertical antenna dimensions gives range-Doppler-azimuth-elevation maps. A shorter ADC range is selected and the azimuth and elevation dimensions are zero-padded, giving 64×64×64×8 arrays. A velocity window of K = 8 bins is kept, giving VRDAEMaps of shape 2×K×H×W×E with K = 8, H = W = 64 and E = 8.', zh: 对 ADC 采样点、chirp 以及水平和垂直天线维度做四维 FFT，得到距离-多普勒-方位-俯仰图。截取较短的 ADC 距离范围，并对方位与俯仰维进行补零，得到 64×64×64×8 的数组。保留 K = 8 个速度窗口，形成形状为 2×K×H×W×E 的 VRDAEMap，其中 K = 8，H = W = 64，E = 8。}
    inputs:
    - {en: Raw radar frames, zh: 原始雷达帧}
    outputs:
    - {en: VRDAEMaps, zh: VRDAEMap}
  - title: {en: Keypoint label generation, zh: 关键点标签生成}
    detail: {en: 'HRNet, pretrained on MPII, runs on each RGB frame and outputs 2D human keypoints. The HRNet version is not stated. The keypoints serve as supervision for radar-based pose estimation.', zh: 在 MPII 上预训练的 HRNet 对每帧 RGB 图像输出二维人体关键点。论文未给出 HRNet 版本。这些关键点作为雷达姿态估计的监督标签。}
    inputs:
    - {en: RGB frames, zh: RGB 图像}
    outputs:
    - {en: 2D keypoints per frame, zh: 每帧二维关键点}
  - title: {en: Preprocessing and packaging, zh: 预处理与打包}
    detail: {en: 'Running python process_iwr1843 in the preprocessing folder converts raw data from preprocessing/raw_data/iwr1843 into the processed layout. The README lists no parameters for this step. The processed layout has single_N folders with hori and vert .npy frames, plus JSON annotation files for the train, validation and test splits.', zh: 在 preprocessing 目录运行 python process_iwr1843，将 preprocessing/raw_data/iwr1843 中的原始数据转换为处理后的目录结构。README 未列出该步骤的参数。处理后的目录包含 single_N 文件夹（内含 hori 与 vert 的 .npy 帧），以及训练、验证、测试划分的 JSON 标注文件。}
    inputs:
    - {en: Raw radar data, zh: 原始雷达数据}
    outputs:
    - {en: hori and vert .npy frames, zh: hori 与 vert 的 .npy 帧}
    - {en: Annotation JSON files, zh: 标注 JSON 文件}
