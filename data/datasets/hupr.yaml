  status: derivable
  note: {en: Radar power per range-azimuth-elevation bin can be computed from the released raw ADC data with the 4D FFT pre-processing described in the paper., zh: 逐距离-方位-俯仰单元的雷达功率可由发布的原始 ADC 数据经论文所述四维 FFT 预处理计算得到。}
- key: iq
  status: provided
  note: {en: 'Raw ADC samples from the two IWR1843BOOST sensors, 256 per chirp; the sources do not state whether they are stored as complex I/Q.', zh: 来自两台 IWR1843BOOST 传感器的原始 ADC 采样，每个 chirp 256 点；来源未说明是否以复数 I/Q 形式存储。}
- key: beam_labels
  status: none
  note: {en: 'The annotations are body keypoint labels, with no beam indices or per-beam gains.', zh: 标注为人体关键点，不含波束索引或逐波束增益。}
- {key: position, status: unknown}
- key: geometry
  status: none
  note: {en: 'The release holds frames, radar archives and annotation JSON files only, with no 3D scene or map files.', zh: 数据发布内容仅包含图像帧、雷达压缩包和标注 JSON 文件，不含三维场景或地图文件。}
- key: materials
  status: none
  note: {en: 'The release holds frames, radar archives and annotation JSON files only, with no material parameters.', zh: 数据发布内容仅包含图像帧、雷达压缩包和标注 JSON 文件，不含材料参数。}
- key: rgb
  status: provided
  note: {en: 'Monocular 256×256 RGB frames at 10 fps, synchronized with the radar frames in frames.zip.', zh: 单目 256×256 RGB 图像，10 fps，与雷达帧同步，位于 frames.zip 中。}
- key: depth
  status: none
