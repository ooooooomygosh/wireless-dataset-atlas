summary: {en: 'Two cross-calibrated IWR1843BOOST mmWave radars and a monocular RGB camera record six subjects in an indoor setting, with 235 sequences and 141,000 radar-camera triplets. Labels are 2D keypoints from a pretrained pose network run on the camera frames.', zh: '两台经过交叉标定的 IWR1843BOOST 毫米波雷达与一台单目 RGB 相机在室内记录六名受试者的数据，共 235 段序列、141,000 组雷达-相机三元组。标签为在相机图像上由预训练二维姿态估计网络生成的关键点。'}
