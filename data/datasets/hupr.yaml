  note: {en: The sensor setup contains no IMU., zh: 传感器配置不含 IMU。}
- key: time_series
  status: provided
  note: {en: '235 sequences of one minute each, with 600 synchronized frames per sequence at 10 fps.', zh: 235 段序列，每段一分钟，每段 600 个同步帧，帧率 10 fps。}
