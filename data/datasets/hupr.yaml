- key: lidar
  status: none
  note: {en: 'The sensor setup is two mmWave radars and one RGB camera, with no lidar.', zh: 传感器配置为两台毫米波雷达与一台 RGB 相机，不含激光雷达。}
- key: radar
  status: provided
  note: {en: 'Two IWR1843BOOST sensors with 256 ADC samples and 64 chirps per frame at 10 fps, released as raw archives and processed hori and vert frames.', zh: 两台 IWR1843BOOST 传感器，每帧 256 个 ADC 采样与 64 个 chirp，帧率 10 fps，以原始压缩包及处理后的 hori、vert 帧形式发布。}
- key: imu
