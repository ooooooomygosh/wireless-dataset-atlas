versions:
- version: 1.0.0
  date: '2026-09-30'
  summary: {en: 'Zenodo release with 1,400 scenes, 28,000 samples, five scale archives and one metadata archive.', zh: 'Zenodo 发布版本，含 1,400 个场景、28,000 个样本、五个尺度压缩包和一个元数据压缩包。'}
  url: https://zenodo.org/records/23043998
limitations:
- {en: 'The building data contain OpenStreetMap content under ODbL 1.0, which has a separate license scope from the CC BY 4.0 original contributions.', zh: '建筑数据包含 ODbL 1.0 许可的 OpenStreetMap 内容，其许可范围与 CC BY 4.0 许可的原始内容不同。'}
- {en: 'The release does not record the WinProp build version or the OpenStreetMap snapshot date.', zh: '发布内容未记录 WinProp 版本号或 OpenStreetMap 数据快照日期。'}
- {en: 'Gain values are clipped to [-147, -47.84] dB and quantized to 8 bits. The original values cannot be recovered.', zh: '增益值截断至 [-147, -47.84] dB 并量化为 8 位，无法恢复原始数值。'}
- {en: 'Under the benchmark protocol, learned predictors do not use 1024-scale labels for training, adaptation, validation or model selection.', zh: '按基准协议，学习型预测器不得使用 1024 尺度标签进行训练、适配、验证或模型选择。'}
- {en: 'The ScaleProp implementation is planned for public release after the associated article is published.', zh: 'ScaleProp 实现计划在相关论文发表后公开。'}
technical_notes:
- {en: 'The release was accumulated across several production runs, and no single generation seed is asserted.', zh: '发布数据由多次生成运行累积而成，未声明单一生成种子。'}
facts:
- label: {en: Sample identity, zh: 样本标识}
  text: {en: 'Use (size, map_id, tx_id) as the sample identity and (size, map_id) as the scene identity. The scales are not spatially paired, so the same map_id at different scales does not refer to the same region.', zh: '样本标识为 (size, map_id, tx_id)，场景标识为 (size, map_id)。各尺度之间不存在空间配对，不同尺度上相同的 map_id 不对应同一区域。'}
- label: {en: Gain encoding, zh: 增益编码}
  text: {en: 'Decode a pixel u with y = u / 255 and g_dB ≈ -147.0 + 99.16 y. Building pixels have value 0 and must be identified with the building image.', zh: '像素值 u 的解码方式为 y = u / 255，g_dB ≈ -147.0 + 99.16 y。建筑像素值为 0，需结合建筑图像加以区分。'}
