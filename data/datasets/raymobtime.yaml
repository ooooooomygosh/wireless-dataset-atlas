summary: {en: 'Generator for ray-traced mmWave MIMO data, producing propagation paths, path loss, RGB images and LiDAR point clouds in scenes with vehicles, buses, trucks, pedestrians and drones. The repository quick-start script downloads a tiny scenario with ray tracing already done.', zh: 用于生成光线追踪 mmWave MIMO 数据的生成器，输出传播路径、路径损耗、RGB 图像和 LiDAR 点云，场景包含车辆、公交车、卡车、行人和无人机。代码仓库的快速开始脚本可下载一个已完成光线追踪的小型场景。}
