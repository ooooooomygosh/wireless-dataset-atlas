id: raymobtime
name: Raymobtime
year: 2018
origin: simulation
tasks: [beam-management, multimodal-sensing]
signals: [paths, pathloss, rgb, lidar]
mobility: SUMO traffic simulation of vehicles, buses, trucks, pedestrians and drones
license: GNU General Public License v3.0 (GPLv3)
access: {url: 'https://github.com/lasseufpa/Raymobtime', type: open}
code: ['https://github.com/lasseufpa/Raymobtime']
paper: doi:10.1109/ita.2018.8503086
used_in: ['doi:10.1109/infocom59046.2026.11571670']
citing: ['doi:10.1109/jproc.2019.2954595', 'doi:10.1109/comst.2023.3300664', 'doi:10.1109/twc.2021.3128392']
summary: {en: 'Generator for ray-traced mmWave MIMO data, producing propagation paths, path loss, RGB images and LiDAR point clouds in scenes with vehicles, buses, trucks, pedestrians and drones. The repository quick-start script downloads a tiny scenario with ray tracing already done.', zh: 用于生成光线追踪 mmWave MIMO 数据的生成器，输出传播路径、路径损耗、RGB 图像和 LiDAR 点云，场景包含车辆、公交车、卡车、行人和无人机。代码仓库的快速开始脚本可下载一个已完成光线追踪的小型场景。}
sources: ['https://github.com/lasseufpa/Raymobtime/blob/master/README.md', 'https://api.openalex.org/works/doi:10.1109/ita.2018.8503086', 'https://github.com/lasseufpa/Raymobtime', 'https://raw.githubusercontent.com/lasseufpa/Raymobtime/master/README.md', 'https://raw.githubusercontent.com/lasseufpa/Raymobtime/master/doc/3-DatasetCreation.md', 'https://raw.githubusercontent.com/lasseufpa/Raymobtime/master/doc/4-DatasetFiles.md', 'https://raw.githubusercontent.com/lasseufpa/Raymobtime/master/LICENSE', 'https://raw.githubusercontent.com/lasseufpa/Raymobtime/master/src/configs/default.yaml', 'https://raw.githubusercontent.com/lasseufpa/Raymobtime/master/doc/2-BaseCreation.md', 'https://github.com/lasseufpa/Raymobtime/tags', 'https://github.com/lasseufpa/Raymobtime/releases', 'https://github.com/lasseufpa/Raymobtime/commits/master', 'http://ita.ucsd.edu/workshop/18/files/paper/paper_3313.pdf']
checked: '2026-11-06'
pipeline:
  summary: {en: 'SUMO generates vehicle and pedestrian states. Raymobtime converts them to scene coordinates and node associations; Wireless InSite then computes propagation paths and path loss, Blender renders RGB images and Blensor simulates LiDAR point clouds. Outputs are aligned by run, episode, scene, transmitter and receiver.', zh: SUMO 生成车辆和行人的状态。Raymobtime 将其转换为场景坐标并建立节点关联；随后 Wireless InSite 计算传播路径和路径损耗，Blender 渲染 RGB 图像，Blensor 仿真 LiDAR 点云。输出按 run、episode、scene、发射机和接收机对齐。}
  scope: {en: Describes the current modular pipeline in the README and in the dataset documentation (doc/3 and doc/4) of the repository; scenario packages are identified by scenario number., zh: 描述代码仓库 README 以及数据集文档（doc/3 与 doc/4）中当前的模块化流程；场景数据包按场景编号区分。}
  stages:
  - title: {en: Prepare scenarios and configuration, zh: 准备场景与配置}
    detail: {en: 'The default configuration is merged with the user''s config.yaml, which selects the scenario, the enabled modules, external tool paths and output directories. The base files are a SUMO network and routes, a Wireless InSite project and a Blender scene.', zh: 默认配置与用户的 config.yaml 合并；后者选择场景、启用的模块、外部工具路径和输出目录。基础文件包括 SUMO 路网与路线、Wireless InSite 工程以及 Blender 场景。}
    inputs:
    - {en: 'SUMO network and routes, Wireless InSite project, Blender scene and config.yaml', zh: SUMO 路网与路线、Wireless InSite 工程、Blender 场景与 config.yaml}
    controls:
    - {en: 'Ray tracing, RGB, LiDAR, pedestrians, drones and dataset conversion are switched on or off in the configuration.', zh: 光线追踪、RGB、LiDAR、行人、无人机及数据集转换均可在配置中开启或关闭。}
    checks:
    - {en: 'Buildings, roads and other static elements stay fixed across the run, while dynamic objects are repositioned for each scene.', zh: 建筑、道路等静态元素在整个运行过程中保持不变，动态对象则在每个 scene 中重新定位。}
  - title: {en: Generate mobility and episodes, zh: 生成移动性与 episode}
    detail: {en: 'At each simulation step SUMO is queried through TraCI for each active object''s identifier, type, position, orientation, dimensions and lane. Scenes are sampled at the configured interval. At the start of each episode the communication nodes are assigned to selected vehicles, and their receiver indices keep those vehicles for the whole episode.', zh: 在每个仿真步，通过 TraCI 读取各活动对象的标识、类型、位置、朝向、尺寸和车道。scene 以配置的采样间隔抽取。每个 episode 开始时，通信节点被分配给选定车辆，其接收机索引在整个 episode 内保持对应关系。}
    inputs:
    - {en: 'SUMO traffic configuration with its random seed, and the sampling interval', zh: 带随机种子的 SUMO 交通配置与采样间隔}
    outputs:
    - {en: Dynamic-object states per scene, zh: 逐 scene 的动态对象状态}
    - {en: Receiver-to-object assignment within each episode, zh: 每个 episode 内的接收机与对象对应关系}
    controls:
    - {en: 'The configuration sets scenes per episode, transmitters and receivers per episode, sampling parameters, time between episodes and the traffic seed.', zh: 配置项包括每个 episode 的 scene 数、每个 episode 的发射机与接收机数、采样参数、episode 之间的时间间隔以及交通随机种子。}
    checks:
    - {en: An episode ends early when receivers are absent from a scene; scenes without the required nodes may be skipped., zh: 当某个 scene 中缺少接收机时 episode 会提前结束；缺少所需通信节点的 scene 可以被跳过。}
  - title: {en: Convert coordinates and place objects, zh: 转换坐标并放置对象}
    detail: {en: 'SUMO reports the front-bumper position of each vehicle. Raymobtime moves it to the geometric centre using the vehicle length and heading, converts orientations, and sets heights and antenna positions. Drones receive an additional altitude offset because SUMO does not represent their full three-dimensional trajectory. The placed objects are written into the Wireless InSite, Blender and Blensor scenes.', zh: SUMO 给出的是车辆前保险杠的位置。Raymobtime 依据车长与朝向将其修正到几何中心，转换朝向，并设置高度与天线位置。由于 SUMO 不表示无人机的完整三维轨迹，无人机会额外获得一个高度偏移。放置后的对象被写入 Wireless InSite、Blender 与 Blensor 场景。}
    inputs:
    - {en: SUMO states and object templates, zh: SUMO 状态与对象模板}
    outputs:
    - {en: Transmitter and receiver positions and sensor placements in each engine's frame, zh: 各引擎坐标系下的发射机与接收机位置及传感器安装位置}
    controls:
    - {en: Objects are drawn as simplified shapes or as detailed templates; antenna and camera heights are configuration settings., zh: 对象可采用简化几何形状或详细模板；天线与相机高度为配置项。}
    checks:
    - {en: 'Coordinates must be consistent among SUMO, Blender, Blensor and Wireless InSite.', zh: SUMO、Blender、Blensor 与 Wireless InSite 之间的坐标必须保持一致。}
  - title: {en: Run the wireless propagation branch, zh: 执行无线传播分支}
    detail: {en: 'Raymobtime updates the Wireless InSite project with the node positions, runs ray tracing and parses the paths. Each path gives received power, time of arrival, departure and arrival angles, a line-of-sight flag and a phase. Paths are stored as HDF5 tensors padded to a maximum number of rays. The MIMO channel matrices are passed through transmitter and receiver codebooks, and the best beam pair is the index of the largest magnitude.', zh: Raymobtime 依据节点位置更新 Wireless InSite 工程，运行光线追踪并解析路径。每条路径给出接收功率、到达时间、离开角与到达角、视距标志和相位。路径以 HDF5 张量保存，并填充到最大射线数。MIMO 信道矩阵经发射端与接收端码本处理，最佳波束对为幅度最大处的索引。}
    inputs:
    - {en: Per-scene Wireless InSite projects and ray-tracing parameters, zh: 逐 scene 的 Wireless InSite 工程与光线追踪参数}
    outputs:
    - {en: HDF5 path tensors, zh: HDF5 路径张量}
    - {en: 'MIMO channel matrices, codebook channel outputs and best-beam indices', zh: MIMO 信道矩阵、码本信道输出与最佳波束索引}
    controls:
    - {en: 'Antenna arrays, codebooks and the maximum number of rays are configuration choices.', zh: 天线阵列、码本与最大射线数均为配置选项。}
    checks:
    - {en: Padded path entries are not propagation paths; the padding value must be documented with the dataset., zh: 填充的路径条目不是传播路径；填充值须随数据集一同记录。}
  - title: {en: Render RGB images and simulate LiDAR, zh: 渲染 RGB 图像并仿真 LiDAR}
    detail: {en: 'Blender loads the three-dimensional scene and renders images from base-station and user-equipment viewpoints, exporting the camera parameters. Blensor simulates a LiDAR at each communication node using angular resolution, maximum range, rotation speed and noise level. Post-processing projects receivers into the base-station images to add markers and bounding boxes, and voxelizes the LiDAR clouds.', zh: Blender 加载三维场景，从基站与用户设备视角渲染图像，并导出相机参数。Blensor 按角分辨率、最大量程、转速和噪声水平，在每个通信节点处仿真 LiDAR。后处理将接收机投影到基站图像中以添加标记和目标框，并将 LiDAR 点云体素化。}
    inputs:
    - {en: 'Object states of the same scene, Blender cameras and Blensor scanners', zh: 同一 scene 的对象状态、Blender 相机与 Blensor 扫描器}
    outputs:
    - {en: 'RGB images, camera metadata and LiDAR point clouds', zh: RGB 图像、相机元数据与 LiDAR 点云}
    - {en: LiDAR voxels; base-station images with receiver markers and bounding boxes, zh: LiDAR 体素；带接收机标记与目标框的基站图像}
    controls:
    - {en: 'Camera field of view and resolution, scan parameters and the number of base-station cameras are configured.', zh: 相机视场与分辨率、扫描参数以及基站相机数量均可配置。}
    checks:
    - {en: Markers and bounding boxes are produced for base-station images only; the current refinement function does not process user-equipment images., zh: 标记与目标框仅针对基站图像生成；当前的图像精修函数不处理用户设备图像。}
  - title: {en: Align, package and flag invalid samples: null, zh: 对齐、封装并标记无效样本}
    detail: {en: 'Outputs are associated by run, episode, scene, transmitter and receiver. Coordinate files link each channel, image and scan to its receiver and episode. Invalid cases, such as a vehicle that leaves the valid region, are recorded with a valid flag so that they can be excluded.', zh: 输出按 run、episode、scene、发射机和接收机关联。坐标文件将每个信道、图像和扫描与其接收机及 episode 相连。无效情况（例如车辆驶出有效区域）以有效性标志记录，以便剔除。}
    inputs:
    - {en: 'Wireless, mobility, RGB, LiDAR and metadata outputs', zh: 无线、移动性、RGB、LiDAR 与元数据输出}
    outputs:
    - {en: Traceable multimodal samples with validity flags, zh: 带有效性标志、可追溯的多模态样本}
    controls:
    - {en: 'The configuration selects which modules are saved, so the retained fields depend on the enabled modules.', zh: 配置决定保存哪些模块，因此保留的字段取决于启用的模块。}
    checks:
    - {en: Outputs are synchronized only when they come from the same scene., zh: 只有来自同一 scene 的输出才被视为同步。}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: 'Ray-tracing path tensors in HDF5 (received power, time of arrival, departure and arrival angles, line-of-sight flag, phase); RGB images with camera metadata; LiDAR point clouds; coordinate CSV files; an object database; mobility states.', zh: HDF5 格式的光线追踪路径张量（接收功率、到达时间、离开角与到达角、视距标志、相位）；带相机元数据的 RGB 图像；LiDAR 点云；坐标 CSV 文件；对象数据库；移动性状态。}
- label: {en: Derived outputs, zh: 派生输出}
  text: {en: MIMO channel matrices (H-matrices); codebook channel outputs; best-beam indices; LiDAR voxels; base-station images with receiver markers and bounding boxes; receiver positions in each base-station camera frame., zh: MIMO 信道矩阵（H 矩阵）；码本信道输出；最佳波束索引；LiDAR 体素；带接收机标记与目标框的基站图像；各基站相机坐标系下的接收机位置。}
- label: {en: Beam index convention, zh: 波束索引约定}
  text: {en: 'The best-beam index is the row-major flattened position of the receiver and transmitter codeword pair. For a 16 × 64 grid, index 75 corresponds to receiver codeword 1 and transmitter codeword 11.', zh: 最佳波束索引是接收与发射码字对在行优先展平后的位置。对于 16 × 64 的网格，索引 75 对应接收码字 1 与发射码字 11。}
- label: {en: Receiver positions in camera frames, zh: 相机坐标系中的接收机位置}
  text: {en: 'The file RxPosCamraPOV.npz has shape [episodes, scenes, receivers, cameras, 3], with x, y and z in each camera frame; unavailable positions are NaN.', zh: '文件 RxPosCamraPOV.npz 的形状为 [episodes, scenes, receivers, cameras, 3]，最后一维为各相机坐标系下的 x、y、z；不可用的位置为 NaN。'}
provenance:
- {en: SUMO road network and traffic behavior, zh: SUMO 路网与交通行为}
- {en: Vehicle/object positions at each time step, zh: 每时刻车辆/对象位置}
- {en: Wireless InSite paths + Blender RGB + Blensor LiDAR, zh: Wireless InSite 路径 + Blender RGB + Blensor LiDAR}
- {en: Coordinate conversion and time alignment, zh: 坐标转换与时间对齐}
- {en: episode/scene/Tx/Rx data, zh: episode/scene/Tx/Rx 数据}
- {en: CSI and codebook-gain postprocessing, zh: CSI 与码本收益后处理}
technical_notes:
- {en: The README distinguishes fixed-receiver scenarios 2 to 7 from moving-receiver scenarios 1 and 11 to 13., zh: README 将固定接收机场景 2 至 7 与移动接收机场景 1 及 11 至 13 区分开。}
- {en: Receiver IDs keep their vehicle association within an episode but may point to a different vehicle in a new episode., zh: 接收机编号在同一 episode 内保持与车辆的对应关系，在新的 episode 中可能指向不同车辆。}
- {en: 'Path and channel tensors are padded to a configured maximum number of rays, and padded entries must be distinguished from real paths.', zh: 路径与信道张量按配置的最大射线数填充，填充条目须与真实路径区分。}
- {en: 'Drone altitude is an offset applied by Raymobtime, because SUMO does not represent full three-dimensional drone trajectories.', zh: 无人机高度由 Raymobtime 施加的偏移决定，因为 SUMO 不表示完整的三维无人机轨迹。}
- {en: 'Image annotations depend on the alignment of coordinates, Blender cameras, object geometry and raw images; incorrect camera parameters or coordinate transforms displace the markers and boxes.', zh: 图像标注依赖坐标、Blender 相机、对象几何与原始图像之间的对齐；相机参数或坐标变换错误会使标记与目标框发生偏移。}
limitations:
- {en: Trajectories must not be connected across episodes using receiver IDs alone., zh: 不能仅凭接收机编号跨 episode 连接轨迹。}
- {en: The quick-start scenario uses ray-tracing results generated beforehand and does not rerun Wireless InSite., zh: quick-start 场景使用预先生成的光线追踪结果，不会重新运行 Wireless InSite。}
- {en: Generating new ray-tracing results requires a licensed Wireless InSite installation., zh: 生成新的光线追踪结果需要已授权的 Wireless InSite。}
history:
- {en: '2018: the ITA workshop paper introduces the methodology and a beam-selection dataset built with it (OpenAlex records publication year 2018).', zh: 2018 年：ITA 研讨会论文介绍了该方法以及用其生成的波束选择数据集（OpenAlex 记录出版年份为 2018）。}
usage:
- {en: Run the official pregenerated quick start first; it does not require a Wireless InSite license., zh: 应先运行官方的预生成 quick-start；它不需要 Wireless InSite 许可。}
- {en: Read the enabled modalities and the sampling interval from config.yaml., zh: 从 config.yaml 读取已启用的模态与采样间隔。}
- {en: 'Keep the episode, scene and vehicle IDs, and check the validity flag before using a sample.', zh: 保留 episode、scene 与车辆编号，并在使用样本前检查有效性标志。}
- {en: 'To recover the receiver and transmitter codeword indices from a best-beam index, use the codebook dimensions with row-major (C-order) unravelling.', zh: 要从最佳波束索引还原接收与发射码字编号，需使用码本维度并按行优先（C 顺序）展开。}
tools: [project-mitsuba-blender, project-raymobtime-pipeline, wireless-ml-data-hub]
overview: {en: 'Raymobtime is a simulation framework and dataset-generation method for wireless communication with mobility, originally built for ray-tracing datasets in vehicular scenarios, especially millimeter-wave and MIMO systems. It combines SUMO traffic simulation, Wireless InSite ray tracing, Blender rendering and Blensor LiDAR simulation into time-aligned scenes. Each scene is a snapshot of vehicles, buses, trucks, pedestrians and drones at one sampling instant, and consecutive scenes form an episode. Within an episode a receiver index refers to the same object, while a new episode selects objects again, so the same index can refer to a different vehicle. In the original datasets, scenarios 2 to 7 use fixed receivers on rooftops or building facades, and scenarios 1 and 11 to 13 use receivers on moving vehicles. Outputs are grouped by scenario and simulation identifier and contain ray-tracing paths, path loss, RGB images, LiDAR point clouds and object metadata, depending on the enabled
    modules. The code is licensed under GPLv3, but Wireless InSite is proprietary and needs a commercial license for new ray tracing, so the repository provides a pregenerated quick-start scenario that runs without it. The associated paper is ''5G MIMO Data for Machine Learning: Application to Beam-Selection using Deep Learning'' (ITA 2018).', zh: 'Raymobtime 是面向带移动性无线通信的仿真框架与数据集生成方法，最初用于车联网场景的光线追踪数据生成，尤其是毫米波与 MIMO 系统。该流程将 SUMO 交通仿真、Wireless InSite 光线追踪、Blender 渲染和 Blensor LiDAR 仿真整合为时间对齐的场景。每个 scene 是车辆、公交车、卡车、行人和无人机在某一采样时刻的快照，连续的 scene 组成一个 episode。在同一 episode 内，接收机索引指向同一对象；新的 episode 会重新选择对象，因此同一索引可对应不同车辆。原始数据集中，scenario 2 至 7 使用安装在屋顶或建筑立面上的固定接收机，scenario 1 和 11 至 13 使用安装在移动车辆上的接收机。输出按 scenario 与仿真标识分组，依据启用的模块包含光线追踪路径、路径损耗、RGB 图像、LiDAR 点云和对象元数据。代码采用 GPLv3 许可，但 Wireless InSite 为商业软件，新的光线追踪需要商业许可；代码仓库提供了无需该软件即可运行的预生成 quick-start 场景。相关论文为《5G MIMO Data for Machine Learning: Application to Beam-Selection using Deep Learning》（ITA 2018）。'}
signal_details:
- signal: paths
  text: {en: 'Propagation paths from Wireless InSite ray tracing, with received power, delays, elevation and azimuth angles of departure and arrival, and a line-of-sight flag, stored per run, episode, scene, transmitter and receiver.', zh: Wireless InSite 光线追踪得到的传播路径，包含接收功率、时延、离开角与到达角（仰角与方位角）以及视距标志，按 run、episode、scene、发射机和接收机分别存储。}
- signal: pathloss
  text: {en: 'Path loss computed in the same Wireless InSite ray-tracing stage as the propagation paths, stored with the propagation results for each run, episode, scene, transmitter and receiver.', zh: 与传播路径在同一 Wireless InSite 光线追踪阶段计算得到的路径损耗，与传播结果一同按 run、episode、scene、发射机和接收机存储。}
- signal: rgb
  text: {en: 'RGB images rendered with Blender from base-station and user-equipment viewpoints. Camera position, orientation, focal length, sensor dimensions and image resolution are exported for post-processing.', zh: 由 Blender 从基站与用户设备视角渲染的 RGB 图像。相机位置、朝向、焦距、传感器尺寸和图像分辨率被导出，供后处理使用。}
- signal: lidar
  text: {en: 'LiDAR point clouds simulated with Blensor at the communication node, configured by angular resolution, maximum sensing distance, rotation speed and noise level. Clouds can be converted to local and spherical coordinates and voxelized.', zh: 由 Blensor 在通信节点处仿真的 LiDAR 点云，扫描参数包括角分辨率、最大探测距离、转速和噪声水平。点云可转换为局部坐标与球面坐标，并体素化。}
format: HDF5 ray-tracing files; CSV coordinate files; NPZ and NPY arrays; PCD, TXT and NPY raw point clouds; JSON camera information
capabilities:
- key: csi
  status: derivable
  note: {en: The narrowband MIMO H-matrix is built from the HDF5 paths with a geometric UPA model and the configured arrays., zh: 窄带 MIMO H 矩阵由 HDF5 路径结合几何 UPA 模型与配置的天线阵列构建。}
- key: cir
  status: derivable
  note: {en: 'The impulse response can be formed from per-path delay, received power and phase; doc/3 lists it as an output, but the doc/4 HDF5 table names only path parameters.', zh: 冲激响应可由逐路径时延、接收功率和相位构成；doc/3 将其列为输出，但 doc/4 的 HDF5 字段表只列出路径参数。}
- key: paths
  status: provided
  note: {en: 'HDF5 tensors hold received power, time of arrival, departure and arrival angles, line-of-sight flag and phase, padded to a maximum ray count.', zh: HDF5 张量包含接收功率、到达时间、离开角与到达角、视距标志和相位，并填充到最大射线数。}
- key: interaction
  status: unknown
  note: {en: doc/4 states that interaction data are stored only depending on the Wireless InSite version and parser settings., zh: doc/4 称交互信息仅依 Wireless InSite 版本与解析器设置而存储。}
- key: power
  status: provided
  note: {en: 'Per-path received power in dBm is stored in the HDF5 tensors, and path loss comes from the same ray-tracing stage.', zh: HDF5 张量中存储逐路径接收功率（dBm），路径损耗来自同一光线追踪阶段。}
- key: iq
  status: none
  note: {en: 'No time-domain waveforms are produced; the outputs are paths, channel matrices and beam indices.', zh: 不产生时域波形；输出为路径、信道矩阵和波束索引。}
- key: beam_labels
  status: derivable
  note: {en: The best-beam index is computed from the H-matrices and DFT codebooks by the beam post-processing step., zh: 最佳波束索引由波束后处理步骤根据 H 矩阵与 DFT 码本计算。}
- key: position
  status: provided
  note: {en: Transmitter and receiver coordinates for each scene are stored in CSV coordinate files and in RxPosCamraPOV.npz., zh: 每个 scene 的发射机与接收机坐标存储于 CSV 坐标文件及 RxPosCamraPOV.npz 中。}
- key: geometry
  status: provided
  note: {en: 'The base scenario holds the static 3D geometry in Blender and Wireless InSite, and the SUMO road network.', zh: 基础场景包含 Blender 与 Wireless InSite 中的静态三维几何以及 SUMO 路网。}
- key: materials
  status: provided
  note: {en: Propagation materials are assigned to static structures in the Wireless InSite base project., zh: 传播材料在 Wireless InSite 基础工程中分配给静态结构。}
- key: rgb
  status: simulate
  note: {en: Blender renders base-station and UE images from the scene when the pipeline runs; the quick start renders them at run time., zh: 流程运行时由 Blender 依据场景渲染基站与 UE 图像；quick-start 在运行时完成渲染。}
- key: depth
  status: none
  note: {en: No depth-map output is listed; LiDAR point clouds are the range data., zh: 输出列表中没有深度图；距离信息由 LiDAR 点云提供。}
- key: lidar
  status: simulate
  note: {en: Blensor simulates LiDAR at the communication nodes when the pipeline runs; the quick start generates UE scans at run time., zh: 流程运行时由 Blensor 在通信节点处仿真 LiDAR；quick-start 在运行时生成 UE 扫描。}
- key: radar
  status: none
  note: {en: No radar sensing output is listed., zh: 输出列表中无雷达感知数据。}
- key: imu
  status: none
  note: {en: No inertial sensor output is listed; motion comes from SUMO traces., zh: 输出列表中无惯性传感器数据；运动信息来自 SUMO 轨迹。}
- key: time_series
  status: provided
  note: {en: Consecutive scenes are sampled at a configured interval (README example 0.1 s) and grouped into episodes., zh: 连续的 scene 以配置的采样间隔抽取（README 示例为 0.1 s），并组成 episode。}
- key: multiuser
  status: provided
  note: {en: Several receivers and transmitters share each scene; the README example requests ten mobile receivers., zh: 每个 scene 中存在多个接收机与发射机；README 示例设置了 10 个移动接收机。}
- {key: multibs, status: unknown}
- {key: crossfreq, status: unknown}
- key: near_field
  status: none
  note: {en: Beam processing uses plane-wave UPA steering vectors; no spherical-wave near-field model is described., zh: 波束处理采用平面波 UPA 导向矢量；文档中未描述球面波近场模型。}
- key: high_mobility
  status: unknown
  note: {en: 'Vehicles follow SUMO routes, but the sources state no speed value.', zh: 车辆沿 SUMO 路线运动，但来源中未给出速度数值。}
- key: dynamic_blockage
  status: provided
  note: {en: 'Moving vehicles, buses, trucks and, when enabled, pedestrians are placed as geometry in each scene''s ray-tracing project.', zh: 移动的车辆、公交车、卡车以及启用时的行人，作为几何体放入每个 scene 的光线追踪工程。}
- key: reflection
  status: unknown
  note: {en: 'Reflection, transmission and diffraction are set per Wireless InSite base project, and the sources do not state which were enabled for the released scenarios.', zh: 反射、透射与绕射在每个 Wireless InSite 基础工程中设置，来源未说明已发布场景启用了哪些机制。}
- key: diffraction
  status: unknown
  note: {en: 'Diffraction is configured per Wireless InSite base project, and the sources do not state whether it was enabled for the released scenarios.', zh: 绕射在每个 Wireless InSite 基础工程中配置，来源未说明已发布场景是否启用。}
- key: scattering
  status: unknown
  note: {en: Scattering is not named among the configured mechanisms., zh: 散射未列入已配置的传播机制。}
- key: transmission
  status: unknown
  note: {en: 'Transmission is configured per Wireless InSite base project, and the sources do not state whether it was enabled for the released scenarios.', zh: 透射在每个 Wireless InSite 基础工程中配置，来源未说明已发布场景是否启用。}
- key: polarization
  status: unknown
  note: {en: Polarization is not described in the sources., zh: 来源中未描述极化。}
- key: em_field
  status: unknown
  note: {en: 'doc/3 lists complex E-fields as an output, and doc/4 says they are stored depending on the Wireless InSite version and parser settings.', zh: doc/3 将复数电场列为输出，doc/4 称其依 Wireless InSite 版本与解析器设置而存储。}
