- label: {en: Native outputs, zh: 原生输出}
  text: {en: '• RT results, RGB, LiDAR, mobility, and camera metadata generated by enabled modules', zh: • 按启用模块生成的RT结果、RGB、LiDAR、移动及相机元数据}
- label: {en: Derived outputs, zh: 派生输出}
  text: {en: '• Beam data, LiDAR voxels, and visual annotations

