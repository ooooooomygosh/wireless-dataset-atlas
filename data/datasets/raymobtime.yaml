tools: [project-mitsuba-blender, project-raymobtime-pipeline, wireless-ml-data-hub]
overview: {en: 'Raymobtime is a simulation framework and dataset-generation methodology for wireless communication with mobility, originally built for ray-tracing datasets in vehicular scenarios, especially millimeter-wave and MIMO systems. Its pipeline combines SUMO traffic simulation, Wireless InSite ray tracing, Blender rendering and Blensor LiDAR simulation into time-aligned scenes. Each scene is a snapshot of vehicles, buses, trucks, pedestrians and drones at one sampling instant, and consecutive scenes form an episode. Within an episode, a receiver index refers to the same object, while a new episode selects objects again, so the same index can refer to a different vehicle. The original scenarios 2 to 7 use fixed receivers on rooftops or building facades, and scenarios 1 and 11 to 13 use receivers mounted on moving vehicles. Outputs are grouped by scenario and simulation identifier, and contain ray-tracing paths, path loss, RGB images, LiDAR point clouds and object metadata, depending
    on the enabled modules. The framework is licensed under GPLv3, but Wireless InSite is proprietary and needs a commercial license for new ray tracing, so the README provides a pregenerated quick-start scenario that runs without it. The associated workshop paper is ''5G MIMO Data for Machine Learning: Application to Beam-Selection using Deep Learning'' (ITA 2018).', zh: 'Raymobtime 是面向带移动性无线通信的仿真框架和数据集生成方法，最初用于车联网场景的光线追踪数据生成，尤其是毫米波与 MIMO 系统。该流程将 SUMO 交通仿真、Wireless InSite 光线追踪、Blender 渲染和 Blensor LiDAR 仿真整合为时间对齐的场景。每个 scene 是车辆、公交车、卡车、行人和无人机在某一采样时刻的快照，连续的 scene 组成一个 episode。在同一 episode 内，接收机索引指向同一对象；新的 episode 会重新选择对象，因此同一索引可对应不同车辆。原始数据集中，scenario 2 至 7 使用安装在屋顶或建筑立面上的固定接收机，scenario 1 和 11 至 13 使用安装在移动车辆上的接收机。输出按 scenario 与仿真标识分组，依据启用的模块包含光线追踪路径、路径损耗、RGB 图像、LiDAR 点云和对象元数据。框架采用 GPLv3 许可，但 Wireless InSite 为商业软件，新的光线追踪需要商业许可；README 提供了预生成数据的 quick-start 场景，无需该软件即可运行。相关研讨会论文为《5G MIMO Data for Machine Learning: Application to Beam-Selection using Deep Learning》（ITA 2018）。'}
signal_details:
- signal: paths
  text: {en: 'Propagation paths from Wireless InSite ray tracing, with received power, delays, angles of departure and angles of arrival, stored per run, episode, scene, transmitter and receiver.', zh: Wireless InSite 光线追踪得到的传播路径，包含接收功率、时延、离开角和到达角，按 run、episode、scene、发射机和接收机分别存储。}
- signal: pathloss
  text: {en: 'Path loss computed in the same Wireless InSite ray-tracing stage as the propagation paths, stored with the propagation results for each run, episode, scene, transmitter and receiver.', zh: 与传播路径在同一 Wireless InSite 光线追踪阶段计算得到的路径损耗，与传播结果一同按 run、episode、scene、发射机和接收机存储。}
- signal: rgb
  text: {en: 'RGB images rendered with Blender from base-station and user-equipment viewpoints. Camera position, orientation, focal length, sensor dimensions and image resolution are exported with each image.', zh: 由 Blender 从基站与用户设备视角渲染的 RGB 图像。每幅图像同时导出相机位置、朝向、焦距、传感器尺寸和图像分辨率。}
- signal: lidar
  text: {en: 'LiDAR point clouds simulated with Blensor at the communication node, configured by angular resolution, maximum sensing distance, rotation speed and noise level. Clouds can be converted to local and spherical coordinates and postprocessed into voxels and bounding boxes.', zh: 由 Blensor 在通信节点处仿真的 LiDAR 点云，扫描参数包括角分辨率、最大探测距离、转速和噪声水平。点云可转换为局部坐标与球面表示，并经后处理生成体素与目标框。}
