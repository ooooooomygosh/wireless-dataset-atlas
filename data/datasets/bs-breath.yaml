overview: {en: 'BS-Breath is a dataset of uplink channel state information (CSI) from a 64-antenna cell-free massive MIMO testbed at 3.51 GHz, recorded for respiration sensing. KU Leuven researchers Haoqiu Xiong, Robbert Beerten and Sofie Pollin published it on IEEE DataPort in 2025, alongside an ICASSP 2025 paper and an arXiv preprint (2502.12114). Ten subjects performed controlled breathing while a single-antenna user equipment (UE) transmitted uplink pilots, and the UE was moved around each seated subject at distances of 0.5 to 1.5 m. A marker-based motion-capture (MoCap) system records the breathing ground truth, and it is triggered together with the testbed capture so that the two are time-aligned. The testbed uses an OFDM waveform with 100 subcarriers spanning an 18 MHz bandwidth, and the uplink channel is estimated at 200 Hz. The release is a single archive, data_single_person_wo_interf.zip, of 11.64 GB, and the source pages state that it contains raw CSI measurements, processed breathing
    signals and MoCap recordings. Access requires an IEEE DataPort subscription.', zh: BS-Breath是一个上行信道状态信息（CSI）数据集，采集自载频3.51 GHz的64天线cell-free massive MIMO测试平台，用于呼吸感知。KU Leuven的研究人员Haoqiu Xiong、Robbert Beerten与Sofie Pollin于2025年将其发布在IEEE DataPort上，并附有ICASSP 2025论文与arXiv预印本（2502.12114）。十名受试者在采集中进行受控呼吸，单天线用户设备（UE）发送上行导频，UE在每位就座受试者周围移动，距离为0.5至1.5 m。基于标记点的动作捕捉（MoCap）系统记录呼吸真值，并与测试平台采集同步触发，以实现时间对齐。测试平台采用OFDM波形，100个子载波，覆盖18 MHz带宽，上行信道以200 Hz估计。发布内容为单个压缩包data_single_person_wo_interf.zip，大小11.64 GB，来源页面称其包含原始CSI测量、处理后的呼吸信号与MoCap记录。访问需要IEEE DataPort订阅。}
signal_details:
- signal: csi
  text: {en: 'Uplink CSI from a 64-antenna cell-free massive MIMO OFDM base station at 3.51 GHz, with an 18 MHz bandwidth in the testbed. The user equipment sends uplink pilots, and the sensing target is near the user equipment.', zh: 来自载频 3.51 GHz、64 天线 cell-free massive MIMO OFDM 基站的上行 CSI，测试平台带宽 18 MHz。用户设备发送上行导频，感知目标位于用户设备附近。}
pipeline:
  summary: {en: 'Uplink pilots from a user device are measured on a cell-free massive MIMO base station, synchronized with MoCap ground truth, and processed into breathing signals.', zh: 用户设备发送的上行导频在cell-free massive MIMO基站上测量，与MoCap真值同步，并处理为呼吸信号。}
  stages:
  - title: {en: Cell-free testbed measurement, zh: cell-free测试平台测量}
    detail: {en: 'A 64-antenna cell-free massive MIMO OFDM testbed records uplink CSI at 3.51 GHz with an 18 MHz bandwidth while the user equipment sends uplink pilots. The 64 antennas form eight distributed uniform linear arrays of eight antennas each, and the 100 subcarriers are spaced 180 kHz apart. Ten subjects breathe in a controlled manner while seated, and the UE is moved around each subject at 0.5 to 1.5 m.', zh: 64天线cell-free massive MIMO OFDM测试平台在3.51 GHz、18 MHz带宽下记录上行CSI，此时用户设备发送上行导频。64根天线构成八个分布式均匀线阵，每个线阵八根天线；100个子载波间隔180 kHz。十名受试者就座并进行受控呼吸，UE在每位受试者周围移动，距离为0.5至1.5 m。}
    inputs:
    - {en: uplink pilots from the user equipment, zh: 用户设备发出的上行导频}
    outputs:
    - {en: uplink CSI at 3.51 GHz, zh: 3.51 GHz上行CSI}
  - title: {en: Motion-capture ground truth, zh: 动作捕捉真值}
    detail: {en: 'Four marker-based Qualisys Miqus M3 cameras record the breathing motion at 150 Hz. The MoCap system and the testbed capture are triggered simultaneously, which aligns the 3D position data with the RF recordings in time.', zh: 四台基于标记点的Qualisys Miqus M3摄像机以150 Hz记录呼吸运动。MoCap系统与测试平台采集同时触发，使三维位置数据与射频记录在时间上对齐。}
    inputs:
    - {en: subject motion, zh: 受试者运动}
    outputs:
    - {en: synchronized MoCap recordings, zh: 同步的MoCap记录}
  - title: {en: Breathing signal extraction, zh: 呼吸信号提取}
    detail: {en: 'For each antenna, IDFT or DiverSense combines the subcarriers into one range signal. A Farsense-style projection then selects the real-valued axis that best captures the breathing motion. Weighted antenna combining (WAC) aggregates the one-dimensional breathing estimates of the antennas, with weights based on the breathing-to-noise ratio.', zh: 对每根天线，IDFT或DiverSense将子载波合并为一个距离域信号。随后，Farsense式投影选取最能体现呼吸运动的实数轴。加权天线合并（WAC）依据呼吸噪声比对各天线的一维呼吸估计加权汇总。}
    inputs:
    - {en: uplink CSI, zh: 上行CSI}
    outputs:
    - {en: processed breathing signal, zh: 处理后的呼吸信号}
bandwidth_mhz: 18
subcarriers: 100
antennas: {tx: 1, rx: 64, array: distributed}
samples: 10 subjects, four one-minute recordings each (40 minutes in total)
mobility: seated subjects; the user equipment is moved around each subject at 0.5 to 1.5 m
facts:
- label: {en: Sampling rates, zh: 采样速率}
  text: {en: 'Uplink CSI is estimated at 200 Hz, and the MoCap ground truth is recorded at 150 Hz.', zh: 上行CSI以200 Hz估计，MoCap真值以150 Hz记录。}
- label: {en: Range resolution, zh: 距离分辨率}
  text: {en: 'The 100 subcarriers spaced 180 kHz apart cover 18 MHz, which gives a range resolution of 16.66 m (c/B), so paths closer than that in range fall into the same cell.', zh: 100个子载波间隔180 kHz，覆盖18 MHz，对应距离分辨率16.66 m（c/B），因此距离相差小于该值的路径落入同一距离单元。}
