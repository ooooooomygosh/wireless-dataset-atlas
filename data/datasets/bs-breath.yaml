summary: {en: 'Uplink CSI from a 64-antenna cell-free massive MIMO testbed at 3.51 GHz, recorded while 10 subjects performed controlled breathing, with motion-capture breathing ground truth. The listed archive is 11.64 GB.', zh: 来自64天线 cell-free massive MIMO 测试平台、载频3.51 GHz 的上行 CSI，记录了10名受试者的受控呼吸过程，并提供动作捕捉呼吸真值。列出的数据压缩包为11.64 GB。}
