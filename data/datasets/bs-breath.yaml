  note: {en: 'Uplink CSI from 64 BS antennas in eight distributed 8-antenna arrays, 100 subcarriers at 180 kHz spacing, sampled at 200 Hz.', zh: 来自 BS 64 根天线（8 组分布式 8 天线阵列）的上行 CSI，100 个子载波，间隔 180 kHz，采样率 200 Hz。}
