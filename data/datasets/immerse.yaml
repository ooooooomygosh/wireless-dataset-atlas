citing: []
summary: {en: Received-power metrics (RSRP) of 4G sub-6 GHz and 5G mmWave links recorded by three devices in an indoor private network. Scenarios include line-of-sight recordings and passages of pedestrians and AGVs on two tracks., zh: 三台终端在室内专网中记录的 4G（sub-6 GHz）和 5G（mmWave）链路接收功率指标（RSRP）。场景包括视距测量，以及行人和 AGV 在两条轨道上的通过过程。}
sources: ['https://github.com/tudo-cni/immerse_dataset', 'https://comnets.etit.tu-dortmund.de/newsdetail/machine-learning-aided-sensing-in-private-mmwave-networks-for-industrial-application-45414/']
checked: '2026-11-06'
pipeline:
  summary: {en: 'Pedestrians or AGVs cross links in a fixed industrial deployment. Commercial modems read dual-band RSRP via AT commands; power sequences are saved by UE, condition, and repeated experiment.', zh: 在固定工业部署中让行人或AGV穿越链路，商用modem经AT指令读取双频RSRP；按UE、条件与重复实验保存功率时间序列。}
  stages:
  - title: {en: Configure the industrial private network and fixed UEs, zh: 配置工业私网和固定UE}
    detail: {en: Use 2.6 GHz LTE-anchor and 27.1 GHz 5G-mmWave dual connectivity with 3 fixed UE positions. The paper specifies 20 MHz and 800 MHz bandwidths and records link positions and distances., zh: 采用2.6 GHz LTE anchor和27.1 GHz 5G mmWave双连接，固定3个UE位置。论文给出20 MHz与800 MHz带宽，并记录链路位置与距离。}
    inputs:
    - {en: LTE anchor and 5G mmWave base station, zh: LTE anchor与5G mmWave基站}
    - {en: 3 fixed UEs and an industrial indoor layout, zh: 3个固定UE与工业室内布局}
    outputs:
    - {en: Deployment geometry, zh: 部署几何}
    - {en: UE and band configuration, zh: UE与频段配置}
    controls:
    - {en: Fixed UE coordinates come from the paper's deployment description; moving obstacles follow separately defined experiment routes, zh: 固定UE坐标来自论文部署信息；动态障碍物另设实验路线}
    checks:
    - {en: 'Reproduction check: verify UE names, bands, and link-specific distances/orientations', zh: 复现检查：核对UE名称、波段和不同链路的距离/朝向}
  - title: {en: Repeat LoS and obstructed-crossing conditions, zh: 重复LoS与遮挡穿越条件}
    detail: {en: 'Collect unobstructed LoS and crossings by two moving-object classes at different positions. The paper includes 420 traces per UE: 60 LoS runs plus 4 groups of 45 runs for each of the two object classes.', zh: 分别采集空场LoS以及两类移动对象在不同位置的穿越。论文每UE含420条轨迹：60次LoS，加两类对象各4组、每组45次。}
    inputs:
    - {en: Pedestrian or AGV, zh: 行人或AGV}
    - {en: Predefined crossing positions and experimental conditions, zh: 预设穿越位置与实验条件}
    outputs:
    - {en: Runs labeled by object and crossing condition, zh: 按对象和穿越条件标注的运行}
    - {en: Event-level repeated experiments, zh: 事件级重复实验}
    controls:
    - {en: Each trace is a run unit; records from multiple UEs observing the same event are related, zh: 每条轨迹是一个运行单位；同一事件的多个UE记录有关联}
    checks:
    - {en: 'Reproduction check: verify whether class, repetition ID, and UE records form the same event group', zh: 复现检查：检查类别、重复编号与UE是否形成同一事件组}
  - title: {en: Record dual-band RSRP through AT commands, zh: 经AT命令记录双频RSRP}
    detail: {en: 'The acquisition program reads 4G/5G RSRP through AT commands at approximately 1.5 ms temporal resolution, with 8000 samples per sequence. BS-side SSB IDs are also recorded at approximately 1 Hz, but verified public CSV metrics focus on RSRP.', zh: 采集程序通过AT指令读取4G/5G RSRP，时间分辨率约1.5 ms，每条序列8000个样本。BS侧另有约1 Hz SSB ID记录，但公开CSV已核实指标集中于RSRP。}
    inputs:
    - {en: Commercial modem diagnostic interface, zh: 商用modem诊断接口}
    - {en: 4G and 5G connection states, zh: 4G与5G连接状态}
    outputs:
    - {en: 4G/5G power time series, zh: 4G/5G功率时间序列}
    - {en: Connection states and run identities, zh: 连接状态与运行身份}
    controls:
    - {en: The cross-modem synchronization protocol and error bounds are unreported; preserve this measurement boundary, zh: 跨modem同步协议和误差上界未报告，需保留这一测量边界}
    checks:
    - {en: 'Reproduction check: inspect actual sampling intervals, repeated values, and disconnections; retain time-offset sensitivity analysis for dual-band correlations', zh: 复现检查：检查实际采样间隔、重复值和断连；双频相关分析保留时间偏移敏感性}
  - title: {en: Publish CSV files by UE and experiment condition, zh: 按UE与实验条件发布CSV}
    detail: {en: 'The official repository organizes CSV files by UE and condition and provides reading and experiment entry points. Power logs and event classes form the main public samples, from which users construct RF-aided classification windows.', zh: 官方仓库按UE和条件组织CSV，并提供读取与实验入口。功率日志和事件类别构成主要公开样本，用户据此构建RF辅助分类窗口。}
    inputs:
    - {en: RSRP from each run, zh: 每次运行的RSRP}
    - {en: 'Object classes, conditions, and UE identifiers', zh: 对象类别、条件和UE标识}
    outputs:
    - {en: RSRP CSV, zh: RSRP CSV}
    - {en: File-level condition/class labels, zh: 文件层面的条件/类别标签}
    controls:
    - {en: RSRP is a power metric; it lacks the phase information in full complex CSI, zh: RSRP是功率指标；不含完整复数CSI的相位信息}
    checks:
    - {en: 'Reproduction check: verify CSV lengths, units, missing-value markers, and mappings from file names to labels', zh: 复现检查：验证CSV长度、量纲、缺失标记及文件命名到标签的映射}
  - title: {en: Split and evaluate by complete events, zh: 以完整事件划分和评估}
    detail: {en: 'Bind multi-UE and multiband windows from the same physical event before splitting training and test sets. Compare single-band and dual-band inputs, simple thresholds, and time-series baselines. Report random window splits within one UE separately as an easier protocol.', zh: 先把同一物理事件的多UE、多频窗口绑定，再划分训练/测试。比较单频与双频输入、简单阈值和时间序列基线；同UE随机切窗仅作为较容易的协议单列。}
    inputs:
    - {en: 'CSV files, run groups, and labels', zh: CSV、运行组和标签}
    outputs:
    - {en: Event-level splits, zh: 事件级split}
    - {en: Dual-band information gains and detection latency, zh: 双频信息增益与检测延迟}
    controls:
    - {en: 'Fix normalization, thresholds, and window lengths using the training/validation sets', zh: 归一化、阈值和窗口长度在训练/验证集固定}
    checks:
    - {en: 'Reproduction check: prevent adjacent windows or the same event from crossing splits; report false-alarm rate, miss rate, and latency', zh: 复现检查：排除相邻窗口和同一事件跨split；报告误报率、漏报率及延迟}
  scope: {en: Dual-connectivity RSRP measurements in an industrial private network; the public interface is organized as per-UE 4G/5G power traces., zh: 工业私网双连接RSRP测量；公开接口按每UE的4G/5G功率轨迹组织。}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: '• Per-UE 4G/5G RSRP CSV files

      • Experiment classes, conditions, and fixed deployment parameters', zh: '• 各UE的4G/5G RSRP CSV

      • 实验类别、条件和固定部署参数'}
- label: {en: Derived outputs, zh: 派生输出}
  text: {en: '• Event-recognition windows, classification features, and cross-UE splits

      • Power-change/blockage metrics', zh: '• 事件识别窗口、分类特征和跨UE划分

      • 功率变化/遮挡指标'}
- label: {en: Reproduction notes, zh: 复现说明}
  text: {en: '• Clock uncertainty affects sample-level cross-UE fusion; complete-event pairing is currently the more reliable unit of use.

      • The paper''s measurement section and repository have been read in this audit; CSV loading has not been executed.', zh: '• 时钟不确定性影响逐样本跨UE融合；完整事件配对是当前更稳妥的使用单元。

      • 本轮已读论文测量段及仓库，尚未执行CSV读取。'}
provenance:
- {en: Industrial indoor LoS and moving obstacles → 4G/5G modem measurements, zh: 工业室内 LoS 与移动障碍 → 4G/5G modem 测量}
- {en: Received-power logs from different UEs → labeled trajectory/event CSV files, zh: 不同 UE 接收功率日志 → 标注轨迹/事件 CSV}
technical_notes:
- {en: 'Verified: Sec. III/Tables I–II specify 2.6/27.1 GHz dual connectivity, 3 fixed UEs, and 420 traces per UE. RSRP is sampled through AT commands at approximately 1.5 ms temporal resolution.', zh: 已确认：Sec.III/Table I–II给出2.6/27.1 GHz双连接、3个固定UE、每UE420条轨迹；RSRP通过AT指令采样，时间分辨率约1.5 ms。}
- {en: 'Verified: the main text also records BS-side SSB beam IDs updated approximately every 1 second, but the repository README lists only 4G/5G RSRP in public CSV files. BS logs cannot be assumed to provide public optimal-beam labels.', zh: 已确认：正文另记录BS侧SSB beam ID约1秒更新，但仓库README列出的公开CSV指标只有4G/5G RSRP；不能把BS日志推定为公开最优beam标签。}
- {en: 'Not reported: cross-modem clock synchronization protocol and error bounds. Multi-link traces of the same event are not coherent dual-band CSI acquired simultaneously at each sample.', zh: 未报告：跨modem的时钟同步协议与误差上界；同一事件多链路轨迹不等于相干、逐采样同时的双频CSI。}
limitations:
- {en: RSRP cannot determine phase or the gain of arbitrary unprobed beams., zh: RSRP 不能确定相位或任意未探测波束收益。}
- {en: Leakage occurs if records of the same event from different modems appear in both training and test sets., zh: 相同事件跨 modem 出现在训练测试两侧会泄漏。}
history:
- {en: '2024: corresponding GLOBECOM Workshops paper.', zh: 2024：GLOBECOM Workshops 对应论文。}
usage:
- {en: First use the official main.py to inspect CSV parameters and filter by modem/track/mode., zh: 先用官方 main.py 查看 CSV 参数并按 modem/track/mode 筛选。}
- {en: 'Group splits by complete passages; compare persistence, threshold detection, and lightweight classification.', zh: 以完整 passage 为分组划分；比较 persistence、阈值检测与轻量分类。}
field_notes:
- label: {en: CSI, zh: CSI}
  text: {en: 'The paper calls RSRP ''CSI metrics''; the Atlas CSI field specifically denotes complex array channels, so it remains unsupported.', zh: 论文把RSRP称为CSI metrics；Atlas的CSI字段专指复数阵列信道，因此仍为不支持。}
- label: {en: Position, zh: 位置}
  text: {en: Table I/Fig. 2 of the original paper provide fixed UE positions/distances. Per-time-step positions of moving pedestrians/AGVs are not among the verified CSV fields., zh: 原论文Table I/Fig.2给出固定UE位置/距离；动态行人/AGV的逐时刻位置不属于已核实CSV字段。}
- label: {en: Beam labels, zh: 波束标签}
  text: {en: 'The paper contains 1 Hz SSB ID logs, but their presence in public CSV files is unverified; exhaustive-codebook labels are absent.', zh: 论文有1 Hz SSB ID日志，但未核实公开CSV提供；没有穷举码本标签。}
- label: {en: Multi-BS, zh: 多基站}
  text: {en: The paper uses dual connectivity with one 5G mmWave base station and an LTE anchor. It provides no multiple-candidate-BS handover/coherent joint-service data; dual-band dual connectivity does not directly establish multi-BS scheduling data., zh: 论文采用一个5G mmWave基站及LTE anchor的双连接实验；未提供多候选BS切换/相干联合服务数据，不能据双频双连接直接声称多BS调度数据。}
overview: {en: 'IMMERSE is a dataset of raw sub-6 GHz and mmWave measurements from an indoor private industrial network. The data were produced by Haferkamp, Häger, Böcker and Wietfeld at TU Dortmund for the paper ''Machine Learning-aided Sensing in Private mmWave Networks for Industrial Applications'', presented at the IEEE Globecom Workshops in December 2024. Three modems, UE_A, UE_B and UE_C, record received-power metrics (RSRP) on a 4G sub-6 GHz link and a 5G mmWave link. The recordings cover line-of-sight runs and passages of pedestrians and automated guided vehicles (AGVs) on two tracks, track1 and track2. The files are CSV, arranged by mode, measurement ID, modem and channel metric.', zh: IMMERSE 是一套来自室内工业私有网络的原始 sub-6 GHz 与 mmWave 测量数据。数据由 TU Dortmund 的 Haferkamp、Häger、Böcker 和 Wietfeld 为论文《Machine Learning-aided Sensing in Private mmWave Networks for Industrial Applications》采集，该论文于 2024 年 12 月在 IEEE Globecom Workshops 上发表。三台终端（UE_A、UE_B 和 UE_C）记录 4G sub-6 GHz 链路与 5G mmWave 链路的接收功率指标（RSRP）。数据覆盖视距（LoS）测量，以及行人与自动导引车（AGV）在两条轨道（track1、track2）上的通过过程。文件为
    CSV 格式，按模式、测量编号、终端和信道指标分层存放。}
signal_details:
- signal: rssi
  text: {en: 'RSRP recorded by three modems and stored as CSV. The metric names are 4G_prx_rsrp, 5G_prx_rsrp and 5G_drx_rsrp, where 4G denotes the sub-6 GHz link and 5G denotes the mmWave link. The plotting scripts filter by modem, metric, mode (los, agv, pedestrian) and track (track1, track2).', zh: 三台终端记录的 RSRP，以 CSV 格式存储。指标名为 4G_prx_rsrp、5G_prx_rsrp 和 5G_drx_rsrp，其中 4G 指 sub-6 GHz 链路，5G 指 mmWave 链路。绘图脚本可按终端、指标、模式（los、agv、pedestrian）和轨道（track1、track2）筛选数据。}
