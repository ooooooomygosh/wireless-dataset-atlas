summary: {en: 'Channel state information recorded at 1.272 GHz with 50 MHz bandwidth by the DICHASUS distributed massive MIMO channel sounder, with ground-truth position tags and timestamps. Two indoor sets are included: a non-line-of-sight single room and a line-of-sight lab room with distributed arrays.', zh: 由 DICHASUS 分布式大规模 MIMO 信道探测仪在 1.272 GHz、50 MHz 带宽下记录的信道状态信息（CSI），附带真值位置标签和时间戳。包含两组室内数据：非视距单室环境，以及带分布式阵列的视距实验室环境。}
sources: ['https://darus.uni-stuttgart.de/dataset.xhtml?persistentId=doi%3A10.18419%2FDARUS-2204', 'https://darus.uni-stuttgart.de/dataset.xhtml?persistentId=doi%3A10.18419%2FDARUS-2218', 'https://export.arxiv.org/api/query?id_list=2206.15302', 'https://arxiv.org/abs/2206.15302', 'https://darus.uni-stuttgart.de/api/datasets/:persistentId/?persistentId=doi:10.18419/DARUS-2204', 'https://darus.uni-stuttgart.de/api/datasets/:persistentId/?persistentId=doi:10.18419/DARUS-2218', 'https://darus.uni-stuttgart.de/api/access/datafile/68517', 'https://darus.uni-stuttgart.de/api/access/datafile/68616', 'https://dichasus.inue.uni-stuttgart.de/datasets/', 'https://arxiv.org/pdf/2206.15302', 'https://darus.uni-stuttgart.de/api/datasets/:persistentId/versions?persistentId=doi:10.18419/DARUS-2204', 'https://darus.uni-stuttgart.de/api/datasets/:persistentId/versions?persistentId=doi:10.18419/DARUS-2218', 'https://darus.uni-stuttgart.de/api/search?q=dichasus&per_page=50&type=dataset']
checked: '2026-11-06'
pipeline:
  summary: {en: 'A single-antenna transmitter on a vacuum robot sends CP-OFDM pilots while distributed receivers synchronize to a reference transmitter over the air. The receivers store I/Q bursts, from which complex CSI is extracted per subcarrier and labeled with LiDAR positions and packed as TFRecord runs.', zh: 真空吸尘器机器人上的单天线发射机发送CP-OFDM导频，分布式接收机通过空口参考信号同步。接收机保存I/Q突发数据，从中提取逐子载波复数CSI，附加激光雷达位置标签，并打包为TFRecord运行数据。}
  scope: {en: 'dichasus-005x and dichasus-0d5x, following the DICHASUS system paper and the two DaRUS records.', zh: dichasus-005x与dichasus-0d5x，依据DICHASUS系统论文及两条DaRUS记录。}
  stages:
  - title: {en: Deploy receiver arrays and the robot transmitter, zh: 部署接收阵列与机器人发射机}
    detail: {en: 'Receive arrays are placed in an indoor room, and a single-antenna transmitter mounted on a vacuum robot moves through the measurement area. dichasus-005x uses one 32-element array arranged as 4 rows of 8 with 0.118 m spacing; dichasus-0d5x uses two 16-element arrays at separate positions.', zh: 接收阵列布置在室内，单天线发射机安装在真空吸尘器机器人上，在测量区域内移动。dichasus-005x使用一个32天线阵列（4行×8列，间距0.118 m）；dichasus-0d5x使用两个分离位置的16天线阵列。}
    inputs:
    - {en: Indoor room and robot route, zh: 室内房间与机器人路线}
    outputs:
    - {en: Array geometry recorded in spec.json, zh: spec.json中记录的阵列几何}
  - title: {en: Synchronize receivers over the air, zh: 通过空口信号同步接收机}
    detail: {en: 'Each receiver is an autonomous single-antenna unit that follows the broadcast of a reference transmitter for frequency, timing and phase. Offline post-processing then corrects residual carrier frequency offset, phase and sub-sample timing offsets.', zh: 每个接收机都是自主运行的单天线单元，跟踪参考发射机的广播信号以对齐频率、时间和相位。离线后处理再校正残余载频偏移、相位和亚采样时间偏移。}
    inputs:
    - {en: Reference transmitter broadcast, zh: 参考发射机广播信号}
    outputs:
    - {en: Phase-aligned I/Q from all receivers, zh: 所有接收机相位对齐的I/Q数据}
  - title: {en: Transmit OFDM pilots and capture I/Q, zh: 发送OFDM导频并采集I/Q}
    detail: {en: The mobile transmitter sends CP-OFDM pilot symbols at 1.272 GHz with a bandwidth of up to 50 MHz. The receivers store raw I/Q samples in bursts on USB storage., zh: 移动发射机以1.272 GHz载频发送最大带宽50 MHz的CP-OFDM导频符号，接收机以突发方式将原始I/Q采样保存到USB存储器。}
    inputs:
    - {en: Pilot OFDM signal from the mobile transmitter, zh: 移动发射机发送的导频OFDM信号}
    outputs:
    - {en: Raw I/Q bursts for each receiver, zh: 每个接收机的原始I/Q突发数据}
  - title: {en: Estimate subcarrier CSI per burst, zh: 逐突发估计子载波CSI}
    detail: {en: 'The transmitted OFDM symbols are reconstructed from the received signal, and the channel coefficient on each subcarrier and antenna is calculated. Each datapoint carries a timestamp and an SNR estimate, and dichasus-0d5x also stores the carrier frequency offset.', zh: 由接收信号重建发送的OFDM符号，并计算每个子载波与每根天线的信道系数。每个数据点带有时间戳和SNR估计，dichasus-0d5x还保存载频偏移。}
    inputs:
    - {en: Reconstructed transmit symbols and synchronized I/Q, zh: 重建的发送符号与同步后的I/Q数据}
    outputs:
    - {en: Complex CSI with timestamp and SNR per datapoint, zh: 每个数据点的复数CSI、时间戳与SNR}
  - title: {en: Attach LiDAR positions and interpolate them, zh: 附加激光雷达位置并插值}
    detail: {en: 'The LiDAR on the vacuum robot gives the transmitter position, which is linearly interpolated to each CSI time. dichasus-0d5x stores the time to the nearest LiDAR fix as an interpolation-age field, and both records store the robot rotation.', zh: 真空吸尘器机器人上的激光雷达给出发射机位置，并线性插值到每个CSI时刻。dichasus-0d5x另存最近激光雷达位置的时间差作为插值年龄字段；两条记录都保存机器人旋转角。}
    inputs:
    - {en: Robot LiDAR positions and CSI timestamps, zh: 机器人激光雷达位置与CSI时间戳}
    outputs:
    - {en: LiDAR transmitter position for each CSI record, zh: 每条CSI记录对应的激光雷达发射机位置}
  - title: {en: Package each robot run as TFRecord, zh: 将每次机器人运行打包为TFRecord}
    detail: {en: 'Records are written to TFRecord files, one per complete robot run: five runs for dichasus-005x and seven for dichasus-0d5x. spec.json documents the arrays, antenna assignments and field formats and is the reference for parsing the files.', zh: 记录按完整机器人运行写入TFRecord文件：dichasus-005x为5次运行，dichasus-0d5x为7次运行。spec.json描述阵列、天线分配和字段格式，是解析文件的依据。}
    inputs:
    - {en: 'Per-datapoint CSI, timestamps and position labels', zh: 逐数据点的CSI、时间戳与位置标签}
    outputs:
    - {en: TFRecord run files and spec.json, zh: TFRecord运行文件与spec.json}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: 'TFRecord files with complex CSI, SNR, LiDAR transmitter position, time and robot rotation, plus spec.json. dichasus-0d5x adds CFO and LiDAR interpolation age.', zh: TFRecord文件包含复数CSI、SNR、激光雷达发射机位置、时间和机器人旋转角，并附spec.json。dichasus-0d5x另含CFO与激光雷达插值年龄。}
provenance:
- {en: Real indoor/outdoor environment → robot or mobile transmitter sends OFDM, zh: 真实室内/室外环境 → 机器人或移动发射机发送 OFDM}
- {en: Distributed receive arrays + OTA synchronization → coherent complex CSI, zh: 分布式接收阵列 + OTA 同步 → 相干复数 CSI}
- {en: Position and time labels → TFRecord; spec.json describes measurement parameters, zh: 位置和时间标签 → TFRecord；spec.json 描述测量参数}
technical_notes:
- {en: 'Over-the-air reference signals align receiver frequency, timing and phase, so channels measured at distributed arrays can be processed jointly.', zh: 空口参考信号用于对齐接收机的频率、时间和相位，因此分布式阵列测得的信道可以联合处理。}
- {en: 'CSI amplitudes are relative to an arbitrary but constant reference level set separately for each measurement campaign, so absolute gains are not comparable across campaigns.', zh: CSI幅度相对于每次测量活动各自设定的任意但恒定的参考电平，因此不同活动之间的绝对增益不可直接比较。}
- {en: 'dichasus-0d5x uses two separated arrays in an indoor lab room, mostly line-of-sight, with a vacuum robot-mounted transmitter.', zh: dichasus-0d5x在室内实验室中使用两个分离的阵列，以视距为主，发射机安装在真空吸尘器机器人上。}
limitations:
- {en: 'Runs 0d51 and 0d52 of dichasus-0d5x were recorded with 4 dB higher gain than runs 0d53 to 0d57, so their received levels are not directly comparable.', zh: dichasus-0d5x的0d51与0d52运行增益比0d53至0d57高4 dB，因此两组接收电平不可直接比较。}
- {en: 'Each record contains one robot-mounted transmitter, so coexisting users are not measured.', zh: 每条记录只有一个机器人安装的发射机，因此没有共存用户的实测数据。}
history:
- {en: '2021-10-21: dichasus-005x published on DaRUS as version 1.0.', zh: 2021-10-21：dichasus-005x在DaRUS发布，版本1.0。}
- {en: '2022-02-02: dichasus-0d5x published on DaRUS as version 1.0.', zh: 2022-02-02：dichasus-0d5x在DaRUS发布，版本1.0。}
- {en: '2022-06-30: the system paper was posted on arXiv as 2206.15302.', zh: 2022-06-30：系统论文以arXiv 2206.15302发布。}
usage:
- {en: 'spec.json lists the array positions, antenna assignments, 0.118 m element spacing and field descriptions; read it before parsing the TFRecord files.', zh: spec.json给出阵列位置、天线分配、0.118 m阵元间距及字段说明；解析TFRecord文件前应先阅读。}
- {en: 'In the paper''s localization experiment on dichasus-015x, a neural network is trained on two robot round trips and tested on a third, because each trip follows a different path.', zh: 论文在dichasus-015x上的定位实验中，用两次机器人往返数据训练神经网络，用第三次往返数据测试，因为每次往返的路径不同。}
field_notes:
- label: {en: RGB, zh: RGB}
  text: {en: The DaRUS records contain only TFRecord runs and spec.json; no camera or video files are included., zh: DaRUS记录只包含TFRecord运行数据和spec.json，不含摄像头或视频文件。}
- label: {en: LiDAR, zh: LiDAR}
  text: {en: The robot LiDAR provides the transmitter position labels (pos-lidar); no LiDAR point clouds are included., zh: 机器人激光雷达提供发射机位置标签（pos-lidar），不含激光点云。}
- label: {en: Radar, zh: 雷达}
  text: {en: 'No radar observations are included; the fields are CSI, SNR, position, time and rotation, plus CFO and interpolation age in dichasus-0d5x.', zh: 不包含雷达观测；字段为CSI、SNR、位置、时间和旋转角，dichasus-0d5x另含CFO和插值年龄。}
- label: {en: Multi-user, zh: 多用户}
  text: {en: 'Each record has one robot-mounted transmitter, so the data contain no synchronized multi-UE measurement.', zh: 每条记录只有一个机器人安装的发射机，因此数据不含同步的多UE实测。}
- label: {en: Multi-BS, zh: 多基站}
  text: {en: The two arrays of dichasus-0d5x belong to one sounding system and share the over-the-air reference; the records contain no base-station protocol or scheduling data., zh: dichasus-0d5x的两个阵列属于同一套探测系统并共享空口参考信号；记录中不含基站协议或调度数据。}
tools: [wireless-ml-data-hub]
overview: {en: 'DICHASUS is a set of channel state information (CSI) recordings made with the DICHASUS distributed massive MIMO channel sounder of the Institute of Telecommunications, University of Stuttgart. The two records in this entry are dichasus-005x, an indoor non-line-of-sight single room with five complete runs, and dichasus-0d5x, an indoor lab room with two separated antenna arrays, mostly line-of-sight, with seven complete runs. In both records a vacuum robot carries the transmit antenna, the carrier frequency is 1.272 GHz and the bandwidth is 50 MHz. Each record stores CSI in TFRecord files together with SNR estimates, the transmitter position from the robot LiDAR, timestamps and robot rotation, and a machine-readable spec.json describes the arrays and fields. The records were published on DaRUS under CC BY 4.0, dichasus-005x in October 2021 and dichasus-0d5x in February 2022.', zh: DICHASUS 是斯图加特大学通信研究所分布式大规模 MIMO 信道探测仪采集的信道状态信息（CSI）数据集。本条目包含两条记录：dichasus-005x 为室内非视距单房间场景，含
    5 次完整运行；dichasus-0d5x 为室内实验室场景，使用两个分离的天线阵列，以视距为主，含 7 次完整运行。两条记录中，发射天线均安装在真空吸尘器机器人上。载频为 1.272 GHz，带宽为 50 MHz。每条记录以 TFRecord 文件保存 CSI，并附带 SNR 估计、机器人激光雷达给出的发射机位置、时间戳和机器人旋转角，spec.json 以机器可读形式描述阵列与字段。两条记录均以 CC BY 4.0 许可在 DaRUS 发布，dichasus-005x 发布于 2021 年 10 月，dichasus-0d5x 发布于 2022 年 2 月。}
signal_details:
- signal: csi
  text: {en: 'Complex channel coefficients (real and imaginary parts) for all antenna elements over all subcarriers, stored as tensors in TFRecord files. Carrier 1.272 GHz, bandwidth 50 MHz. dichasus-005x uses one array of 32 antenna elements arranged as 4 rows of 8, with spacing 0.118 m. dichasus-0d5x uses two arrays of 16 antenna elements each (2 rows of 8), with spacing 0.118 m. Each record also stores per-antenna SNR estimates (snr), the transmitter position from the vacuum robot LiDAR in meters (pos-lidar, X and Y, tensor64), timestamps in seconds since the start of the campaign (time), and the robot rotation in radians (rot in dichasus-005x, rot-lidar in dichasus-0d5x). dichasus-0d5x adds the measured carrier frequency offset between the transmitter and each receive antenna (cfo) and the time in seconds to the closest LiDAR position (gt-interp-age-lidar).', zh: 所有天线单元、所有子载波的复信道系数（实部与虚部），以 TFRecord 文件中的张量形式保存。载频 1.272 GHz，带宽 50 MHz。dichasus-005x 使用一个阵列，共 32 个天线单元，排列为 4 行 × 8 列，间距 0.118
      m。dichasus-0d5x 使用两个阵列，每个阵列 16 个天线单元（2 行 × 8 列），间距 0.118 m。每条记录还保存各天线的 SNR 估计（snr）、真空吸尘器机器人激光雷达给出的发射机位置（pos-lidar，单位 m，X 与 Y 坐标，类型 tensor64）、自测量活动开始以来的时间戳（time，单位 s），以及机器人旋转角（dichasus-005x 为 rot，dichasus-0d5x 为 rot-lidar，单位 rad）。dichasus-0d5x 另有发射机与各接收天线之间测得的载波频偏（cfo），以及距最近激光雷达位置的时间（gt-interp-age-lidar，单位 s）。}
antennas: {tx: 1, rx: 32}
format: TFRecord runs with spec.json
mobility: Vacuum robot-mounted transmitter moving through the room in complete runs
size_gb: 49.5
capabilities:
- key: csi
  status: provided
  note: {en: 'Complex channel coefficients on all subcarriers at 1.272 GHz and 50 MHz; 005x has one 32-element array, 0d5x has two 16-element arrays.', zh: 全部子载波的复数信道系数，载频1.272 GHz，带宽50 MHz；005x为一个32阵元阵列，0d5x为两个16阵元阵列。}
- key: cir
  status: derivable
  note: {en: Not stored; obtained by an inverse FFT of the subcarrier coefficients., zh: 未存储；可对子载波系数做逆FFT得到。}
- key: paths
  status: none
  note: {en: 'Only CSI, SNR, position, time and rotation fields are released; no path parameters.', zh: 仅发布CSI、SNR、位置、时间和旋转角字段；无路径参数。}
- key: interaction
  status: none
  note: {en: No per-path interaction labels are released., zh: 未发布逐径交互标签。}
- key: power
  status: derivable
  note: {en: Received power per antenna and subcarrier is computed from the stored CSI; per-antenna SNR estimates are also stored., zh: 各天线、各子载波的接收功率由存储的CSI计算；另存有各天线的SNR估计。}
- key: iq
  status: none
  note: {en: Raw I/Q samples are not released; the files hold reconstructed channel coefficients., zh: 未发布原始I/Q采样；文件中为重建后的信道系数。}
- key: beam_labels
  status: derivable
  note: {en: No beam index or codebook is released; beam labels can be computed from the stored CSI., zh: 未发布波束索引或码本；波束标签可由存储的CSI计算。}
- key: position
  status: provided
  note: {en: 'Transmitter X/Y position in meters from the robot LiDAR (pos-lidar), linearly interpolated to CSI time.', zh: 由机器人LiDAR得到的发射机X/Y位置（米，pos-lidar），已线性插值到CSI时刻。}
- key: geometry
  status: none
  note: {en: Array locations and orientations are in spec.json; no 3D scene or map file is released., zh: 阵列位置与朝向见spec.json；未发布三维场景或地图文件。}
- key: materials
  status: none
  note: {en: No material parameters are released., zh: 未发布材料参数。}
- key: rgb
  status: none
  note: {en: 'Only setup photographs are included, not per-sample images.', zh: 仅包含实验布置照片，无逐样本图像。}
- key: depth
  status: none
  note: {en: No depth data are released., zh: 未发布深度数据。}
- key: lidar
  status: none
  note: {en: The robot LiDAR is used only to produce the position labels; no point clouds are released., zh: 机器人LiDAR仅用于生成位置标签；未发布点云。}
- key: radar
  status: none
  note: {en: No radar observations are included., zh: 不包含雷达观测。}
- key: imu
  status: none
  note: {en: Robot rotation (rot) is stored; no IMU sample stream is listed., zh: 存有机器人旋转角（rot）；未列出IMU采样流。}
- key: time_series
  status: provided
  note: {en: 'Timestamped CSI for each complete robot run, with time in seconds since the start of the campaign.', zh: 每次完整机器人运行的带时间戳CSI，时间为自测量开始的秒数。}
- key: multiuser
  status: none
  note: {en: One robot-mounted transmitter per run; no simultaneous users., zh: 每次运行一个机器人安装的发射机；无同时存在的用户。}
- key: multibs
  status: provided
  note: {en: 'dichasus-0d5x only: two separated 16-element arrays of one sounding system share an over-the-air reference; no base-station protocol data.', zh: 仅dichasus-0d5x：同一探测系统的两个分离16阵元阵列共享空口参考；无基站协议数据。}
- key: crossfreq
  status: none
  note: {en: Both records use a single carrier at 1.272 GHz., zh: 两条记录均使用1.272 GHz单一载频。}
- {key: near_field, status: unknown}
- {key: high_mobility, status: unknown}
- {key: dynamic_blockage, status: unknown}
