summary: {en: 'The dataset contains 687 training and 3,951 test Wi-Fi fingerprints, recorded as MAC addresses and RSS values with 21 devices in a four-floor university building in Tampere, Finland, from January to August 2017. MATLAB and Python benchmark software for Wi-Fi indoor positioning is included.', zh: '数据集包含687条训练Wi-Fi指纹和3,951条测试Wi-Fi指纹，由21台设备在芬兰坦佩雷一栋四层大学建筑中于2017年1月至8月采集，记录MAC地址和RSS值。数据集同时包含用于Wi-Fi室内定位的MATLAB和Python基准测试软件。'}
