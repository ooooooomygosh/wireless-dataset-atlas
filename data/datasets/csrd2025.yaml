summary: {en: 'Synthetic passband IQ frames of about 100 modulation types, including analog, digital, OFDM and OTFS, generated by the CSRD generator with statistical fading and OpenStreetMap-based ray tracing. The dataset comprises over 25 million frames (about 200 TB) with COCO-annotated spectrograms.', zh: 由 CSRD 生成器合成的通带 IQ 帧，涵盖约 100 种调制类型（包括模拟、数字、OFDM 和 OTFS），信道采用统计衰落与基于 OpenStreetMap 的射线追踪。数据集包含超过 2500 万帧（约 200 TB），并附带 COCO 格式标注的频谱图。}
sources: ['https://arxiv.org/abs/2508.19552', 'https://arxiv.org/html/2508.19552v1', 'https://github.com/Singingkettle/ChangShuoRadioData', 'https://export.arxiv.org/api/query?id_list=2508.19552', 'https://raw.githubusercontent.com/Singingkettle/ChangShuoRadioData/main/README.md', 'https://raw.githubusercontent.com/Singingkettle/ChangShuoRadioData/main/LICENSE', 'https://raw.githubusercontent.com/Singingkettle/ChangShuoRadioData/main/config/csrd2025/csrd2025.m', 'https://raw.githubusercontent.com/Singingkettle/ChangShuoRadioData/main/config/_base_/factories/channel_factory.m', 'https://raw.githubusercontent.com/Singingkettle/ChangShuoRadioData/main/config/_base_/factories/scenario_factory.m', 'https://api.github.com/repos/Singingkettle/ChangShuoRadioData/git/trees/main?recursive=1', 'https://raw.githubusercontent.com/Singingkettle/ChangShuoRadioData/main/docs/annotation-schema.md', 'https://raw.githubusercontent.com/Singingkettle/ChangShuoRadioData/main/docs/configuration.md', 'https://raw.githubusercontent.com/Singingkettle/ChangShuoRadioData/main/config/_base_/factories/transmit_factory.m',
