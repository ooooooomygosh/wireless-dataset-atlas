checked: '2026-11-06'
overview: {en: 'CSRD2025 is a synthetic radio dataset produced by the ChangShuoRadioData (CSRD) generator, a MATLAB framework described by Shuo Chang (Beijing University of Posts and Telecommunications) and five coauthors; the paper was posted to arXiv on 27 August 2025. The frames are generated in simulation, not measured over the air. The framework covers about 100 modulation types, including analog, digital single-carrier, OFDM, SC-FDMA and OTFS signals, and its channels combine statistical fading (Rayleigh and Rician) with site-specific ray tracing on OpenStreetMap building geometry. The paper reports more than 25 million frames, about 200 TB, with IQ data in MAT files and one JSON annotation per receiver frame that records the ground-truth SNR and transmitter parameters. Spectrograms computed with the STFT are annotated in COCO format for object detection, and frames are split 8:1:1 into training, validation and test sets by frame index. The 200 TB instance is not hosted for download;
    the paper states that it can be regenerated from the released code, configurations and fixed random seeds.', zh: 'CSRD2025 是由 ChangShuoRadioData（CSRD）生成器合成的射频数据集。CSRD 是一个 MATLAB 框架，由北京邮电大学的 Shuo Chang 与五位合作者发表，论文于 2025 年 8 月 27 日发布在 arXiv 上。数据帧由仿真生成，而非空口实测。该框架涵盖约 100 种调制类型，包括模拟、单载波数字、OFDM、SC-FDMA 和 OTFS 信号；信道部分结合统计衰落（Rayleigh 与 Rician）以及基于 OpenStreetMap 建筑几何的站点特定射线追踪。论文报告数据集包含超过 2500 万帧，约 200 TB；IQ 数据以 MAT 文件保存，每个接收帧对应一个 JSON 标注，记录真实 SNR 与发射机参数。由 STFT 计算的频谱图按 COCO 格式标注，用于目标检测；各帧按帧索引以 8:1:1 划分为训练、验证和测试集。论文中的 200 TB 数据实例不提供下载，作者称可依据已发布的代码、配置和固定随机种子重新生成。'}
signal_details:
- signal: iq
  text: {en: 'IQ samples stored as .mat files under sequence_data/iq, one file per receiver frame and receiver, described by the paper as passband IQ data. Each frame contains 1 to 4 transmitters, 1 to 4 receivers and 1 to 3 segments per transmitter. Symbol rates are randomized in the range 30-50 kHz, and signal bandwidths range from tens of kHz to over 800 kHz. MIMO links up to 4x4 are included. Spectrograms are computed by STFT, with a Hamming window in the reference implementation.', zh: IQ 样本以 .mat 文件保存在 sequence_data/iq 下，每个接收机每帧一个文件，论文将其描述为通带 IQ 数据。每帧包含 1 至 4 个发射机、1 至 4 个接收机，每个发射机 1 至 3 个信号段。符号速率在 30-50 kHz 范围内随机取值，信号带宽从数十 kHz 到 800 kHz 以上。包含最高 4x4 的 MIMO 链路。频谱图由 STFT 计算，参考实现使用 Hamming 窗。}
pipeline:
  summary: {en: 'The MATLAB generator samples a scenario from configuration, synthesizes modulated signals, passes them through transmitter impairments, statistical or ray-traced channels and receiver impairments, then saves IQ files, JSON annotations and COCO labels.', zh: MATLAB 生成器根据配置采样场景，合成调制信号，依次经过发射机损伤、统计或射线追踪信道以及接收机损伤，最后保存 IQ 文件、JSON 标注和 COCO 标签。}
  stages:
  - title: {en: Scenario configuration, zh: 场景配置}
    detail: {en: 'The run is driven by configuration files; the default working example is config/csrd2025/csrd2025.m in the repository. Scenario parameters such as the number of transmitters, receivers, segments per transmitter and channel model are sampled from configured distributions, and the scenario is frozen into a ScenarioPlan before generation.', zh: 运行由配置文件驱动，仓库中的默认示例为 config/csrd2025/csrd2025.m。发射机数、接收机数、每个发射机的信号段数和信道模型等场景参数从配置的分布中采样，并在生成前固化为 ScenarioPlan。}
    inputs:
    - {en: configuration file, zh: 配置文件}
    - {en: OpenStreetMap map files, zh: OpenStreetMap 地图文件}
    outputs:
    - {en: frozen ScenarioPlan, zh: 固化的 ScenarioPlan}
  - title: {en: Waveform generation, zh: 波形生成}
    detail: {en: 'Digital schemes typically use pseudo-random binary sequences as source data, and analog schemes can load audio files. The modulator library covers ASK, PSK up to 64-PSK, QAM up to 4096-QAM, FSK, CPM, OFDM, SC-FDMA and OTFS, with randomized RRC pulse shaping and OSTBC for MIMO transmission.', zh: 数字调制通常使用伪随机二进制序列作为源数据，模拟调制可加载音频文件。调制库涵盖 ASK、最高 64-PSK 的 PSK、最高 4096-QAM 的 QAM、FSK、CPM、OFDM、SC-FDMA 和 OTFS，并采用随机 RRC 脉冲成形，MIMO 传输使用 OSTBC。}
    inputs:
    - {en: source bit sequences or audio, zh: 源比特序列或音频}
    outputs:
    - {en: modulated baseband signals, zh: 调制后的基带信号}
  - title: {en: Event placement and transmitter impairments, zh: 事件放置与发射机损伤}
    detail: {en: 'The event controller places segments in time and frequency with idle periods and guard bands. Spectral overlap is controlled, reaching up to 15 percent probability and extent in the reference configuration. IQ imbalance, DC offset, phase noise and PA nonlinearity (cubic, Saleh, Ghorbani or Rapp models) are applied per transmitter.', zh: 事件控制器在时间与频率上放置信号段，并设置空闲时段与保护带。频谱重叠可控，参考配置中重叠的概率与程度最高达 15%。每个发射机施加 IQ 不平衡、直流偏置、相位噪声以及 PA 非线性（三次多项式、Saleh、Ghorbani 或 Rapp 模型）。}
    inputs:
    - {en: signal segments with timing and bandwidth, zh: 带时序与带宽的信号段}
    outputs:
    - {en: impaired transmitter outputs, zh: 受损的发射机输出}
  - title: {en: Channel propagation, zh: 信道传播}
    detail: {en: 'Path loss and Rayleigh or Rician fading with Doppler shifts for speeds of 1.5 to 28 m/s are applied. Site-specific ray tracing uses SBR or the image method on OSM building data from 25 OSM environment types; the default configuration sends about 90 percent of scenarios through ray tracing and the rest through the statistical model, and ray tracing needs MATLAB''s raytrace and siteviewer functions and map files under data/map/osm/.', zh: 应用路径损耗、Rayleigh 或 Rician 衰落，以及速度 1.5 至 28 m/s 对应的多普勒频移。站点特定射线追踪采用 SBR 或镜像法，使用来自 25 种 OSM 环境类型的建筑数据；默认配置约 90% 的场景经射线追踪，其余场景使用统计模型，射线追踪需要 MATLAB 的 raytrace 与 siteviewer 函数以及 data/map/osm/ 下的地图文件。}
    inputs:
    - {en: OSM building geometry, zh: OSM 建筑几何}
    outputs:
    - {en: link channel impulse responses, zh: 链路信道冲激响应}
  - title: {en: Receiver front end and SNR labelling, zh: 接收机前端与 SNR 标注}
    detail: {en: 'AWGN is added with a randomized receiver noise figure, and receiver IQ imbalance, DC offset and LNA nonlinearity are simulated with stochastically chosen parameters. The ground-truth SNR of each signal is computed relative to thermal noise before the other receiver impairments are applied.', zh: 按随机接收机噪声系数加入 AWGN，并以随机选取的参数模拟接收机 IQ 不平衡、直流偏置和 LNA 非线性。每个信号的真实 SNR 在施加其他接收机损伤之前，相对热噪声计算。}
    inputs:
    - {en: received signal sum per receiver, zh: 每个接收机的接收信号叠加}
    outputs:
    - {en: receiver IQ frames and SNR labels, zh: 接收机 IQ 帧与 SNR 标签}
  - title: {en: Archiving and annotation, zh: 归档与标注}
    detail: {en: 'Each receiver frame is saved as a .mat IQ file in sequence_data/iq and a JSON metadata file in anno/, linked by file name. Spectrograms are converted to COCO JSON with bounding boxes from the signal start and end times and frequency limits, and labels from the modulation type, for each of the 8:1:1 splits.', zh: '每个接收帧保存为 sequence_data/iq 下的 .mat IQ 文件，以及 anno/ 下的 JSON 元数据文件，两者按文件名关联。频谱图经转换生成 COCO JSON，边界框由信号的起止时间和频率范围确定，类别标签取自调制类型，每个 8:1:1 划分各生成一份。'}
    inputs:
    - {en: IQ and JSON metadata per frame, zh: 每帧的 IQ 与 JSON 元数据}
    outputs:
    - {en: 'IQ .mat files, JSON annotations and COCO labels', zh: IQ .mat 文件、JSON 标注与 COCO 标签}
facts:
- label: {en: Frame unit, zh: 帧单位}
  text: {en: 'Each frame is one receiver''s view of a scenario, so a scenario with several receivers yields one frame per receiver; the total frame count is the sum of receivers over scenarios.', zh: 每帧对应场景中某个接收机的视角，因此多接收机场景会产生多帧；总帧数为各场景接收机数之和。}
- label: {en: COCO boxes, zh: COCO 边界框}
  text: {en: 'Each COCO box spans the signal''s start to end time and its frequency range, stored as top-left corner coordinates with width and height, and labeled with the modulation type.', zh: 每个 COCO 边界框由信号的起止时间与频率范围确定，以左上角坐标及宽高保存，类别标签为调制类型。}
capabilities:
- key: csi
  status: simulate
  note: {en: Per-antenna channels are faded inside the generator; the annotations do not store channel matrices., zh: 各天线信道在生成器内部衰落；标注不存储信道矩阵。}
- key: cir
  status: simulate
  note: {en: Path delays and gains are set per channel model (for example Rician at 0 and 1 µs); impulse responses are not saved., zh: 路径时延与增益由信道模型设定（例如 Rician 为 0 与 1 µs）；冲激响应不予保存。}
- key: paths
  status: simulate
  note: {en: 'Only RayCount is recorded for ray-traced links; per-path delay, angle and power are not saved.', zh: 射线追踪链路仅记录 RayCount；逐路径时延、角度与功率不予保存。}
- key: interaction
  status: simulate
  note: {en: The SBR ray tracer computes reflection points (up to 3 reflections) at run time; only RayCount is recorded., zh: SBR 射线追踪器在运行时计算反射点（最多 3 次反射），仅记录 RayCount。}
- key: power
  status: simulate
  note: {en: 'PathLossDB, per-source SNR and measured power are recorded in each frame''s annotation.', zh: 每帧标注中记录 PathLossDB、逐信源 SNR 与测量功率。}
- key: iq
  status: simulate
  note: {en: IQ .mat files per receiver frame are produced by the generator; the 200 TB instance is not offered for download., zh: 每个接收帧的 IQ .mat 文件由生成器产生；200 TB 的数据实例未提供下载。}
- key: beam_labels
  status: none
  note: {en: The configuration has no beamforming or beam labels; MIMO transmission uses OSTBC., zh: 配置中没有波束成形或波束标签；MIMO 传输采用 OSTBC。}
- key: position
  status: simulate
  note: {en: 'Tx and Rx positions and velocities are recorded per frame in GeometrySnapshot, in metres.', zh: 逐帧在 GeometrySnapshot 中记录 Tx 与 Rx 的位置和速度（单位：米）。}
- key: geometry
  status: simulate
  note: {en: Ray tracing uses OpenStreetMap building data fetched by tools/download_osm.py into data/map/osm; no map files are listed among the released outputs., zh: 射线追踪使用由 tools/download_osm.py 下载至 data/map/osm 的 OpenStreetMap 建筑数据；发布输出中未列出地图文件。}
- {key: materials, status: unknown}
- key: rgb
  status: none
  note: {en: The data hold IQ files and COCO labels on spectrograms; no optical images are produced., zh: 数据包含 IQ 文件与基于频谱图的 COCO 标注，不产生光学图像。}
- key: depth
  status: none
  note: {en: No depth sensor data are produced., zh: 不产生深度传感器数据。}
- key: lidar
  status: none
  note: {en: No LiDAR data are produced., zh: 不产生 LiDAR 数据。}
- key: radar
  status: none
  note: {en: No radar data are produced; the spectrum-sensing targets are communication signals., zh: 不产生雷达数据；频谱感知目标为通信信号。}
- key: imu
  status: none
  note: {en: No IMU data are produced., zh: 不产生 IMU 数据。}
- {key: time_series, status: unknown}
- key: multiuser
  status: simulate
  note: {en: 'The default configuration samples 1 to 8 transmitters per scenario, each with its own channel.', zh: 默认配置每个场景抽取 1 至 8 个发射机，各自拥有独立信道。}
- key: multibs
  status: simulate
  note: {en: 'Up to 4 stationary receivers observe the same scene, each writing its own IQ file.', zh: 最多 4 个静止接收机观测同一场景，各自写入独立的 IQ 文件。}
- {key: crossfreq, status: unknown}
- {key: near_field, status: unknown}
- key: high_mobility
  status: simulate
  note: {en: Transmitters move at constant velocity up to 30 m/s (108 km/h) in the default configuration; receivers are stationary., zh: 默认配置中发射机以恒定速度运动，最高 30 m/s（108 km/h）；接收机静止。}
- key: dynamic_blockage
  status: none
  note: {en: 'Only transmitters and receivers are configured as entities, and the OSM buildings are static.', zh: 仅发射机与接收机作为实体配置，OSM 建筑为静态。}
- key: reflection
  status: simulate
  note: {en: SBR ray tracing uses up to 3 reflections; the traced paths are not saved., zh: SBR 射线追踪最多计算 3 次反射；追踪路径不予保存。}
- key: diffraction
  status: none
  note: {en: Diffraction is disabled (MaxNumDiffractions = 0)., zh: 绕射已关闭（MaxNumDiffractions = 0）。}
- {key: scattering, status: unknown}
- {key: transmission, status: unknown}
- {key: polarization, status: unknown}
- key: em_field
  status: none
  note: {en: The outputs are IQ and annotations; the annotations hold path loss in dB and no field components., zh: 输出为 IQ 与标注；标注中仅有以 dB 表示的路径损耗，不含场分量。}
