overview: {en: 'HisarMod2019.1 is a synthetic dataset of 780,000 I/Q signals, generated in MATLAB 2017a and released on IEEE DataPort under CC BY 4.0, with the paper on arXiv as 1911.04970. The authors are Kürşat Tekbıyık, Cihat Keçeci, Ali Rıza Ekti, Ali Görçin and Güneş Karabulut Kurt, from Istanbul Technical University, Boğaziçi University, Balıkesir University and Yıldız Technical University. The dataset aims to increase the diversity of signal datasets, and the IEEE DataPort page reports acceptance at VTC2020-Spring. Each signal has 1,024 I/Q samples and belongs to one of 26 modulation types from five families: analog, FSK, PAM, PSK and QAM. The total of 780,000 equals 26 modulation types times 1,500 signals times 20 SNR levels, with 300 signals per channel condition and SNR level, and the SNR levels run from -20 dB to 18 dB. Each signal passes through one of five equally likely channel conditions: ideal AWGN, static, Rayleigh, Rician with K = 3, and Nakagami-m with m = 2.', zh: 'HisarMod2019.1
    是一个合成数据集，包含 780,000 条 I/Q 信号，由 MATLAB 2017a 生成，发布于 IEEE DataPort，采用 CC BY 4.0 许可，对应论文为 arXiv:1911.04970。作者为 Kürşat Tekbıyık、Cihat Keçeci、Ali Rıza Ekti、Ali Görçin 和 Güneş Karabulut Kurt，单位为伊斯坦布尔技术大学、博阿兹奇大学、巴勒克西尔大学和伊尔迪兹技术大学。作者称该数据集旨在提高信号数据集的多样性，IEEE DataPort 页面注明其已被 VTC2020-Spring 接收。每条信号包含 1,024 个 I/Q 采样点，属于五个族中的 26 种调制类型：模拟调制、FSK、PAM、PSK 和 QAM。780,000 条信号等于 26 种调制类型乘以 1,500 条信号再乘以 20 个 SNR 等级，每种信道条件和每个 SNR 等级各有 300 条；SNR 范围为 -20 dB 至 18 dB。每条信号经过五种等概率信道条件之一：理想 AWGN、静态、Rayleigh、K = 3 的 Rician 和 m = 2 的 Nakagami-m。'}
signal_details:
- signal: iq
  text: {en: 'Complex I/Q samples, 1,024 per signal, generated in MATLAB 2017a with an oversampling rate of 2 and raised cosine pulse shaping with roll-off factor 0.35.', zh: '复数 I/Q 采样，每条信号 1,024 个，由 MATLAB 2017a 生成，过采样率为 2，采用滚降系数为 0.35 的升余弦脉冲成形。'}
pipeline:
  summary: {en: 'A MATLAB 2017a generator draws random bits and symbols, maps them to 26 modulation types, passes them through five channel models, and sweeps 20 SNR levels.', zh: MATLAB 2017a 生成器产生随机比特与符号，映射为 26 种调制类型，经过五种信道模型处理，并遍历 20 个 SNR 等级。}
  stages:
  - title: {en: Bit and symbol generation, zh: 比特与符号生成}
    detail: {en: MATLAB 2017a creates random bit sequences and symbols for the modulation schemes in the dataset., zh: MATLAB 2017a 为数据集中的各调制方式生成随机比特序列和符号。}
    outputs:
    - {en: random bit sequences and symbols, zh: 随机比特序列与符号}
  - title: {en: Modulation and pulse shaping, zh: 调制与脉冲成形}
    detail: {en: 'Symbols are mapped to 26 modulation types in five families: analog, FSK, PAM, PSK and QAM. A raised cosine filter with roll-off factor 0.35 shapes the waveform at an oversampling rate of 2, and each signal has 1,024 I/Q samples.', zh: '符号被映射为五个族中的 26 种调制类型：模拟调制、FSK、PAM、PSK 和 QAM。滚降系数为 0.35 的升余弦滤波器以过采样率 2 对波形成形，每条信号包含 1,024 个 I/Q 采样点。'}
    inputs:
    - {en: symbols, zh: 符号}
    outputs:
    - {en: '1,024-sample I/Q signals', zh: '1,024 点 I/Q 信号'}
  - title: {en: Channel application, zh: 信道施加}
    detail: {en: 'Each signal passes through one of five equally likely conditions: ideal (AWGN only), static (coefficients drawn once and held constant), Rayleigh (for NLOS), Rician with K = 3, and Nakagami-m with m = 2. The number of multipath taps is 4 or 6, equally likely, taken from ITU-R M.1225.', zh: 每条信号经过五种等概率条件之一：理想信道（仅 AWGN）、静态信道（系数一次抽取后保持不变）、Rayleigh（用于 NLOS）、K = 3 的 Rician 以及 m = 2 的 Nakagami-m。多径抽头数为 4 或 6，等概率，取自 ITU-R M.1225。}
    inputs:
    - {en: I/Q signals, zh: I/Q 信号}
    outputs:
    - {en: faded I/Q signals, zh: 经衰落的 I/Q 信号}
  - title: {en: SNR sweep and packaging, zh: SNR 扫描与打包}
    detail: {en: 'Signals are generated at 20 SNR levels from -20 dB to 18 dB, with 300 signals per channel condition and SNR level. The signals are stored as CSV files in a ZIP archive of 5.13 GB.', zh: 信号在 -20 dB 至 18 dB 的 20 个 SNR 等级下生成，每种信道条件和每个 SNR 等级各 300 条。信号以 CSV 文件形式存储于 5.13 GB 的 ZIP 压缩包中。}
    inputs:
    - {en: faded I/Q signals, zh: 经衰落的 I/Q 信号}
    - {en: 20 SNR levels, zh: 20 个 SNR 等级}
    outputs:
    - {en: HisarMod2019.1.zip, zh: HisarMod2019.1.zip}
