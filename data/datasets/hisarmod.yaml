overview: {en: 'HisarMod2019.1 is a synthetic dataset of 780,000 I/Q signals, generated in MATLAB 2017a and released on IEEE DataPort under CC BY 4.0, with the paper on arXiv as 1911.04970. The authors are Kürşat Tekbıyık, Cihat Keçeci, Ali Rıza Ekti, Ali Görçin and Güneş Karabulut Kurt, from TÜBİTAK BİLGEM, Istanbul Technical University, Boğaziçi University, Balıkesir University and Yıldız Technical University. The dataset aims to increase the diversity of signal datasets, and the IEEE DataPort page reports acceptance at VTC2020-Spring. Each signal has 1,024 I/Q samples and belongs to one of 26 modulation types from five families: analog, FSK, PAM, PSK and QAM. The total of 780,000 equals 26 modulation types times 20 SNR levels times 1,500 signals per modulation type and SNR level, with SNR from -20 dB to 18 dB. Each modulation type and SNR level has 300 signals for each of five equally likely channel conditions: ideal AWGN, static, Rayleigh, Rician with K = 3, and Nakagami-m with m = 2.',
  zh: 'HisarMod2019.1 是一个合成数据集，包含 780,000 条 I/Q 信号，由 MATLAB 2017a 生成，发布于 IEEE DataPort，采用 CC BY 4.0 许可，对应论文为 arXiv:1911.04970。作者为 Kürşat Tekbıyık、Cihat Keçeci、Ali Rıza Ekti、Ali Görçin 和 Güneş Karabulut Kurt，单位包括 TÜBİTAK BİLGEM、伊斯坦布尔技术大学、博阿兹奇大学、巴勒克西尔大学和伊尔迪兹技术大学。作者称该数据集旨在提高信号数据集的多样性，IEEE DataPort 页面注明其已被 VTC2020-Spring 接收。每条信号包含 1,024 个 I/Q 采样点，属于模拟、FSK、PAM、PSK 和 QAM 五个族中的 26 种调制类型。780,000 条信号等于 26 种调制类型、20 个 SNR 等级与每个调制类型和 SNR 等级 1,500 条信号的乘积，SNR 范围为 -20 dB 至 18 dB。每个调制类型和 SNR 等级下，五种等概率信道条件各有 300 条信号：理想 AWGN、静态、Rayleigh、K = 3 的 Rician 以及 m = 2 的 Nakagami-m。'}
signal_details:
- signal: iq
  text: {en: 'Complex I/Q samples, 1,024 per signal, generated in MATLAB 2017a with an oversampling rate of 2 and raised cosine pulse shaping with roll-off factor 0.35.', zh: '复数 I/Q 采样，每条信号 1,024 个，由 MATLAB 2017a 生成，过采样率为 2，采用滚降系数为 0.35 的升余弦脉冲成形。'}
pipeline:
  summary: {en: 'A MATLAB 2017a generator draws random bits and symbols, maps them to 26 modulation types, passes them through five channel models, and sweeps 20 SNR levels.', zh: MATLAB 2017a 生成器产生随机比特与符号，映射为 26 种调制类型，经过五种信道模型处理，并遍历 20 个 SNR 等级。}
  stages:
  - title: {en: Bit and symbol generation, zh: 比特与符号生成}
    detail: {en: MATLAB 2017a creates random bit sequences and symbols for the modulation schemes in the dataset., zh: MATLAB 2017a 为数据集中的各调制方式生成随机比特序列和符号。}
    outputs:
    - {en: random bit sequences and symbols, zh: 随机比特序列与符号}
  - title: {en: Modulation and pulse shaping, zh: 调制与脉冲成形}
    detail: {en: 'Symbols are mapped to 26 modulation types in five families: analog, FSK, PAM, PSK and QAM. A raised cosine filter with roll-off factor 0.35 shapes the waveform at an oversampling rate of 2, and each signal has 1,024 I/Q samples.', zh: '符号被映射为五个族中的 26 种调制类型：模拟调制、FSK、PAM、PSK 和 QAM。滚降系数为 0.35 的升余弦滤波器以过采样率 2 对波形成形，每条信号包含 1,024 个 I/Q 采样点。'}
    inputs:
    - {en: symbols, zh: 符号}
    outputs:
    - {en: '1,024-sample I/Q signals', zh: '1,024 点 I/Q 信号'}
  - title: {en: Channel application, zh: 信道施加}
    detail: {en: 'Each signal passes through one of five equally likely conditions: ideal (AWGN only), static (coefficients drawn once and held constant), Rayleigh (for NLOS), Rician with K = 3, and Nakagami-m with m = 2. The number of multipath taps is 4 or 6, equally likely, taken from ITU-R M.1225.', zh: 每条信号经过五种等概率条件之一：理想信道（仅 AWGN）、静态信道（系数一次抽取后保持不变）、Rayleigh（用于 NLOS）、K = 3 的 Rician 以及 m = 2 的 Nakagami-m。多径抽头数为 4 或 6，等概率，取自 ITU-R M.1225。}
    inputs:
    - {en: I/Q signals, zh: I/Q 信号}
    outputs:
    - {en: faded I/Q signals, zh: 经衰落的 I/Q 信号}
  - title: {en: SNR sweep and packaging, zh: SNR 扫描与打包}
    detail: {en: 'Signals are generated at 20 SNR levels from -20 dB to 18 dB, with 300 signals for each modulation type, channel condition and SNR level. The signals are stored as CSV files in a ZIP archive of 5.13 GB.', zh: 信号在 -20 dB 至 18 dB 的 20 个 SNR 等级下生成，每种调制类型、信道条件和 SNR 等级各 300 条。信号以 CSV 文件形式存储于 5.13 GB 的 ZIP 压缩包中。}
    inputs:
    - {en: faded I/Q signals, zh: 经衰落的 I/Q 信号}
    - {en: 20 SNR levels, zh: 20 个 SNR 等级}
    outputs:
    - {en: HisarMod2019.1.zip, zh: HisarMod2019.1.zip}
facts:
- label: {en: Classification target, zh: 分类目标}
  text: {en: 'The paper''s CNN classifies the five modulation families (analog, FSK, PAM, PSK, QAM) rather than the 26 individual modulation types.', zh: 论文中的 CNN 对五个调制族（模拟、FSK、PAM、PSK、QAM）进行分类，而非 26 种具体调制类型。}
- label: {en: Data split, zh: 数据划分}
  text: {en: 'In its experiments, the paper splits the data 8/15 for training, 2/15 for validation and 5/15 for testing.', zh: 论文实验中将数据按 8/15 用于训练、2/15 用于验证、5/15 用于测试进行划分。}
capabilities:
- key: csi
  status: simulate
  note: {en: 'Channel coefficients are drawn inside the MATLAB 2017a generator and are not described as released, so obtaining them requires rerunning the generator.', zh: 信道系数在 MATLAB 2017a 生成器内部抽取，来源未说明随数据发布，因此需重新运行生成器才能获得。}
- key: cir
  status: simulate
  note: {en: The 4 or 6 multipath taps per signal (from ITU-R M.1225) are produced by the generator and are not described as released., zh: 每条信号的 4 或 6 个多径抽头（取自 ITU-R M.1225）由生成器产生，来源未说明随数据发布。}
- key: paths
  status: simulate
  note: {en: 'Multipath taps are generated internally, and no per-path delays, angles or labels are described; rerunning the generator is required.', zh: 多径抽头在内部生成，来源未描述逐径时延、角度或标签；需重新运行生成器。}
- key: interaction
  status: none
  note: {en: 'The channels are statistical models (AWGN, static, Rayleigh, Rician, Nakagami-m), so there are no per-path surfaces or interaction points.', zh: 信道为统计模型（AWGN、静态、Rayleigh、Rician、Nakagami-m），不存在逐径的散射体或交互点。}
- key: power
  status: derivable
  note: {en: 'Per-signal power can be computed from the 1,024 I/Q samples of each signal.', zh: '每条信号的功率可由其 1,024 个 I/Q 采样点计算得到。'}
- key: iq
  status: provided
  note: {en: '1,024 complex I/Q samples per signal, oversampling rate 2, raised cosine pulse shaping with roll-off 0.35, 780,000 signals in total.', zh: '每条信号 1,024 个复数 I/Q 采样点，过采样率 2，升余弦脉冲成形，滚降系数 0.35，共 780,000 条信号。'}
- key: beam_labels
