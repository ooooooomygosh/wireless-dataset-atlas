summary: {en: '780,000 MATLAB-generated I/Q signals of 1,024 samples each, covering 26 analog, FSK, PAM, PSK and QAM modulation types at 20 SNR levels from -20 to 18 dB. The signals pass through five wireless channel conditions.', zh: '由 MATLAB 生成的 780,000 条 I/Q 信号，每条包含 1,024 个采样点，涵盖模拟调制、FSK、PAM、PSK 和 QAM 等 26 种调制类型，信噪比为 -20 至 18 dB（共 20 个等级）。信号经过五种无线信道条件。'}
