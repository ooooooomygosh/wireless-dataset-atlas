  date: 2021-10
  summary: {en: IEEE Access paper that the release note says describes and uses these LoRa datasets. The release note does not give a date for the first public release of the data., zh: 发布说明称，这些 LoRa 数据集在该 IEEE Access 论文中有所描述和使用。发布说明未给出数据首次公开发布的日期。}
