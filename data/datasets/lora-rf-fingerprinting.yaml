summary: {en: 'Time-domain I/Q samples and FFT representations of LoRa transmissions from 25 IoT devices, received by USRP B210 receivers at 915 MHz and sampled at 1 MS/s. The setups cover indoor and outdoor scenarios with different days, distances, LoRa configurations, locations and receivers.', zh: 25 台 IoT 设备 LoRa 传输的时域 I/Q 采样与 FFT 表示，由 USRP B210 接收机在 915 MHz 下以 1 MS/s 采样。数据覆盖室内与室外场景，并包含不同日期、距离、LoRa 配置、地点和接收机等设置。}
