summary: {en: 'Real 5G user traffic captured in residential, campus and driving scenarios and replayed on the Colosseum RF emulator in an srsRAN O-RAN system, totalling 447 minutes. gNB KPIs are polled over E2 every 250 ms, with 31 KPIs available and 17 used by the classifier.', zh: 在住宅、校园和驾车场景中采集的真实 5G 用户流量，在 Colosseum RF 仿真器中的 srsRAN O-RAN 系统内回放，总时长 447 分钟。gNB KPI 通过 E2 接口每 250 ms 轮询一次，共 31 项可用 KPI，其中 17 项用于分类器。}
