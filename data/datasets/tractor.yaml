versions:
- version: v2
  date: '2025-03-11'
  summary: {en: 'arXiv v2, retitled ''From Classification to Optimization: Slicing and Resource Management with TRACTOR''; adds a reinforcement-learning PRB assignment study (learned policy score 0.631 against 0.609 for an expert policy and 0.588 for a random baseline) and reports up to 99% offline and 92% online accuracy for slice classification.', zh: 'arXiv v2，标题改为 ''From Classification to Optimization: Slicing and Resource Management with TRACTOR''；新增基于强化学习的 PRB 分配研究（学习策略得分 0.631，专家策略为 0.609，随机基线为 0.588），并报告切片分类离线准确率最高 99%、在线准确率 92%。'}
  url: https://arxiv.org/abs/2312.07896v2
- version: v1
  date: '2023-12-13'
  summary: {en: 'arXiv v1, ''TRACTOR: Traffic Analysis and Classification Tool for Open RAN'': the real 5G traffic capture, its Colosseum replay with KPI logging, a CNN traffic-slice classifier (over 95% offline and 92% online accuracy) and the open-source toolchain.', zh: 'arXiv v1，''TRACTOR: Traffic Analysis and Classification Tool for Open RAN''：真实 5G 流量采集、在 Colosseum 上的回放与 KPI 记录、基于 CNN 的流量切片分类器（离线准确率超过 95%，在线准确率 92%），以及开源工具链。'}
  url: https://arxiv.org/abs/2312.07896v1
