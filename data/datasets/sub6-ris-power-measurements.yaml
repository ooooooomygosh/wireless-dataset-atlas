overview: {en: 'This dataset contains received-power measurements of an OFDM link reflected by a reconfigurable intelligent surface (RIS) prototype at 5.3 GHz. The RIS is a 10 × 10 array of unit cells that uses RF switches for phase shifting, and the measurements were taken in a 5 × 8 m anechoic chamber at TU Darmstadt, where the channel is line-of-sight only. The work comes from NEC Laboratories Europe, TU Darmstadt and i2CAT Foundation and was posted as an arXiv preprint in April 2024 (arXiv:2404.01796). The recorded quantity is the reference signal received power (RSRP), averaged over the signal bandwidth, at the receiver. The data form two sets: the beampattern set covers 1891 main-beam codebook configurations, with a turntable that rotates from -90° to 90°, and the absorption-mode set varies the number of active RIS elements over 4, 16, 64 and 100. The authors use the data to learn the radiation pattern, to model half-power beamwidth against element count, and to estimate angles of
    arrival and departure. Each matrix cell holds one averaged power value in dBm, so the release contains no channel responses or IQ samples.', zh: '该数据集包含 5.3 GHz 可重构智能表面（RIS）原型对 OFDM 链路反射后的接收功率测量结果。RIS 为 10 × 10 单元阵列，相移由 RF 开关实现。测量在 TU Darmstadt 的 5 × 8 m 消声暗室中进行，信道仅为视距（LOS）。工作由 NEC Laboratories Europe、TU Darmstadt 和 i2CAT Foundation 完成，于 2024 年 4 月以 arXiv 预印本形式发布（arXiv:2404.01796）。记录的量是接收端的参考信号接收功率（RSRP），在信号带宽上取平均。数据分为两组：波束方向图组包含 1891 个主波束码本配置，转台在 -90° 至 90° 之间旋转；吸收模式组改变有效 RIS 单元数，取值为 4、16、64 和 100。作者用这些数据学习辐射方向图、拟合半功率波束宽度与单元数的关系，并估计到达角和离开角。每个矩阵单元仅存放一个以 dBm 为单位的平均功率值，因此发布内容不含信道响应或 IQ 采样。'}
signal_details:
- signal: beam-power
  text: {en: 'Reference signal received power (RSRP) in dBm, averaged over the signal bandwidth and recorded at the receiver. The OFDM signal is QPSK-modulated, has a 5 MHz bandwidth and LTE-like numerology, with -30 dBm transmit power per subcarrier. The noise floor is -90 dBm. The beampattern codebook covers azimuth -90° to 90° and elevation -45° to 45° in 3° steps, for transmitter angles of 20° and 90°. The absorption-mode measurements use 4, 16, 64 or 100 active elements.', zh: 以 dBm 为单位的参考信号接收功率（RSRP），在信号带宽上取平均，在接收端记录。OFDM 信号采用 QPSK 调制，带宽 5 MHz，采用类 LTE numerology，每子载波发射功率为 -30 dBm。噪声基底为 -90 dBm。波束方向图码本覆盖方位角 -90° 至 90°、俯仰角 -45° 至 45°，步长 3°，发射端角度分别为 20° 和 90°。吸收模式测量使用 4、16、64 或 100 个有效单元。}
pipeline:
  summary: {en: 'Measurements step through RIS configurations and the turntable angle in an anechoic chamber, and a USRP B210 receiver running srsRAN logs RSRP.', zh: 测量在消声暗室中逐一切换 RIS 配置并旋转转台，运行 srsRAN 的 USRP B210 接收机记录 RSRP。}
  stages:
  - title: {en: RIS prototype and configuration, zh: RIS 原型与配置}
    detail: {en: 'A 10 × 10 grid of 100 patch antennas on a 0.6 mm thick PCB, spaced at λ/2, operates at 5.3 GHz with 100 MHz bandwidth. Phase shifting uses RF switches with 8 outputs feeding delay lines, and configuring one unit cell takes 0.35 ms at 62 mW. The RIS sits on a vertical pole on a turntable.', zh: 由 100 个贴片天线组成的 10 × 10 网格印制在 0.6 mm 厚的 PCB 上，间距为 λ/2，工作频率 5.3 GHz，带宽 100 MHz。相移由 RF 开关实现，开关有 8 个输出并接延迟线，配置一个单元需要 0.35 ms，功耗 62 mW。RIS 竖直安装在转台上的立杆上。}
    inputs:
    - {en: RIS configuration codebook, zh: RIS 配置码本}
    outputs:
    - {en: reflected OFDM link, zh: 经 RIS 反射的 OFDM 链路}
  - title: {en: OFDM transmit and receive chain, zh: OFDM 收发链路}
    detail: {en: 'One USRP B210 running srsRAN generates a continuous QPSK OFDM signal with 5 MHz bandwidth at -30 dBm per subcarrier, and a second B210 running srsRAN samples the received signal. Two TBMA4 double-ridged horn antennas (1–8 GHz, 13.5 dBi gain, 50 Ω) are used. The TX is 1.1 m from the top-left element of the RIS at azimuth 90° and elevation -33°, and the RX is 6.3 m from it at azimuth 90° and elevation -3°.', zh: 一台运行 srsRAN 的 USRP B210 生成连续的 QPSK OFDM 信号，带宽 5 MHz，每子载波 -30 dBm；另一台 B210 运行 srsRAN 对接收信号采样。使用两个 TBMA4 双脊喇叭天线（1–8 GHz，13.5 dBi 增益，50 Ω）。发射端距 RIS 左上角单元 1.1 m，方位角 90°、俯仰角 -33°；接收端距其 6.3 m，方位角 90°、俯仰角 -3°。}
    inputs:
    - {en: 'QPSK OFDM signal, 5 MHz', zh: QPSK OFDM 信号，5 MHz}
    outputs:
    - {en: received OFDM signal at RX, zh: 接收端 OFDM 信号}
  - title: {en: Configuration and angle sweeps, zh: 配置与角度扫描}
    detail: {en: 'The beampattern set uses a codebook of 1891 main-beam configurations, with the turntable rotating from -90° to 90° in 3° steps. The measurement is repeated for transmitter angles θt = 20° and 90°, and the complete characterization took 9 hours. The absorption-mode set uses square subarrays of 4, 16, 64 and 100 active elements (2 x 2 to 10 x 10) in the top-left of the RIS, with the turntable fixed and TX, RX and RIS aligned at θr = 0°.', zh: 波束方向图组使用 1891 个主波束码本配置，转台以 3° 步进从 -90° 旋转到 90°。测量在发射端角度 θt = 20° 和 90° 下重复进行，完整表征共耗时 9 小时。吸收模式组在 RIS 左上角使用 4、16、64 和 100 个有效单元的方形子阵列（2 x 2 至 10 x 10），转台固定，发射端、接收端和 RIS 对准，θr = 0°。}
    inputs:
    - {en: codebook configurations, zh: 码本配置}
    - {en: turntable angle θr, zh: 转台角度 θr}
  - title: {en: RSRP logging, zh: RSRP 记录}
    detail: {en: 'The receiver software is modified to dump RSRP values to a file. The final campaign takes 30 samples per measurement, chosen to keep the average error below 1%. An earlier test covered 3721 configurations with 80 samples each.', zh: 接收端软件经过修改，将 RSRP 数值写入文件。最终测量每次取 30 个样本，选取该数量是为了使平均误差低于 1%。早期测试覆盖 3721 个配置，每个配置取 80 个样本。}
    outputs:
    - {en: RSRP sample files, zh: RSRP 采样文件}
  - title: {en: Smoothing and matrix output, zh: 平滑与矩阵输出}
    detail: {en: 'The 30 samples are averaged per configuration and rotation angle and stored in dBm. In the beampattern data, the values are smoothed with a Savitzky–Golay filter (window 7, order 4). In the beampattern files, rows are beam directions (θn, ϕn) and columns are turntable angles θr, with one file per θt; the absorption-mode data are indexed by the number of active elements N (4, 16, 64, 100).', zh: '每个配置与转台角度下的 30 个样本取平均后以 dBm 存储。在波束方向图数据中，数值经 Savitzky–Golay 滤波器平滑（窗口 7，阶数 4）。在波束方向图文件中，行为波束方向（θn, ϕn），列为转台角度 θr，每个 θt 一个文件；吸收模式数据按有效单元数 N（4、16、64、100）索引。'}
    inputs:
    - {en: RSRP sample files, zh: RSRP 采样文件}
    outputs:
    - {en: beampattern matrix (dBm), zh: 波束方向图矩阵（dBm）}
    - {en: absorption-mode matrix (dBm), zh: 吸收模式矩阵（dBm）}
antennas: {tx: 1, rx: 1}
samples: 30 RSRP samples averaged per cell; beampattern set 1891 configurations x 61 turntable angles for each of 2 TX angles; absorption set with 4, 16, 64 and 100 active elements
mobility: quasi-static (anechoic chamber)
facts:
- label: {en: Angle convention, zh: 角度约定}
  text: {en: '(θn, ϕn) is the main-beam direction in azimuth and elevation. θr is the turntable rotation relative to the RX, in 3° steps from -90° to 90°.', zh: '(θn, ϕn) 为主波束方向的方位角与俯仰角。θr 为转台相对接收端的旋转角，以 3° 步进，范围为 -90° 至 90°。'}
- label: {en: Expected elevation, zh: 预期俯仰角}
  text: {en: 'With the TX at elevation -33° and the RX at -3°, the authors expect the RSRP peak at elevation ϕn = -30°, which means the RIS steers its main beam toward the ceiling.', zh: 发射端俯仰角为 -33°，接收端为 -3°，作者预期 RSRP 峰值出现在俯仰角 ϕn = -30° 处，即 RIS 将主波束指向天花板方向。}
- label: {en: Noise floor, zh: 噪声基底}
  text: {en: The -90 dBm noise floor was measured by recording RSRP with the RIS unplugged., zh: -90 dBm 的噪声基底是在 RIS 断开电源时记录 RSRP 得到的。}
- label: {en: Absorption state, zh: 吸收状态}
  text: {en: 'In absorption mode, a unit cell routes the incoming signal to a 50 Ω load instead of reflecting it, so that cell does not contribute to the reflection.', zh: 吸收模式下，单元将入射信号导向 50 Ω 负载而非反射，因此该单元不参与反射。}
technical_notes:
- {en: 'Each unit cell has 8 RF-switch outputs, which give 3-bit phase granularity through the delay lines.', zh: 每个单元有 8 个 RF 开关输出，经延迟线可实现 3 比特相位分辨率。}
limitations:
- {en: 'The TX is 1.1 m from the RIS, below the 6.5 m far-field threshold that the authors compute for the 0.43 m RIS diagonal at 5.3 GHz, and above the 0.73 m reactive near-field threshold.', zh: 发射端距 RIS 1.1 m，低于作者按 5.3 GHz 下 0.43 m RIS 对角线计算出的 6.5 m 远场门限，高于 0.73 m 的无功近场门限。}
- {en: 'The chamber channel is pure line-of-sight and quasi-static, so the data contain no multipath or mobility effects.', zh: 暗室信道为纯视距且准静态，因此数据不包含多径或移动影响。}
- {en: 'The release stores averaged power values only, not the per-sample RSRP dumps.', zh: 发布内容仅包含平均功率值，不包含逐样本的 RSRP 原始记录。}
- {en: 'The measured half-power beamwidth deviates from the CST simulation, which the authors attribute to hardware non-idealities and measurement uncertainty.', zh: 测得的半功率波束宽度与 CST 仿真存在偏差，作者将其归因于硬件非理想性与测量不确定度。}
usage:
- {en: 'The authors trained a 3-layer DNN with 16 neurons per layer on beam direction and turntable angle to predict RSRP, with normalized MSE of 0.01% on training and 0.03% on validation.', zh: 作者用 3 层、每层 16 个神经元的 DNN，以波束方向与转台角度预测 RSRP，训练集归一化 MSE 为 0.01%，验证集为 0.03%。}
- {en: 'The measured half-power beamwidth against the number of active elements fits a·exp(b·x)+c with a = 70.96, b = 0.27 and c = 3.99, where x is the RIS size.', zh: 测得的半功率波束宽度与有效单元数的关系可用 a·exp(b·x)+c 拟合，其中 a = 70.96，b = 0.27，c = 3.99，x 为 RIS 尺寸。}
- {en: 'For angle of arrival or departure, take the beam direction with maximum power in each turntable-angle column and map it to a codebook entry.', zh: 估计到达角或离开角时，取每个转台角度列中功率最大的波束方向，并映射到码本条目。}
