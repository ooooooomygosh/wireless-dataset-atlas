summary: {en: 'Received-power (RSRP) measurements of an OFDM link through a 10 × 10-element RIS prototype at 5.3 GHz, collected in a 5 × 8 m anechoic chamber. The beampattern set sweeps 1891 main-beam codebook configurations while a turntable rotates from -90° to 90°, and the absorption-mode set varies the number of active RIS elements.', zh: 在 5 × 8 m 消声暗室中，通过 10 × 10 单元 RIS 原型的 OFDM 链路，于 5.3 GHz 测得接收功率（RSRP）。波束方向图数据集包含 1891 个主波束码本配置，转台在 -90° 至 90° 之间旋转；吸收模式数据集则改变有效 RIS 单元数量。}
