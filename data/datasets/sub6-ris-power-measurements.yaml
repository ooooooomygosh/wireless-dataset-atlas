  status: provided
  note: {en: 'RSRP in dBm, averaged over 30 samples per cell, in beampattern and absorption-mode matrices.', zh: 以 dBm 为单位的 RSRP，每个单元由 30 个样本平均，分为波束方向图与吸收模式两组矩阵。}
