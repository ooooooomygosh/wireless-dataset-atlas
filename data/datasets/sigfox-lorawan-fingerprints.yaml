  date: '2020-06-23'
  summary: {en: 'Adds lorawan_antwerp_gateway_locations.json.txt, which gives the coordinates of the LoRaWAN gateways in Antwerp.', zh: 新增 lorawan_antwerp_gateway_locations.json.txt，给出安特卫普 LoRaWAN 网关的坐标。}
  url: https://zenodo.org/record/3904158
- version: '1.2'
  date: '2019-07-19'
  summary: {en: 'Updates the LoRaWAN set only, collected one year after the previous set. Adds four gateways (BS 69 to BS 72), metadata from all receiving gateways per message, nanosecond timestamps from some gateways, and a JSON file. The Sigfox files are unchanged.', zh: 仅更新 LoRaWAN 数据集，采集时间为上一版数据之后一年。新增四个网关（BS 69 至 BS 72），每条报文包含所有接收网关的元数据，部分网关提供纳秒级时间戳，并新增 JSON 文件。Sigfox 文件未变。}
