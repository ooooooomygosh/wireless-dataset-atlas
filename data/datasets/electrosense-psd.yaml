overview: {en: 'ElectroSense PSD Spectrum Dataset is a measured power spectral density (PSD) dataset from IMDEA Networks Institute, released on Zenodo in January 2023 (DOI 10.5281/zenodo.7521246). The spectra come from 47 low-cost RTL-SDR receivers deployed across Europe as part of the ElectroSense crowdsensing platform. At each site, the RTL-SDR swept 24 MHz to 1.7 GHz in 2 MHz chunks for 6 hours. Specific portions of licensed bands, such as the FM bands, were filtered from the scans and labeled. The data are NumPy files organized in one folder per site and packed in spectrum_bands.tar.gz (1.7 GB). The archive contains the labeled spectrum portions rather than the full sweeps. The dataset supports the paper A Framework for Wireless Technology Classification using Crowdsensing Platforms (IEEE INFOCOM 2023), which classifies the technology of a transmitter from single PSD measurements covering at most 2 MHz.', zh: ElectroSense PSD Spectrum Dataset 是 IMDEA Networks Institute 制作的实测功率谱密度（PSD）数据集，于
    2023 年 1 月在 Zenodo 发布（DOI 10.5281/zenodo.7521246）。频谱数据来自欧洲各地部署的 47 个低成本 RTL-SDR 接收机，这些接收机是 ElectroSense 众包平台的一部分。在每个站点，RTL-SDR 以 2 MHz 分段对 24 MHz 至 1.7 GHz 进行扫描，持续 6 小时。授权频段的特定部分（如 FM 频段）从扫描数据中筛选并标注。数据为 NumPy 文件，每个站点一个文件夹，打包在 spectrum_bands.tar.gz（1.7 GB）中。压缩包包含标注后的频谱片段，而非完整扫描数据。该数据集支持论文 A Framework for Wireless Technology Classification using Crowdsensing Platforms（IEEE INFOCOM 2023），该论文基于不超过 2 MHz 带宽的单次 PSD 测量对发射机的无线技术进行分类。}
signal_details:
- signal: spectrum
  text: {en: 'Power spectral density arrays measured by RTL-SDR sweeps from 24 MHz to 1.7 GHz, taken in 2 MHz chunks. Licensed-band portions are stored as labeled NumPy arrays. Six hours of full-spectrum scanning were collected per site.', zh: 由 RTL-SDR 以 2 MHz 分段扫描 24 MHz 至 1.7 GHz 得到的功率谱密度（PSD）数组。授权频段的特定部分以带标签的 NumPy 数组保存。每个站点采集 6 小时全频谱扫描数据。}
pipeline:
  summary: {en: 'RTL-SDR receivers at 47 sensors sweep 24 MHz to 1.7 GHz, and the licensed-band PSD portions are labeled and packed as NumPy files per site.', zh: 分布于 47 个传感器的 RTL-SDR 接收机对 24 MHz 至 1.7 GHz 进行扫描，授权频段的 PSD 片段经标注后，按站点打包为 NumPy 文件。}
  stages:
  - title: {en: Sensor platform, zh: 传感器平台}
    detail: {en: Each ElectroSense sensor uses a low-cost RTL-SDR receiver as its radio front end. The 47 sensors are deployed across Europe and feed PSD data to the platform backend., zh: 每个 ElectroSense 传感器以低成本 RTL-SDR 接收机作为射频前端。47 个传感器部署在欧洲各地，并将 PSD 数据送入平台后端。}
    inputs:
    - {en: RF spectrum, zh: 射频频谱}
    outputs:
    - {en: PSD measurements, zh: PSD 测量数据}
  - title: {en: Full-spectrum sweep, zh: 全频谱扫描}
    detail: {en: The RTL-SDR hops across 24 MHz to 1.7 GHz in 2 MHz chunks. Each site collects 6 hours of full-spectrum scanning., zh: RTL-SDR 以 2 MHz 分段在 24 MHz 至 1.7 GHz 之间跳频扫描。每个站点采集 6 小时全频谱扫描数据。}
    inputs:
    - {en: 'RF spectrum, 24 MHz to 1.7 GHz', zh: 24 MHz 至 1.7 GHz 射频频谱}
    outputs:
    - {en: full-spectrum PSD scans, zh: 全频谱 PSD 扫描数据}
  - title: {en: Licensed-band filtering and labeling, zh: 授权频段筛选与标注}
    detail: {en: 'Specific portions of the licensed bands, such as the FM bands, are filtered from the scans and labeled.', zh: 从扫描数据中筛选授权频段的特定部分（如 FM 频段）并进行标注。}
    inputs:
    - {en: full-spectrum PSD scans, zh: 全频谱 PSD 扫描数据}
    outputs:
    - {en: labeled band PSD arrays, zh: 带标签的频段 PSD 数组}
  - title: {en: Packaging, zh: 打包}
    detail: {en: 'The labeled portions are stored as NumPy files, one folder per site. The folders are packed in spectrum_bands.tar.gz, 1.7 GB.', zh: 标注后的片段以 NumPy 文件保存，每个站点一个文件夹。文件夹打包在 spectrum_bands.tar.gz 中，大小为 1.7 GB。}
    inputs:
    - {en: labeled band PSD arrays, zh: 带标签的频段 PSD 数组}
    outputs:
    - {en: spectrum_bands.tar.gz, zh: spectrum_bands.tar.gz}
facts:
- label: {en: Licence, zh: 许可}
  text: {en: 'The dataset licence allows redistribution if the copyright notice and the Zenodo citation are kept. The data are provided as is, without warranty.', zh: 数据许可允许再分发，但须保留版权声明和 Zenodo 引用。数据按原样提供，不附带任何担保。}
- label: {en: Companion code, zh: 配套代码}
  text: {en: The companion GitHub repository is released under the BSD 3-Clause licence and contains a Flask backend and a Docker setup for the classification framework., zh: 配套 GitHub 仓库采用 BSD 3-Clause 许可，包含分类框架的 Flask 后端和 Docker 配置。}
- label: {en: Reported accuracy, zh: 报告的准确率}
  text: {en: 'The paper reports an average classification accuracy close to 94.25% on its testing dataset, with a maximum latency of 3.4 seconds when integrated into the backend of a crowdsensing network.', zh: 论文报告测试数据集上的平均分类准确率接近 94.25%，集成到众包网络后端时的最大延迟为 3.4 秒。}
