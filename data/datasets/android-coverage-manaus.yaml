- {key: near_field, status: unknown}
- {key: high_mobility, status: unknown}
- {key: dynamic_blockage, status: unknown}
- {key: reflection, status: provided, note: {en: Inherent in the measurement., zh: 实测数据中固有存在。}}
- {key: diffraction, status: provided, note: {en: Inherent in the measurement., zh: 实测数据中固有存在。}}
- {key: scattering, status: provided, note: {en: Inherent in the measurement., zh: 实测数据中固有存在。}}
- {key: transmission, status: provided, note: {en: Inherent in the measurement., zh: 实测数据中固有存在。}}
- {key: polarization, status: unknown}
- {key: em_field, status: none, note: {en: Only received power and quality indicators are released., zh: 仅发布接收功率与质量指标。}}
