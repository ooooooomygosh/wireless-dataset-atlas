limitations:
- {en: 'Samples follow the rivers and roads used to reach the selected sites, so areas away from these routes are not sampled.', zh: '样本沿通往选定地点的河流与道路采集，远离这些路线的区域没有样本。'}
- {en: 'Device models and operators are anonymised as numbers, so brands and operators cannot be identified.', zh: '设备型号与运营商已匿名化为编号，无法识别品牌与运营商。'}
- {en: 'The data page describes per-device CSV files named by device ID and timestamp, while the paper describes files split by city and region. The file layout was not checked against the download.', zh: '数据页描述的是以设备编号与时间戳命名的按设备 CSV 文件，论文描述的则是按城市与区域拆分的文件。文件结构未与下载内容核对。'}
