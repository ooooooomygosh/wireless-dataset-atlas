- label: {en: Native outputs, zh: 原生输出}
  text: {en: '• Near-field CSI and Top-5 labels, position/mode/LoS

      • Separately packaged, sample-aligned RGB and geometric point clouds', zh: '• 近场CSI和Top-5标签、位置/模式/LoS

      • 单独打包且按样本对齐的RGB和几何点云'}
- label: {en: Derived outputs, zh: 派生输出}
