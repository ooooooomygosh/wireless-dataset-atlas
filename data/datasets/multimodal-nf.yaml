pipeline:
  summary: {en: 'Each city scene drives four outputs: a near-field channel per frame, a BS-side RGB render, a LiDAR scan and the UAV trajectory. The packing scripts match RGB and LiDAR frames to channel samples by trajectory ID and frame index and write them to HDF5.', zh: 每个城市场景驱动四类输出：逐帧近场信道、基站侧 RGB 渲染图、LiDAR 扫描以及无人机轨迹。打包脚本按轨迹 ID 与帧号将 RGB 与 LiDAR 帧匹配到信道样本，并写入 HDF5。}
  scope: {en: 'The public generator (scene notebook, channel_generation.py and the two packing scripts), the README, the Hugging Face file listing and the paper.', zh: 公开生成器（场景笔记本、channel_generation.py 及两个打包脚本）、README、Hugging Face 文件列表以及论文。}
  stages:
  - title: {en: Build the scene and UAV trajectories, zh: 构建场景与无人机轨迹}
    detail: {en: 'The scene notebook draws a random grid of roads and buildings with block widths of 15–35 m, street widths of 8–16 m and building heights of 20–60 m. It places the BS at (0, 0, 65) m and generates trajectories in 10 kinematic modes, with 20 frames at 0.1 s intervals. Each trajectory writes a uav_trajectory.csv file, and each frame writes a scene XML file and PLY meshes.', zh: '场景笔记本生成随机的网格状道路与建筑布局：街区宽 15–35 m，街道宽 8–16 m，建筑高 20–60 m。基站位于 (0, 0, 65) m，无人机按 10 种运动模式生成轨迹，每条轨迹 20 帧，采样间隔 0.1 s。每条轨迹写出 uav_trajectory.csv，每一帧写出场景 XML 文件与 PLY 网格。'}
    inputs:
    - {en: Random city layout parameters and seeds, zh: 随机城市布局参数与随机种子}
    outputs:
    - {en: 'Trajectory CSV, and per-frame scene XML and PLY meshes', zh: 轨迹 CSV，以及每帧的场景 XML 与 PLY 网格}
    controls:
    - {en: 'Radio materials follow ITU-R P.2040-3: ITU concrete for roads, marble or glass for walls, concrete, wood or metal for roofs, medium dry ground for the terrain, and metal for the UAV.', zh: 无线材质依据 ITU-R P.2040-3：道路为 ITU 混凝土，墙面为大理石或玻璃，屋顶为混凝土、木材或金属，地面为中等干燥地面，无人机为金属。}
  - title: {en: Compute per-frame channels with Sionna RT, zh: 用 Sionna RT 计算逐帧信道}
    detail: {en: 'channel_generation.py removes the UAV mesh from the static scene and places the single-antenna UAV transmitter at each frame position. The receiver is the 64×64 vertically polarized half-wavelength UPA at the BS. The solver runs at 7 GHz with LoS and specular reflection enabled, maximum depth 3, diffuse reflection and refraction disabled, and synthetic_array disabled. If a frame has no paths or a response with every magnitude below 1e-9, the whole trajectory is discarded.', zh: channel_generation.py 从静态场景中移除无人机网格，并将单天线无人机发射机放置于每一帧的位置。接收端为基站处的 64×64 垂直极化半波长 UPA。求解器工作于 7 GHz，启用视距与镜面反射，最大深度为 3，关闭漫反射与折射，并禁用合成阵列。若某帧无路径，或响应的所有幅值均低于 1e-9，则整条轨迹被丢弃。}
    outputs:
    - {en: Path objects and per-frame CFR, zh: 路径对象与逐帧 CFR}
    controls:
    - {en: The README pins sionna-rt 1.1.0., zh: README 固定使用 sionna-rt 1.1.0。}
  - title: {en: Build frequency response and beam labels, zh: 生成频率响应与波束标签}
    detail: {en: 'The code calls paths.cfr over K = 1024 frequency points spaced 30 kHz apart but keeps only the first point, so each frame is stored as a 4096 × 1 × 2 array. The same vector is correlated with the conjugate codebook, and the Top-5 gains |wᴴh|² are decoded into (θ, φ, r) indices. Is_NF is set when the distance is below the diagonal Rayleigh distance, and Has_LoS is set when a valid path has no interactions.', zh: '代码在间隔 30 kHz 的 K = 1024 个频点上调用 paths.cfr，但仅保留第一个频点，因此每帧存为 4096 × 1 × 2 数组。同一向量与共轭码本做内积，取 Top-5 增益 |wᴴh|²，并解码为 (θ, φ, r) 索引。当距离小于对角孔径的 Rayleigh 距离时 Is_NF 置 1；当有效路径无交互时 Has_LoS 置 1。'}
    outputs:
    - {en: 'H, BeamIdx, BeamPower, Angle, Is_NF, Has_LoS and motion mode index', zh: H、BeamIdx、BeamPower、Angle、Is_NF、Has_LoS 与运动模式索引}
  - title: {en: Render synchronized RGB images, zh: 渲染同步 RGB 图像}
    detail: {en: 'A separate visual XML scene is rendered with Mitsuba from the BS-side camera, with a 90° field of view, 512 × 512 resolution and 32 samples per pixel. Visual materials are configured separately from the radio materials.', zh: 使用独立的视觉 XML 场景，由 Mitsuba 从基站侧相机渲染，视场角 90°，分辨率 512 × 512，每像素 32 个采样。视觉材质与无线电材质分开配置。}
    outputs:
    - {en: bs_rgb PNG per frame, zh: 每帧的 bs_rgb PNG}
  - title: {en: Scan the same geometry with LiDAR, zh: 对同一几何进行 LiDAR 扫描}
    detail: {en: 'Open3D RaycastingScene casts about 12,000 random directions from the BS position over the static meshes and the UAV mesh. Finite hits are kept, and 10,000 of them are sampled into a PLY file for each frame.', zh: 'Open3D 的 RaycastingScene 从基站位置向静态网格与无人机网格投射约 12,000 条随机方向的射线。保留有限命中点，并随机抽取 10,000 点写入每帧的 PLY 文件。'}
    outputs:
    - {en: bs_lidar PLY point cloud per frame, zh: 每帧的 bs_lidar PLY 点云}
  - title: {en: Pack sensor data by trajectory and frame index, zh: 按轨迹号与帧号打包传感器数据}
    detail: {en: 'pick_image_to_h5.py matches bs_rgb PNG files to channel samples by trajectory and frame number and resizes them to 224 × 224. It sets 5% of frames to black to simulate night. pick_lidar_to_h5.py fixes each cloud at 10,000 points by random sampling or cyclic padding, and adds Gaussian noise with standard deviation 1e-4 × d², where d is the distance to the BS, to 5% of frames to simulate weather. Missing files are stored as zero arrays.', zh: 'pick_image_to_h5.py 按轨迹号与帧号将 bs_rgb PNG 与信道样本匹配，并缩放为 224 × 224，其中 5% 的帧被置黑以模拟夜间。pick_lidar_to_h5.py 将每帧点云固定为 10,000 点（随机采样或循环补点），并对 5% 的帧叠加标准差为 1e-4 × d² 的高斯噪声（d 为到基站的距离）以模拟天气。缺失文件以零数组存储。'}
    outputs:
    - {en: 'Image and point-cloud HDF5 files with traj_id, frame_id and perturbation masks', zh: 包含 traj_id、frame_id 与扰动掩码的图像及点云 HDF5 文件}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: 'Near-field CSI with Top-5 labels, position, motion mode and LoS flag; RGB and point clouds packaged separately and aligned by frame.', zh: 近场 CSI 与 Top-5 标签、位置、运动模式及 LoS 标志；RGB 与点云分别打包，并按帧对齐。}
- label: {en: Derived outputs, zh: 派生输出}
  text: {en: 'Angle (θ, φ), Is_NF, Has_LoS and the motion-mode index are computed per sample by the generator. The GPS observations are noisy copies of the positions.', zh: '生成器为每个样本计算角度 (θ, φ)、Is_NF、Has_LoS 与运动模式索引。GPS 观测为位置的加噪副本。'}
- label: {en: Release scale, zh: 发布规模}
  text: {en: 'The Hugging Face repository holds 19 files, about 282.7 GB in total. These include per-city MultiSubcarrier HDF5 files (23.5 to 33.5 GB each for the nine cities listed), zip archives of images, LiDAR and CSI, and two codebooks.', zh: Hugging Face 仓库共 19 个文件，合计约 282.7 GB。其中包括逐城市的 MultiSubcarrier HDF5 文件（所列 9 个城市各 23.5 至 33.5 GB）、图像、LiDAR 与 CSI 压缩包，以及两个码本。}
provenance:
- {en: OpenStreetMap scene geometry → urban scenes and UAV trajectories, zh: OpenStreetMap场景几何 → 城市场景与UAV轨迹}
- {en: Sionna RT + array/material configuration → near-field channels, zh: Sionna RT + 阵列/材料配置 → 近场信道}
- {en: 'Synchronized RGB/LiDAR rendering, GPS generation, and near-field codebook labels → HDF5', zh: 同步渲染RGB/LiDAR、生成GPS和近场码本标签 → HDF5}
technical_notes:
- {en: LoS and specular reflection are enabled with maximum interaction depth 3. Diffraction and diffuse scattering are not enabled., zh: 启用视距与镜面反射，最大交互深度为 3；未启用绕射与漫散射。}
- {en: 'Channels are generated per antenna. Array-level electromagnetic effects such as mutual coupling, antenna mismatch and RF-chain non-idealities are not included.', zh: 信道按天线逐一生成，不包含互耦、天线失配或射频链路非理想等阵列级电磁效应。}
- {en: The RGB and LiDAR packing scripts add simplified night and weather perturbations. The paper states that more realistic weather and illumination degradations are future work., zh: RGB 与 LiDAR 的打包脚本添加了简化的夜间与天气扰动。论文指出，更真实的天气与光照退化留待未来工作。}
limitations:
- {en: 'Each RGB and LiDAR frame contains only the UAV of its own trajectory, so frames from different trajectories cannot be combined into a synchronized multi-UAV observation.', zh: 每个 RGB 与 LiDAR 帧只包含其所属轨迹的无人机，因此来自不同轨迹的帧不能拼接为同步的多无人机观测。}
- {en: 'The split is by city (22 training, 4 validation and 4 test), and every sample comes from one simulator, Sionna RT.', zh: 数据按城市划分（训练 22 个、验证 4 个、测试 4 个），所有样本均来自同一仿真器 Sionna RT。}
- {en: 'The public generator computes 1,024 frequency points but saves one, so the code and the README and paper describe different tensor shapes.', zh: '公开生成器计算 1,024 个频点但仅保存一个，因此代码与 README、论文所描述的张量形状不同。'}
history:
- {en: '2026-03-30: first arXiv submission (arXiv:2603.28280).', zh: '2026-03-30：首次提交至 arXiv（arXiv:2603.28280）。'}
- {en: '2026: paper published in IEEE Wireless Communications Letters, volume 15, pages 3631–3635, DOI 10.1109/LWC.2026.3702704.', zh: 2026 年：论文发表于 IEEE Wireless Communications Letters，第 15 卷，3631–3635 页，DOI 10.1109/LWC.2026.3702704。}
- {en: '2026-06-16: last modification of the Hugging Face dataset, as recorded by the Hugging Face API.', zh: 2026-06-16：Hugging Face 数据集的最后修改时间（据 Hugging Face API）。}
usage:
- {en: 'Each city file has H, Pos, Angle, Is_NF, BeamIdx, BeamPower, Metadata, Has_LoS and Mode_Idx datasets, as written by channel_generation.py.', zh: 每个城市文件包含数据集 H、Pos、Angle、Is_NF、BeamIdx、BeamPower、Metadata、Has_LoS 与 Mode_Idx（由 channel_generation.py 写入）。}
- {en: 'Top-5 labels can be recomputed from H and the codebook by correlating with the conjugate codebook, as search_top_k_beams does.', zh: Top-5 标签可由 H 与码本重新计算：与共轭码本做内积，与 search_top_k_beams 的做法一致。}
- {en: 'The packing scripts align RGB and LiDAR frames with channel samples by traj_id and frame_id, so these IDs are needed to read the sensor files.', zh: 打包脚本按 traj_id 与 frame_id 将 RGB 与 LiDAR 帧对齐到信道样本，因此读取传感器文件需要使用这两个 ID。}
field_notes:
- label: {en: Paths, zh: 路径}
  text: {en: 'The generator calls paths.cir() for gains and delays, but the HDF5 output stores no per-path coefficients, delays or interaction records.', zh: 生成器调用 paths.cir() 获取增益与时延，但 HDF5 输出不保存逐路径系数、时延或交互记录。}
- label: {en: Time, zh: 时间}
  text: {en: 'Frames are 0.1 s apart within each 20-frame trajectory. Metadata holds the city and trajectory indices, and frame order follows the sequence within each trajectory.', zh: 同一轨迹内相邻帧间隔 0.1 s，每条轨迹 20 帧。Metadata 保存城市与轨迹索引，帧顺序即各轨迹内的先后顺序。}
tools: [project-open3d-raycasting]
overview: {en: 'Multimodal-NF is a ray-traced dataset and open-source generator for near-field XL-MIMO sensing and communication with low-altitude UAVs, published with the paper by M. Li, Q. Lu, J. Tian, H. Hu, Y. Han, X. Li, C.-K. Wen and S. Jin in IEEE Wireless Communications Letters (2026, DOI 10.1109/LWC.2026.3702704). Each scene is a 120 m × 120 m observed region with buildings 20–60 m high. The scene generator in the released notebook draws random grid-style road and building layouts and does not load OpenStreetMap data. The base station is a 64×64 vertically polarized UPA at (0, 0, 65) m operating at 7 GHz, and Sionna RT computes LoS and specular reflections up to interaction depth 3. The released set contains 215,400 samples from 10,770 trajectories of 20 frames each, at a 0.1 s sampling interval, across 10 UAV kinematic modes with horizontal speeds up to 25 m/s. Each sample pairs the CSI tensor with a LoS label, Top-5 beam indices, normalized beamforming gains, a 512×512 RGB image
    with a 90° field of view, a 10,000-point LiDAR cloud and noisy GPS coordinates. The split is by city: 22 cities for training, 4 for validation and 4 for testing, with 93.35% of samples labelled LoS. The data are simulated only: diffraction and diffuse scattering are not modelled, array hardware effects are absent, and the RGB and LiDAR carry only simplified night and weather perturbations added by the packing scripts.', zh: 'Multimodal-NF 是一个基于光线追踪的数据集，并提供开源生成器，面向低空无人机的近场 XL-MIMO 感知与通信。该数据集随 M. Li、Q. Lu、J. Tian、H. Hu、Y. Han、X. Li、C.-K. Wen 和 S. Jin 的论文发布，论文发表于 IEEE Wireless Communications Letters（2026，DOI 10.1109/LWC.2026.3702704）。每个场景的观测区域为 120 m × 120 m，建筑高度为 20–60 m。发布的场景笔记本中的生成器绘制随机的网格状道路与建筑布局，并不加载 OpenStreetMap 数据。基站为位于 (0, 0, 65) m 的 64×64 垂直极化 UPA，工作频率 7 GHz，Sionna RT 计算视距（LoS）和镜面反射，最大交互深度为 3。发布的数据包含 10,770 条轨迹的 215,400 个样本，每条轨迹 20 帧，采样间隔 0.1 s，覆盖 10 种无人机运动模式，水平速度最高 25 m/s。每个样本包含 CSI 张量、LoS 标签、Top-5 波束索引、归一化波束成形增益、视场角 90° 的 512×512 RGB 图像、10,000 点 LiDAR 点云和带噪声的 GPS 坐标。数据按城市划分：训练集
    22 个城市，验证集 4 个城市，测试集 4 个城市；LoS 样本占 93.35%。数据仅为仿真结果：未建模绕射与漫散射，不含阵列硬件效应；RGB 与 LiDAR 仅含打包脚本添加的简化夜间与天气扰动。'}
signal_details:
- signal: csi
  text: {en: 'Ray-traced complex channel for a 64×64 vertically polarized UPA (4,096 antennas) at 7 GHz, with 128 subcarriers at 30 kHz spacing. The paper gives the tensor as M × K × T × 2 with M = 4096, K = 128 and T = 20 frames, with real and imaginary parts stacked on the last axis. The channel is computed per antenna, with synthetic_array disabled.', zh: '基于光线追踪的复数信道，基站为 64×64 垂直极化 UPA（4,096 根天线），工作频率 7 GHz，128 个子载波，间隔 30 kHz。论文给出的张量形式为 M × K × T × 2，其中 M = 4096、K = 128、T = 20 帧，实部与虚部位于最后一维。信道按天线逐一计算，禁用合成阵列。'}
- signal: beam-power
  text: {en: 'Top-5 beam indices and normalized beamforming gain |wᴴh|² / |w_optᴴh|², defined on a near-field polar codebook of 4,000 beams (20 × 20 × 10, with θ in [−72°, 72°], φ in [60°, 150°] and range 20–155 m). This is the codebook the generator uses by default. The README also lists a dense 90 × 45 × 16 codebook.', zh: 'Top-5 波束索引与归一化波束成形增益 |wᴴh|² / |w_optᴴh|²，基于 4,000 个波束的近场极坐标码本（20 × 20 × 10，θ ∈ [−72°, 72°]，φ ∈ [60°, 150°]，距离 20–155 m）。该码本为生成器默认使用的码本。README 另列出一个 90 × 45 × 16 的密集码本。'}
- signal: rgb
  text: {en: '512 × 512 pixel image with a 90° field of view, rendered with Mitsuba from the base-station viewpoint and co-located with the LiDAR sensor. The packing script resizes each frame to 224 × 224.', zh: 512 × 512 像素图像，视场角 90°，由 Mitsuba 从基站视角渲染，与 LiDAR 同位。打包脚本将每帧缩放为 224 × 224。}
- signal: lidar
  text: {en: '10,000-point cloud per sample, co-located with the RGB camera. It is simulated with Open3D ray casting from the base station, keeping finite ray hits and sampling 10,000 of them.', zh: '每个样本 10,000 点的点云，与 RGB 相机同位。由 Open3D 从基站出发的射线投射生成，保留有限命中点并抽取 10,000 点。'}
- signal: gps
  text: {en: 'Noisy 3D UAV coordinates ũ_t = u_t + z_t, with Gaussian noise z_t ~ N(0, σ²I) added to the ground truth; the paper''s experiments use σ² = 0.5. The generator stores ground-truth positions.', zh: '带噪声的三维无人机坐标 ũ_t = u_t + z_t，在真值上叠加高斯噪声 z_t ~ N(0, σ²I)；论文实验中 σ² = 0.5。生成器保存的是真值位置。'}
size_gb: 282.7
capabilities:
- key: csi
  status: provided
  note: {en: 'Complex CSI per frame for a 64×64 UPA, 20 frames per trajectory. The code sets 1024 subcarriers and the README states 128, so the released subcarrier count is not verified.', zh: 每帧为 64×64 UPA 的复数 CSI，每条轨迹 20 帧。代码设置 1024 个子载波，README 写为 128，发布数据的子载波数未核实。}
- key: cir
  status: derivable
  note: {en: Not stored. An IDFT of the subcarrier-domain CSI on the 30 kHz grid gives a band-limited delay profile., zh: 未存储。对 30 kHz 间隔子载波域的 CSI 做 IDFT 可得到带限时延分布。}
- key: paths
  status: simulate
  note: {en: 'The generator computes per-path gains and delays (paths.cir()), but the HDF5 output does not store them.', zh: 生成器计算逐径增益与时延（paths.cir()），但 HDF5 输出未保存，需重新运行并导出。}
- key: interaction
  status: simulate
  note: {en: 'Interaction types are computed in the generator, but only the LoS flag (Has_LoS) is saved.', zh: 生成器计算了交互类型，但只保存视距标志（Has_LoS）。}
- key: power
  status: provided
  note: {en: Top-5 beamforming gains per sample (BeamPower); the README calls them normalized. No path-loss field is stored., zh: 每个样本的 Top-5 波束增益（BeamPower），README 称为归一化增益。未保存路径损耗字段。}
- key: iq
  status: none
  note: {en: Channel-level output only; no waveform I/Q samples are produced., zh: 仅输出信道级数据，不产生波形 I/Q 采样。}
- key: beam_labels
  status: provided
  note: {en: 'Top-5 beam indices (BeamIdx). The code''s default codebook is the small 20×20×10 one; the dense 90×45×16 codebook is commented out, and the HDF5 writer records no codebook attribute.', zh: Top-5 波束索引（BeamIdx）。代码默认码本为小码本 20×20×10，密集码本 90×45×16 在代码中被注释掉，HDF5 写入时未记录码本属性。}
- key: position
  status: provided
  note: {en: 'Stored as Pos, the simulated UAV position. The README calls the GPS noisy, but the generator stores the unperturbed position.', zh: 以 Pos 存储仿真的无人机位置。README 称 GPS 含噪声，但生成器保存的是未加扰动的位置。}
- key: geometry
  status: simulate
  note: {en: Scenes are built from OpenStreetMap by OSM_to_SionnaScene.ipynb. The HF file list contains no scene files., zh: 场景由 OSM_to_SionnaScene.ipynb 从 OpenStreetMap 构建。HF 文件列表中没有场景文件。}
- key: materials
  status: simulate
  note: {en: ITU radio material types are assigned in OSM_to_SionnaScene.ipynb. No material files are released., zh: ITU 无线电材料类型在 OSM_to_SionnaScene.ipynb 中指定，未发布材料文件。}
- key: rgb
  status: provided
  note: {en: '512×512 camera images in the Synthetic_Image_AllModes archives (90° FoV, per README). The RealScenarioSimulation archive is a separate set.', zh: Synthetic_Image_AllModes 压缩包中为 512×512 相机图像（视场角 90°，据 README）。RealScenarioSimulation 压缩包为另一套数据。}
- key: depth
  status: none
  note: {en: Not in the documented sample schema., zh: 不在文档化的样本结构中。}
- key: lidar
  status: provided
  note: {en: '10,000-point LiDAR clouds in the Synthetic_Lidar_10000_AllModes archives, co-located with the camera.', zh: 'Synthetic_Lidar_10000_AllModes 压缩包中为 10,000 点的 LiDAR 点云，与相机同步。'}
- key: radar
  status: none
  note: {en: Not in the documented sample schema., zh: 不在文档化的样本结构中。}
- key: imu
  status: none
  note: {en: Not in the documented sample schema., zh: 不在文档化的样本结构中。}
- key: time_series
  status: provided
  note: {en: '20-frame trajectories sampled every 0.1 s, with trajectory ID and motion-mode index.', zh: 每条轨迹 20 帧，采样间隔 0.1 s，含轨迹 ID 与运动模式索引。}
- key: multiuser
  status: simulate
  note: {en: Each sample holds one UAV. Simultaneous multi-UAV channels need a generator change and a new run., zh: 每个样本只含一架无人机。多无人机同时信道需修改生成器并重新运行。}
- key: multibs
  status: simulate
  note: {en: 'The generator places one BS at (0, 0, 65) m. A multi-BS set needs a configuration change.', zh: '生成器只放置一个基站，位于 (0, 0, 65) m。多基站数据需修改配置。'}
- key: crossfreq
  status: simulate
  note: {en: Single 7 GHz carrier (CENTER_FC). Paired multi-band data need a rerun at other carriers., zh: 仅 7 GHz 单一载频（CENTER_FC）。成对的多频段数据需在其他载频重新运行。}
- key: near_field
  status: provided
  note: {en: 'Per-sample near-field flag Is_NF, set from the Rayleigh distance. The BS is a 64×64 UPA at 7 GHz.', zh: 每个样本有近场标志 Is_NF，依据瑞利距离设定。基站为 7 GHz 下的 64×64 UPA。}
- key: high_mobility
  status: provided
  note: {en: 'UAV horizontal speed up to 25 m/s (90 km/h) in the Fast Transit mode (README: 15–25 m/s).', zh: 无人机水平速度最高 25 m/s（90 km/h），见 Fast Transit 模式（README 给出 15–25 m/s）。}
- key: dynamic_blockage
  status: unknown
  note: {en: The sources do not state whether moving blockers such as vehicles or people are modelled., zh: 来源未说明是否建模了车辆或行人等移动遮挡物。}
- key: reflection
  status: provided
  note: {en: 'Specular reflection is enabled in the solver, with maximum interaction depth 3. Not labelled per path in the release.', zh: 求解器启用镜面反射，最大交互深度为 3。发布数据中未按路径标注。}
- key: diffraction
  status: simulate
  note: {en: Not enabled in the solver call (no diffraction flag is passed). Enabling it needs a rerun., zh: 求解器调用中未启用绕射（未传入相应标志）。启用需重新运行。}
- key: scattering
  status: simulate
  note: {en: diffuse_reflection is set to False in the solver call. Enabling it needs a rerun., zh: 求解器调用中 diffuse_reflection 设为 False。启用需重新运行。}
- key: transmission
  status: simulate
  note: {en: refraction is set to False in the solver call. Enabling it needs a rerun., zh: 求解器调用中 refraction 设为 False。启用需重新运行。}
- key: polarization
  status: simulate
  note: {en: TX and RX polarization are both set to V in the generator. Other polarizations need a rerun., zh: 生成器中收发极化均设为 V。其他极化需重新运行。}
- key: em_field
  status: unknown
  note: {en: The generator outputs channel coefficients only. The sources do not describe field-level outputs., zh: 生成器只输出信道系数。来源未描述场量级输出。}
