summary: {en: 'Ray-traced near-field CSI at 7 GHz from a 64×64 UPA base station, synchronized with RGB images, LiDAR point clouds, noisy GPS, LoS labels and Top-5 beam indices for UAVs in 30 OSM-based urban scenes. An open-source generator produces the data, and the released set has 215,400 samples from 10,770 trajectories.', zh: '基于光线追踪的 7 GHz 近场 CSI，来自 64×64 UPA 基站，与 RGB 图像、LiDAR 点云、带噪声的 GPS、LoS 标签及 Top-5 波束索引同步，场景为 30 个基于 OSM 的城市三维场景中的无人机。数据由开源生成器产生，发布的数据集包含来自 10,770 条轨迹的 215,400 个样本。'}
sources: ['https://arxiv.org/abs/2603.28280', 'https://github.com/Lmyxxn/Multimodal-NF', 'https://raw.githubusercontent.com/Lmyxxn/Multimodal-NF/main/README.md', 'https://huggingface.co/datasets/lmyxxn/MultimodalNF', 'https://api.crossref.org/works/10.1109/LWC.2026.3702704']
checked: '2026-11-06'
pipeline:
  summary: {en: 'The same city geometry and UAV trajectory drive radio, images, and geometric point clouds, which are then aligned and packaged using the retained channel-sample indices.', zh: 同一城市几何和UAV轨迹驱动无线、图像与几何点云，再按保留下来的信道样本索引对齐打包。}
  stages:
  - title: {en: City geometry and motion trajectories, zh: 城市几何与运动轨迹}
    detail: {en: 'The notebook constructs city meshes and places the UAV frame by frame, saving trajectory CSVs, RF-scene XML, and sensor geometry.', zh: notebook构造城市网格并逐帧放置UAV，保存轨迹CSV、RF场景XML和传感器几何。}
    inputs:
    - {en: 'OSM scenes, materials, and base-station positions', zh: OSM场景、材质、基站位置}
    - {en: Motion modes and random seeds, zh: 运动模式与随机种子}
    outputs:
    - {en: mesh/XML, zh: mesh/XML}
    - {en: Trajectory CSVs and frame directories, zh: 轨迹CSV与帧目录}
    controls:
    - {en: 'Fix cities, units, coordinates, trajectories, and camera orientation', zh: 固定城市、单位、坐标、轨迹和相机朝向}
    checks:
    - {en: 'Reproduction check: city/trajectory/frame identities must match across modalities', zh: 复现检查：城市/轨迹/帧身份跨模态一致}
  - title: {en: Per-element radio propagation, zh: 逐阵元无线传播}
    detail: {en: 'The current code removes the UAV mesh and positions Tx using the trajectory. It uses 7 GHz, synthetic_array=False, LoS and specular reflection, and maximum depth 3.', zh: 当前代码移除UAV网格，用轨迹位置设置Tx；7 GHz、synthetic_array=False，启用LoS与镜面反射，最大深度3。}
    inputs:
    - {en: Static urban scene, zh: 城市静态场景}
    - {en: Single-antenna UAV Tx and 64×64 base-station Rx, zh: 单天线UAV Tx与64×64基站Rx}
    outputs:
    - {en: Path objects and CFR, zh: 路径对象与CFR}
    controls:
    - {en: 'Fix the Sionna version, antenna patterns, and propagation switches', zh: 固定Sionna版本、方向图和传播开关}
    checks:
    - {en: 'Reproduction check: zero paths or near-zero CFR cause the whole trajectory to be discarded; record this filtering in outage analysis', zh: 复现检查：零路径或近零CFR会丢弃整条轨迹，outage分析须记录筛除}
  - title: {en: Channel frequency points and near-field labels, zh: 信道频点与近场标签}
    detail: {en: 'Current source code uses K=1024, but H_t_structured[0,:,0,:] extracts only the first frequency point and writes [4096,1,2]. The same vector and conjugated codebook produce Top-5 powers, with theta/phi/r indices decoded afterward.', zh: '当前源码K=1024，但H_t_structured[0,:,0,:]只抽取第一频点并写为[4096,1,2]。用同一向量与共轭码本求功率Top-5，并解码theta/phi/r索引。'}
    inputs:
    - {en: CFR and codebook PKL, zh: CFR、码本PKL}
    - {en: Positions and Rayleigh-distance rules, zh: 位置与Rayleigh距离规则}
    outputs:
    - {en: H、BeamIdx、BeamPower, zh: H、BeamIdx、BeamPower}
    - {en: 'Angle, Is_NF, LoS, and motion modes', zh: Angle、Is_NF、LoS与模式}
    controls:
    - {en: Record the README's 128 frequency points separately from the current code's 1024 computed/1 saved frequency point, zh: README的128频点与当前代码的1024计算/1频点写出分开记录}
    checks:
    - {en: 'Reproduction check: inspect actual HDF5 shapes and recompute labels on a sample; codebook dimensions and decoding order must match', zh: 复现检查：读取实际HDF5 shape并抽样重算标签；码本尺寸和解码顺序必须匹配}
  - title: {en: Synchronized RGB rendering, zh: 同步RGB渲染}
    detail: {en: Mitsuba renders PNGs from separate visual XML; radio materials and visual reflection parameters are configured separately., zh: Mitsuba根据独立视觉XML渲染PNG；无线材质和视觉反射参数分别配置。}
    inputs:
    - {en: Static mesh and UAV position for the same frame, zh: 同一帧静态mesh与UAV位置}
    - {en: Base-station camera and visual materials, zh: 基站相机与视觉材质}
    outputs:
    - {en: bs_rgb frame images, zh: bs_rgb帧图像}
    controls:
    - {en: 'Fix field of view, resolution, lighting, and orientation', zh: 固定视场、分辨率、光照与朝向}
    checks:
    - {en: 'Reproduction check: the camera must cover the target; visual materials do not replace RF dielectric parameters', zh: 复现检查：相机覆盖目标；视觉材质不替代RF介电参数}
  - title: {en: Point-cloud scanning of the same geometry, zh: 同几何点云扫描}
    detail: {en: 'Open3D RaycastingScene computes nearest intersections, retains finite hits, and samples them for PLY output.', zh: Open3D RaycastingScene求最近交点，保留有限命中并抽样保存PLY。}
    inputs:
    - {en: Static mesh and current UAV mesh, zh: 静态mesh与当前UAV网格}
    - {en: Base-station origin and random ray directions, zh: 基站原点和随机射线方向}
    outputs:
    - {en: bs_lidar point clouds, zh: bs_lidar点云}
    controls:
    - {en: 'Fix ray count, random seed, coordinates, and scan-direction distribution', zh: 固定射线数、随机种子、坐标与扫描方向分布}
    checks:
    - {en: 'Reproduction check: this is a geometric scan; sensor intensity and hardware errors require custom models', zh: 复现检查：这是几何扫描；传感器强度和硬件误差需自定义模型}
  - title: {en: Package sensors using retained channel indices, zh: 按信道保留索引打包传感器}
    detail: {en: 'Two scripts match by trajectory and sequential frame number. RGB is resized to 224×224 and blacked out with 5% probability. Point clouds are fixed at 10000 points by sampling or repetition, with distance-dependent Gaussian perturbations added with 5% probability.', zh: 两脚本按轨迹和顺序帧号匹配。RGB缩至224×224，5%概率置黑；点云固定10000点，采样或重复补点，5%概率叠加距离相关高斯扰动。}
    inputs:
    - {en: Channel HDF5 Metadata, zh: 信道HDF5 Metadata}
    - {en: PNG and PLY frame files, zh: PNG、PLY帧文件}
    outputs:
    - {en: Separate image/points HDF5 files, zh: 独立image/points HDF5}
    - {en: 'traj_id, frame_id, and perturbation masks', zh: traj_id、frame_id和扰动mask}
    controls:
    - {en: Fix random seeds and retain night/weather masks, zh: 固定随机种子并保留night/weather mask}
    checks:
    - {en: 'Reproduction check: missing files can also produce zero arrays, so report missing-data rates separately; blackout/Gaussian perturbations are simplified models', zh: 复现检查：缺文件也可产生零数组，需另报缺失率；置黑/高斯扰动是简化模型}
  - title: {en: Construct beam and selective-sensing tasks, zh: 构建波束与选择性感知任务}
    detail: {en: 'Isolate cities and trajectories, compare fixed modalities with an oracle first, then design policies with age and acquisition costs.', zh: 研究者按城市和轨迹隔离，先比较固定模态与oracle，再设计带age和采集成本的策略。}
    inputs:
    - {en: 'Aligned CSI, positions, RGB, and point clouds', zh: 已对齐CSI、位置、RGB与点云}
    - {en: City/trajectory identities, zh: 城市/轨迹身份}
    outputs:
    - {en: Training/validation/test protocol, zh: 训练/验证/测试协议}
    - {en: 'Goodput, outage, and sensing costs', zh: goodput、outage和感知成本}
    controls:
    - {en: Fix the codebook and costs; current unpurchased modalities must not enter the policy, zh: 固定码本与成本；当前未购买模态不可进入策略}
    checks:
    - {en: 'Reproduction check: independent trajectories can form multiuser sets only at the channel level; shared visual scenes must be regenerated', zh: 复现检查：独立轨迹仅可在信道层组multiuser；共享视觉需重新生成}
  scope: {en: The current public generator and README are recorded separately; actual configurations of released HDF5 files remain file-specific., zh: 当前公开生成器与README分别记录；已发布HDF5的实际配置仍以文件为准。}
