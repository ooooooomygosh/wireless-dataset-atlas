summary: {en: 'Wideband CSI at 5.53 GHz, extracted from IEEE 802.11ac VHT frames over 80 MHz (242 valid subcarriers), for a 256-element binary-state RIS. It covers 9 transmitter positions with about 10,000 RIS configurations each, measured indoors with RF absorbers.', zh: '在 5.53 GHz 载频、80 MHz 带宽（IEEE 802.11ac VHT 帧，242 个有效子载波）下测得的宽带 CSI，RIS 为 256 单元二进制状态。覆盖 9 个发射机位置，每个位置约 10,000 个 RIS 配置，测量在室内并布置射频吸波材料的环境中进行。'}
