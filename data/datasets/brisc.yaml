checked: '2026-11-06'
overview: {en: 'BRISC is a channel measurement dataset recorded with a 256-element binary-state reconfigurable intelligent surface (RIS) at 5.53 GHz. Researchers at the University of Padova and the University of Brescia published it on Zenodo in February 2026, with an arXiv paper (2602.21102). The measurements used two USRP X310 software-defined radios synchronized by an OctoClock, with one transmitting antenna and two receiving antennas, in an indoor setting where RF absorbing panels blocked the direct path. The transmitter was placed at nine positions defined by three radii and three angles relative to the RIS, and about 10,000 RIS configurations were measured at each position with IEEE 802.11ac VHT frames over an 80 MHz channel with 242 valid subcarriers. The release consists of MATLAB .mat files totalling 40.3 GB: one file per transmitter position for each receive antenna type, and one configuration file that lists the 10,000 RIS states. The authors target RIS channel modelling, the
    calibration and comparison of linear and data-driven channel models, and signal processing and security studies for RIS-enabled systems. The data cover one 80 MHz channel with a fixed receiver and a blocked direct path, so they do not span the full RIS operating band of 5.15 to 5.875 GHz or any mobility.', zh: 'BRISC是一个信道测量数据集，采集自载频5.53 GHz的256单元二进制状态可重构智能表面（RIS）。帕多瓦大学与布雷西亚大学的研究人员于2026年2月将其发布在Zenodo上，并附有arXiv论文2602.21102。测量使用两台经OctoClock同步的USRP X310软件无线电，发射端1根天线，接收端2根天线，位于室内环境，吸波板阻断直射路径。发射机位于相对RIS由三个半径与三个角度确定的9个位置，每个位置使用80 MHz带宽的IEEE 802.11ac VHT帧测量约10,000种RIS配置，有效子载波242个。发布内容为MATLAB .mat文件，共40.3 GB：每个发射位置、每种接收天线类型各一个文件，另有一个列出10,000种RIS状态的配置文件。作者面向RIS信道建模、线性与数据驱动信道模型的校准与比较，以及RIS使能系统的信号处理与安全研究。数据仅覆盖一个80 MHz信道，接收机固定，直射路径被阻断，因此不覆盖5.15至5.875 GHz的完整RIS工作频段，也不涉及移动场景。'}
signal_details:
- signal: iq
  text: {en: 'The receiver captures complex baseband IQ samples for offline MATLAB processing, and CSI is derived from them. The public Zenodo release contains only the CSI arrays, the configuration files and the per-frame metadata.', zh: 接收机采集复数基带IQ采样，用于离线MATLAB处理，CSI由这些采样导出。公开的Zenodo发布仅包含CSI数组、配置文件与逐帧元数据。}
pipeline:
  summary: {en: 'RIS configurations are sampled with three patterns, each configuration is measured with 802.11ac frames, the frames are converted to CSI in MATLAB, and the CSI is packaged per transmitter position.', zh: RIS配置按三种模式采样，每个配置以802.11ac帧进行测量，帧在MATLAB中转换为CSI，并按发射位置打包。}
  stages:
  - title: {en: RIS configuration sampling, zh: RIS 配置采样}
    detail: {en: 'The 256-cell 1-bit RIS is controlled over USB from a host computer. Stage 1 measures all 16 patterns of four 8×8 macro-blocks, stage 2 measures all 512 patterns of a 3×3 macro-block grid, and stage 3 assigns independent random states to each element, giving 10,000 configurations per transmitter position.', zh: '256单元1 bit RIS通过USB由主机计算机控制。第一阶段测量四个8×8宏块的全部16种组合，第二阶段测量3×3宏块网格的全部512种组合，第三阶段为每个单元独立随机分配状态，每个发射位置共10,000种配置。'}
    inputs:
    - {en: 256-cell 1-bit RIS with USB control, zh: 带USB控制的256单元1 bit RIS}
    outputs:
    - {en: '10,000 RIS configurations', zh: '10,000种RIS配置'}
  - title: {en: Frame transmission and IQ capture, zh: 帧发射与IQ采集}
    detail: {en: 'MATLAB-generated 802.11ac VHT frames are sent by a USRP X310 through an external 25 dB linear amplifier over 80 MHz at 5.53 GHz. After a 0.3 s settling time following each RIS change, the transmitter streams the frames for about 0.6 s while the receiver records complex baseband IQ samples with AGC disabled and a fixed 35 dB gain. A 0.3 s silent interval separates consecutive configurations.', zh: MATLAB生成的802.11ac VHT帧由USRP X310经外接25 dB线性功率放大器，在5.53 GHz、80 MHz带宽上发送。每次RIS变化后经过0.3 s稳定时间，发射机连续发送约0.6 s，接收机关闭AGC并固定增益35 dB，记录复数基带IQ采样。相邻配置之间有0.3 s静默间隔。}
    inputs:
    - {en: RIS configuration and 802.11ac frames, zh: RIS配置与802.11ac帧}
    outputs:
    - {en: complex baseband IQ samples, zh: 复数基带IQ采样}
  - title: {en: CSI estimation, zh: CSI估计}
    detail: {en: 'Per frame, the received signal is multiplied by the conjugate of the known pilot symbol and divided by the pilot''s squared magnitude. The per-frame estimates are averaged over the frames of each configuration, giving a 242 by 1 or 242 by 2 matrix.', zh: 对每一帧，将接收信号乘以已知导频符号的共轭，再除以导频幅度平方。每个配置的逐帧估计结果取平均，得到242×1或242×2矩阵。}
    inputs:
    - {en: IQ samples and known pilot symbols, zh: IQ采样与已知导频符号}
    outputs:
    - {en: CSI per configuration, zh: 每个配置的CSI}
  - title: {en: Packaging into MATLAB files, zh: 打包为MATLAB文件}
    detail: {en: 'Each transmitter position 1 to 9 has one file per receive antenna type (antennaDipole_posX.mat and antennaLog_posX.mat, 2.2 GB each). The configuration file configurations_10000.mat (10.9 MB) lists the RIS configurations in hexadecimal.', zh: 每个发射位置1至9对应每种接收天线类型各一个文件（antennaDipole_posX.mat与antennaLog_posX.mat，各2.2 GB）。配置文件configurations_10000.mat（10.9 MB）以十六进制列出RIS配置。}
    inputs:
    - {en: per-frame CSI arrays, zh: 逐帧CSI数组}
    outputs:
    - {en: MAT files per position and antenna type, zh: 按位置与天线类型划分的MAT文件}
mobility: 'static: the RIS and the receiver stay fixed, and the transmitter occupies nine fixed positions'
facts:
- label: {en: Train and test split, zh: 训练与测试划分}
  text: {en: 'The training configurations are randomly permuted, and testing uses the last 2,000 measured channels.', zh: '训练配置先随机打乱，测试使用按测量顺序排列的最后2,000个信道。'}
- label: {en: File layout, zh: 文件结构}
  text: {en: 'Each CSI .mat file stores csi (242 subcarriers by frames), confStr and confId (the configuration of each frame, ID 1 to 10,000), sqn (the Wi-Fi sequence number) and coarsets (the reception timestamp).', zh: '每个CSI .mat文件包含csi（242个子载波×帧数）、confStr与confId（每帧对应的配置，ID为1至10,000）、sqn（Wi-Fi序列号）以及coarsets（接收时间戳）。'}
capabilities:
- key: csi
  status: provided
  note: {en: 'Complex CSI with 242 subcarriers per frame, one or two receive antennas, about 60 frames per configuration.', zh: 复数 CSI，每帧 242 个子载波，接收天线 1 或 2 根，每个配置约 60 帧。}
- key: cir
  status: derivable
  note: {en: The delay profile follows from an inverse DFT over the 242 released subcarriers; no CIR field is stored., zh: 时延域信道可由 242 个已发布子载波的逆 DFT 得到；数据中不存储 CIR 字段。}
- key: paths
  status: none
  note: {en: 'The release contains CSI and configuration files only, with no per-path parameters.', zh: 发布内容仅包含 CSI 与配置文件，不含逐径参数。}
- key: interaction
  status: none
  note: {en: 'The release contains CSI and configuration files only, with no per-path interaction data.', zh: 发布内容仅包含 CSI 与配置文件，不含逐径交互信息。}
