pipeline:
  summary: {en: 'Smartphone-based tools log beam-level metrics from two commercial US 5G mmWave deployments, and the measurements are released as CSV files on IEEE DataPort.', zh: 基于智能手机的工具记录两个美国商用 5G mmWave 部署的波束级指标，测量结果以 CSV 文件形式发布在 IEEE DataPort 上。}
  stages:
  - title: {en: Deployment selection, zh: 部署场景选择}
    detail: {en: 'Two major US commercial 5G operators are measured in two environments: an open field at a baseball park (BP) and a downtown urban canyon (DT).', zh: 测量两家美国主要商用 5G 运营商的部署，场景为棒球场开阔场地（BP）和市区峡谷（DT）。}
    inputs:
    - {en: Two commercial 5G mmWave deployments, zh: 两个商用 5G mmWave 部署}
  - title: {en: Smartphone measurement, zh: 智能手机测量}
    detail: {en: 'Smartphone-based tools collect measurements across the PHY, MAC and higher layers in both deployments.', zh: 在两处部署中，基于智能手机的工具采集 PHY、MAC 及更高层的测量数据。}
    inputs:
    - {en: Commercial 5G mmWave signal, zh: 商用 5G mmWave 信号}
  - title: {en: Per-beam metrics, zh: 每波束指标}
    detail: {en: 'Signal strength, beam switch times and throughput are recorded for each beam. The deployments aggregate up to eight frequency channels on up to eight beams.', zh: 记录每个波束的信号强度、波束切换时间和吞吐量。部署中最多聚合 8 个频率信道，使用最多 8 个波束。}
    outputs:
    - {en: 'Per-beam signal strength, switch times and throughput', zh: 每波束信号强度、切换时间和吞吐量}
  - title: {en: CSV release, zh: CSV 发布}
    detail: {en: 'The measurements are stored as CSV files and packaged as 5GBeams-v0.91.zip (62.71 MB) and 5GBeams-v0.92.zip (70.12 MB) on IEEE DataPort, which requires a login and a subscription.', zh: 测量数据以 CSV 文件存储，并打包为 IEEE DataPort 上的 5GBeams-v0.91.zip（62.71 MB）和 5GBeams-v0.92.zip（70.12 MB），下载需要登录并具备订阅。}
    outputs:
    - {en: 5GBeams zip archives, zh: 5GBeams zip 压缩包}
limitations:
