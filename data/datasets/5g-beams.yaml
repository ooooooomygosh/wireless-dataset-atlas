overview: {en: '5G Beams contains smartphone-based measurements of two commercial 5G mmWave deployments in the United States. The data were collected by researchers at the University of Minnesota, the University of Chicago, Institut Teknologi Bandung and Celona, Inc., and accompany the INFOCOM 2022 paper ''A Comparative Measurement Study of Commercial 5G mmWave Deployments''. The two environments are an open field at a baseball park and a downtown urban canyon. The measurements cover the PHY, MAC and higher layers and record signal strength, beam switch times and throughput per beam. The deployments aggregate up to eight frequency channels on up to eight beams. The files are CSV, released as 5GBeams-v0.91.zip and 5GBeams-v0.92.zip on IEEE DataPort, which requires a login and a subscription. The target topics are beam management, deployment configuration, path loss and mmWave throughput.', zh: '5G Beams 包含对美国两个商用 5G mmWave 部署的基于智能手机的测量数据。数据由 University of Minnesota、University of Chicago、Institut
    Teknologi Bandung 和 Celona, Inc. 的研究人员采集，并与 INFOCOM 2022 论文《A Comparative Measurement Study of Commercial 5G mmWave Deployments》配套发布。两个场景分别为棒球场的开阔场地和市区峡谷。测量涵盖 PHY、MAC 及更高层，记录每个波束的信号强度、波束切换时间和吞吐量。部署中最多可聚合 8 个频率信道，使用最多 8 个波束。文件为 CSV 格式，以 5GBeams-v0.91.zip 和 5GBeams-v0.92.zip 的形式发布在 IEEE DataPort 上，下载需要登录并具备订阅。目标研究主题为波束管理、部署配置、路径损耗和 mmWave 吞吐量。'}
