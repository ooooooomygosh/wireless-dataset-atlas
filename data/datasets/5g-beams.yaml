summary: {en: 'Measurements from two US commercial 5G mmWave deployments, a baseball park and a downtown urban canyon, stored as CSV files with per-beam signal strength, beam switch times and throughput. The frequency band is not stated.', zh: 来自美国两个商用 5G mmWave 部署的测量数据，场景分别为棒球场和市区峡谷，以 CSV 文件存储，包含每波束信号强度、波束切换时间和吞吐量。文中未说明频段。}
