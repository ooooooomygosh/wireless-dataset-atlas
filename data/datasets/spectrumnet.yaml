summary: {en: 'Multiband 3D radio maps from ray tracing over 11 terrain types and 3 climate zones, at heights of 1.5, 30 and 200 m and five carrier frequencies from 150 MHz to 22 GHz.', zh: 基于射线追踪的多频段三维无线地图，涵盖 11 种地形与 3 种气候带，高度为 1.5、30、200 m，载频共五个，从 150 MHz 到 22 GHz。}
overview: {en: 'SpectrumNet is a radio map benchmark built for generative models. Each sample covers a 1.28 km x 1.28 km area at 10 m resolution (128 x 128 pixels). Areas come from real geography with building heights taken from OpenStreetMap and completed manually with Google Maps. The paper names five bands (150 MHz, 1.5, 1.7, 3.5 and 22 GHz), three heights (1.5, 30 and 200 m), 11 terrain scenarios (dense urban, ordinary urban, rural, suburban, mountainous, forest, desert, grassland, island, ocean, lake) and 3 climate scenarios (tropics, subtropics, temperate), with weather effects following ITU recommendations. Each area holds one NPZ file with terrain and building data, five JPG visualisations and fifteen PNG radio maps, one per band and height. The paper does not name the ray-tracing software. The authors state that the sample count will grow in later versions.', zh: SpectrumNet 是为生成式模型构建的无线地图基准。每个样本覆盖 1.28 km x 1.28 km 区域，分辨率 10 m（128 x 128 像素）。区域取自真实地理，建筑高度来自 OpenStreetMap 并用 Google
    Maps 人工补全。论文给出五个频段（150 MHz、1.5、1.7、3.5、22 GHz）、三个高度（1.5、30、200 m）、11 种地形（密集城区、普通城区、乡村、郊区、山地、森林、沙漠、草原、岛屿、海洋、湖泊）和 3 种气候（热带、亚热带、温带），天气影响依据 ITU 建议。每个区域包含一个存放地形与建筑数据的 NPZ 文件、五张 JPG 可视化图和十五张 PNG 无线地图（每个频段与高度各一张）。论文未说明所用射线追踪软件。作者表示后续版本会增加样本数。}
