  text: {en: 'Public files are named X_test.pt, one per subdirectory (for example D17/X_test.pt and D17CE/X_test.pt). The Hugging Face file listing gives file sizes from 65,537,591 bytes (RM_070703) to 266,294,839 bytes (Argos_43 and Argos_56). The paper describes the data as 3D space–time–frequency.', zh: '公开文件名为 X_test.pt，每个子目录一个（例如 D17/X_test.pt 与 D17CE/X_test.pt）。Hugging Face 文件列表显示单个文件大小从 65,537,591 字节（RM_070703）到 266,294,839 字节（Argos_43 与 Argos_56）。15 个文件与两个小型仓库文件合计 2.74 GB。论文将数据描述为三维时空频（3D space–time–frequency）。'}
