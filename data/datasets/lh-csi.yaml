summary: {en: 'LH–CSI is the heterogeneous spatial–temporal–frequency corpus used by WiFo-2, combining statistical, ray-traced, and measured sources. The complete corpus described in the paper must be recorded separately from currently public evaluation assets.', zh: LH–CSI 是 WiFo-2 所使用的异构时空频语料，包含统计、射线追踪与实测来源。论文描述的完整语料与当前公开评估资产必须分开记录。}
checked: '2026-11-06'
pipeline:
  summary: {en: 'Eight upstream sources form 78 subsets. The public release contains only some test tensors, Dense weights, and inference programs; temporal, spatial, and frequency input structures define multiple reconstruction tasks.', zh: 八种上游构成 78 个子集；公开版本仅释放部分测试张量、Dense 权重与推理程序，输入按时间、空间和频率结构生成多种重建任务。}
  stages:
  - title: {en: Collect eight channel sources, zh: 汇集八种信道来源}
    detail: {en: 'The paper combines statistical-model, measured, and ray-traced sources into LH–CSI, covering 78 subsets and 11.6 billion CSI points.', zh: 论文将统计模型、实测和射线追踪来源组合成 LH–CSI，覆盖 78 个子集和 116 亿 CSI 点。}
    inputs:
    - {en: QuaDRiGa、PKU-GBSM, zh: QuaDRiGa、PKU-GBSM}
    - {en: LuViRA、DICHASUS、Argos、PKU-RM, zh: LuViRA、DICHASUS、Argos、PKU-RM}
    - {en: DeepMIMO、PKU-RT, zh: DeepMIMO、PKU-RT}
    outputs:
    - {en: Subsets with source identities, zh: 有来源身份的子集集合}
    controls:
    - {en: 'Author paper: a count of CSI points is not directly equivalent to a count of independent training samples.', zh: 作者论文：CSI 点的计数不能直接等同于独立训练样本数。}
    checks:
    - {en: 'Reproduction recommendation: record source, measurement/simulation method, carrier frequency, and array; check repeated exposure by source.', zh: 复现建议：记录来源、测量/仿真方式、载频与阵列，以来源为单位检查重复暴露。}
  - title: {en: Organize heterogeneous spatial–temporal–frequency samples, zh: 组织异构时空频样本}
    detail: {en: 'The paper organizes spatial–temporal–frequency channels by source. The model handles variable sizes using two real/imaginary channels and 3D patches. Public model.py patchify accepts [B,2,T,H,W] and partitions using temporal length u and spatial/frequency block length p.', zh: '论文按各来源组织时空频信道，模型以实虚双通道及三维 patch 处理可变尺寸；公开 model.py 的 patchify 接收 [B,2,T,H,W]，以时间长度 u 和空间/频率块长 p 划分。'}
    inputs:
    - {en: Complex CSI from each upstream source, zh: 各上游复 CSI}
    - {en: 'Time, antenna, and subcarrier dimensions', zh: 时间、天线、子载波维度}
    outputs:
    - {en: Real/imaginary CSI tensors retaining source dimensions, zh: 具有来源尺寸的实虚 CSI 张量}
    - {en: Spatial–temporal–frequency tokens, zh: 时空频 token}
    controls:
    - {en: 'To verify: calibration, cropping, normalization, and windowing rules for each upstream source require Supplementary Notes or original processing scripts.', zh: 待核实：每个上游的校准、裁剪、归一化和窗口规则需查 Supplementary Notes 或原始处理脚本。}
    checks:
    - {en: 'Reproduction recommendation: establish the physical meaning of H/W from files and configurations; do not apply one arbitrary resize to every source.', zh: 复现建议：H/W 必须根据文件与配置确认其物理语义；不能对全部来源套用一个任意 resize。}
  - title: {en: Load current public test views, zh: 读取当前公开测试视图}
    detail: {en: 'The public loader accepts a tensor, a specific tuple element, or a dictionary containing test/X_test/test_data. It checks dimensionality and the sequence length on axis 2. The test DataLoader does not shuffle.', zh: 公开加载器接受 tensor、特定 tuple 元素或含 test/X_test/test_data 的 dict，检查维数与第 2 轴的序列长度；测试 DataLoader 不打乱顺序。}
    inputs:
    - {en: 15 X_test.pt files, zh: 15 个 X_test.pt 文件}
    - {en: Corresponding dataset configurations, zh: 对应数据集配置}
    outputs:
    - {en: Test batches ready for inference, zh: 可供推理的测试 batch}
    controls:
    - {en: 'Author release: the public file tree and the complete 78-subset training corpus have different scopes.', zh: 作者发布：公开文件树与完整 78 子集训练语料范围不同。}
    - {en: 'To verify: the public loader does not describe all normalization applied before saving.', zh: 待核实：公开加载器没有说明保存前的全部归一化。}
    checks:
    - {en: 'Reproduction recommendation: after loading, record dtype, shape, and units. Do not infer a uniform dictionary schema from the .pt extension.', zh: 复现建议：实际读取后记录 dtype、shape 和单位；不要根据 .pt 扩展名推断统一字典 schema。}
  - title: {en: Task masks and input noise, zh: 任务 mask 与输入噪声}
    detail: {en: 'The current inference program uses random=0.85, temporal=0.25, fre=0.25, or CE=[4,1,12]. Datasets with CE run only CE; Argos/Dich default to random and fre. model.forward adds 20 dB Gaussian noise based on batch mean-square values, then encodes only visible inputs.', zh: '当前推理器采用 random=0.85、temporal=0.25、fre=0.25 或 CE=[4,1,12]；带 CE 的数据集只运行 CE，Argos/Dich 默认运行 random 与 fre。model.forward 按 batch 均方值加入 20 dB 高斯噪声，再仅编码可见输入。'}
    inputs:
    - {en: Public test batches, zh: 公开测试 batch}
    - {en: Task name and seed, zh: 任务名与 seed}
    outputs:
    - {en: Task-specific observations, zh: 任务化观测}
    - {en: Masks and clean targets, zh: mask 与干净目标}
    controls:
    - {en: 'Author code: dataset names and parameters control task routing.', zh: 作者代码：task 分流由数据集名称和参数控制。}
    - {en: 'Author code: noise power is determined by mean(imgs²) over the entire batch.', zh: 作者代码：噪声功率由整个 batch 的 mean(imgs²) 确定。}
    checks:
    - {en: 'Reproduction recommendation: check task-name matching, masked axes, and batch sensitivity. Interpret mask values by strategy; they cannot all be described as visible fractions.', zh: 复现建议：检查任务名匹配、遮挡轴和 batch 敏感性；mask 数字需随策略解释，不能统一称为可见比例。}
  - title: {en: Compute reconstruction error at masked positions, zh: 计算被遮挡位置的重建误差}
    detail: {en: 'inference.py selects predictions and targets where mask==1, divides summed real/imaginary squared errors by target power to obtain per-sample NMSE, averages across samples, then converts to dB.', zh: inference.py 取 mask==1 的预测与目标，以实部和虚部平方误差之和除以目标功率，先得每个样本的 NMSE，再按样本数平均并转换为 dB。}
    inputs:
    - {en: Model predictions, zh: 模型预测}
    - {en: Clean targets, zh: 干净目标}
    - {en: mask, zh: mask}
    outputs:
    - {en: 'NMSE for each dataset, task, and mask', zh: 每数据集、每任务、每 mask 的 NMSE}
    controls:
    - {en: 'Author code: the denominator is clamped at 1e-12. This differs from aggregate NMSE obtained by first summing errors and powers over all data.', zh: 作者代码：分母以 1e-12 截断；不是先将全数据误差和功率相加的汇总 NMSE。}
    checks:
    - {en: 'Reproduction recommendation: check empty masks, low-power samples, and sample weighting; downstream communication decisions still require separately defined tasks.', zh: 复现建议：核对空 mask、低功率样本与样本加权方式；下游通信决策仍需另定义任务。}
  - title: {en: Separate public reproduction assets from the paper's training pipeline, zh: 区分公开复现资产与论文训练链}
    detail: {en: The current public repository provides an inference workflow. Full training code and broader data are being released gradually according to the roadmap. Competition train/val/test permissions are managed separately from the public Hugging Face test sets., zh: 当前公开仓库提供推理工作流；完整训练代码和更广数据按发布路线图逐步开放。竞赛渠道的 train/val/test 权限与公开 Hugging Face 测试集另行管理。}
    inputs:
    - {en: Test tensors, zh: 测试张量}
    - {en: Four Dense checkpoints, zh: 四个 Dense checkpoints}
    - {en: Inference scripts, zh: 推理脚本}
    outputs:
    - {en: Executable public inference assets, zh: 可运行的公开推理资产}
    - {en: Paper training scale and public-release scope, zh: 论文训练规模与公开范围说明}
    controls:
    - {en: 'Author release: as of the verification date, public test assets should not be labeled the complete LH–CSI training set.', zh: 作者发布：截至核查日不应把公开测试资产标成完整 LH–CSI 训练集。}
    checks:
    - {en: 'Reproduction recommendation: first reproduce public tasks with the specified checkpoint, then apply for additional training assets; preserve license and redistribution boundaries.', zh: 复现建议：先复现指定 checkpoint 的公开任务，再申请额外训练资产；保留许可与再分发边界。}
  scope: {en: Record the paper-level LH–CSI construction pipeline separately from WiFo-2's current public inference pipeline. The current repository is not a complete training-reproduction package., zh: LH–CSI 的论文级构建链与 WiFo-2 当前公开推理链分开记录；当前仓库不是完整训练复现包。}
