usage:
- {en: First confirm the public scope and directory mapping in the official README; set size and MoE parameters for the selected checkpoint., zh: 在官方 README 先确认公开范围及目录映射；按 checkpoint 指定 size 和 MoE 参数。}
- {en: Download only the required subsets; an example X_test.pt is not the complete LH–CSI corpus., zh: 只下载所需子集；示例 X_test.pt 不是全量 LH–CSI。}
- {en: 'Save masks, sampling scales, and original metrics separately for fre / temporal / CE tasks.', zh: 按 fre / temporal / CE 任务分别保存 mask、采样尺度和原始指标。}
- {en: 'For pretraining research, verify training-corpus availability first; do not reuse public test sets as pretraining data. No inference was run for this card.', zh: 若研究预训练，先核实训练语料可得性；不将开放测试集反向用作预训练。此卡未运行推理。}
field_notes:
- label: {en: CSI, zh: CSI}
  text: {en: Verified only for released CSI subsets; this does not establish that all downstream-task data described in the paper are public., zh: 仅对已公开的 CSI 子集确认；不代表所有论文下游任务数据已公开。}
- label: {en: Time, zh: 时间}
  text: {en: Subsets have different sampling resolutions; inspect the time scale of each subset., zh: 子集采样粒度不同；必须读每个子集的时间尺度。}
- label: {en: Cross-frequency pairing, zh: 跨频配对}
  text: {en: 'Current public fre evaluation reconstructs frequency-domain content within a tensor and provides no paired interface for two carrier frequencies. The paper separately constructs QuaDRiGa dual-band beam tasks and QuaDRiGa/DICHASUS cross-band CSI tasks. Exact carriers, pairing, and downstream release scope require checking the respective task.', zh: 当前公开 fre 评估为张量内频域重建，不提供两载频的配对接口。论文另建 QuaDRiGa 双频波束任务和 QuaDRiGa/DICHASUS cross-band CSI 任务；精确载频、配对与下游开放范围需查对应任务。}
- label: {en: Paths, zh: 路径}
  text: {en: 'The current public reconstruction interface does not provide per-path coefficients, delays, or interaction tables. Physical path ground truth requires returning to upstream DeepMIMO/PKU-RT assets. A delay-domain transform of CSI is not complete physical path annotation.', zh: 当前公开重建接口不提供逐径系数、时延或交互表；若需要物理路径真值，应回溯 DeepMIMO/PKU-RT 上游资产。CSI 的延迟域变换不等于完整物理路径标注。}
- label: {en: Position, zh: 位置}
  text: {en: The current public reconstruction interface has no coordinate-label inputs/outputs. The paper's separately constructed DICHASUS positioning task has 2D coordinate supervision; its data release is recorded separately from the X_test.pt reconstruction interface., zh: 当前公开重建接口不提供坐标标签输入/输出。论文另建的 DICHASUS 定位任务具有二维坐标监督；该任务数据的发布情况与 X_test.pt 重建接口分开记录。}
- label: {en: RGB, zh: RGB}
  text: {en: The current public zero-shot reconstruction interface consumes only CSI. The paper separately uses a SynthSoM image–CSI downstream dataset to validate vision-aided frequency prediction. This image task is separate from the eight-source LH–CSI pretraining corpus., zh: 当前公开零样本重建接口只消费 CSI。论文另用 SynthSoM 图像–CSI 下游集验证视觉辅助频域预测；此图像任务与八来源 LH–CSI 预训练语料分开。}
- label: {en: LiDAR, zh: LiDAR}
  text: {en: The current public zero-shot reconstruction interface provides no LiDAR. Multimodal downstream validation in the main text uses images or received signals; upstream platform capabilities do not establish that this released interface contains point clouds., zh: 当前公开零样本重建接口不提供 LiDAR；主文的多模态下游验证使用图像或接收信号，不能从上游平台能力推定本发布接口含点云。}
- label: {en: Radar, zh: 雷达}
  text: {en: The current public zero-shot reconstruction interface provides no raw radar observations. The paper's CSI sensing tasks are not independent radar data., zh: 当前公开零样本重建接口不提供雷达原始观测；论文中的 CSI 感知任务不等同于独立雷达数据。}
- label: {en: Multi-user, zh: 多用户}
  text: {en: 'Derivable refers only to constructing user sets at the channel level: first trace each subset to verify a common BS, array/amplitude scale, and noise convention, then combine CSI and define power and scheduling. The Argos source does not establish that public test tensors retain a synchronized user axis. This is a methodological condition, not a claim of synchronized multi-UE measurements.', zh: 可计算仅指信道层用户集合构造：先回溯子集确认共同 BS、阵列/幅度标度与噪声约定，再组合 CSI 并定义功率和调度。Argos 的上游来源不能证明公开测试张量保留同步用户轴；此项是方法条件，不是同步多 UE 实测声明。}
- label: {en: Multi-BS, zh: 多基站}
  text: {en: 'The current public reconstruction interface provides no BS IDs, cross-BS link sets, or coordination protocol. Multiple sources, scenarios, and distributed antenna elements do not automatically form synchronized multi-BS data.', zh: 当前公开重建接口不提供 BS ID、跨 BS 链路集合或协调协议。多种来源、场景和分布式阵元不自动组成同步多 BS 数据。}
- label: {en: Beam labels, zh: 波束标签}
  text: {en: 'Beam gains/labels can be calculated from complex CSI when subset array geometry, amplitude scaling, and codebooks are all explicit. The paper''s dual-band beam task uses a separately constructed QuaDRiGa downstream dataset.', zh: 在子集阵列几何、幅度标度与码本均明确时，可从复 CSI 计算 beam gain/labels；论文的双频 beam 任务使用另建 QuaDRiGa 下游集。}
tools: [awesome-channel-foundation-models]
overview: {en: 'LH-CSI is the heterogeneous channel corpus used to pretrain WiFo-2, a space–time–frequency foundation model reported in National Science Review (DOI 10.1093/nsr/nwag500; arXiv:2511.22222). The corpus contains 11.6 billion CSI points in 78 coarse- and fine-grained subsets, drawn from eight sources: QuaDRiGa, PKU-GBSM, LuViRA, DICHASUS, Argos, PKU-RM, DeepMIMO and PKU-RT. The paper describes the sources as statistical channel modelling, real-world measurement and ray tracing, with carrier frequencies from sub-6 GHz to the terahertz band, and scenarios that include factories, schools, UAV communications, and indoor and outdoor environments. 81% of the CSI points are used for pretraining and 19% form a zero-shot reconstruction subset. The public Hugging Face repository pku-pcni-lab/WiFo-2 holds 15 X_test.pt zero-shot test tensors in 15 subdirectories, 2.74 GB in total, and its listed license is MIT. The GitHub repository PKU-PCNI/WiFo-2 provides inference code for released checkpoints
    and no training code. The SoM Challenge train, validation and test splits are given to registered participants, and their redistribution is prohibited.', zh: 'LH-CSI 是用于预训练 WiFo-2 的异构信道语料。WiFo-2 是发表于 National Science Review 的时空频基础模型（DOI 10.1093/nsr/nwag500；arXiv:2511.22222）。语料包含 116 亿个 CSI 点，分为 78 个粗粒度与细粒度子集，来源为八个数据源：QuaDRiGa、PKU-GBSM、LuViRA、DICHASUS、Argos、PKU-RM、DeepMIMO 与 PKU-RT。论文将这些来源描述为统计信道建模、实测与射线追踪，载频从 sub-6 GHz 覆盖到太赫兹频段，场景包括工厂、学校、UAV 通信以及室内与室外环境。81% 的 CSI 点用于预训练，19% 构成零样本重建子集。公开 Hugging Face 仓库 pku-pcni-lab/WiFo-2 含 15 个 X_test.pt 零样本测试张量，分布于 15 个子目录，合计 2.74 GB，页面列出的许可证为 MIT。GitHub 仓库 PKU-PCNI/WiFo-2 提供已发布 checkpoint 的推理代码，不含训练代码。SoM Challenge 的 train、val 与 test 划分提供给注册参赛者，禁止再分发。'}
