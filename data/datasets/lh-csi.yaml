provenance:
- {en: 'Eight upstream sources: QuaDRiGa, PKU-GBSM, LuViRA, DICHASUS, Argos, PKU-RM, DeepMIMO, and PKU-RT (explicitly listed in the main-text Methods)', zh: 八种上游：QuaDRiGa、PKU-GBSM、LuViRA、DICHASUS、Argos、PKU-RM、DeepMIMO、PKU-RT（主文 Methods 明列）}
- {en: Preserve spatial–temporal–frequency dimensions and sampling resolution by source, zh: 按来源保留时空频维度和采样粒度}
- {en: Form 78 LH–CSI subsets, zh: 组成 78 个 LH–CSI 子集}
- {en: Pretraining and multitask evaluation in the paper, zh: 论文预训练与多任务评测}
- {en: Selective release of test subsets and model-inference assets, zh: 选择性公开测试子集与模型推理资产}
technical_notes:
- {en: 'Literature-supported: the paper uses statistical, RT, and measured sources; no single propagation model describes the entire collection.', zh: 文献支持：论文同时使用统计、RT、实测来源，不能为全集指定单一传播模型。}
- {en: 'Official design: public directory names such as D17, Argos_43, and O1drone map to QC17, AC6, and DEC3 in the paper. Interpret model inputs using this mapping.', zh: 官方设计：公开目录名如 D17、Argos_43、O1drone 对应论文中的 QC17、AC6、DEC3；模型输入解释必须跟随映射。}
- {en: 'Inference: when frequency, source, hardware, and task are correlated, models may exploit domain-specific cues; use single-factor and cross-domain tests.', zh: 推断：频率、数据源、硬件和任务相互相关时，模型可能利用域特征，需单因素及交叉域测试。}
- {en: 'Literature-supported: the paper''s Discussion states that simulation and Sub-6 data still dominate the corpus. THz coverage does not imply balanced coverage across bands.', zh: 文献支持：论文 Discussion 明确语料仍由仿真和 Sub-6 数据主导；覆盖 THz 不表示各频段均衡。}
limitations:
- {en: The broad Data Availability statement does not establish that complete training code and all splits are public; check the specific asset pages., zh: 论文 Data Availability 的概括声明不等于完整训练代码和全部 splits 已公开；以具体资产页为准。}
- {en: 11.6 billion CSI points cannot be directly compared with “2.5 million channel samples” in a dataset-size bar chart., zh: 116 亿 CSI points 不能与“250 万信道样本”直接作规模柱状比较。}
- {en: A hardware demonstration does not establish that all 12 tasks were independently validated in OTA systems., zh: 有硬件演示不等于所有 12 个任务均在 OTA 系统独立验证。}
- {en: The main-text cross-band tasks use QuaDRiGa- and DICHASUS-derived data. The exact two bands and pairing method require Supplementary Note S7; these results do not establish complete measured 3.5→28 GHz pairing., zh: 主文 cross-band 任务使用 QuaDRiGa 与 DICHASUS 派生数据；具体两频段及配对方式需读 Supplementary Note S7，不能据此标为真实 3.5→28 GHz 完整配对。}
