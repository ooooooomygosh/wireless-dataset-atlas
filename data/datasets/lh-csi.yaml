summary: {en: 'LH–CSI is the heterogeneous spatial–temporal–frequency corpus used by WiFo-2, combining statistical, ray-traced, and measured sources. The complete corpus described in the paper must be recorded separately from currently public evaluation assets.', zh: LH–CSI 是 WiFo-2 所使用的异构时空频语料，包含统计、射线追踪与实测来源。论文描述的完整语料与当前公开评估资产必须分开记录。}
checked: '2026-11-06'
pipeline:
  summary: {en: 'Eight upstream sources form 78 subsets containing 11.6 billion CSI points. The public release contains 15 zero-shot test tensors, four Dense checkpoints and inference code. The inference code covers random masking, temporal masking, frequency masking and channel estimation (CE).', zh: 八个上游来源构成 78 个子集，共含 116 亿个 CSI 点。公开发布包含 15 个零样本测试张量、四个 Dense 检查点与推理代码。推理代码覆盖随机遮挡、时间遮挡、频域遮挡与信道估计（CE）任务。}
  stages:
  - title: {en: Collect the eight upstream sources, zh: 汇集八个上游来源}
    detail: {en: 'The paper''s Methods list QuaDRiGa, PKU-GBSM, LuViRA, DICHASUS, Argos, PKU-RM, DeepMIMO and PKU-RT as the sources of LH-CSI. The paper says these cover statistical channel modelling, real-world measurement and ray tracing.', zh: 论文方法部分列出 QuaDRiGa、PKU-GBSM、LuViRA、DICHASUS、Argos、PKU-RM、DeepMIMO 与 PKU-RT 作为 LH-CSI 的来源，并称其涵盖统计信道建模、实测与射线追踪。}
    inputs:
    - {en: Eight upstream channel sources, zh: 八个上游信道来源}
    outputs:
    - {en: 78 subsets with source identities, zh: 带有来源标识的 78 个子集}
    controls:
    - {en: 'The paper states split sizes in CSI samples: 9,000 training, 1,000 validation and 2,000 test samples for each source dataset. The total is given in CSI points (11.6 billion).', zh: '论文以 CSI 样本数给出划分规模：每个来源数据集 9,000 个训练样本、1,000 个验证样本与 2,000 个测试样本；总量以 CSI 点计，为 116 亿。'}
    checks:
    - {en: 'Record the source, measurement or simulation method, carrier frequency and array of each subset before pooling them.', zh: 合并子集前，逐个记录其来源、测量或仿真方式、载频与阵列。}
  - title: {en: Organize CSI as real and imaginary 3D tensors, zh: 将 CSI 组织为实虚三维张量}
    detail: {en: 'The paper organizes space-time-frequency channels by source. In model.py, patchify accepts tensors of shape [B, 2, T, H, W] with real and imaginary channels, splits T by t_patch_size and splits H and W by patch_size.', zh: '论文按来源组织时空频信道。model.py 中的 patchify 接收形状为 [B, 2, T, H, W] 的张量（实部与虚部两个通道），按 t_patch_size 划分 T 维，按 patch_size 划分 H、W 维。'}
    inputs:
    - {en: 'Complex CSI from each source, with time, antenna and subcarrier dimensions', zh: 各来源的复 CSI，含时间、天线与子载波维度}
    outputs:
    - {en: Real and imaginary tensors and space-time-frequency tokens, zh: 实虚张量与时空频 token}
    checks:
    - {en: 'patchify asserts that H and W are divisible by patch_size and T by t_patch_size, so each source''s shape must satisfy this.', zh: patchify 断言 H、W 可被 patch_size 整除、T 可被 t_patch_size 整除，因此每个来源的形状都须满足该条件。}
  - title: {en: Load the released zero-shot test tensors, zh: 读取已发布的零样本测试张量}
    detail: {en: 'The public loader takes a tensor directly, the third element of a (train, validation, test) tuple, or the value under the key test, X_test or test_data in a dictionary. It requires at least three dimensions and the same length on the third axis (index 2) for all datasets in one run. The test DataLoader does not shuffle.', zh: '公开加载器可直接读取张量、(train, validation, test) 元组中的第三个元素，或字典中键为 test、X_test 或 test_data 的值。它要求张量至少三维，且同一次运行中各数据集的第三维（索引 2）长度一致。测试 DataLoader 不打乱顺序。'}
    inputs:
    - {en: 15 X_test.pt files and the matching dataset names, zh: 15 个 X_test.pt 文件及对应数据集名}
    outputs:
    - {en: Test batches for inference, zh: 用于推理的测试批次}
    controls:
    - {en: 'Author release: the public file tree and the complete 78-subset corpus have different scopes.', zh: 作者发布：公开文件树与完整 78 子集语料的范围不同。}
    - {en: The loader applies no normalization step., zh: 加载器不做任何归一化处理。}
    checks:
    - {en: 'After loading, record dtype, shape and units, since the loader accepts several payload layouts.', zh: 加载后记录 dtype、形状与单位，因为加载器接受多种数据结构。}
  - title: {en: Apply task masks and input noise, zh: 施加任务遮挡与输入噪声}
    detail: {en: 'With the default mask_strategy_random batch, inference.py uses random=0.85, temporal=0.25, fre=0.25 or CE=[4, 1, 12]. Dataset names containing CE run only CE; names containing Argos or Dich run random and fre; other datasets run random, temporal and fre. model.forward adds Gaussian noise at 20 dB SNR, with noise power set from the mean square of the whole input batch, and the encoder receives only the visible tokens.', zh: '在默认的 mask_strategy_random batch 设置下，inference.py 使用 random=0.85、temporal=0.25、fre=0.25 或 CE=[4, 1, 12]。名称含 CE 的数据集只运行 CE；名称含 Argos 或 Dich 的数据集运行 random 与 fre；其他数据集运行 random、temporal 与 fre。model.forward 以 20 dB 信噪比加入高斯噪声，噪声功率由整个输入批次的均方值确定；编码器只接收可见 token。'}
    inputs:
    - {en: Public test batches, zh: 公开测试批次}
    - {en: Dataset name and random seed, zh: 数据集名与随机种子}
    outputs:
    - {en: 'Masked observations, masks and clean targets', zh: 遮挡观测、mask 与干净目标}
    controls:
    - {en: Task routing is set by the dataset name and the mask_strategy_random argument., zh: 任务分流由数据集名称与 mask_strategy_random 参数决定。}
    checks:
    - {en: 'CE uses the list [4, 1, 12] rather than a masking ratio, so mask values mean different things across strategies.', zh: 'CE 使用列表 [4, 1, 12] 而非遮挡比例，因此各策略下的 mask 数值含义不同。'}
  - title: {en: Compute NMSE at masked positions, zh: 计算遮挡位置的 NMSE}
    detail: {en: 'inference.py keeps predictions and clean targets where mask equals 1. For each sample it divides the mean squared real and imaginary error over the masked tokens by the mean target power, clamps the denominator at 1e-12, averages over samples and converts the result to dB.', zh: inference.py 取 mask 等于 1 的位置上的预测值与干净目标。对每个样本，先计算被遮挡 token 上实部与虚部平方误差之和的均值，再除以目标功率均值（分母下限为 1e-12）；随后对样本取平均，并换算为 dB。}
    outputs:
    - {en: 'NMSE for each dataset, task and mask setting', zh: 每个数据集、任务与遮挡设置的 NMSE}
    controls:
    - {en: 'The result is a sample average of per-sample ratios, not a pooled NMSE over all data.', zh: 结果是逐样本比值的样本平均，而非对全部数据汇总后的 NMSE。}
    checks:
    - {en: 'An empty test split raises an error; samples with near-zero target power are clamped, not removed.', zh: 空测试集会触发报错；目标功率接近零的样本被截断而非剔除。}
  - title: {en: Separate public inference assets from training assets, zh: 区分公开推理资产与训练资产}
    detail: {en: 'The public repository contains inference code, four Dense checkpoints and zero-shot test tensors. The README lists the remaining code, checkpoints and supporting resources as planned, with no release date. Competition train, validation and test splits are provided separately to registered participants after an approval step.', zh: 公开仓库包含推理代码、四个 Dense 检查点与零样本测试张量。README 将其余代码、检查点与配套资源列为计划内容，未给出发布日期。竞赛用的 train、validation 与 test 划分单独提供给注册参赛者，需经审批。}
    inputs:
    - {en: 'Test tensors, Dense checkpoints and inference scripts', zh: 测试张量、Dense 检查点与推理脚本}
    outputs:
    - {en: Runnable public inference workflow, zh: 可运行的公开推理流程}
    controls:
    - {en: The public test assets are not the complete LH-CSI training set., zh: 公开测试资产并非完整的 LH-CSI 训练集。}
    checks:
    - {en: Redistribution of the SoM Challenge splits is prohibited., zh: SoM Challenge 划分禁止再分发。}
  scope: {en: The public repository is an inference package for the released checkpoints. It contains no training code and does not reproduce the LH-CSI construction or the pretraining., zh: 公开仓库是已发布检查点的推理包，不含训练代码，无法复现 LH-CSI 的构建过程或预训练。}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: 'The public release contains 15 X_test.pt zero-shot test tensors, four Dense checkpoints and inference code.', zh: 公开发布包含 15 个零样本测试张量 X_test.pt、四个 Dense 检查点与推理代码。}
- label: {en: Derived outputs, zh: 派生输出}
  text: {en: 'Masked-position NMSE in dB for each dataset, task and mask setting. The public code computes no communication metrics.', zh: 每个数据集、任务与遮挡设置下遮挡位置的 NMSE（dB）。公开代码不计算通信指标。}
- label: {en: Splits, zh: 划分}
  text: {en: 'The paper assigns 81% of LH-CSI to pretraining and 19% to zero-shot reconstruction. Each source dataset has 9,000, 1,000 and 2,000 CSI samples for training, validation and testing (Methods 4.1).', zh: '论文将 81% 的 LH-CSI 用于预训练，19% 用于零样本重建。每个来源数据集的训练、验证与测试样本数分别为 9,000、1,000 与 2,000（方法 4.1）。'}
- label: {en: Released directories, zh: 已发布目录}
  text: {en: 'The release has 15 directories: D17, D18, D19, Argos_43, Argos_56, O1drone, RM_070703, RM_070704 and SionnaRT15, plus the CE variants D17CE, D18CE, D19CE, O1droneCE1, RM_070703_CE and RM_070704_CE. No directory with a DICHASUS name is released.', zh: 发布包含 15 个目录：D17、D18、D19、Argos_43、Argos_56、O1drone、RM_070703、RM_070704 与 SionnaRT15，以及 CE 变体 D17CE、D18CE、D19CE、O1droneCE1、RM_070703_CE 与 RM_070704_CE。未发布任何 DICHASUS 命名的目录。}
provenance:
- {en: 'Eight upstream sources: QuaDRiGa, PKU-GBSM, LuViRA, DICHASUS, Argos, PKU-RM, DeepMIMO, and PKU-RT (explicitly listed in the main-text Methods)', zh: 八种上游：QuaDRiGa、PKU-GBSM、LuViRA、DICHASUS、Argos、PKU-RM、DeepMIMO、PKU-RT（主文 Methods 明列）}
- {en: Preserve spatial–temporal–frequency dimensions and sampling resolution by source, zh: 按来源保留时空频维度和采样粒度}
- {en: Form 78 LH–CSI subsets, zh: 组成 78 个 LH–CSI 子集}
- {en: Pretraining and multitask evaluation in the paper, zh: 论文预训练与多任务评测}
- {en: Selective release of test subsets and model-inference assets, zh: 选择性公开测试子集与模型推理资产}
technical_notes:
- {en: 'The paper''s sources cover statistical channel modelling, real-world measurement and ray tracing.', zh: 论文来源涵盖统计信道建模、实测与射线追踪。}
- {en: 'The README maps released directory names to paper names, for example D17 to QC17, Argos_43 to AC6 and O1drone to DEC3. The mapping covers all 15 directories.', zh: README 给出发布目录名与论文名称的对应关系，例如 D17 对应 QC17、Argos_43 对应 AC6、O1drone 对应 DEC3，覆盖全部 15 个目录。}
- {en: 'Reconstruction targets are the clean CSI before noise is added, and NMSE is scored only at masked positions.', zh: 重建目标为加噪前的干净 CSI，NMSE 只在被遮挡位置计算。}
limitations:
- {en: 'The paper''s Data Availability statement says datasets, weights and source code are public. The repository holds inference code, four Dense checkpoints and 15 zero-shot test tensors, and no training code.', zh: 论文数据可用性声明称数据集、权重与源代码均已公开。仓库实际提供推理代码、四个 Dense 检查点与 15 个零样本测试张量，不含训练代码。}
- {en: 'The 11.6 billion figure counts CSI points, while the paper gives split sizes in CSI samples (9,000, 1,000 and 2,000 per source dataset). The two counts are not interchangeable.', zh: '116 亿这一数字统计的是 CSI 点数，而论文以 CSI 样本数给出划分规模（每个来源数据集 9,000、1,000 与 2,000）。两者不可互换。'}
- {en: 'The over-the-air prototype covers three tasks (frequency-domain channel prediction, channel estimation and scenario classification). The paper reports twelve tasks in total.', zh: 空口原型实验覆盖三项任务（频域信道预测、信道估计与场景分类），论文共报告 12 项任务。}
- {en: The main text evaluates cross-band channel prediction on one QuaDRiGa-simulated dataset and one DICHASUS-derived dataset., zh: 主文的跨频段信道预测在一个 QuaDRiGa 仿真数据集与一个 DICHASUS 派生数据集上评估。}
history:
- {en: '2025-11-27: arXiv:2511.22222 (v1) submitted.', zh: '2025-11-27：arXiv:2511.22222（v1）提交。'}
- {en: '2026-08-02: Inference code, Tiny-Dense and some zero-shot test splits released.', zh: 2026-08-02：发布推理代码、Tiny-Dense 与部分零样本测试划分。}
- {en: '2026-08-17: Paper published in National Science Review.', zh: 2026-08-17：论文发表于 National Science Review。}
- {en: '2026-09-20: Small-, Little- and Base-Dense checkpoints released.', zh: 2026-09-20：发布 Small-、Little- 与 Base-Dense 检查点。}
usage:
- {en: 'Match --size and --MoE to the checkpoint: tinypro for Tiny-Dense, littlepro for Little-Dense, smallpro for Small-Dense and basepro1 for Base-Dense, always with --MoE False.', zh: --size 与 --MoE 须与检查点对应：Tiny-Dense 用 tinypro，Little-Dense 用 littlepro，Small-Dense 用 smallpro，Base-Dense 用 basepro1，且均设 --MoE False。}
- {en: 'Download only the subsets you need. Each X_test.pt is one zero-shot test subset, not the complete LH-CSI corpus.', zh: 只下载所需子集。每个 X_test.pt 是一个零样本测试子集，而非完整 LH-CSI 语料。}
- {en: 'inference.py prints one NMSE value per dataset, task and mask setting. It does not write masks or reconstructions to disk.', zh: inference.py 按数据集、任务与遮挡设置打印一个 NMSE 值，不会把遮挡或重建结果写入磁盘。}
- {en: The public release has no training or validation split., zh: 公开发布不含训练集或验证集。}
field_notes:
- label: {en: CSI, zh: CSI}
  text: {en: Released CSI covers only the 15 zero-shot test subsets. The full 78-subset corpus is not part of the release., zh: 已发布的 CSI 仅包含 15 个零样本测试子集，完整的 78 子集语料不在发布范围内。}
- label: {en: Time, zh: 时间}
  text: {en: 'Subsets differ in the number of subcarriers, antennas and temporal sampling points (paper Fig. 1c).', zh: 各子集的子载波数、天线数与时间采样点数不同（论文图 1c）。}
- label: {en: Cross-frequency pairing, zh: 跨频配对}
  text: {en: 'The public fre task reconstructs frequency content within one tensor. The inference code takes one tensor per dataset and has no second-carrier input. The paper''s dual-band beam task uses a QuaDRiGa-based dataset, and its cross-band CSI task uses QuaDRiGa and DICHASUS-derived data.', zh: 公开的 fre 任务在单个张量内重建频域内容。推理代码每个数据集只接收一个张量，没有第二载频输入。论文的双频波束任务使用基于 QuaDRiGa 的数据集，跨频段 CSI 任务使用 QuaDRiGa 与 DICHASUS 派生数据。}
- label: {en: Paths, zh: 路径}
  text: {en: 'The public interface takes CSI tensors only and provides no per-path coefficients, delays or interaction tables.', zh: 公开接口只接收 CSI 张量，不提供逐径系数、时延或交互表。}
- label: {en: Position, zh: 位置}
  text: {en: The paper's wireless localization task estimates 2D user position from DICHASUS-based CSI. The public reconstruction interface has no coordinate inputs or outputs., zh: 论文的无线定位任务基于 DICHASUS 派生的 CSI 估计二维用户位置。公开重建接口没有坐标输入或输出。}
- label: {en: RGB, zh: RGB}
  text: {en: 'The public zero-shot interface consumes only CSI. The paper''s vision-aided frequency prediction uses a dataset built from SynthSoM, which is not among the eight LH-CSI sources.', zh: 公开零样本接口只接收 CSI。论文的视觉辅助频域预测使用基于 SynthSoM 构建的数据集，该数据集不在八个 LH-CSI 来源之列。}
- label: {en: LiDAR, zh: LiDAR}
  text: {en: The public zero-shot interface provides no LiDAR. The paper's multimodal downstream task uses camera images., zh: 公开零样本接口不提供 LiDAR。论文的多模态下游任务使用相机图像。}
- label: {en: Radar, zh: 雷达}
  text: {en: The public zero-shot interface provides no radar observations. The paper's sensing tasks use CSI., zh: 公开零样本接口不提供雷达观测。论文中的感知任务使用 CSI。}
- label: {en: Multi-user, zh: 多用户}
  text: {en: 'The loader treats each stored sample as one channel tensor and defines no user index. Multi-user sets can be formed only at the channel level, after confirming a common BS, array and amplitude scale and noise convention for each subset.', zh: 加载器把每个存储样本视为一个信道张量，未定义用户索引。多用户集合只能在信道层构造，且需先确认各子集的共同基站、阵列与幅度标度及噪声约定。}
- label: {en: Multi-BS, zh: 多基站}
  text: {en: 'The public reconstruction interface provides no BS IDs, cross-BS link sets or coordination protocol.', zh: 公开重建接口不提供基站 ID、跨基站链路集合或协调协议。}
- label: {en: Beam labels, zh: 波束标签}
  text: {en: 'Beam gains and labels can be computed from complex CSI only when subset array geometry, amplitude scaling and codebook are all specified. The paper''s dual-band beam task uses a separately constructed QuaDRiGa dataset.', zh: 只有在子集阵列几何、幅度标度与码本均已明确时，才能从复 CSI 计算波束增益与标签。论文的双频波束任务使用单独构建的 QuaDRiGa 数据集。}
tools: [awesome-channel-foundation-models]
overview: {en: 'LH-CSI is the heterogeneous channel corpus used to pretrain WiFo-2, a space–time–frequency foundation model reported in National Science Review (DOI 10.1093/nsr/nwag500; arXiv:2511.22222). The corpus contains 11.6 billion CSI points in 78 coarse- and fine-grained subsets, drawn from eight sources: QuaDRiGa, PKU-GBSM, LuViRA, DICHASUS, Argos, PKU-RM, DeepMIMO and PKU-RT. The paper describes the sources as statistical channel modelling, real-world measurement and ray tracing, with carrier frequencies from sub-6 GHz to the terahertz band, and scenarios that include factories, schools, UAV communications, and indoor and outdoor environments. 81% of the CSI points are used for pretraining and 19% form a zero-shot reconstruction subset. The public Hugging Face repository pku-pcni-lab/WiFo-2 holds 15 X_test.pt zero-shot test tensors in 15 subdirectories, 2.74 GB in total, and its listed license is MIT. The GitHub repository PKU-PCNI/WiFo-2 provides inference code for released checkpoints
    and no training code. The SoM Challenge train, validation and test splits are given to registered participants, and their redistribution is prohibited.', zh: 'LH-CSI 是用于预训练 WiFo-2 的异构信道语料。WiFo-2 是发表于 National Science Review 的时空频基础模型（DOI 10.1093/nsr/nwag500；arXiv:2511.22222）。语料包含 116 亿个 CSI 点，分为 78 个粗粒度与细粒度子集，来源为八个数据源：QuaDRiGa、PKU-GBSM、LuViRA、DICHASUS、Argos、PKU-RM、DeepMIMO 与 PKU-RT。论文将这些来源描述为统计信道建模、实测与射线追踪，载频从 sub-6 GHz 覆盖到太赫兹频段，场景包括工厂、学校、UAV 通信以及室内与室外环境。81% 的 CSI 点用于预训练，19% 构成零样本重建子集。公开 Hugging Face 仓库 pku-pcni-lab/WiFo-2 含 15 个 X_test.pt 零样本测试张量，分布于 15 个子目录，合计 2.74 GB，页面列出的许可证为 MIT。GitHub 仓库 PKU-PCNI/WiFo-2 提供已发布 checkpoint 的推理代码，不含训练代码。SoM Challenge 的 train、val 与 test 划分提供给注册参赛者，禁止再分发。'}
signal_details:
- signal: csi
  text: {en: 'The public release contains 15 X_test.pt test tensors, one per subdirectory (for example D17/X_test.pt and D17CE/X_test.pt). The Hugging Face file listing gives sizes from 65,537,591 bytes (RM_070703 and RM_070704) to 266,294,839 bytes (Argos_43 and Argos_56). The 15 tensors and two small repository files total 2.74 GB. The paper describes the data as three-dimensional space-time-frequency CSI.', zh: '公开发布包含 15 个 X_test.pt 测试张量，每个子目录一个（例如 D17/X_test.pt 与 D17CE/X_test.pt）。Hugging Face 文件列表显示单个文件大小从 65,537,591 字节（RM_070703 与 RM_070704）到 266,294,839 字节（Argos_43 与 Argos_56）。15 个张量与两个小型仓库文件合计 2.74 GB。论文将数据描述为三维时空频 CSI。'}
format: PyTorch .pt tensors
capabilities:
- key: csi
  status: provided
  note: {en: The 15 released zero-shot test tensors (2.74 GB in total) contain complex CSI; the full 78-subset corpus is not public., zh: 已发布的15个零样本测试张量（共2.74 GB）包含复CSI；78个子集的完整语料未公开。}
- key: cir
  status: derivable
  note: {en: Computed from the provided CSI by an inverse Fourier transform over subcarriers., zh: 由所提供的 CSI 沿子载波做逆傅里叶变换得到。}
- key: paths
  status: none
  note: {en: 'The released tensors hold CSI only; per-path data would come from the upstream DeepMIMO or PKU-RT assets, which are not in this release.', zh: 已发布张量仅包含CSI；逐径数据需从上游DeepMIMO或PKU-RT资产获取，这些资产不在本次发布中。}
- key: interaction
  status: none
  note: {en: The released tensors contain no per-path interaction tables; those would come from the upstream DeepMIMO or PKU-RT assets., zh: 已发布张量不含逐径交互表；此类信息需从上游DeepMIMO或PKU-RT资产获取。}
- key: power
  status: derivable
  note: {en: Received power follows from |H|^2 of the CSI tensors., zh: 接收功率可由CSI张量的|H|^2得到。}
- key: beam_labels
  status: derivable
  note: {en: Beam gains can be computed from CSI when the subset array geometry and a codebook are specified; no beam labels are released., zh: 在指定子集阵列几何与码本的情况下，可由CSI计算波束增益；发布数据不含波束标签。}
- key: position
  status: none
  note: {en: The released tensors contain no coordinates; the DICHASUS positioning task uses separately constructed coordinate labels., zh: 已发布张量不含坐标；DICHASUS定位任务使用另行构建的坐标标签。}
- key: geometry
  status: none
  note: {en: 'The release contains CSI tensors and inference code only, with no map or scene files.', zh: 发布内容仅包含CSI张量与推理代码，不含地图或场景文件。}
- key: materials
  status: none
  note: {en: The release contains no material parameters., zh: 发布内容不包含材料参数。}
- key: iq
  status: none
  note: {en: 'The released files are CSI tensors, not I/Q sample streams.', zh: 发布文件为CSI张量，而非I/Q采样流。}
- key: rgb
  status: none
  note: {en: The release contains no images; the SynthSoM image-CSI task uses separately constructed data., zh: 发布内容不含图像；SynthSoM图像-CSI任务使用另行构建的数据。}
- key: depth
  status: none
  note: {en: The release contains no depth data., zh: 发布内容不含深度数据。}
- key: lidar
  status: none
  note: {en: The public zero-shot interface provides no LiDAR data., zh: 公开零样本接口不提供LiDAR数据。}
- key: radar
  status: none
  note: {en: The public zero-shot interface provides no raw radar observations., zh: 公开零样本接口不提供原始雷达观测。}
- key: imu
  status: none
  note: {en: The release contains no IMU data., zh: 发布内容不含IMU数据。}
- key: time_series
  status: provided
  note: {en: Each zero-shot tensor has a time axis used for temporal prediction; sampling resolution differs between subsets., zh: 每个零样本张量均含时间维，用于时域预测；各子集的采样粒度不同。}
- key: multiuser
  status: derivable
  note: {en: 'User sets can be built at the channel level after each subset is checked for a common BS, array scale and noise convention; the sources do not establish a synchronized user axis.', zh: 在检查各子集的公共基站、阵列幅度尺度与噪声约定后，可在信道层面构建用户集合；资料未确认存在同步的用户维度。}
- key: multibs
  status: none
  note: {en: 'The public interface has no BS identifiers or cross-BS link sets, and combining sources does not give synchronized multi-BS data.', zh: 公开接口不含基站ID或跨基站链路集合，合并多个来源也不会得到同步的多基站数据。}
- key: crossfreq
  status: none
  note: {en: The public interface has no paired two-carrier input; the cross-band tasks in the paper use separately constructed data., zh: 公开接口没有成对的双载波输入；论文中的跨频段任务使用另行构建的数据。}
- {key: near_field, status: unknown}
- {key: high_mobility, status: unknown}
- {key: dynamic_blockage, status: unknown}
- key: reflection
  status: provided
  note: {en: Measured subsets such as Argos and PKU-RM contain these mechanisms without per-path labels; statistical and ray-traced subsets are not labelled by mechanism., zh: Argos与PKU-RM等实测子集包含这些机制，但不带逐径标签；统计与射线追踪子集未按机制标注。}
- key: diffraction
  status: provided
  note: {en: Measured subsets such as Argos and PKU-RM contain these mechanisms without per-path labels; statistical and ray-traced subsets are not labelled by mechanism., zh: Argos与PKU-RM等实测子集包含这些机制，但不带逐径标签；统计与射线追踪子集未按机制标注。}
- key: scattering
  status: provided
  note: {en: Measured subsets such as Argos and PKU-RM contain these mechanisms without per-path labels; statistical and ray-traced subsets are not labelled by mechanism., zh: Argos与PKU-RM等实测子集包含这些机制，但不带逐径标签；统计与射线追踪子集未按机制标注。}
- key: transmission
  status: provided
  note: {en: Measured subsets such as Argos and PKU-RM contain these mechanisms without per-path labels; statistical and ray-traced subsets are not labelled by mechanism., zh: Argos与PKU-RM等实测子集包含这些机制，但不带逐径标签；统计与射线追踪子集未按机制标注。}
- {key: polarization, status: unknown}
- key: em_field
  status: none
  note: {en: 'The released tensors hold channel coefficients only, with no field-level outputs.', zh: 已发布张量仅包含信道系数，不含场级输出。}
