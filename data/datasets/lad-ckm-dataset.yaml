id: lad-ckm-dataset
name: LAD-CKM dataset
year: 2026
origin: ray-tracing
tasks: [radio-map]
signals: [csi]
bands_ghz: [6.715, 6.765]
bandwidth_mhz: 20
environment: [outdoor-urban]
antennas: {array: upa}
subcarriers: 64
samples: 20 coherence blocks per MIMO configuration, 2,500 UEs per block
license: MIT (repository LICENSE; no separate dataset license stated)
