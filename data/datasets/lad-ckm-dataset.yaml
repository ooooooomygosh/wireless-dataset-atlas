summary: {en: 'Ground-truth MIMO-OFDM channels from Sionna ray tracing for a dynamic UMi campus scene, with pedestrian and vehicle scatterers repositioned randomly in every coherence block. OFDM uses 20 MHz with 64 subcarriers at 6.715 GHz (uplink) and 6.765 GHz (downlink).', zh: 使用Sionna光线追踪生成的动态UMi校园场景地面真值MIMO-OFDM信道，每个相干块中行人和车辆散射体随机重新放置。OFDM采用20 MHz带宽、64个子载波，上行6.715 GHz，下行6.765 GHz。}
sources: ['https://arxiv.org/abs/2603.09273', 'https://arxiv.org/html/2603.09273', 'https://github.com/kqzzzz/LAD-CKM-dataset', 'https://raw.githubusercontent.com/kqzzzz/LAD-CKM-dataset/main/README.md', 'https://api.github.com/repos/kqzzzz/LAD-CKM-dataset/license', 'https://doi.org/10.1109/icc59461.2026.11587910', 'https://raw.githubusercontent.com/kqzzzz/LAD-CKM-dataset/main/loader.py', 'https://raw.githubusercontent.com/kqzzzz/LAD-CKM-dataset/main/LICENSE', 'https://api.crossref.org/works/10.1109/icc59461.2026.11587910', 'https://github.com/kqzzzz/LAD-CKM-dataset/commits/main']
checked: '2026-11-06'
overview: {en: 'The LAD-CKM dataset is a synthetic MIMO-OFDM channel dataset for an outdoor dynamic UMi campus scene. It accompanies the paper Location-Agnostic Channel Knowledge Map Construction for Dynamic Scenes by K. Zhou, G. Zhang, H. Li, Y. Cai and G. Yu of Zhejiang University, published at IEEE ICC 2026 (arXiv:2603.09273). The channels are ground truth generated by ray tracing: the campus geometry is taken from OpenStreetMap, materials are set in Blender, and the Sionna ray-tracing platform computes the channels. Dynamic scatterers are randomly repositioned in every coherence block, with pedestrians modeled as dry dielectric boxes and vehicles as metal boxes. The OFDM signal uses 20 MHz bandwidth and 64 subcarriers, at 6.715 GHz for uplink and 6.765 GHz for downlink. Each MIMO configuration contains 20 coherence blocks with 2,500 randomly dropped UEs per block. The dataset contains simulated channels only, and the repository README links the data files on Baidu Pan.', zh: 'LAD-CKM数据集是一个面向户外动态UMi校园场景的合成MIMO-OFDM信道数据集。该数据集配套于论文Location-Agnostic
    Channel Knowledge Map Construction for Dynamic Scenes，作者为浙江大学的K. Zhou、G. Zhang、H. Li、Y. Cai和G. Yu，论文发表于IEEE ICC 2026（arXiv:2603.09273）。信道为射线追踪生成的地面真值：校园三维几何取自OpenStreetMap，在Blender中设置材料参数，再由Sionna射线追踪平台计算信道。动态散射体在每个相干块中随机重新放置，行人建模为干介电盒体，车辆建模为金属盒体。OFDM信号带宽20 MHz，包含64个子载波，上行载频6.715 GHz，下行载频6.765 GHz。每种MIMO配置包含20个相干块，每个块中随机放置2,500个UE。数据集仅包含仿真信道，README中给出的数据下载链接指向百度网盘。'}
signal_details:
- signal: csi
  text: {en: 'Ground-truth MIMO-OFDM channels from Sionna ray tracing. OFDM bandwidth 20 MHz, 64 subcarriers with 312.5 kHz spacing, 52 subcarriers used for channel measurement. Carrier frequencies 6.715 GHz (uplink) and 6.765 GHz (downlink). BS antenna counts 8, 16, 32, 64 and 128. UE antenna counts 1 and 4. Both BS and UE use uniform planar arrays with DFT codebooks.', zh: 由Sionna射线追踪生成的地面真值MIMO-OFDM信道。OFDM带宽20 MHz，64个子载波，子载波间隔312.5 kHz，其中52个子载波用于信道测量。载频为上行6.715 GHz、下行6.765 GHz。BS天线数为8、16、32、64和128，UE天线数为1和4。BS和UE均采用均匀平面阵列（UPA）和DFT码本。}
pipeline:
  summary: {en: 'A campus scene is ray traced in Sionna, with dynamic scatterers redrawn in every coherence block, to produce ground-truth MIMO-OFDM channels for each MIMO configuration.', zh: 在Sionna中对校园场景进行射线追踪，每个相干块重新放置动态散射体，从而为每种MIMO配置生成地面真值MIMO-OFDM信道。}
  stages:
  - title: {en: Build the campus scene, zh: 构建校园场景}
    detail: {en: 'The 3D geometry of a campus is downloaded from OpenStreetMap and imported into Blender, where materials are parameterized.', zh: 校园三维几何数据从OpenStreetMap下载，导入Blender后设置材料参数。}
    inputs:
    - {en: OpenStreetMap 3D geometry, zh: OpenStreetMap三维几何数据}
    outputs:
    - {en: Material-parameterized scene, zh: 已设置材料参数的场景}
  - title: {en: Place dynamic scatterers per block, zh: 按块放置动态散射体}
    detail: {en: 'Pedestrians are modeled as dry dielectric boxes of 0.5 m × 0.5 m × 1.8 m, and vehicles as metal boxes of 2 m × 4 m × 1.6 m. The scatterers are randomly repositioned in every coherence block.', zh: 行人建模为0.5 m × 0.5 m × 1.8 m的干介电盒体，车辆建模为2 m × 4 m × 1.6 m的金属盒体。散射体在每个相干块中随机重新放置。}
    inputs:
    - {en: Material-parameterized scene, zh: 已设置材料参数的场景}
    outputs:
    - {en: Scatterer layout for each coherence block, zh: 每个相干块的散射体布局}
  - title: {en: Ray-trace MIMO-OFDM channels, zh: 射线追踪生成MIMO-OFDM信道}
    detail: {en: 'Sionna ray tracing computes the ground-truth MIMO-OFDM channels. Each MIMO configuration has 20 coherence blocks, with 2,500 UEs randomly dropped per block. The OFDM setup uses 20 MHz, 64 subcarriers, 6.715 GHz uplink and 6.765 GHz downlink.', zh: 'Sionna射线追踪计算地面真值MIMO-OFDM信道。每种MIMO配置包含20个相干块，每个块中随机放置2,500个UE。OFDM配置为20 MHz、64个子载波，上行6.715 GHz，下行6.765 GHz。'}
    inputs:
    - {en: Scatterer layout per block, zh: 每个块的散射体布局}
    - {en: UE drops per block, zh: 每个块的UE随机放置}
    outputs:
    - {en: Ground-truth MIMO-OFDM channels, zh: 地面真值MIMO-OFDM信道}
format: NPY (.npy)
facts:
- label: {en: File layout, zh: 文件结构}
  text: {en: 'The example loader reads datasets/Tx4x8_Rx2x2.npy with allow_pickle, a file of frame records where each record holds a csi entry shaped [n_rx, Nr, Nt, 2 * Nc].', zh: '示例加载器以allow_pickle方式读取datasets/Tx4x8_Rx2x2.npy，该文件为帧记录，每条记录包含一个csi条目，形状为[n_rx, Nr, Nt, 2 * Nc]。'}
- label: {en: Uplink and downlink columns, zh: 上下行列划分}
  text: {en: 'Along the 2 * Nc axis, the loader takes the first 52 entries as uplink and the next 52 entries as downlink.', zh: 加载器沿2 * Nc维度将前52个条目视为上行，后52个条目视为下行。}
- label: {en: Frequency grid, zh: 频率网格}
  text: {en: The loader function get_freq returns 52 uplink frequencies around 6.715 GHz and 52 downlink frequencies around 6.765 GHz., zh: 加载器函数get_freq返回以6.715 GHz为中心附近的52个上行频率，以及以6.765 GHz为中心附近的52个下行频率。}
- label: {en: Train and test split, zh: 训练与测试划分}
  text: {en: 'With ratio 0.8, the loader keeps the first 80% of frame samples for training and the last 20% for testing, and it does not shuffle.', zh: 当ratio为0.8时，加载器取前80%的帧样本用于训练，后20%用于测试，且不做打乱。}
- label: {en: Optional normalization, zh: 可选归一化}
  text: {en: The norm flag divides the uplink and downlink CSI of each sample by its own RMS amplitude and stores the scale factors for denormalization., zh: norm参数会将每个样本的上行和下行CSI分别除以其各自的RMS幅度，并保存缩放系数用于反归一化。}
capabilities:
- key: csi
  status: provided
  note: {en: 'Ground-truth MIMO-OFDM CSI for BS arrays of 8 to 128 antennas and UE arrays of 1 or 4 antennas, with 52 subcarriers per link direction.', zh: 地面真值MIMO-OFDM CSI，BS天线数为8至128，UE天线数为1或4，每个链路方向52个子载波。}
- key: cir
  status: derivable
  note: {en: Inverse FFT of the 52 stored subcarriers per link gives a band-limited impulse response; no CIR is listed in the release., zh: 对每个链路的52个已存储子载波做逆FFT可得到带限冲激响应；发布内容未列出CIR。}
- {key: paths, status: unknown}
- {key: interaction, status: unknown}
- key: power
  status: derivable
  note: {en: Received power and path loss follow from the stored CSI amplitudes; no power field is listed., zh: 接收功率和路径损耗可由已存储的CSI幅度计算得到；数据中未列出功率字段。}
- {key: iq, status: unknown}
- key: beam_labels
  status: derivable
  note: {en: Beam indices follow from the CSI with the DFT codebooks used for the BS and UE arrays., zh: 波束索引可由CSI结合BS和UE阵列所用的DFT码本计算得到。}
- {key: position, status: unknown}
- key: geometry
  status: simulate
  note: {en: Only scene.png is in the repository; the campus geometry is rebuilt from OpenStreetMap data., zh: 仓库中仅有scene.png；校园几何需依据OpenStreetMap数据重建。}
- key: materials
  status: simulate
  note: {en: 'Materials are set in Blender: pedestrians are dry dielectric and vehicles are metal; building and ground materials are not specified.', zh: 材料在Blender中设置：行人为干介电体，车辆为金属；建筑和地面材料未说明。}
- key: rgb
  status: none
  note: {en: The dataset contains simulated channels only., zh: 数据集仅包含仿真信道。}
- key: depth
  status: none
  note: {en: The dataset contains simulated channels only., zh: 数据集仅包含仿真信道。}
- key: lidar
  status: none
  note: {en: The dataset contains simulated channels only., zh: 数据集仅包含仿真信道。}
- key: radar
  status: none
  note: {en: The dataset contains simulated channels only., zh: 数据集仅包含仿真信道。}
- key: imu
  status: none
  note: {en: The dataset contains simulated channels only., zh: 数据集仅包含仿真信道。}
- key: time_series
  status: none
  note: {en: 'Coherence blocks use independent random placements, with no timestamps or continuous motion.', zh: 相干块采用相互独立的随机放置，没有时间戳，也没有连续运动。}
- key: multiuser
  status: provided
  note: {en: '2,500 UEs are randomly dropped in each coherence block.', zh: '每个相干块中随机放置2,500个UE。'}
- {key: multibs, status: unknown}
- key: crossfreq
  status: provided
  note: {en: Uplink (6.715 GHz) and downlink (6.765 GHz) CSI are stored together in each frame record., zh: 上行（6.715 GHz）和下行（6.765 GHz）CSI存储在同一帧记录中。}
- {key: near_field, status: unknown}
- {key: high_mobility, status: unknown}
- key: dynamic_blockage
  status: provided
  note: {en: 'Pedestrian and vehicle scatterers are repositioned in every coherence block, not moved continuously.', zh: 行人和车辆散射体在每个相干块中重新放置，而非连续移动。}
- {key: reflection, status: unknown}
- {key: diffraction, status: unknown}
- {key: scattering, status: unknown}
- {key: transmission, status: unknown}
- {key: polarization, status: unknown}
- {key: em_field, status: unknown}
