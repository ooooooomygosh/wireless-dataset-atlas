summary: {en: 'WiFi CSI traces recorded with the 802.11n CSI Tool for 276 sign-language gestures in lab and home settings, with downlink and uplink links. A 150-sign subset is recorded from five users in the lab.', zh: 使用 802.11n CSI Tool 记录的 WiFi CSI 数据，涵盖实验室和家庭环境中的 276 个手语手势，包含下行和上行链路。另有一个 150 个手语的子集，由实验室中的五名用户采集。}
