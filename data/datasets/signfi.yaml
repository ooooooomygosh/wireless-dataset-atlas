checked: '2026-11-06'
overview: {en: 'SignFi is a WiFi channel state information (CSI) dataset for sign language recognition, collected by the College of William and Mary and described in the ACM IMWUT 2018 paper (doi:10.1145/3191755). The data hold CSI traces of 276 sign gestures that involve the head, arm, hand and finger, recorded in a lab and in a home. The 276-sign set has 8,280 instances in each link direction, from one user (5,520 lab, 2,760 home), with downlink and uplink traces. A separate lab set holds 7,500 instances of 150 sign gestures from five users, downlink only. The traces are segmented, with one ground-truth label per instance, and stored as MATLAB .mat files. The repository also contains sign_labels.csv, the sign videos used during collection, and a MATLAB CNN training example. The page refers to the paper for bandwidth, sampling rate and WiFi settings. Use is limited to non-commercial educational and research purposes, and redistribution needs written approval.', zh: 'SignFi 是用于手语识别的 WiFi
    信道状态信息（CSI）数据集，由威廉与玛丽学院采集，对应 ACM IMWUT 2018 论文（doi:10.1145/3191755）。数据包含在实验室和家中采集的 276 种手语动作的 CSI 轨迹，动作涉及头部、手臂、手部和手指。276 手语数据集由一名用户完成，每个链路方向各有 8,280 个实例（实验室 5,520 个，家庭 2,760 个），包含下行与上行轨迹。另有一个实验室数据集，包含五名用户完成的 150 种手语动作，共 7,500 个实例，仅含下行轨迹。轨迹已分段，每个实例对应一个真值标签，以 MATLAB .mat 文件存储。仓库还包括 sign_labels.csv、采集时使用的手语视频，以及 MATLAB CNN 训练示例。页面将带宽、采样率和 WiFi 设置等细节交由论文说明。使用仅限非商业教育和研究目的，再分发需经书面许可。'}
signal_details:
- signal: csi
  text: {en: 'CSI traces measured on WiFi packets with the 802.11n CSI Tool. The example code gives the lab CSI array csid_lab a size of 200 x 30 x 3 x 5520, and the labels are stored as label_lab. The traces are segmented, with one ground-truth label per instance.', zh: 基于 WiFi 数据包、使用 802.11n CSI Tool 采集的 CSI 轨迹。示例代码给出实验室 CSI 数组 csid_lab 的尺寸为 200 x 30 x 3 x 5520，标签保存于 label_lab。轨迹已分段，每个实例对应一个真值标签。}
pipeline:
  summary: {en: 'Participants performed sign gestures while WiFi CSI was captured with the 802.11n CSI Tool, and the traces were segmented into labeled instances and stored as MATLAB files.', zh: 参与者执行手语动作的同时，使用 802.11n CSI Tool 采集 WiFi CSI，轨迹被切分为带标签的实例，并保存为 MATLAB 文件。}
  stages:
  - title: {en: Gesture performance from videos, zh: 依据视频执行手语动作}
    detail: {en: Participants learned and performed the sign gestures from videos of 276 basic sign words. The file sign_labels.csv lists the 276 sign words used in the measurement., zh: 参与者依据 276 个基础手语词的视频学习并执行手语动作。sign_labels.csv 列出了测量中使用的 276 个手语词。}
    inputs:
    - {en: Videos of 276 basic sign words, zh: 276 个基础手语词的视频}
    outputs:
    - {en: Performed sign gestures, zh: 执行的手语动作}
  - title: {en: CSI capture, zh: CSI 采集}
    detail: {en: CSI is measured from WiFi packets with the 802.11n CSI Tool during the gesture performances., zh: 在手语动作执行期间，利用 802.11n CSI Tool 从 WiFi 数据包中测量 CSI。}
    inputs:
    - {en: WiFi packets, zh: WiFi 数据包}
    outputs:
    - {en: Raw CSI traces, zh: 原始 CSI 轨迹}
  - title: {en: Segmentation and labeling, zh: 分段与标注}
    detail: {en: 'The CSI traces are segmented into instances, and each instance carries a ground-truth label.', zh: CSI 轨迹被切分为实例，每个实例带有一个真值标签。}
    inputs:
    - {en: CSI traces, zh: CSI 轨迹}
    outputs:
    - {en: Labeled CSI instances, zh: 带标签的 CSI 实例}
  - title: {en: Storage as MATLAB files, zh: 保存为 MATLAB 文件}
    detail: {en: 'The instances are stored as dataset_lab_276_dl.mat, dataset_lab_276_ul.mat, dataset_home_276.mat and dataset_lab_150.mat. In the lab downlink file, the CSI and label variables are csid_lab and label_lab.', zh: 实例保存为 dataset_lab_276_dl.mat、dataset_lab_276_ul.mat、dataset_home_276.mat 和 dataset_lab_150.mat 四个文件。实验室下行文件中，CSI 与标签变量分别为 csid_lab 与 label_lab。}
    inputs:
    - {en: Labeled CSI instances, zh: 带标签的 CSI 实例}
    outputs:
    - {en: MATLAB .mat dataset files, zh: MATLAB .mat 数据文件}
subcarriers: 30
antennas: {tx: 3, rx: 3}
size_gb: 6.07
facts:
- label: {en: Labels, zh: 标签}
  text: {en: Each instance carries one ground-truth sign label. The file sign_labels.csv lists the 276 sign words used in the measurement., zh: 每个实例带有一个真值手语标签。文件 sign_labels.csv 列出测量中使用的 276 个手语词。}
- label: {en: Instance shape, zh: 实例尺寸}
  text: {en: 'Each CSI instance is a 200 x 30 x 3 array. The lab downlink file stacks the 5,520 instances along the last axis, so csid_lab has size 200 x 30 x 3 x 5520.', zh: '每个 CSI 实例为 200 x 30 x 3 的数组。实验室下行文件沿最后一维堆叠 5,520 个实例，因此 csid_lab 的尺寸为 200 x 30 x 3 x 5520。'}
- label: {en: Example split, zh: 示例数据划分}
  text: {en: 'The MATLAB example uses 5-fold cross-validation, with 20% of the instances held out for testing in each fold.', zh: MATLAB 示例采用 5 折交叉验证，每折保留 20% 的实例用于测试。}
- label: {en: Phase correction, zh: 相位校正}
  text: {en: 'The repository includes csi_phase_offset.py, a Python reference for removing the phase offset from the CSI.', zh: 仓库包含 csi_phase_offset.py，这是一段用于去除 CSI 相位偏移的 Python 参考代码。}
technical_notes:
- {en: 'The example script needs MATLAB 2017b or newer, because it uses batchNormalizationLayer and the ValidationData training option.', zh: 示例脚本需要 MATLAB 2017b 或更新版本，因为它使用了 batchNormalizationLayer 和 ValidationData 训练选项。}
limitations:
- {en: 'The 276-sign set was recorded from one user, while the 150-sign set covers five users.', zh: 276 手语集由一名用户采集，150 手语集由五名用户采集。}
- {en: The 150-sign set contains downlink traces only., zh: 150 手语集仅包含下行轨迹。}
capabilities:
- key: csi
  status: provided
  note: {en: 802.11n CSI Tool traces. Each instance is a 200 x 30 x 3 array; the lab downlink array csid_lab has size 200 x 30 x 3 x 5520., zh: 由 802.11n CSI Tool 采集的 CSI 轨迹。每个实例为 200 x 30 x 3 数组；实验室下行数组 csid_lab 的尺寸为 200 x 30 x 3 x 5520。}
- key: cir
  status: derivable
  note: {en: The phase-offset script computes a power delay profile (pdp) by IFFT of the phase-corrected CSI; this result is not released as data., zh: 相位偏移脚本对相位校正后的 CSI 做 IFFT，得到名为 pdp 的功率时延分布；该结果未作为数据发布。}
- key: paths
  status: none
  note: {en: 'Only CSI traces are released; there is no per-path delay, angle or power.', zh: 仅发布 CSI 轨迹，没有逐径的时延、角度或功率。}
- key: interaction
  status: none
  note: {en: No per-path interaction data; the release is CSI traces only., zh: 没有逐径的交互信息，数据仅为 CSI 轨迹。}
- key: power
  status: derivable
  note: {en: Per-subcarrier power follows from the CSI magnitude; the example code uses abs(csi)., zh: 各子载波的功率可由 CSI 幅度计算；示例代码使用 abs(csi)。}
- key: iq
  status: none
  note: {en: 'The release contains complex CSI, not raw I/Q samples.', zh: 数据为复数 CSI，而非原始 I/Q 采样。}
- key: beam_labels
  status: derivable
  note: {en: Computed by projecting the provided channels onto a beam codebook for the stated array., zh: 将所提供信道投影到对应阵列的波束码本上得到。}
- key: position
  status: none
  note: {en: No position or GPS data; the labels are sign classes., zh: 没有位置或 GPS 数据，标签为手语类别。}
- key: geometry
  status: none
  note: {en: No 3D scene or map files; the repository holds sign videos and MATLAB and Python code., zh: 没有三维场景或地图文件；仓库包含手语视频以及 MATLAB 与 Python 代码。}
- key: materials
  status: none
  note: {en: No material parameters are released., zh: 未发布材料参数。}
- key: rgb
  status: none
  note: {en: The sign videos show the gestures to participants for learning; the release has no camera data as a sensing input., zh: 手语视频用于向参与者展示手势以便学习；数据中没有作为感知输入的相机数据。}
- key: depth
  status: none
  note: {en: No depth data are released., zh: 未发布深度数据。}
- key: lidar
  status: none
  note: {en: No lidar data are released., zh: 未发布激光雷达数据。}
- key: radar
  status: none
  note: {en: No radar data are released., zh: 未发布雷达数据。}
- key: imu
  status: none
  note: {en: No inertial sensor data are released., zh: 未发布惯性传感器数据。}
- key: time_series
  status: provided
  note: {en: 'Each instance is a sequence of 200 CSI packets along the first (time) axis, as the phase-offset script treats that axis.', zh: 每个实例是沿第一维（时间）排列的 200 个 CSI 数据包序列，与相位偏移脚本对该维的处理一致。}
- key: multiuser
  status: none
  note: {en: The five-user set holds one user's gesture per instance; no simultaneous per-user channels are described., zh: 五用户数据集中每个实例对应一名用户的一次手势；未描述同时存在的逐用户信道。}
- key: multibs
  status: none
  note: {en: 'Each capture measures one WiFi link, downlink or uplink; no multiple access points are described.', zh: 每次采集测量一条 WiFi 链路（下行或上行）；未描述多个接入点。}
- key: crossfreq
  status: none
  note: {en: A single 802.11n WiFi capture; no paired multi-band data is described., zh: 单一 802.11n WiFi 采集；未描述成对的多频段数据。}
- {key: near_field, status: unknown}
- key: high_mobility
  status: none
  note: {en: Only sign gestures are recorded; no fast-moving users are described., zh: 仅记录手语动作，未描述快速移动的用户。}
- {key: dynamic_blockage, status: unknown}
- key: reflection
  status: provided
  note: {en: 'Inherent in the lab and home WiFi measurement, not labelled per path.', zh: 包含在实验室与家庭 WiFi 测量之中，未按径标注。}
- key: diffraction
  status: provided
  note: {en: 'Inherent in the lab and home WiFi measurement, not labelled per path.', zh: 包含在实验室与家庭 WiFi 测量之中，未按径标注。}
- key: scattering
  status: provided
  note: {en: 'Inherent in the lab and home WiFi measurement, not labelled per path.', zh: 包含在实验室与家庭 WiFi 测量之中，未按径标注。}
- key: transmission
  status: provided
  note: {en: 'Inherent in the lab and home WiFi measurement, not labelled per path.', zh: 包含在实验室与家庭 WiFi 测量之中，未按径标注。}
- key: polarization
  status: none
  note: {en: No polarimetric measurement is described., zh: 未描述极化测量。}
- key: em_field
  status: none
  note: {en: 'CSI only; no field components, field strength or antenna patterns.', zh: 仅有 CSI，没有场分量、场强或天线方向图。}
