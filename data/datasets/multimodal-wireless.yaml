summary: {en: 'Simulated CARLA driving scenes with Sionna ray-traced channel data, synchronized with LiDAR, RGB and depth camera, IMU, radar and GNSS sensors at 100 Hz. The release contains 161,400 frames across 4 virtual towns, 16 communication scenarios and 3 weather conditions.', zh: '基于CARLA和Sionna仿真的驾驶场景数据，包含Sionna射线追踪信道数据，并与LiDAR、RGB与深度相机、IMU、雷达和GNSS传感器同步，采样率为100 Hz。数据共161,400帧，覆盖4个虚拟城镇、16种通信场景和3种天气条件。'}
sources: ['https://arxiv.org/abs/2511.03220', 'https://le-liang.github.io/mmw/', 'https://le-liang.github.io/mmw/download.html', 'https://github.com/le-liang/Multimodal-Wireless', 'https://arxiv.org/html/2511.03220v2', 'https://le-liang.github.io/mmw/data-collection.html', 'https://le-liang.github.io/mmw/scenarios.html', 'https://raw.githubusercontent.com/le-liang/Multimodal-Wireless/main/README.md', 'https://raw.githubusercontent.com/le-liang/Multimodal-Wireless/main/LICENSE', 'https://github.com/le-liang/Multimodal-Wireless/releases/tag/v1.1.0', 'https://github.com/le-liang/Multimodal-Wireless/releases/tag/v1.0.0', 'https://le-liang.github.io/mmw/tutorials.html', 'https://arxiv.org/abs/2511.03220v1', 'https://arxiv.org/abs/2511.03220v2']
checked: '2026-11-06'
overview: {en: 'Multimodal-Wireless is a simulated dataset for multimodal sensing and communication in vehicular scenes, described in arXiv:2511.03220 (first version November 2025, revised February 2026). The scenes are generated in the CARLA simulator (version 0.9.15), and the channel data are computed by Sionna ray tracing. RGB camera, depth camera, LiDAR, radar and IMU streams, together with the CSI, are sampled at 100 Hz and temporally aligned. The release contains 161,400 frames across four virtual towns (Town03, Town05, Town07 and Town10), 16 communication scenarios and three weather conditions (sunny, rainy and foggy). The sunny folder holds channel-data and sensor-data subfolders, and the rainy and foggy folders hold data for their conditions; a Blender_Towns folder provides Blender versions of the CARLA towns for replay. The authors demonstrate beam prediction with a multimodal large language model, and the abstract lists communication and collaborative perception as applications.
    The data are simulated only, with no real-world measurements, and the channel model covers line-of-sight paths and first-order reflections.', zh: 'Multimodal-Wireless 是一个面向车联网多模态感知与通信研究的仿真数据集，见 arXiv:2511.03220（2025 年 11 月首版，2026 年 2 月修订）。场景由 CARLA 仿真器（版本 0.9.15）生成，信道数据由 Sionna 光线追踪计算。RGB 相机、深度相机、LiDAR、雷达和 IMU 的数据流与 CSI 以 100 Hz 采样，并在时间上对齐。发布数据共 161,400 帧，覆盖 4 个虚拟城镇（Town03、Town05、Town07、Town10）、16 种通信场景和 3 种天气条件（晴天、雨天、雾天）。晴天目录包含信道数据与传感器数据两个子目录，雨天和雾天目录分别存放对应天气的数据；Blender_Towns 目录提供 CARLA 城镇的 Blender 版本，用于回放。论文以多模态大语言模型演示了波束预测，摘要列出的应用还包括协同感知与通信。数据仅为仿真结果，不含实测数据；信道模型仅包含视距路径和一阶反射。'}
signal_details:
- signal: csi
  text: {en: 'Sionna ray-traced channel at 28 GHz and 4.9 GHz, with line-of-sight paths and first-order reflections (10^6 rays, maximum reflection order 1). Each path stores azimuth and zenith angles of departure and arrival, propagation delay and a complex gain matrix. Frequency-domain CSI uses 1,024 subcarriers at 120 kHz spacing. The RSU transmit array is a ULA of 4, 16, 64 or 256 elements or an 8×8 planar array; the CAV receive array is a ULA of 4 or 16 elements or an 8×8 planar array. The primary link is V2I downlink with the RSU as base station. The project page gives a 100 Hz channel rate.', zh: 'Sionna 光线追踪信道，载频为 28 GHz 和 4.9 GHz，包含视距路径和一阶反射（10^6 条射线，最大反射阶数 1）。每条路径保存出发与到达的方位角、俯仰角，传播时延和复数增益矩阵。频域 CSI 采用 1,024 个子载波，子载波间隔 120 kHz。RSU 发射阵列为 4、16、64 或 256 元 ULA，或 8×8 平面阵列；CAV 接收阵列为 4 或 16 元 ULA，或 8×8 平面阵列。主链路为 V2I 下行，RSU 作为基站，CAV 作为用户。项目页给出信道速率为 100 Hz。'}
- signal: rgb
  text: {en: '640 × 480 pixels with a 110° field of view at 100 Hz. Each CAV carries four cameras for 360° coverage, and each RSU carries one.', zh: 640 × 480 像素，视场角 110°，采样率 100 Hz。每辆 CAV 配备 4 个相机以覆盖 360°，每个 RSU 配备 1 个。}
- signal: depth
  text: {en: '640 × 480 pixels with a 110° field of view at 100 Hz, mounted on the RSU.', zh: 640 × 480 像素，视场角 110°，采样率 100 Hz，安装于 RSU。}
- signal: lidar
  text: {en: '64 channels, 30,000 points per sample, 120 m range and a −25° to 2° vertical field of view, at 100 Hz. Mounted on CAVs and RSUs.', zh: '64 线，每个样本 30,000 点，测距 120 m，垂直视场角 −25° 至 2°，采样率 100 Hz，安装于 CAV 与 RSU。'}
- signal: radar
  text: {en: '2,000 points per sample, 100 m range, 30° vertical and 110° horizontal field of view, mounted on the RSU, at 100 Hz.', zh: '每个样本 2,000 点，测距 100 m，垂直视场角 30°，水平视场角 110°，安装于 RSU，采样率 100 Hz。'}
- signal: imu
  text: {en: Mounted on CAVs at 100 Hz. Gyroscope noise has mean 0.001 rad/s and standard deviation 0.002 rad/s; accelerometer noise has standard deviation 0.1 m/s²., zh: 安装于 CAV，采样率 100 Hz。陀螺仪噪声均值 0.001 rad/s，标准差 0.002 rad/s；加速度计噪声标准差 0.1 m/s²。}
- signal: gps
  text: {en: 'GNSS estimates are stored in the YAML metadata of each CAV with a noise model: altitude standard deviation 0.005 m, latitude and longitude standard deviation 1e-5° (a 2 to 5 m localization bias), heading standard deviation 0.1° and speed standard deviation 0.2 m/s.', zh: 每辆 CAV 的 YAML 元数据中保存 GNSS 位置估计，噪声模型为：高度标准差 0.005 m，经纬度标准差 1e-5°（对应 2 至 5 m 定位偏差），航向标准差 0.1°，速度标准差 0.2 m/s。}
pipeline:
  summary: {en: 'CARLA produces sensor streams and a per-frame YAML file, Blender places the dynamic actors of each frame in the static town and exports a Sionna scene, and Sionna ray tracing computes the channel for each frame.', zh: CARLA 生成传感器数据流与逐帧 YAML 文件，Blender 将每一帧的动态对象放入静态城镇并导出为 Sionna 场景，Sionna 光线追踪为每一帧计算信道。}
  stages:
  - title: {en: CARLA scenario simulation, zh: CARLA 场景仿真}
    detail: {en: 'carla_main.py runs a scenario defined in a configuration file in CARLA 0.9.15 at a fixed 100 Hz frame rate. Each scenario lasts 8 to 13 s with 3 to 4 CAVs and one RSU, giving 800 to 1,300 frames per CAV. The run writes five sensor data streams (RGB, depth, LiDAR, radar and IMU) together with a YAML file of all frames.', zh: 'carla_main.py 在 CARLA 0.9.15 中运行配置文件定义的场景，帧率固定为 100 Hz。每个场景持续 8 至 13 s，包含 3 至 4 辆 CAV 和 1 个 RSU，每辆 CAV 得到 800 至 1,300 帧。运行结果为五类传感器数据流（RGB、深度、LiDAR、雷达和 IMU）以及包含所有帧的 YAML 文件。'}
    inputs:
    - {en: scenario configuration file, zh: 场景配置文件}
    outputs:
    - {en: sensor streams, zh: 传感器数据流}
    - {en: per-frame YAML, zh: 逐帧 YAML}
  - title: {en: Scene reconstruction in Blender, zh: Blender 场景重建}
    detail: {en: 'Blender 4.3.2 with the Mitsuba (.xml) add-on and PyYAML builds the static town from CARLA geometry exported from Unreal Engine 4.26 and assigns radio materials to buildings, ground and vehicles. For each frame, the script places the vehicles and RSUs from the YAML poses and exports the frame as a self-contained Sionna scene. The Blender_Towns folder provides Blender versions of the towns.', zh: Blender 4.3.2 配合 Mitsuba (.xml) 插件与 PyYAML，根据 Unreal Engine 4.26 导出的 CARLA 城镇几何建立静态场景，并为建筑、地面和车辆分配无线电材料。对每一帧，脚本依据 YAML 中的位姿放置车辆与 RSU，并将该帧导出为独立的 Sionna 场景。Blender_Towns 目录提供各城镇的 Blender 版本。}
    inputs:
    - {en: YAML of all frames, zh: 全部帧的 YAML}
    outputs:
    - {en: one Sionna scene per frame, zh: 每帧一个 Sionna 场景}
  - title: {en: Ray-traced channel generation in Sionna, zh: Sionna 光线追踪信道生成}
    detail: {en: 'Sionna 0.19.2, the version cited in the paper, loads the scene of each frame and computes the multipath components with 10^6 rays, maximum reflection order 1 and vertically polarized dipole antennas. In the accelerated pipeline of release v1.1.0 of the code repository, the static scene is kept and only the vehicle poses are updated frame by frame; the authors report about 20 times faster generation and roughly 95% less total time for the same workload.', zh: Sionna 0.19.2（论文引用版本）加载每一帧的场景，以 10^6 条射线、最大反射阶数 1 和垂直极化偶极子天线计算多径分量。代码仓库 v1.1.0 版本的加速流程保留静态场景，仅逐帧更新车辆位姿；作者报告，在相同工作量下生成速度提升约 20 倍，总耗时减少约 95%。}
    inputs:
    - {en: scene of each frame and vehicle poses, zh: 每帧场景与车辆位姿}
    outputs:
    - {en: 'per-path AoD, AoA, delay and complex gain', zh: 逐路径 AoD、AoA、时延与复增益}
  - title: {en: Optional CSI synthesis from path parameters, zh: 由路径参数合成 CSI（可选）}
    detail: {en: 'The paper computes frequency-domain CSI from stored path parameters with H(f_k) = Σ_m A_m exp(−j2π f_k τ_m), where f_k = (k − (K+1)/2)Δf, K = 1,024 subcarriers and Δf = 120 kHz. Raw path data are kept separate from the channel realization.', zh: '论文用存储的路径参数按 H(f_k) = Σ_m A_m exp(−j2π f_k τ_m) 计算频域 CSI，其中 f_k = (k − (K+1)/2)Δf，K = 1,024 个子载波，Δf = 120 kHz。原始路径数据与信道实现分开保存。'}
    inputs:
    - {en: path gains and delays, zh: 路径增益与时延}
    outputs:
    - {en: frequency-domain CSI, zh: 频域 CSI}
  - title: {en: Packaging by weather condition, zh: 按天气条件分类打包}
    detail: {en: 'Released data are grouped into sunny, rainy and foggy folders, and the sunny folder has separate channel-data and sensor-data subfolders. The authors state that channel data and sensor data can be combined for user research. LiDAR data under rainy and foggy conditions need the post-processing described in the paper.', zh: 发布数据按晴天、雨天和雾天分为三个目录，晴天目录下分为信道数据与传感器数据两个子目录。作者说明信道数据与传感器数据可自行组合用于研究。雨天和雾天的 LiDAR 数据需要论文中描述的后处理。}
    inputs:
    - {en: 'CSI, sensor streams and YAML', zh: CSI、传感器数据流与 YAML}
    outputs:
    - {en: weather-specific folders, zh: 按天气划分的目录}
bands_ghz: [4.9, 28]
subcarriers: 1024
format: PNG, PCD, NPY, YAML, JSON
mobility: 'vehicular: CAVs are mobile users and RSUs are base stations'
organization: Southeast University; Purple Mountain Laboratories; University of California, Santa Cruz; Imperial College London
facts:
- label: {en: Scenario coverage, zh: 场景覆盖}
  text: {en: 'The 16 scenarios are 5 in Town03, 5 in Town05, 2 in Town07 (rural) and 4 in Town10. Each scenario has 3 or 4 CAVs and one RSU.', zh: 16 个场景分布为：Town03 5 个，Town05 5 个，Town07（乡村）2 个，Town10 4 个。每个场景包含 3 或 4 辆 CAV 和 1 个 RSU。}
- label: {en: Beam-prediction split, zh: 波束预测数据划分}
  text: {en: 'The beam-prediction case study uses sunny-weather data with 43,040 training and 5,380 validation samples. It predicts 10 future time steps (100 ms) from 40 past steps (400 ms) of beam indices, LiDAR and RGB data.', zh: '波束预测案例使用晴天数据，训练集 43,040 个样本，验证集 5,380 个样本。模型以过去 40 个时间步（400 ms）的波束索引、LiDAR 与 RGB 数据预测未来 10 个时间步（100 ms）的波束。'}
- label: {en: Ground material by weather, zh: 按天气划分的地面材料}
  text: {en: 'The ground is assigned ITU very dry or medium dry ground in sunny conditions and ITU wet ground in rainy and foggy conditions, with three ground materials defined at 28 GHz.', zh: 晴天场景地面分别设为 ITU 极干与中等干燥地面，雨天和雾天场景地面设为 ITU 湿润地面；28 GHz 下共定义三种地面材料。}
- label: {en: Angle coordinate systems, zh: 角度坐标系}
  text: {en: 'AoD and AoA are provided both in the local coordinate system of each planar array, which is defined in the y-z plane in Sionna, and in the global coordinate system (GCS).', zh: AoD 与 AoA 同时以各平面阵列的局部坐标系（Sionna 中阵列定义在 y-z 平面）和全局坐标系（GCS）两种形式提供。}
- label: {en: File layout, zh: 文件结构}
  text: {en: Each scenario folder holds one folder per agent (cav_N and rsu_N). Frames are numbered with six digits and share a frame number across modalities. Channel files end in _paths.npy and contain the downlink from the RSU to the CAV., zh: 每个场景目录下按智能体分为 cav_N 与 rsu_N 子目录。帧号为六位数字，各模态通过相同帧号对齐。信道文件以 _paths.npy 结尾，记录从 RSU 到 CAV 的下行信道。}
technical_notes:
- {en: 'Channel data are stored as raw per-path parameters (complex gain, delay and four angles), so the subcarrier grid is chosen when CSI is synthesized rather than being fixed in the release.', zh: 信道数据以逐路径原始参数（复增益、时延与四个角度）形式保存，子载波网格在合成 CSI 时确定，而非在发布数据中固定。}
- {en: 'Release v1.1.0 of the code repository changes the generation pipeline. The authors state that the pipeline update does not change the channel results, and that the differences from the original release come only from a bug fix, with a mean channel NMSE of −19.3 dB.', zh: 代码仓库的 v1.1.0 版本改变了生成流程。作者称流程更新本身不改变信道结果，与原始版本的差异仅来自一处缺陷修复，信道的平均 NMSE 为 −19.3 dB。}
limitations:
- {en: 'Only line-of-sight paths and first-order reflections are stored, so higher-order reflections are absent from the channel data.', zh: 仅保存视距路径与一阶反射，信道数据中不包含高阶反射。}
- {en: 'The data are simulated, with no real-world measurements.', zh: 数据均为仿真生成，不包含实测数据。}
- {en: LiDAR data under rainy and foggy conditions require the post-processing described in the paper., zh: 雨天和雾天的 LiDAR 数据需要论文中描述的后处理。}
capabilities:
- key: csi
  status: derivable
  note: {en: The frequency response is computed from the stored path gains and delays with the method in the paper (Eq. 1); subcarrier settings are chosen by the user., zh: 频域响应由已存储的路径增益与时延按论文方法（式 1）计算；子载波参数由用户设定。}
- key: cir
  status: derivable
  note: {en: 'The impulse response is the sum of the stored path gains placed at their delays; the release stores paths, not sampled impulse responses.', zh: 冲激响应由已存储的路径增益按其时延叠加得到；发布数据存储的是路径而非采样后的冲激响应。}
- key: paths
  status: provided
  note: {en: 'Per-path complex gain matrix, delay, and AoD/AoA in local and global frames, for LoS and first-order reflections only.', zh: 每条路径的复增益矩阵、时延，以及局部与全局坐标系下的 AoD/AoA，仅包含 LoS 与一阶反射路径。}
- key: interaction
  status: simulate
  note: {en: 'The release includes the 3D scene, so re-running a ray tracer on it produces this output.', zh: 发布内容包含三维场景，在其上重新运行射线追踪即可产生该输出。}
- key: power
  status: derivable
  note: {en: 'Path power and received power follow from the stored complex gains; no RSSI, beam power or path loss field is stored.', zh: 路径功率与接收功率可由已存储的复增益计算；数据中不存储 RSSI、波束功率或路径损耗字段。}
- key: iq
  status: none
  note: {en: The channel is path-level; no transmitted waveform or I/Q samples are released or generated., zh: 信道为路径级数据；不发布也不生成发射波形或 I/Q 采样。}
- key: beam_labels
  status: derivable
  note: {en: 'Optimal beam indices are found by exhaustive search over a 64-beam DFT codebook from the stored paths, as in the paper''s beam prediction case.', zh: 最优波束索引可由已存储的路径，在 64 波束 DFT 码本上穷举搜索得到，与论文中的波束预测案例一致。}
- key: position
  status: provided
  note: {en: CAV GNSS estimates with simulated noise are in the per-frame metadata., zh: 每帧元数据中包含带仿真噪声的 CAV GNSS 位置估计。}
- key: geometry
  status: provided
  note: {en: Blender-format mirrors of all CARLA towns are in the Blender_Towns folder., zh: Blender_Towns 文件夹提供所有 CARLA 城镇的 Blender 格式副本。}
- key: materials
  status: unknown
  note: {en: The paper lists material assignments (Table IV) and ground permittivity and conductivity (Table VI); the sources do not say whether these are in the released files., zh: 论文给出材料分配（表 IV）与地面介电常数、电导率（表 VI）；来源未说明这些参数是否包含在发布文件中。}
- key: rgb
  status: provided
  note: {en: 'CAVs have four 640×480 cameras (front, rear, left, right); the RSU has one forward camera.', zh: CAV 配有四个 640×480 相机（前、后、左、右）；RSU 配有一个前向相机。}
- key: depth
  status: provided
  note: {en: 'The RSU has one forward depth camera, 640×480; CAVs have no depth camera.', zh: RSU 配有一个前向深度相机，分辨率 640×480；CAV 无深度相机。}
- key: lidar
  status: provided
  note: {en: 64-channel LiDAR with 120 m range and about 30k points per sample on CAVs and the RSU; adverse-weather LiDAR data come from specific post-processing., zh: CAV 与 RSU 均配有 64 线 LiDAR，探测距离 120 m，每样本约 3 万点；恶劣天气下的 LiDAR 数据经特定后处理得到。}
- key: radar
  status: provided
  note: {en: 'RSU only: about 2k points per sample, 100 m range, 110° horizontal and 30° vertical FOV.', zh: 仅 RSU：每样本约 2 千点，探测距离 100 m，水平视场 110°，垂直视场 30°。}
- key: imu
  status: provided
  note: {en: 'CAV IMU with noise model: accelerometer std 0.1 m/s², gyroscope std 0.002 rad/s.', zh: CAV IMU 带噪声模型：加速度计标准差 0.1 m/s²，陀螺仪标准差 0.002 rad/s。}
- key: time_series
  status: provided
  note: {en: 'Frames at 100 Hz, 800 to 1,300 frames per CAV per scenario, aligned across modalities by frame number.', zh: '100 Hz 帧序列，每个场景每个 CAV 800 至 1,300 帧，各模态按帧号对齐。'}
- key: multiuser
  status: provided
  note: {en: 'Three to four CAVs per scenario, each with its own V2I channel paths in the same frame.', zh: 每个场景 3 至 4 辆 CAV，同一帧中每辆 CAV 均有各自的 V2I 信道路径。}
- key: multibs
  status: simulate
  note: {en: 'The release includes the 3D scene, so re-running a ray tracer on it produces this output.', zh: 发布内容包含三维场景，在其上重新运行射线追踪即可产生该输出。}
- key: crossfreq
  status: simulate
  note: {en: 'The release includes the 3D scene, so re-running a ray tracer on it produces this output.', zh: 发布内容包含三维场景，在其上重新运行射线追踪即可产生该输出。}
- key: near_field
  status: simulate
  note: {en: 'The release includes the 3D scene, so re-running a ray tracer on it produces this output.', zh: 发布内容包含三维场景，在其上重新运行射线追踪即可产生该输出。}
- key: high_mobility
  status: simulate
  note: {en: 'The release includes the 3D scene, so re-running a ray tracer on it produces this output.', zh: 发布内容包含三维场景，在其上重新运行射线追踪即可产生该输出。}
- key: dynamic_blockage
  status: provided
  note: {en: 'Other vehicles are placed per frame as metal objects in the Sionna scene (Table IV), so their blockage is modelled by ray tracing.', zh: 其他车辆逐帧作为金属物体放入 Sionna 场景（表 IV），因此其遮挡由射线追踪建模。}
- key: reflection
  status: provided
  note: {en: First-order specular reflections only (maximum reflection order 1)., zh: 仅包含一阶镜面反射（最大反射阶数为 1）。}
