versions:
- version: v1.1.0
  date: '2026-10-23'
  summary: {en: 'Accelerated generation pipeline: the static scene is reused and dynamic vehicle poses are updated frame by frame in Sionna RT, about 20x faster with about 95% less total time for the same workload. Fixes issue #1; the generated channels otherwise match v1.0.0, and the fix changes them by a mean NMSE of -19.3 dB.', zh: '加速生成流程：在 Sionna RT 中复用静态场景并逐帧更新动态车辆位姿，同一工作量约快 20 倍，总耗时减少约 95%。修复 issue #1；除该修复外生成的信道与 v1.0.0 一致，修复造成的信道差异为平均 NMSE -19.3 dB。'}
  url: https://github.com/le-liang/Multimodal-Wireless/releases/tag/v1.1.0
- version: v1.0.0
  date: '2026-10-23'
  summary: {en: Original generation pipeline. The release stores the original version of the generation code., zh: 原始生成流程。该版本保存数据集生成代码的原始版本。}
  url: https://github.com/le-liang/Multimodal-Wireless/releases/tag/v1.0.0
- version: arXiv v2
  date: '2026-02-11'
  summary: {en: Revised paper. The abstract describes the channel modality as CSI and states that all modalities are sampled at 100 Hz; the v1 abstract describes a communication channel and gives no sampling rate., zh: 论文修订版。摘要将信道模态描述为 CSI，并说明所有模态以 100 Hz 采样；v1 摘要将其描述为通信信道，未给出采样率。}
  url: https://arxiv.org/abs/2511.03220v2
- version: Nov. 23, 2025
  date: '2025-11-23'
  summary: {en: Channel data augmented with additional AoD and AoA values in the local coordinate system of the planar arrays., zh: 信道数据新增基于平面阵列局部坐标系的 AoD 与 AoA 值。}
  url: https://le-liang.github.io/mmw/download.html
- version: Nov. 17, 2025
  date: '2025-11-17'
  summary: {en: Dataset updated. The download page gives no list of changes for this update., zh: 数据集更新。下载页未列出本次更新的具体变更。}
  url: https://le-liang.github.io/mmw/download.html
- version: arXiv v1
  date: '2025-11-05'
  summary: {en: 'First arXiv version. The abstract describes about 160,000 frames across four towns, sixteen communication scenarios and three weather conditions.', zh: '首个 arXiv 版本。摘要描述数据包含约 160,000 帧，覆盖四个虚拟城镇、十六种通信场景和三种天气条件。'}
  url: https://arxiv.org/abs/2511.03220v1
