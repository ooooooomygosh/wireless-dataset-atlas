id: cost2100
name: COST 2100 Channel Model
aliases: [COST2100]
year: 2012
organization: COST 2100; extended in COST IC1004 and COST CA15104 (IRACON)
origin: statistical
tasks: [channel-modeling, csi-feedback]
signals: [csi]
bands_ghz: [0.3, 2.6, 5]
environment: [indoor, outdoor-suburban]
license: GPL-3.0-or-later
access: {url: 'https://github.com/cost2100/cost2100', type: open}
code: ['https://github.com/cost2100/cost2100']
paper: doi:10.1109/mwc.2012.6393523
used_in: ['doi:10.1109/twc.2013.010413.120620', 'doi:10.1109/twc.2023.3241841', 'doi:10.1109/ojcoms.2020.2987704', 'doi:10.1109/twc.2020.3028249', 'doi:10.1109/twc.2023.3261782']
citing: ['doi:10.1109/lwc.2018.2818160', 'doi:10.1109/jsac.2017.2719924', 'doi:10.1109/comst.2017.2783541']
summary: {en: 'A MATLAB generator of spatially consistent MIMO and massive MIMO channel transfer functions for omnidirectional, dipole, measured-response, cylindrical and VLA arrays. Scenario names cover IndoorHall and SemiUrban settings at 0.3, 2.6 and 5 GHz.', zh: 用于生成空间一致性 MIMO 与大规模 MIMO 信道传递函数的 MATLAB 生成器，支持全向、偶极子、实测天线响应、圆柱阵列及 VLA 阵列。场景名称涵盖 IndoorHall 与 SemiUrban 环境，载频为 0.3、2.6 和 5 GHz。}
sources: ['https://github.com/cost2100/cost2100', 'https://github.com/cost2100/cost2100/blob/master/matlab/Readme.txt', 'https://api.crossref.org/works?query.title=The+COST+2100+MIMO+channel+model&rows=3&select=DOI,title,issued']
checked: '2026-11-06'
pipeline:
  summary: {en: 'Generate clusters and visibility regions first, then use mobile-terminal positions to determine active multipath and combine antenna responses to obtain link channels. Common CSI-feedback datasets undergo additional processing.', zh: 先生成簇与可见区域，再由移动终端位置决定活跃多径，叠加天线响应得到链路信道。CSI-feedback常用数据还经过额外加工。}
  stages:
  - title: {en: Select a supported scenario and link layout, zh: 选择受支持场景与链路布局}
    detail: {en: 'cost2100 inputs specify BSs/MSs, motion, and snapshot rate/count; first verify whether the scenario supports single or multiple links.', zh: cost2100输入指定BS/MS、运动及snapshot rate/count；先核验场景支持单链路还是多链路。}
    inputs:
    - {en: Official scenario/parameter files, zh: 官方场景/参数文件}
    - {en: 'BS/MS positions, velocities, and snapshot configuration', zh: BS/MS位置、速度和快照配置}
    outputs:
    - {en: 'Scenario and link(numBS,numMS) configuration', zh: '场景与link(numBS,numMS)配置'}
    controls:
    - {en: 'Researcher specifies: scenario name, frequency, BS/MS counts, velocities, snapshot count, and seed', zh: 研究者固定：场景名、频率、BS/MS数量、速度、快照数及seed}
    checks:
    - {en: 'Check demo restrictions, including those for IndoorHall_5GHz', zh: IndoorHall_5GHz等限制按demo核对}
    - {en: Do not extrapolate a band's parameter set to other frequencies without explanation, zh: 不把某频段参数集无说明外推到其他频率}
  - title: {en: Generate clusters and visibility regions, zh: 生成簇及visibility regions}
    detail: {en: 'Generate environmental clusters, MPC/DMC records, and visibility regions; visibility determines which clusters terminals can receive.', zh: 生成环境簇、MPC/DMC记录及可见区域；可见性控制终端能够接收哪些簇。}
    inputs:
    - {en: Layout and scenario statistics, zh: 布局和场景统计}
    outputs:
    - {en: env.cluster/mpc/dmc and VR-related environment records, zh: env.cluster/mpc/dmc及VR相关环境记录}
    controls:
    - {en: 'Researcher specifies: scenario parameterization and cluster structures to be shared', zh: 研究者固定：场景参数化与需共享的簇结构}
    checks:
    - {en: Preserve shared-cluster relationships across links, zh: 多链路应保留共享簇关系}
    - {en: Random cluster coordinates are not interaction points from RT on real buildings, zh: 随机簇坐标不等于来自真实建筑RT的交互点}
  - title: {en: Update visible multipath with position, zh: 随位置更新可见多径}
    detail: {en: 'As mobile terminals enter or leave visibility regions, path powers and structure change with position; multi-BS/MS associations follow the corresponding model settings.', zh: 移动终端进入或离开可见区域，使路径功率与结构随位置变化；多BS/MS关联由相应模型设置决定。}
    inputs:
    - {en: Terminal trajectories, zh: 终端轨迹}
    - {en: Clusters and visibility regions, zh: 簇与可见区域}
    outputs:
    - {en: Active cluster/path parameters per snapshot, zh: 逐快照活跃簇/路径参数}
    controls:
    - {en: 'Researcher specifies: velocity, sampling interval, and link associations supported by the scenario', zh: 研究者固定：速度、采样间隔和场景支持的链路关联}
    checks:
    - {en: Check consistency between time steps and travel distance, zh: 检查时间步与运动距离一致}
    - {en: Independently generated clusters for each BS do not preserve cross-link correlation, zh: 不能把独立生成各BS的簇称作已保留跨链路相关}
  - title: {en: Synthesize antenna channels, zh: 合成天线信道}
    detail: {en: 'Map propagation parameters to complex link channels, retaining model outputs and environment records for verification.', zh: 把传播参数映射为链路复信道，保留模型输出与环境记录供复核。}
    inputs:
    - {en: Active multipath, zh: 活跃多径}
    - {en: Array/antenna responses, zh: 阵列/天线响应}
    outputs:
    - {en: Per-link complex channels, zh: 逐链路复信道}
    - {en: Associated positions and environment information, zh: 配套位置和环境信息}
    controls:
    - {en: 'Researcher specifies: antenna count, responses, frequency-domain sampling, and storage axes', zh: 研究者固定：天线数、响应、频域采样和存储轴}
    checks:
    - {en: Check path energy and output scale, zh: 检查路径能量与输出尺度}
    - {en: Compare correlation under static and mobile configurations, zh: 比较静止与移动配置下的相关性}
  - title: {en: Create feedback or prediction samples, zh: 制作反馈或预测样本}
    detail: {en: CSI-feedback workflows may transform channels to the angle-delay domain and crop/normalize them; register these derived tensors separately from the model's original outputs., zh: CSI-feedback流程可能把信道变到角延迟域并裁剪/归一化；这些派生张量必须与模型原始输出分开登记。}
    inputs:
    - {en: Raw channels, zh: 原始信道}
    - {en: 'Researcher-defined FFT, cropping, and normalization rules', zh: 研究者定义的FFT、裁剪与归一化规则}
    outputs:
    - {en: Task tensors and normalization parameters, zh: 任务张量与归一化参数}
    controls:
    - {en: 'Researcher specifies: retained angle-delay axes, antennas and subcarriers, sequence/layout splits', zh: 研究者固定：保留角延迟轴、天线和子载波、序列/布局切分}
    checks:
    - {en: Check energy and physical information lost through cropping, zh: 检查裁剪丢失的能量和物理信息}
    - {en: Normalized feedback data cannot directly recover absolute link powers that were not saved, zh: 不能从归一化反馈数据直接恢复未保存的绝对链路功率}
  scope: {en: Official COST2100 MATLAB interfaces and model paper; multilink functionality is constrained by scenario parameterization., zh: COST2100官方MATLAB接口与模型论文；多链路功能按场景参数化限定。}
