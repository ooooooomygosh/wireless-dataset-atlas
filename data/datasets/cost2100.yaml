technical_notes:
- {en: 'Supported by the literature: the 2012 model first generates clusters and visibility regions, then uses mobile-terminal positions to determine visible paths; the same static environment supports channels that change along trajectories.', zh: 文献支持：2012模型先生成簇和visibility regions，再由移动终端位置决定可见路径；同一静态环境支持随轨迹变化的信道。}
- {en: 'Supported by the literature: §V.C represents multi-BS/multi-MS correlation through clusters and visibility regions shared by multiple links; independently generating clusters for each BS cannot guarantee the required link correlation.', zh: 文献支持：§V.C 用多个链路共享的簇及visibility regions描述多BS、多MS相关性；独立生成每个BS的簇不能保证所需链路相关。}
- {en: 'Supported by the literature: the paper discusses polarization and dense multipath extensions; §VI.A lists measurement parameterizations at 400 MHz and 3.6/5.3 GHz, noting that DMC and multilink parameters still required more measurements at that time.', zh: 文献支持：论文讨论极化与dense multipath扩展；§VI.A列举400 MHz、3.6/5.3 GHz测量参数化，并指出当时DMC与多链路参数仍需更多测量。}
- {en: 'Confirmed: the official main function accepts BS/MS positions, MS velocity, and snapshot rate/count, and outputs per-link channels and cluster/MPC/DMC records.', zh: 已确认：官方主函数接收BS/MS位置、MS速度、snapshot rate/count，输出逐链路channel及簇/MPC/DMC记录。}
- {en: 'Confirmed: the current 5.3 GHz demo scenario is single-link only; 300 MHz multilink support is limited to LOS; the 2.6 GHz extension also includes closely spaced users and very-large-array scenarios.', zh: 已确认：当前demo的5.3 GHz场景仅单链路；300 MHz多链路限LOS；2.6 GHz扩展另含近邻用户和very-large-array场景。}
- {en: 'Inference: derived CSI after angle-delay truncation retains only part of the channel information; recoverability depends on the retained axes and normalization.', zh: 推断：角延迟截断后的派生CSI仅保留部分信道信息，任务可恢复范围取决于保留的轴与归一化。}
limitations:
- {en: 'Record the model, official MATLAB implementation, and derived tensors from papers such as CsiNet separately, including versions, arrays, frequency-domain transforms, and splits.', zh: 模型、官方MATLAB实现和CsiNet等论文派生张量须分别记录版本、阵列、频域转换及划分。}
- {en: Multiuser scheduling should use shared environments and cluster relationships; nearby users in the same environment should not be randomly distributed across train and test splits., zh: 多用户调度使用共享环境和簇关系；同一环境的近邻用户不应随机跨越训练与测试划分。}
- {en: 'Beyond compression NMSE, evaluate precoding rates and overhead using reconstructed channels.', zh: 压缩NMSE之外，应评估重建信道驱动的预编码速率与开销。}
- {en: 'Current verification covers interfaces, scenario restrictions, and the original model; multi-BS examples have not been run and joint cross-band parameterization has not been validated.', zh: 当前核验覆盖接口、场景限制与原始模型；尚未运行多BS示例或验证跨频段联合参数化。}
