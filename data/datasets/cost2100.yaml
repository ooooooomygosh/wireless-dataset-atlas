summary: {en: 'A MATLAB generator of spatially consistent MIMO and massive MIMO channel transfer functions for omnidirectional, dipole, measured-response, cylindrical and VLA arrays. Scenario names cover IndoorHall and SemiUrban settings at 0.3, 2.6 and 5 GHz.', zh: 用于生成空间一致性 MIMO 与大规模 MIMO 信道传递函数的 MATLAB 生成器，支持全向、偶极子、实测天线响应、圆柱阵列及 VLA 阵列。场景名称涵盖 IndoorHall 与 SemiUrban 环境，载频为 0.3、2.6 和 5 GHz。}
