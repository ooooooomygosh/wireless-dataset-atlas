aliases: [COST2100]
year: 2012
organization: COST 2100; extended in COST IC1004 and COST CA15104 (IRACON)
origin: statistical
tasks: [channel-modeling, csi-feedback]
signals: [csi]
bands_ghz: [0.3, 2.6, 5.3]
environment: [indoor, outdoor-suburban]
license: GPL-3.0-or-later
access: {url: 'https://github.com/cost2100/cost2100', type: open}
code: ['https://github.com/cost2100/cost2100']
paper: doi:10.1109/mwc.2012.6393523
used_in: ['doi:10.1109/twc.2013.010413.120620', 'doi:10.1109/twc.2023.3241841', 'doi:10.1109/ojcoms.2020.2987704', 'doi:10.1109/twc.2020.3028249', 'doi:10.1109/twc.2023.3261782']
citing: ['doi:10.1109/lwc.2018.2818160', 'doi:10.1109/jsac.2017.2719924', 'doi:10.1109/comst.2017.2783541']
summary: {en: 'A MATLAB generator of spatially consistent MIMO and massive MIMO channel transfer functions for omnidirectional, dipole, measured-response, cylindrical and VLA arrays. Scenario names cover IndoorHall and SemiUrban settings at 0.3, 2.6 and 5 GHz.', zh: 用于生成空间一致性 MIMO 与大规模 MIMO 信道传递函数的 MATLAB 生成器，支持全向、偶极子、实测天线响应、圆柱阵列及 VLA 阵列。场景名称涵盖 IndoorHall 与 SemiUrban 环境，载频为 0.3、2.6 和 5 GHz。}
sources: ['https://github.com/cost2100/cost2100', 'https://github.com/cost2100/cost2100/blob/master/matlab/Readme.txt', 'https://api.crossref.org/works?query.title=The+COST+2100+MIMO+channel+model&rows=3&select=DOI,title,issued', 'https://raw.githubusercontent.com/cost2100/cost2100/master/README.md', 'https://raw.githubusercontent.com/cost2100/cost2100/master/matlab/Readme.txt', 'https://raw.githubusercontent.com/cost2100/cost2100/master/matlab/cost2100.m', 'https://raw.githubusercontent.com/cost2100/cost2100/master/matlab/demo_model.m', 'https://raw.githubusercontent.com/cost2100/cost2100/master/matlab/get_para.m', 'https://raw.githubusercontent.com/cost2100/cost2100/master/matlab/get_cluster.m', 'https://raw.githubusercontent.com/cost2100/cost2100/master/matlab/update_chan.m', 'https://api.crossref.org/works/10.1109/mwc.2012.6393523', 'https://github.com/cost2100/cost2100/tags', 'https://raw.githubusercontent.com/cost2100/cost2100/master/matlab/changelog.txt', 'https://raw.githubusercontent.com/cost2100/cost2100/master/matlab/get_channel.m',
  'https://raw.githubusercontent.com/cost2100/cost2100/master/matlab/create_IR_Cyl.m', 'https://raw.githubusercontent.com/cost2100/cost2100/master/matlab/get_dipole_G.m']
checked: '2026-11-06'
pipeline:
  summary: {en: 'The generator first builds visibility regions and stochastic clusters, then uses mobile-terminal positions to decide which multipath components are visible. Antenna responses are then combined with these components to produce complex link channels.', zh: 生成器先构建可见区域与随机簇，再由移动终端位置决定哪些多径分量可见，随后将天线响应与这些分量合成为复数链路信道。}
  stages:
  - title: {en: 'Select network, link and band', zh: 选择网络、链路与频段}
    detail: {en: 'cost2100 takes a network name, a scenario (LOS or NLOS), a frequency range, snapshot rate and count, BS positions and spacing, and MS positions and velocities. The demo script lists tested combinations and shows that IndoorHall_5GHz accepts only a single link.', zh: cost2100 的输入包括网络名、场景（LOS 或 NLOS）、频率范围、快照速率与数量、BS 位置与间距，以及 MS 位置和速度。演示脚本列出了已测试的组合，并显示 IndoorHall_5GHz 仅支持单链路。}
    inputs:
    - {en: Official parameter definitions for each network (get_para), zh: 各网络的官方参数定义（get_para）}
    outputs:
    - {en: 'Scenario and link configuration, link(numBS, numMS)', zh: '场景与链路配置，link(numBS, numMS)'}
  - title: {en: 'Generate visibility regions, clusters and multipath', zh: 生成可见区域、簇与多径}
    detail: {en: 'get_VRtable and get_MS_VR build the visibility-region table and the MS visibility regions. get_cluster draws cluster parameters from random distributions, and get_mpc and get_dmc create the discrete multipath components (MPCs) and diffuse components (DMCs). All links share one cluster set; BS-local and MS-local clusters are generated separately.', zh: get_VRtable 与 get_MS_VR 构建可见区域表和 MS 可见区域；get_cluster 从随机分布中抽取簇参数，get_mpc 与 get_dmc 生成离散多径分量（MPC）和漫散射分量（DMC）。所有链路共享同一簇集合，BS 本地簇与 MS 本地簇另行生成。}
    outputs:
    - {en: 'Cluster, MPC, DMC and visibility-region records in the env structure', zh: env 结构中的簇、MPC、DMC 与可见区域记录}
    checks:
    - {en: Clusters are drawn from random distributions and are not ray-tracing interaction points, zh: 簇由随机分布抽取，不是射线追踪的交互点}
  - title: {en: Update visible multipath along trajectories, zh: 沿轨迹更新可见多径}
    detail: {en: 'For each snapshot, update_chan updates every MS according to its velocity, and get_channel evaluates each BS-MS pair using the visibility-region tables.', zh: 每个快照中，update_chan 按各 MS 的速度更新其状态，get_channel 利用可见区域表计算每个 BS-MS 组合的信道。}
    inputs:
    - {en: 'MS positions and velocities, snapshot rate and count', zh: MS 位置与速度、快照速率与数量}
    outputs:
    - {en: Per-link channel information for each snapshot, zh: 逐快照的链路信道信息}
  - title: {en: Combine with antenna responses, zh: 与天线响应合成}
    detail: {en: 'The antenna option selects the transfer-function routine, for example create_IR_omni_MIMO, create_IR_Cyl or create_IR_omni_MIMO_VLA. Each routine combines the link''s multipath with the chosen array response and the frequency separation delta_f.', zh: 天线选项决定所用的传递函数例程，例如 create_IR_omni_MIMO、create_IR_Cyl 或 create_IR_omni_MIMO_VLA。每个例程将链路的多径与所选阵列响应及频率间隔 delta_f 合成。}
    outputs:
    - {en: Complex MIMO channel transfer functions per link, zh: 逐链路的复数 MIMO 信道传递函数}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: 'Per-link channel information in the link structure, and the environment record (clusters, MPCs and DMCs) in the env structure.', zh: link 结构中的逐链路信道信息，以及 env 结构中的环境记录（簇、MPC 与 DMC）。}
provenance:
- {en: Select scenario parameters and layout, zh: 选择场景参数与布局}
- {en: Geometry-based stochastic clusters and spatial consistency, zh: 几何随机簇及空间一致性}
- {en: Antenna responses, zh: 天线响应}
- {en: Complex channels, zh: 复信道}
- {en: Researcher applies FFT/truncation/normalization to create a derived CSI benchmark, zh: 研究者 FFT/截断/归一化形成派生 CSI benchmark}
technical_notes:
- {en: 'The code generates visibility regions and clusters first, then uses MS positions to determine the visible multipath along each trajectory, so the same static environment supports channels that change along a trajectory.', zh: 代码先生成可见区域与簇，再由 MS 位置决定沿各轨迹可见的多径，因此同一静态环境可以支持沿轨迹变化的信道。}
- {en: 'The main function generates one cluster set from a shared visibility-region table for all links, and adds BS-local and MS-local clusters separately.', zh: 主函数基于共享的可见区域表为所有链路生成同一簇集合，并另行加入 BS 本地簇与 MS 本地簇。}
- {en: Version 3.1 added Indoor_CloselySpacedUser_2_6GHz and modified the VLA and MPC gain extensions for Massive MIMO., zh: 3.1 版新增 Indoor_CloselySpacedUser_2_6GHz，并修改了大规模 MIMO 的 VLA 与 MPC 增益扩展。}
- {en: The 2.6 GHz extension includes closely spaced-user and very-large-array scenarios., zh: 2.6 GHz 扩展包含近距用户与超大规模阵列（VLA）场景。}
limitations:
- {en: 'Multi-link simulation depends on the network: IndoorHall_5GHz rejects multiple links, and SemiUrban_300MHz supports them for LOS only.', zh: 多链路仿真取决于网络类型：IndoorHall_5GHz 不支持多链路，SemiUrban_300MHz 的多链路仅支持 LOS。}
- {en: 'The package ships no channel data; the output size follows the frequency range, snapshot count and number of links set at run time.', zh: 发布包不含信道数据；输出规模取决于运行时设定的频率范围、快照数与链路数量。}
history:
- {en: '2012: The COST 2100 MIMO channel model was published in IEEE Wireless Communications, vol. 19, no. 6, pp. 92-99.', zh: 2012 年：The COST 2100 MIMO channel model 发表于 IEEE Wireless Communications，第 19 卷第 6 期，第 92-99 页。}
- {en: The Readme records versions from 1.00 (2005) through 2.3 to 3.1; version 3.0 made the Massive MIMO extensions fully backward compatible., zh: Readme 记录了从 1.00（2005 年）到 2.3 再到 3.1 的版本；3.0 版使大规模 MIMO 扩展完全向后兼容。}
usage:
- {en: 'Start from the tested network, link, antenna and band combinations listed in demo_model.m.', zh: 从 demo_model.m 中列出的已测试网络、链路、天线与频段组合开始。}
- {en: 'Set BS and MS positions, MS velocity, snapRate, snapNum and a two-element frequency range in Hz; cost2100 rejects other shapes.', zh: 设置 BS 与 MS 位置、MS 速度、snapRate、snapNum 以及以 Hz 表示的两元素频率范围；cost2100 会拒绝其他形式的输入。}
- {en: The cylindrical array option needs antenna pattern files in the format of BS_Cyl_AntPattern.mat and MS_AntPattern_User.mat., zh: 圆柱阵列选项需要与 BS_Cyl_AntPattern.mat 和 MS_AntPattern_User.mat 格式相同的天线方向图文件。}
overview: {en: 'COST 2100 is a MATLAB implementation of a spatially consistent MIMO and massive MIMO channel model. Lingfeng Liu (UCL) wrote the original code, and Lund University revised versions 2.3 to 3.1, including the massive MIMO scenarios at 2.6 GHz. It is a channel generator rather than a measured dataset: the main function cost2100 returns, for each BS-MS link, the channel information and an environment record with clusters, MPCs and DMCs, computed from the BS and MS positions, MS velocity, snapshot rate and snapshot count supplied by the user. The code supports five networks: IndoorHall_5GHz, SemiUrban_300MHz, Indoor_CloselySpacedUser_2_6GHz, SemiUrban_CloselySpacedUser_2_6GHz and SemiUrban_VLA_2_6GHz. The demo scripts use 275-295 MHz for SemiUrban_300MHz, 2.58-2.62 GHz for the closely spaced-user networks, 2.57-2.62 GHz for the VLA network and 5.29-5.31 GHz for IndoorHall_5GHz. The package ships antenna pattern files but no channel data, so the output size depends on the parameters
    chosen when the script runs.', zh: COST 2100 是以 MATLAB 实现的空间一致性 MIMO 与大规模 MIMO 信道模型。原始代码由 UCL 的 Lingfeng Liu 编写，隆德大学（Lund University）修订了 2.3 至 3.1 版，包括 2.6 GHz 的大规模 MIMO 场景。它是信道生成器而非实测数据集：主函数 cost2100 根据用户给定的 BS 与 MS 位置、MS 速度、快照速率和快照数，为每条 BS-MS 链路返回信道信息，以及包含簇、MPC 和 DMC 的环境记录。代码支持五种网络：IndoorHall_5GHz、SemiUrban_300MHz、Indoor_CloselySpacedUser_2_6GHz、SemiUrban_CloselySpacedUser_2_6GHz 和 SemiUrban_VLA_2_6GHz。示例脚本中，SemiUrban_300MHz 使用 275-295 MHz，近距用户类网络使用 2.58-2.62 GHz，VLA 网络使用 2.57-2.62 GHz，IndoorHall_5GHz 使用 5.29-5.31 GHz。发布包中只附带天线方向图文件而不含信道数据，因此输出规模取决于运行脚本时设定的参数。}
signal_details:
- signal: csi
  text: {en: 'Complex channel transfer functions are returned as MATLAB arrays, computed per BS-MS link over snapNum snapshots. The frequency range is given in Hz through freq, and snapRate sets the snapshots per second. Antenna options are SISO omnidirectional, 2x2 MIMO with omnidirectional elements, theoretical lambda/2-spaced linear dipole arrays, measured antenna responses, a 128-element cylindrical array (MIMO_Cyl_patch) and a 128-element omnidirectional VLA with lambda/2 spacing (MIMO_VLA_omni).', zh: 复数信道传递函数以 MATLAB 数组形式返回，按 BS-MS 链路并在 snapNum 个快照上计算。频率范围以 Hz 通过 freq 指定，snapRate 设定每秒快照数。天线选项包括：SISO 全向天线、全向单元的 2x2 MIMO、任意规模的 lambda/2 间距线性偶极子阵列的理论响应、实测天线响应、128 单元圆柱阵列（MIMO_Cyl_patch），以及间距为 lambda/2 的 128 单元全向 VLA（MIMO_VLA_omni）。}
capabilities:
- key: csi
  status: simulate
  note: {en: Complex transfer functions over the chosen frequency range are computed per BS-MS link at run time; no channel data are shipped., zh: 所选频率范围内的复数传递函数在运行时按 BS-MS 链路计算；发布包不含信道数据。}
- key: cir
  status: simulate
  note: {en: The generator returns frequency-domain transfer functions; an impulse response needs an inverse FFT of the generated output., zh: 生成器输出频域传递函数；冲激响应需对生成结果做逆 FFT。}
- key: paths
  status: simulate
  note: {en: 'Clusters, MPCs and DMCs are drawn at run time and held in the env structure; no path tables are shipped.', zh: 簇、MPC 与 DMC 在运行时抽取并保存在 env 结构中；发布包不含路径表。}
- key: interaction
  status: none
  note: {en: 'Clusters are random-distribution scatterers, not ray-tracing interaction points, so no surface or interaction order is recorded.', zh: 簇由随机分布抽取，并非射线追踪的交互点，因此不记录反射面或交互阶数。}
- key: power
  status: simulate
  note: {en: Path loss is computed by calc_pathloss.m at run time; no power or path loss values are shipped., zh: 路径损耗由 calc_pathloss.m 在运行时计算；发布包不含功率或路径损耗数值。}
- key: iq
  status: none
  note: {en: The outputs are channel transfer functions and the environment record; the sources describe no waveform or I/Q output., zh: 输出为信道传递函数与环境记录；来源未描述波形或 I/Q 输出。}
- key: beam_labels
  status: none
  note: {en: The package has no beam codebook and no beam indices or per-beam gains., zh: 发布包不含波束码本，也不含波束索引或逐波束增益。}
- key: position
  status: simulate
  note: {en: BS and MS positions are inputs set when the generator runs; no position data are shipped., zh: BS 与 MS 位置是运行生成器时设定的输入；发布包不含位置数据。}
- key: geometry
  status: simulate
  note: {en: Cluster and visibility-region geometry is generated at run time; the package ships no map or scene files., zh: 簇与可见区域几何在运行时生成；发布包不含地图或场景文件。}
- {key: materials, status: unknown}
- key: rgb
  status: none
  note: {en: The channel generator produces no optical images., zh: 信道生成器不产生光学图像。}
- key: depth
  status: none
  note: {en: The channel generator produces no depth maps., zh: 信道生成器不产生深度图。}
- key: lidar
  status: none
  note: {en: The channel generator produces no LiDAR data., zh: 信道生成器不产生 LiDAR 数据。}
- key: radar
  status: none
  note: {en: The channel generator produces no radar data., zh: 信道生成器不产生雷达数据。}
- key: imu
  status: none
  note: {en: The channel generator produces no IMU data., zh: 信道生成器不产生 IMU 数据。}
- key: time_series
  status: simulate
  note: {en: 'Snapshot count and rate are set at run time (snapNum, snapRate); the demo scripts use 1 to 100 ordered snapshots.', zh: 快照数与速率在运行时设定（snapNum、snapRate）；演示脚本使用 1 至 100 个有序快照。}
- key: multiuser
  status: simulate
  note: {en: One run takes several MS links from the MSPos and MSVelo tables; IndoorHall_5GHz rejects multiple links and SemiUrban_300MHz supports them for LOS only., zh: 一次运行从 MSPos 与 MSVelo 表读取多个 MS 链路；IndoorHall_5GHz 不支持多链路，SemiUrban_300MHz 仅 LOS 支持多链路。}
- key: multibs
  status: simulate
  note: {en: 'BSPosCenter can hold several BS positions, and link(numBS, numMS) indexes all BS-MS pairs of one run.', zh: 'BSPosCenter 可包含多个 BS 位置，link(numBS, numMS) 索引一次运行中的所有 BS-MS 链路。'}
- {key: crossfreq, status: unknown}
- key: near_field
  status: none
  note: {en: 'Array responses use far-field antenna patterns and plane-wave phase terms, as in the half-wavelength linear array response of get_dipole_G.', zh: 阵列响应采用远场天线方向图与平面波相位项，例如 get_dipole_G 中的半波长线阵响应。}
- key: high_mobility
  status: simulate
  note: {en: MS velocity is a free input in m/s with no upper limit stated; the demo scripts use 0.1 to 0.9 m/s., zh: MS 速度为以 m/s 设定的自由输入，来源未给出上限；演示脚本使用 0.1 至 0.9 m/s。}
- key: dynamic_blockage
  status: none
  note: {en: The environment is static; visibility regions change only with MS position along the trajectory., zh: 环境为静态；可见区域仅随 MS 沿轨迹的位置变化而改变。}
- {key: reflection, status: unknown}
- {key: diffraction, status: unknown}
- key: scattering
  status: simulate
  note: {en: Clusters and diffuse components (DMC) are generated at run time., zh: 簇与漫散射分量（DMC）在运行时生成。}
- {key: transmission, status: unknown}
- key: polarization
  status: simulate
  note: {en: 'Each MPC carries four polarization amplitudes (vv, vh, hh, hv) generated at run time.', zh: 每个 MPC 带有四个极化幅度（vv、vh、hh、hv），在运行时生成。}
- key: em_field
  status: provided
  note: {en: 'Only sample antenna pattern files are shipped (antSample.mat, BS_Cyl_AntPattern.mat, MS_AntPattern_User.mat); the model outputs no E-field or field strength.', zh: 仅附带天线方向图样例文件（antSample.mat、BS_Cyl_AntPattern.mat、MS_AntPattern_User.mat）；模型不输出电场或场强。}
