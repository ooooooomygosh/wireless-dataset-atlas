usage:
- {en: Pin the official implementation and network name; start with tested network/link/antenna/band combinations listed in the demos., zh: 固定官方实现与network名称；从demo列出的已测试network/link/antenna/band组合开始。}
- {en: 'Explicitly set BS/MS positions, velocity, snapRate, snapNum, and frequency range; check link and env dimensions.', zh: 显式设置BS/MS位置、速度、snapRate、snapNum和频率区间，检查link与env维度。}
- {en: 'Add the corresponding antenna responses to generate full complex channels; separately save scripts for FFT, angle-delay truncation, normalization, and group-based splits.', zh: 加入对应天线响应生成完整复数信道；另存FFT、角延迟截断、归一化和分组划分脚本。}
- {en: 'Compare the uncompressed oracle and simple baselines such as PCA first, then compute precoding utility using reconstructed channels.', zh: 先比较未压缩oracle、PCA等简单基线，再计算重建信道驱动的预编码utility。}
overview: {en: 'COST 2100 is a MATLAB implementation of a spatially consistent MIMO and massive MIMO channel model. Lingfeng Liu (UCL) wrote the original code, and Lund University revised it in versions 2.3 to 3.1, including the massive MIMO scenarios at 2.6 GHz. It is a channel generator, not a measured dataset: the main function cost2100 returns, for each BS-MS link, the channel information and an environment record with clusters, MPCs and DMCs, from the BS and MS positions, MS velocity, snapshot rate and snapshot count supplied by the user. The code supports five networks: IndoorHall_5GHz, SemiUrban_300MHz, Indoor_CloselySpacedUser_2_6GHz, SemiUrban_CloselySpacedUser_2_6GHz and SemiUrban_VLA_2_6GHz. The demo scripts use the bands 275-295 MHz, 2.58-2.62 GHz and 5.29-5.31 GHz. The package ships antenna pattern files, not channel data, so the output size depends on the parameters chosen when the script runs.', zh: COST 2100 是一个以 MATLAB 实现的空间一致性 MIMO 与大规模 MIMO 信道模型。原始代码由 UCL 的 Lingfeng Liu
    编写，隆德大学（Lund University）在 2.3 至 3.1 版中对其作了修改，包括 2.6 GHz 的大规模 MIMO 场景。它是信道生成器，而非实测数据集：主函数 cost2100 根据用户给定的 BS 与 MS 位置、MS 速度、快照速率和快照数，为每条 BS-MS 链路返回信道信息，以及包含 cluster、MPC 和 DMC 的环境记录。代码支持五种网络场景：IndoorHall_5GHz、SemiUrban_300MHz、Indoor_CloselySpacedUser_2_6GHz、SemiUrban_CloselySpacedUser_2_6GHz 和 SemiUrban_VLA_2_6GHz。示例脚本使用的频段为 275-295 MHz、2.58-2.62 GHz 和 5.29-5.31 GHz。发布包中只附带天线方向图文件，不附带信道数据，输出规模取决于运行脚本时设定的参数。}
signal_details:
- signal: csi
  text: {en: 'Complex channel transfer functions in MATLAB arrays, computed per BS-MS link over the snapshot count snapNum. The frequency range is given in Hz through freq, and the snapshot rate through snapRate in snapshots per second. Antenna options: SISO omni-directional, 2x2 MIMO with omni-directional elements, theoretical lambda/2-spaced linear dipole arrays, measured antenna responses, a 128-element cylindrical array (MIMO_Cyl_patch) and a 128-element omni-directional VLA with lambda/2 spacing (MIMO_VLA_omni).', zh: 以 MATLAB 复数数组表示的信道传递函数，按 BS-MS 链路并在 snapNum 个快照上计算。频率范围以 Hz 通过 freq 指定，快照速率以每秒快照数通过 snapRate 指定。天线选项包括：SISO 全向天线、全向单元的 2x2 MIMO、任意规模的 lambda/2 间距线性偶极子阵列的理论响应、实测天线响应、128 单元圆柱阵列（MIMO_Cyl_patch），以及间距为 lambda/2 的 128 单元全向 VLA（MIMO_VLA_omni）。}
