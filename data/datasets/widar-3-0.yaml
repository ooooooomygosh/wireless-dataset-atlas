summary: {en: 'Commodity Wi-Fi RSSI and CSI recordings of hand gestures, with 258K instances totalling 8,620 minutes across 75 domains. Doppler frequency shift (DFS) and body-coordinate velocity profile (BVP) features are included.', zh: '商用 Wi-Fi 采集的手势 RSSI 与 CSI 记录，共 258K 个手势实例，总时长 8,620 分钟，覆盖 75 个域。数据中包含多普勒频移（DFS）与身体坐标速度分布（BVP）特征。'}
