facts:
- label: {en: Line-of-sight coverage, zh: 视距覆盖}
  text: {en: 'espargos-0001 contains only line-of-sight channels. In espargos-0002, a metal wall blocks the line-of-sight path in parts of the measurement area, and the wall is later removed.', zh: espargos-0001 仅包含视距信道。在 espargos-0002 中，金属墙在测量区域的部分区域阻挡视距路径，之后墙体被移除。}
- label: {en: Subcarrier layout, zh: 子载波配置}
  text: {en: 'espargos-0001, -0002 and -0005 use 117 OFDM subcarriers over a 36.562 MHz signal bandwidth. espargos-0007 uses 53 OFDM subcarriers over 16.562 MHz.', zh: espargos-0001、-0002 和 -0005 使用 117 个 OFDM 子载波，信号带宽为 36.562 MHz。espargos-0007 使用 53 个 OFDM 子载波，信号带宽为 16.562 MHz。}
- label: {en: Coordinate convention, zh: 坐标约定}
  text: {en: Antenna locations and point-cloud coordinates use a right-handed Cartesian frame in meters. The origin and orientation of the frame are arbitrary., zh: 天线位置与点云坐标采用右手笛卡尔坐标系，单位为米。坐标系的原点与朝向是任意选取的。}
- label: {en: Publication dates, zh: 发布日期}
  text: {en: 'The DaRUS records were published on 12 July 2024 (espargos-0001), 27 August 2024 (espargos-0002), 10 February 2025 (espargos-0005) and 7 April 2025 (espargos-0007).', zh: DaRUS 记录的发布日期分别为：espargos-0001 于 2024 年 7 月 12 日，espargos-0002 于 2024 年 8 月 27 日，espargos-0005 于 2025 年 2 月 10 日，espargos-0007 于 2025 年 4 月 7 日。}
usage:
- {en: 'The TFRecord examples are read with tf.data.TFRecordDataset and parsed with tf.io.parse_tensor. In espargos-0007, csi is complex64 with shape (4, 2, 4, 53), rssi is float32 with shape (4, 2, 4), pos is a float64 vector of length 3 in meters, and time is a float64 in seconds since the UNIX epoch.', zh: 'TFRecord 样本使用 tf.data.TFRecordDataset 读取，并通过 tf.io.parse_tensor 解析。在 espargos-0007 中，csi 为 complex64，形状为 (4, 2, 4, 53)；rssi 为 float32，形状为 (4, 2, 4)；pos 为长度为 3 的 float64 向量，单位为米；time 为 float64，以自 UNIX 纪元起的秒数表示。'}
