summary: {en: 'Phase- and time-synchronized WiFi CSI at 2.462 GHz from four ESPARGOS arrays (8 antennas each) in lab rooms, with position tags and timestamps as ground truth. Four datasets (espargos-0001, -0002, -0005, -0007) are hosted on DaRUS.', zh: 来自四个 ESPARGOS 阵列（每个 8 根天线）的相位与时间同步 WiFi CSI，中心频率 2.462 GHz，采集于实验室房间，以位置标签和时间戳作为真值。四个数据集（espargos-0001、-0002、-0005、-0007）托管于 DaRUS。}
sources: ['https://espargos.net/research/', 'https://espargos.net/datasets/data/espargos-0007/', 'https://darus.uni-stuttgart.de/citation?persistentId=doi:10.18419/DARUS-4973', 'https://darus.uni-stuttgart.de/citation?persistentId=doi:10.18419/DARUS-4754', 'https://darus.uni-stuttgart.de/citation?persistentId=doi:10.18419/darus-4456', 'https://darus.uni-stuttgart.de/citation?persistentId=doi:10.18419/darus-4352', 'https://arxiv.org/abs/2408.16377', 'https://arxiv.org/html/2408.16377', 'https://github.com/ESPARGOS/pyespargos']
checked: '2026-11-06'
overview: {en: 'The ESPARGOS phase-coherent CSI datasets are four WiFi channel state information (CSI) recordings made with ESPARGOS arrays and hosted on DaRUS as espargos-0001, espargos-0002, espargos-0005 and espargos-0007. They accompany arXiv:2408.16377 and the project site espargos.net. Each ESPARGOS array has 8 antennas in 2 rows of 4 patch antennas, and each antenna is connected to an ESP32-S2 WiFi microcontroller; the boards share one clock and a phase reference, so the CSI is phase-synchronous across antennas. The measurements were made in indoor lab rooms: espargos-0001 points four arrays at a small area, espargos-0002 combines four arrays into one 8 by 4 array in a room with a metal wall, espargos-0005 places four arrays in the room corners, and espargos-0007 uses four synchronized arrays with four ceiling transmitters. Each datapoint holds the CSI tensor H of shape B x 2 x 4 x Nsub, RSSI values, the transmitter position and a timestamp in seconds. In the paper''s campaign the
    transmitter is mounted on a robot that follows custom trajectories, and a Leica MS60 total station tracks it with millimeter-level accuracy. The espargos-0007 release has 16 TFRecord files, and its empty-room file contains no position data.', zh: 'ESPARGOS 相位相干 CSI 数据集包含四组使用 ESPARGOS 阵列采集的 WiFi 信道状态信息（CSI）记录，托管于 DaRUS，编号为 espargos-0001、espargos-0002、espargos-0005 和 espargos-0007。数据集与 arXiv:2408.16377 及项目网站 espargos.net 相关。每个 ESPARGOS 阵列有 8 根天线，排列为 2 行 4 列的贴片天线，每根天线连接一个 ESP32-S2 WiFi 微控制器；各板卡共享同一时钟和相位参考，因此各天线的 CSI 相位同步。测量在室内实验室中进行：espargos-0001 将四个阵列指向一个小区域，espargos-0002 将四个阵列组合为一个 8×4 阵列，置于带金属墙的房间中，espargos-0005 将四个阵列放置在房间四角，espargos-0007 使用四个同步阵列和天花板上的四个发射机。每个数据点包含形状为 B×2×4×Nsub 的 CSI 张量 H、RSSI 值、发射机位置以及以秒计的时间戳。论文的测量中，发射机安装在按自定义轨迹运动的机器人上，Leica MS60 全站仪以毫米级精度对其跟踪。espargos-0007 发布包含 16 个 TFRecord 文件，其中空房间文件不含位置数据。'}
signal_details:
- signal: csi
  text: {en: 'WiFi CSI from the HT-LTF of each received packet, phase-synchronous across all antennas. In espargos-0007 the csi field is complex64 with shape (4, 2, 4, 53), matching the paper''s B x 2 x 4 x Nsub, with 53 OFDM subcarriers. The carrier is 2.472 GHz, the signal bandwidth 16.562 MHz, and the standard 802.11n. The page states that guard subcarriers make the occupied bandwidth lower than the nominal 20 or 40 MHz, and that missing center subcarriers were linearly interpolated.', zh: '每个接收数据包的 HT-LTF 估计得到的 WiFi CSI，所有天线之间相位同步。espargos-0007 中 csi 字段为 complex64，形状为 (4, 2, 4, 53)，对应论文中的 B×2×4×Nsub，共 53 个 OFDM 子载波。载频 2.472 GHz，信号带宽 16.562 MHz，标准为 802.11n。页面说明保护子载波使占用带宽低于标称的 20 或 40 MHz，缺失的中心子载波采用线性插值。'}
- signal: rssi
  text: {en: 'RSSI values in dB, stored as float32 with shape (4, 2, 4) in espargos-0007, one value per antenna per board. The paper defines the RSSI array P with shape B x 2 x 4.', zh: '以 dB 为单位的 RSSI 值，espargos-0007 中以 float32 存储，形状为 (4, 2, 4)，即每块板卡的每根天线一个值。论文中 RSSI 数组 P 的形状为 B×2×4。'}
pipeline:
  summary: {en: 'A WiFi transmitter sends short packets, ESPARGOS arrays record phase-synchronous CSI, and a total station or tachymeter supplies the position ground truth.', zh: WiFi 发射机发送短数据包，ESPARGOS 阵列记录相位同步的 CSI，全站仪或测距仪提供位置真值。}
  stages:
  - title: {en: Array hardware and CSI extraction, zh: 阵列硬件与 CSI 提取}
    detail: {en: 'Each ESP32-S2 board extracts CSI from received 802.11 packets, and a central controller collects it over a bus and forwards it over Ethernet. The pyespargos Python library handles board configuration and real-time CSI streaming.', zh: 每块 ESP32-S2 板卡从接收到的 802.11 数据包中提取 CSI，中央控制器通过总线收集数据并经以太网转发。pyespargos Python 库负责板卡配置和实时 CSI 流传输。}
    inputs:
    - {en: WiFi packets from the transmitter, zh: 来自发射机的 WiFi 数据包}
    outputs:
    - {en: CSI per receive antenna, zh: 每根接收天线的 CSI}
  - title: {en: Phase synchronization, zh: 相位同步}
    detail: {en: 'All microcontrollers share one crystal oscillator. A 40 MHz clock and a phase reference near 2.4 to 2.5 GHz are combined on one coaxial cable, amplified by a PA and split by a cascade of power splitters to all boards. Constant phase offsets from unequal cable lengths or splitter imbalance are corrected in software.', zh: 所有微控制器共用一个晶振。40 MHz 时钟与约 2.4 至 2.5 GHz 的相位参考合并在同一根同轴电缆上，经功率放大器放大，再由级联功分器分配到所有板卡。因电缆长度不等或功分器不平衡产生的恒定相位偏移由软件校正。}
    inputs:
    - {en: 40 MHz clock, zh: 40 MHz 时钟}
    - {en: phase reference, zh: 相位参考信号}
    outputs:
    - {en: phase-synchronous CSI, zh: 相位同步的 CSI}
  - title: {en: Packet transmission and datapoint formation, zh: 数据包发射与数据点形成}
    detail: {en: 'A dedicated transmitter sends very short WiFi packets continuously, so the CSI stays current. ESPARGOS otherwise runs as a passive sniffer and never transmits. A packet received by all receivers forms one datapoint.', zh: 专用发射机连续发送极短的 WiFi 数据包，使 CSI 保持最新。ESPARGOS 平时作为被动监听设备运行，自身不发射。被所有接收端接收的数据包构成一个数据点。}
    inputs:
    - {en: transmitter packets, zh: 发射机发出的数据包}
    outputs:
    - {en: datapoint, zh: 数据点}
  - title: {en: Ground truth and recording, zh: 真值采集与记录}
    detail: {en: 'In the paper''s campaign the transmitter sits on a robot that follows custom trajectories. A Leica MS60 total station tracks a prism on the transmit antenna with millimeter-level accuracy, and timestamps are aligned to the reference system. Each datapoint stores H, P, x and t, and array positions and point-cloud coordinates are given in meters.', zh: 论文的测量中，发射机安装在按自定义轨迹运动的机器人上。Leica MS60 全站仪跟踪发射天线上的棱镜，精度达毫米级，时间戳与参考系统对齐。每个数据点存储 H、P、x 和 t，阵列位置与点云坐标以米为单位。}
    inputs:
    - {en: robot trajectory, zh: 机器人轨迹}
    - {en: total station tracking, zh: 全站仪跟踪数据}
    outputs:
    - {en: 'CSI, RSSI, position and timestamp records', zh: CSI、RSSI、位置与时间戳记录}
    - {en: DaRUS datasets with DOIs, zh: 带 DOI 的 DaRUS 数据集}
