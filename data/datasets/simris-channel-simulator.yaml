summary: {en: 'MATLAB generator of RIS channel matrices using Monte Carlo simulation. Scenarios are indoor hotspot and urban microcellular at 28 and 73 GHz, with ULA and UPA terminal arrays.', zh: 基于 MATLAB 的 RIS 信道矩阵生成器，采用 Monte Carlo 仿真生成。场景为室内热点和城市微蜂窝，频率为 28 GHz 和 73 GHz，终端阵列为 ULA 和 UPA。}
sources: ['https://github.com/ifyildirim/SimRIS-Channel-Simulator', 'https://arxiv.org/abs/2006.00468', 'https://api.github.com/repos/ifyildirim/SimRIS-Channel-Simulator/license', 'https://raw.githubusercontent.com/ifyildirim/SimRIS-Channel-Simulator/master/README.md', 'https://raw.githubusercontent.com/ifyildirim/SimRIS-Channel-Simulator/master/LICENSE', 'https://raw.githubusercontent.com/ifyildirim/SimRIS-Channel-Simulator/main/SimRIS_GUI.m', 'https://raw.githubusercontent.com/ifyildirim/SimRIS-Channel-Simulator/main/SimRIS_v18.m', 'https://github.com/ifyildirim/SimRIS-Channel-Simulator/tree/main', 'https://arxiv.org/pdf/2006.00468', 'https://raw.githubusercontent.com/ifyildirim/SimRIS-Channel-Simulator/main/README.md', 'https://github.com/ifyildirim/SimRIS-Channel-Simulator/releases', 'https://github.com/ifyildirim/SimRIS-Channel-Simulator/releases/tag/v2.0.0', 'https://github.com/ifyildirim/SimRIS-Channel-Simulator/releases/tag/v2.0.1', 'https://github.com/ifyildirim/SimRIS-Channel-Simulator/tags',
