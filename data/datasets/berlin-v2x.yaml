summary: {en: 'Drive-test measurements from up to four cars in Berlin covering LTE cellular and sidelink links, with signal strength and quality, cellular resource and QoS metrics, GPS positions, and traffic and weather side information. The data is provided as two Parquet tables.', zh: 柏林市区的路测数据，涵盖 LTE 蜂窝链路和 sidelink 链路，最多使用4辆汽车采集。数据包括信号强度与质量、蜂窝资源与 QoS 指标、GPS 位置以及交通和天气辅助信息，以两个 Parquet 表格提供。}
