limitations:
  - en: "The three archives total 27.8 GB, and project_files.zip alone is 20.0 GB."
    zh: "三个压缩包合计 27.8 GB，其中 project_files.zip 即达 20.0 GB。"
  - en: "The paper's scope is single-room scenarios at 5.92 GHz."
    zh: "论文的研究范围为单房间场景，载频 5.92 GHz。"
  - en: "The paper states that propagation path data are published, but the Zenodo file descriptions do not list path data."
    zh: "论文称发布了传播路径数据，但 Zenodo 的文件说明中未列出路径数据。"
  - en: "The real-world measurements used for validation in the paper are not among the three archives."
    zh: "论文用于验证的实测数据不在三个压缩包之中。"
