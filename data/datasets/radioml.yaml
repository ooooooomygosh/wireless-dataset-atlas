id: radioml
name: RadioML
aliases: [RML2016.10A, RML2018.01A]
year: 2016
organization: DeepSig
origin: simulation
tasks: [modulation-classification]
signals: [iq]
format: HDF5 (RML2018.01A), pickle (RML2016.10A)
samples: 2 million examples of 1024 samples each (RML2018.01A)
license: CC BY-NC-SA 4.0
access: {url: 'https://www.deepsig.ai/datasets/', type: open}
code: ['https://github.com/radioML/dataset']
paper: arxiv:1712.04578
used_in: ['doi:10.1109/tvt.2020.3005707', 'doi:10.1109/lcomm.2022.3213523', 'doi:10.1109/tvt.2020.3042638', 'doi:10.1109/twc.2023.3254490', 'doi:10.1109/tccn.2022.3179450']
citing: ['doi:10.1109/tccn.2020.3024610', 'doi:10.1109/lcomm.2020.2968030', 'doi:10.1109/lwc.2018.2867459']
summary: {en: 'Synthetic complex I/Q frames. RML2016.10A, generated with GNU Radio, has 11 modulations (8 digital, 3 analog) at varying SNR; RML2018.01A has 24 digital and analog modulation types with simulated channel effects, 2 million examples of 1024 samples each.', zh: 合成的复数 I/Q 帧数据。RML2016.10A 由 GNU Radio 生成，包含 11 种调制方式（8 种数字、3 种模拟），信噪比可变；RML2018.01A 包含 24 种数字和模拟调制方式并模拟了信道效应，共 200 万个样本，每个样本长 1024 点。}
sources: ['https://www.deepsig.ai/datasets/', 'https://arxiv.org/abs/1712.04578', 'https://arxiv.org/pdf/1712.04578', 'https://github.com/radioML/dataset', 'https://api.github.com/repos/radioML/dataset/git/trees/HEAD?recursive=1', 'https://raw.githubusercontent.com/radioML/dataset/master/generate_RML2016.10a.py', 'https://raw.githubusercontent.com/radioML/dataset/master/transmitters.py', 'https://raw.githubusercontent.com/radioML/dataset/master/source_alphabet.py', 'https://raw.githubusercontent.com/radioML/dataset/master/build_dataset', 'https://raw.githubusercontent.com/radioML/dataset/master/.gitmodules', 'https://github.com/radioML/dataset/releases', 'https://github.com/radioML/dataset/tags', 'https://github.com/radioML/dataset/commits/master', 'https://raw.githubusercontent.com/radioML/dataset/master/generate_RML2016.04c.py']
checked: '2026-11-06'
pipeline:
  summary: {en: 'The 2016.10A generator builds 11 modulated waveforms, passes them through a GNU Radio dynamic channel model at SNR labels from -20 to 18 dB, and cuts 128-sample I/Q segments that are keyed by modulation and SNR. The generator produces neither CSI nor mobility trajectories.', zh: 2016.10A 生成器构造 11 种调制波形，经 GNU Radio 动态信道模型处理，SNR 标签从 -20 至 18 dB，然后截取长度 128 的 I/Q 片段，并以调制方式与 SNR 为键保存。生成器既不产生 CSI，也不产生移动轨迹。}
  scope: {en: The workflow matches the public RadioML 2016.10a generator in the code repository. The 2018.01A release is recorded only from its official description; the 2016 generator is not applied to it., zh: 详细流程对应代码仓库中公开的 RadioML 2016.10a 生成脚本。2018.01A 仅依据官方说明记录，不套用 2016 生成器。}
  stages:
  - title: {en: Generate modulated baseband streams, zh: 生成调制基带流}
    detail: {en: 'transmitters.py defines 8 discrete modulators (BPSK, QPSK, 8PSK, PAM4, QAM16, QAM64, GFSK, CPFSK) and 3 continuous ones (WBFM, AM-DSB, AM-SSB). The linear digital modulators from BPSK to QAM64 use root-raised-cosine pulse shaping with excess bandwidth 0.35.', zh: transmitters.py 定义了 8 种离散调制器（BPSK、QPSK、8PSK、PAM4、QAM16、QAM64、GFSK、CPFSK）和 3 种连续调制器（WBFM、AM-DSB、AM-SSB）。BPSK 至 QAM64 的线性数字调制器使用滚降系数 0.35 的根升余弦脉冲成形。}
    inputs:
    - {en: 'Bit stream from source_material/gutenberg_shakespeare.txt, XOR-whitened with a random 256-bit pattern', zh: 取自 source_material/gutenberg_shakespeare.txt 的比特流，并与随机 256 位序列异或加扰}
    - {en: Audio from source_material/serial-s01-e01.mp3 for the analog modulations, zh: 模拟调制使用 source_material/serial-s01-e01.mp3 中的音频}
    outputs:
    - {en: Modulated complex baseband waveforms, zh: 调制后的复数基带波形}
    controls:
    - {en: 'Source length is 10,000 symbols by default, 20,000 for QAM16 and 30,000 for QAM64.', zh: '默认源长度为 10,000 个符号，QAM16 为 20,000，QAM64 为 30,000。'}
    checks:
    - {en: The repository build script runs the generator in the radioml/minsdr Docker image., zh: 仓库的构建脚本在 radioml/minsdr Docker 镜像中运行该生成器。}
  - title: {en: Apply the dynamic channel, zh: 施加动态信道}
    detail: {en: 'The script loops over SNR labels from -20 to 18 dB in 2 dB steps. For each label, the stream passes through GNU Radio''s dynamic_channel_model, which adds multipath fading and other impairments, and noise with amplitude 10^(-SNR/10) is added.', zh: 脚本遍历 -20 至 18 dB、步长 2 dB 的 SNR 标签。每个标签下，信号经过 GNU Radio 的 dynamic_channel_model，加入多径衰落等扰动，并加入幅度为 10^(-SNR/10) 的噪声。}
    inputs:
    - {en: Complex baseband stream and SNR labels, zh: 复数基带流与 SNR 标签}
    outputs:
    - {en: Impaired complex stream for each modulation and SNR label, zh: 每个调制与 SNR 标签对应的受扰复数流}
    controls:
    - {en: 'Channel arguments are fixed in the script: first argument 200e3, fD = 1, delays [0, 0.9, 1.7], magnitudes [1, 0.8, 0.3], 8 taps and seed 0x1337.', zh: '脚本固定信道参数：第一个参数为 200e3，fD = 1，时延 [0, 0.9, 1.7]，幅度 [1, 0.8, 0.3]，8 个抽头，种子 0x1337。'}
    checks:
    - {en: The label sets the noise amplitude only; the script does not measure the SNR of each generated segment., zh: 标签仅决定噪声幅度；脚本不测量每个生成片段的实际 SNR。}
  - title: {en: Sample 128-point segments, zh: 截取 128 点片段}
    detail: {en: 'Sampling starts at a random offset between 50 and 500 samples, which skips channel transients. Complex segments of 128 samples are taken, and each next start is drawn at random between 128 samples and 5% of the stream length. Sampling for a modulation and SNR pair stops after 1,000 segments; a new stream is generated when the current one is exhausted.', zh: '取样从 50 至 500 个采样点之间的随机偏移开始，以跳过信道瞬态。取长度为 128 的复数片段，下一起点在 128 个采样点与流长 5% 之间随机选取。每个调制与 SNR 组合取满 1,000 个片段后停止；当前流用尽时生成新的流。'}
    inputs:
    - {en: Long complex stream, zh: 长复数流}
    outputs:
    - {en: '1,000 complex 128-sample segments per modulation and SNR pair', zh: '每个调制与 SNR 组合 1,000 个复数 128 点片段'}
    checks:
    - {en: 'Segments taken from the same stream share one channel process, so they are not independent samples.', zh: 取自同一流的片段共享同一信道过程，因此并非彼此独立的样本。}
  - title: {en: Normalize and form I/Q arrays, zh: 归一化并形成 I/Q 数组}
    detail: {en: 'Each segment is divided by the sum of its magnitudes, sum(abs(x)), not by its energy. The real and imaginary parts are stored as separate float32 channels, giving arrays of shape [1000, 2, 128] per key.', zh: '每个片段除以其幅度之和 sum(abs(x))，而非能量。实部与虚部分别保存为 float32 通道，每个键对应形状为 [1000, 2, 128] 的数组。'}
    inputs:
    - {en: 128-point complex segments, zh: 128 点复数片段}
    outputs:
    - {en: Two-channel float32 I/Q arrays, zh: 双通道 float32 I/Q 数组}
    checks:
    - {en: 'After this division the magnitudes sum to 1, so the segments are not normalized to unit energy.', zh: 除法之后幅度和为 1，因此片段并未归一化为单位能量。}
  - title: {en: Serialize the labelled dictionary, zh: 序列化带标签的字典}
    detail: {en: 'The script stores a dictionary keyed by (modulation name, nominal SNR) with cPickle, written by Python 2 code, and saves it as RML2016.10a_dict.dat.', zh: '脚本以 (调制名称, 名义 SNR) 为键构建字典，使用 Python 2 的 cPickle 写入 RML2016.10a_dict.dat。'}
    inputs:
    - {en: I/Q arrays and modulation and SNR labels, zh: I/Q 数组及调制与 SNR 标签}
    outputs:
    - {en: RML2016.10a_dict.dat pickle file, zh: RML2016.10a_dict.dat pickle 文件}
  - title: {en: Leave learning splits to the user, zh: 学习划分由使用者确定}
    detail: {en: 'The generator writes no train, validation or test split; classification experiments define their own splits and label mappings. RML2018.01A is a separate HDF5 release, described by DeepSig as 24 modulations and 2 million 1024-sample examples, and this script does not reproduce it.', zh: 生成器不输出训练、验证或测试划分；分类实验需自行定义划分与标签映射。RML2018.01A 是独立的 HDF5 发布，DeepSig 描述其为 24 种调制与 200 万个 1024 点样本，本脚本不能复现该数据集。}
    inputs:
    - {en: 2016.10a dictionary, zh: 2016.10a 字典}
    outputs:
    - {en: Task-specific splits declared by the experiment, zh: 由实验声明的任务划分}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: Complex baseband I/Q segments of 128 samples (2016.10A) or 1024 samples (2018.01A); modulation labels and nominal SNR keys (2016.10A); a pickle file (2016.10A) and an HDF5 file (2018.01A)., zh: 128 点（2016.10A）或 1024 点（2018.01A）复数基带 I/Q 片段；调制标签与名义 SNR 键（2016.10A）；pickle 文件（2016.10A）与 HDF5 文件（2018.01A）。}
- label: {en: Size of RML2016.10A, zh: RML2016.10A 规模}
  text: {en: 'The generator loops over 11 modulations, 20 SNR labels and 1,000 segments per pair, giving 220,000 segments.', zh: '生成器对 11 种调制、20 个 SNR 标签各取 1,000 个片段，共 220,000 个片段。'}
- label: {en: Derived outputs, zh: 派生输出}
  text: {en: User-defined classification splits., zh: 由使用者定义的分类划分。}
- label: {en: Reproduction notes, zh: 复现说明}
  text: {en: The repository has no LICENSE file and no README.md; the dataset license is CC BY-NC-SA 4.0 from DeepSig. The source material is a git submodule at an SSH address and is not in the main file tree. The generator uses Python 2 print statements and cPickle., zh: 仓库没有 LICENSE 文件，也没有 README.md；数据集许可为 DeepSig 的 CC BY-NC-SA 4.0。源素材是 SSH 地址的 git 子模块，不在主文件树中。生成器使用 Python 2 的 print 语句与 cPickle。}
provenance:
- {en: '2016.10a: modulators generate complex baseband streams across modulation classes and nominal SNRs.', zh: 2016.10a：调制器生成复基带流，遍历调制类别与名义 SNR}
- {en: GNU Radio dynamic channels add multipath and other impairments., zh: GNU Radio 动态信道加入多径与其他扰动}
- {en: 'Randomly extract 128-point segments, divide by sum(abs(x)), then separate into float32 I/Q.', zh: 随机截取 128 点片段，除以 sum(abs(x)) 后拆成 float32 I/Q}
- {en: 'Write pickle data keyed by (modulation,SNR); users specify learning splits.', zh: '以 (modulation,SNR) 为键写入 pickle；学习划分由使用者声明'}
- {en: Versions such as 2018.01A are separate releases; 2016.10a scripts and dimensions do not apply to them., zh: 2018.01A 等版本是独立发布，不能套用 2016.10a 的脚本和维度}
technical_notes:
- {en: 'The 2016.04C release includes local-oscillator drift, light fading and several SNR increments; 2016.10A is its cleaned and normalized version.', zh: 2016.04C 包含本振漂移、轻度衰落和多个 SNR 间隔；2016.10A 是其清理并归一化后的版本。}
- {en: DeepSig states that the data have known errata and are not used in its current products., zh: DeepSig 说明这些数据存在已知勘误，且不用于其当前产品。}
- {en: 'In the RML2018.01A paper (arXiv 1712.04578), each synthetic example draws its channel parameters independently, and the low-SNR examples range from -20 dB to +30 dB Es/N0.', zh: 在 RML2018.01A 对应论文（arXiv 1712.04578）中，每个合成样本独立抽取信道参数，低 SNR 样本的范围为 -20 dB 至 +30 dB Es/N0。}
limitations:
- {en: 'The two channels are the real and imaginary parts of one complex baseband signal, not complex CSI from two receive antennas.', zh: 两个通道是同一复数基带信号的实部与虚部，而非两根接收天线的复数 CSI。}
- {en: 'Segments from the same generated stream share one channel process, so the segment index does not identify independent waveforms.', zh: 取自同一生成流的片段共享同一信道过程，因此片段编号并不对应彼此独立的波形。}
- {en: The SNR label sets the noise amplitude to 10^(-SNR/10); the script does not measure the resulting SNR of each segment., zh: SNR 标签决定噪声幅度 10^(-SNR/10)；脚本不测量每个片段产生的实际 SNR。}
history:
- {en: '2016: RML2016.10A, the cleaned and normalized version, supersedes RML2016.04C (DeepSig labels both as 2016).', zh: 2016 年：清理并归一化的 RML2016.10A 取代了 RML2016.04C（DeepSig 将二者标为 2016 年）。}
- {en: '2017: RML2018.01A is labelled as 2017 by DeepSig; its paper, arXiv 1712.04578, is dated December 2017.', zh: 2017 年：DeepSig 将 RML2018.01A 标为 2017 年数据；对应论文 arXiv 1712.04578 的日期为 2017 年 12 月。}
- {en: 'DeepSig''s dataset page marks these releases as historical, notes that the generation modules are not maintained, and states that DeepSig cannot provide support or revisions for them.', zh: DeepSig 数据页面将这些发布标为历史数据，注明生成模块不再维护，并说明 DeepSig 无法为其提供支持或修订。}
usage:
- {en: 'Select one version first. RML2016.10A (pickle, 128-sample segments, 11 classes) and RML2018.01A (HDF5, 1024-sample examples, 24 classes) differ in format, length and class set.', zh: 应先选定一个版本。RML2016.10A（pickle，128 点片段，11 类）与 RML2018.01A（HDF5，1024 点样本，24 类）在格式、长度和类别集合上均不同。}
field_notes:
- label: {en: Time, zh: 时间}
  text: {en: 'The index within each 128-sample segment is time inside one generated waveform, not a user trajectory or a future channel sequence.', zh: 每个 128 点片段内的索引是某个生成波形内部的时间，不是用户轨迹，也不是未来的信道序列。}
overview: {en: 'RadioML is a family of synthetic radio-signal datasets from DeepSig, Inc. for modulation recognition. RML2016.10A, generated with GNU Radio and stored as a Python pickle, contains 11 modulation types (8 digital and 3 analog) across a range of SNR labels. RML2018.01A, stored as HDF5, contains 24 digital and analog modulation types with simulated channel effects, in 2 million examples of 1024 samples each. DeepSig dates the 2016 releases to 2016 and RML2018.01A to 2017, describes them as early academic datasets with known errata, and states that they are not used in current DeepSig products and are not supported. Each example is complex baseband I/Q data labelled by modulation class, and the 2016.10A file is keyed by modulation and nominal SNR; it contains no CSI, antenna-array channels or positions. The 2016.10A segments are 128 samples long, and each is a sampling sequence inside one generated waveform rather than a user trajectory. The datasets are released under CC BY-NC-SA
    4.0.', zh: 'RadioML 是 DeepSig, Inc. 发布的一组合成无线信号数据集，面向调制识别任务。RML2016.10A 由 GNU Radio 生成，以 Python pickle 文件保存，包含 11 种调制方式（8 种数字、3 种模拟），覆盖多个 SNR 标签。RML2018.01A 以 HDF5 格式保存，包含 24 种数字和模拟调制方式以及模拟的信道效应，共 200 万个样本，每个样本长 1024 点。DeepSig 将 2016 年的发布标为 2016 年数据，将 RML2018.01A 标为 2017 年数据，并说明这些是存在已知勘误的早期学术数据集，不用于 DeepSig 当前产品，也不再提供支持。数据为复基带 I/Q，按调制类别标注；2016.10A 文件以调制方式和名义 SNR 为键，不包含 CSI、天线阵列信道或位置信息。2016.10A 的片段长 128 点，每个片段是某个生成波形内部的采样序列，而非用户轨迹。数据集采用 CC BY-NC-SA 4.0 许可。'}
signal_details:
- signal: iq
  text: {en: 'Complex baseband I/Q samples. RML2016.10A is a Python pickle file that holds one float32 array of shape [1000, 2, 128] per modulation and SNR label. RML2018.01A stores complex floating-point values in HDF5, with 2 million examples of 1024 samples each.', zh: '复数基带 I/Q 采样。RML2016.10A 为 Python pickle 文件，每个调制与 SNR 标签保存一个形状为 [1000, 2, 128] 的 float32 数组。RML2018.01A 以 HDF5 保存复数浮点值，共 200 万个样本，每个样本 1024 个采样点。'}
capabilities:
- key: csi
  status: none
  note: {en: Single-antenna I/Q examples; no channel matrix is released., zh: 单天线 I/Q 样本，不提供信道矩阵。}
- key: cir
  status: none
  note: {en: 'Channel taps are drawn independently per example, and only the I/Q frames are released.', zh: 信道抽头对每个样本独立随机生成，发布内容仅为 I/Q 帧。}
- key: paths
  status: none
  note: {en: 'The channel is a random Rayleigh tapped-delay model with no per-path delay, angle or power.', zh: 信道为随机 Rayleigh 抽头延迟模型，没有逐路径的时延、角度或功率。}
- key: interaction
  status: none
  note: {en: 'No scene geometry is modelled, so no per-path interaction exists.', zh: 未建模场景几何，因此不存在逐路径交互信息。}
- key: power
  status: none
  note: {en: 'Frames are energy-normalized, so absolute received power is not kept; SNR labels are generator settings.', zh: 样本经过能量归一化，绝对接收功率未保留；SNR 标签为生成器设置。}
- key: iq
  status: provided
  note: {en: 'Complex baseband I/Q: 128-sample vectors in RML2016.10A (per the generator script) and 1024-sample frames in RML2018.01A.', zh: 复数基带 I/Q：RML2016.10A 为 128 点向量（依据生成脚本），RML2018.01A 为 1024 点帧。}
- key: beam_labels
  status: none
  note: {en: Single link with no beams or codebooks., zh: 单链路，无波束与码本。}
- key: position
  status: none
  note: {en: No user or device position is released., zh: 不提供用户或设备位置。}
- key: geometry
  status: none
  note: {en: No 3D scene or map files are released., zh: 不提供三维场景或地图文件。}
- key: materials
  status: none
  note: {en: No material parameters are released., zh: 不提供材料参数。}
- key: rgb
  status: none
  note: {en: Only I/Q frames are released; no images., zh: 仅发布 I/Q 帧，无图像。}
- key: depth
  status: none
  note: {en: No depth sensing data are released., zh: 不提供深度感知数据。}
- key: lidar
  status: none
  note: {en: No LiDAR data are released., zh: 不提供 LiDAR 数据。}
- key: radar
  status: none
  note: {en: No radar data are released., zh: 不提供雷达数据。}
- key: imu
  status: none
  note: {en: No inertial sensor data are released., zh: 不提供惯性传感器数据。}
- key: time_series
  status: provided
  note: {en: Each example is one I/Q waveform segment; examples are independent random draws with no ordering between them., zh: 每个样本是一段 I/Q 波形；样本为相互独立的随机抽取，样本之间无先后顺序关系。}
- key: multiuser
  status: none
  note: {en: One transmitter per example., zh: 每个样本仅含一个发射机。}
- key: multibs
  status: none
  note: {en: One link per example; no multiple base stations., zh: 每个样本仅含一条链路，无多基站。}
- key: crossfreq
  status: none
  note: {en: Single-band waveforms; no paired multi-band data., zh: 单频段波形，无成对的多频段数据。}
- key: near_field
  status: none
  note: {en: Single-antenna link; no array or near-field modelling., zh: 单天线链路，无阵列或近场建模。}
- key: high_mobility
  status: none
  note: {en: No user speed is modelled; Doppler appears only as a random CFO term., zh: 未建模用户速度；多普勒仅以随机 CFO 项出现。}
- key: dynamic_blockage
  status: none
  note: {en: The fading model has no moving blockers., zh: 衰落模型中没有移动遮挡物。}
- key: reflection
  status: none
  note: {en: Multipath is a statistical tapped-delay model; reflections are not labelled per path or simulated geometrically., zh: 多径为统计型抽头延迟模型；反射不做逐路径标注，也不做几何仿真。}
- key: diffraction
  status: none
  note: {en: No diffraction modelling; the channel is statistical., zh: 无绕射建模，信道为统计模型。}
- key: scattering
  status: none
  note: {en: Diffuse fading is statistical only; no scattering labels., zh: 扩散衰落仅为统计描述，无散射标注。}
- key: transmission
  status: none
  note: {en: No penetration or refraction modelling., zh: 无穿透或折射建模。}
- key: polarization
  status: none
  note: {en: Only complex baseband I/Q is released; no polarimetric data., zh: 仅发布复数基带 I/Q，无极化数据。}
- key: em_field
  status: none
  note: {en: 'Only I/Q samples are released, with no field-level quantities.', zh: 仅发布 I/Q 采样，无场量数据。}
versions:
- version: RML2018.01A
  date: '2017'
  summary: {en: '24 digital and analog modulation types, 2 million examples of 1024 complex I/Q samples each in HDF5, with simulated Rayleigh multipath, LO and clock offsets, and AWGN.', zh: 24 种数字与模拟调制类型，共 200 万个样本，每个样本为 1024 个复数 I/Q 采样点，HDF5 格式；信道效应为仿真生成，包括 Rayleigh 多径、本振与时钟偏移以及 AWGN。}
  url: https://www.deepsig.ai/datasets/
- version: RML2016.10A
  date: '2016'
  summary: {en: '11 modulations (8 digital, 3 analog) generated with GNU Radio at varying SNR, distributed as a Python pickle. First released at the 6th Annual GNU Radio Conference; a cleaner, normalized version that supersedes RML2016.04C.', zh: 由 GNU Radio 生成的 11 种调制（8 种数字、3 种模拟），信噪比可变，以 Python pickle 格式发布。该数据集于第 6 届 GNU Radio 年会首次发布，是 RML2016.04C 更干净、归一化的版本并取代了后者。}
  url: https://www.deepsig.ai/datasets/
- version: RML2016.04C
  date: '2016'
  summary: {en: 'Variable-SNR set of 11 modulations generated with GNU Radio, with moderate LO drift, light fading and several labelled SNR increments. Used in arXiv:1602.04105 and arXiv:1604.07078; superseded by RML2016.10A.', zh: '由 GNU Radio 生成的 11 种调制的可变信噪比数据集，包含中等程度的本振漂移、轻度衰落以及多个带标签的信噪比档位。用于 arXiv:1602.04105 和 arXiv:1604.07078 两篇论文，已被 RML2016.10A 取代。'}
  url: https://www.deepsig.ai/datasets/
