summary: {en: 'Synthetic complex I/Q frames. RML2016.10A, generated with GNU Radio, has 11 modulations (8 digital, 3 analog) at varying SNR; RML2018.01A has 24 digital and analog modulation types with simulated channel effects, 2 million examples of 1024 samples each.', zh: 合成的复数 I/Q 帧数据。RML2016.10A 由 GNU Radio 生成，包含 11 种调制方式（8 种数字、3 种模拟），信噪比可变；RML2018.01A 包含 24 种数字和模拟调制方式并模拟了信道效应，共 200 万个样本，每个样本长 1024 点。}
