summary: {en: 'Ray-traced channels from 15 DeepMIMO scenarios, with over 1 million channels in total, generated at 3.5 GHz with 32 BS antennas, one UE antenna, 32 subcarriers and 20 paths. Pre-training uses 80% of the channels for training and 20% for validation.', zh: 来自 15 个 DeepMIMO 场景的光线追踪信道，共超过 100 万条信道，在 3.5 GHz 下生成，基站 32 天线、用户 1 天线、32 子载波、20 条路径。预训练时 80% 用于训练，20% 用于验证。}
sources: ['https://huggingface.co/datasets/wi-lab/lwm', 'https://huggingface.co/wi-lab/lwm', 'https://huggingface.co/wi-lab/lwm-competition-2025', 'https://arxiv.org/abs/2411.08872', 'https://arxiv.org/html/2411.08872v2', 'https://huggingface.co/api/datasets/wi-lab/lwm', 'https://huggingface.co/api/datasets/wi-lab/lwm/tree/main?recursive=true', 'https://huggingface.co/datasets/wi-lab/lwm/resolve/main/README.md', 'https://huggingface.co/api/models/wi-lab/lwm/tree/main?recursive=true', 'https://huggingface.co/api/models/wi-lab/lwm-competition-2025/tree/main?recursive=true', 'https://huggingface.co/wi-lab/lwm-competition-2025/resolve/main/README.md', 'https://huggingface.co/wi-lab/lwm-competition-2025/resolve/main/train_lwm.py', 'https://huggingface.co/wi-lab/lwm-competition-2025/resolve/main/utils.py', 'https://huggingface.co/wi-lab/lwm-competition-2025/resolve/main/train_heads.py', 'https://huggingface.co/wi-lab/lwm-competition-2025/resolve/main/train_heads_config.py', 'https://huggingface.co/wi-lab/lwm-competition-2025/resolve/main/task_1/config.json',
  'https://huggingface.co/wi-lab/lwm-competition-2025/resolve/main/task_2/config.json', 'https://huggingface.co/wi-lab/lwm-competition-2025/resolve/main/task_3/config.json', 'https://huggingface.co/wi-lab/lwm-competition-2025/resolve/main/task_4/config.json', 'https://huggingface.co/wi-lab/lwm-competition-2025/resolve/main/task_5/config.json', 'https://arxiv.org/abs/2411.08872v1', 'https://huggingface.co/api/datasets/wi-lab/lwm/commits/main', 'https://huggingface.co/wi-lab/lwm/resolve/main/README.md', 'https://huggingface.co/api/models/wi-lab/lwm-competition-2025', 'https://huggingface.co/api/models/wi-lab/lwm-competition-2025/commits/main']
checked: '2026-11-06'
pipeline:
  summary: {en: 'DeepMIMO ray-tracing outputs are converted into complex CSI with array and OFDM settings, filtered and scaled, then cut into 4×4 patches with masking. Task labels are generated from the same channels. The paper''s protocol and the Challenge code differ in patch layout, scaling and masking.', zh: DeepMIMO光线追踪输出按阵列与OFDM设置转换为复CSI，经过滤和缩放后切分为4×4块并进行遮挡。任务标签由同一批信道生成。论文协议与Challenge代码在块划分、缩放和遮挡设置上不同。}
  scope: {en: 'Describes the LWM paper''s pre-training protocol and the Challenge train_lwm.py code path separately; their patch, scaling, and masking settings differ.', zh: 分别描述LWM论文的预训练协议与Challenge train_lwm.py代码路径；二者的块划分、缩放和遮挡设置不同。}
  stages:
  - title: {en: Select DeepMIMO scenarios and links, zh: 选择DeepMIMO场景与链路}
    detail: {en: 'dataset_generator loads one DeepMIMO scenario by name, base station index and receiver grid, and rows can restrict the receiver positions. train_lwm.py loops over 20 city scenarios with base stations 1 to 3, plus three campus, O1 and Boston scenarios each split into 20 zones. The paper''s pre-training collection has 15 scenarios.', zh: dataset_generator按场景名、基站索引和接收网格加载单个DeepMIMO场景，rows可限定接收位置。train_lwm.py遍历20个城市场景（基站1至3），并将asu_campus、o1和boston5G三个场景各切分为20个区域。论文的预训练集合包含15个场景。}
    inputs:
    - {en: DeepMIMO scenario ray-tracing outputs, zh: DeepMIMO场景光线追踪输出}
    - {en: Base station index and receiver grid rows, zh: 基站索引与接收网格行}
    outputs:
    - {en: 'Users with positions, LoS status and paths', zh: 带位置、LoS状态与路径的用户集合}
  - title: {en: Compute complex CSI, zh: 计算复CSI}
    detail: {en: 'get_parameters sets half-wavelength element spacing, 20 paths, a BS rotation of [0, 0, -135] degrees, and a bandwidth of 30 kHz times the number of subcarriers before DeepMIMO computes the channels. dataset_generator defaults to a 32×1 BS array, a single-antenna UE and 32 subcarriers, and outer calls can override the counts.', zh: 'get_parameters设置半波长阵元间距、20条路径、基站旋转[0, 0, -135]度，以及30 kHz乘子载波数的带宽，随后由DeepMIMO计算信道。dataset_generator默认采用32×1基站阵列、单天线用户与32个子载波，外层调用可覆盖这些数量。'}
    inputs:
    - {en: Path parameters and array configuration, zh: 路径参数与阵列配置}
    - {en: OFDM frequency grid, zh: OFDM频率网格}
    outputs:
    - {en: 'Complex channels ordered by UE, receive antenna, BS antenna and subcarrier', zh: 按UE、接收天线、基站天线与子载波排列的复信道}
  - title: {en: Filter users and scale channels, zh: 筛选用户并缩放信道}
    detail: {en: 'deepmimo_data_cleaning keeps users with los not equal to -1, stores the channel as complex64 and multiplies it by 10^6. Only when an SNR is given for ChannelEstimation or LosNlosClassification does generate_gaussian_noise add complex Gaussian noise scaled to that SNR; labels are built from the clean channel. The scaling is a constant factor, not per-sample normalization.', zh: deepmimo_data_cleaning保留los不等于-1的用户，以complex64保存信道并乘以10^6。仅当为ChannelEstimation或LosNlosClassification给定SNR时，generate_gaussian_noise才按该SNR加入复高斯噪声，标签仍由干净信道生成。缩放为常数倍，而非逐样本归一化。}
    inputs:
    - {en: Complex CSI and los field, zh: 复CSI与los字段}
    outputs:
    - {en: Scaled valid CSI, zh: 缩放后的有效CSI}
  - title: {en: Patch and mask tokens, zh: 切块并生成遮挡token}
    detail: {en: 'patch_maker splits each channel into non-overlapping 4×4 complex blocks, interleaves real and imaginary values into 32 numbers per token, and zero-pads dimensions that are not divisible. tokenizer_train prepends a CLS token and masks int(0.40 × patches) positions by default. A masked token becomes [MASK] with probability 0.8, a random vector with probability 0.1, and stays unchanged with probability 0.1.', zh: 'patch_maker将每个信道切分为互不重叠的4×4复数块，把实部与虚部交错排成每个token 32个数，不能整除时补零。tokenizer_train默认在最前加入CLS token，并遮挡int(0.40 × 块数)个位置。被遮挡的token以0.8概率替换为[MASK]，0.1概率替换为随机向量，0.1概率保持不变。'}
    inputs:
    - {en: Scaled CSI, zh: 缩放后的CSI}
    outputs:
    - {en: 'Token sequence, masked positions and clean-token targets', zh: token序列、遮挡位置与干净token目标}
  - title: {en: Generate task labels, zh: 生成任务标签}
    detail: {en: 'LoS classes come from the los field. ChannelCharting, the localization task in the Challenge, uses the first two columns of rx_pos. ChannelEstimation and ChannelInterpolation targets are the real and imaginary parts of the clean channel times 10^6. BeamPrediction takes the strongest of 64 steering beams over a 180-degree field of view, with coherent averaging across subcarriers.', zh: LoS类别取自los字段。Challenge中的定位任务ChannelCharting使用rx_pos的前两列。ChannelEstimation与ChannelInterpolation的目标为干净信道的实部与虚部乘以10^6。BeamPrediction在180度视场内取64个steering波束中响应最强者，对子载波做相干平均。}
    inputs:
    - {en: 'Valid CSI, los field and rx_pos', zh: 有效CSI、los字段与rx_pos}
    - {en: Steering codebook of 64 beams, zh: 64波束steering码本}
    outputs:
    - {en: 'LoS classes, 2D positions, beam indices and reconstruction targets', zh: LoS类别、二维位置、波束索引与重建目标}
  - title: {en: Split and package per task, zh: 划分并按任务封装}
    detail: {en: 'train_lwm.py splits each tokenized group 80/20 with random_split and seed 42, which leaves 0 to 2 samples in the test part. The Challenge packages task_1 to task_5 as train, val and test .pt files holding channels and labels, which train_heads.py reads. The released Challenge splits and the paper''s 80/20 pre-training split follow different protocols.', zh: train_lwm.py以random_split按80/20划分每个token分组，随机种子为42，测试部分仅余0至2个样本。Challenge将task_1至task_5封装为包含channels与labels的train、val、test .pt文件，由train_heads.py读取。Challenge发布的划分与论文的80/20预训练划分遵循不同协议。}
    outputs:
    - {en: Per-task .pt data files and pre-training entry points, zh: 分任务的.pt数据文件与预训练入口}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: '• Complex CSI from DeepMIMO scenarios (dataset_generator in utils.py)

      • task_1 to task_5 train, val and test .pt files with channels and labels

      • Pretrained checkpoints: model_checkpoint.pth in the Challenge repository and model_weights.pth in the wi-lab/lwm model repository', zh: '• 来自DeepMIMO场景的复CSI（utils.py中的dataset_generator）

      • task_1至task_5的train、val、test .pt文件，包含channels与labels

      • 预训练权重：Challenge仓库中的model_checkpoint.pth，以及wi-lab/lwm模型仓库中的model_weights.pth'}
- label: {en: Derived outputs, zh: 派生输出}
  text: {en: '• Masked tokens, masks and reconstruction targets (make_sample, tokenizer_train)

      • LoS, localization, beam and channel targets for each task', zh: '• 遮挡token、mask与重建目标（make_sample、tokenizer_train）

      • 各任务的LoS、定位、波束与信道目标'}
- label: {en: Operational settings, zh: 运行设置}
  text: {en: '• The model card lists 32 BS antennas, 1 UE antenna, 32 subcarriers, 20 paths and 3.5 GHz for generated data.

      • The competition README states that train_heads.py must not be modified for submission.', zh: '• 模型卡列出生成数据所用设置：32个基站天线、1个用户天线、32个子载波、20条路径、3.5 GHz。

      • 竞赛README规定提交时不得修改train_heads.py。'}
provenance:
- {en: DeepMIMO scenarios and RT paths generate complex CSI under specified array/OFDM configurations., zh: DeepMIMO 场景与 RT 路径，按指定阵列/OFDM 配置生成复 CSI}
- {en: Current Challenge code filters los=-1 and multiplies by 10^6; this is not per-sample unit-norm normalization., zh: Challenge 当前代码过滤 los=-1 并乘 10^6；不是逐样本单位范数归一化}
- {en: The original paper uses 16×1 tokens with separate real/imaginary components. The current Challenge uses 4×4 complex blocks and interleaved 32-dimensional real/imaginary tokens., zh: 原论文使用分实虚的 16×1 token；当前 Challenge 使用 4×4 复数块与交错实虚 32 维 token}
- {en: 'Generate MCM masks according to the version, or form downstream labels from LoS, positions, and a specified steering codebook.', zh: 按版本生成 MCM mask，或由 LoS、位置、指定 steering codebook 形成下游标签}
- {en: Record the original paper's pretraining collection separately from the Challenge's per-task train/val/test assets., zh: 原论文预训练集合与 Challenge 分任务 train/val/test 资产分别记录}
technical_notes:
- {en: The paper's pre-training collection is drawn from 15 DeepMIMO ray-tracing scenarios and is not a measurement corpus., zh: 论文的预训练集合取自15个DeepMIMO光线追踪场景，不是测量语料。}
- {en: 'The paper uses fixed 32×32 channel inputs, whereas train_lwm.py generates per-scenario antenna and subcarrier counts.', zh: 论文采用固定的32×32信道输入，而train_lwm.py按场景生成不同的天线数与子载波数。}
- {en: 'Paper settings (embedding size 64, 16×1 real and imaginary tokens, 15% masking, learning rate 1e-4, batch size 64) differ from train_lwm.py (embedding size 128, 4×4 complex patches, masking 0.40, base learning rate 5e-4, batch size 128, 50 epochs).', zh: 论文设置（嵌入维度64、16×1分实虚token、15%遮挡、学习率1e-4、批量64）与train_lwm.py（嵌入维度128、4×4复数块、遮挡0.40、基础学习率5e-4、批量128、50轮）不同。}
limitations:
- {en: 'The Hugging Face repository wi-lab/lwm does not contain the 15-scenario pre-training collection. It holds Miami plus the six downstream cities at 3.5 GHz, six 28 GHz mmWave scenarios and Challenge files, about 114 MB in total.', zh: Hugging Face仓库wi-lab/lwm不包含15个场景的预训练集合：它包含3.5 GHz的迈阿密及六个下游城市、六个28 GHz毫米波场景以及Challenge文件，合计约114 MB。}
- {en: 'The paper excludes the six downstream cities from pre-training, but train_lwm.py generates data for city_0 to city_19, which includes all six, so that exclusion does not hold for this code path.', zh: 论文将六个下游城市排除在预训练之外，但train_lwm.py生成city_0至city_19的数据，其中包含全部六个城市，因此该代码路径不满足此排除。}
- {en: 'In the paper, the six downstream cities are split 70%, 20% and 10% into training, validation and test sets.', zh: 论文中，六个下游城市的数据按70%、20%、10%划分为训练、验证与测试集。}
history:
- {en: '2024-11-13: arXiv preprint v1 of the LWM paper.', zh: 2024-11-13：LWM论文arXiv预印本v1。}
- {en: '2025-04-07: arXiv v2 of the paper.', zh: 2025-04-07：论文arXiv v2。}
- {en: '2025: LWM 2025 Challenge with five downstream tasks and hidden-test evaluation by the organizers.', zh: 2025年：LWM 2025 Challenge，包含五类下游任务，由组织方以隐藏测试集评估。}
usage:
- {en: 'Use the Challenge task_N train, val and test .pt files as released; train_heads.py reads their channels and labels entries.', zh: 按发布内容使用Challenge的task_N训练、验证与测试.pt文件；train_heads.py读取其中的channels与labels。}
- {en: 'For custom data, follow the model card''s operational settings: 32 BS antennas, 1 UE antenna, 32 subcarriers, 20 paths and 3.5 GHz.', zh: 使用自定义数据时，应遵循模型卡的运行设置：32个基站天线、1个用户天线、32个子载波、20条路径、3.5 GHz。}
- {en: 'The model card loads scenarios by name, for example city_18_denver, from the Hugging Face dataset repository through git LFS.', zh: 模型卡通过git LFS从Hugging Face数据集仓库按场景名加载数据，例如city_18_denver。}
- {en: Beam labels for the 28 GHz task are computed per user from 28 GHz channels generated at the same user positions., zh: 28 GHz任务的波束标签，是在同一用户位置生成28 GHz信道后逐用户计算的。}
field_notes:
- label: {en: Position, zh: 位置}
  text: {en: 'The localization task (ChannelCharting in train_heads.py) uses the first two columns of rx_pos as 2D labels. The other tasks use LoS flags, beam indices or complex-channel targets.', zh: 定位任务（train_heads.py中的ChannelCharting）以rx_pos的前两列作为二维标签。其他任务分别使用LoS标志、波束索引或复信道目标。}
- label: {en: Beam labels, zh: 波束标签}
  text: {en: 'In the paper, 28 GHz beam labels are generated from the corresponding 28 GHz channels and a specified codebook.', zh: 论文中，28 GHz波束标签由对应的28 GHz信道与指定码本生成。}
- label: {en: Single-BS samples, zh: 单基站样本}
  text: {en: 'dataset_generator takes one base station index per call, so each sample is one BS-UE link.', zh: dataset_generator每次调用只接受一个基站索引，因此每个样本为一条基站-用户链路。}
- label: {en: Cross-frequency pairing, zh: 跨频配对}
  text: {en: The 3.5 GHz inputs and 28 GHz labels are simulated for the same users; they are not synchronized dual-band measurements., zh: 3.5 GHz输入与28 GHz标签由相同用户位置仿真得到，并非同步的双频测量。}
- label: {en: Paths, zh: 路径}
  text: {en: 'The Challenge generator returns only channels and task labels. The train_heads interface exposes no per-path delays, angles or interaction tables, so path ground truth must come from the DeepMIMO scenarios.', zh: Challenge生成器只返回信道与任务标签。train_heads接口不提供逐径时延、角度或交互表，路径真值需从DeepMIMO场景获取。}
tools: [awesome-channel-foundation-models]
overview: {en: 'The LWM pre-training corpus is the set of wireless channels used to pre-train the Large Wireless Model, as described in arXiv:2411.08872 (2024). The paper reports over 1 million ray-traced channels from 15 DeepMIMO scenarios: O1, Boston5G, ASU Campus, and 12 city scenarios including New York, Los Angeles, Chicago, Houston and Seattle. Each channel is a complex 32×32 matrix with 32 base station antennas, 1 UE antenna and 32 subcarriers, split 820K for training and 200K for validation (80/20). In the paper, the downstream evaluation uses six scenarios excluded from pre-training (Denver, Fort Worth, Oklahoma, Indianapolis, Santa Clara, San Diego), with 14,840 samples, 3.5 GHz channel inputs and 28 GHz beam labels from codebooks of 16 to 256 beams. The LWM Challenge defines five downstream tasks: LoS/NLoS classification, sub-6 GHz to mmWave beam prediction, channel interpolation, channel estimation and localization. The Hugging Face repository wi-lab/lwm holds only a subset of
    this material: seven 3.5 GHz city scenarios, six 28 GHz mmWave scenarios and Challenge files, about 114 MB in total.', zh: 'LWM预训练语料是用于预训练Large Wireless Model的无线信道集合，见arXiv:2411.08872（2024）。论文报告了来自15个DeepMIMO场景的100多万条光线追踪信道：O1、Boston5G、ASU Campus，以及包括纽约、洛杉矶、芝加哥、休斯顿和西雅图在内的12个城市场景。每条信道为复数32×32矩阵，对应32个基站天线、1个用户天线和32个子载波，按80/20划分为82万条训练样本和20万条验证样本。论文中，下游评测使用6个未纳入预训练的场景（Denver、Fort Worth、Oklahoma、Indianapolis、Santa Clara、San Diego），共14,840个样本，输入为3.5 GHz信道，标签为码本大小16至256的28 GHz波束。LWM Challenge定义了五类下游任务：LoS/NLoS分类、Sub-6 GHz到毫米波波束预测、信道插值、信道估计和定位。Hugging Face仓库wi-lab/lwm只包含其中一部分：7个3.5 GHz城市场景、6个28 GHz毫米波场景及Challenge文件，合计约114 MB。'}
signal_details:
- signal: csi
  text: {en: 'Complex channels H of size 32×32 (32 base station antennas, 1 UE antenna, 32 subcarriers) from ray-traced DeepMIMO scenarios, as in Table I of arXiv:2411.08872. Downstream inputs are 3.5 GHz channels, and beam labels come from 28 GHz channels through codebooks of 16 to 256 beams. The Challenge generator in train_lwm.py sets antenna and subcarrier counts per scenario instead, from 8 to 128 antennas and 32 to 1024 subcarriers.', zh: '由光线追踪DeepMIMO场景生成的复数信道H，尺寸为32×32（32个基站天线、1个用户天线、32个子载波），见arXiv:2411.08872表I。下游输入为3.5 GHz信道，波束标签由28 GHz信道经16至256个波束的码本得到。Challenge生成器（train_lwm.py）则按场景设置天线数与子载波数，天线数为8至128，子载波数为32至1024。'}
size_gb: 0.114
format: MAT and .p files
organization: Arizona State University, Wireless Intelligence Lab
