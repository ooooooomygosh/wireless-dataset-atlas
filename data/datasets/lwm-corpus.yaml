id: lwm-corpus
name: LWM Pre-training Dataset
aliases: [LWM training corpus]
year: 2024
origin: ray-tracing
tasks: [foundation-model, channel-estimation, beam-management]
signals: [csi]
bands_ghz: [3.5]
environment: [outdoor-urban]
antennas: {tx: 32, rx: 1}
subcarriers: 32
samples: over 1 million channels from 15 DeepMIMO scenarios
license: Not stated
access: {url: 'https://huggingface.co/datasets/wi-lab/lwm', type: open}
code: ['https://huggingface.co/wi-lab/lwm-competition-2025']
paper: arxiv:2411.08872
used_in: ['doi:10.1109/icmlcn64995.2025.11140266']
citing: ['doi:10.1109/icmlcn64995.2025.11140101']
summary: {en: 'Ray-traced channels from 15 DeepMIMO scenarios, with over 1 million channels in total, generated at 3.5 GHz with 32 BS antennas, one UE antenna, 32 subcarriers and 20 paths. Pre-training uses 80% of the channels for training and 20% for validation.', zh: 来自 15 个 DeepMIMO 场景的光线追踪信道，共超过 100 万条信道，在 3.5 GHz 下生成，基站 32 天线、用户 1 天线、32 子载波、20 条路径。预训练时 80% 用于训练，20% 用于验证。}
sources: ['https://huggingface.co/datasets/wi-lab/lwm', 'https://huggingface.co/wi-lab/lwm', 'https://huggingface.co/wi-lab/lwm-competition-2025', 'https://arxiv.org/abs/2411.08872', 'https://arxiv.org/html/2411.08872v2']
checked: '2026-11-06'
pipeline:
  summary: {en: 'Array and OFDM configurations convert DeepMIMO paths into complex CSI, followed by filtering, scaling, and patching. Pretraining reconstruction targets and the Challenge''s five downstream label types are generated afterward.', zh: DeepMIMO 路径被阵列与 OFDM 配置转换成复 CSI，再过滤、缩放和切块；预训练重建目标与 Challenge 的五类下游标签在此后产生。}
  stages:
  - title: {en: Select DeepMIMO scenarios and links, zh: 选择 DeepMIMO 场景与链路}
    detail: {en: 'The current generator loads DeepMIMO by scenario, BS, and receive grid; rows can further filter receiver positions. The original paper pretrains on 15 scenarios.', zh: 当前生成器按 scenario、BS 和接收网格加载 DeepMIMO；rows 可进一步筛选接收位置。原论文预训练覆盖 15 个场景。}
    inputs:
    - {en: Scenario RT outputs, zh: 场景 RT 输出}
    - {en: Transmitter/receiver sets and UE grid rows, zh: 发射/接收集合、UE 网格行}
    outputs:
    - {en: 'Link collection with positions, LoS, and path information', zh: 带位置、LoS 与路径信息的链路集合}
    controls:
    - {en: 'Author settings: record the original scenario collection and Challenge configurations separately.', zh: 作者设置：原论文场景集合与 Challenge 配置分别记录。}
    checks:
    - {en: 'Reproduction recommendation: preserve scenario names, BSs, and original UE indices so that renaming a file cannot move the same position into another split.', zh: 复现建议：保存场景名、BS、原始 UE 索引；避免同一位置换文件名后进入另一划分。}
  - title: {en: Compute complex CSI from paths, zh: 从路径计算复 CSI}
    detail: {en: 'The Challenge dataset_generator defaults to a 32×1 BS array, single-antenna UE, and 32 subcarriers. get_parameters uses half-wavelength spacing, 20 paths, and a bandwidth of 30 kHz × number of subcarriers before invoking DeepMIMO channel computation.', zh: Challenge 的 dataset_generator 默认 32×1 BS 阵列、单天线 UE、32 子载波；get_parameters 使用半波长间距、20 条路径及 30 kHz×子载波数的带宽，再调用 DeepMIMO 信道计算。}
    inputs:
    - {en: Path parameters, zh: 路径参数}
    - {en: Array configuration, zh: 阵列配置}
    - {en: OFDM frequency grid, zh: OFDM 频率网格}
    outputs:
    - {en: 'Complex channels ordered by UE, receive antenna, BS antenna, and subcarrier', zh: 按 UE、接收天线、BS 天线、子载波排列的复信道}
    controls:
    - {en: 'Author code: BS rotation is [0,0,-135] degrees; outer calls can override antenna and subcarrier counts.', zh: '作者代码：BS 旋转为 [0,0,-135] 度；外层调用可覆盖天线和子载波数。'}
    checks:
    - {en: 'Reproduction recommendation: inspect actual configurations and tensor shapes; entry-point defaults cannot substitute for the configuration used to generate a file.', zh: 复现建议：读取实际配置和张量形状；调用入口的默认值不能替代文件所用配置。}
  - title: {en: Filter samples with no paths and standardize numerical scaling, zh: 过滤无路径样本并统一数值尺度}
    detail: {en: 'Current code retains samples with los!=-1, converts them to complex64, and multiplies by 10^6. ChannelEstimation can add complex Gaussian noise based on sample power, retaining clean channels as labels.', zh: 当前代码保留 los!=-1 的样本，转 complex64 后乘 10^6；ChannelEstimation 可按样本功率添加复高斯噪声，干净信道留作标签。}
    inputs:
    - {en: Complex CSI, zh: 复 CSI}
    - {en: los field, zh: los 字段}
    outputs:
    - {en: Scaled valid CSI, zh: 缩放后的有效 CSI}
    - {en: Corresponding clean real/imaginary targets, zh: 对应的干净实部/虚部目标}
    controls:
    - {en: 'Author code: multiplication by a constant is scaling, not per-sample unit-norm normalization.', zh: 作者代码：乘常数是缩放，不是逐样本单位范数归一化。}
    - {en: 'Author code: snr and task determine whether noise is added.', zh: 作者代码：是否加噪由 snr 和 task 决定。}
    checks:
    - {en: 'Reproduction recommendation: use the same valid indices for labels and inputs; check power before/after noise and the inverse scaling transform.', zh: 复现建议：标签与输入使用同一有效索引；核对噪声前后功率及缩放逆变换。}
  - title: {en: Patch and generate masking tasks according to the version, zh: 按版本切块与生成遮挡任务}
    detail: {en: 'The original paper separates real/imaginary components of 32×32 CSI into 128 tokens of 16 dimensions using 16×1 segments, selecting approximately 15% of segments in pairs for MCM. The current Challenge patch_maker uses 4×4 complex blocks, with 32 interleaved real values per token and zero padding when dimensions are not divisible.', zh: 原论文的 32×32 CSI 分实虚、以 16×1 片段组成 128 个 16 维 token，成对选择约 15% 片段做 MCM；当前 Challenge patch_maker 改用 4×4 复数块，每个 token 含交错的 32 个实数值，不整除时补零。}
    inputs:
    - {en: Scaled CSI, zh: 缩放后的 CSI}
    outputs:
    - {en: Token sequence, zh: token 序列}
    - {en: masked positions, zh: masked positions}
    - {en: Clean-token reconstruction targets, zh: 干净 token 重建目标}
    controls:
    - {en: 'Author paper: selected segments use 80% replacement, 10% random substitution, and 10% retention.', zh: 作者论文：被选片段采用 80% 替换、10% 随机、10% 保留。}
    - {en: 'Author code: the current tokenizer defaults to masking_percent=0.40; this is not an original-paper hyperparameter.', zh: 作者代码：当前 tokenizer 的 masking_percent 默认 0.40；不能当成原论文超参数。}
    checks:
    - {en: 'Reproduction recommendation: reconstruct complex CSI and verify patch order; record padding, CLS, and mask-index rules.', zh: 复现建议：重建复 CSI 并验证 patch 顺序；记录 padding、CLS 与 mask 索引规则。}
  - title: {en: Generate task labels, zh: 生成任务标签}
    detail: {en: 'LoS classification reads los; positioning reads the first two dimensions of rx_pos; estimation and interpolation target clean real/imaginary channels. Current beam labels multiply steering vectors by channels, take the magnitude of the complex response averaged across frequency, and select the maximum.', zh: LoS 分类读取 los；定位读取 rx_pos 的前两维；估计与插值目标为干净实虚信道。当前 beam 标签先做 steering 向量与信道相乘，再取跨频复响应平均的幅度并选最大项。}
    inputs:
    - {en: Valid CSI, zh: 有效 CSI}
    - {en: LoS、rx_pos, zh: LoS、rx_pos}
    - {en: Specified steering codebook, zh: 指定 steering codebook}
    outputs:
    - {en: LoS classes, zh: LoS 类别}
    - {en: 2D positions, zh: 二维位置}
    - {en: beam index, zh: beam index}
    - {en: Estimation/interpolation reconstruction targets, zh: 估计/插值重建目标}
    controls:
    - {en: 'Author code: beam labels use coherent averaging across frequency, which differs from averaging per-subcarrier powers.', zh: 作者代码：beam 标签采用相干跨频平均；它不同于逐子载波功率的平均。}
    checks:
    - {en: 'Reproduction recommendation: recompute sampled labels using the current formula and separately report the power/SINR definition used for communication utility.', zh: 复现建议：按当前标签公式重算抽样标签，并单独报告通信效用所用功率/SINR 定义。}
  - title: {en: 'Split, package, and expose training entry points', zh: 划分、封装与公开训练入口}
    detail: {en: The original paper splits pretraining data 80/20 into training and validation. The Challenge provides train/val/test_data.pt for task_1–task_5; train_heads.py reads channels and labels and configures task heads from config., zh: 原论文预训练按 80/20 划分训练与验证。Challenge 按 task_1–task_5 提供 train/val/test_data.pt，由 train_heads.py 读取 channels 与 labels，并结合 config 配置任务头。}
    inputs:
    - {en: token/CSI, zh: token/CSI}
    - {en: Task labels, zh: 任务标签}
    - {en: Scenario identity, zh: 场景身份}
    outputs:
    - {en: Per-task .pt data views, zh: 分任务的 .pt 数据视图}
    - {en: Pretrained models and downstream training entry points, zh: 预训练模型与下游训练入口}
    controls:
    - {en: 'Author release: the original pretraining split and released competition splits follow different protocols.', zh: 作者发布：原论文预训练划分与比赛发布划分属于不同协议。}
    checks:
    - {en: 'Reproduction recommendation: preserve released splits. When adding cross-scenario evaluation, redefine the isolation unit; the original 80/20 split is not automatically an out-of-scenario test.', zh: 复现建议：保留发布划分；增加跨场景评测时重新定义隔离单位，不能把原始 80/20 自动解释为场景外测试。}
  scope: {en: 'Describes the original LWM pretraining protocol and current 2025 Challenge code separately; their patch, scaling, and mask settings differ.', zh: 分别描述 LWM 原论文预训练协议与当前 2025 Challenge 代码；二者的 patch、缩放和 mask 设置不同。}
facts:
- label: {en: Native outputs, zh: 原生输出}
  text: {en: '• DeepMIMO-derived complex CSI

      • Challenge channels/labels tensors and config

      • LWM pretrained weights', zh: '• DeepMIMO 派生复 CSI

      • Challenge 的 channels/labels 张量与 config

      • LWM 预训练权重'}
- label: {en: Derived outputs, zh: 派生输出}
  text: {en: '• MCM tokens, masks, and reconstruction targets

      • LoS, position, and beam labels for specified tasks

      • Rate or scheduling utility calculated separately by the user', zh: '• MCM token、mask 与重建目标

      • 指定任务的 LoS、位置和 beam 标签

      • 用户另行计算的速率或调度效用'}
- label: {en: Reproduction notes, zh: 复现说明}
  text: {en: '• For reproduction, choose the original-paper protocol or current Challenge interface first, then freeze the input representation.

      • This review inspected source code and documentation; no samples were downloaded, actual .pt shapes checked, or training executed.', zh: '• 复现时先选定原论文协议或 Challenge 当前接口，再冻结输入表示。

      • 本次核查源码和文档，未下载样本、核对实际 .pt shape 或执行训练。'}
provenance:
- {en: DeepMIMO scenarios and RT paths generate complex CSI under specified array/OFDM configurations., zh: DeepMIMO 场景与 RT 路径，按指定阵列/OFDM 配置生成复 CSI}
- {en: Current Challenge code filters los=-1 and multiplies by 10^6; this is not per-sample unit-norm normalization., zh: Challenge 当前代码过滤 los=-1 并乘 10^6；不是逐样本单位范数归一化}
- {en: The original paper uses 16×1 tokens with separate real/imaginary components. The current Challenge uses 4×4 complex blocks and interleaved 32-dimensional real/imaginary tokens., zh: 原论文使用分实虚的 16×1 token；当前 Challenge 使用 4×4 复数块与交错实虚 32 维 token}
- {en: 'Generate MCM masks according to the version, or form downstream labels from LoS, positions, and a specified steering codebook.', zh: 按版本生成 MCM mask，或由 LoS、位置、指定 steering codebook 形成下游标签}
- {en: Record the original paper's pretraining collection separately from the Challenge's per-task train/val/test assets., zh: 原论文预训练集合与 Challenge 分任务 train/val/test 资产分别记录}
technical_notes:
- {en: 'Literature-supported: the original training collection comes from 15 DeepMIMO scenarios; it is not an independent measurement corpus.', zh: 文献支持：原论文训练集合来自 15 个 DeepMIMO 场景；不是独立测量语料。}
- {en: 'Literature-supported: the original paper uses fixed 32×32 channel inputs. Identical tensor shapes need not have the same physical meaning after changing array spacing or subcarrier spacing.', zh: 文献支持：原论文使用固定 32×32 信道输入；改变阵列间距或子载波间隔后同一张量尺寸不保证物理同义。}
- {en: 'Unknown: inspect each original scenario''s configuration for enabled diffraction/scattering mechanisms; these cannot be inferred from LWM.', zh: 未知：各原场景启用的绕射/散射机制应查各场景配置，不能从 LWM 推断。}
limitations:
- {en: 'Inference: if LWM and ContraWiMAE share original DeepMIMO scenarios, pretraining/test deduplication must trace upstream scenarios and UE indices.', zh: 推断：LWM 与 ContraWiMAE 若共享 DeepMIMO 原场景，预训练/测试去重必须追到上游场景及 UE 索引。}
- {en: 'Literature-supported: the original paper''s six downstream cities were excluded from pretraining, but their downstream data still have train/validation/test splits. This is not automatically testing on cities entirely unseen during downstream learning.', zh: 文献支持：原论文下游六个城市未用于预训练，但其下游数据仍划分训练/验证/测试；不能直接称下游完全未见城市测试。}
- {en: 'Unknown: this card has not verified whether the latest subsequent LWM models reuse or extend this corpus.', zh: 未知：本卡未验证最新后续 LWM 模型是否复用或扩展此语料。}
history:
- {en: '2024-11-13: Original LWM preprint v1', zh: 2024-11-13：LWM 原始预印本 v1}
- {en: '2025-04-07: Paper v2; not a dataset update date', zh: 2025-04-07：论文 v2；不能当作数据更新日}
- {en: '2025: LWM 2025 Challenge: five downstream task types and hidden-test evaluation', zh: 2025：LWM 2025 Challenge，五类下游任务和隐藏测试评估}
usage:
- {en: Choose either the original-paper reproduction or the Challenge protocol first; record the model version and scenario list., zh: 先选择原论文复现或 Challenge 协议，记录模型版本与场景清单。}
- {en: Read preprocessing and tensor-axis conventions from the official assets; fit normalization using training data only., zh: 从官方资产入口读取预处理与张量轴约定；只用训练数据拟合归一化。}
- {en: 'For cross-frequency tasks, pair samples by original scenario, BS, and UE indices and verify the codebook; do not blindly join two files by row number.', zh: 对跨频任务用原始场景、BS 和 UE 索引配对，核对码本；不按两文件行号盲目拼接。}
- {en: 'Report Top-k, beam gain, and overlap with pretraining scenarios together. This workflow has not been run locally.', zh: 同时报告 Top-k、波束收益和预训练场景重叠。此流程未在本机运行。}
field_notes:
- label: {en: Position, zh: 位置}
  text: {en: 'The Challenge positioning task directly provides 2D coordinate labels. Other tasks use LoS, beam indices, or complex-channel targets; coordinates are not a universal field in all files.', zh: Challenge 定位任务直接提供二维坐标 labels；其他任务的 labels 分别为 LoS、beam index 或复信道目标，坐标不是所有文件的通用字段。}
- label: {en: Beam labels, zh: 波束标签}
  text: {en: High-frequency beams in the original paper are generated from the corresponding 28 GHz channels and a specified codebook., zh: 原论文高频波束由对应 28 GHz 信道和指定码本产生。}
- label: {en: Multi-BS, zh: 多基站}
  text: {en: Multiple sites across scenarios do not mean every sample contains synchronized multi-BS links., zh: 跨场景存在多个站点，不等于每个样本含同步多 BS 链路。}
- label: {en: Cross-frequency pairing, zh: 跨频配对}
  text: {en: 'Simulated cross-frequency samples, not synchronized real-world dual-band measurements.', zh: 仿真跨频样本，不是真实同步双频测量。}
- label: {en: Paths, zh: 路径}
  text: {en: 'The Challenge generator returns only channels and task labels. train_heads.py consumes channels and labels from .pt dictionaries; the interface does not expose per-path delays, angles, or interaction tables. Return to the DeepMIMO scenarios when path ground truth is needed.', zh: Challenge 的生成器只返回信道与任务标签；train_heads.py 从 .pt 字典消费 channels 和 labels，接口不提供逐径时延、角度或交互表。需要路径真值时回溯 DeepMIMO 场景。}
tools: [awesome-channel-foundation-models]
overview: {en: 'The LWM pre-training corpus is the set of wireless channels used to pre-train the Large Wireless Model, as described in arXiv:2411.08872 (2024). It contains over 1 million ray-traced channels from 15 DeepMIMO scenarios: O1, Boston5G, ASU Campus, and 12 city scenarios including New York, Los Angeles, Chicago, Houston and Seattle. Each channel is a complex 32×32 matrix with 32 base station antennas, 1 UE antenna and 32 subcarriers, and the paper splits the channels 820K for training and 200K for validation (80/20). The downstream evaluation covers six unseen scenarios (Denver, Fort Worth, Oklahoma, Indianapolis, Santa Clara, San Diego) with 14,840 samples, using 3.5 GHz channel inputs and 28 GHz beam labels from codebooks of 16 to 256 beams. The LWM Challenge release defines five downstream tasks: LoS/NLoS classification, sub-6 GHz to mmWave beam prediction, channel interpolation, channel estimation and localization. The Hugging Face dataset page cites the DeepMIMO paper and
    lists a file size of 114 MB, but it describes neither the file structure nor the data format or license.', zh: 'LWM 预训练语料是用于预训练 Large Wireless Model 的无线信道集合，见 arXiv:2411.08872（2024）。它包含来自 15 个 DeepMIMO 场景的超过 100 万条光线追踪信道，场景包括 O1、Boston5G、ASU Campus，以及纽约、洛杉矶、芝加哥、休斯顿、西雅图等 12 个城市场景。每条信道为复数 32×32 矩阵，对应基站 32 天线、用户 1 天线、32 子载波，论文将信道按 80/20 划分为 82 万条训练样本和 20 万条验证样本。下游评测覆盖 6 个未见场景（Denver、Fort Worth、Oklahoma、Indianapolis、Santa Clara、San Diego），共 14,840 个样本，输入为 3.5 GHz 信道，标签为 28 GHz 波束，码本大小为 16 至 256 个波束。LWM Challenge 发布定义了 5 个下游任务：LoS/NLoS 分类、Sub-6 GHz 到毫米波波束预测、信道插值、信道估计和定位。'}
signal_details:
- signal: csi
  text: {en: 'Ray-traced complex channels H ∈ C^(32×32) generated from DeepMIMO scenarios, with 32 base station antennas, 1 UE antenna and 32 subcarriers (Table I of arXiv:2411.08872). The downstream inputs are 3.5 GHz channels, and the beam labels come from 28 GHz channels through a codebook of 16 to 256 beams.', zh: '由 DeepMIMO 场景生成的复数光线追踪信道 H ∈ C^(32×32)，基站 32 天线、用户 1 天线、32 子载波（arXiv:2411.08872 表 I）。下游输入为 3.5 GHz 信道，波束标签由 28 GHz 信道经 16 至 256 个波束的码本得到。'}
