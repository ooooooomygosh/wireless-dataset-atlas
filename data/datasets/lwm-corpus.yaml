- key: imu
  status: none
  note: {en: No inertial sensor data in the release., zh: 发布内容中没有惯性传感器数据。}
- key: time_series
  status: none
  note: {en: 'Samples are static receiver-grid snapshots, with no timestamps or ordered sequences.', zh: 样本为静态接收网格快照，无时间戳，也无有序序列。}
- key: multiuser
  status: derivable
  note: {en: 'Users of one BS and scenario share a snapshot, so user sets can be formed; each sample is one BS-UE link.', zh: 同一基站与场景的用户共享同一快照，因此可组成用户集合；每个样本为一条BS-UE链路。}
- key: multibs
  status: derivable
  note: {en: 'Each city has BS1 to BS3 files with the same UE index range, so a joint set can be formed; each sample is one BS-UE link.', zh: 每个城市包含BS1至BS3文件且UE索引范围相同，可组成联合集合；每个样本仍为一条BS-UE链路。}
- key: crossfreq
  status: provided
  note: {en: 'The 3.5 GHz city scenarios and six 28 GHz scenarios share UE index ranges; the channels are simulated, not synchronized measurements.', zh: 3.5 GHz城市场景与六个28 GHz场景的UE索引范围相同；信道为仿真生成，并非同步测量。}
- {key: near_field, status: unknown}
- key: high_mobility
  status: none
  note: {en: Users sit on static receiver grids and no speed is stated., zh: 用户位于静态接收网格上，未给出速度。}
- key: dynamic_blockage
  status: none
  note: {en: Static snapshots; the sources describe no moving blockers., zh: 静态快照；来源未描述移动遮挡体。}
- {key: reflection, status: unknown}
- {key: diffraction, status: unknown}
- {key: scattering, status: unknown}
- {key: transmission, status: unknown}
- {key: polarization, status: unknown}
- key: em_field
  status: none
  note: {en: 'The release holds channel matrices only, with no field-level outputs.', zh: 发布内容仅包含信道矩阵，无场级输出。}
versions:
- version: Competition package
  date: '2025-11-08'
  summary: {en: 'The Challenge repository lwm-competition-2025 is released with task_1 to task_5 train, validation and test .pt sets, a baseline LWM 1.1 checkpoint and train_lwm.py.', zh: 发布Challenge仓库lwm-competition-2025，包含task_1至task_5的训练、验证与测试.pt文件、基线LWM 1.1检查点及train_lwm.py。}
  url: https://huggingface.co/wi-lab/lwm-competition-2025
- version: arXiv v2
  date: '2025-04-07'
  summary: {en: Second arXiv version of the LWM paper; its pre-training section describes over 1 million ray-traced channels from 15 DeepMIMO scenarios with an 80/20 train/validation split., zh: LWM论文的第二个arXiv版本；预训练部分描述了来自15个DeepMIMO场景的100多万条光线追踪信道，按80/20划分为训练集与验证集。}
  url: https://arxiv.org/abs/2411.08872v2
- version: mmWave scenarios
  date: '2025-02-11'
  summary: {en: 'Six 28 GHz scenarios (Denver, Fort Worth, Indianapolis, Oklahoma, San Diego, Santa Clara) are added to wi-lab/lwm; six scenario_pos_multi_bs.csv files are deleted the same day.', zh: wi-lab/lwm新增六个28 GHz场景（Denver、Fort Worth、Indianapolis、Oklahoma、San Diego、Santa Clara），同日删除六个scenario_pos_multi_bs.csv文件。}
  url: https://huggingface.co/datasets/wi-lab/lwm/commits/main
- version: Densified Miami
  date: '2025-01-27'
  summary: {en: 'A densified Miami scenario (city_6_miami, receiver indices 0 to 42984) is added to wi-lab/lwm.', zh: wi-lab/lwm新增加密版Miami场景（city_6_miami，接收端索引0至42984）。}
  url: https://huggingface.co/datasets/wi-lab/lwm/commits/main
- version: arXiv v1
  date: '2024-11-13'
  summary: {en: 'First arXiv version of the LWM paper, submitted 2024-11-13.', zh: LWM论文的第一个arXiv版本，提交于2024-11-13。}
  url: https://arxiv.org/abs/2411.08872v1
- version: 54-file layout
  date: '2024-09-19'
  summary: {en: '54 scenario files are uploaded to replace dataset.zip and dataset_script.py; the zip, the loader script and .gitattributes are deleted the same day.', zh: 上传54个场景文件以替代dataset.zip与dataset_script.py；同日删除zip文件、加载脚本与.gitattributes。}
  url: https://huggingface.co/datasets/wi-lab/lwm/commits/main
- version: Initial dataset.zip
  date: '2024-09-15'
  summary: {en: 'The Hugging Face repository wi-lab/lwm is created, with dataset.zip as its first data file.', zh: Hugging Face仓库wi-lab/lwm创建，首个数据文件为dataset.zip。}
  url: https://huggingface.co/datasets/wi-lab/lwm
