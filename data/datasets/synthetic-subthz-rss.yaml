summary: {en: 'Generator output: 60-second received-signal-power traces with micromobility attenuation and beam-tracking periods of 20-2000 ms, generated from blockage and micromobility processes measured in an empty hall.', zh: 生成器输出：60秒接收信号功率轨迹，包含微移动衰减和20至2000 ms的波束跟踪周期，由在空旷大厅中实测的遮挡与微移动过程生成。}
