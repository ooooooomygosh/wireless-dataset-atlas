<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="无线通信数据生产流程、科研选型、资源对比与官方材料的在线知识库"
    />
    <title>Wireless Dataset Atlas</title>
    <style>
      :root {
  --bg: #f5f7fa;
  --paper: #fff;
  --ink: #172b3c;
  --muted: #657688;
  --line: #dfe6ed;
  --nav: #102a36;
  --accent: #167d89;
  --soft: #e9f5f4;
  --blue: #4463aa;
  --warn: #a66a1d;
  --shadow: 0 7px 26px #142c3c06;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font:
    14px/1.75 -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "PingFang SC",
    sans-serif;
}
body.dark {
  --bg: #101c26;
  --paper: #182936;
  --ink: #e0e9ee;
  --muted: #9dabb9;
  --line: #304551;
  --soft: #143c42;
  --accent: #65c8ca;
  --blue: #a8bafa;
  --warn: #e0b46d;
}
a {
  color: var(--accent);
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
}
button,
input,
select {
  font: inherit;
}
button {
  cursor: pointer;
}
button,
a,
input,
select,
summary {
  outline-offset: 4px;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
summary:focus-visible {
  outline: 3px solid #42a6c3;
}
button {
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--paper);
  color: var(--ink);
  padding: 8px 13px;
}
button:hover {
  border-color: var(--accent);
  color: var(--accent);
}
button.primary {
  background: var(--accent);
  color: var(--paper);
  border-color: var(--accent);
}
.sidebar {
  position: fixed;
  width: 235px;
  inset: 0 auto 0 0;
  background: var(--nav);
  color: #d4e1e6;
  padding: 32px 22px;
  display: flex;
  flex-direction: column;
  z-index: 15;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  color: #f2f9fa;
  font-size: 15px;
  line-height: 1.45;
}
.brand:hover {
  text-decoration: none;
}
.brand-icon {
  background: #50aeb1;
  color: #102a36;
  display: grid;
  place-items: center;
  width: 39px;
  height: 43px;
  border-radius: 10px;
  font-size: 25px;
  font-weight: 800;
}
.nav-label {
  font-size: 10px;
  letter-spacing: 1.7px;
  color: #7898a7;
  margin: 45px 0 15px;
}
nav {
  display: grid;
  gap: 6px;
}
nav a {
  color: #adbec8;
  padding: 10px 13px;
  border-radius: 7px;
  font-size: 13px;
  display: flex;
  gap: 12px;
}
nav a.active {
  background: #21424e;
  color: #fff;
}
nav a:hover {
  background: #21424e;
  text-decoration: none;
}
.side-footer {
  margin-top: auto;
  font-size: 12px;
  color: #b5c7d1;
}
.side-footer small {
  color: #7898a7;
}
.live-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  background: #6bc8af;
  border-radius: 50%;
  margin-right: 5px;
}
.theme {
  display: block;
  background: transparent;
  color: #b5c7d1;
  border-color: #385460;
  margin-top: 16px;
  font-size: 12px;
}
.workspace {
  margin-left: 235px;
}
header {
  height: 67px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 38px;
  background: var(--paper);
  color: var(--muted);
  font-size: 12px;
}
#menu {
  display: none;
}
main {
  max-width: 1600px;
  margin: auto;
  padding: 34px 38px 65px;
}
footer {
  border-top: 1px solid var(--line);
  padding: 20px 38px;
  color: var(--muted);
  font-size: 11px;
}
footer span {
  float: right;
}
.eyebrow {
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--accent);
  font-weight: 700;
  text-transform: uppercase;
}
h1 {
  font-size: 32px;
  letter-spacing: -1px;
  line-height: 1.3;
  margin: 10px 0 14px;
  font-weight: 700;
}
h2 {
  font-size: 19px;
  line-height: 1.5;
  margin: 0 0 15px;
}
h3 {
  font-size: 15px;
  margin: 0 0 10px;
}
p {
  margin: 8px 0 15px;
}
.muted {
  color: var(--muted);
}
.lead {
  max-width: 820px;
  color: var(--muted);
  font-size: 15px;
}
.hero {
  position: relative;
  padding: 30px 32px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
}
.hero h1 {
  font-size: 37px;
}
.hero:after {
  content: "";
  position: absolute;
  right: -35px;
  top: -90px;
  width: 330px;
  height: 330px;
  border: 1px solid #167d891c;
  border-radius: 50%;
  box-shadow:
    0 0 0 35px #167d8906,
    0 0 0 70px #167d8905;
  pointer-events: none;
}
.hero .lead {
  max-width: 680px;
}
.row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.between {
  justify-content: space-between;
}
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin: 22px 0 30px;
}
.stat,
.panel {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 22px;
  box-shadow: var(--shadow);
}
.stat .number {
  font-size: 30px;
  font-weight: 650;
  line-height: 1.4;
}
.stat .label {
  color: var(--muted);
  font-size: 12px;
}
.stat .note {
  font-size: 11px;
  color: var(--accent);
  margin-top: 7px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}
.two {
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 20px;
}
.section {
  margin-top: 30px;
}
.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.section-title h2 {
  margin: 0;
}
.card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 22px;
  transition:
    transform 0.15s,
    border-color 0.15s;
}
.card:hover {
  border-color: #72a6b1;
  transform: translateY(-2px);
}
.card h3 a {
  font-size: 18px;
  color: var(--ink);
}
.card p {
  font-size: 13px;
  color: var(--muted);
}
.card .summary {
  min-height: 70px;
}
.tag {
  display: inline-block;
  padding: 2px 8px;
  background: var(--soft);
  color: var(--accent);
  border-radius: 4px;
  font-size: 10px;
  line-height: 1.8;
  margin: 0 4px 4px 0;
}
.tag.neutral {
  background: var(--bg);
  color: var(--muted);
}
.tag.warn {
  color: var(--warn);
  background: #b88c1710;
}
.card-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid var(--line);
  padding-top: 14px;
  margin-top: 16px;
}
.small {
  font-size: 12px;
}
.tiny {
  font-size: 11px;
}
.filters {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 18px;
  margin: 22px 0;
}
.filters input,
.filters select,
.wizard select,
.search {
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 9px 12px;
  min-width: 140px;
}
.filters input {
  flex: 1;
  min-width: 230px;
}
.filter-line {
  margin-top: 12px;
}
.count {
  font-size: 12px;
  color: var(--muted);
  margin: 12px 0;
}
.table-wrap {
  max-width: 100%;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--paper);
}
table {
  border-collapse: collapse;
  width: 100%;
  text-align: left;
  font-size: 12px;
}
td,
th {
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
  min-width: 100px;
}
th {
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 1;
  color: var(--muted);
  font-weight: 600;
}
td:first-child,
th:first-child {
  position: sticky;
  left: 0;
  background: var(--paper);
  z-index: 2;
  min-width: 160px;
}
th:first-child {
  background: var(--bg);
  z-index: 3;
}
.matrix button {
  border: 0;
  padding: 3px 7px;
  font-size: 11px;
  white-space: nowrap;
}
.state-direct {
  color: var(--accent);
}
.state-conditional {
  color: var(--blue);
}
.state-unknown {
  color: var(--muted);
}
.state-no {
  color: var(--warn);
}
.detail-head {
  border-bottom: 1px solid var(--line);
  padding-bottom: 20px;
  margin-bottom: 25px;
}
.tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin: 18px 0 25px;
}
.tabs a {
  padding: 7px 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  font-size: 12px;
}
.kv {
  display: grid;
  grid-template-columns: 130px 1fr;
  gap: 10px;
  margin: 8px 0;
  font-size: 13px;
}
.kv > span {
  color: var(--muted);
}
.flow {
  display: flex;
  align-items: stretch;
  gap: 8px;
  overflow: auto;
  padding: 12px 0;
}
.flow-node {
  background: var(--soft);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 14px;
  min-width: 145px;
  flex: 1;
  font-size: 12px;
}
.flow-arrow {
  align-self: center;
  color: var(--muted);
}
.callout {
  background: var(--soft);
  border-left: 3px solid var(--accent);
  padding: 14px 18px;
  margin: 15px 0;
  font-size: 13px;
}
.warning {
  background: #c28b0c0b;
  border-color: var(--warn);
}
details {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--paper);
  margin: 10px 0;
  padding: 15px 18px;
}
summary {
  cursor: pointer;
  font-weight: 600;
}
details > div {
  padding-top: 14px;
}
.source {
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
  overflow-wrap: anywhere;
}
.source h3 {
  margin: 0;
  font-size: 14px;
}
.source p {
  font-size: 12px;
  margin: 6px 0;
  color: var(--muted);
}
pre {
  background: #102532;
  color: #d5e9ed;
  padding: 20px;
  border-radius: 8px;
  overflow: auto;
  font:
    12px/1.8 ui-monospace,
    SFMono-Regular,
    monospace;
}
code {
  font-family: ui-monospace, SFMono-Regular, monospace;
}
.timeline {
  border-left: 2px solid var(--line);
  margin: 15px;
  padding-left: 23px;
}
.event {
  position: relative;
  padding: 0 0 20px;
}
.event:before {
  content: "";
  position: absolute;
  left: -29px;
  top: 7px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent);
}
.wizard label {
  display: block;
  margin: 14px 0;
}
.wizard select {
  width: 100%;
  margin-top: 6px;
}
.wizard input {
  accent-color: var(--accent);
}
.empty {
  padding: 45px;
  text-align: center;
  color: var(--muted);
  border: 1px dashed var(--line);
  border-radius: 8px;
}
.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}
.task-tile {
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--paper);
  color: var(--ink);
  font-size: 13px;
  display: block;
}
.task-tile span {
  display: block;
  color: var(--muted);
  font-size: 11px;
  margin-top: 4px;
}
.task-tile:hover {
  text-decoration: none;
  border-color: var(--accent);
}
.bar-row {
  display: grid;
  grid-template-columns: 125px 1fr 25px;
  gap: 12px;
  align-items: center;
  margin: 11px 0;
  font-size: 12px;
}
.bar {
  height: 8px;
  background: var(--bg);
  border-radius: 4px;
  overflow: hidden;
}
.bar i {
  display: block;
  height: 100%;
  background: var(--accent);
  border-radius: 4px;
}
.legend {
  font-size: 11px;
  color: var(--muted);
  margin: 8px 0;
}
.diagram {
  width: 100%;
  height: auto;
  max-height: 380px;
}
svg text {
  font-family: inherit;
  fill: var(--ink);
}
svg .node {
  fill: var(--soft);
  stroke: var(--line);
}
svg .edge {
  stroke: var(--muted);
  stroke-width: 1.3;
  fill: none;
}
.checklist label {
  display: block;
  margin: 9px 0;
}
#toast {
  position: fixed;
  bottom: 25px;
  left: 50%;
  background: var(--nav);
  color: #fff;
  padding: 10px 22px;
  border-radius: 8px;
  z-index: 40;
  display: none;
}
dialog {
  max-width: 750px;
  width: 90%;
  max-height: 85vh;
  overflow: auto;
  background: var(--paper);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 30px;
}
dialog::backdrop {
  background: #07182270;
}
#close-modal {
  float: right;
}
.topic p {
  max-width: 900px;
}
.compare-tray {
  position: sticky;
  bottom: 15px;
  background: var(--nav);
  color: #fff;
  border-radius: 9px;
  padding: 13px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 20px;
  box-shadow: 0 5px 25px #102a3630;
}
.comparison td {
  min-width: 225px;
  max-width: 350px;
}
.comparison td:first-child {
  min-width: 130px;
  max-width: 160px;
}
.list-view {
  grid-template-columns: 1fr;
}
.list-view .summary {
  min-height: 0;
}
.source-url {
  overflow-wrap: anywhere;
}
.qa-pass {
  color: var(--accent);
}
.qa-limit {
  color: var(--warn);
}
@media (max-width: 1150px) {
  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .two {
    grid-template-columns: 1fr;
  }
  .sidebar {
    width: 205px;
    padding: 25px 16px;
  }
  .workspace {
    margin-left: 205px;
  }
  main {
    padding: 28px 25px;
  }
  .stats {
    gap: 10px;
  }
  .stat {
    padding: 16px;
  }
}
@media (max-width: 760px) {
  .sidebar {
    transform: translateX(-100%);
    transition: transform 0.2s;
  }
  .sidebar.open {
    transform: translateX(0);
  }
  .workspace {
    margin-left: 0;
  }
  header {
    padding: 0 18px;
    height: 56px;
    gap: 15px;
  }
  #menu {
    display: block;
    padding: 3px 8px;
  }
  header > a {
    margin-left: auto;
  }
  #breadcrumb {
    display: none;
  }
  main {
    padding: 23px 17px;
  }
  .hero {
    padding: 23px;
  }
  .hero h1 {
    font-size: 29px;
  }
  .hero:after {
    display: none;
  }
  .stats {
    grid-template-columns: repeat(2, 1fr);
  }
  .grid {
    grid-template-columns: 1fr;
  }
  .panel {
    padding: 18px;
  }
  h1 {
    font-size: 27px;
  }
  .kv {
    grid-template-columns: 95px 1fr;
  }
  footer {
    padding: 20px;
  }
  footer span {
    float: none;
    display: block;
  }
  .filters .row > * {
    width: 100%;
  }
  .compare-tray {
    gap: 12px;
  }
  .card .summary {
    min-height: 0;
  }
}
@media print {
  .sidebar,
  header,
  footer,
  button,
  .filters,
  .tabs,
  .compare-tray {
    display: none !important;
  }
  .workspace {
    margin: 0;
  }
  main {
    padding: 0;
  }
  .panel,
  .card {
    box-shadow: none;
    break-inside: avoid;
  }
  body {
    background: #fff;
    color: #000;
  }
  .table-wrap {
    overflow: visible;
  }
  .comparison {
    font-size: 9px;
  }
  .comparison td {
    min-width: 0;
  }
  a {
    color: #000;
  }
  h1 {
    font-size: 24px;
  }
  details {
    display: block;
  }
  details > div {
    display: block;
  }
}
.compare-tray span {
  min-width: 0;
  overflow-wrap: anywhere;
}
.compare-tray a {
  flex-shrink: 0;
}
.kv > div {
  overflow-wrap: anywhere;
}
.source a {
  overflow-wrap: anywhere;
}
.core-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
  margin-top: 24px;
}
.core-card h2 {
  font-size: 24px;
  margin: 9px 0;
}
.core-card h3 {
  margin-top: 20px;
}
.core-promise {
  font-size: 18px;
  color: var(--accent);
  font-weight: 600;
}
.research-layout {
  grid-template-columns: minmax(260px, 0.8fr) minmax(0, 1.7fr);
  align-items: start;
}
.research-layout > .wizard {
  position: sticky;
  top: 20px;
}
.research-layout .section:first-child {
  margin-top: 0;
}
.recommendation-why {
  font-size: 15px;
  color: var(--ink);
}
.primary-recommendation {
  border: 2px solid var(--accent);
  background: linear-gradient(135deg, var(--soft), var(--paper) 60%);
}
.research-facts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  margin: 20px 0;
}
.research-facts > div {
  padding: 14px;
  background: var(--bg);
  border-radius: 7px;
  font-size: 13px;
}
.decision-table td {
  font-size: 13px;
  min-width: 235px;
}
.decision-table td:first-child {
  font-weight: 600;
  min-width: 150px;
  max-width: 180px;
}
.decision-table p {
  margin: 0;
}
.decision-table ul {
  padding-left: 16px;
  margin: 0;
}
.core-card .eyebrow {
  letter-spacing: 1px;
}
.wizard details {
  padding: 12px;
}
.wizard details label {
  font-size: 12px;
}
.recommendation .tag {
  font-size: 11px;
}
@media (max-width: 1050px) {
  .research-layout {
    grid-template-columns: 1fr;
  }
  .research-layout > .wizard {
    position: static;
  }
  .research-layout .section:first-child {
    margin-top: 20px;
  }
}
@media (max-width: 760px) {
  .core-grid,
  .research-facts {
    grid-template-columns: 1fr;
  }
  .core-card h2 {
    font-size: 22px;
  }
  .decision-table td {
    min-width: 225px;
  }
  .research-layout > .wizard {
    position: static;
  }
}
@media print {
  .research-layout {
    display: block;
  }
  .research-layout > .wizard {
    display: none;
  }
  .core-grid {
    display: block;
  }
  .core-card {
    margin-bottom: 20px;
  }
  .decision-table td {
    min-width: 0 !important;
    font-size: 9px;
  }
  .research-facts {
    display: block;
  }
}
.sidebar {
  overflow-y: auto;
}
.side-footer {
  padding-top: 18px;
}

.filters>label{min-width:0;max-width:100%}.filters>label select{max-width:100%}.production-table th[scope="row"]{background:var(--paper)}

置，故不认定其绕射、透射或漫散射启用状态。","推断：同一路径库只更换阵列/载频后处理会保留共同结构，不能等同两次独立 RT 或实测跨频证据。"],"risks":["随机划分相邻网格可产生空间近邻泄漏；按区域/站点隔离，并保留缓冲区。","v3/v4 数据组织及索引方式不同；compat_v3 仅提供指定兼容行为。","共享源引擎与地图的迁移应标为同源跨场景。","软件许可证不能自动覆盖地图、场景与第三方原始输出。"],"history":["2019：原始论文描述场景加生成参数定义数据。","2025：v4 beta 引入矩阵格式、转换器和动态场景 API。","2026：v4.0.0 stable；v4.0.5 当前官方最新发布；精确发布日期以 tag 元数据为准。"],"tutorial":["固定 deepmimo==4.0.5 和具体场景名；另存场景标识及 RT 参数。","执行 dm.download / dm.load 后先检查 rx_pos、路径维度和有效 UE。","显式设置天线、频域参数，再 compute_channels；确认维度与复数约定。","单位范数码本遍历计算功率，先复核 oracle 最优波束，再比固定/几何或邻近基线。","按站点/区域划分，归一化仅在训练集拟合；报告 beam gain loss 和明确 SNR 假设下的 SE。"],"papers":[],"coverageNote":"已核验下列来源的相关段落；未进行全量文件审计或系统性论文使用计数。","checkedAt":"2026-11-05","variants":[{"name":"标准静态Dataset / MacroDataset","observations":"位置、路径角度/时延/相位/功率；可选交互与场景几何；由阵列参数派生CSI。","csi":"可计算；RGB/LiDAR不属于标准字段。"},{"name":"DynamicDataset","observations":"每个snapshot来自单独RT结果；设置时间戳后计算节点/对象速度与Doppler。","csi":"需额外仿真或取得具体动态场景；API存在不代表所有静态下载包都有时间序列。"}],"organization":"DeepMIMO / Wireless Intelligence Lab（WI Lab）及开源社区","format":"v4：路径矩阵MAT文件 + objects.json/params.json；Python加载为数组，CSI由配置计算；v2/v3组织另见版本规范。","sourceIds":["source-001","source-002","source-003","source-004","source-005","source-006","source-007","source-008","source-132","source-133","source-v13-dm-dynamic"],"productionPipeline":{"scope":"DeepMIMO v4路径格式与4.0.5信道生成器；源场景的RT配置另行固定。","summary":"场景与传播引擎先决定路径库，DeepMIMO再统一格式并按阵列、频域和用户选择生成CSI。波束与多用户标签属于后续决策层。","stages":[{"title":"固定场景与源引擎","inputs":["已有场景名称/版本，或待追踪的3D几何","材料、Tx/Rx位置与上游RT工程"],"operation":"选择现成路径场景，或先在Wireless InSite、Sionna RT等上游引擎生成路径；DeepMIMO不替代该引擎的传播物理。","outputs":["场景标识","逐频RT路径源及生成参数"],"controls":["研究者固定：源引擎版本、载频、场景尺度、交互开关与路径上限"],"checks":["检查O1等场景名与v4等软件代际分开记录","检查路径来源是同一地图、独立RT还是后处理改频"],"evidenceStatus":"已确认","sourceIds":["source-001","source-003","source-004"]},{"title":"转换成统一路径矩阵","inputs":["上游逐路径角度、时延、功率、相位","可用的交互点、几何与材料"],"operation":"转换器把来源数据组织成Tx/Rx集合对应的MAT矩阵，配合objects.json和params.json保存场景信息；可选字段由源引擎决定。","outputs":["位置与路径MAT矩阵","场景/材料/RT参数JSON"],"controls":["研究者固定：转换器版本、坐标和角度约定、路径裁剪规则"],"checks":["核对角度单位、时延单位、功率单位","区分缺失字段与零值，不补造交互类型"],"evidenceStatus":"已确认","sourceIds":["source-003","source-133"]},{"title":"读取并筛选用户/链路","inputs":["统一格式场景目录","Tx/Rx集合与候选用户索引"],"operation":"dm.load按数据组织返回Dataset、MacroDataset或DynamicDataset；按任务选择发射站、用户区域和有效路径。","outputs":["选定链路的路径数组","原始用户/场景索引映射"],"controls":["研究者固定：区域、Tx/Rx集合、保留路径数、空路径保留策略"],"checks":["记录筛除的无路径用户；outage研究不能静默删除","在切分前保留空间位置，避免近邻网格随机泄漏"],"evidenceStatus":"已确认","sourceIds":["source-005","source-006"]},{"title":"定义阵列与频域采样","inputs":["AoA/AoD、相位、功率和时延","Tx/Rx阵列及ChannelParameters"],"operation":"配置阵元数、位置/间距、方向图和OFDM频率采样，再调用compute_channels；不同配置可由同一路径库生成不同MIMO张量。","outputs":["复数CSI：用户×Rx阵元×Tx阵元×路径或子载波","完整信道生成参数"],"controls":["研究者固定：阵列坐标、归一化、带宽/子载波、路径上限","近场任务需核验使用的阵列生成方式，不默认角度响应等同逐阵元RT"],"checks":["核对输出各轴和复数约定","用单径和单位范数码本检查功率/相位"],"evidenceStatus":"已确认","sourceIds":["source-006","source-007","source-008"]},{"title":"为动态快照赋予时间","inputs":["逐快照RT场景或明确的移动采样规则","均匀间隔或时间戳序列"],"operation":"动态数据显式设置timestamps后，可计算节点/物体速度与Doppler；静态位置网格本身没有时间轴。","outputs":["时间对齐的信道序列","速度/Doppler及快照索引"],"controls":["研究者固定：快照间隔、轨迹顺序、对象身份、移动机制","不需要时跳过此阶段，保留为静态任务"],"checks":["验证时间单调和对象身份连续","把场景几何变化与静态场景内UE采样分开说明"],"evidenceStatus":"已确认","sourceIds":["source-132","source-133"]},{"title":"生成任务标签并封装","inputs":["复数CSI","码本、功率、噪声、RF-chain与调度规则"],"operation":"研究者计算beam response、Top-K或多用户SINR/兼容性，再按站点或轨迹封装输入与标签。这一层不由DeepMIMO场景名唯一确定。","outputs":["研究者生成的beam/调度标签","按区域/轨迹划分的数据与下游utility"],"controls":["研究者固定：码本单位范数、H或Hᴴ约定、功率分配、候选用户集"],"checks":["复算小样本oracle与干扰toy case","训练归一化只拟合训练集，保留空链路和失败标签策略"],"evidenceStatus":"推断","sourceIds":["source-006","source-007"]}],"nativeOutputs":["路径参数与位置矩阵（已下载场景提供）","CSI及统计量（运行生成器后获得）"],"derivedOutputs":["码本功率与Top-K标签","轨迹预测窗口","多用户SINR、兼容图和调度utility"],"reproductionNotes":["软件版本、具体场景版本和RT来源分别固定；不能仅写“使用DeepMIMO”。","controls/checks中标“研究者”的内容是复现设计，不是官方默认。","本图谱已验证4.0.5参数实例化与教程代码；没有下载全量场景或重跑其上游RT。"],"controlScope":"controls和checks是复现/使用时需要固定或验证的项目；其中明确标注论文配置的数值来自原来源，其余不代表官方默认。"},"productionFacts":{"entryInput":["核心入口是已求出的RT路径库：各Tx/Rx链路的位置、逐路径功率、相位、时延、AoA/AoD，以及来源允许的交互点/场景元数据。","随后由ChannelParameters选择阵列、路径数、OFDM带宽/子载波和Doppler时间采样。DeepMIMO也有上游RT调用与转换组件，但Dataset.compute_channels本身从路径生成信道。"],"physicalModel":["上游Wireless InSite、Sionna RT等决定哪些路径存在及其传播增益；DeepMIMO统一数据组织，沿用这些路径结果。","核验的v4.0.5标准生成器以AoA/AoD构造平面波阵列响应，再相干叠加路径。是否已有逐阵元RT信息与是否使用该信息，需要按实际生成接口分别确认。"],"channelFormation":["compute_channels读取路径功率、相位、时延，乘Tx/Rx阵列响应；频域分支再乘子载波时延相位并沿路径求和。","启用Doppler时，对各路径追加exp(j2πfD·t)相位。显式times单位为秒；num_timestamps按OFDM的1/Δf间隔生成时间点。","单时刻频域输出为[用户,Rx阵元,Tx阵元,子载波]；多时刻追加时间轴。"],"frequencyChange":["只改OFDM带宽、子载波数或采样索引：可复用原载频的路径库，重算基带频域响应；适用范围由原路径模型的带宽假设决定。","改RF中心频率：应取得目标频率的路径响应，或回到上游引擎重算频率相关材料、传播增益/相位和必要的路径搜索，然后重新转换并生成CSI。","v4.0.5的ChannelParameters没有载频项。只改rt_params.frequency会影响读取该值的计算（例如Doppler波长），不会自动重算已保存的路径功率与相位。"],"arrayChange":["在标准角度响应模型内，只改阵元数、spacing、旋转或支持的方向图：保留RT路径，重算阵列响应和CSI。","spacing按波长归一化，代码使用kd=2π·spacing。比较不同载频时，需要明确固定的是0.5λ间距还是固定米制孔径。","若研究阵元间可见性差异、球面波或大孔径近场，单纯增加该生成器的阵元数不够；需使用匹配的逐阵元/球面波路径模型并重新验证。","使用步骤：只换码本且保留完整复CSI时，按同一信道约定重算码本响应和标签即可；只保留Top-K功率时无法补出任意新波束的响应。"],"timeMeaning":["静态Dataset的不同用户位置是空间采样，时间顺序由所选移动轨迹和时间戳定义。","固定路径加Doppler是在既有功率、角度和时延上的局部相位演化；不会产生新反射路径或遮挡切换。","DynamicDataset保存逐场景快照；set_timestamps根据相邻位置差估计速度。官方动态RT示例对每个位置重新调用Sionna PathSolver再导出。已有静态路径网格可用于明确规定的轨迹采样。"],"blockageChange":["改变车辆/建筑/人体位置并要求其改变可见路径：回到上游几何和RT层，重新求受影响快照的路径，再转换到DeepMIMO。","直接修改对象velocity或增加时间采样只生成既有路径的Doppler相位，不会执行碰撞、遮挡测试或路径出生/消失。","人为删除路径或缩放功率可以构造明确标注的扰动模型；它与重新求解移动遮挡的物理含义不同。"],"costDrivers":["已有路径时，主要成本来自用户/链路数、保留路径数、Tx/Rx阵元数、子载波数和时间点数。输出尺寸按U×Nr×Nt×K×T增长。","v4.0.5按用户分块，并分开保存Tx/Rx阵列响应以控制中间内存。","重新生成频段或动态几何的成本由上游RT决定；重新采样OFDM和更换角度响应阵列通常只触发后处理。这里未测量实际耗时。"],"artifacts":["保留来源场景/频段、RT版本与配置、统一路径矩阵、params.json及几何/材料元数据。","派生CSI需附ChannelParameters、维度、归一化、用户索引；动态数据还需快照顺序、对象身份和时间戳。","波束标签、SINR和调度效用由后续码本/功率/噪声/协议定义产生，不能只用场景名描述。"],"commonMistake":["把“换子载波频率”“换RF载频”和“取得新频段传播数据”混为一项操作。","把空间网格、固定路径Doppler序列和重新追踪移动遮挡的快照都称为同一种动态信道。","在平面波合成器里增加阵元数后，直接声称验证了逐阵元近场传播。"],"sourceIds":["source-003","source-006","source-007","source-008","source-v13-dm-dynamic"]}},{"id":"sionna-rt","name":"Sionna RT","kind":"射线追踪和物理仿真引擎","origin":"射线追踪","year":2023,"institution":"NVIDIA","summary":"独立可配置的无线 RT 引擎；与 Sionna PHY 链路仿真和 Sionna SYS 系统级仿真分别登记。场景与生成配置才定义具体数据。","version":"sionna-rt v2.2.0","frequency":"由 scene.frequency 与材料模型适用范围约束；不是固定频段数据集","scale":"由几何复杂度、设备、射线采样和输出选择决定","license":"Apache-2.0（代码）；场景资源另核验","access":"公开Python包与源码；本项目已实跑2.2.0内置街谷CFR及自定义几何扫描点云。","fields":{"csi":"需额外仿真","paths":"需额外仿真","position":"需额外仿真","beam":"需额外仿真","rgb":"需额外仿真","lidar":"需额外仿真","radar":"需额外仿真","time":"需额外仿真","multiuser":"需额外仿真","multibs":"需额外仿真","crossfreq":"需额外仿真"},"fieldNotes":{"general":"这些是配置后生成能力，不是下载即有的数据字段。渲染图片不自动成为已校准、多传感器同步数据。","lidar":"可通过Scene.mi_scene和Mitsuba ray_intersect实现同场景几何扫描点云；需定义传感器位姿、扫描方向、量程与采样时刻。已跑通内置几何样例；这不是PathSolver输出RF路径，也不自动包含真实LiDAR强度、雨雾和漏检模型。"},"tasks":[{"name":"Beamforming / Channel Estimation","status":"条件支持","reason":"生成路径/信道后补充码本、导频、噪声和接收机模型。"},{"name":"Sim2Real / Digital Twin","status":"条件支持","reason":"可做 site-specific 模拟；需要现场材料/天线/几何校准和独立 OTA 验证才支撑孪生精度。"},{"name":"ISAC / Sensing","status":"条件支持","reason":"v2.2.0 新增 RCS target 与 RCSSolver；须配置目标散射模型及感知处理和资源成本。"},{"name":"Cross-Frequency Generalisation","status":"条件支持","reason":"固定几何同时逐频评估材料与方向图，记录路径搜索与共享路径策略。"},{"name":"Long-Horizon Environment Forecasting","status":"条件支持","reason":"必须额外提供动态物体行为和场景演化；引擎不学习真实交通/天气规律。"}],"provenance":["场景 mesh + 材料 + 天线 + 设备位姿","显式 PathSolver / RadioMapSolver / RCSSolver 配置","路径搜索与电磁系数计算","CIR/CFR 与无线地图","阵列合成、基带接收或感知处理","派生决策标签"],"physics":["已确认：1.0 曾重写为 Dr.Jit/Mitsuba 架构，compute_paths 改为 PathSolver，功能历史并非单调增加。","已确认：1.0 release 明确暂缺旧版 diffraction/RIS，不能把 0.19 示例直接当作 1.0 示例。","已确认：2.1 release 加入 deterministic path generation 和 radio-map diffraction；2.2 加入 RCS sensing 模块。","推断：默认参数、有限采样和材料误差会影响路径集合，应做采样/深度收敛诊断。","未知：具体实验的传播机制需读固定 tag 的 solver 参数与运行配置，不能由引擎名判断。","文献支持：2023原论文区分逐阵元RT与synthetic_array平面波后处理；材料学习实验以RT生成400条CIR作为目标，只含镜面反射，并非实测校准结果。","已确认：Sionna RT 2.2 PathSolver支持一阶edge/wedge绕射，diffraction默认False；支持薄片透射；synthetic_array默认True，逐阵元精确追踪需明确关闭并校验。","已确认：可用底层Mitsuba几何求交自定义LiDAR式首命中扫描；Multimodal-NF公开实现则使用Open3D cast_rays，同一几何可由不同传感器仿真管线处理。"],"risks":["软件更新会改变 API、后端和默认行为；教程与环境必须一起锁定。","同地图两种材料配置的比较不等同真实跨域部署。","生成信道通常不含真实硬件相位漂移/校准误差；需另加模型或实测。"],"history":["2023：Sionna 0.14 集成 RT。","2025-03：Sionna 1.0 重写 RT 并改为独立模块。","2026：RT 2.1 支持 Metal 与新版求解行为；2.2 新增 RCS。"],"tutorial":["独立环境安装固定 sionna-rt 版本，记录 Mitsuba/Dr.Jit 和 CPU/GPU 后端。","载入最小场景；设置频率、材料、Tx/Rx 阵列与位姿。","显式配置传播开关、max_depth、采样与 seed，再执行 PathSolver。","输出 CIR/CFR，检查空路径、时延单位、阵列维度与绝对/归一化功率。","先比较单径自由空间解析值，再增加反射面或 blocker；所有运行状态如实标注。"],"papers":[],"coverageNote":"已核验下列来源的相关段落；未进行全量文件审计或系统性论文使用计数。","checkedAt":"2026-11-05","organization":"NVIDIA / NVlabs","format":"Python软件；场景XML与mesh资产，运行生成Paths、CIR/CFR及radio-map数组；输出可经API转换为NumPy等数组，不是固定数据下载包。","sourceIds":["source-009","source-010","source-011","source-012","source-013","source-134","source-153","source-154","source-155","source-156","source-157","source-158","source-rt-pipeline-scenebaker","source-rt-pipeline-mitsuba-blender","source-v13-sionna-solver","source-v13-sionna-paths","source-v13-sionna-scene-frequency","source-v13-sionna-array","source-v13-sionna-object"],"productionPipeline":{"scope":"Sionna RT 2.2.0；射频、RGB、几何扫描与RCS处理是共享场景上的不同分支。","summary":"先把几何、材料和无线设备固定，再执行相应求解器。路径可转CIR/CFR；RGB和LiDAR式点云需要独立传感器配置，不能从RF路径自动获得。","stages":[{"title":"建模并导入场景","inputs":["Mitsuba XML与mesh，或Sionna内置场景","世界坐标和场景尺度"],"operation":"用load_scene读取几何；外部场景可经Blender/Mitsuba导出或SceneBaker生成后导入。Sionna场景包含对象及其材料关联。","outputs":["Scene对象","可检查的网格、对象与局部坐标"],"controls":["研究者固定：米制尺度、对象位置/旋转、mesh简化、是否合并同材质对象"],"checks":["检查Tx/Rx未落入实体内部","核对高度、法线和导入后可见几何；渲染成功不等同传播正确"],"evidenceStatus":"已确认","sourceIds":["source-154","source-rt-pipeline-scenebaker","source-rt-pipeline-mitsuba-blender"]},{"title":"设置RF材料和设备","inputs":["场景对象","载频、介电/导电与散射参数","Tx/Rx阵列、极化和位姿"],"operation":"给对象分配radio material，并设置频率、阵列方向图、极化与发射/接收机。可视化材质不能自动当作经校准RF材料。","outputs":["完整无线Scene配置"],"controls":["研究者固定：载频、材料模型适用范围、阵元间距、天线朝向和功率"],"checks":["先以自由空间或单反射面检查几何和单位","记录材料来源是默认参数、测量标定还是假设"],"evidenceStatus":"已确认","sourceIds":["source-013","source-154"]},{"title":"求解传播路径","inputs":["已配置Scene","PathSolver及显式传播开关"],"operation":"PathSolver搜索并求解传播路径。2.2支持一阶edge/wedge绕射和薄片透射；绕射默认关闭，synthetic_array默认开启。","outputs":["Paths：有效路径、增益、时延和交互信息"],"controls":["研究者显式设置：LoS、镜面/漫反射、绕射、透射、max_depth、采样和seed","研究者选择synthetic_array或逐阵元追踪"],"checks":["检查空路径、路径数量和求解收敛","近场/大孔径结论核验逐阵元传播与远场阵列近似差异"],"evidenceStatus":"已确认","sourceIds":["source-134"]},{"title":"生成CIR/CFR或覆盖图","inputs":["Paths及所需频率/时间采样","或独立RadioMapSolver配置"],"operation":"通过paths.cir/cfr生成信道；覆盖图由对应求解器和接收网格计算。需要记录绝对/归一化时延及输出归一化选择。","outputs":["复数CIR/CFR张量","指定网格和指标的radio map"],"controls":["研究者固定：子载波频率偏移、时间采样、normalize_delays、阵列轴","覆盖图另固定网格、天线与指标"],"checks":["检查有限非零输出、CFR轴顺序和量纲","对简单路径做频域相位随频率变化的核对"],"evidenceStatus":"已确认","sourceIds":["source-134","source-154"]},{"title":"共享几何生成RGB或扫描点云","inputs":["同一时刻Scene","相机或扫描器位姿、视场和方向集合"],"operation":"RGB走相机渲染；几何扫描可对Scene.mi_scene构造射线，用Mitsuba ray_intersect返回首命中位置。两者均需单独设置传感器与时间。","outputs":["合成RGB图像","带有效掩码和射线索引的几何扫描点云"],"controls":["研究者固定：相机内外参、曝光/渲染样本、扫描束角、量程、采样时刻"],"checks":["验证图像/点云/信道使用同一对象状态与坐标","真实LiDAR强度、漏检、噪声和天气响应需另建模型"],"evidenceStatus":"已确认","sourceIds":["source-153","source-154","source-155"]},{"title":"动态或RCS感知分支","inputs":["逐时刻设备/对象状态","可选RCS target和RCSSolver配置"],"operation":"研究者更新轨迹或对象状态并重新求解；RCS分支需给定目标散射模型，再由感知处理构造回波/检测任务。帧分配和感知成本属于系统设计。","outputs":["时序路径/信道","条件成立时的目标相关感知响应"],"controls":["研究者固定：状态更新时间、目标模型、波形/处理窗口、通信与感知资源"],"checks":["避免把仅对静态网格重采样称为动态blocker仿真","检查目标与背景处理、绝对时延和成本口径"],"evidenceStatus":"已确认","sourceIds":["source-009","source-134"]},{"title":"导出并验证任务数据","inputs":["各分支输出与配置","波束/接收机/调度或感知任务定义"],"operation":"研究者保存原始生成量及派生标签，区分全信息仿真真值与决策时可观测量，并在简化场景通过后扩展规模。","outputs":["可重建的合成样本","标签、有效性与划分元数据"],"controls":["研究者固定：导出dtype、轴、seed、后端与版本","研究者按几何/轨迹/环境划分"],"checks":["检查未购买当前模态和未来信息不进入策略","将渲染/合成点云与真实OTA/传感器观测分别标注"],"evidenceStatus":"推断","sourceIds":["source-013","source-154"]}],"nativeOutputs":["Paths与生成的CIR/CFR","RadioMapSolver输出","配置后生成的RGB与RCS结果"],"derivedOutputs":["自定义几何扫描点云","beam/调度标签","感知检测与轨迹、净goodput"],"reproductionNotes":["已在Sionna2.2.0/Mitsuba3.9.1/DrJit1.5.0 Metal实跑内置街谷CFR及4096射线几何扫描；这不验证外部城市场景的物理精度。","Multimodal-NF公开生成器的点云分支使用Open3D cast_rays，不能把其实现误写成Sionna原生LiDAR接口。","本卡给出可组成的生产流程；RGB、点云、RCS并非每次RF仿真自动输出。"],"controlScope":"controls和checks是复现/使用时需要固定或验证的项目；其中明确标注论文配置的数值来自原来源，其余不代表官方默认。"},"productionFacts":{"entryInput":["输入是3D mesh/XML场景、RF材料、Tx/Rx位置与姿态、天线方向图/极化/阵列，以及求解器传播开关、深度和采样预算。","场景内同一几何还可供RGB或几何扫描使用；这些传感器各有独立配置和输出分支。"],"physicalModel":["Sionna RT 2.2.0从几何搜索传播路径，再计算电磁场系数；支持LoS、镜面/漫反射、薄片透射以及一阶edge/wedge绕射，具体机制由开关决定。","薄片透射模型按材料厚度修正场，射线穿过表面时不作角度偏折。synthetic_array=True将每个设备作为单个几何端点，再合成阵列相位。"],"channelFormation":["PathSolver调用顺序为候选路径生成→image method求解→field calculator计算系数/时延→构造Paths。","Paths.cir生成基带CIR；Paths.cfr在该CIR上按指定基带频偏求和。Paths保留求解时的频率、阵列和路径信息。","num_time_steps与sampling_frequency追加基于各路径Doppler的时间演化；波形、噪声和接收机处理属于后续链路层。"],"frequencyChange":["只改同一载频周围的子载波采样：复用已求得Paths，重新调用cfr；该步骤没有重新评估RF材料。","改scene.frequency：setter会更新所有radio materials的频率相关参数。随后重跑PathSolver，重算波长相关场系数及新Paths；直接使用旧Paths仍对应原求解频率。","几何mesh可复用。2.2.0公开PathSolver调用会再次执行候选、image method和场计算；不能把内部步骤分层描述成已公开的跨频缓存复用API。","PlanarArray间距与normalized_positions以λ计。改载频而保持这些值，会改变实际米制孔径；固定物理阵列时需同步换算归一化坐标。"],"arrayChange":["synthetic_array=True：路径几何以设备中心为端点，阵元通过相位合成；更换阵列后应生成新的Paths，公开调用也会重跑求解。","synthetic_array=False：每个阵元位置成为追踪端点。改变阵元位置/数量或设备位姿，需要重新求相应路径与场系数。","只改变已生成同一阵列信道上的数字/模拟波束权重，且不改变天线方向图或几何，可在CSI上做后处理。","使用步骤：只换码本且保留完整复CSI时，按同一信道约定重算码本响应和标签即可；只保留Top-K功率时无法补出任意新波束的响应。"],"timeMeaning":["一次PathSolver对应当前几何状态。cir/cfr的Doppler时间轴在这组路径上施加相位演化，时延和可见性不随该时间轴重新追踪。","对象velocity用于Doppler；position/orientation才修改几何。长时间运动或路径拓扑变化需更新场景状态并逐快照求解。","时间步、轨迹、动态对象行为和多传感器同步规则由数据生产者定义。"],"blockageChange":["移动或增加遮挡体后，更新其position/orientation/mesh，重跑PathSolver以检查遮挡、新路径及对应场系数。","只设置对象velocity不会自动沿时间推进对象，也不会使LoS随车辆经过而开关。","若保持几何只改材料，至少需要重新评估场系数；本版本公开调用仍通过PathSolver完成。"],"costDrivers":["几何复杂度、Tx/Rx端点数、samples_per_src、max_depth、允许的交互类型和max_num_paths_per_src影响路径求解。","关闭synthetic_array会把端点扩展到各阵元；大阵列的几何追踪和存储成本因此上升。","逐帧移动遮挡增加场景更新与RT次数；同一Paths上增加子载波或Doppler采样主要增加CIR/CFR计算与张量存储。","硬件后端、JIT编译和批处理也影响耗时；本轮仅核验计算步骤，未给出速度排名。"],"artifacts":["保留XML/mesh、RF材料、天线/位姿、Sionna/Mitsuba/DrJit版本、求解器参数和随机设置。","保存路径有效性、交互点/类型、时延、系数、角度与Doppler，以及CIR/CFR采样、归一化和轴定义。","动态数据保存每帧对象状态和时间；导出到其他格式时校验路径数、功率、相位约定及传播开关元数据。"],"commonMistake":["把cfr的frequencies参数当作重新设置RF载频，或只改scene.frequency后继续使用旧Paths。","设置velocity后，认为几何遮挡已随时间移动。","以默认synthetic_array=True的结果直接代表逐阵元球面波/可见性变化。"],"sourceIds":["source-v13-sionna-solver","source-v13-sionna-paths","source-v13-sionna-scene-frequency","source-v13-sionna-array","source-v13-sionna-object","source-012","source-154"]}},{"id":"wireless-insite","name":"Remcom Wireless InSite","kind":"射线追踪和物理仿真引擎","origin":"射线追踪","year":null,"institution":"Remcom","summary":"商业传播预测软件，包含 X3D、快速射线与经验模型；也是多个公开无线数据集的上游。购买软件不等于获得同一公开场景的原始项目。","version":"公开核实 Release 4.0（2025-05-14）；未核实后续补丁号","frequency":"X3D 产品页标示最高 100 GHz；需检查具体材料/模型范围","scale":"按工程配置；无固定样本量或统一下载大小","license":"商业专有许可；不同产品版本功能有区别","access":"厂商授权；现成下游数据的许可独立","fields":{"csi":"需额外仿真","paths":"需额外仿真","position":"需额外仿真","beam":"需额外仿真","rgb":"不支持","lidar":"不支持","radar":"未知","time":"需额外仿真","multiuser":"需额外仿真","multibs":"需额外仿真","crossfreq":"需额外仿真"},"tasks":[{"name":"Site-specific Channel / Beamforming","status":"条件支持","reason":"配置 X3D、天线、材料与路径输出；不同 edition 不同能力。"},{"name":"Blockage Prediction","status":"条件支持","reason":"4.0 支持时间化对象运动，需生成连续场景而非仅移动 UE。"},{"name":"Cross-Frequency Generalisation","status":"条件支持","reason":"支持频率相关天线与材料；须保存逐频配置和扫频/路径共享方式。"}],"provenance":["CAD/GIS 几何与材料","选择 X3D 或其他传播模型","路径搜索与场强/复冲激响应","MIMO/波束与链路后处理","按数据集格式导出"],"physics":["已确认：X3D 包含反射、透射、绕射、大气吸收；漫散射受产品版别/配置约束。","已确认：支持实测或仿真的天线方向图及多种漫散射模型。","推断：引擎支持某机制不说明 2019 年 O1 生成时已启用。"],"risks":["商业引擎版本/参数缺失会限制严格复现。","必须区分厂商能力说明与外部测量验证。"],"history":["2025-05-14：4.0 发布，新增时间化移动平台、宽带 RT 和相关材料/天线功能。"],"tutorial":["先确认软件 editi segment合并方式、存储轴"],"checks":["检查分段边界是否出现相位/功率跳变","从系数重算SF、K-factor和delay spread对照builder"],"evidenceStatus":"已确认","sourceIds":["source-rt-pipeline-qd07","source-rt-pipeline-qd08"]},{"title":"频域与多频生成","inputs":["qd_channel","带宽与频点数，或多载频向量"],"operation":"fr把路径系数/时延投影到频域；多频教程通过共享布局及相关传播参数、逐频天线和损耗生成配对输出。","outputs":["CFR数组","按载频索引的相关信道"],"controls":["研究者固定：带宽、频点数、每频段阵列和参数耦合","官方多频教程的共同/变化参数应逐项记录"],"checks":["不要把频率索引误当时间或独立随机样本","区分模型设定的跨频相关与实测跨频配对"],"evidenceStatus":"已确认","sourceIds":["source-rt-pipeline-qd08","source-rt-pipeline-qd11"]},{"title":"构造任务样本和验证统计","inputs":["CIR/CFR及轨迹元数据","波束/调度或反馈任务接口"],"operation":"研究者按任务生成码本响应、CSI压缩目标或未来窗口，保留原始尺度与轨迹分组。","outputs":["任务张量与标签","统计一致性及下游utility结果"],"controls":["研究者固定：归一化、角延迟截断、序列窗口和训练/测试布局"],"checks":["不要用被归一化后的反馈张量直接报告绝对吞吐","同轨迹相邻窗口按组切分"],"evidenceStatus":"推断","sourceIds":["source-rt-pipeline-qd07","source-rt-pipeline-qd08"]}],"nativeOutputs":["模型生成的qd_channel coeff/delay","布局、轨迹与builder参数"],"derivedOutputs":["CFR、PDP、beam与CSI-feedback样本","多用户/多频任务数据"],"reproductionNotes":["已读官方教程源代码，未在本轮执行MATLAB/Octave生成。","教程中为演示关闭pathloss、减少簇数或改XPR的选项不能直接照搬为默认物理系统。","代码许可与发布数据许可分别确认；共享随机模型不证明真实场景校准。"],"controlScope":"controls和checks是复现/使用时需要固定或验证的项目；其中明确标注论文配置的数值来自原来源，其余不代表官方默认。"},"productionFacts":{"entryInput":["常规输入为场景统计参数集、BS/终端布局、qd_track轨迹与分段、qd_arrayant阵列及随机状态；生成器据此产生簇和传播参数。","2.8的site-specific扩展还可输入3D mesh，辅助判定LOS/NLOS、室内状态和轨迹场景分段。"],"physicalModel":["核心是几何随机信道模型：相关大尺度参数→簇/子径时延、角度、功率、极化与散射位置→阵列信道。随机簇通常不是一张实景地图中的已追踪反射面。","drifting按散射几何更新运动中的路径时延、角度和相位；use_3GPP_baseline分支使用平面波近似。","官方site-specific教程通过mesh判传播状态，再调用对应统计场景；diff_trans的示例用于LOS/NLOS功率加权。它的作用层次与完整多径RT不同。"],"channelFormation":["layout.init_builder建立生成器；gen_parameters产生相关LSP、SSF和散射位置；get_channels结合阵列方向图、几何与轨迹生成coeff/delay。","分段信道经merge处理过渡；qd_channel.fr再把系数和时延投影到指定基带频率。","gen_parameters的usage可控制复用随机场、LSP、SSF或仅补缺参数；用于受控对比时应保留同一传播实现，避免每次改阵列都重抽随机环境。"],"frequencyChange":["只改fr的bandwidth/carriers：复用已有coeff/delay，重新进行基带频域投影；没有改变传播场景的中心频率。","改中心频率：重新生成匹配目标频段的统计传播参数、路径损耗、阵列响应和信道系数；同时检查轨迹的空间采样密度。","官方多频教程用center_frequency向量在共同布局上生成相关输出。LOS/NLOS、节点位置、簇时延/角度等共享；路径损耗、路径功率、天线、扩展统计量、K-factor和XPR按频率变化。","这是一种显式设定的跨频联合模型。独立运行两个频段与共享模型生成的配对数据，应分别标注。"],"arrayChange":["固定布局、频率和已生成的LSP/SSF/散射位置时，更新builder中的Tx/Rx阵列，再运行get_channels和fr即可得到新阵列的信道。","get_channels重新计算方向图、极化、阵元相位，以及drifting模式下的逐阵元几何时延；不需要为单纯阵列对照重新随机生成簇。","qd_arrayant.element_position以米为单位。改变center_frequency时，若研究目标是固定λ间距，应重新构造或调整阵元位置；固定米制孔径则保留实际位置并更换适用的方向图。","使用步骤：只换码本且保留完整复CSI时，按同一信道约定重算码本响应和标签即可；只保留Top-K功率时无法补出任意新波束的响应。"],"timeMeaning":["轨迹首先定义空间位置和分段；速度/运动profile将位置映射到时间，生成空间连续的信道。","drifting负责段内演化，merge负责相邻场景/簇的过渡。它表达模型设定的运动和统计非平稳性。","仅改同一路径的速度profile，在原信道空间采样足够时可按官方教程用interpolate_movement和channel.interpolate重新映射时间；改变轨迹形状、场景分段或传播状态则需重算相关信道。"],"blockageChange":["常规统计模型中，遮挡变化需要明确更新LOS/NLOS场景序列、簇/功率或另设遮挡模型，再生成并合并信道；终端移动本身不等于仿真了一个独立移动blocker。","使用site-specific mesh时，几何变化后应重新进行intersect_mesh状态检测或diff_trans计算，并更新受影响轨迹的场景分段/信道。","若要求某辆车移动后产生的特定反射、绕射及路径出生/消失，需另接逐几何RT或经过验证的专门模型；仅靠该site-specific教程不能提供这些逐径真值。"],"costDrivers":["链路数、簇/子径数、阵元对数、轨迹快照数与频段数决定参数生成和系数合成工作量。","drifting、逐阵元时延及双端移动增加计算；轨迹空间采样越密，直接生成的快照越多。","在满足采样要求时，官方教程用稀一些的空间信道采样再插值以减少重复生成；FR阶段成本另随频点数增长。"],"artifacts":["保留simpar、场景参数及修改项、layout/track/segment、随机状态和阵列（含米制阵元坐标）。","受控实验宜保留builder中的实现参数，以及qd_channel coeff/delay、位置和时间映射；由fr生成的CFR还需附频点/带宽。","site-specific模式另保留mesh、LOS判定/分段规则；多频数据记录共享与逐频变化的参数。"],"commonMistake":["把随机簇坐标解释成真实城市的RT反射点，或把mesh辅助LOS分段等同完整站点多径追踪。","只改fr的频率网格就声称获得了另一RF频段的传播样本。","每次改阵列同时重抽LSP/SSF，使阵列差异与随机环境差异混在一起；或给独立drop加时间索引后称为连续移动。"],"sourceIds":["source-v13-qd-params","source-v13-qd-channels","source-v13-qd-array","source-v13-qd-fr","source-v13-qd-speed","source-v13-qd-site","source-rt-pipeline-qd08","source-rt-pipeline-qd11","source-rt-pipeline-qd13"]}},{"id":"nyusim","name":"NYUSIM","kind":"统计信道模型与生成器","origin":"实测参数化的统计模型","year":null,"institution":"NYU WIRELESS","summary":"由实测统计参数构建的随机信道仿真器。生成样本仍属合成数据；MATLAB、ns-3 与新 Python 实现需分开记录版本。","version":"MATLAB 4.0（官网更新说明 2023-03-06）；ns-3 1.0；Python 迁移已公告，发行号未核实","frequency":"0 sensefi","sourceIds":["source-117","source-118","source-119","source-152"],"locator":"具体页面/文件范围见各来源 readScope；尚未完成逐句原文定位"},{"id":"sensefi-risks-0","text":"同样叫 CSI，幅度、复 CFR、Doppler/BVP 的信息保真程度不同。","status":"推断","scope":"sensefi","sourceIds":["source-117","source-118","source-119","source-152"],"locator":"具体页面/文件范围见各来源 readScope；尚未完成逐句原文定位"},{"id":"sensefi-risks-1","text":"跨任务 HAR→HumanID 迁移不自动代表跨硬件或跨环境迁移。","status":"推断","scope":"sensefi","sourceIds":["source-117","source-118","source-119","source-152"],"locator":"具体页面/文件范围见各来源 readScope；尚未完成逐句原文定位"},{"id":"sensefi-risks-2","text":"本轮未确认 2024–2026 独立使用 SenseFi 协议的论文，因此不给近期精确使用量。","status":"推断","scope":"sensefi","sourceIds":["source-117","source-118","source-119","source-152"],"locator":"具体页面/文件范围见各来源 readScope；尚未完成逐句原文定位"},{"id":"sionna-lidar-geometry-scan","text":"可从Sionna场景的底层Mitsuba几何实现首命中扫描点云；Multimodal-NF公开生成器使用Open3D。几何扫描与真实LiDAR回波/噪声模型分开。","status":"已确认","scope":"Sionna RT 2.2.0 / 当前公开Multimodal-NF生成器","sourceIds":["source-009","source-010","source-011","source-012","source-013","source-134","source-153","source-154","source-155","source-156","source-157","source-158"],"locator":"Scene.mi_scene、ray_intersect、Multimodal-NF OSM_to_SionnaScene.ipynb；教程07运行检查。"}],"topics":[{"title":"DeepMIMO × Sionna RT × DeepSense：比较的对象是什么？","paragraphs":["DeepMIMO 组织场景路径、统一格式和信道后处理。Sionna RT 是重新计算场景传播的引擎。DeepSense 是按场景发布的实测观测。三者的输入输出接口不同，不能用一个名称代表所有物理配置。","经典 O1 应按其原始 Wireless InSite 设置核验，新场景则逐项记录来源引擎与配置。DeepMIMO 格式支持某种 interaction code，不说明所有历史 O1 文件已经包含这种机制。","Sionna 的传播能力随版本变化，场景材料和求解参数决定实际输出。平面波阵列后处理与逐天线追踪需要分开，近场 XL-MIMO 尤须检查球面波和阵列孔径条件。","DeepSense 的通信 beam power、雷达 IQ 和通信复数 CSI 是不同数据。即使都是 64 个数，也不能把接收功率向量用作任意数字预编码所需的阵列信道。","公平跨源比较优先选取共同可定义的决策目标，例如各自码本下相对 oracle 的波束增益损失；统一输入预算、时间跨度、标签协议和划分单位。原始分类准确率受码本大小、站点几何和标签分布影响。","跨 DeepMIMO 城市只证明相应场景协议下的跨城市泛化。共享路径的不同阵列配置属于同源后处理；与真实硬件部署、独立传播引擎验证需分别报告。"],"sourceIds":["source-001","source-002","source-003","source-004","source-005","source-006","source-007","source-008","source-132","source-133","source-009","source-010","source-011","source-012","source-013","source-134","source-055","source-056","source-057","source-058","source-059","source-060","source-127","source-128","source-138"]},{"id":"cross-frequency-realism","title":"跨频辅助：从同几何到真实配对","paragraphs":["研究3.5 GHz→28 GHz时，先定义预测对象：高频最优beam、beam-power向量、路径支持集和完整复数CSI需要不同观测。低频位置线索足以减少候选beam，并不意味着可以唯一恢复高频复相位。应分别报告决策收益与信道误差。","配对至少分四类：同步双频实测、可重复轨迹的分次实测、同地区不同campaign、共享几何的仿真。Vienna属于重复轨迹比较；Niigata的24/60 GHz属于同步双频，而其4.85 GHz采集是另一campaign。真实频率字段必须单独显示，不能把Sub-6/mmWave大类替代精确频率。 IMMERSE是2.6/27.1 GHz双连接功率轨迹，采样分辨率约1.5 ms；跨modem同步误差未报告。","同址基站只约束站点几何；阵列相位中心、朝向、极化、孔径、波束码本和硬件延迟仍可不同。共享环境中的路径可能具有不同的可见性与功率；Niigata明确区分双频共有簇和单频独有簇。这里不能假定两个频段总有相同最优beam。","RT跨频生成要保留每次追踪的引擎/版本、材料参数、路径搜索开关与采样预算。复用同一射线路径再改变阵列响应，检验的是给定路径支持下的外推；分别追踪两个频率可以改变路径权重或路径集合，但也引入采样差异。比较必须说明两种过程。","本次资源核验没有确认一个可直接下载、同时满足精确3.5/28 GHz、真实同步完整CSI、NLoS及未见BS划分的资源。这个结果是当前Atlas证据覆盖的边界，不是该类数据绝不存在。选型器应给出无精确匹配及逐项缺口，而非把近似数据自动推荐为满足。","公平实验先锁定样本pair_id和输入可用时间；同一位置/轨迹的两个频段必须进入同一split。隔离完整站点、轨迹或空间块，并设置有物理依据的guard distance；仅训练集估计归一化。高频标签、未来位置与未获取的当前传感模态不能进入输入。","先比较常用beam、位置/角度规则、persistence、低频可用信息基线和perfect-information oracle。主报告包含选中beam相对oracle功率损失、有限探测预算下的命中/失败与可验证的速率；缺少噪声或协议成本时不伪造net goodput。"],"sources":[{"title":"Vienna重复轨迹协议","url":"https://github.com/fpasic1/vienna-channel-sounding","type":"官方仓库","readScope":"README同步与重复测量段","status":"已确认","verification":"primary-section","checkedAt":"2026-11-05","fullMainTextRead":false},{"title":"Niigata双频测量","url":"https://radio.eng.niigata-u.ac.jp/datasets/mm-wave/","type":"官方文档","readScope":"门户正文与TVT方法交叉核验双频同步和联合聚类；扫描实现描述有冲突，未据门户确定论文扫描时长。","status":"已确认","verification":"primary-section","checkedAt":"2026-11-05","fullMainTextRead":false},{"title":"Niigata Sub-6 campaign","url":"https://radio.eng.niigata-u.ac.jp/datasets/sub-6ghz/","type":"官方文档","readScope":"单频公开范围与campaign参数","status":"文献支持","verification":"partial","checkedAt":"2026-11-05","fullMainTextRead":false},{"title":"IMMERSE 精确载频与观测接口","url":"https://comnets.etit.tu-dortmund.de/storages/cni-etit/r/Research/Publications/2024/Haferkamp_2024_Globecom/Haferkamp_GlobecomWkshps2024_AuthorsVersion.pdf","type":"原始论文","readScope":"Sec.III/Table I–II：2.6/27.1 GHz双连接RSRP，不是复数双频CSI。","status":"已确认","checkedAt":"2026-11-05","verification":"primary-section","fullMainTextRead":false}],"checklist":["精确载频、带宽和子载波是否匹配？","同址还是异址，阵列相位中心/朝向是否已记录？","配对来自同时采集、重复轨迹还是共享几何？","有时间戳及跨模态同步误差证据吗？","有完整复数CSI还是功率/beam标签？","两频分别追踪或共用路径集合？","LoS/NLoS和低频/高频独有路径如何标注？","同pair/trajectory/site是否严格同split？","预训练语料是否包含测试站点或邻近样本？","测试决策的码本、探测预算、噪声和时延是否一致？"],"sourceIds":["source-066","source-072","source-070","source-130"]},{"id":"sim2real","title":"真实数据、数字孪生与Sim2Real证据","paragraphs":["统计模型、地图RT、测量校准数字孪生和OTA测量解决不同问题。统计模型便于可控对照；RT保留站点几何；校准孪生用测量调整传播或硬件参数；OTA保留实际设备和环境误差。它们不能用一个“真实度分数”决定全部任务的优劣。","域差异应拆成传播机制、场景与材料、天线与频率、硬件校准、采集协议、标签和数据划分。DeepSense的beam功率与DICHASUS的复数CSI不只是噪声程度不同，它们是不同测量接口。公平迁移需要先定义共同可比较的决策目标。","先校准物理接口，再做模型迁移。统一频率/单位/坐标、阵列朝向、极化和码本，保留原始增益尺度；重新采样或reshape不能自动消除物理差异。方向归一化可能适合表示学习，但评估功率与速率时必须保留真实尺度。","Domain randomization只在明确的不确定参数上取样，例如材料、电磁损耗、阵列误差、坐标/时钟扰动。它是否提高迁移应由独立测量检验，不能以仿真训练集的更高多样性代替部署证据。","Few-shot、self-supervised和test-time adaptation必须声明能访问的目标域数据。以过去无标签数据更新模型，与利用整个测试集统计量进行转导适配是不同协议；在线任务不得读取未来样本。目标域校准数据、适配数据与最终测试数据应分开。","校准数字孪生应展示校准前后和留出测量点表现，同时比较无需复杂模型的基线。Niigata门户将双频实测与site-specific建模相连，但本轮只核验了数据页面与论文书目信息，不能据此宣称其具体Sim2Real提升已被本Atlas复现。","现有多模态序列常缺未测候选动作的反事实收益、同步多UE干扰和季节性漂移。需要新实验时，应先列决策所需最小变量：共享场景中的多个链路、所有相关动作的受控探测、时间与能量成本、重复日期和可追溯校准。独立UAV相机帧不能填补真实多目标同步场景。"],"sources":[{"title":"DICHASUS测量接口与同步","url":"https://dichasus.inue.uni-stuttgart.de/","type":"官方文档","readScope":"OTA同步和CSI概述","status":"已确认","verification":"primary-section","checkedAt":"2026-11-05","fullMainTextRead":false},{"title":"DeepSense硬件和场景接口","url":"https://deepsense6g.net/data-collection","type":"官方文档","readScope":"官方公开前端JS中的Testbed1传感器与输出已直接读取","status":"已确认","verification":"primary-section","checkedAt":"2026-11-05","fullMainTextRead":false},{"title":"LuViRA后处理与同步失败记录","url":"https://github.com/ilaydayaman/LuViRA_Dataset","type":"官方仓库","readScope":"README全文已直接读取","status":"已确认","verification":"full-document","checkedAt":"2026-11-05","fullMainTextRead":false},{"title":"Niigata测量校准","url":"https://radio.eng.niigata-u.ac.jp/datasets/mm-wave/","type":"官方文档","readScope":"OTA校准与CTF/MPC后处理段","status":"已确认","verification":"primary-section","checkedAt":"2026-11-05","fullMainTextRead":false},{"title":"LIVE-RIS动作与测量限制","url":"https://arxiv.org/html/2609.34993v1","type":"原始论文","readScope":"VNA/time-gating测量段","status":"已确认","verification":"primary-section","checkedAt":"2026-11-05","fullMainTextRead":false}],"sourceIds":["source-061","source-056","source-077","source-072","source-091"]},{"title":"无线基础模型：训练血缘比模型名字更重要","paragraphs":["LWM 与 ContraWiMAE 主要以 DeepMIMO 派生信道构造训练数据；WiFo 的 D1–D19 来源是 QuaDRiGa。LH–CSI 汇合多种统计、RT 与实测来源，CFM-Bench 则是下游评测集合。将五个名字计成五套独立传播真值会误判数据多样性。Atlas 将模型、语料、场景、生成器与 Benchmark 作为不同实体，并保留来源关系。","比较规模时先统一计量单位：CSI point、信道矩阵、时间窗口、独立轨迹、城市和独立测量会话不能混算。LH–CSI 的 116 亿 points 不应与 ContraWiMAE 的 250 万信道样本直接画同轴规模柱图。","输入适配应保存频率网格、阵列位置/朝向、极化、时间间隔、幅度标度、复数表示和有效性掩码。补零可以解决张量形状，不能创造缺失天线或带宽。天线维度插值或图像式旋转需要物理依据；随机排列阵元只有在同步更新阵列几何时才保持问题定义。后两项为方法学推断，应以任务回测验证。","增强应与观测模型一致。AWGN 注入可检验噪声鲁棒性，但不能替代真实相位漂移、非线性、时钟偏差或动态路径消失。全局相位旋转对仅依赖功率的任务可保持标签，却可能改变相干预测的训练目标；所有增强都应声明不变量。","公平评测先查上游重叠，再分开报告同站点新样本、未见站点、未见城市、未见引擎、未见硬件和真实 OTA。CFM-Bench 禁止所有官方 splits 用于基础模型预训练；这一规则也要求避免从上游下载同一测试单元后重新纳入预训练。","开放性按资产判定。WiFo-2 论文与仓库显示分阶段发布：论文的完整 LH–CSI、公开评估子集、模型权重、训练代码和比赛受限数据具有不同状态。网站应同时展示论文描述规模和已核验可得资产，避免把一个 GitHub 链接渲染成“完整开放”。"],"sources":[{"title":"LWM 训练来源","url":"https://arxiv.org/html/2411.08872v2","type":"原论文","readScope":"全文主文（HTML I–X、公式、表格、图注及参考文献完整覆盖；图像未逐图目检）","status":"已确认","checkedAt":"2026-11-05","fullMainTextRead":true},{"title":"WiFo 数据表","url":"https://arxiv.org/html/2412.08908v2","type":"原论文","readScope":"4.1","status":"已确认","checkedAt":"2026-11-05"},{"title":"ContraWiMAE 数据及限制","url":"https://arxiv.org/html/2505.09160v2","type":"原论文","readScope":"全文主文（HTML I–VII、公式、表格、图注及参考文献完整覆盖；图像未逐图目检）","status":"已确认","checkedAt":"2026-11-05","fullMainTextRead":true,"readAudit":{"normalizedCharactersCovered":86680,"contiguousCoverage":true,"checkedAt":"2026-11-05"}},{"title":"WiFo-2 发布范围","url":"https://github.com/PKU-PCNI/WiFo-2","type":"官方资料","readScope":"发布路线图与受限比赛 splits","status":"已确认","checkedAt":"2026-11-05"},{"title":"CFM-Bench 数据暴露规则","url":"https://arxiv.org/html/2607.14975v2","type":"原论文","readScope":"全文主文（HTML I–VIII、公式、表格、图注及参考文献完整覆盖；图像未逐图目检）","status":"已确认","checkedAt":"2026-11-05","fullMainTextRead":true,"readAudit":{"normalizedCharactersCovered":73432,"contiguousCoverage":true,"checkedAt":"2026-11-05"}}],"sourceIds":["source-098","source-101","source-108","source-105","source-109"]},{"title":"前沿问题缺口：多链路时间轴不等于环境 World Model","paragraphs":["多 BS 未来联合状态需要同一时钟下各链路的可见性、干扰、UE/BS 位姿和相位/幅度约定。MOCSID 为多 BS 移动研究提供候选基础，但多个独立轨迹不能直接解释成共享动态遮挡场景。必须确认轨迹是否共同生成、遮挡体是否共享及时间是否真实对齐。","相关遮挡和联合失效概率需要同步链路集合，以及同一物体如何同时改变多条路径的可观测记录。只在静态图上移动多个 UE 可研究几何覆盖相关性，不能据此估计真实车流引发的失效联合分布。最小新仿真应在同一场景放置多个 UE、移动阻挡体，记录物体 ID、路径出生/死亡和时间。","新增的POWDER室外双基地5G ISAC资产提供两个静止UE、一个四端口BS、移动车辆GNSS和无人机视频，是研究共享反射体影响的具体候选。其移动性资产空口SRS为10 ms、实际记录为40 ms；预测跨度必须按记录时间定义。它不自动提供多BS未来波束标签或未测动作的收益，仍需针对任务构造协议。","未测量动作的反事实收益需要已知动作参数和足够完整的响应。全复 CSI 加校准码本可在明确线性、窄带/宽带及噪声假设下计算候选波束收益；仅有最优标签或有限扫描功率不能恢复任意阵列、功率、关联动作的收益。新的测量应记录探测配置、码本、时间和观测缺失机制。","无标签持续学习与站点自更新需要按真实时间到达的数据、漂移事件、更新成本，以及与训练分离的延迟标签。人为打乱城市数据只能构造域适配实验。季节、天气、植被和建筑变化需重复同址测量或经过现场校准的多时期数字孪生，并保留变化前后的几何、材料和设备状态。","联邦共享传播知识的客户端应对应真实站点/硬件/机构边界。随机分片模拟客户端只能测试优化行为；跨站点知识迁移还需客户端间频率、阵列和观测方式差异，以及通信开销、隐私约束和新站点测试。","这些缺口是基于已核实字段的研究设计判断，不是对所有未检索资源作不存在的断言。选型向导在硬条件缺失时返回缺口与最小补采方案，不以无依据的综合分掩盖缺失。"],"sources":[{"title":"MOCSID 数据范围","url":"https://zenodo.org/records/14535165","type":"官方资料","readScope":"Description","status":"已确认","checkedAt":"2026-11-05"},{"title":"CFM-Bench 各域资格与限制","url":"https://arxiv.org/html/2607.14975v2","type":"原论文","readScope":"全文主文（HTML I–VIII、公式、表格、图注及参考文献完整覆盖；图像未逐图目检）","status":"已确认","checkedAt":"2026-11-05","fullMainTextRead":true,"readAudit":{"normalizedCharactersCovered":73432,"contiguousCoverage":true,"checkedAt":"2026-11-05"}},{"title":"ContraWiMAE 扩展边界","url":"https://arxiv.org/html/2505.09160v2","type":"原论文","readScope":"全文主文（HTML I–VII、公式、表格、图注及参考文献完整覆盖；图像未逐图目检）","status":"已确认","checkedAt":"2026-11-05","fullMainTextRead":true,"readAudit":{"normalizedCharactersCovered":86680,"contiguousCoverage":true,"checkedAt":"2026-11-05"}}],"sourceIds":["source-052","source-053","source-054","source-135","source-136","source-137","source-112","source-109","source-108"]}],"tutorials":[{"id":"deepmimo","title":"DeepMIMO：路径 → CSI → 波束选择","file":"tutorials/01_deepmimo.py","status":"文档核验；未运行原始场景","description":"完整步骤与可复制代码；验证状态仅覆盖注明的输入与环境。","environment":"DeepMIMO 4.0.5；Python 3.12；独立环境。先准备合法获取的本地场景。","steps":["加载本地场景并检查路径、单位与版本","显式配置阵列与 OFDM，计算信道","核对复数约定，输出每波束增益与 oracle 标签"],"sourceIds":["source-001","source-002","source-003","source-004"],"code":"\"\"\"DeepMIMO 4.0.5: read one local static link, generate OFDM CSI, score beams.\n\nInstall in your own environment: python -m pip install 'deepmimo==4.0.5'\nExample (the scenario must already be downloaded and extracted):\n  python atlas-deepmimo-tutorial.py /data/deepmimo_scenarios asu_campus_3p5\n\nVerified against the official v4.0.5 source on 2026-11-05:\nhttps://github.com/DeepMIMO/DeepMIMO/blob/v4.0.5/README.md\nhttps://github.com/DeepMIMO/DeepMIMO/blob/v4.0.5/deepmimo/datasets/load.py\nhttps://github.com/DeepMIMO/DeepMIMO/blob/v4.0.5/deepmimo/datasets/dataset.py\nhttps://github.com/DeepMIMO/DeepMIMO/blob/v4.0.5/deepmimo/generator/channel.py\nhttps://github.com/DeepMIMO/DeepMIMO/blob/v4.0.5/deepmimo/generator/geometry.py\n\nThis example reads raw data and keeps derived channels in memory. It does not\ndownload data, train a model, or overwrite the scenario. Its DFT codebook is a\nfar-field ULA example; it is not a near-field focusing codebook.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\nfrom pathlib import Path\n\nimport numpy as np\n\n\ndef dft_codebook(n_tx: int) -> np.ndarray:\n    \"\"\"Return [TX antenna, beam] weights; each column has unit L2 norm.\"\"\"\n    n = np.arange(n_tx)[:, None]\n    b = np.arange(n_tx)[None, :]\n    return np.exp(-2j * np.pi * n * b / n_tx) / np.sqrt(n_tx)\n\n\ndef beam_power(h: np.ndarray, f: np.ndarray) -> np.ndarray:\n    \"\"\"Average selected-subcarrier gain for a single receive antenna.\n\n    h: [UE, RX antenna=1, TX antenna, selected subcarrier]\n    f: [TX antenna, beam]\n    y = H f s + noise, so multiply H by f directly (do not conjugate H).\n    A notation y = h_col^H f s is equivalent when h_col = H_row.conj().\n    Return [UE, beam]. This is power gain, not a calibrated SNR or data rate.\n    \"\"\"\n    if h.ndim != 4 or h.shape[1] != 1 or f.shape[0] != h.shape[2]:\n        raise ValueError(\"Expected H [UE, 1, TX, K] and F [TX, beam].\")\n    if not np.isfinite(h).all():\n        raise ValueError(\"Non-finite channel entries: audit the input paths first.\")\n    np.testing.assert_allclose(np.sum(np.abs(f) ** 2, axis=0), 1.0, atol=1e-7)\n    response = np.einsum(\"utk,tb->ubk\", h[:, 0, :, :], f, optimize=True)\n    return np.mean(np.abs(response) ** 2, axis=-1)\n\n\ndef main() -> None:\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument(\"scenario_root\", type=Path, help=\"Parent of extracted scenario folders\")\n    parser.add_argument(\"scenario\", help=\"Local scenario folder name, e.g. asu_campus_3p5\")\n    parser.add_argument(\"--link\", type=int, default=0, help=\"TX/RX pair index for a MacroDataset\")\n    parser.add_argument(\"--max-users\", type=int, default=128)\n    args = parser.parse_args()\n    if args.max_users \u003c 1 or args.link \u003c 0:\n        parser.error(\"--max-users must be positive and --link must be nonnegative\")\n\n    import deepmimo as dm\n\n    if dm.__version__ != \"4.0.5\":\n        raise RuntimeError(f\"This example targets 4.0.5; installed version is {dm.__version__}.\")\n    root = args.scenario_root.expanduser().resolve()\n    # dm.load lowercases scenario names in v4.0.5. Use the matching local folder.\n    name = args.scenario.lower()\n    if Path(name).name != name or not (root / name).is_dir():\n        raise FileNotFoundError(f\"Extracted local scenario not found: {root / name}\")\n    if not (root / name / \"params.json\").is_file():\n        raise FileNotFoundError(f\"Missing v4 params.json in {root / name}\")\n    dm.config.set(\"scenarios_folder\", str(root))\n    loaded = dm.load(name, max_paths=10)  # Load cap and generation cap are separate.\n    if isinstance(loaded, dm.DynamicDataset):\n        raise ValueError(\"Choose a static scenario for this example; dynamic snapshots need explicit time handling.\")\n    if isinstance(loaded, dm.MacroDataset):\n        dataset = loaded[args.link]  # Select a TX/RX pair, not a UE.\n    else:\n        if args.link != 0:\n            raise ValueError(\"This scenario returned a single Dataset; use --link 0.\")\n        dataset = loaded\n    print(\"Selected TX/RX pair:\", dataset.txrx)\n    n_users = min(args.max_users, int(dataset.n_ue))\n    if n_users == 0:\n        raise ValueError(\"Selected link contains no receiver positions.\")\n    dataset = dataset.trim(idxs=np.arange(n_users))  # New in-memory subset.\n\n    parameters = dm.ChannelParameters(\n        bs_antenna={\"shape\": [32, 1], \"spacing\": 0.5, \"rotation\": [0, 0, 0]},\n        ue_antenna={\"shape\": [1, 1], \"spacing\": 0.5, \"rotation\": [0, 0, 0]},\n        num_paths=10,\n        freq_domain=True,\n        doppler=False,\n        ofdm={\n            \"subcarriers\": 64,\n            \"selected_subcarriers\": np.arange(64),  # Zero-based indices, not Hz.\n            \"bandwidth\": 20e6,  # Hz; antenna spacing above is in wavelengths.\n            \"rx_filter\": False,\n        },\n    )\n    # shape=[My,Mz] lies in the local y-z plane; [32,1] is a y-axis ULA.\n    # No times argument: one t=0 sample, and no extra time axis in the output.\n    h = dataset.compute_channels(parameters)\n    if h.shape != (n_users, 1, 32, 64):\n        raise ValueError(f\"Unexpected channel axes: {h.shape}\")\n    print(\"H axes [UE, RX antenna, TX antenna, selected subcarrier]:\", h.shape)\n    print(\"RX positions [UE, xyz]:\", np.asarray(dataset.rx_pos).shape)\n    print(\"RT parameters (carrier frequency and source engine):\", dataset.rt_params)\n    # The source normalizes frequency-domain path amplitudes by sqrt(N_subcarriers).\n    # Preserve that convention when deriving transmit-power/noise calibration.\n    # Changing OFDM settings does not rerun RT or create a new carrier-frequency dataset.\n    gain = beam_power(h, dft_codebook(h.shape[2]))\n    valid = np.max(gain, axis=1) > 0\n    label = np.full(n_users, -1, dtype=int)  # -1 marks zero-gain / unavailable links.\n    label[valid] = np.argmax(gain[valid], axis=1)\n    print(\"Valid links:\", int(valid.sum()), \"/\", n_users)\n    print(\"First oracle beam labels (zero-based):\", label[:10].tolist())\n    # This oracle maximizes mean beam power. For rate utility, maximize the mean\n    # of log2(1+SINR_k) under an explicit power/noise/overhead model instead.\n    # Split by scene/area before fitting predictors; adjacent-grid random splits leak.\n\n\nif __name__ == \"__main__\":\n    main()\n"},{"id":"sionna","title":"Sionna RT：场景与机制 → CFR","file":"tutorials/02_sionna_rt.py","status":"内置街谷场景本机运行通过","description":"完整步骤与可复制代码；验证状态仅覆盖注明的输入与环境。","environment":"sionna-rt 2.2.0；Mitsuba 3.9.1；Dr.Jit 1.5.0；NumPy 2.2.6；Python 3.12.3；metal_ad_mono_polarized 后端。","steps":["加载随软件提供的几何场景，检查位置与材料","显式关闭未使用机制并固定求解条件","生成不归一化 CFR，检查轴与零路径样本"],"sourceIds":["source-009","source-010","source-011","source-012"],"code":"\"\"\"Sionna RT 2.2.0 documented API; built-in scene smoke-tested on this Mac.\nSeparate environment: Python 3.12; pip install sionna-rt==2.2.0 numpy==2.2.6\nUse only the scene geometry shipped with the package. No original dataset.\nReference: https://nvlabs.github.io/sionna/rt/tutorials/Introduction.html\nRuntime backend support (Mitsuba/Dr.Jit) must be verified before execution.\n\"\"\"\nimport sionna.rt as rt\nimport numpy as np\nimport mitsuba as mi\nprint(\"Mitsuba backend:\", mi.variant())\n\nscene = rt.load_scene(rt.scene.simple_street_canyon, merge_shapes=False)\nscene.frequency = 28e9\nscene.tx_array = rt.PlanarArray(num_rows=1, num_cols=8,\n    vertical_spacing=0.5, horizontal_spacing=0.5,\n    pattern='iso', polarization='V')\nscene.rx_array = rt.PlanarArray(num_rows=1, num_cols=1,\n    vertical_spacing=0.5, horizontal_spacing=0.5,\n    pattern='iso', polarization='V')\n# Inspect material objects instead of silently assigning all surfaces\n# the same material or claiming calibrated material parameters.\nfor name, obj in scene.objects.items():\n    print(name, obj.radio_material)\nscene.add(rt.Transmitter(name='tx', position=[0, 0, 10]))\nscene.add(rt.Receiver(name='rx', position=[20, 0, 1.5]))\nscene.get('tx').look_at(scene.get('rx'))\nsolver = rt.PathSolver(deterministic=True)\npaths = solver(scene=scene, max_depth=2, los=True,\n    specular_reflection=True, diffuse_reflection=False,\n    refraction=False, diffraction=False, edge_diffraction=False,\n    synthetic_array=False, seed=7)\n# No claim that diffraction/scattering is enabled by this configuration.\nf = rt.subcarrier_frequencies(64, 120e3)\nh = paths.cfr(frequencies=f, normalize=False,\n              normalize_delays=False, out_type='numpy')\n# axes: rx, rx_ant, tx, tx_ant, time, subcarrier\nh = np.asarray(h)\nassert h.shape == (1, 1, 1, 8, 1, 64), h.shape\nassert np.isfinite(h).all() and np.any(abs(h) > 0), 'Invalid or empty channel'\nprint('CFR shape:', h.shape, 'mean channel power gain:', float(np.mean(abs(h)**2)))\n# Position validity, path counts and zero-channel cases must be checked.\n# Changing frequency requires recomputing paths/material response; a shared\n# geometric scene alone does not establish a real synchronized band pair.\n"},{"id":"deepsense","title":"DeepSense Scenario 9：CSV 与波束功率","file":"tutorials/03_deepsense.py","status":"人工解析样本测试通过；真实数据未运行","description":"完整步骤与可复制代码；验证状态仅覆盖注明的输入与环境。","environment":"Python 3.12.3；NumPy 2.3.1；CSV 列名必须从实际文件核对。","steps":["从官方入口另行获取数据，本项目不下载","显式传入功率列，检查路径、64维与 NaN","以真实序列标识构造过去输入与未来标签"],"sourceIds":["source-055","source-056","source-057","source-058"],"code":"\"\"\"DeepSense Scenario 9 CSV + 64-beam power parser.\nDocument/source checked; no original dataset downloaded or run locally.\nRun: python3 03_deepsense.py /path/scenario.csv /path/data --column unit1_pwr_60ghz\nCheck the actual CSV header; pass the official column name explicitly.\n\"\"\"\nimport argparse\nimport csv\nfrom pathlib import Path\nimport numpy as np\n\n\ndef load_power(csv_path, root, column):\n    root = Path(root).resolve()\n    with open(csv_path, newline='', encoding='utf-8-sig') as f:\n        rows = list(csv.DictReader(f))\n    if not rows or column not in rows[0]:\n        raise ValueError(f'column missing; available: {list(rows[0]) if rows else []}')\n    power, valid_rows = [], []\n    for i, row in enumerate(rows):\n        relative = Path(row[column])\n        if relative.is_absolute() or '..' in relative.parts:\n            raise ValueError('relative path inside data root required')\n        p = (root / relative).resolve()\n        if not p.is_relative_to(root):\n            raise ValueError('path outside data root')\n        x = np.loadtxt(p).reshape(-1)\n        if x.size != 64:\n            raise ValueError(f'row {i}: expected official 64-beam vector; got {x.size}')\n        if np.all(np.isfinite(x)):\n            power.append(x); valid_rows.append(i)\n    return rows, np.asarray(power), np.asarray(valid_rows)\n\n\nif __name__ == '__main__':\n    p = argparse.ArgumentParser()\n    p.add_argument('csv'); p.add_argument('root'); p.add_argument('--column', required=True)\n    a = p.parse_args()\n    rows, power, valid = load_power(a.csv, a.root, a.column)\n    print({'rows': len(rows), 'valid': len(valid), 'beam_labels_zero_based': power.argmax(axis=1).tolist()[:10]})\n    # Argmax is valid under any monotonic unit conversion. Rate is not:\n    # establish linear power vs dBm and calibration before SE computations.\n    # For a prediction task, create strictly past-input/future-label windows\n    # within official sequence IDs; without sequence IDs, do not claim tracking.\n"},{"id":"pairing","title":"跨频样本：精确匹配与同步性检查","file":"tutorials/04_cross_frequency.py","status":"人工测试样本运行通过","description":"完整步骤与可复制代码；验证状态仅覆盖注明的输入与环境。","environment":"Python 3.12.3；NumPy 2.3.1。示例不包含真实无线数据。","steps":["定义 campaign/site/trajectory/sample 组合键","拒绝重复键，记录缺失配对","独立核验时钟与频率；键相同不是同步性证明"],"sourceIds":[],"code":"\"\"\"Exact manifest pairing, not proof of physical synchronization.\nRun on artificial manifests: python3 04_cross_frequency.py\nReal use: key=(campaign,site,trajectory,synchronized_sample_id), separately\nvalidate clocks, frequency, array frame, bandwidth and calibration.\n\"\"\"\nfrom core import paired_indices\n\nif __name__ == '__main__':\n    low = [('synthetic', 'site_a', 'traj_1', i) for i in range(5)]\n    high = [('synthetic', 'site_a', 'traj_1', i) for i in [1, 3, 4]]\n    print('ARTIFICIAL fixture; no measured CSI:', paired_indices(low, high).tolist())\n    # Repeated trajectories and colocated separate campaigns must keep their\n    # own pairing_type; never relabel either as simultaneous measured data.\n"},{"id":"split","title":"空间、轨迹、站点与引擎隔离","file":"tutorials/05_splits.py","status":"人工分组样本测试通过","description":"完整步骤与可复制代码；验证状态仅覆盖注明的输入与环境。","environment":"Python 3.12.3；NumPy 2.3.1。","steps":["整组拆分，检查交集为空","空间划分另设有物理依据的隔离缓冲","仅训练集拟合归一化；保持测试源独立"],"sourceIds":[],"code":"\"\"\"Group isolation and train-only normalization. Artificial smoke test.\"\"\"\nimport numpy as np\nfrom core import group_split\n\nif __name__ == '__main__':\n    rng = np.random.default_rng(7)\n    groups = np.repeat(np.arange(10), 8)\n    x = rng.normal(size=(80, 4))\n    train, val, test = group_split(groups)\n    assert not set(groups[train]) & set(groups[test])\n    mean, std = x[train].mean(0), x[train].std(0)\n    normalized = (x-mean) / np.maximum(std, 1e-8)\n    print('ARTIFICIAL groups:', [len(z) for z in [train, val, test]])\n    # Spatial split additionally needs a metric distance buffer. Estimate\n    # that buffer from propagation/empirical spatial correlation, not by\n    # silently treating neighboring grid points as independent sites.\n    # Engine OOD requires independently generated source engines, not\n    # converting two files derived from the same paths into different formats.\n"},{"id":"baseline","title":"Oracle、固定波束与位置 kNN","file":"tutorials/06_baselines.py","status":"人工信道样本运行通过","description":"完整步骤与可复制代码；验证状态仅覆盖注明的输入与环境。","environment":"Python 3.12.3；NumPy 2.3.1；单位归一化功率不是实测 dBm。","steps":["先计算 exhaustive oracle 与 train-best-fixed","比较简单位置 kNN 的归一化波束收益","仅噪声与功率尺度已知时报告物理 SE；开销另计"],"sourceIds":[],"code":"\"\"\"Oracle vs best fixed beam and position nearest-neighbor baseline.\nArtificial fixture: validates computation, does not estimate real accuracy.\nRun: python3 06_baselines.py\n\"\"\"\nimport numpy as np\nfrom core import dft_codebook, beam_power, evaluate, group_split\n\nif __name__ == '__main__':\n    rng = np.random.default_rng(7)\n    n = 160\n    position = rng.uniform(-1, 1, (n, 2))\n    h = np.exp(1j*np.pi*position[:, :1]*np.arange(16)[None, :])\n    power = beam_power(h, dft_codebook(16))\n    train, val, test = group_split(np.repeat(np.arange(10), 16))\n    fixed = int(power[train].mean(axis=0).argmax())\n    distance = ((position[test, None]-position[None, train])**2).sum(-1)\n    nn = power[train[distance.argmin(axis=1)]].argmax(axis=1)\n    for name, pred in [('oracle', power[test].argmax(1)),\n                       ('train_best_fixed', np.full(len(test), fixed)), ('position_1NN', nn)]:\n        print('ARTIFICIAL', name, evaluate(power[test], pred))\n    # Add a learned model only after decision headroom is established.\n    # This synthetic signal has no measured hardware, noise or probing cost.\n"},{"id":"sionna-lidar","title":"Sionna同场景：自定义几何扫描点云","file":"tutorials/07_sionna_lidar.py","status":"本机几何与解析量程检查通过","description":"用底层Mitsuba射线求交生成首命中点云；代码区分几何点云与完整LiDAR传感器模型。","environment":"Sionna RT 2.2.0 / Mitsuba 3.9.1 / Dr.Jit 1.5.0，Apple Silicon Metal，4096射线与解析box量程、遮挡和量程截断检查。","steps":["从Sionna场景获取Mitsuba几何，定义扫描位姿与单位方向","保留有效首命中，应用量程和坐标变换","同步到CSI场景时间；根据研究目标另设噪声、漏检与强度模型"],"sourceIds":["source-153","source-154","source-155","source-156","source-157","source-158"],"code":"\"\"\"Geometric scan of a bundled Sionna scene; no physical LiDAR echo model.\n\nTested with sionna-rt==2.2.0, mitsuba==3.9.1, drjit==1.5.0.\nNo dataset download, depth-image conversion, or mesh-surface sampling.\n\"\"\"\nimport json\nfrom importlib.metadata import version\n\nimport numpy as np\nimport mitsuba as mi\n\n# Select the tested backend before importing Sionna.\nmi.set_variant(\"metal_ad_mono_polarized\")\nimport sionna.rt as rt\n\n\ndef geometric_scan(scene, origin_world, directions_world,\n                   min_range_m=0.01, max_range_m=20.0):\n    \"\"\"Return world-space first-hit points and original ray indices.\n\n    The input directions are normalized here, so ray parameter t is distance.\n    Filter invalid/near hits without treating them as real sensor returns.\n    A nearest surface inside min_range is discarded, not made transparent.\n    \"\"\"\n    origin = np.asarray(origin_world, dtype=np.float32)\n    dirs = np.asarray(directions_world, dtype=np.float32)\n    norms = np.linalg.norm(dirs, axis=1, keepdims=True)\n    if origin.shape != (3,) or dirs.ndim != 2 or dirs.shape[1] != 3:\n        raise ValueError(\"Expected origin [3] and directions [N,3]\")\n    if np.any(norms == 0) or not np.isfinite(dirs).all():\n        raise ValueError(\"Directions must be finite and nonzero\")\n    dirs = dirs / norms\n    rays = mi.Ray3f(o=mi.Point3f(*origin.tolist()), d=mi.Vector3f(dirs.T))\n    rays.maxt = max_range_m\n    hit = scene.mi_scene.ray_intersect(rays)\n    valid = np.asarray(hit.is_valid(), dtype=bool)\n    distances = np.asarray(hit.t, dtype=np.float32)\n    xyz_world = np.asarray(hit.p, dtype=np.float32).T\n    valid &= np.isfinite(distances) & (distances >= min_range_m)\n    valid &= distances \u003c= max_range_m\n    return xyz_world[valid], distances[valid], np.flatnonzero(valid), dirs\n\n\ndef main():\n    # The bundled box has bounds [-5,-5,0] to [5,5,5], in scene metres.\n    scene = rt.load_scene(rt.scene.box)\n    origin = np.array([0.0, 0.0, 2.5], dtype=np.float32)\n    az = np.linspace(-np.pi, np.pi, 128, endpoint=False)\n    el = np.deg2rad(np.linspace(-70.0, 70.0, 32))\n    aa, ee = np.meshgrid(az, el, indexing=\"xy\")\n    dirs = np.column_stack((np.cos(ee).ravel()*np.cos(aa).ravel(),\n                            np.cos(ee).ravel()*np.sin(aa).ravel(),\n                            np.sin(ee).ravel())).astype(np.float32)\n    points, ranges, indices, unit_dirs = geometric_scan(scene, origin, dirs)\n\n    # Analytic distance from the centre to an axis-aligned box boundary.\n    with np.errstate(divide=\"ignore\"):\n        expected = np.min(np.array([5., 5., 2.5]) / np.abs(unit_dirs), axis=1)\n    error = float(np.max(np.abs(ranges-expected[indices])))\n    reconstruction_error = float(np.max(np.abs(\n        points - (origin + unit_dirs[indices]*ranges[:, None]))))\n    assert len(points) == len(dirs) == 4096\n    assert error \u003c 1e-4\n    assert np.isfinite(points).all()\n\n    # No surface is within 2 m of the interior scan origin.\n    short_points, _, _, _ = geometric_scan(scene, origin, dirs, max_range_m=2.)\n    assert len(short_points) == 0\n\n    # From outside: +x misses; -x hits the NEAR wall x=5 at 5 m,\n    # not the far wall x=-5 at 15 m. This checks viewpoint occlusion.\n    outside_points, outside_ranges, outside_indices, _ = geometric_scan(\n        scene, [10., 0., 2.5], [[1., 0., 0.], [-1., 0., 0.]])\n    assert outside_indices.tolist() == [1]\n    assert np.allclose(outside_ranges, [5.])\n    assert np.allclose(outside_points, [[5., 0., 2.5]])\n\n    print(json.dumps({\n        \"status\": \"passed\",\n        \"versions\": {k: version(k) for k in [\"sionna-rt\", \"mitsuba\", \"drjit\"]},\n        \"backend\": mi.variant(),\n        \"scene\": \"bundled sionna.rt.scene.box\",\n        \"origin_world_m\": origin.tolist(),\n        \"angular_grid\": {\"azimuth_samples\": 128, \"elevation_samples\": 32,\n                         \"elevation_deg\": [-70,70]},\n        \"rays\": len(dirs), \"valid_points\": len(points),\n        \"point_shape\": list(points.shape),\n        \"range_min_max_m\": [float(ranges.min()), float(ranges.max())],\n        \"analytic_range_max_abs_error_m\": error,\n        \"point_reconstruction_max_abs_error_m\": reconstruction_error,\n        \"max_range_2m_valid_points\": len(short_points),\n        \"outside_ray_indices_with_hit\": outside_indices.tolist(),\n        \"outside_near_wall_range_m\": outside_ranges.tolist(),\n        \"outside_near_wall_xyz_m\": outside_points.tolist(),\n        \"first_three_points_m\": points[:3].tolist(),\n        \"downloaded_raw_data\": False,\n        \"physical_lidar_echo_or_noise_simulated\": False\n    }, indent=2))\n\n\nif __name__ == \"__main__\":\n    main()\n"}],"searchRecords":[{"question":"公开接口与传播/许可范围是否已有明确官方证据？","query":"site.deepmimo.net O1 X3D reflections scattering diffraction scenario","queriedAt":"2026-11-05","method":"官方域限定联网检索；搜索结果用于定位原文，未经原文读取不新增事实"},{"question":"公开接口与传播/许可范围是否已有明确官方证据？","query":"site:nvlabs.github.io/sionna rt 2.2.0 diffraction PathSolver","queriedAt":"2026-11-05","method":"官方域限定联网检索；搜索结果用于定位原文，未经原文读取不新增事实"},{"question":"公开接口与传播/许可范围是否已有明确官方证据？","query":"site:deepsense6g.net \"License\" \"CC\"","queriedAt":"2026-11-05","method":"官方域限定联网检索；搜索结果用于定位原文，未经原文读取不新增事实"},{"question":"公开接口与传播/许可范围是否已有明确官方证据？","query":"site:powderwireless.net/data ISAC 2026 SRS","quer       /* Shared acquisition semantics: a supported capability may need generation. */

}
function missingObservations(resource, needs, readyOnly = false) {

          resource.pairing?.type === "simultaneous_measured" &&

}

}

function isMeasuredSource(resource) {

  );
}

      resource.pairing?.confirmed === true &&
      resource.pairing?.frequenciesGHz?.includes(3.5) &&
      resource.pairing?.frequenciesGHz?.includes(28)
    )
  )
    missing.push({
      key: "exact",
      reason: "没有完整核验的真实同步3.5→28 GHz配对协议。",
    });
  if (goal === "foundation-pretrain" && resource.id === "cfm-bench")
    missing.push({
      key: "protocol",
      reason: "CFM-Bench官方协议禁止将其所有splits用于基础模型预训练。",
    });
  if(goal === "foundation-pretrain" && resource.researchRole === "evaluation_suite")
    missing.push({key:"protocol",reason:"该条目是评估套件；预训练语料需从上游数据单独构建，并隔离评测样本。"});
  return missing;
}
function selectResearchPlan(resources, playbook, constraints = {}) {
  const byId = new Map(resources.map((r) => [r.id, r]));
  const evaluated = (playbook.candidates || []).map((candidate) => {
    const resource = byId.get(candidate.resourceId || candidate.id);
    const effectiveFields = {
      ...resource?.fields,
      ...candidate.fieldOverrides,
    };
    const scopedResource = resource
      ? { ...resource, fields: effectiveFields }
      : null;
    const missing = scopedResource
      ? researchMissing(scopedResource, constraints, playbook.id)
      : [{ key: "resource", reason: "资源记录缺失" }];
    for (const item of missing)
      if (candidate.constraintNotes?.[item.key])
        item.reason = candidate.constraintNotes[item.key];
    return { candidate, resource, effectiveFields, missing };
  });
  const eligible = evaluated.filter((x) => !x.missing.length);
  const primary = eligible.find((x) => x.candidate.canStart !== false) || null;
  const recommended = (
    primary ? [primary, ...eligible.filter((x) => x !== primary)] : eligible
  ).slice(0, 3);
  const knownIds = new Set(evaluated.map((x) => x.resource?.id));
  const others = resources.filter(
    (r) =>
      !knownIds.has(r.id) &&
      !researchMissing(r, constraints, playbook.id).length,
  );
  return {
    goal: playbook.id,
    primary,
    recommended,
    moreEligible: eligible.filter((x) => !recommended.includes(x)),
    excluded: evaluated.filter((x) => x.missing.length),
    others,
    constraints,
  };
}

    isMeasuredSource,
    researchMissing,
    selectResearchPlan,
